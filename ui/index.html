<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0b09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Legion</title>
    <script>
      // Apply the saved appearance before first paint, so a reload never
      // flashes the default theme or the wrong mode. Mirrors applyToDocument
      // in src/appearance/store.ts; the app re-applies (and sanitizes) the
      // choice once it loads.
      try {
        var a = JSON.parse(localStorage.getItem('legion-appearance') || '{}') || {}
        var root = document.documentElement
        if (a.mode === 'dark' || (a.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark')
        var theme = typeof a.theme === 'string' && /^[a-z-]+$/.test(a.theme) ? a.theme : 'command-post'
        if (theme !== 'command-post') root.setAttribute('data-theme', theme)
        var colors = ((a.colors || {})[theme] || {})[root.classList.contains('dark') ? 'dark' : 'light'] || {}
        for (var token in colors) {
          var hex = colors[token]
          if (/^[a-z0-9-]+$/.test(token) && /^#[0-9a-f]{6}$/i.test(hex))
            root.style.setProperty('--c-' + token, [1, 3, 5].map(function (i) { return parseInt(hex.slice(i, i + 2), 16) }).join(' '))
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
