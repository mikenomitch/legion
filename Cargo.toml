[package]
name = "legion"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.4.10", features = ["cargo", "derive"] }
futures = "0.3"
# jsonnet-rs = "0.17.0"
jsonnet-rs = { git = "https://github.com/mikenomitch/rust-jsonnet" }
jsonwebtoken = "9.1.0"
libloading = "0.8.1"
prost = "0.12"
rcgen = { version = "0.11.3", features = ["pem", "x509-parser"] }
rusqlite = { version = "0.30.0", features = [
    "bundled",
    "serde_json",
    "backup",
    "time",
    "array",
    "blob",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.29.10"
time = "0.3.30"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "full"] }
tonic = { version = "0.10", features = ["tls"] }
json-patch = "1.2.0"
rusqlite_migration = "1.0.2"
humantime = "2.1.0"
serde_rusqlite = "0.34.0"
rand = "0.8.5"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }
tracing-futures = "0.2.5"
tracing-appender = "0.2.3"
sha2 = "0.10.8"

[build-dependencies]
tonic-build = "0.8"

# [[bin]] # Bin to run the HelloWorld gRPC server
# name = "legion"
# path = "src/main.rs"

# [[bin]] # Bin to run the HelloWorld gRPC server
# name = "helloworld-server"
# path = "src/server.rs"

