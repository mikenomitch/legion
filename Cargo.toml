[package]
name = "legion"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.1.8", features = ["cargo", "derive"] }
tonic = { version = "0.10", features = ["tls"] }
prost = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "full"] }
jsonnet-rs = "0.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.20"
env_logger = "0.10.0"
libloading = "0.8.1"
sysinfo = "0.29.10"
jsonwebtoken = "9.1.0"
futures = "0.3"
rcgen = { version = "0.11.3", features = ["pem", "x509-parser"] }
chrono = "0.4.31"
# TODO: Remove time dependency
time = "0.3.30"

[build-dependencies]
tonic-build = "0.8"

# [[bin]] # Bin to run the HelloWorld gRPC server
# name = "legion"
# path = "src/main.rs"

# [[bin]] # Bin to run the HelloWorld gRPC server
# name = "helloworld-server"
# path = "src/server.rs"

# [[bin]] # Bin to run the HelloWorld gRPC client
# name = "helloworld-client"
# path = "src/client.rs"
