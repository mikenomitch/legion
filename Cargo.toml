[package]
name = "legion"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.4.10", features = ["cargo", "derive"] }
env_logger = "0.10.0"
futures = "0.3"
jsonnet-rs = "0.17.0"
jsonwebtoken = "9.1.0"
libloading = "0.8.1"
log = "0.4.20"
prost = "0.12"
rcgen = { version = "0.11.3", features = ["pem", "x509-parser"] }
rusqlite = { version = "0.30.0", features = [
    "bundled",
    "serde_json",
    "backup",
    "time",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.29.10"
time = "0.3.30"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "full"] }
tonic = { version = "0.10", features = ["tls"] }
json-patch = "1.2.0"

[build-dependencies]
tonic-build = "0.8"

# [[bin]] # Bin to run the HelloWorld gRPC server
# name = "legion"
# path = "src/main.rs"

# [[bin]] # Bin to run the HelloWorld gRPC server
# name = "helloworld-server"
# path = "src/server.rs"

