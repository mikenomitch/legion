[package]
name = "legion"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.48", features = ["cargo", "derive"] }
futures = "0.3"
# jsonnet-rs = "0.17.0"
jsonnet-rs = { git = "https://github.com/mikenomitch/rust-jsonnet" }
jsonwebtoken = "9.1.0"
libloading = "0.8.1"
prost = "0.13.3"
rcgen = { version = "0.13.1", features = ["pem", "x509-parser"] }
rusqlite = { version = "0.32.1", features = [
    "bundled",
    "serde_json",
    "backup",
    "time",
    "array",
    "blob",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32.0"
time = "0.3.30"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "full"] }
tonic = { version = "0.12.3", features = ["tls"] }
tonic-web = "0.12.3"
tower-http = { version = "0.5.2", features = ["cors"] }
http = "1.3"
json-patch = "3.0.1"
rusqlite_migration = "1.0.2"
humantime = "2.1.0"
serde_rusqlite = "0.36.0"
jsonschema = "0.17.1"
rand = "0.8.5"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }
tracing-futures = "0.2.5"
tracing-appender = "0.2.3"
sha2 = "0.10.8"
tabled = "0.16.0"
lazy_static = "1.4.0"
anyhow = "1.0.100"
regex = "1.11.1"
semver = "1.0.25"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5.4"
tempfile = "3"

[dev-dependencies]
criterion = "0.5.1"

[build-dependencies]
tonic-build = "0.12.3"

# [[bin]] # Bin to run the HelloWorld gRPC server
# name = "legion"
# path = "src/main.rs"

# [[bin]] # Bin to run the HelloWorld gRPC server
# name = "helloworld-server"
# path = "src/server.rs"

# [[bin]] # Bin to run the HelloWorld gRPC client
# name = "helloworld-client"
# path = "src/client.rs"
