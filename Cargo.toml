[package]
# "legion" on crates.io is an unrelated ECS crate. The [lib] and [[bin]]
# targets below keep the library and the CLI named `legion`.
name = "legion-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A workload orchestrator that is quick to start and scales to thousands of nodes"
repository = "https://github.com/mikenomitch/legion"
readme = "README.md"
keywords = ["orchestrator", "scheduler", "cluster", "containers", "raft"]
categories = ["command-line-utilities", "virtualization"]
# Publish only what `cargo install` needs to build the binary. Docs, the UI,
# benchmarks, and the example plugins stay in the repo.
include = [
    "/src/**",
    "/proto/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The workspace is this crate plus `guest/`, the in-guest agent that ships as
# its own static binary (docs/task-runtime-sandbox.md, "The guest agent"),
# and the scaling-plugin SDK (`legion-scaling-plugin`,
# docs/autoscaling-plugins.md), so `cargo test --all` builds and tests it.
# The example plugins under `plugins/` are separate crates built by build.rs
# with their own lockfiles, so they stay out of it.
[workspace]
# Not ".": the root package is a member of its own workspace anyway, and
# listing it makes every path under the root an explicit member, which
# overrides `exclude` and breaks every plugin build.
members = ["guest", "examples/scaling-plugins/rust"]
exclude = ["plugins"]

[dependencies]
# The guest agent, resume handler, and identity disk format, shared with the
# static `legion-guest` binary built from the same crate.
legion-guest = { path = "guest", version = "0.1.0" }
clap = { version = "4.5.48", features = ["cargo", "derive"] }
futures = "0.3"
# Persistent (HAMT) maps for the scheduler's read model: a plan's capacity
# snapshot is an O(1) clone instead of a per-node copy that grew with the
# fleet (internal_docs/plans/plan-path-fleet-scaling-plan.md § 6.1).
imbl = "7.0.2"
# Nickel is Legion's configuration language: job specs, manager/worker
# configs, and ACL policies are all `.ncl` files evaluated to JSON. Default
# features (repl, markdown, doc, format) pull in rustyline/topiary/tree-sitter
# and are not used by the embedded evaluator.
nickel-lang-core = { version = "0.18.0", default-features = false }
jsonwebtoken = "9.1.0"
libloading = "0.8.1"
prost = "0.13.3"
rcgen = { version = "0.13.1", features = ["pem", "x509-parser"] }
rusqlite = { version = "0.32.1", features = [
    "bundled",
    "serde_json",
    "backup",
    "time",
    "array",
    "blob",
    # Raft persistence replicates write effects as SQLite session changesets
    # (capture on the leader, apply on quorum commit) — see docs/multi-raft.md.
    "session",
] }
serde = { version = "1.0", features = ["derive"] }
# Trait needed to iterate rusqlite session changesets (ChangesetIter) when
# projecting read-model/event side effects from replicated row changes.
# Already in the tree as rusqlite's own dependency; same version.
fallible-streaming-iterator = "0.1.9"
serde_json = "1.0"
schemars = { version = "0.8.22", features = ["derive"] }
sysinfo = "0.32.0"
time = "0.3.30"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "full"] }
tokio-stream = "0.1"
tonic = { version = "0.12.3", features = ["tls"] }
# The datapath's TLS: originating TLS to external upstreams and terminating
# it on ingress (docs/network-handlers.md). Same rustls + ring the tonic
# `tls` feature already pulls in, pinned to `ring` so no second crypto
# provider enters the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
webpki-roots = "1"
# Reads the SANs off a verified mesh peer certificate (docs/network-handlers.md).
x509-parser = "0.16"
# DNS messages for the per-allocation resolvers (src/worker/netd/dns.rs):
# parsing and building only; the resolvers forward to the host's own.
hickory-proto = { version = "0.25.2", default-features = false, features = ["std"] }
tonic-web = "0.12.3"
tower-http = { version = "0.5.2", features = ["cors"] }
tower = "0.4"
http = "1.3"
http-body-util = "0.1"
bytes = "1"
json-patch = "3.0.1"
rusqlite_migration = "1.0.2"
humantime = "2.1.0"
serde_rusqlite = "0.36.0"
jsonschema = "0.17.1"
# Did-you-mean suggestions for unknown jobspec fields (src/structs/spec_fields.rs).
# Already in the tree through clap and nickel; same version.
strsim = "0.11.1"
rand = "0.8.5"
argon2 = "0.5.3"
base64 = "0.22"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }
tracing-futures = "0.2.5"
tracing-appender = "0.2.3"
# OpenTelemetry trace export for Legion's own spans (OTLP/HTTP, opt-in via env).
# HTTP exporter avoids a second tonic/prost version in the dependency tree.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry-proto = { version = "0.27", default-features = false, features = ["gen-tonic-messages", "metrics"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = "0.28"
sha2 = "0.10.8"
# KV encryption at rest (docs/kv-encryption.md): AES-256-GCM for values and
# for wrapping data keys, HKDF for the raft-join root key bundle. `ring` is
# already in the tree via jsonwebtoken/rustls/rcgen — no new crate.
ring = "0.17"
# Network plugins (docs/network-plugins.md): an interpreter keeps the
# shipping binary small; fuel bounds every callback.
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "stable", "validate", "auto-dispatch", "wat"] }
# Only to name `LimiterError` in the plugin memory cap; wasmi does not
# re-export it.
wasmi_core = { version = "=2.0.0", default-features = false, features = ["std"] }
# Key material is wiped from memory when dropped.
zeroize = "1"
tabled = "0.16.0"
lazy_static = "1.4.0"
anyhow = "1.0.100"
async-trait = "0.1"
regex = "1.11.1"
semver = "1.0.25"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
cron = "0.15.0"
# IANA time zones for autoscaling schedules (`schedule = [{ cron, timezone }]`,
# src/autoscaler/schedule.rs), so a business-hours floor follows DST. The
# zone table is pre-generated (phf only): no build script, no new C code.
chrono-tz = "0.10.4"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5.4"
tempfile = "3"
libc = "0.2"
object_store = { version = "0.11.2", features = ["aws"] }
tar = "0.4"
flate2 = "1.0"
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls"] }
# Raft consensus engine for the replicated state store. `serde` puts the
# protocol/log types on the wire (serde_json — no bincode; the payloads are
# dominated by the changeset bytes either way and json avoids a new dep);
# `storage-v2` selects the RaftLogStorage/RaftStateMachine split the log
# store and state machine implement.
# >= 0.9.23 is required for snapshots (phase A-3): it fixes the leader-side
# `Inflight::Snapshot` ack panic when a fresher snapshot is built while an
# install-snapshot replication to a lagging follower is inflight, and bounds
# snapshot chunk retries.
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }
rustyriver = "0.1.0"
# Exec/PTY: cross-platform pty (openpty + ConPTY) for interactive exec.
portable-pty = "0.8.1"
# Browser exec transport: a dedicated WebSocket listener (tonic's gRPC server
# does not enable HTTP upgrades, so exec-over-WS needs its own hyper listener).
tokio-tungstenite = "0.24"
hyper-tungstenite = "0.15"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
# CLI interactive terminal: raw mode + window size for `legion exec -it`.
crossterm = "0.28"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.1"
# The kernel classifier's loader (src/worker/netd/kernel): pure Rust over
# the bpf syscall, no libbpf. The programs themselves are a checked-in
# object (bpf/legion_net.bpf.o).
aya = "0.14.0"

[dev-dependencies]
criterion = "0.5.1"

[build-dependencies]
tonic-build = "0.12.3"

# Benchmarks all live under `benchmarks/` — the Criterion targets below in
# `benchmarks/micro/`, alongside the scenario-driven scheduler harness
# (`benchmarks/scheduler/`) and the AWS comparison rig (`benchmarks/aws/`).
# That is why each target names its `path` instead of relying on Cargo's
# default `benches/` discovery. See `benchmarks/README.md`.
[[bench]]
name = "scheduler_bench"
path = "benchmarks/micro/scheduler_bench.rs"
harness = false

[[bench]]
name = "eval_critical_path_bench"
path = "benchmarks/micro/eval_critical_path_bench.rs"
harness = false

[[bench]]
name = "net_bench"
path = "benchmarks/micro/net_bench.rs"
harness = false

[[bench]]
name = "scaling_rollup_bench"
path = "benchmarks/micro/scaling_rollup_bench.rs"
harness = false

# The AWS rig's native job submitter. Not part of the product: it exists
# because the rig's per-job `legion job run` process spawn ceilinged at ~36-103
# jobs/sec and was being reported as Legion's throughput. It links against this
# crate's own generated client so the proto has exactly one source of truth.
#
# Behind a feature so an ordinary `cargo build` does not link a second copy of
# the binary for a tool nobody but the rig runs. CI lints it via
# `--all-features`; `benchmarks/aws/scripts/local-smoke.sh` and
# `build-and-upload.sh` build it explicitly.
[lib]
name = "legion"
# The library has no doc tests. Leaving the pass on still runs rustdoc over the
# whole crate on every `cargo test` to find none. Set this back to `true` when
# the first runnable example lands in a doc comment.
doctest = false

[[bin]]
name = "legion"
path = "src/main.rs"
# `src/main.rs` only dispatches into the library and has no tests of its own;
# without this, `cargo test` links a second full copy of the binary to run
# zero tests. Integration tests still get `CARGO_BIN_EXE_legion`.
test = false

[[bin]]
name = "legion-loadgen"
path = "benchmarks/loadgen/main.rs"
required-features = ["loadgen"]

[features]
# Builds the `legion-loadgen` bin above. No effect on the `legion` binary.
loadgen = []

# Local and test builds. At full debuginfo every test binary carries DWARF for
# all ~520 crates in the tree, and the target dir grows by gigabytes per
# binary. Line tables keep file:line in panic backtraces for Legion's own
# code; dependencies get none. To step through with variables in a debugger,
# build with `CARGO_PROFILE_DEV_DEBUG=2`. The test profile inherits all of
# this from dev.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The bundled SQLite is C code that every store-backed test runs through:
# each one opens a fresh store and applies every migration. At -O0 that
# setup dominated the unit-test suite; optimizing this one crate cuts about a
# quarter of the suite's CPU time, for one slower compile of a single C file.
# Optimizing every dependency bought ~10% more and doubled the clean
# dependency build, so the rest stay at -O0.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Workers hash their own executable at startup for their build id
# (docs/apps.md, "Upgrades"). A debug binary is ~400 MB, which SHA-256 at
# -O0 takes tens of seconds over; optimized, well under one.
[profile.dev.package.sha2]
opt-level = 3

# Profile for shipped binaries: `cargo build --profile dist`.
#
# Legion is distributed as one binary that is manager, worker, CLI, and MCP
# server, and it is expected to land on small and edge machines, so binary size
# is a feature. The stock `--release` profile leaves ~18 MB on the table:
#
#   --release            43.7 MB
#   --profile dist       26.0 MB   (-41%)
#
# Roughly half of that is `strip` dropping the symbol tables (__LINKEDIT: 8.9 MB
# -> 0.3 MB); the other half is fat LTO collapsing dead code and cross-crate
# duplication across the ~520-crate tree (__TEXT: 33.5 MB -> 24.8 MB).
#
# The cost is build time — fat LTO with a single codegen unit cannot parallelize
# the final link, taking several minutes against about one for `--release`. That
# is why this is a separate profile: `--release` stays fast for local work, and
# only release artifacts pay for the smaller binary. Debug builds are unaffected.
# Same optimizations as `dist` minus the parts that dominate LINK time:
# `fat` LTO with one codegen unit takes ~25 minutes on the benchmark
# operator box, which is longer than some measurement windows allow. Thin
# LTO across 16 units builds in roughly a third of that and is within a
# few percent at runtime. Use it when the alternative is no measurement at
# all -- and say so, because it is NOT the shipping binary and a cell
# built this way is not directly comparable to a `dist` cell.
[profile.distfast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.dist]
inherits = "release"
# Collapse dead code and duplicated generics across every crate in the tree.
lto = "fat"
# One codegen unit per crate graph: less parallelism, more inlining, smaller code.
codegen-units = 1
# Drop symbol tables. Backtraces lose function names; keep the unstripped
# artifact if you need to symbolize a crash from a shipped build.
strip = "symbols"

