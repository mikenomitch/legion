[package]
name = "legion-manager"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Legion's manager: the gRPC server, scheduler, eval loop, and replicated state store"
repository = "https://github.com/mikenomitch/legion"

[lib]
