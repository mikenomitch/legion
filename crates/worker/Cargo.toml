[package]
name = "legion-worker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Legion's worker: the node agent, task runtimes, artifacts, and the network datapath"
repository = "https://github.com/mikenomitch/legion"

[lib]
