[package]
name = "legion-common"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Legion's shared layer: the domain types and jobspec, the config language, autoscaling policy, cluster TLS, and the metrics registry"
repository = "https://github.com/mikenomitch/legion"

[lib]
# No doc tests: running rustdoc over the crate on every `cargo test` finds
# none.
doctest = false

