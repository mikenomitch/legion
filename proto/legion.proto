syntax = "proto3";
package legion;

// Legion gRPC API.
//
// Conventions used throughout this file:
// - `*_json` and many string fields contain JSON payloads serialized as strings.
// - Timestamps are generally RFC3339 strings unless a field explicitly says Unix timestamp.
// - Optional fields are omitted when not provided by the client/server.

// === MANAGER ===

// Manager is the primary control-plane API.
//
// It is used by:
// - Workers for registration, heartbeats, and health updates.
// - CLI/UI clients for job, rollout, node, ledger, and KV operations.
service Manager {
  // Fetches effective worker-type configuration before a worker registers.
  //
  // This is the first manager call in the worker join flow.
  rpc WorkerPreRegister (WorkerPreRegisterRequest)
    returns (WorkerPreRegisterReply);

  // Registers or upserts a worker node in manager state.
  //
  // A worker should call this after pre-registration and after local fingerprinting.
  rpc WorkerRegister (WorkerRegisterRequest) returns (WorkerRegisterReply);

  // Submits or updates a job from a fully rendered jobspec.
  //
  // Depending on current state, this may create a new job config, create a rollout,
  // and enqueue reconciliation work.
  rpc RunJob (RunJobRequest) returns (RunJobReply);

  // Returns the submitted source files (submissions) associated with the latest job config.
  rpc GetJobSpec (GetJobSpecRequest) returns (GetJobSpecReply);

  // Returns submissions for a specific job config ID.
  rpc GetJobSpecByConfig (GetJobSpecByConfigRequest) returns (GetJobSpecReply);

  // Lists known job spec versions for one job.
  rpc ListJobSpecHistory (ListJobSpecHistoryRequest) returns (ListJobSpecHistoryReply);

  // Returns metadata for one job (status, creation time, etc).
  rpc GetJobInfo (GetJobInfoRequest) returns (GetJobInfoReply);

  // Lists rollouts, optionally filtered by job and active status.
  rpc ListRollouts (ListRolloutsRequest) returns (ListRolloutsReply);

  // Returns one rollout by numeric rollout ID.
  rpc GetRollout (GetRolloutRequest) returns (GetRolloutReply);

  // Returns rollout plus per-group runtime status and allocation health snapshots.
  rpc GetRolloutStatus (GetRolloutStatusRequest) returns (GetRolloutStatusReply);

  // Returns ordered rollout event history for a rollout.
  rpc ListRolloutEvents (ListRolloutEventsRequest) returns (ListRolloutEventsReply);

  // Manually advances a rollout (all groups or selected groups).
  rpc AdvanceRollout (AdvanceRolloutRequest) returns (AdvanceRolloutReply);

  // Stops an in-flight rollout and optionally reverts to the previous config.
  rpc StopRollout (StopRolloutRequest) returns (StopRolloutReply);

  // Computes a placement plan for a jobspec without mutating cluster state.
  rpc PlanJob (PlanJobRequest) returns (PlanJobReply);

  // Marks a job as stopped and enqueues stop reconciliation.
  rpc StopJob (StopJobRequest) returns (StopJobReply);

  // Permanently removes a stopped job and related records.
  rpc DestroyJob (DestroyJobRequest) returns (DestroyJobReply);

  // Lists jobs known by the manager.
  rpc ListJobs (ListJobsRequest) returns (ListJobsReply);

  // Creates a keyed-mode stateful instance for a job's keyed task and
  // enqueues placement.
  //
  // Keyed instances (see docs/stateful-workloads.md) are the sandbox/dispatch
  // primitive: each instance is a long-lived logical entity with a unique,
  // **never-recycled** id that persists across allocations. Unlike slot mode,
  // Keyed tasks cannot define `count` (rejected at job parse time) — the
  // number of live instances
  // created through this RPC is the task's desired allocation count (zero
  // instances = zero allocations).
  //
  // Id assignment: the target task's `stateful.idSource` declares the default
  // source. With `idSource: "caller"` the request must supply `instance_id`;
  // with `idSource: "uuid"` (or unset) the server mints an id when
  // `instance_id` is absent. A caller-supplied `instance_id` is always
  // accepted when valid, regardless of `idSource` — the setting picks the
  // default, it does not forbid explicit keys.
  //
  // Errors:
  // - NotFound: the job does not exist.
  // - InvalidArgument: no keyed task matches `group`/`task`, the match is
  //   ambiguous, the id has an invalid charset (must match
  //   `[A-Za-z0-9._-]{1,128}`), or `idSource: "caller"` and no id was given.
  // - AlreadyExists: the id collides with ANY existing instance row of the
  //   job — including Stopped instances and Terminated tombstones — or
  //   structurally aliases the reserved slot-id pattern
  //   `{job}-{group}-{slot}` of a slot-mode stateful task in the same job
  //   (the slot and keyed id spaces are kept disjoint so a keyed id can never
  //   adopt, or be adopted by, a slot placement). A stopped instance still
  //   owns its id, and a destroyed id can never be created again for the
  //   lifetime of the job (the never-recycle guarantee; destroying the whole
  //   job clears its instance history — see DestroyJob).
  rpc CreateInstance (CreateInstanceRequest) returns (CreateInstanceReply);

  // Creates several keyed-mode stateful instances in one atomic call and
  // enqueues a single placement evaluation for the batch.
  //
  // The request may carry explicit `instance_ids`, a `count` of server-minted
  // ids, or both; the call creates every explicit id PLUS `count` freshly
  // minted ids. Creation is ALL-OR-NOTHING inside one storage transaction:
  // if any explicit id is invalid or collides with ANY existing instance row
  // (live, Stopped, or a Terminated tombstone — ids are never recycled), the
  // whole call fails and NO instance is created. The reply lists every id
  // that was created, in request order (explicit ids first, then minted ids).
  //
  // Task resolution (`group`/`task`) follows the same disambiguation rules as
  // `CreateInstance`: filters may be omitted when the job has exactly one
  // keyed task; ambiguity is rejected, never guessed.
  //
  // Interaction with `stateful.idSource`:
  // - `idSource: "caller"` requires every id to be caller-supplied, so
  //   `count > 0` (server minting) contradicts the policy and is rejected
  //   with InvalidArgument.
  // - `idSource: "uuid"` (or unset) accepts any mix of explicit ids and
  //   minted ids.
  //
  // Errors:
  // - NotFound: the job does not exist.
  // - FailedPrecondition: the job is stopped (run it before creating
  //   instances).
  // - InvalidArgument: no keyed task matches `group`/`task` or the match is
  //   ambiguous; `instance_ids` is empty AND `count` is 0 (nothing to
  //   create); an id has an invalid charset (must match
  //   `[A-Za-z0-9._-]{1,128}`, the offending id is named); or the task
  //   declares `idSource: "caller"` and `count > 0`.
  // - AlreadyExists: an id (named in the message) collides with an existing
  //   instance row — including duplicates within the request itself, Stopped
  //   instances, and Terminated tombstones. Nothing is created.
  rpc CreateInstances (CreateInstancesRequest) returns (CreateInstancesReply);

  // Destroys a keyed-mode instance: stops its current allocation, drops its
  // storage handle, and marks the instance Terminated.
  //
  // The instance row is retained as a tombstone so its id can never be
  // re-created — and its workload identity `sub` never re-minted for a
  // different workload — for the lifetime of the job (the never-recycle
  // guarantee). Destroying the whole job (DestroyJob) cascades and clears its
  // instance history, after which the id is free again; a live job never
  // recycles a destroyed id. The storage handle is always dropped on destroy
  // — a destroyed sandbox's state must not be reattachable. (This is
  // intentionally stricter than slot-mode scale-in, which retains storage by
  // default for a later scale-out.)
  //
  // Destroying an already-Terminated instance succeeds as a no-op, so the
  // call is safe to retry even without an idempotency key.
  //
  // Destroy also applies to Stopped instances: the row transitions
  // stopped -> terminated and its retained storage handle is dropped.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: the instance is slot-mode (slot lifecycles are owned
  //   by the scheduler via `count.num`, not this API).
  rpc DestroyInstance (DestroyInstanceRequest) returns (DestroyInstanceReply);

  // Stops (pauses) a keyed-mode instance WITHOUT tombstoning it.
  //
  // The instance's current allocation is stopped through the normal
  // allocation-stop path (the hosting worker stops the task on its next
  // heartbeat reconcile), and the instance transitions to `stopped`. Unlike
  // `DestroyInstance` this is fully reversible:
  // - the row is RETAINED and the id stays owned — `CreateInstance` with the
  //   same id still fails with AlreadyExists (stopped is not destroyed);
  // - the storage handle is RETAINED, so a later `StartInstance` revives the
  //   instance with its persisted state;
  // - `StartInstance` moves it back to `pending` and re-places it.
  //
  // While stopped, the instance is NOT part of the keyed task's desired
  // allocation count: the scheduler plans no allocation for it, and job
  // resubmits / config updates / reschedules will not resurrect it. Only an
  // explicit `StartInstance` does.
  //
  // Stopping an already-stopped instance succeeds as a no-op, so the call is
  // safe to retry even without an idempotency key.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: the instance is slot-mode (slot lifecycles are owned
  //   by the scheduler via `count.num`; stop the job or scale in instead).
  // - FailedPrecondition: the instance is Terminated. Destroyed instances
  //   are tombstoned forever (never-recycle) and can never be stopped,
  //   started, or re-created.
  rpc StopInstance (StopInstanceRequest) returns (StopInstanceReply);

  // Starts (resumes) a stopped keyed-mode instance.
  //
  // The instance transitions `stopped -> pending` and a placement evaluation
  // is enqueued (exactly like `CreateInstance` does), so the scheduler
  // places a new allocation bound to the same instance id and its RETAINED
  // storage handle — the revived workload is *the same* logical instance.
  //
  // Starting an instance that is already live (pending, active, or
  // rescheduling) succeeds as a no-op, so the call is safe to retry even
  // without an idempotency key.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: the instance is slot-mode (slot lifecycles are owned
  //   by the scheduler via `count.num`, not this API).
  // - FailedPrecondition: the instance is Terminated (destroyed ids are
  //   tombstoned forever — create a NEW id instead), or the owning job is
  //   stopped (run the job first; a stopped job schedules nothing).
  rpc StartInstance (StartInstanceRequest) returns (StartInstanceReply);

  // Operator override for the node-loss confirmation gate (the K8s analog is
  // force-deleting a pod stuck on a lost node): immediately frees a stateful
  // instance's allocation on a LOST node for replacement, without waiting for
  // `stateful.onLost.replaceAfter` to elapse (and despite `replaceAfter:
  // "never"`). See docs/stateful-workloads.md "Node loss and fencing".
  //
  // The gated allocation row is removed (the instance transitions to
  // `rescheduling`, keeping its id and storage handle) and a reschedule
  // evaluation is enqueued that excludes the lost node, so the replacement
  // re-binds the same instance elsewhere.
  //
  // DANGER: this asserts the lost node's workload is dead. If the node is
  // merely partitioned and its worker has not yet self-fenced
  // (`onLost.selfTerminateAfter`), forcing a replacement can run the
  // instance twice (split-brain on its storage handle and workload-identity
  // subject). Only force when the node is confirmed dead/isolated.
  //
  // Works for slot and keyed instances alike.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - FailedPrecondition: the instance has no current allocation, or its
  //   allocation's node is not `lost` (the gate only ever holds allocations
  //   on lost nodes; everything else reschedules through the normal paths).
  rpc ReplaceInstance (ReplaceInstanceRequest) returns (ReplaceInstanceReply);

  // Lists stateful instances (slot and keyed) for a job, optionally filtered
  // by group. Includes Terminated rows (slot rows retained for scale-out
  // re-materialization; keyed rows retained forever as never-recycle
  // tombstones).
  rpc ListInstances (ListInstancesRequest) returns (ListInstancesReply);

  // Returns one stateful instance by id.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  rpc GetInstance (GetInstanceRequest) returns (GetInstanceReply);

  // Issues a short-lived, asymmetrically-signed OIDC workload-identity token
  // for one named identity declared on the task of a placed allocation
  // (see docs/workload-identity.md).
  //
  // Called by the worker that hosts the allocation — never by the task
  // itself — at task launch and again before each token expiry (the refresh
  // loop). The manager derives **all** claims server-side from the
  // scheduling record (region, job, group, task, node, alloc, and the stable
  // instance/slot for stateful tasks) and applies the audience, TTL, subject
  // template, and extra claims of the *named identity in the stored task
  // spec*. Nothing security-relevant is read from the request, so a
  // compromised worker can only obtain tokens for allocations placed on it,
  // scoped to audiences the spec already declared.
  //
  // Authorization: the caller must present the per-node worker token minted
  // at WorkerRegister (attached to every worker-plane RPC), whose principal
  // is `node:<node_id>`. The manager requires that principal to match the
  // request's `node_id`, which in turn must be the node the allocation is
  // placed on — so a worker can only obtain tokens for allocations on its own
  // node, and cannot forge a peer's node id to steal that peer's federation
  // credentials. Management tokens (and ACL-disabled deployments) are exempt.
  //
  // Errors:
  // - FailedPrecondition: workload identity is not enabled on this manager
  //   (`workloadIdentity.enabled: false`, the default).
  // - NotFound: no allocation with `alloc_id` exists, or the allocation's
  //   task does not declare an identity named `identity_name`.
  // - PermissionDenied: the allocation exists but is not placed on
  //   `node_id` (a worker may only request tokens for its own allocations).
  // - Internal: signing failed.
  rpc IssueWorkloadIdentityToken (IssueWorkloadIdentityTokenRequest)
      returns (IssueWorkloadIdentityTokenReply);

  // Issues a short-lived, asymmetrically-signed OIDC token for a *node*
  // identity — the cluster-grain credential declared under
  // `workloadIdentity.nodeIdentities` (see docs/workload-identity.md). Unlike
  // a task identity it is scoped to the worker node, not an allocation: its
  // claims are `region`, `pool`, and `node` (audit-only), with
  // `legion.io/scope = "node"` so relying parties can tell node tokens from
  // task tokens issued by the same cluster. Used by the worker to authenticate
  // cluster-level artifact fetches (`auth.nodeIdentity`) and, later, pre-warm.
  //
  // Called by the worker for its own node. Authorization is identical to
  // IssueWorkloadIdentityToken: the caller's authenticated per-node worker
  // token principal (`node:<node_id>`) must match the request's `node_id`, so
  // a worker cannot mint another node's credential. All claims are derived
  // server-side from the node's registration record and the named identity's
  // config — never from the request.
  //
  // Errors:
  // - FailedPrecondition: workload identity is not enabled on this manager.
  // - NotFound: no node with `node_id` is registered, or no node identity
  //   named `identity_name` is configured.
  // - PermissionDenied: `node_id` does not match the caller's credential.
  // - Internal: signing failed.
  rpc IssueNodeIdentityToken (IssueNodeIdentityTokenRequest)
      returns (IssueNodeIdentityTokenReply);

  // Worker heartbeat endpoint.
  //
  // Workers send runtime state, failures, and allocation health snapshots.
  // The manager returns the desired allocations for that worker node.
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);

  // Worker node health-check endpoint.
  //
  // Workers report node-level and plugin readiness checks.
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckReply);

  // Lists all nodes known by the manager.
  rpc GetNodes (GetNodesRequest) returns (GetNodesReply);

  // Returns one node by ID.
  rpc GetNode (GetNodeRequest) returns (GetNodeReply);

  // Proxies a restart request to a worker node.
  rpc RestartWorker (RestartWorkerRequest) returns (RestartWorkerReply);

  // Retrieves captured task stdout/stderr for a job's allocations.
  //
  // The manager locates the node hosting each allocation and proxies the read
  // to that worker's `Worker.GetTaskLogs` RPC.
  rpc GetAllocationLogs (GetAllocationLogsRequest)
    returns (GetAllocationLogsReply);

  // Opens an interactive or one-shot exec session inside a running
  // allocation, streaming stdin/stdout/stderr/resize frames both ways. The
  // manager authorizes the request, resolves the allocation to its node, and
  // proxies the stream to that worker's `Worker.ExecTask`.
  //
  // The first client frame must be an `ExecStart`. Raw commands require
  // `exec:write` (with `host: true` for host-level kinds); action runs
  // require `action:write` (or `exec:write`) and are rendered server-side
  // from the stored job spec.
  rpc ExecAllocation (stream ExecClientFrame) returns (stream ExecServerFrame);

  // Lists the actions declared on a job's tasks (for CLI + UI discovery).
  rpc ListJobActions (ListJobActionsRequest) returns (ListJobActionsReply);

  // Returns node + allocation view of cluster state (the "ledger").
  rpc GetLedger (GetLedgerRequest) returns (GetLedgerReply);

  // Returns config snapshots stored by manager instances.
  rpc GetManagerConfigs (GetManagerConfigsRequest)
    returns (GetManagerConfigsReply);

  // Returns observability status and recent manager-side logs/traces.
  rpc GetObservability (GetObservabilityRequest)
    returns (GetObservabilityReply);

  // Returns the local manager's Raft control-plane status.
  //
  // This endpoint is available even before full Raft state replication is enabled,
  // and is intended for election/failover visibility and operator workflows.
  rpc GetRaftStatus (GetRaftStatusRequest) returns (GetRaftStatusReply);

  // Lists recent Raft control-plane events for this manager.
  //
  // Events include elections, leader transfers, membership updates, and token issuance.
  rpc ListRaftHistory (ListRaftHistoryRequest) returns (ListRaftHistoryReply);

  // Applies an operator-triggered Raft control command on this manager.
  //
  // Typical commands include election triggers, leader transfer, and membership changes.
  rpc IssueRaftCommand (IssueRaftCommandRequest) returns (IssueRaftCommandReply);

  // Issues a short-lived join token that can be used by a manager to join a Raft cluster.
  rpc GetRaftJoinToken (GetRaftJoinTokenRequest) returns (GetRaftJoinTokenReply);

  // Applies dynamic attribute updates to a node and triggers affected evaluations.
  rpc UpdateNodeDynamic (UpdateNodeDynamicRequest)
    returns (UpdateNodeDynamicReply);

  // Creates or updates a KV entry.
  //
  // Jobs that reference the key (legacy `$key` jobspec references or
  // watched task kv injections) are reconciled: their configs are
  // re-rendered from the new value and the per-reference `onChange` policy
  // (none/restart/rollout/fail) is applied. Rapid writes are coalesced per
  // the manager's `kvDebounceMs` window (default 500ms; with a non-zero
  // window reconciliation errors are logged on the manager instead of
  // failing this RPC). See docs/kv-store.md "Reactive updates".
  rpc PutKv (PutKvRequest) returns (PutKvReply);

  // Gets one KV entry by key.
  rpc GetKv (GetKvRequest) returns (GetKvReply);

  // Lists KV entries by prefix.
  rpc ListKv (ListKvRequest) returns (ListKvReply);

  // Deletes one KV entry by key.
  //
  // Deletion is a first-class reconciliation event: jobs watching the key
  // resolve their per-reference `onDelete` policy (default `fail`, which
  // marks the job and its allocations failed with reason
  // `missing_kv_dependency`; a later PutKv to the key recovers the job via
  // `onChange`). Legacy `$key` references treat deletion as `fail`. Events
  // are debounced like PutKv. See docs/kv-store.md "Reactive updates".
  rpc DeleteKv (DeleteKvRequest) returns (DeleteKvReply);

  // Applies an RFC6902 JSON patch to a JSON-typed KV entry.
  //
  // Triggers the same KV-change reconciliation (and debouncing) as PutKv.
  rpc PatchKv (PatchKvRequest) returns (PatchKvReply);

  // Acquires (or force-acquires) a lock for a KV key.
  rpc AcquireKvLock (AcquireKvLockRequest) returns (AcquireKvLockReply);

  // Renews an existing KV lock lease.
  rpc RenewKvLock (RenewKvLockRequest) returns (RenewKvLockReply);

  // Releases an existing KV lock.
  rpc ReleaseKvLock (ReleaseKvLockRequest) returns (ReleaseKvLockReply);

  // Returns current non-expired lock state for a KV key.
  rpc GetKvLock (GetKvLockRequest) returns (GetKvLockReply);

  // Lists all declared services with aggregate endpoint health.
  //
  // A service exists when a stored task config declares a `service` block.
  // The reply is derived (a projection) from task configs, allocations, and
  // allocation health snapshots; there is no separate registration mechanism
  // and no way for the catalog to drift from scheduler state.
  rpc ListServices (ListServicesRequest) returns (ListServicesReply);

  // Resolves one service name to its endpoint addresses and ports.
  //
  // By default only healthy endpoints are returned: an endpoint is healthy
  // when its allocation's latest health snapshot reports healthy AND its node
  // is not lost/down. Endpoints without any health snapshot yet (still
  // booting) are excluded unless `include_unhealthy` is set.
  rpc ResolveService (ResolveServiceRequest) returns (ResolveServiceReply);

  // Resolves an artifact credential stored in KV for a worker about to fetch.
  //
  // Called by workers over their existing authenticated manager channel
  // immediately before fetching an artifact whose spec (or cluster default)
  // names a KV credential path. The credential value is returned to the
  // worker and is never persisted on allocations, logged, or traced.
  //
  // SECURITY: KV ACLs do not exist yet, so any task spec may reference any
  // KV path via `auth.kv`. When the ACL system lands, this RPC is the
  // enforcement point for artifact credential reads (see docs/artifacts.md).
  rpc GetArtifactCredential (GetArtifactCredentialRequest)
    returns (GetArtifactCredentialReply);

  // Executes a SQL statement directly against the manager state store.
  //
  // Read-only mode is the default safety behavior and rejects write statements
  // unless explicitly enabled in the request.
  rpc QueryStateStore (QueryStateStoreRequest) returns (QueryStateStoreReply);

  // Returns a structured schema snapshot for the manager SQLite state store.
  rpc GetStateStoreSchema (GetStateStoreSchemaRequest)
    returns (GetStateStoreSchemaReply);

  // Lists recent scheduler events from the manager's event journal.
  //
  // Events describe what the scheduler is doing: evals enqueued/completed,
  // allocations placed/removed/failed, node lifecycle changes, job lifecycle
  // changes, and rollout activity. Results are ordered oldest-to-newest and
  // support cursor-based polling via `after_id`.
  rpc ListEvents (ListEventsRequest) returns (ListEventsReply);

  // Streams scheduler events as they happen (server-streaming).
  //
  // When `after_id` is set, persisted events with `id > after_id` are
  // replayed first, then the live feed continues seamlessly. Clients that
  // disconnect can resume without gaps by passing the last event ID they saw.
  rpc StreamEvents (StreamEventsRequest) returns (stream SchedulerEvent);

  // Lists user-saved State Explorer query snippets.
  rpc ListSavedStateQueries (ListSavedStateQueriesRequest)
    returns (ListSavedStateQueriesReply);

  // Creates or overwrites a saved State Explorer query by name.
  rpc UpsertSavedStateQuery (UpsertSavedStateQueryRequest)
    returns (UpsertSavedStateQueryReply);

  // Deletes a saved State Explorer query by name.
  rpc DeleteSavedStateQuery (DeleteSavedStateQueryRequest)
    returns (DeleteSavedStateQueryReply);

  // === AUTH & ACL ===
  //
  // Legion's ACL system is token-based: callers present a bearer credential in
  // the `authorization` metadata header (`Bearer <secret>`). Credentials are
  // either opaque Legion ACL tokens (minted by BootstrapAcl, CreateAclToken,
  // or Login) or externally issued JWTs validated against a configured auth
  // method. Each request resolves to a set of named policies; policies contain
  // scoped allow/deny rules over resources (`job`, `node`, `kv`, `state`,
  // `operator`, `acl`) and actions (`read`, `write`).
  //
  // When ACLs are disabled (the default) every endpoint behaves as if the
  // caller held a management token.

  // Reports how the manager authenticated the caller and what access applies.
  //
  // This endpoint never requires a credential: anonymous callers receive the
  // anonymous identity. UI and CLI clients use it to discover whether ACLs are
  // enabled and to introspect the presented credential.
  rpc WhoAmI (WhoAmIRequest) returns (WhoAmIReply);

  // Exchanges login credentials for a newly minted Legion ACL token.
  //
  // Supported methods: the built-in `userpass` method (username/password
  // verified against stored ACL users) and any JWT/OIDC auth method configured
  // on the manager (`method` = the configured method name, `jwt` = the
  // externally issued token). The reply contains the token secret exactly
  // once; the manager stores only a hash of it.
  rpc Login (LoginRequest) returns (LoginReply);

  // One-time creation of the initial management token.
  //
  // Succeeds only while no management token exists; afterwards it returns
  // FAILED_PRECONDITION. Run `legion acl bootstrap` right after enabling ACLs
  // and store the returned secret safely.
  rpc BootstrapAcl (BootstrapAclRequest) returns (BootstrapAclReply);

  // Creates or replaces a named ACL policy. Requires `acl:write`.
  rpc UpsertAclPolicy (UpsertAclPolicyRequest) returns (UpsertAclPolicyReply);

  // Returns one ACL policy by exact name. Requires `acl:read`.
  rpc GetAclPolicy (GetAclPolicyRequest) returns (GetAclPolicyReply);

  // Lists all ACL policies. Requires `acl:read`.
  rpc ListAclPolicies (ListAclPoliciesRequest) returns (ListAclPoliciesReply);

  // Deletes an ACL policy by exact name. Requires `acl:write`.
  //
  // Tokens referencing the deleted policy lose the access it granted.
  rpc DeleteAclPolicy (DeleteAclPolicyRequest) returns (DeleteAclPolicyReply);

  // Creates a new ACL token attached to existing policies.
  //
  // Requires `acl:write`. Creating a `management` token additionally requires
  // the caller to hold a management token.
  rpc CreateAclToken (CreateAclTokenRequest) returns (CreateAclTokenReply);

  // Lists ACL tokens. Requires `acl:read`.
  //
  // Only accessor IDs and metadata are returned; secrets are never stored or
  // returned after creation.
  rpc ListAclTokens (ListAclTokensRequest) returns (ListAclTokensReply);

  // Deletes (revokes) an ACL token by accessor ID. Requires `acl:write`.
  rpc DeleteAclToken (DeleteAclTokenRequest) returns (DeleteAclTokenReply);

  // Creates or updates a username/password ACL user. Requires `acl:write`.
  //
  // Passwords are hashed with argon2id; plaintext is never stored.
  rpc UpsertAclUser (UpsertAclUserRequest) returns (UpsertAclUserReply);

  // Lists username/password ACL users. Requires `acl:read`.
  rpc ListAclUsers (ListAclUsersRequest) returns (ListAclUsersReply);

  // Deletes a username/password ACL user. Requires `acl:write`.
  //
  // Tokens previously minted via Login remain valid until they expire or are
  // deleted; deleting the user only prevents future logins.
  rpc DeleteAclUser (DeleteAclUserRequest) returns (DeleteAclUserReply);

  // Lists the auth methods clients may log in with.
  //
  // Open endpoint: login UIs need this before any credential exists. Only
  // public metadata is returned (names, types, OIDC client settings) —
  // never secrets or validation keys.
  rpc GetAuthMethods (GetAuthMethodsRequest) returns (GetAuthMethodsReply);

  // Creates a worker join token. Requires `node:write`.
  //
  // The reply contains a self-describing composite token (manager address +
  // secret + worker type) that introduces a worker in one command:
  // `legion join <TOKEN>`. The manager stores only a hash of the secret.
  rpc CreateJoinToken (CreateJoinTokenRequest) returns (CreateJoinTokenReply);

  // Lists worker join tokens (metadata only). Requires `node:read`.
  rpc ListJoinTokens (ListJoinTokensRequest) returns (ListJoinTokensReply);

  // Deletes (revokes) a worker join token by ID. Requires `node:write`.
  //
  // Workers already registered keep their node tokens; revocation only
  // prevents future joins with this token.
  rpc DeleteJoinToken (DeleteJoinTokenRequest) returns (DeleteJoinTokenReply);
}

// Request payload for WorkerPreRegister.
message WorkerPreRegisterRequest {
  // Worker type name (for example: "default").
  //
  // This selects the worker template stored on the manager.
  // No manager-side default is applied by this RPC.
  string worker_type = 1;

  // Join token secret (the `secret` field of a decoded join token).
  //
  // Required when ACLs are enforced: the manager validates it against its
  // stored join tokens before serving worker configuration. Ignored when
  // ACLs are disabled.
  optional string join_token = 2;
}

// Effective worker configuration returned by pre-registration.
message WorkerConfig {
  // Worker type name that produced this config.
  string name = 1;

  // Node pool this worker belongs to.
  string pool = 2;

  // Additional dynamic node-check plugin names to execute on worker.
  //
  // Default: empty list when worker type does not specify checks.
  repeated string additional_node_checks = 3;

  // Static worker attributes injected into node config attrs at registration.
  //
  // Default: empty object `{}` when worker type does not set attributes.
  map<string, string> attributes = 4;

  // Optional prefix used when auto-generating worker IDs.
  //
  // Default: unset.
  optional string name_prefix = 5;

  // JSON-encoded total node resource overrides/capabilities.
  //
  // Default: `{}` (from worker-type storage defaults).
  string resources = 6;

  // JSON-encoded reserved resource amounts/items unavailable for scheduling.
  //
  // Default: `{}` (from worker-type storage defaults).
  string reserved_resources = 7;

  // Optional maximum number of allocations this worker should host.
  //
  // Default: unset (no explicit max allocation cap).
  optional uint32 max_allocations = 8;

  // JSON-encoded artifact fetch settings for this worker.
  //
  // Shape: `{"fetch":{"parallelism":4,"attempts":3,"timeout":"10m",
  //          "maxArtifactSize":"50GiB","allowedSchemes":["https","s3",
  //          "oci","git","file"]}}`.
  //
  // Default: empty string (worker applies conservative built-in defaults).
  string artifacts = 9;
}

// Reply payload for WorkerPreRegister.
message WorkerPreRegisterReply {
  // Effective worker configuration to use for this worker instance.
  //
  // Manager sets this on successful responses.
  WorkerConfig config = 1;
}

// Request payload for WorkerRegister.
message WorkerRegisterRequest {
  // Worker/node ID to register.
  string name = 1;

  // Pool assigned to this worker.
  string pool = 2;

  // JSON object string of node configuration attributes.
  string config_attrs = 3;

  // JSON object string of node fingerprint attributes collected on worker.
  string fingerprint_attrs = 4;

  // JSON object/string with current worker health-check results.
  string health_checks = 5;

  // Manager-populated defaults on registration (not client-provided):
  // - `status = "active"`
  // - `availability = "available"`
  // - `dynamic_attrs = {}`
  // - `last_heartbeat = ""` until first heartbeat

  // Join token secret (the `secret` field of a decoded join token).
  //
  // Required when ACLs are enforced. Ignored when ACLs are disabled.
  optional string join_token = 6;
}

// Reply payload for WorkerRegister.
message WorkerRegisterReply {
  // Human-readable status message.
  //
  // Current manager reply value: `"Worker registered"`.
  string message = 1;

  // Per-node credential for subsequent worker-plane calls (Heartbeat,
  // HealthCheck). Minted only when ACLs are enforced; re-registering
  // rotates it (the previous node token is revoked). Workers attach it as
  // a bearer credential exactly like an ACL token.
  optional string node_token = 2;
}

// One submission unit that contributed to a rendered jobspec.
message Submission {
  // Original submission path (file path, module path, or logical label).
  string path = 1;

  // Full submission content as text.
  string content = 2;

  // True when this submission is the primary entrypoint file.
  bool is_primary = 3;
}

// Request payload for RunJob.
message RunJobRequest {
  // Fully rendered job specification as JSON text.
  //
  // This is the canonical input consumed by manager scheduling/validation logic.
  string parsed_jobspec = 1;

  // Source submissions used to produce `parsed_jobspec`.
  repeated Submission submissions = 2;

  // Optional eval priority override.
  //
  // Higher values are processed sooner in the eval queue.
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 3;

  // When true, enqueues a reschedule even when the job spec content is unchanged.
  //
  // Default: `false`.
  bool force_reschedule = 4;

  // Optional idempotency key.
  //
  // When set and non-empty, the manager deduplicates retried requests carrying
  // the same key: the first request is applied and its outcome recorded; any
  // later request with the same key returns the recorded reply without
  // re-applying. This lets clients (especially automated agents) safely retry
  // after a timeout without risking a double submission. Unset disables
  // deduplication.
  optional string idempotency_key = 5;
}

// Reply payload for RunJob.
message RunJobReply {
  // Human-readable outcome message (created/updated/unchanged/rollout state).
  //
  // Current manager reply values include:
  // - `"Job submit success"`
  // - `"Rollout started"`
  // - `"Rollout created; waiting for manual start"`
  // - `"Job config unchanged; no update needed"`
  // - `"Job config unchanged; forced reschedule queued"`
  string message = 1;

  // True when this reply was replayed from a previously recorded result for the
  // request's `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for GetJobInfo.
message GetJobInfoRequest {
  // Job name (also used as job ID in current manager implementation).
  string name = 1;
}

// Reply payload for GetJobInfo.
message GetJobInfoReply {
  // Job metadata for the requested job.
  //
  // Manager returns NotFound instead of returning this field unset.
  Job job = 1;
}

// Request payload for ListRollouts.
message ListRolloutsRequest {
  // Optional job ID filter.
  //
  // When omitted (or blank), rollouts for all jobs are returned.
  optional string job_id = 1;

  // When true, only active (non-terminal) rollouts are returned.
  //
  // Default: `false` (returns both active and terminal rollouts).
  bool active_only = 2;

  // Free-text search against rollout ID, job ID, status, and strategy fields.
  optional string query = 3;

  // Sort key. Supported values: `updated_at`, `created_at`, `status`, `job_id`.
  //
  // Default: `updated_at`.
  optional string sort_by = 4;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `desc`.
  optional string sort_order = 5;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 6;

  // Maximum rollouts returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 7;
}

// Rollout record.
message Rollout {
  // Unique rollout ID.
  int64 id = 1;

  // Job ID this rollout belongs to.
  string job_id = 2;

  // Previous job config ID being replaced (if any).
  optional string from_job_config_id = 3;

  // Target job config ID for this rollout.
  string to_job_config_id = 4;

  // Rollout status.
  //
  // Common values include: pending, running, waiting_manual_start,
  // waiting_manual_advance, completed, failed, cancelled, completed_incomplete.
  string status = 5;

  // True when rollout finished but did not fully reach desired target.
  bool incomplete = 6;

  // Human-readable rollout status message.
  string message = 7;

  // Strategy plugin name used to resolve rollout behavior.
  optional string strategy = 8;

  // Progression mode (for example: auto/manual) as stored by manager.
  optional string progression = 9;

  // Replacement mode (for example: createFirst/destroyFirst) as stored by manager.
  optional string replacement = 10;

  // Whether rollout prefers in-place replacement behavior.
  optional bool in_place = 11;

  // JSON-encoded rollout envelope/config/runtime state.
  string config_json = 12;

  // RFC3339 creation timestamp.
  string created_at = 13;

  // RFC3339 update timestamp.
  string updated_at = 14;

  // RFC3339 completion timestamp for terminal rollouts.
  optional string completed_at = 15;
}

// Reply payload for ListRollouts.
message ListRolloutsReply {
  // Matching rollout records for the requested page.
  repeated Rollout rollouts = 1;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;
}

// Request payload for GetRollout.
message GetRolloutRequest {
  // Rollout ID.
  int64 id = 1;
}

// Reply payload for GetRollout.
message GetRolloutReply {
  // Rollout when found; unset when not found.
  optional Rollout rollout = 1;
}

// Allocation-level status as seen in a rollout group status response.
message RolloutAllocationStatus {
  // Allocation ID.
  int64 allocation_id = 1;

  // Node hosting this allocation.
  string node_id = 2;

  // Task config ID backing this allocation.
  int64 task_config_id = 3;

  // Task name for display and filtering.
  string task_name = 4;

  // Task group name.
  string task_group = 5;

  // Task lifecycle (for example: service, batch, sidecar).
  string lifecycle = 6;

  // Allocation runtime status string.
  string status = 7;

  // Rollout role for this allocation, typically replacement or replacee.
  string role = 8;

  // Optional derived node health flag at query time.
  optional bool node_healthy = 9;

  // Optional allocation health flag from latest worker snapshot.
  optional bool allocation_healthy = 10;

  // Optional allocation health status text from latest worker snapshot.
  optional string allocation_health = 11;

  // Optional JSON-encoded per-artifact staging states from the latest worker
  // snapshot. Same payload as `AllocationHealth.artifact_states`: an array of
  // `{"name","source","state","bytesFetched","bytesTotal","digest",
  //   "attempts","durationMs","error"}` objects.
  //
  // Unset when the allocation's task declares no artifacts or no snapshot
  // has been received yet.
  optional string artifact_states = 12;
}

// Group-level rollout status.
message RolloutGroupStatus {
  // Group name.
  string group = 1;

  // Current step index (0-based in runtime state, API returns current numeric index).
  uint32 step_index = 2;

  // Total number of computed rollout steps for this group.
  uint32 total_steps = 3;

  // Number of queued manual-advance credits for this group.
  uint32 pending_manual_advances = 4;

  // Allocations participating in this group's rollout.
  repeated RolloutAllocationStatus allocations = 5;
}

// Request payload for GetRolloutStatus.
message GetRolloutStatusRequest {
  // Rollout ID.
  int64 id = 1;
}

// Reply payload for GetRolloutStatus.
message GetRolloutStatusReply {
  // Rollout record when found.
  optional Rollout rollout = 1;

  // Per-group runtime status.
  repeated RolloutGroupStatus groups = 2;
}

// Rollout event record.
message RolloutEvent {
  // Event ID.
  int64 id = 1;

  // Rollout ID this event belongs to.
  int64 rollout_id = 2;

  // Job ID this event belongs to.
  string job_id = 3;

  // Optional task group this event is scoped to.
  optional string group_name = 4;

  // Event severity level (for example: info, warn, error).
  string level = 5;

  // Human-readable event message.
  string message = 6;

  // JSON metadata payload as string.
  string metadata_json = 7;

  // RFC3339 creation timestamp.
  string created_at = 8;
}

// Request payload for ListRolloutEvents.
message ListRolloutEventsRequest {
  // Rollout ID.
  //
  // Must be greater than 0.
  int64 rollout_id = 1;

  // Optional maximum number of events to return.
  //
  // Default when omitted: `500`.
  // Manager bounds: clamped to `[1, 2000]`.
  optional uint32 limit = 2;
}

// Reply payload for ListRolloutEvents.
message ListRolloutEventsReply {
  // Ordered rollout events (oldest to newest within the returned window).
  repeated RolloutEvent events = 1;
}

// Request payload for AdvanceRollout.
message AdvanceRolloutRequest {
  // Rollout ID.
  int64 id = 1;

  // Group names to advance.
  //
  // Empty (default) means advance all groups in the rollout.
  repeated string groups = 2;

  // Optional eval priority for generated rollout tick work.
  //
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 3;
}

// Reply payload for AdvanceRollout.
message AdvanceRolloutReply {
  // Human-readable queue/advance message.
  //
  // Current manager reply value: `"Rollout advance queued"`.
  string message = 1;

  // Updated rollout record after queuing manual advance.
  optional Rollout rollout = 2;
}

// Request payload for StopRollout.
message StopRolloutRequest {
  // Rollout ID to stop.
  int64 id = 1;

  // When true, remove allocations for the rollout target config and re-schedule from
  // the rollout source config (when present).
  bool revert = 2;

  // Optional eval priority for any rollback scheduling.
  //
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 3;
}

// Reply payload for StopRollout.
message StopRolloutReply {
  // Human-readable stop/revert message.
  string message = 1;

  // Updated rollout record after stop processing.
  optional Rollout rollout = 2;
}

// Request payload for GetJobSpec.
message GetJobSpecRequest {
  // Job name.
  string name = 1;
