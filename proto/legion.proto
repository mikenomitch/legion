syntax = "proto3";
package legion;

// === MANAGER ===

service Manager {
  rpc WorkerJoin (WorkerJoinRequest) returns (WorkerJoinReply);
  rpc WorkerRegister (WorkerRegisterRequest) returns (WorkerRegisterReply);
  rpc RunJob (RunJobRequest) returns (RunJobReply);
  rpc GetJobStatus (GetJobStatusRequest) returns (GetJobStatusReply);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
  rpc GetNodes (GetNodesRequest) returns (GetNodesReply);
  rpc GetNode (GetNodeRequest) returns (GetNodeReply);
  rpc UpdateNodeDynamic (UpdateNodeDynamicRequest)
    returns (UpdateNodeDynamicReply);
}

message WorkerJoinRequest {
  string token = 1;
}

message WorkerRegisterRequest {
  string name = 1;
  string attributes = 2;
}

message WorkerRegisterReply {
  string message = 1;
}

message WorkerJoinReply {
  string message = 1;
}

message RunJobRequest {
  string name = 1;
}

message RunJobReply {
  string message = 1;
}

message GetJobStatusRequest {
  string name = 1;
}

message GetJobStatusReply {
  string message = 1;
}

message HeartbeatRequest {
  string id = 1;
}

message HeartbeatReply {
  string message = 1;
}

message Node {
  string id = 1;
  string attrs = 2;
  string dynamic = 3;
  string status = 4;
  string last_heartbeat = 5;
}

message GetNodesRequest {
}

message GetNodesReply {
  repeated Node nodes = 1;
}

message GetNodeRequest {
  string id = 1;
}

message GetNodeReply {
  optional Node node = 1;
}

message UpdateNodeDynamicRequest {
  string id = 1;
  string dynamic_diff = 2;
}

message UpdateNodeDynamicReply {
  optional Node node = 1;
}

// === INSECURE MANAGER ===

service InsecureManager {
  rpc GetJoinToken (GetJoinTokenRequest) returns (GetJoinTokenReply);
}

message GetJoinTokenRequest {
  bool one_time = 1;
}

message GetJoinTokenReply {
  string token = 1;
}

// === WORKER ===

service Worker {
  rpc PostWork (PostWorkRequest) returns (PostWorkReply);
}

message PostWorkRequest {
  string message = 1;
}

message PostWorkReply {
  string message = 1;
}
