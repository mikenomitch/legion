syntax = "proto3";
package legion;

// Legion gRPC API.
//
// Conventions used throughout this file:
// - `*_json` and many string fields contain JSON payloads serialized as strings.
// - Timestamps are generally RFC3339 strings unless a field explicitly says Unix timestamp.
// - Optional fields are omitted when not provided by the client/server.

// === MANAGER ===

// Manager is the primary control-plane API.
//
// It is used by:
// - Workers for registration, heartbeats, and health updates.
// - CLI/UI clients for job, rollout, node, ledger, and KV operations.
service Manager {
  // Fetches effective worker-type configuration before a worker registers.
  //
  // This is the first manager call in the worker join flow.
  rpc WorkerPreRegister (WorkerPreRegisterRequest)
    returns (WorkerPreRegisterReply);

  // Registers or upserts a worker node in manager state.
  //
  // A worker should call this after pre-registration and after local fingerprinting.
  rpc WorkerRegister (WorkerRegisterRequest) returns (WorkerRegisterReply);

  // Submits or updates a job from a fully rendered jobspec.
  //
  // Depending on current state, this may create a new job config, create a rollout,
  // and enqueue reconciliation work.
  rpc RunJob (RunJobRequest) returns (RunJobReply);

  // Returns the submitted source files (submissions) associated with the latest job config.
  rpc GetJobSpec (GetJobSpecRequest) returns (GetJobSpecReply);

  // Returns submissions for a specific job config ID.
  rpc GetJobSpecByConfig (GetJobSpecByConfigRequest) returns (GetJobSpecReply);

  // Lists known job spec versions for one job.
  rpc ListJobSpecHistory (ListJobSpecHistoryRequest) returns (ListJobSpecHistoryReply);

  // Returns metadata for one job (status, creation time, etc).
  rpc GetJobInfo (GetJobInfoRequest) returns (GetJobInfoReply);

  // Lists rollouts, optionally filtered by job and active status.
  rpc ListRollouts (ListRolloutsRequest) returns (ListRolloutsReply);

  // Returns one rollout by numeric rollout ID.
  rpc GetRollout (GetRolloutRequest) returns (GetRolloutReply);

  // Returns rollout plus per-group runtime status and allocation health snapshots.
  rpc GetRolloutStatus (GetRolloutStatusRequest) returns (GetRolloutStatusReply);

  // Returns ordered rollout event history for a rollout.
  rpc ListRolloutEvents (ListRolloutEventsRequest) returns (ListRolloutEventsReply);

  // Manually advances a rollout (all groups or selected groups).
  rpc AdvanceRollout (AdvanceRolloutRequest) returns (AdvanceRolloutReply);

  // Stops an in-flight rollout and optionally reverts to the previous config.
  rpc StopRollout (StopRolloutRequest) returns (StopRolloutReply);

  // Computes a placement plan for a jobspec without mutating cluster state.
  rpc PlanJob (PlanJobRequest) returns (PlanJobReply);

  // Marks a job as stopped and enqueues stop reconciliation.
  rpc StopJob (StopJobRequest) returns (StopJobReply);

  // Sets (or clears) a task's count override — the `legion job scale`
  // surface (docs/autoscaling.md). Changes the effective desired count
  // WITHOUT creating a new job config version or starting a rollout: the
  // override is layered over the spec's `count` and reconciled by a
  // `job_scale` eval (scale-out places only the shortfall; scale-in
  // retires surplus allocations, highest slot indices first for slot-mode
  // stateful tasks and newest-first for stateless ones). A scale-IN
  // requested while a rollout is in flight is recorded as pending and
  // applied when the rollout finishes (scale-out applies immediately).
  // Guarded by `scale:write`, deliberately separate from `job:write`.
  rpc ScaleTask (ScaleTaskRequest) returns (ScaleTaskReply);

  // Reports every task's spec count, live override (or pending scale-in),
  // and effective desired count for one job. The read half of the scale
  // surface; `scale:read`.
  rpc GetJobScaleStatus (GetJobScaleStatusRequest) returns (GetJobScaleStatusReply);

  // Permanently removes a stopped job and related records.
  rpc DestroyJob (DestroyJobRequest) returns (DestroyJobReply);

  // Lists jobs known by the manager.
  rpc ListJobs (ListJobsRequest) returns (ListJobsReply);

  // === JOB TEMPLATES ===
  //
  // Job templates are cluster-resident, immutably versioned Nickel
  // documents with declared, typed variables. Anyone with `template:read`
  // can browse them; `template:write` creates new versions or deletes them;
  // submitting a job *through* a template is gated by `job:write` rules
  // carrying the `templates` scope selector (see AclPolicy), which is how
  // an operator locks an account down to "may only submit via template X".
  // Rendering happens on the manager (imports are forbidden; templates are
  // self-contained), so thin clients like the UI get the same result as the
  // CLI. See docs/job-templates.md.

  // Creates the next immutable version of a named job template.
  //
  // The source must evaluate to a record with an optional `description`,
  // an optional `variables` list, and a
  // `job | not_exported = fun vars => ...` function that returns the
  // jobspec. `not_exported` is what keeps `job` out of the published
  // manifest. Invalid manifests are rejected here, not at run
  // time. When every declared variable has a default, the manager also
  // trial-renders the template and validates the resulting jobspec.
  // Requires `template:write` scoped to the template name.
  rpc UpsertJobTemplate (UpsertJobTemplateRequest) returns (UpsertJobTemplateReply);

  // Lists job templates (latest-version summaries).
  //
  // Requires `template:read`; results are filtered to templates the caller
  // can read.
  rpc ListJobTemplates (ListJobTemplatesRequest) returns (ListJobTemplatesReply);

  // Returns one job template version (latest when `version` is omitted),
  // including its source, variable definitions, and version history.
  // Requires `template:read` scoped to the template name.
  rpc GetJobTemplate (GetJobTemplateRequest) returns (GetJobTemplateReply);

  // Deletes a job template and all of its versions.
  //
  // Jobs already created from the template keep running and keep their
  // provenance records; only the template itself disappears. Requires
  // `template:write` scoped to the template name.
  rpc DeleteJobTemplate (DeleteJobTemplateRequest) returns (DeleteJobTemplateReply);

  // Renders a template with the given variables without submitting.
  //
  // The dry-run twin of RunJobTemplate: validates the variables, renders
  // the jobspec, validates it, and returns it. Mutates nothing. Requires
  // the same access as RunJobTemplate (`job:write` for the rendered job
  // name with the template attribute set), so a caller can always preview
  // exactly what it is allowed to submit.
  rpc RenderJobTemplate (RenderJobTemplateRequest) returns (RenderJobTemplateReply);

  // Renders a template with the given variables and submits the result as
  // a job (create or update), stamping template provenance on the config.
  //
  // ACL: requires `job:write` for the rendered job name evaluated with the
  // template attribute set — satisfied either by an ordinary `job:write`
  // rule or by one scoped with `templates: [...]`. A run that would update
  // an existing job whose latest config did not come from this template
  // fails with FAILED_PRECONDITION unless the caller also holds plain
  // `job:write` on that job name (this stops a template-only identity from
  // hijacking unrelated jobs when the rendered name is user-influenced).
  rpc RunJobTemplate (RunJobTemplateRequest) returns (RunJobTemplateReply);

  // Creates a keyed-mode stateful instance for a job's keyed task and
  // enqueues placement.
  //
  // Keyed instances (see docs/stateful-workloads.md) are the sandbox/dispatch
  // primitive: each instance is a long-lived logical entity with a unique,
  // **never-recycled** id that persists across allocations. Unlike slot mode,
  // Keyed tasks cannot define `count` (rejected at job parse time) — the
  // number of live instances
  // created through this RPC is the task's desired allocation count (zero
  // instances = zero allocations).
  //
  // Id assignment: the target task's `stateful.idSource` declares the default
  // source. With `idSource: "caller"` the request must supply `instance_id`;
  // with `idSource: "uuid"` (or unset) the server mints an id when
  // `instance_id` is absent. A caller-supplied `instance_id` is always
  // accepted when valid, regardless of `idSource` — the setting picks the
  // default, it does not forbid explicit keys.
  //
  // Errors:
  // - NotFound: the job does not exist.
  // - InvalidArgument: no keyed task matches `group`/`task`, the match is
  //   ambiguous, the id has an invalid charset (must match
  //   `[A-Za-z0-9._-]{1,128}`), or `idSource: "caller"` and no id was given.
  // - AlreadyExists: the id collides with ANY existing instance row of the
  //   job — including Stopped instances and Terminated tombstones — or
  //   structurally aliases the reserved slot-id pattern
  //   `{job}-{group}-{slot}` of a slot-mode stateful task in the same job
  //   (the slot and keyed id spaces are kept disjoint so a keyed id can never
  //   adopt, or be adopted by, a slot placement). A stopped instance still
  //   owns its id, and a destroyed id can never be created again for the
  //   lifetime of the job (the never-recycle guarantee; destroying the whole
  //   job clears its instance history — see DestroyJob).
  rpc CreateInstance (CreateInstanceRequest) returns (CreateInstanceReply);

  // Creates several keyed-mode stateful instances in one atomic call and
  // enqueues a single placement evaluation for the batch.
  //
  // The request may carry explicit `instance_ids`, a `count` of server-minted
  // ids, or both; the call creates every explicit id PLUS `count` freshly
  // minted ids. Creation is ALL-OR-NOTHING inside one storage transaction:
  // if any explicit id is invalid or collides with ANY existing instance row
  // (live, Stopped, or a Terminated tombstone — ids are never recycled), the
  // whole call fails and NO instance is created. The reply lists every id
  // that was created, in request order (explicit ids first, then minted ids).
  //
  // Task resolution (`group`/`task`) follows the same disambiguation rules as
  // `CreateInstance`: filters may be omitted when the job has exactly one
  // keyed task; ambiguity is rejected, never guessed.
  //
  // Interaction with `stateful.idSource`:
  // - `idSource: "caller"` requires every id to be caller-supplied, so
  //   `count > 0` (server minting) contradicts the policy and is rejected
  //   with InvalidArgument.
  // - `idSource: "uuid"` (or unset) accepts any mix of explicit ids and
  //   minted ids.
  //
  // Errors:
  // - NotFound: the job does not exist.
  // - FailedPrecondition: the job is stopped (run it before creating
  //   instances).
  // - InvalidArgument: no keyed task matches `group`/`task` or the match is
  //   ambiguous; `instance_ids` is empty AND `count` is 0 (nothing to
  //   create); an id has an invalid charset (must match
  //   `[A-Za-z0-9._-]{1,128}`, the offending id is named); or the task
  //   declares `idSource: "caller"` and `count > 0`.
  // - AlreadyExists: an id (named in the message) collides with an existing
  //   instance row — including duplicates within the request itself, Stopped
  //   instances, and Terminated tombstones. Nothing is created.
  rpc CreateInstances (CreateInstancesRequest) returns (CreateInstancesReply);

  // Destroys a keyed-mode instance: stops its current allocation, drops its
  // storage handle, and marks the instance Terminated.
  //
  // The instance row is retained as a tombstone so its id can never be
  // re-created — and its workload identity `sub` never re-minted for a
  // different workload — for the lifetime of the job (the never-recycle
  // guarantee). Destroying the whole job (DestroyJob) cascades and clears its
  // instance history, after which the id is free again; a live job never
  // recycles a destroyed id. The storage handle is always dropped on destroy
  // — a destroyed sandbox's state must not be reattachable. (This is
  // intentionally stricter than slot-mode scale-in, which retains storage by
  // default for a later scale-out.)
  //
  // Destroying an already-Terminated instance succeeds as a no-op, so the
  // call is safe to retry even without an idempotency key.
  //
  // Destroy also applies to Stopped instances: the row transitions
  // stopped -> terminated and its retained storage handle is dropped.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: the instance is slot-mode (slot lifecycles are owned
  //   by the scheduler via `count.num`, not this API).
  rpc DestroyInstance (DestroyInstanceRequest) returns (DestroyInstanceReply);

  // Stops (pauses) a keyed-mode instance WITHOUT tombstoning it.
  //
  // The instance's current allocation is stopped through the normal
  // allocation-stop path (the hosting worker stops the task on its next
  // heartbeat reconcile), and the instance transitions to `stopped`. Unlike
  // `DestroyInstance` this is fully reversible:
  // - the row is RETAINED and the id stays owned — `CreateInstance` with the
  //   same id still fails with AlreadyExists (stopped is not destroyed);
  // - the storage handle is RETAINED, so a later `StartInstance` revives the
  //   instance with its persisted state;
  // - `StartInstance` moves it back to `pending` and re-places it.
  //
  // While stopped, the instance is NOT part of the keyed task's desired
  // allocation count: the scheduler plans no allocation for it, and job
  // resubmits / config updates / reschedules will not resurrect it. Only an
  // explicit `StartInstance` does.
  //
  // Stopping an already-stopped instance succeeds as a no-op, so the call is
  // safe to retry even without an idempotency key.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: the instance is slot-mode (slot lifecycles are owned
  //   by the scheduler via `count.num`; stop the job or scale in instead).
  // - FailedPrecondition: the instance is Terminated. Destroyed instances
  //   are tombstoned forever (never-recycle) and can never be stopped,
  //   started, or re-created.
  rpc StopInstance (StopInstanceRequest) returns (StopInstanceReply);

  // Starts (resumes) a stopped keyed-mode instance.
  //
  // The instance transitions `stopped -> pending` and a placement evaluation
  // is enqueued (exactly like `CreateInstance` does), so the scheduler
  // places a new allocation bound to the same instance id and its RETAINED
  // storage handle — the revived workload is *the same* logical instance.
  //
  // Starting an instance that is already live (pending, active, or
  // rescheduling) succeeds as a no-op, so the call is safe to retry even
  // without an idempotency key.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: the instance is slot-mode (slot lifecycles are owned
  //   by the scheduler via `count.num`, not this API).
  // - FailedPrecondition: the instance is Terminated (destroyed ids are
  //   tombstoned forever — create a NEW id instead), or the owning job is
  //   stopped (run the job first; a stopped job schedules nothing).
  rpc StartInstance (StartInstanceRequest) returns (StartInstanceReply);

  // Operator override for the node-loss confirmation gate (the K8s analog is
  // force-deleting a pod stuck on a lost node): immediately frees a stateful
  // instance's allocation on a LOST node for replacement, without waiting for
  // `stateful.onLost.replaceAfter` to elapse (and despite `replaceAfter:
  // "never"`). See docs/stateful-workloads.md "Node loss and fencing".
  //
  // The gated allocation row is removed (the instance transitions to
  // `rescheduling`, keeping its id and storage handle) and a reschedule
  // evaluation is enqueued that excludes the lost node, so the replacement
  // re-binds the same instance elsewhere.
  //
  // DANGER: this asserts the lost node's workload is dead. If the node is
  // merely partitioned and its worker has not yet self-fenced
  // (`onLost.selfTerminateAfter`), forcing a replacement can run the
  // instance twice (split-brain on its storage handle and workload-identity
  // subject). Only force when the node is confirmed dead/isolated.
  //
  // Works for slot and keyed instances alike.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - FailedPrecondition: the instance has no current allocation, or its
  //   allocation's node is not `lost` (the gate only ever holds allocations
  //   on lost nodes; everything else reschedules through the normal paths).
  rpc ReplaceInstance (ReplaceInstanceRequest) returns (ReplaceInstanceReply);

  // Lists stateful instances (slot and keyed) for a job, optionally filtered
  // by group. Includes Terminated rows (slot rows retained for scale-out
  // re-materialization; keyed rows retained forever as never-recycle
  // tombstones).
  rpc ListInstances (ListInstancesRequest) returns (ListInstancesReply);

  // Returns one stateful instance by id.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  rpc GetInstance (GetInstanceRequest) returns (GetInstanceReply);

  // === VOLUMES (see docs/volumes.md) ===

  // Lists volumes, optionally filtered by job, node, driver, instance, or
  // state. Includes `destroyed` tombstones so an operator can still see where
  // a job's storage went after it was reclaimed.
  //
  // A volume is the concrete storage behind an instance's opaque
  // `{driver}/{volume_id}` storage handle: which driver owns it, which node it
  // is pinned to (node-local drivers only), what the driver recorded about it,
  // and where it sits in the reclaim state machine.
  rpc ListVolumes (ListVolumesRequest) returns (ListVolumesReply);

  // Returns one volume by id.
  //
  // Errors:
  // - NotFound: no volume row with this id exists.
  rpc GetVolume (GetVolumeRequest) returns (GetVolumeReply);

  // Deletes a volume: detaches it from its instance (which will mint a fresh
  // one on its next placement) and queues its storage for the owning worker's
  // `destroy`.
  //
  // Refuses with FailedPrecondition while a live allocation is running against
  // the volume — deleting storage under a running workload is the one mistake
  // this API must not allow. Stop the workload first (job stop, instance stop,
  // scale in). `force` overrides the refusal, and the worker still refuses to
  // run a driver destroy for a volume it currently has mounted, so even a
  // forced delete only abandons the record. Confirmed asynchronously — the volume sits in `destroying`
  // until the driver reports success, and the manager re-dispatches on every
  // heartbeat until it does, so nothing leaks if a worker dies mid-destroy.
  //
  // `force` skips driver confirmation and marks the volume `destroyed`
  // immediately. This is the escape hatch for a node-local volume whose node
  // is never coming back; it leaves whatever bytes exist on that node, which
  // is why it is not the default.
  //
  // Deleting an already-`destroyed` volume succeeds as a no-op, so the call is
  // safe to retry.
  //
  // ACL: `job:write` on the volume's job. A volume no job owns needs
  // cluster-wide `job:write` (a rule with no `names` or `namespaces`).
  //
  // Errors:
  // - NotFound: no volume row with this id exists.
  // - FailedPrecondition: a live allocation is running against the volume and
  //   `force` was not set.
  rpc DeleteVolume (DeleteVolumeRequest) returns (DeleteVolumeReply);

  // Lists the volume drivers installed across the cluster, with each one's
  // capabilities and the nodes providing it.
  //
  // The manager loads no storage drivers itself: everything here is
  // aggregated from what workers advertise in their fingerprints. That is also
  // what job admission validates against, so this endpoint answers "why was my
  // job rejected for driver X" directly.
  rpc ListVolumeDrivers (ListVolumeDriversRequest) returns (ListVolumeDriversReply);

  // Issues a short-lived, asymmetrically-signed OIDC workload-identity token
  // for one named identity declared on the task of a placed allocation
  // (see docs/workload-identity.md).
  //
  // Called by the worker that hosts the allocation — never by the task
  // itself — at task launch and again before each token expiry (the refresh
  // loop). The manager derives **all** claims server-side from the
  // scheduling record (region, job, group, task, node, alloc, and the stable
  // instance/slot for stateful tasks) and applies the audience, TTL, subject
  // template, and extra claims of the *named identity in the stored task
  // spec*. Nothing security-relevant is read from the request, so a
  // compromised worker can only obtain tokens for allocations placed on it,
  // scoped to audiences the spec already declared.
  //
  // Authorization: the caller must present the per-node worker token minted
  // at WorkerRegister (attached to every worker-plane RPC), whose principal
  // is `node:<node_id>`. The manager requires that principal to match the
  // request's `node_id`, which in turn must be the node the allocation is
  // placed on — so a worker can only obtain tokens for allocations on its own
  // node, and cannot forge a peer's node id to steal that peer's federation
  // credentials. Management tokens (and ACL-disabled deployments) are exempt.
  //
  // Errors:
  // - FailedPrecondition: workload identity is not enabled on this manager
  //   (`workloadIdentity.enabled: false`, the default).
  // - NotFound: no allocation with `alloc_id` exists, or the allocation's
  //   task does not declare an identity named `identity_name`.
  // - PermissionDenied: the allocation exists but is not placed on
  //   `node_id` (a worker may only request tokens for its own allocations).
  // - Internal: signing failed.
  rpc IssueWorkloadIdentityToken (IssueWorkloadIdentityTokenRequest)
      returns (IssueWorkloadIdentityTokenReply);

  // Issues a short-lived, asymmetrically-signed OIDC token for a *node*
  // identity — the cluster-grain credential declared under
  // `workloadIdentity.nodeIdentities` (see docs/workload-identity.md). Unlike
  // a task identity it is scoped to the worker node, not an allocation: its
  // claims are `region`, `pool`, and `node` (audit-only), with
  // `legion.io/scope = "node"` so relying parties can tell node tokens from
  // task tokens issued by the same cluster. Used by the worker to authenticate
  // cluster-level artifact fetches (`auth.nodeIdentity`) and, later, pre-warm.
  //
  // Called by the worker for its own node. Authorization is identical to
  // IssueWorkloadIdentityToken: the caller's authenticated per-node worker
  // token principal (`node:<node_id>`) must match the request's `node_id`, so
  // a worker cannot mint another node's credential. All claims are derived
  // server-side from the node's registration record and the named identity's
  // config — never from the request.
  //
  // Errors:
  // - FailedPrecondition: workload identity is not enabled on this manager.
  // - NotFound: no node with `node_id` is registered, or no node identity
  //   named `identity_name` is configured.
  // - PermissionDenied: `node_id` does not match the caller's credential.
  // - Internal: signing failed.
  rpc IssueNodeIdentityToken (IssueNodeIdentityTokenRequest)
      returns (IssueNodeIdentityTokenReply);

  // Issue a short-lived **mesh certificate** for a worker node — the
  // credential behind `certFrom = "legion"` (docs/network-handlers.md,
  // "mTLS"). The first call creates the cluster's mesh CA (replicated with
  // the control lane); every call signs a fresh key pair for the node with
  // `<node>.node.legion` and `legion://node/<node id>` as its SANs, valid for
  // 24 hours. Workers call it on their heartbeat loop once any allocation on
  // the node terminates or originates mesh TLS, and again after a third of
  // the lifetime has passed.
  //
  // The node's *workload* identities are never certificates: a dialing node
  // names the workload it forwards for in a PROXY protocol v2 TLV inside the
  // node-to-node TLS session, and the receiving node trusts that attribution
  // because the peer proved it is a node.
  //
  // Called by the worker for its own node. Authorization is identical to
  // IssueNodeIdentityToken: the caller's authenticated per-node principal
  // (`node:<node_id>`) must match the request's `node_id`.
  //
  // Errors:
  // - NotFound: no node with `node_id` is registered.
  // - PermissionDenied: `node_id` does not match the caller's credential.
  // - Internal: the CA could not be created or signing failed.
  rpc IssueNodeCertificate (IssueNodeCertificateRequest)
      returns (IssueNodeCertificateReply);

  // Worker heartbeat endpoint.
  //
  // Workers send runtime state, failures, and allocation health snapshots.
  // The manager returns the desired allocations for that worker node.
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);

  // Worker node health-check endpoint.
  //
  // Workers report node-level and plugin readiness checks.
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckReply);

  // Lists all nodes known by the manager.
  rpc GetNodes (GetNodesRequest) returns (GetNodesReply);

  // Returns one node by ID.
  rpc GetNode (GetNodeRequest) returns (GetNodeReply);

  // Reports whether this fleet is sustaining its heartbeat cadence, and what
  // to do about it if it is not.
  //
  // Read-only and cheap: every field is derived from the liveness snapshot the
  // status checker already takes each tick, so calling this costs no extra
  // scan. Backs `legion node cadence`.
  //
  // Answer with care on a manager that does not lead the status lane: it does
  // not own liveness, so it reports zeros rather than a guess. Ask any manager
  // and check `is_liveness_owner` in the reply.
  //
  // ACL: node:read, unscoped (the report is fleet-wide).
  // See docs/heartbeat-cadence-and-scale.md.
  rpc GetHeartbeatCadence (GetHeartbeatCadenceRequest)
    returns (GetHeartbeatCadenceReply);

  // Proxies a restart request to a worker node.
  rpc RestartWorker (RestartWorkerRequest) returns (RestartWorkerReply);

  // Sets a node's scheduling availability: cordon, drain, or uncordon.
  //
  // Availability is the schedulability axis of a node, independent of its
  // health status. Only nodes with availability `"available"` are considered
  // for new placements; setting any other value excludes the node from all
  // future scheduling decisions while leaving its status and heartbeats
  // untouched.
  //
  // Three operator flows map onto this RPC:
  // - Cordon: `availability = "drained"`, `evict = false`. New placements
  //   stop; existing allocations keep running on the node.
  // - Drain: `availability = "drained"`, `evict = true`. New placements
  //   stop, and a `node_drain` evaluation is enqueued that evicts the node's
  //   existing allocations so the scheduler replaces them elsewhere.
  //   Stateless allocations are evicted immediately; stateful allocations
  //   are protected by their `stateful.onLost` policy and are never
  //   force-moved by a drain (use ReplaceInstance for an operator override).
  // - Uncordon: `availability = "available"`. The node re-enters the
  //   scheduling pool; existing allocations elsewhere are not moved back
  //   automatically.
  //
  // The call is level-triggered and idempotent: setting the value a node
  // already has is a no-op besides the emitted event, and eviction works by
  // removing allocation rows so the next worker heartbeat reconciles the
  // desired state.
  //
  // Errors:
  // - NotFound: no node with `node_id` exists.
  // - InvalidArgument: `availability` is not `"available"` or `"drained"`.
  // - PermissionDenied: caller lacks `node:write` for the node's pool.
  rpc SetNodeAvailability (SetNodeAvailabilityRequest)
      returns (SetNodeAvailabilityReply);

  // Retrieves captured task stdout/stderr for a job's allocations.
  //
  // The manager locates the node hosting each allocation and proxies the read
  // to that worker's `Worker.GetTaskLogs` RPC.
  rpc GetAllocationLogs (GetAllocationLogsRequest)
    returns (GetAllocationLogsReply);

  // Opens an interactive or one-shot exec session inside a running
  // allocation, streaming stdin/stdout/stderr/resize frames both ways. The
  // manager authorizes the request, resolves the allocation to its node, and
  // proxies the stream to that worker's `Worker.ExecTask`.
  //
  // The first client frame must be an `ExecStart`. Raw commands require
  // `exec:write` (with `host: true` for host-level runtimes); action runs
  // require `action:write` (or `exec:write`) and are rendered server-side
  // from the stored job spec.
  //
  // The session re-checks its credential every 30 seconds. Once the token is
  // revoked or expired, or its policies no longer grant the session, the
  // stream ends with that auth error (`UNAUTHENTICATED` or
  // `PERMISSION_DENIED`) and the worker-side process is cancelled.
  rpc ExecAllocation (stream ExecClientFrame) returns (stream ExecServerFrame);

  // Lists the actions declared on a job's tasks (for CLI + UI discovery).
  rpc ListJobActions (ListJobActionsRequest) returns (ListJobActionsReply);

  // Returns node + allocation view of cluster state (the "ledger").
  rpc GetLedger (GetLedgerRequest) returns (GetLedgerReply);

  // Returns config snapshots stored by manager instances.
  rpc GetManagerConfigs (GetManagerConfigsRequest)
    returns (GetManagerConfigsReply);

  // Returns observability status and recent manager-side logs/traces.
  rpc GetObservability (GetObservabilityRequest)
    returns (GetObservabilityReply);

  // Returns the local manager's Raft control-plane status.
  //
  // This endpoint is available even before full Raft state replication is enabled,
  // and is intended for election/failover visibility and operator workflows.
  rpc GetRaftStatus (GetRaftStatusRequest) returns (GetRaftStatusReply);

  // Lists recent Raft control-plane events for this manager.
  //
  // Events include elections, leader transfers, membership updates, and token issuance.
  rpc ListRaftHistory (ListRaftHistoryRequest) returns (ListRaftHistoryReply);

  // Applies an operator-triggered Raft control command on this manager.
  //
  // Typical commands include election triggers, leader transfer, and membership changes.
  rpc IssueRaftCommand (IssueRaftCommandRequest) returns (IssueRaftCommandReply);

  // Issues a short-lived join token that can be used by a manager to join a Raft cluster.
  rpc GetRaftJoinToken (GetRaftJoinTokenRequest) returns (GetRaftJoinTokenReply);

  // Writes a consistent point-in-time backup of the manager state store to a
  // server-side path (`VACUUM INTO` on the live database) and returns where
  // it landed, its size, and the raft applied index it captures.
  //
  // Works in every persistence mode. In raft mode the call is leader-only:
  // a non-leader returns FAILED_PRECONDITION naming the current leader so
  // the caller can redial. Restore is an offline operation: start the
  // manager with `--restore-from <path>` (see docs/upgrades.md).
  //
  // Requires `operator:write`.
  rpc GetStateBackup (GetStateBackupRequest) returns (GetStateBackupReply);

  // Reports the KV encryption keyring on THIS manager (docs/kv-encryption.md):
  // whether encryption is on, whether every data key is unwrapped here
  // (`unlocked`) or which ones are not (`locked`, with the reason and the
  // root key location), the data keys with how many values each protects,
  // how many rows are still plaintext, and a one-line `hint` naming the
  // next step when there is one. Every manager answers for itself, because
  // the root key is per-manager state — ask each one when diagnosing.
  //
  // Requires `operator:read`.
  rpc GetKeyringStatus (GetKeyringStatusRequest) returns (GetKeyringStatusReply);

  // Rotates the KV data key: a new active key is written in one replicated
  // control-lane write and the previous key is retired but kept, so values
  // already stored stay readable. The manager then re-encrypts every value
  // under the new key in the background (versions and timestamps untouched,
  // no job restarts) and garbage-collects the retired key once nothing
  // references it. Automatic at `encryption.dataKeyRotationAge`; this RPC
  // is the on-demand form (an offboarding, a suspected exposure).
  //
  // Raft: leader-only (a follower answers FAILED_PRECONDITION naming the
  // leader). Requires `operator:write`. Retry-safe via `idempotency_key`.
  rpc RotateDataKey (RotateDataKeyRequest) returns (RotateDataKeyReply);

  // Re-encrypts KV values in batches until every value is under the active
  // data key — or, with `plaintext = true`, decrypts every value into a
  // plaintext row (the step before `encryption.enabled = false` or a
  // downgrade). Runs to completion before replying; each batch is one
  // replicated write of at most 256 rows. Values are unchanged, so nothing
  // on the KV-reactive path fires.
  //
  // Raft: leader-only. Requires `operator:write`. Retry-safe via
  // `idempotency_key` (a repeat simply finds nothing left to do).
  rpc RewrapKv (RewrapKvRequest) returns (RewrapKvReply);

  // Re-wraps every data key under the root key provider's CURRENT key, in
  // one replicated write, without touching any value. This is how a root
  // key rotation completes: for the `file`/`env` providers, put the new key
  // FIRST (older keys stay for unwrapping), call this, then remove the old
  // key everywhere; for an `exec` provider, after the KMS key changed.
  //
  // Raft: leader-only. Requires `operator:write`. Retry-safe via
  // `idempotency_key`.
  rpc RewrapRootKey (RewrapRootKeyRequest) returns (RewrapRootKeyReply);

  // Break-glass recovery when the root key is gone for good: deletes every
  // KV value this manager cannot decrypt, drops the data keys it cannot
  // unwrap, initializes a fresh keyring, and reports exactly which keys
  // were lost. Jobs that referenced a deleted value fail through the
  // normal `missing_kv_dependency` path and recover when the value is put
  // back. `confirm` must equal `DELETE-UNDECRYPTABLE-VALUES`.
  //
  // Raft: leader-only. Requires `operator:write`.
  rpc ResetKeyring (ResetKeyringRequest) returns (ResetKeyringReply);

  // Applies dynamic attribute updates to a node and triggers affected evaluations.
  rpc UpdateNodeDynamic (UpdateNodeDynamicRequest)
    returns (UpdateNodeDynamicReply);

  // Creates or updates a KV entry.
  //
  // Jobs that reference the key (legacy `$key` jobspec references or
  // watched task kv injections) are reconciled: their configs are
  // re-rendered from the new value and the per-reference `onChange` policy
  // (none/restart/rollout/fail) is applied. Rapid writes are coalesced per
  // the manager's `kvDebounceMs` window (default 500ms; with a non-zero
  // window reconciliation errors are logged on the manager instead of
  // failing this RPC). See docs/kv-store.md "Reactive updates".
  rpc PutKv (PutKvRequest) returns (PutKvReply);

  // Gets one KV entry by key.
  rpc GetKv (GetKvRequest) returns (GetKvReply);

  // Lists KV entries by prefix.
  rpc ListKv (ListKvRequest) returns (ListKvReply);

  // Deletes one KV entry by key.
  //
  // Deletion is a first-class reconciliation event: jobs watching the key
  // resolve their per-reference `onDelete` policy (default `fail`, which
  // marks the job and its allocations failed with reason
  // `missing_kv_dependency`; a later PutKv to the key recovers the job via
  // `onChange`). Legacy `$key` references treat deletion as `fail`. Events
  // are debounced like PutKv. See docs/kv-store.md "Reactive updates".
  rpc DeleteKv (DeleteKvRequest) returns (DeleteKvReply);

  // Applies an RFC6902 JSON patch to a JSON-typed KV entry.
  //
  // Triggers the same KV-change reconciliation (and debouncing) as PutKv.
  rpc PatchKv (PatchKvRequest) returns (PatchKvReply);

  // Acquires (or force-acquires) a lock for a KV key.
  rpc AcquireKvLock (AcquireKvLockRequest) returns (AcquireKvLockReply);

  // Renews an existing KV lock lease.
  rpc RenewKvLock (RenewKvLockRequest) returns (RenewKvLockReply);

  // Releases an existing KV lock.
  rpc ReleaseKvLock (ReleaseKvLockRequest) returns (ReleaseKvLockReply);

  // Returns current non-expired lock state for a KV key.
  rpc GetKvLock (GetKvLockRequest) returns (GetKvLockReply);

  // Lists all declared services with aggregate endpoint health.
  //
  // A service exists when a stored task config declares a `service` block.
  // The reply is derived (a projection) from task configs, allocations, and
  // allocation health snapshots; there is no separate registration mechanism
  // and no way for the catalog to drift from scheduler state.
  rpc ListServices (ListServicesRequest) returns (ListServicesReply);

  // The service graph: who calls whom, with RED (docs/network-handlers.md,
  // "Service graph"). One edge per (caller job, caller task, service, tag):
  // what the callers *declared* (a `connect.upstreams` entry, and whether the
  // service's `allow` intentions admit it) and what their datapaths
  // *observed* over the window — requests, errors, denials, latency, bytes,
  // folded from every node's heartbeat. Observed edges appear within one
  // heartbeat of the first call. Like ListServices, a projection: `job:read`.
  rpc ListServiceEdges (ListServiceEdgesRequest) returns (ListServiceEdgesReply);

  // Resolves one service name to its endpoint addresses and ports.
  //
  // By default only healthy endpoints are returned: an endpoint is healthy
  // when its allocation's latest health snapshot reports healthy AND its node
  // is not lost/down. Endpoints without any health snapshot yet (still
  // booting) are excluded unless `include_unhealthy` is set.
  rpc ResolveService (ResolveServiceRequest) returns (ResolveServiceReply);

  // Creates or replaces a network policy object (docs/network-handlers.md).
  //
  // A policy is a selector (node pools, namespaces, runtimes, job globs,
  // labels) plus the egress/ingress rules and handlers to apply to every task
  // it matches, with `enforcement = "require"` (always applied, ahead of the
  // task's own block, never weakened) or `"default"` (applied only when the
  // task declares nothing itself). The object is normalized and validated
  // here — `allow` sugar is desugared, protocol/handler names checked, and a
  // `default` policy that would tie with an existing one on priority and
  // selector is rejected so the winner is never decided at runtime. Takes
  // effect on every matching running allocation within one heartbeat; no
  // task is restarted.
  //
  // ACL: `net:write`, scoped by the policy's own `nodePools` / `namespaces`
  // selectors.
  rpc UpsertNetPolicy (UpsertNetPolicyRequest) returns (UpsertNetPolicyReply);

  // Fetches one stored policy object by name. ACL: `net:read`.
  rpc GetNetPolicyObject (GetNetPolicyObjectRequest) returns (GetNetPolicyObjectReply);

  // Lists stored policies in merge order: `require` first, then priority
  // descending, then name. ACL: `net:read`; entries are filtered to the
  // caller's scope.
  rpc ListNetPolicies (ListNetPoliciesRequest) returns (ListNetPoliciesReply);

  // Deletes a stored policy. Matching allocations lose it on their next
  // heartbeat. ACL: `net:write`.
  rpc DeleteNetPolicy (DeleteNetPolicyRequest) returns (DeleteNetPolicyReply);

  // Shows the *effective* policy for one task of a job: every matching
  // stored policy merged with the task's inline `network.egress` /
  // `network.ingress`, with each rule and handler naming the policy it came
  // from. This is exactly what the node datapath runs — the same merge
  // function — and the one thing a client cannot compute itself, because
  // stored policies live in the manager. `node_pool` narrows selector
  // matching to a pool (a job may land in several). ACL: `net:read` on the
  // job.
  rpc ShowNetPolicy (ShowNetPolicyRequest) returns (ShowNetPolicyReply);

  // Dry-runs a verdict: would this task be allowed to reach `to` (egress) or
  // be reached from `from` (ingress)? Returns the verdict, the rule that
  // decided it, and its reason, without sending anything — so an operator or
  // an agent can ask "is that host blocked?" instead of watching a connection
  // hang. Connect-time rules are evaluated; request-time rules (path,
  // method, header) are evaluated when `method`/`path` are given, otherwise
  // reported as `defer`. ACL: `net:read` on the job.
  rpc TestNetPolicy (TestNetPolicyRequest) returns (TestNetPolicyReply);

  // The mesh CA certificate — what an operator hands a non-Legion client
  // that must reach a mesh-TLS port, or verifies a node certificate against.
  // Never the key. Empty `cert_pem` when no node has asked for a certificate
  // yet (the CA is created on first use). ACL: `net:read`.
  rpc GetMeshCa (GetMeshCaRequest) returns (GetMeshCaReply);

  // Replace the mesh CA. Every node re-issues its certificate on its next
  // heartbeat (within one interval); until a node has, its peers on the new
  // CA refuse it and it refuses them — expect a heartbeat's worth of
  // refused mesh connections, never plaintext. ACL: `net:write` (unscoped).
  rpc RotateMeshCa (RotateMeshCaRequest) returns (RotateMeshCaReply);

  // Worker plane: fetches the merged policy body for a hash the heartbeat
  // reply named. Policies are content-addressed so a node running a thousand
  // identical sandboxes fetches one body once; the worker caches by hash and
  // keeps the last known good body if a fetch fails (fail-static).
  //
  // ACL: worker plane (node token).
  rpc FetchNetPolicy (FetchNetPolicyRequest) returns (FetchNetPolicyReply);

  // Resolves an artifact credential stored in KV for a worker about to fetch.
  //
  // Called by workers over their existing authenticated manager channel
  // immediately before fetching an artifact whose spec (or cluster default)
  // names a KV credential path. The credential value is returned to the
  // worker and is never persisted on allocations, logged, or traced.
  //
  // SECURITY: KV ACLs do not exist yet, so any task spec may reference any
  // KV path via `auth.kv`. When the ACL system lands, this RPC is the
  // enforcement point for artifact credential reads (see docs/artifacts.md).
  rpc GetArtifactCredential (GetArtifactCredentialRequest)
    returns (GetArtifactCredentialReply);

  // Executes a SQL statement directly against the manager state store.
  //
  // Read-only mode is the default safety behavior and rejects write statements
  // unless explicitly enabled in the request.
  //
  // Private key material and password hashes always read as NULL, in any
  // statement and however the query reaches them: `signing_key.private_key_pem`,
  // `net_mesh_ca.key_pem`, and `acl_user.password_hash`. Predicates on those
  // columns match nothing, and `INSERT ... SELECT` copies NULL.
  //
  // ACL: `state:read`, or `state:write` when `allow_write` is set.
  rpc QueryStateStore (QueryStateStoreRequest) returns (QueryStateStoreReply);

  // Returns a structured schema snapshot for the manager SQLite state store.
  rpc GetStateStoreSchema (GetStateStoreSchemaRequest)
    returns (GetStateStoreSchemaReply);

  // Lists recent scheduler events from the manager's event journal.
  //
  // Events describe what the scheduler is doing: evals enqueued/completed,
  // allocations placed/removed/failed, node lifecycle changes, job lifecycle
  // changes, and rollout activity. Results are ordered oldest-to-newest and
  // support cursor-based polling via `after_id`.
  rpc ListEvents (ListEventsRequest) returns (ListEventsReply);

  // Streams scheduler events as they happen (server-streaming).
  //
  // When `after_id` is set, persisted events with `id > after_id` are
  // replayed first, then the live feed continues seamlessly. Clients that
  // disconnect can resume without gaps by passing the last event ID they saw.
  //
  // ACL: `operator:read`, re-checked every 30 seconds while the stream runs.
  // Once the token is revoked or expired, or its policies no longer grant
  // `operator:read`, the stream ends with that auth error.
  rpc StreamEvents (StreamEventsRequest) returns (stream SchedulerEvent);

  // Lists user-saved State Explorer query snippets.
  rpc ListSavedStateQueries (ListSavedStateQueriesRequest)
    returns (ListSavedStateQueriesReply);

  // Creates or overwrites a saved State Explorer query by name.
  rpc UpsertSavedStateQuery (UpsertSavedStateQueryRequest)
    returns (UpsertSavedStateQueryReply);

  // Deletes a saved State Explorer query by name.
  rpc DeleteSavedStateQuery (DeleteSavedStateQueryRequest)
    returns (DeleteSavedStateQueryReply);

  // === AUTH & ACL ===
  //
  // Legion's ACL system is token-based: callers present a bearer credential in
  // the `authorization` metadata header (`Bearer <secret>`). Credentials are
  // either opaque Legion ACL tokens (minted by BootstrapAcl, CreateAclToken,
  // or Login) or externally issued JWTs validated against a configured auth
  // method. Each request resolves to a set of named policies; policies contain
  // scoped allow/deny rules over resources (`job`, `node`, `kv`, `state`,
  // `operator`, `acl`) and actions (`read`, `write`).
  //
  // When ACLs are disabled (the default) every endpoint behaves as if the
  // caller held a management token.

  // Reports how the manager authenticated the caller and what access applies.
  //
  // This endpoint never requires a credential: anonymous callers receive the
  // anonymous identity. UI and CLI clients use it to discover whether ACLs are
  // enabled and to introspect the presented credential.
  rpc WhoAmI (WhoAmIRequest) returns (WhoAmIReply);

  // Exchanges login credentials for a newly minted Legion ACL token.
  //
  // Supported methods: the built-in `userpass` method (username/password
  // verified against stored ACL users) and any JWT/OIDC auth method configured
  // on the manager (`method` = the configured method name, `jwt` = the
  // externally issued token). The reply contains the token secret exactly
  // once; the manager stores only a hash of it.
  rpc Login (LoginRequest) returns (LoginReply);

  // One-time creation of the initial management token.
  //
  // Succeeds only while no management token exists; afterwards it returns
  // FAILED_PRECONDITION. Run `legion acl bootstrap` right after enabling ACLs
  // and store the returned secret safely.
  rpc BootstrapAcl (BootstrapAclRequest) returns (BootstrapAclReply);

  // Creates or replaces a named ACL policy. Requires `acl:write`.
  rpc UpsertAclPolicy (UpsertAclPolicyRequest) returns (UpsertAclPolicyReply);

  // Returns one ACL policy by exact name. Requires `acl:read`.
  rpc GetAclPolicy (GetAclPolicyRequest) returns (GetAclPolicyReply);

  // Lists all ACL policies. Requires `acl:read`.
  rpc ListAclPolicies (ListAclPoliciesRequest) returns (ListAclPoliciesReply);

  // Deletes an ACL policy by exact name. Requires `acl:write`.
  //
  // Tokens referencing the deleted policy lose the access it granted.
  rpc DeleteAclPolicy (DeleteAclPolicyRequest) returns (DeleteAclPolicyReply);

  // Creates a new ACL token attached to existing policies.
  //
  // Requires `acl:write`. Creating a `management` token additionally requires
  // the caller to hold a management token.
  rpc CreateAclToken (CreateAclTokenRequest) returns (CreateAclTokenReply);

  // Lists ACL tokens. Requires `acl:read`.
  //
  // Only accessor IDs and metadata are returned; secrets are never stored or
  // returned after creation.
  rpc ListAclTokens (ListAclTokensRequest) returns (ListAclTokensReply);

  // Deletes (revokes) an ACL token by accessor ID. Requires `acl:write`.
  rpc DeleteAclToken (DeleteAclTokenRequest) returns (DeleteAclTokenReply);

  // Creates or updates a username/password ACL user. Requires `acl:write`.
  //
  // Passwords are hashed with argon2id; plaintext is never stored.
  rpc UpsertAclUser (UpsertAclUserRequest) returns (UpsertAclUserReply);

  // Lists username/password ACL users. Requires `acl:read`.
  rpc ListAclUsers (ListAclUsersRequest) returns (ListAclUsersReply);

  // Deletes a username/password ACL user. Requires `acl:write`.
  //
  // Tokens previously minted via Login remain valid until they expire or are
  // deleted; deleting the user only prevents future logins.
  rpc DeleteAclUser (DeleteAclUserRequest) returns (DeleteAclUserReply);

  // Lists the auth methods clients may log in with.
  //
  // Open endpoint: login UIs need this before any credential exists. Only
  // public metadata is returned (names, types, OIDC client settings) —
  // never secrets or validation keys.
  rpc GetAuthMethods (GetAuthMethodsRequest) returns (GetAuthMethodsReply);

  // Creates a worker join token. Requires `node:write`.
  //
  // The reply contains a self-describing composite token (manager address +
  // secret + worker type) that introduces a worker in one command:
  // `legion join <TOKEN>`. The manager stores only a hash of the secret.
  rpc CreateJoinToken (CreateJoinTokenRequest) returns (CreateJoinTokenReply);

  // Lists worker join tokens (metadata only). Requires `node:read`.
  rpc ListJoinTokens (ListJoinTokensRequest) returns (ListJoinTokensReply);

  // Deletes (revokes) a worker join token by ID. Requires `node:write`.
  //
  // Workers already registered keep their node tokens; revocation only
  // prevents future joins with this token.
  rpc DeleteJoinToken (DeleteJoinTokenRequest) returns (DeleteJoinTokenReply);

  // Mints a boot ticket: a short-lived, narrow capability that lets an edge
  // node start one workload on its own, without any call to a manager
  // (docs/edge-boot.md). Requires `boot:write`, scoped by job name.
  //
  // The ticket is a JWT signed by the cluster's workload-identity signer and
  // verified offline by the worker against the published JWKS. It names an
  // exact job config, one task, the instance id (or a non-empty instance
  // prefix) it may start, the node pool it may run in, and the furthest gate
  // level the start may reach. Tickets are single-use by default; a second
  // ratification carrying the same `jti` is refused.
  //
  // `boot:write` is deliberately separate from `job:write`: a platform's
  // ticket minter should be able to authorize individual starts without
  // holding the right to redeploy the fleet.
  //
  // Refused with FailedPrecondition when `edgeBoot.enabled` is false on the
  // manager — minting is an explicit operator decision, because it grows a
  // compromised node's blast radius from "runs what it was given" to "runs
  // anything a live ticket names".
  rpc IssueBootTicket (IssueBootTicketRequest) returns (IssueBootTicketReply);

  // Lists outstanding boot tickets (metadata only — never the token bytes).
  // Requires `boot:read`. Rows expire with the ticket, so this is the live
  // set of capabilities the cluster has handed out.
  rpc ListBootTickets (ListBootTicketsRequest) returns (ListBootTicketsReply);

  // Ratifies a provisional allocation: the durable commit that decides who
  // really owns an instance (docs/edge-boot.md).
  //
  // Worker plane — called by the node that started the work, authenticated
  // with its node token. The manager turns the claim into an ordinary plan
  // submission with a single placement on the calling node and applies it
  // through the same transaction every other placement goes through, with
  // the same epoch compare-and-set, the same constraint re-validation, and
  // the same at-most-one-live-allocation instance binding. A refusal here is
  // that apply failing; there is no second code path for correctness.
  //
  // The reply is the verdict: `confirmed` carries the manager-minted
  // allocation id (the worker opens the network and the work becomes a normal
  // allocation), `refused` carries a machine-readable reason the worker kills
  // the work with.
  rpc RatifyClaim (RatifyClaimRequest) returns (RatifyClaimReply);
}

// Request payload for WorkerPreRegister.
message WorkerPreRegisterRequest {
  // Worker type name (for example: "default").
  //
  // This selects the worker template stored on the manager.
  // No manager-side default is applied by this RPC.
  //
  // When the caller authenticates with a join token, this must equal the
  // worker type the token was minted for; anything else is refused with
  // `PERMISSION_DENIED` (audit-only mode logs and allows it).
  string worker_type = 1;

  // Join token secret (the `secret` field of a decoded join token).
  //
  // Required when ACLs are enforced: the manager validates it against its
  // stored join tokens before serving worker configuration. Ignored when
  // ACLs are disabled.
  optional string join_token = 2;
}

// Effective worker configuration returned by pre-registration.
message WorkerConfig {
  // Worker type name that produced this config.
  string name = 1;

  // Node pool this worker belongs to.
  string pool = 2;

  // Additional dynamic node-check plugin names to execute on worker.
  //
  // Default: empty list when worker type does not specify checks.
  repeated string additional_node_checks = 3;

  // Static worker attributes injected into node config attrs at registration.
  //
  // Default: empty object `{}` when worker type does not set attributes.
  map<string, string> attributes = 4;

  // Optional prefix used when auto-generating worker IDs.
  //
  // Default: unset.
  optional string name_prefix = 5;

  // JSON-encoded total node resource overrides/capabilities.
  //
  // Default: `{}` (from worker-type storage defaults).
  string resources = 6;

  // JSON-encoded reserved resource amounts/items unavailable for scheduling.
  //
  // Default: `{}` (from worker-type storage defaults).
  string reserved_resources = 7;

  // Optional maximum number of allocations this worker should host.
  //
  // Default: unset (no explicit max allocation cap).
  optional uint32 max_allocations = 8;

  // JSON-encoded artifact fetch settings for this worker.
  //
  // Shape: `{"fetch":{"parallelism":4,"attempts":3,"timeout":"10m",
  //          "maxArtifactSize":"50GiB","allowedSchemes":["https","s3",
  //          "oci","git","file"]}}`.
  //
  // Default: empty string (worker applies conservative built-in defaults).
  string artifacts = 9;

  // JSON-encoded host volumes this worker offers to jobs (see
  // docs/volumes.md). These are paths that already exist on the machine —
  // a models directory, a dedicated NVMe mount — which jobs claim by name
  // through the `host` volume driver.
  //
  // Shape: `{"models":{"path":"/mnt/models","readOnly":true},
  //          "pgdata":{"path":"/mnt/nvme0/pg","create":true}}`.
  // `readOnly` makes a read-write claim an error rather than silently
  // downgrading it; `create` (default false) makes the worker create a
  // missing directory, which is off by default so a typo cannot silently
  // produce an empty volume where real data was meant to be.
  //
  // Default: empty string (the `host` driver reports itself unavailable on
  // this node, and jobs claiming it are rejected at admission).
  string host_volumes = 10;

  // How often this worker heartbeats the manager, in seconds (worker-type
  // config `heartbeatSeconds`). Workers clamp the value to 1..=30 and add
  // ±10% jitter per beat. The manager marks a node lost after 10s without
  // a heartbeat, so values above ~3 trade detection margin for load; the
  // manager logs a warning when serving such a config. At large fleets the
  // cadence is the manager-load knob: 10k workers at the default 2s is
  // 5,000 heartbeats/second.
  //
  // Default: unset (workers use the built-in 2s default).
  optional uint32 heartbeat_seconds = 11;

  // JSON-encoded resource-enforcement settings for this worker (see
  // docs/task-supervision.md). Shape:
  // `{"enabled":true,"cgroupParent":"legion"}`.
  //
  // When enabled, a Linux worker puts each `exec` task in a cgroup v2 subtree
  // it creates under `cgroupParent` and writes the task's `resources` there as
  // real limits (`memory.max`, `cpu.max`), instead of treating them as
  // scheduling arithmetic only. Off by default: turning declared resources
  // into kernel limits can OOM-kill a workload whose declaration was only ever
  // an estimate, so it is a deliberate per-worker choice.
  //
  // Default: empty string (enforcement off; `resources` stays advisory for
  // `exec` tasks).
  string resource_enforcement = 12;

  // JSON-encoded edge-boot settings for this worker (see docs/edge-boot.md).
  // Shape: `{"acceptClaims":true,"jwksRefresh":"5m","clockSkew":"30s"}`.
  //
  // `acceptClaims` decides whether this node serves `Worker.StartClaim` — that
  // is, whether it will start work on a boot ticket at all. Off by default,
  // independently of the manager's `edgeBoot.enabled`: an operator who turns
  // the feature on cluster-wide still chooses which nodes are edges.
  //
  // Default: empty string (this node accepts no edge starts).
  string edge_boot = 13;
}

// Reply payload for WorkerPreRegister.
message WorkerPreRegisterReply {
  // Effective worker configuration to use for this worker instance.
  //
  // Manager sets this on successful responses.
  WorkerConfig config = 1;
}

// Request payload for WorkerRegister.
message WorkerRegisterRequest {
  // Worker/node ID to register.
  //
  // With ACLs enforced, a caller authenticated by a node token (and no join
  // token) may only re-register its own node; any other name is refused with
  // `PERMISSION_DENIED`. A join token admits any name.
  string name = 1;

  // Pool assigned to this worker.
  //
  // With ACLs enforced this must match what the credential pins: the pool of
  // the join token's worker type, or (for a node-token re-registration) the
  // node's current pool. A mismatch is refused with `PERMISSION_DENIED`.
  // Audit-only mode logs the mismatch and allows it.
  string pool = 2;

  // JSON object string of node configuration attributes.
  string config_attrs = 3;

  // JSON object string of node fingerprint attributes collected on worker.
  string fingerprint_attrs = 4;

  // JSON object/string with current worker health-check results.
  string health_checks = 5;

  // Manager-populated defaults on registration (not client-provided):
  // - `status = "active"`
  // - `availability = "available"` for a new node; re-registration keeps the
  //   node's existing availability (a drained node stays drained)
  // - `dynamic_attrs = {}`
  // - `last_heartbeat = ""` until first heartbeat

  // Join token secret (the `secret` field of a decoded join token).
  //
  // Required when ACLs are enforced. Ignored when ACLs are disabled.
  optional string join_token = 6;

  // Semantic build version of the worker binary (its Cargo package version,
  // e.g. `"0.1.0"`). Informational: recorded into the node's `dynamic_attrs`
  // (`buildVersion`) so `legion node list` and the UI can surface fleet
  // version skew. Build-version differences never cause rejection; only
  // `protocol_version` gates admission.
  //
  // Default: empty string (workers built before version reporting existed).
  string build_version = 7;

  // Worker<->manager wire-protocol version this worker speaks. Bumped only
  // for breaking wire-contract changes to worker-plane RPCs.
  //
  // Skew policy (rolling upgrades are managers-first, then workers):
  // - `0` (unset — proto3 default, i.e. a worker built before versioning):
  //   accepted; the manager logs a warning.
  // - `1..=<manager's supported version>`: accepted.
  // - greater than the manager's supported version: rejected with
  //   `FAILED_PRECONDITION` — the worker was upgraded before the manager.
  //   Upgrade all managers first, then retry the worker.
  //
  // Recorded into the node's `dynamic_attrs` (`protocolVersion`) for fleet
  // observability.
  //
  // Default: `0` (see above).
  uint32 protocol_version = 8;
}

// Reply payload for WorkerRegister.
message WorkerRegisterReply {
  // Human-readable status message.
  //
  // Current manager reply value: `"Worker registered"`.
  string message = 1;

  // Per-node credential for subsequent worker-plane calls (Heartbeat,
  // HealthCheck). Minted only when ACLs are enforced; re-registering
  // rotates it (the previous node token is revoked). Workers attach it as
  // a bearer credential exactly like an ACL token.
  optional string node_token = 2;

  // Semantic build version of the manager binary that handled this
  // registration (its Cargo package version, e.g. `"0.1.0"`).
  // Informational: workers log it after registering and warn when it
  // differs from their own build version, so operators can spot skew from
  // worker logs as well as from `legion node list`.
  //
  // Empty when the manager predates version reporting.
  string manager_build_version = 3;

  // The worker<->manager wire-protocol version this manager supports (see
  // `WorkerRegisterRequest.protocol_version` for the skew policy). Workers
  // at or below this version are compatible. `0` means the manager predates
  // version reporting.
  uint32 manager_protocol_version = 4;
}

// One submission unit that contributed to a rendered jobspec.
message Submission {
  // Original submission path (file path, module path, or logical label).
  string path = 1;

  // Full submission content as text.
  string content = 2;

  // True when this submission is the primary entrypoint file.
  bool is_primary = 3;
}

// Request payload for RunJob.
message RunJobRequest {
  // Fully rendered job specification as JSON text.
  //
  // This is the canonical input consumed by manager scheduling/validation logic.
  string parsed_jobspec = 1;

  // Source submissions used to produce `parsed_jobspec`.
  repeated Submission submissions = 2;

  // Optional eval-queue priority override for THIS submission.
  //
  // Higher values are processed sooner in the eval queue. This overrides the
  // queue position only; it does not change the job's priority band, and so
  // it has no effect on preemption.
  //
  // Default when omitted: the eval priority implied by the jobspec's
  // `priority` band — `critical` 90, `high` 70, `elevated` 60, `normal` 50,
  // `low` 30, `background` 15 — falling back to the manager's
  // `defaultPriority` (50) for a job whose band cannot be resolved.
  optional int64 priority = 3;

  // When true, enqueues a reschedule even when the job spec content is unchanged.
  //
  // Default: `false`.
  bool force_reschedule = 4;

  // Optional idempotency key.
  //
  // When set and non-empty, the manager deduplicates retried requests carrying
  // the same key: the first request is applied and its outcome recorded; any
  // later request with the same key returns the recorded reply without
  // re-applying. This lets clients (especially automated agents) safely retry
  // after a timeout without risking a double submission. Unset disables
  // deduplication.
  //
  // Keys are scoped to the RPC and to the caller (the ACL token's accessor
  // ID, or the principal for JWT and anonymous callers): the same key on a
  // different RPC, or from a different caller, is a new request and never
  // replays another caller's reply. The key does not cover the request body.
  // Records are kept for 24 hours, then pruned; a retry after that is applied
  // again. Every other RPC's `idempotency_key` follows these rules.
  optional string idempotency_key = 5;
}

// Reply payload for RunJob.
message RunJobReply {
  // Human-readable outcome message (created/updated/unchanged/rollout state).
  //
  // Current manager reply values include:
  // - `"Job submit success"`
  // - `"Rollout started"`
  // - `"Rollout created; waiting for manual start"`
  // - `"Job config unchanged; no update needed"`
  // - `"Job config unchanged; forced reschedule queued"`
  string message = 1;

  // True when this reply carries a previously recorded result for the request's
  // `idempotency_key` rather than this request's own.
  //
  // Set in two cases:
  // - the recorded result was found *before* this request did any work (the
  //   ordinary retry-after-timeout case); and
  // - two requests carrying the same key raced, both missed that lookup, and
  //   this one lost — the manager records the first outcome only, so the loser
  //   is handed the winner's `message` with `deduplicated = true`. The loser's
  //   own submit is harmless (an identical spec resolves to "unchanged"), so it
  //   is corrected rather than failed.
  //
  // In both cases `message` describes the recorded outcome, not this request's.
  bool deduplicated = 2;
}

// One declared job-template variable.
//
// Declared in the template source's `variables` list and used by clients
// (UI form generation, CLI coercion) and by the manager for validation.
message JobTemplateVariable {
  // Variable key. Must match `[a-zA-Z_][a-zA-Z0-9_]*`. The rendered
  // template receives all declared keys as fields of the single `vars`
  // record its `job` function is applied to.
  string key = 1;

  // Variable type. One of: `string`, `text` (multiline string), `number`,
  // `boolean`, `select` (one of `options`), `multi_select` (list drawn
  // from `options`), `json` (any JSON value, passed through verbatim).
  string type = 2;

  // Human-readable label for forms. Defaults to `key` when empty.
  string label = 3;

  // Optional helper text shown next to the input.
  optional string description = 4;

  // Whether a value must be provided at run time. Defaults to true when
  // the variable has no default, false when it has one. A variable with
  // `required: false` and no default renders as JSON `null`.
  bool required = 5;

  // Default value as JSON text, matching `type` (for example `"draft"`,
  // `24`, `false`, `["a","b"]`). Unset means no default.
  optional string default_json = 6;

  // Allowed values for `select` / `multi_select` types; empty otherwise.
  repeated string options = 7;
}

// Metadata for one stored template version (no source).
message JobTemplateVersionInfo {
  // Version number, 1-indexed and immutable once written.
  uint32 version = 1;

  // RFC3339 creation timestamp.
  string created_at = 2;

  // Principal that created this version (token name, `user:<name>`, or
  // empty when ACLs were disabled).
  string created_by = 3;
}

// One full job template version.
message JobTemplate {
  // Template name: lowercase alphanumerics and dashes, like a job name.
  // The name is the template's identity; there is no separate display name.
  string name = 1;

  // Version number of this document.
  uint32 version = 2;

  // Latest version number that exists for this template.
  uint32 latest_version = 3;

  // Optional user-facing description from the template manifest.
  optional string description = 4;

  // Raw Nickel source of this version.
  string source_nickel = 5;

  // Declared variables from the manifest, in declaration order.
  repeated JobTemplateVariable variables = 6;

  // RFC3339 creation timestamp of this version.
  string created_at = 7;

  // Principal that created this version.
  string created_by = 8;
}

// Latest-version summary row for ListJobTemplates.
message JobTemplateSummary {
  // Template name.
  string name = 1;

  // Latest version number.
  uint32 latest_version = 2;

  // Description from the latest version.
  optional string description = 3;

  // Number of declared variables in the latest version.
  uint32 variable_count = 4;

  // RFC3339 timestamp of the latest version's creation.
  string updated_at = 5;
}

// Provenance of a job config that was produced by RunJobTemplate.
message JobTemplateProvenance {
  // Template name.
  string name = 1;

  // Template version that rendered the config.
  uint32 version = 2;
}

// Request payload for UpsertJobTemplate.
message UpsertJobTemplateRequest {
  // Template name. Creating a name that already exists appends the next
  // version; versions are never overwritten.
  string name = 1;

  // Full Nickel source. Must be self-contained (imports are rejected) and
  // at most 512 KiB. See JobTemplate for the required document shape.
  string source_nickel = 2;
}

// Reply payload for UpsertJobTemplate.
message UpsertJobTemplateReply {
  // The stored version.
  JobTemplate template = 1;
}

// Request payload for ListJobTemplates.
message ListJobTemplatesRequest {
  // Optional case-insensitive substring filter over name and description.
  optional string query = 1;
}

// Reply payload for ListJobTemplates.
message ListJobTemplatesReply {
  // Templates the caller may read, most recently updated first.
  repeated JobTemplateSummary templates = 1;
}

// Request payload for GetJobTemplate.
message GetJobTemplateRequest {
  // Template name (exact match).
  string name = 1;

  // Version to fetch. Omit for the latest.
  optional uint32 version = 2;
}

// Reply payload for GetJobTemplate.
message GetJobTemplateReply {
  // The requested version.
  JobTemplate template = 1;

  // All stored versions of this template, newest first.
  repeated JobTemplateVersionInfo versions = 2;
}

// Request payload for DeleteJobTemplate.
message DeleteJobTemplateRequest {
  // Template name (exact match). Deletes every version.
  string name = 1;
}

// Reply payload for DeleteJobTemplate.
message DeleteJobTemplateReply {
  // Human-readable status message.
  string message = 1;
}

// Request payload for RenderJobTemplate.
message RenderJobTemplateRequest {
  // Template name.
  string name = 1;

  // Version to render. Omit for the latest.
  optional uint32 version = 2;

  // Variable values as a JSON object keyed by variable key, for example
  // `{"scene": "s3://bucket/x", "frames": 48}`. Values are validated
  // against the declared types; strings are leniently coerced (`"48"`
  // satisfies a `number`). At most 64 KiB.
  string variables_json = 3;
}

// Reply payload for RenderJobTemplate.
message RenderJobTemplateReply {
  // The rendered jobspec as JSON text, exactly what RunJobTemplate would
  // submit with the same inputs.
  string rendered_jobspec = 1;

  // Name of the job the rendered spec declares.
  string job_name = 2;
}

// Request payload for RunJobTemplate.
message RunJobTemplateRequest {
  // Template name.
  string name = 1;

  // Version to render. Omit for the latest.
  optional uint32 version = 2;

  // Variable values as a JSON object keyed by variable key (see
  // RenderJobTemplateRequest.variables_json).
  string variables_json = 3;

  // Optional eval priority override (see RunJobRequest.priority).
  optional int64 priority = 4;

  // When true, enqueues a reschedule even when the rendered spec is
  // unchanged. Default: `false`.
  bool force_reschedule = 5;

  // Optional idempotency key (see RunJobRequest.idempotency_key).
  optional string idempotency_key = 6;
}

// Reply payload for RunJobTemplate.
message RunJobTemplateReply {
  // Human-readable outcome message (same vocabulary as RunJobReply).
  string message = 1;

  // True when replayed from a previously recorded idempotent result.
  bool deduplicated = 2;

  // Name of the job that was created or updated.
  string job_name = 3;

  // Job config ID produced (or matched, when unchanged) by this run.
  string job_config_id = 4;
}

// Request payload for GetJobInfo.
message GetJobInfoRequest {
  // Job name (also used as job ID in current manager implementation).
  string name = 1;
}

// Reply payload for GetJobInfo.
message GetJobInfoReply {
  // Job metadata for the requested job.
  //
  // Manager returns NotFound instead of returning this field unset.
  Job job = 1;

  // Template that rendered the job's latest config, when it was submitted
  // via RunJobTemplate. Unset for raw RunJob submissions.
  optional JobTemplateProvenance template = 2;
}

// Request payload for ListRollouts.
message ListRolloutsRequest {
  // Optional job ID filter.
  //
  // When omitted (or blank), rollouts for all jobs are returned.
  optional string job_id = 1;

  // When true, only active (non-terminal) rollouts are returned.
  //
  // Default: `false` (returns both active and terminal rollouts).
  bool active_only = 2;

  // Free-text search against rollout ID, job ID, status, and strategy fields.
  optional string query = 3;

  // Sort key. Supported values: `updated_at`, `created_at`, `status`, `job_id`.
  //
  // Default: `updated_at`.
  optional string sort_by = 4;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `desc`.
  optional string sort_order = 5;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 6;

  // Maximum rollouts returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 7;
}

// Rollout record.
message Rollout {
  // Unique rollout ID.
  int64 id = 1;

  // Job ID this rollout belongs to.
  string job_id = 2;

  // Previous job config ID being replaced (if any).
  optional string from_job_config_id = 3;

  // Target job config ID for this rollout.
  string to_job_config_id = 4;

  // Rollout status.
  //
  // Common values include: pending, running, waiting_manual_start,
  // waiting_manual_advance, completed, failed, cancelled, completed_incomplete.
  string status = 5;

  // True when rollout finished but did not fully reach desired target.
  bool incomplete = 6;

  // Human-readable rollout status message.
  string message = 7;

  // Strategy plugin name used to resolve rollout behavior.
  optional string strategy = 8;

  // Progression mode (for example: auto/manual) as stored by manager.
  optional string progression = 9;

  // Replacement mode (for example: createFirst/destroyFirst) as stored by manager.
  optional string replacement = 10;

  // Whether rollout prefers in-place replacement behavior.
  optional bool in_place = 11;

  // JSON-encoded rollout envelope/config/runtime state.
  string config_json = 12;

  // RFC3339 creation timestamp.
  string created_at = 13;

  // RFC3339 update timestamp.
  string updated_at = 14;

  // RFC3339 completion timestamp for terminal rollouts.
  optional string completed_at = 15;
}

// Reply payload for ListRollouts.
message ListRolloutsReply {
  // Matching rollout records for the requested page.
  repeated Rollout rollouts = 1;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;
}

// Request payload for GetRollout.
message GetRolloutRequest {
  // Rollout ID.
  int64 id = 1;
}

// Reply payload for GetRollout.
message GetRolloutReply {
  // Rollout when found; unset when not found.
  optional Rollout rollout = 1;
}

// Allocation-level status as seen in a rollout group status response.
message RolloutAllocationStatus {
  // Allocation ID.
  int64 allocation_id = 1;

  // Node hosting this allocation.
  string node_id = 2;

  // Task config ID backing this allocation.
  int64 task_config_id = 3;

  // Task name for display and filtering.
  string task_name = 4;

  // Task group name.
  string task_group = 5;

  // Task lifecycle (for example: service, batch, sidecar).
  string lifecycle = 6;

  // Allocation runtime status string.
  string status = 7;

  // Rollout role for this allocation, typically replacement or replacee.
  string role = 8;

  // Optional derived node health flag at query time.
  optional bool node_healthy = 9;

  // Optional allocation health flag from latest worker snapshot.
  optional bool allocation_healthy = 10;

  // Optional allocation health status text from latest worker snapshot.
  optional string allocation_health = 11;

  // Optional JSON-encoded per-artifact staging states from the latest worker
  // snapshot. Same payload as `AllocationHealth.artifact_states`: an array of
  // `{"name","source","state","bytesFetched","bytesTotal","digest",
  //   "attempts","durationMs","error"}` objects.
  //
  // Unset when the allocation's task declares no artifacts or no snapshot
  // has been received yet.
  optional string artifact_states = 12;
}

// Group-level rollout status.
message RolloutGroupStatus {
  // Group name.
  string group = 1;

  // Current step index (0-based in runtime state, API returns current numeric index).
  uint32 step_index = 2;

  // Total number of computed rollout steps for this group.
  uint32 total_steps = 3;

  // Number of queued manual-advance credits for this group.
  uint32 pending_manual_advances = 4;

  // Allocations participating in this group's rollout.
  repeated RolloutAllocationStatus allocations = 5;
}

// Request payload for GetRolloutStatus.
message GetRolloutStatusRequest {
  // Rollout ID.
  int64 id = 1;
}

// Reply payload for GetRolloutStatus.
message GetRolloutStatusReply {
  // Rollout record when found.
  optional Rollout rollout = 1;

  // Per-group runtime status.
  repeated RolloutGroupStatus groups = 2;
}

// Rollout event record.
message RolloutEvent {
  // Event ID.
  int64 id = 1;

  // Rollout ID this event belongs to.
  int64 rollout_id = 2;

  // Job ID this event belongs to.
  string job_id = 3;

  // Optional task group this event is scoped to.
  optional string group_name = 4;

  // Event severity level (for example: info, warn, error).
  string level = 5;

  // Human-readable event message.
  string message = 6;

  // JSON metadata payload as string.
  string metadata_json = 7;

  // RFC3339 creation timestamp.
  string created_at = 8;
}

// Request payload for ListRolloutEvents.
message ListRolloutEventsRequest {
  // Rollout ID.
  //
  // Must be greater than 0.
  int64 rollout_id = 1;

  // Optional maximum number of events to return.
  //
  // Default when omitted: `500`.
  // Manager bounds: clamped to `[1, 2000]`.
  optional uint32 limit = 2;
}

// Reply payload for ListRolloutEvents.
message ListRolloutEventsReply {
  // Ordered rollout events (oldest to newest within the returned window).
  repeated RolloutEvent events = 1;
}

// Request payload for AdvanceRollout.
message AdvanceRolloutRequest {
  // Rollout ID.
  int64 id = 1;

  // Group names to advance.
  //
  // Empty (default) means advance all groups in the rollout.
  repeated string groups = 2;

  // Optional eval priority for generated rollout tick work.
  //
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 3;
}

// Reply payload for AdvanceRollout.
message AdvanceRolloutReply {
  // Human-readable queue/advance message.
  //
  // Current manager reply value: `"Rollout advance queued"`.
  string message = 1;

  // Updated rollout record after queuing manual advance.
  optional Rollout rollout = 2;
}

// Request payload for StopRollout.
message StopRolloutRequest {
  // Rollout ID to stop.
  int64 id = 1;

  // When true, remove allocations for the rollout target config and re-schedule from
  // the rollout source config (when present).
  bool revert = 2;

  // Optional eval priority for any rollback scheduling.
  //
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 3;
}

// Reply payload for StopRollout.
message StopRolloutReply {
  // Human-readable stop/revert message.
  string message = 1;

  // Updated rollout record after stop processing.
  optional Rollout rollout = 2;
}

// Request payload for GetJobSpec.
message GetJobSpecRequest {
  // Job name.
  string name = 1;
}

// Request payload for GetJobSpecByConfig.
message GetJobSpecByConfigRequest {
  // Job config ID.
  string config_id = 1;
}

// Reply payload for GetJobSpec.
message GetJobSpecReply {
  // Submissions associated with the latest job config.
  //
  // Field number intentionally remains `2` for compatibility.
  repeated Submission submissions = 2;
}

// One job spec history entry.
message JobSpecHistoryItem {
  // Job config ID.
  string config_id = 1;

  // RFC3339 timestamp when config was created.
  string created_at = 2;

  // Monotonic config version.
  optional int64 version = 3;

  // Template that rendered this config, when it was submitted via
  // RunJobTemplate. Unset for raw RunJob submissions.
  optional JobTemplateProvenance template = 4;
}

// Request payload for ListJobSpecHistory.
message ListJobSpecHistoryRequest {
  // Job name.
  string name = 1;
}

// Reply payload for ListJobSpecHistory.
message ListJobSpecHistoryReply {
  // History in newest-first order.
  repeated JobSpecHistoryItem items = 1;
}

// Request payload for PlanJob.
message PlanJobRequest {
  // Fully rendered jobspec JSON to plan.
  string parsed_jobspec = 1;
}

// Reply payload for PlanJob.
message PlanJobReply {
  // Planned allocations for display.
  repeated PlannedAllocation allocations = 1;

  // Human-readable planning summary.
  string message = 2;

  // True when a job with the same name already exists.
  bool matches_existing = 3;

  // True when existing config is content-identical to planned config.
  bool same_content = 4;

  // Per-task scheduling-index usage for this plan: which declared index (if
  // any) generated each task's placement candidates, and why not when none
  // did. One entry per task the plan considered. See
  // docs/scheduling-indexes.md for the model.
  repeated TaskIndexUsage index_usage = 5;

  // Allocations this plan would displace to make room for `allocations`.
  //
  // Empty when the plan places without preemption, which is the common case:
  // the preemption pass only runs for a task that could not otherwise be
  // placed. Populated in `enforce` mode (what a submit would evict) and in
  // `observe` mode (what enforce mode *would* evict, given that observe
  // commits nothing) — so the preview answers the same question either way.
  //
  // This is a plan against a snapshot, not a reservation. The real submit
  // re-plans, so the victims it takes may differ if the cluster moved in
  // between. See docs/preemption-and-eviction.md.
  repeated PlannedPreemption preemptions = 6;

  // The cluster's preemption mode at plan time: `enforce`, `observe` or
  // `off`. Present so a client can explain an empty `preemptions` list —
  // "nothing needed displacing" and "preemption is off" look identical
  // otherwise, which is exactly the discoverability failure this field
  // exists to prevent.
  string preemption_mode = 7;
}

// One allocation a plan would displace.
message PlannedPreemption {
  // Node the victim runs on, which is also the node the preemptor would be
  // placed on: preemption only ever frees the node it places onto.
  string node_id = 1;

  // Victim's job name.
  string job_id = 2;

  // Victim's task name.
  string task_name = 3;

  // Victim's priority band. Always strictly below the preempting job's.
  string band = 4;

  // Victim's allocation ID.
  int64 allocation_id = 5;

  // The victim's `stop.killAfter` in seconds — how long it gets between the
  // stop signal and SIGKILL (docs/graceful-stop.md).
  uint64 kill_after_seconds = 6;
}

// How candidate construction went for one planned task — the scheduling
// index's explain record. The scan (a full pass over every available node)
// remains the authoritative fallback; these fields describe whether and how
// an index short-circuited it.
message TaskIndexUsage {
  // Task the entry describes.
  string task_name = 1;

  // Name of the index that served candidates (e.g. the built-in "fit"), or
  // empty when the plain scan ran.
  string index = 2;

  // "on" when the index generated the candidates, "shadow" when it ran
  // alongside the authoritative scan for comparison. Empty when no index
  // participated.
  string mode = 3;

  // Number of candidate nodes handed to placement scoring.
  uint32 candidates = 4;

  // True when the candidate list was cut to the per-task budget, keeping the
  // index's nearest-fit-first order.
  bool truncated = 5;

  // Times placement exhausted a truncated candidate list and widened back to
  // the full scan mid-task.
  uint32 refills = 6;

  // True when the scan ended up serving after the index came up short
  // (empty coverage, or a truncated list that ran dry).
  bool fell_back = 7;

  // Shadow mode only: whether the index's candidate set matched the scan's
  // exactly. Absent outside shadow mode.
  optional bool shadow_agreement = 8;

  // Why no index served when one might have been expected to — e.g.
  // "no usable index: gpu needs [region]". Empty otherwise.
  string reason = 9;

  // When bounded candidate scoring engaged for any of this task's
  // placements (the fleet-size threshold in the manager's
  // `schedulerSettings.score_sample` was met), the number of eligible
  // nodes actually scored per placement: the placement is the best of
  // this many uniformly drawn feasible candidates rather than of every
  // feasible node. 0 means every placement was scored exactly.
  // Feasibility (constraints, permits, resources) is never sampled — a
  // sampled placement is always a valid one.
  uint32 score_sampled = 10;
}

// Planned allocation display item.
message PlannedAllocation {
  // Target node ID.
  string node_id = 1;

  // Task config ID in the planned context.
  int64 task_config_id = 2;

  // Task name for readability.
  string task_name = 3;

  // Ranked candidate node IDs for this placement, best first; the first
  // entry is always node_id. At apply time the store binds the placement to
  // the first candidate whose node epoch is unchanged since planning, so
  // under contention the allocation may land on a lower-ranked
  // (near-equivalent by score) candidate instead of node_id. A single entry
  // means no fallback: the placement applies to node_id or the plan is
  // rejected and retried. Empty only when the manager predates candidate
  // lists. Controlled by schedulerSettings.plan_candidates; see
  // docs/late-binding-plan-apply.md.
  repeated string candidate_nodes = 4;
}

// Request payload for StopJob.
message StopJobRequest {
  // Job name.
  string name = 1;

  // Optional eval priority override.
  //
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 3;
}

// Reply payload for StopJob.
message StopJobReply {
  // Human-readable status message.
  //
  // Current manager reply format: `"Stopped <job-name>"`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for ScaleTask (docs/autoscaling.md).
message ScaleTaskRequest {
  // Job name.
  string name = 1;

  // Task group, when the job has more than one scalable task. Optional:
  // a job with exactly one scalable task needs neither selector; an
  // ambiguous request is rejected with the candidate list.
  optional string task_group = 2;

  // Task name, same rules as `task_group`.
  optional string task_name = 3;

  // The desired count. Required unless `reset` is set. Keyed stateful
  // tasks (no count) and `count: { per: ... }` tasks are rejected.
  optional uint32 count = 4;

  // Drop the override (and any pending scale-in) and return ownership of
  // the count to the job spec. Mutually exclusive with `count`.
  bool reset = 5;

  // Free-text audit note recorded on the override and in the
  // `scale.applied` event.
  optional string reason = 6;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 7;
}

// Reply payload for ScaleTask.
message ScaleTaskReply {
  // Human-readable outcome, e.g.
  // `"web/default/web: 4 -> 6 (spec count 2; override active)"` or the
  // deferral notice
  // `"deferred: rollout web-7 is in progress; scale-in to 2 applies when it completes"`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;

  // True when the request was a scale-in during an active rollout and was
  // recorded as pending rather than applied (see ScaleTask's RPC comment).
  bool deferred = 3;
}

// Request payload for GetJobScaleStatus.
message GetJobScaleStatusRequest {
  // Job name.
  string name = 1;
}

// One task's scale state (GetJobScaleStatus).
message TaskScaleStatus {
  // Task group name.
  string task_group = 1;

  // Task name.
  string task_name = 2;

  // The spec's `count.num` in the latest job config version.
  uint32 spec_count = 3;

  // The applied override count, when one exists.
  optional uint32 override_count = 4;

  // A recorded scale-in waiting for the active rollout to finish, when
  // one exists.
  optional uint32 pending_count = 5;

  // The count the scheduler currently converges to
  // (`override_count` if set, else `spec_count`).
  uint32 effective_count = 6;

  // Who set the override: `operator` today; `autoscaler` when the policy
  // evaluator ships.
  string source = 7;

  // The audit note recorded with the override, if any.
  string reason = 8;

  // RFC 3339 timestamp of the last override write; empty when no
  // override exists.
  string updated_at = 9;
}

// Reply payload for GetJobScaleStatus.
message GetJobScaleStatusReply {
  // One entry per task in the job's latest config, spec-order.
  repeated TaskScaleStatus tasks = 1;
}

// Request payload for DestroyJob.
message DestroyJobRequest {
  // Job name.
  string name = 1;

  // Reserved for future eval-priority support.
  //
  // Current manager implementation ignores this field.
  optional int64 priority = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 3;
}

// Reply payload for DestroyJob.
message DestroyJobReply {
  // Human-readable status message.
  //
  // Current manager reply format: `"Destroyed <job-name>"`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for CreateInstance.
message CreateInstanceRequest {
  // Job name (also used as job ID in current manager implementation). The
  // job's latest config must declare at least one keyed-mode stateful task.
  string job_id = 1;

  // Optional task-group filter used to resolve the target task.
  //
  // May be omitted when the job has exactly one keyed task. Required (along
  // with `task` when a group holds several keyed tasks) whenever the keyed
  // task would otherwise be ambiguous; ambiguity is rejected with
  // InvalidArgument rather than guessed.
  optional string group = 2;

  // Optional task-name filter used to resolve the target task. Same
  // disambiguation rules as `group`.
  optional string task = 3;

  // Optional caller-supplied instance key.
  //
  // Must match `[A-Za-z0-9._-]{1,128}` and must not collide with any
  // existing instance id of any job — including Terminated tombstones
  // (destroyed ids are never reusable). Required when the task declares
  // `stateful.idSource: "caller"`; optional otherwise (the server mints an
  // id when absent). A valid explicit key is always honored regardless of
  // `idSource`.
  optional string instance_id = 4;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. The
  // recorded replay carries the originally created instance id.
  optional string idempotency_key = 5;
}

// Reply payload for CreateInstance.
message CreateInstanceReply {
  // The created instance's stable id (caller-supplied or server-minted).
  // This is the value the task sees as `LEGION_INSTANCE_ID` and the key its
  // storage handle and workload identity bind to.
  string instance_id = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for CreateInstances (atomic batch create).
message CreateInstancesRequest {
  // Job name (also used as job ID in current manager implementation). The
  // job's latest config must declare at least one keyed-mode stateful task.
  string job_id = 1;

  // Optional task-group filter used to resolve the target task. Same
  // disambiguation rules as `CreateInstanceRequest.group`.
  optional string group = 2;

  // Optional task-name filter used to resolve the target task. Same
  // disambiguation rules as `CreateInstanceRequest.task`.
  optional string task = 3;

  // Explicit instance keys to create. Each must match
  // `[A-Za-z0-9._-]{1,128}` and must not collide with any existing instance
  // id (including Stopped instances and Terminated tombstones) nor repeat
  // within this list. Any violation fails the WHOLE call (nothing is
  // created), naming the offending id. May be empty when `count > 0`.
  repeated string instance_ids = 4;

  // Number of additional server-minted instances to create on top of
  // `instance_ids`. Rejected (InvalidArgument) when the task declares
  // `stateful.idSource: "caller"`, which requires caller-supplied ids. At
  // least one of `instance_ids` / `count` must be non-empty/non-zero.
  uint32 count = 5;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. The
  // recorded replay carries the originally created instance ids.
  optional string idempotency_key = 6;
}

// Reply payload for CreateInstances.
message CreateInstancesReply {
  // Every instance id created by this call, in request order: the explicit
  // `instance_ids` first, then the `count` server-minted ids. On failure
  // nothing is created and this RPC returns an error status instead.
  repeated string instance_ids = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for DestroyInstance.
message DestroyInstanceRequest {
  // Stable instance id to destroy. Must reference a keyed-mode instance.
  string instance_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for DestroyInstance.
message DestroyInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply values:
  // - `"Destroyed instance <id>"` — terminated by this request.
  // - `"Instance <id> already terminated"` — no-op on a tombstone.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for StopInstance.
message StopInstanceRequest {
  // Stable instance id to stop. Must reference a keyed-mode instance that is
  // not Terminated (tombstones can never be stopped or restarted).
  string instance_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for StopInstance.
message StopInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply values:
  // - `"Stopped instance <id>"` — stopped by this request.
  // - `"Instance <id> already stopped"` — no-op on a stopped instance.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for StartInstance.
message StartInstanceRequest {
  // Stable instance id to start. Must reference a keyed-mode instance that
  // is not Terminated, on a job that is not stopped.
  string instance_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for StartInstance.
message StartInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply values:
  // - `"Started instance <id>"` — moved stopped -> pending and queued for
  //  placement by this request.
  // - `"Instance <id> already running"` — no-op on a live
  //  (pending/active/rescheduling) instance.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for ReplaceInstance.
message ReplaceInstanceRequest {
  // Stable instance id whose lost-node allocation to force-replace. Must
  // reference an instance whose current allocation sits on a `lost` node.
  string instance_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for ReplaceInstance.
message ReplaceInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply value:
  // - `"Replacing instance <id>: freed allocation <alloc> on lost node
  //   <node>"` — the gate was overridden and a reschedule eval enqueued.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// One stateful instance (see docs/stateful-workloads.md). An instance is the
// stable identity one level above an allocation: it survives reschedules,
// owns the storage binding, and feeds the workload-identity subject.
message InstanceInfo {
  // Stable id, unique within the cluster. Slot mode: the deterministic
  // `{job}-{group}-{slot}` ordinal id. Keyed mode: the caller-supplied or
  // server-minted key, never recycled after destroy.
  string instance_id = 1;

  // Owning job name.
  string job_id = 2;

  // Task group the instance belongs to.
  string group = 3;

  // Task name the instance currently belongs to (informational; identity is
  // keyed by `instance_id`).
  string task = 4;

  // Id-assignment mode: `slot` or `keyed`.
  string mode = 5;

  // Lifecycle state: `pending` (never placed, or queued for re-placement
  // after StartInstance), `active` (live allocation), `rescheduling` (lost
  // its allocation; a replacement will re-bind the same id and storage),
  // `stopped` (keyed only: paused via StopInstance or a job stop; row and
  // storage handle retained, id still owned, revivable via StartInstance),
  // or `terminated` (slot scale-in / keyed destroy / job destroy; rows
  // retained — keyed tombstones forever).
  string state = 6;

  // Ordinal slot index `0..count.num-1`; present only in slot mode.
  optional uint32 slot_index = 7;

  // The allocation currently fulfilling this instance, if any.
  optional int64 current_alloc_id = 8;

  // Opaque persistent-storage handle bound to the instance, when the task
  // declares `stateful.storage`. Stable across reschedules and retained
  // while `stopped` (StopInstance / job stop). Dropped on keyed destroy;
  // retained on slot scale-in unless `retainOnScaleIn: false`, and retained
  // on job stop unless `retainOnStop: false` (slot mode only; the K8s
  // `whenDeleted` analog — job destroy always deletes every instance row).
  optional string storage_handle = 9;

  // RFC3339 creation timestamp.
  string created_at = 10;

  // RFC3339 timestamp of the last state/binding change.
  string updated_at = 11;

  // Diagnostic detail explaining a non-obvious lifecycle situation; unset in
  // the common case. Two producers, and they never apply at once:
  //
  // - `pending-loss-confirmation: ...` — the instance's current allocation
  //   sits on a `lost` node and the manager is waiting out
  //   `stateful.onLost.replaceAfter` (or `replaceAfter: "never"` requires node
  //   recovery / ReplaceInstance) before rebinding it. The instance stays
  //   `active` while gated — its workload may well still be running on the
  //   partitioned node. See docs/stateful-workloads.md "Node loss and fencing".
  //
  // - `volume-pinned: ...` — the instance is awaiting placement and holds
  //   node-local storage, so it can only be placed on the node holding its
  //   data. It waits for that node rather than starting on empty storage;
  //   `legion volume delete --force <id>` abandons the data and frees the
  //   instance to place elsewhere. See docs/volumes.md.
  optional string detail = 12;
}

// Request payload for ListInstances.
message ListInstancesRequest {
  // Job name whose instances to list.
  string job_id = 1;

  // Optional exact-match group filter.
  optional string group = 2;
}

// Reply payload for ListInstances.
message ListInstancesReply {
  // Instances ordered by group, slot index, then instance id. Includes
  // Terminated rows (tombstones).
  repeated InstanceInfo instances = 1;
}

// Request payload for GetInstance.
message GetInstanceRequest {
  // Stable instance id to fetch.
  string instance_id = 1;
}

// Reply payload for GetInstance.
message GetInstanceReply {
  // The requested instance. Manager returns NotFound instead of returning
  // this field unset.
  InstanceInfo instance = 1;

  // A node has started this instance but the placement is not durable yet
  // (docs/edge-boot.md). Set only while a claim is live and unratified; the
  // moment it is confirmed the instance has an ordinary `current_alloc_id`
  // and this goes away.
  //
  // This is what makes "started but not yet confirmed" a state an operator or
  // an agent can see, rather than an instance that inexplicably has no
  // allocation while a sandbox is demonstrably running on a node.
  //
  // Derived from the reporting node's last heartbeat and held in manager
  // memory, so after a manager failover it is unset until that node's next
  // heartbeat — briefly incomplete, never wrong.
  ProvisionalClaimReport provisional = 2;

  // Node holding that claim. Empty when `provisional` is unset.
  string provisional_node_id = 3;
}

// === VOLUME MESSAGES (see docs/volumes.md) ===

// One volume: the concrete storage behind an instance's opaque
// `{driver}/{volume_id}` storage handle.
message VolumeInfo {
  // Volume id — the second half of the storage handle.
  string volume_id = 1;

  // Declared name within its task. `data` for the per-instance volume that
  // comes from `stateful.storage`; otherwise the name from `volumes[]`.
  string name = 2;

  // Volume driver that materializes it (`local-dir`, `host`, `nfs`, `tmpfs`,
  // or an installed exec driver).
  string driver = 3;

  // Owning job, when the volume belongs to one.
  optional string job_id = 4;

  // The instance whose lifecycle owns this volume. Unset for volumes that
  // outlive any instance.
  optional string instance_id = 5;

  // Task the volume was declared on.
  optional string task_name = 6;

  // Lifecycle state:
  // - `pending`: the row and handle exist; no worker has materialized it yet
  //   (provisioning is lazy — the first mount creates the storage);
  // - `created`: a worker mounted it at least once, and `node_id` is set;
  // - `destroying`: reclaim requested; a worker runs the driver's `destroy`
  //   and confirms (re-dispatched every heartbeat until it does);
  // - `destroyed`: reclaimed. The row is kept as a tombstone.
  string state = 7;

  // Node the volume lives on. For node-local drivers this is a hard placement
  // constraint on the owning instance from the moment it is set: a
  // replacement allocation can only be placed on this node.
  optional string node_id = 8;

  // True when the volume only exists on `node_id`, so its instance can only be
  // replaced there. False for network storage (`nfs`), whose instances
  // reschedule freely.
  bool node_local = 9;

  // True when the volume is mounted read-only.
  bool read_only = 10;

  // How the volume is handed to its consumer: `filesystem` (a host directory
  // the task reads directly) or `block` (a raw device or disk image the task
  // attaches — what a microVM runtime needs). The same split Kubernetes makes
  // with `volumeMode`, for the same reason. See docs/volumes.md.
  string volume_mode = 17;

  // Block mode: the filesystem the device carries (`ext4`). Unset for
  // filesystem-mode volumes.
  optional string fs = 18;

  // JSON object of the driver params the volume was created with.
  string params = 11;

  // JSON object of driver-recorded metadata (an NFS source, a dataset name),
  // handed back to the driver on every later operation.
  string attrs = 12;

  // Host path from the most recent successful mount. Diagnostic only — the
  // driver is always asked again rather than trusting this.
  optional string mount_path = 13;

  // Last driver failure, so a stuck volume explains itself here rather than
  // only in a worker log.
  optional string last_error = 14;

  // RFC3339 creation timestamp.
  string created_at = 15;

  // RFC3339 timestamp of the last state change.
  string updated_at = 16;
}

// Request payload for ListVolumes. Every filter is optional; omitting all of
// them lists the whole cluster.
message ListVolumesRequest {
  // Only volumes owned by this job.
  optional string job_id = 1;

  // Only volumes currently living on this node.
  optional string node_id = 2;

  // Only volumes materialized by this driver.
  optional string driver = 3;

  // Only volumes owned by this instance.
  optional string instance_id = 4;

  // Only volumes in this state (`pending`, `created`, `destroying`,
  // `destroyed`).
  optional string state = 5;
}

// Reply payload for ListVolumes.
message ListVolumesReply {
  // Matching volumes, newest first.
  repeated VolumeInfo volumes = 1;
}

// Request payload for GetVolume.
message GetVolumeRequest {
  // Volume id to fetch.
  string volume_id = 1;
}

// Reply payload for GetVolume.
message GetVolumeReply {
  // The requested volume. Manager returns NotFound instead of returning this
  // field unset.
  VolumeInfo volume = 1;
}

// Request payload for DeleteVolume.
message DeleteVolumeRequest {
  // Volume id to delete.
  string volume_id = 1;

  // Skip driver confirmation and mark the volume destroyed immediately. Use
  // only when the owning node is gone for good: whatever bytes exist there are
  // left behind.
  bool force = 2;

  // Optional idempotency key; a repeat with the same key returns the first
  // result and reports `deduplicated`.
  optional string idempotency_key = 3;
}

// Reply payload for DeleteVolume.
message DeleteVolumeReply {
  // The volume after the request, in `destroying` (queued for its driver) or
  // `destroyed` (forced).
  VolumeInfo volume = 1;

  // Human-readable acknowledgement.
  string message = 2;

  // True when an idempotency key replayed a previous call.
  bool deduplicated = 3;
}

// Request payload for ListVolumeDrivers.
message ListVolumeDriversRequest {
}

// One volume driver as the cluster sees it, aggregated from worker
// fingerprints.
message VolumeDriverInfo {
  // Driver name, as used in `stateful.storage.driver` / `volumes[].driver`.
  string name = 1;

  // True when the driver's volumes only exist on the node that created them,
  // so instances holding one are pinned there.
  bool node_local = 2;

  // True when volume contents do NOT survive an unmount (`tmpfs`). Rejected
  // for `stateful.storage`, which promises data survives reschedules.
  bool ephemeral = 3;

  // Access modes the driver supports (`single-writer`, `multi-reader`).
  repeated string access_modes = 4;

  // Params a job MUST supply. Admission names any that are missing.
  repeated string required_params = 5;

  // Params a job MAY supply.
  repeated string optional_params = 6;

  // Volume modes this driver can serve (`filesystem`, `block`). Admission
  // intersects this with the task runtime's supported modes and the job's
  // requested mode, so a mismatch is a submit-time error rather than a task
  // that starts and immediately fails.
  repeated string volume_modes = 10;

  // Optional contract operations this driver implements beyond the required
  // four (`snapshot`, `restore`, `clone`, `expand`). Empty for a driver that
  // implements only the required set.
  repeated string ops = 11;

  // One line of human-readable context: what the driver does, or why it is
  // unusable on the nodes that have it.
  string detail = 7;

  // Every node with the driver installed, including ones where it is unusable
  // (no `mount` binary, wrong OS, no host volumes declared).
  repeated string nodes = 8;

  // Nodes where the driver is installed AND usable — the set placement can
  // actually use.
  repeated string available_nodes = 9;
}

// Reply payload for ListVolumeDrivers.
message ListVolumeDriversReply {
  // Installed drivers, sorted by name.
  repeated VolumeDriverInfo drivers = 1;
}

// Request payload for ListJobs.
message ListJobsRequest {
  // Free-text search against job name, ID, and status.
  optional string query = 1;

  // Sort key. Supported values: `name`, `status`, `created_at`, `updated_at`.
  //
  // Default: `updated_at`.
  optional string sort_by = 2;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `desc`.
  optional string sort_order = 3;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 4;

  // Maximum jobs returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 5;

  // Keep only jobs whose status equals this value (case-insensitive, exact —
  // `run` does not match `running`; use `query` for substring search).
  // Applied after `query` and before paging, so `total_count` reflects the
  // filtered set. Omit or leave empty to return every status.
  optional string status = 6;
}

// Job metadata record.
message Job {
  // Job ID.
  string id = 1;

  // Job name.
  string name = 2;

  // Job status string.
  //
  // Current values written by manager include: done, stopped, failed.
  string status = 3;

  // Unix timestamp (seconds) when job was created. Immutable for the life of
  // the job — resubmitting a new spec version does not move it.
  int64 created_at = 4;

  // Unix timestamp (seconds) of the last change to the job, and the value the
  // UI's "Updated" column shows. Stamped when a new spec version is submitted
  // and on every status transition the manager records (`stopped`, `failed`,
  // recovery back to `done`, and an acknowledged restart request). Never
  // moved by allocation churn, heartbeats, or reads.
  //
  // Equals `created_at` for a job that has not changed since submission, and
  // for rows written by a manager older than the column (backfilled once at
  // migration time).
  int64 updated_at = 5;

  // Priority band of the job's latest config: `critical`, `high`,
  // `elevated`, `normal` (the default), `low`, or `background`.
  //
  // The band orders the eval queue and governs preemption: an allocation may
  // only ever be displaced by a job in a STRICTLY higher band, never by a
  // peer. See docs/preemption-and-eviction.md. Empty only when read from a
  // manager that predates bands.
  string priority = 6;
}

// Reply payload for ListJobs.
message ListJobsReply {
  // Jobs known to manager for the requested page.
  repeated Job jobs = 1;

  // Number of jobs per status string (`running`, `stopped`, `failed`, …),
  // counted over every job the caller may read that matches `query` — BEFORE
  // the `status` filter and before paging. A client rendering a status filter
  // can therefore show stable counts on every option while one is selected.
  // Statuses with no jobs are absent rather than zero.
  map<string, uint32> status_counts = 5;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;
}

// Request payload for IssueWorkloadIdentityToken.
message IssueWorkloadIdentityTokenRequest {
  // Allocation the token is requested for. Must exist and be placed on
  // `node_id`. All token claims are derived from this allocation's
  // scheduling record on the manager — never from the request.
  int64 alloc_id = 1;

  // Name of the identity declared in the allocation's task spec
  // (`identities[].name`). Selects the audience, TTL, subject template,
  // delivery, and extra claims. Unknown names are rejected with NotFound.
  string identity_name = 2;

  // Node id of the calling worker (the same id used in Heartbeat). The
  // manager rejects the request with PermissionDenied unless the allocation
  // is placed on this node. See the RPC comment for the trust model.
  string node_id = 3;
}

// Reply payload for IssueWorkloadIdentityToken.
message IssueWorkloadIdentityTokenReply {
  // The signed JWT (ES256, `kid` header references a key in the published
  // JWKS). Treat as a secret: never log it; deliver it only to the task it
  // was issued for.
  string token = 1;

  // Token expiry (`exp`) as Unix seconds. Workers schedule the refresh loop
  // from this (re-issue at roughly half the remaining TTL).
  int64 expires_at = 2;

  // Echo of the identity name the token was issued for.
  string name = 3;
}

// Request payload for IssueNodeIdentityToken.
message IssueNodeIdentityTokenRequest {
  // The worker node the token is requested for. Must be registered and must
  // match the caller's authenticated per-node credential.
  string node_id = 1;

  // Name of the node identity declared under `workloadIdentity.nodeIdentities`.
  // Selects the audience, TTL, and subject template. Unknown names → NotFound.
  string identity_name = 2;
}

// Reply payload for IssueNodeIdentityToken.
message IssueNodeIdentityTokenReply {
  // The signed JWT (ES256). Treat as a secret: never log it.
  string token = 1;

  // Token expiry (`exp`) as Unix seconds.
  int64 expires_at = 2;

  // Echo of the node identity name the token was issued for.
  string name = 3;
}

// Request payload for GetMeshCa.
message GetMeshCaRequest {}

// Reply payload for GetMeshCa.
message GetMeshCaReply {
  // The CA certificate, PEM; empty when none exists yet.
  string cert_pem = 1;

  // When the current CA was created (RFC 3339); empty when none exists.
  string created_at = 2;
}

// Request payload for RotateMeshCa.
message RotateMeshCaRequest {}

// Reply payload for RotateMeshCa.
message RotateMeshCaReply {
  // The new CA certificate, PEM.
  string cert_pem = 1;

  // When it was created (RFC 3339).
  string created_at = 2;
}

// Request payload for IssueNodeCertificate.
message IssueNodeCertificateRequest {
  // The worker node the certificate is for. Must match the caller's
  // authenticated per-node credential.
  string node_id = 1;
}

// Reply payload for IssueNodeCertificate.
message IssueNodeCertificateReply {
  // The node certificate, PEM. SANs: `<node>.node.legion` and
  // `legion://node/<node id>`.
  string cert_pem = 1;

  // The certificate's private key, PEM. Treat as a secret: never log it,
  // never write it to disk — the worker holds it in memory and re-issues
  // after a restart.
  string key_pem = 2;

  // The mesh CA certificate, PEM. What a node verifies its peers against.
  string ca_pem = 3;

  // Certificate expiry as Unix seconds.
  int64 expires_at = 4;
}

// Request payload for Heartbeat.
message HeartbeatRequest {
  // Worker/node ID sending heartbeat.
  //
  // With ACLs enforced it must match the node token on the request (a
  // management token may heartbeat for any node); a mismatch is refused with
  // `PERMISSION_DENIED`.
  string id = 1;

  // Allocation IDs currently known/running on worker.
  //
  // Default: empty list.
  repeated int64 allocation_ids = 2;

  // Allocations that failed on worker since last heartbeat.
  //
  // Default: empty list.
  repeated FailedAllocation failed_allocations = 3;

  // Latest per-allocation health snapshots from worker.
  //
  // Default: empty list.
  repeated AllocationHealth allocation_health = 4;

  // Volume operation outcomes since the last heartbeat (see
  // docs/volumes.md). Workers own the drivers; the manager owns the volume
  // state machine, and this is how driver results get back to it: a
  // successful mount pins the volume's node, a failure is recorded on the
  // row (and surfaced by `legion volume list`), and a confirmed destroy is
  // what advances a volume from `destroying` to `destroyed`.
  //
  // Default: empty list.
  repeated VolumeReport volume_reports = 5;

  // Allocations whose task process reached a terminal state since the last
  // heartbeat *without* failing — the task exited with a status its `restart`
  // policy treats as done (see docs/task-supervision.md). Failures travel in
  // `failed_allocations` instead, because the manager reschedules those.
  //
  // This is what makes a batch task's success real: the manager marks the
  // allocation complete and the task successful only when a worker says the
  // process exited successfully, instead of assuming it at placement.
  //
  // Sent only by workers at protocol version 2 and above.
  //
  // Default: empty list.
  repeated TerminatedAllocation terminated_allocations = 6;

  // Unratified provisional allocations this node is currently holding (see
  // docs/edge-boot.md). Reported on every heartbeat so started-but-
  // unconfirmed work is visible to an operator looking at capacity, and so a
  // manager that already decided a claim can re-deliver its verdict in
  // `HeartbeatReply.claim_verdicts` when the `RatifyClaim` reply was lost.
  //
  // Claims disappear from this list the moment they are confirmed (they
  // become ordinary allocations and appear in `allocation_ids`) or killed.
  //
  // Default: empty list — nodes running only committed work pay nothing.
  repeated ProvisionalClaimReport provisional_claims = 7;

  // Denials the node datapath recorded since the last heartbeat, one entry
  // per distinct (allocation, direction, destination, rule), with a count.
  // The manager turns each into a `net_denied` event carrying the job,
  // allocation, matched rule, destination, and identity, so "which rule
  // blocked it" is answerable from the event stream without node access.
  // Bounded: a node reports at most 256 entries per heartbeat and folds the
  // rest into a single `truncated` entry.
  repeated NetDenial net_denials = 8;

  // The node datapath's view of each desired allocation's networking: its
  // mode, whether its namespace and listeners are ready, which policy hash
  // it is enforcing. `legion net doctor` and the UI read this back through
  // ShowNetPolicy so "is it enforced?" is answered by the node that
  // enforces it, not inferred by the manager.
  repeated NetAllocStatus net_status = 9;

  // The service graph's raw material: what each allocation's datapath saw
  // per (upstream service, endpoint tag) since the last heartbeat — request
  // and connection counts, errors, denials, latency, bytes. Deltas, folded
  // by the manager into per-(caller, service) windows for ListServiceEdges.
  // Restored on a failed heartbeat like every other report on this request.
  repeated NetEdgeSample net_edges = 10;
}

// One edge sample: an allocation talking to a service through its datapath
// since the last heartbeat (docs/network-handlers.md, "Service graph").
message NetEdgeSample {
  // The calling allocation; the manager maps it to (job, task).
  int64 allocation_id = 1;

  // The upstream key: a catalog service name, or an external upstream's
  // `name`.
  string service = 2;

  // The endpoint's service tag the flow was balanced to (HTTP mode with a
  // `split`, or the endpoint's first tag); empty when untagged or external.
  string tag = 3;

  // `tcp` (connections) or `http` (requests).
  string protocol = 4;

  // Requests (HTTP mode) or connections (L4) that reached an endpoint.
  uint64 requests = 5;

  // Requests answered 5xx, and connections or requests that failed to reach
  // any endpoint (dial errors, timeouts, no endpoints).
  uint64 errors = 6;

  // Connections or requests denied by policy or a handler.
  uint64 denied = 7;

  // HTTP mode: sum and max of request latency, milliseconds, over
  // `requests`.
  uint64 latency_ms_sum = 8;
  uint64 latency_ms_max = 9;

  // Bytes toward the service and back.
  uint64 bytes_out = 10;
  uint64 bytes_in = 11;
}

// Reply payload for Heartbeat.
message HeartbeatReply {
  // Human-readable acknowledgement.
  //
  // Current manager reply value: `"ack"`.
  string message = 1;

  // Desired allocation set this worker should reconcile to.
  //
  // Default: empty list when manager has no desired allocations for this node.
  repeated TaskAllocation desired_allocations = 2;

  // Volumes this worker should reclaim by calling its driver's `destroy`
  // (see docs/volumes.md). The manager re-sends a volume on every heartbeat
  // until the worker confirms it in `HeartbeatRequest.volume_reports`, so a
  // worker that dies mid-destroy simply retries and storage is never leaked.
  //
  // A node-local volume is only ever sent to the node it is pinned to.
  //
  // Default: empty list.
  repeated VolumeDestroyRequest volume_destroy = 3;

  // Current endpoint set for every upstream declared by the desired
  // allocations on this node (see `TaskAllocation.task_connect`). This is the
  // service-discovery feed for the node-local forwarders: the worker applies
  // it to the running forwarders and the next accepted connection is balanced
  // across the addresses listed here.
  //
  // One entry per (allocation, upstream service) pair, refreshed on every
  // heartbeat — that is, every `WORKER_HEARTBEAT_DURATION_SEC` (2s), which is
  // the endpoint refresh cadence a consumer observes after a backend comes up,
  // goes unhealthy, or moves.
  //
  // Default: empty list when no desired allocation declares upstreams. The
  // manager performs no catalog work at all in that case, so nodes running
  // only plain jobs pay nothing for this field.
  repeated UpstreamEndpoints upstream_endpoints = 4;

  // Why the manager is stopping allocations on this node.
  //
  // Workers learn that an allocation should stop by noticing it is *absent*
  // from `desired_allocations` — an absence carries no reason, so a drain, a
  // rollout replacement, a `job stop` and a reschedule were historically
  // indistinguishable to the worker and to anything reading its logs. This
  // field supplies the missing reason, letting the worker hand a
  // `StopCause` to the task runtime and log why each task went away.
  //
  // Delivery is **best effort and advisory**. The manager records a notice in
  // the same transaction that removes the allocation, re-sends every live
  // notice on each heartbeat, and prunes notices by age
  // (`STOP_NOTICE_RETENTION_SECS`, 10 minutes). A worker that reconciles
  // before the notice reaches it — or one talking to a manager older than
  // this field — stops the allocation with cause `unknown` rather than
  // waiting. A stop is never delayed or skipped for want of a notice.
  //
  // The list is a snapshot, not a delta: each heartbeat carries every notice
  // the manager currently holds for this node, and the worker replaces its
  // copy wholesale.
  //
  // Default: empty list when no allocation on this node was recently removed.
  repeated StopNotice stop_notices = 5;

  // Catch-up verdicts for claims the worker reported in
  // `HeartbeatRequest.provisional_claims` that the manager has already
  // decided (see `ClaimVerdict`). The `RatifyClaim` reply is the primary
  // channel; this covers the case where that reply was lost after the
  // manager committed.
  //
  // Default: empty list.
  repeated ClaimVerdict claim_verdicts = 6;

  // The interval, in seconds, the manager wants this worker to heartbeat at.
  //
  // Present whenever the manager runs adaptive cadence, which is the default
  // (`heartbeat.adaptive`, `heartbeat.targetRatePerSecond` in the manager
  // config). The manager derives it from fleet size alone; at the defaults
  // every fleet up to 2,500 nodes is served the 2s floor. Absent when the
  // operator turned adaptive cadence off (`heartbeat.adaptive = false`) or
  // the manager predates it, and absent means "use your worker-type
  // `heartbeatSeconds`".
  //
  // The value is a FLOOR, not an override: a worker beats at the larger of
  // this and its worker-type `heartbeatSeconds`, so a slow batch pool keeps
  // its own cadence until the fleet grows past it. A manager that does not
  // lead the status lane relays the interval it last learned from the leader
  // in its liveness digest reply, so a worker gets the same answer from any
  // manager.
  //
  // The manager derives this node's lost-node window from the SAME value
  // (`missedBeatsBeforeLost x interval`), so a worker that honors a slower
  // cadence is never penalized for it. A worker that ignores the field — an
  // older build — is also never penalized: the manager widens a node's window
  // the moment it decides to slow down, before any worker has been told, and
  // only narrows a window after observing that node actually beating at the
  // faster rate.
  //
  // A worker that adopts a new interval sleeps one uniform `[0, interval)`
  // before resuming its normal jittered cadence, so a fleet that all learns
  // the new value within one old interval spreads across the new period
  // instead of re-phasing onto the same boundary.
  //
  // See docs/heartbeat-cadence-and-scale.md.
  optional uint32 next_interval_seconds = 7;

  // The effective network policy for each desired allocation, as a content
  // hash. The worker fetches a body it has not seen via `FetchNetPolicy`
  // and caches it; identical merged policies share one hash and one fetch.
  // An allocation absent from this list has no policy. Delivered every
  // heartbeat, applied only after a successful one, so a manager outage
  // keeps the last known good policy (fail-static). Empty on clusters with
  // no stored policy and no task declaring one — the zero-cost path.
  repeated AllocNetPolicy net_policies = 8;
}

// Why one allocation is being stopped.
//
// Sent in `HeartbeatReply.stop_notices`. See that field for delivery
// semantics and `docs/graceful-stop.md` for the full contract.
message StopNotice {
  // Allocation the manager removed. Matches an ID the worker previously
  // received in `HeartbeatReply.desired_allocations`.
  int64 allocation_id = 1;

  // Why it was removed. One of:
  //
  // - `stop` — the job, or a keyed instance of it, was stopped by a user.
  // - `update` — replaced by a newer job config (a rollout or in-place
  //   update).
  // - `drain` — the node is draining and its work is moving elsewhere.
  // - `reschedule` — moved by the scheduler (failure recovery, `onLost`
  //   handling, or a scheduler-driven move).
  // - `destroy` — the job was destroyed outright.
  // - `node_lost` — the node was removed or declared lost, clearing its
  //   allocations.
  // - `preempted` — displaced to make room for higher-priority work
  //   (docs/preemption-and-eviction.md).
  // - `scale_in` — the task's count was lowered by `legion job scale` and
  //   this allocation was surplus.
  //
  // Workers treat an unrecognized value as `unknown` and stop the allocation
  // anyway, so the manager may add causes without a coordinated upgrade.
  string cause = 2;

  // Name of the job that displaced this allocation. Set only when `cause` is
  // `preempted`; empty otherwise. The worker copies it into the on-disk stop
  // notice (`LEGION_STOP_NOTICE_PATH`) so a task can tell "the platform
  // wanted my capacity for job X" from "my operator stopped me".
  //
  // Best-effort, like the cause itself: a stop that reconciles before its
  // notice arrives is still carried out, just without attribution.
  string preemptor_job = 3;

  // Priority band of the job named in `preemptor_job` (`critical`, `high`,
  // `elevated`, `normal`, `low`, `background`). Empty when `preemptor_job`
  // is.
  string preemptor_band = 4;
}

// The endpoints one allocation may currently reach for one upstream service.
//
// Sent in `HeartbeatReply.upstream_endpoints`, this is the manager's answer to
// "where should this allocation's forwarder for service X send traffic right
// now". It is a snapshot, not a delta: each heartbeat carries the full list.
message UpstreamEndpoints {
  // Allocation consuming the service — the allocation whose task declared this
  // upstream in its `connect` block. Identifies which node-local forwarder the
  // endpoint list applies to.
  int64 allocation_id = 1;

  // Upstream service name, exactly as written in the task's
  // `connect.upstreams[].service`. Echoed so the worker can match the list to
  // one of its listeners without relying on ordering.
  string service = 2;

  // Endpoints the consumer may dial, already filtered by the manager:
  //
  // - **healthy only** — an endpoint appears when its latest health snapshot is
  //   healthy *and* its node is alive, the same liveness rule `ResolveService`
  //   applies. Unhealthy or lost backends are simply absent.
  // - **intention filtered** — when the target service declares
  //   `service.allow`, an endpoint is visible only if that list is empty,
  //   contains `"*"`, or contains the consuming allocation's job id. A denied
  //   consumer receives an empty list rather than an error.
  //
  // Endpoint fields carry the same meaning as in `ResolveServiceReply`; a
  // consumer dials `address:port`, and skips entries whose `address` is empty
  // or whose `port` is 0 (the backing node advertises no address yet).
  //
  // An empty list is authoritative and means "send no traffic": it is how a
  // scaled-to-zero, unhealthy, or intention-denied service is reported.
  // Workers only replace their endpoint list on a *successful* heartbeat, so a
  // manager outage leaves the last known good set in place (fail-static)
  // rather than blackholing traffic.
  repeated ServiceEndpoint endpoints = 3;

  // True when this list resolves a `proxy` **handler's** target
  // (`handlers = [{ handler = "proxy", service = "..." }]` on the
  // allocation's effective policy or one of its upstreams) rather than a
  // `connect.upstreams` entry. The worker keeps the two apart: handler
  // targets are dialed by the datapath when a chain hands a flow off, and
  // never get a loopback listener of their own.
  bool for_handler = 4;
}

// One volume operation outcome reported by a worker.
message VolumeReport {
  // Volume ID (the second half of an instance's `driver/volume_id` storage
  // handle).
  string volume_id = 1;

  // Operation this reports on: `mount`, `unmount`, or `destroy`.
  string op = 2;

  // True when the driver succeeded.
  bool ok = 3;

  // Host path the volume was mounted at. Set for successful mounts only.
  string mount_path = 4;

  // Whether the driver reports this volume as node-local. Authoritative: the
  // worker asked the driver, so this overrides the manager's mint-time guess
  // and determines whether the owning instance is pinned to this node.
  bool node_local = 5;

  // JSON object of driver metadata to persist on the volume row and hand back
  // on the next operation (an NFS source, a ZFS dataset). Empty when the
  // driver recorded nothing.
  string attrs = 6;

  // Failure detail when `ok` is false. Recorded on the volume row so a stuck
  // volume explains itself in `legion volume list` rather than only in a
  // worker log.
  string error = 7;

  // Block mode: the filesystem the driver reports the device carries
  // (`ext4`), recorded on the volume row so a consumer knows what to mount
  // inside a guest without probing. Empty for filesystem-mode mounts.
  string fs = 8;

  // True when this mount CREATED the storage rather than reattaching it. Lets
  // a consumer tell first-boot-initialize from reattach without guessing from
  // an empty directory.
  bool fresh = 9;
}

// One volume the manager wants a worker to reclaim.
message VolumeDestroyRequest {
  // Volume ID to destroy.
  string volume_id = 1;

  // Driver that owns it.
  string driver = 2;

  // Volume name within its task (`data` for instance storage).
  string name = 3;

  // JSON object of the driver params the volume was created with. Drivers
  // that need them to find the storage (an NFS `server`/`export`) get them
  // back here.
  string params = 4;

  // JSON object of driver metadata recorded on previous operations.
  string attrs = 5;
}

// Failed allocation report item from worker to manager.
message FailedAllocation {
  // Failed allocation ID.
  int64 allocation_id = 1;

  // Failure reason text.
  string reason = 2;

  // JSON-encoded final per-artifact staging states when the failure was an
  // artifact staging failure (same payload as
  // `AllocationHealth.artifact_states`). The manager turns failed rows into
  // `artifact.failed` scheduler events with per-artifact detail (redacted
  // source, error, attempts) instead of parsing the reason text.
  //
  // Unset for non-artifact failures.
  optional string artifact_states = 3;
}

// A terminal, non-failure allocation outcome reported by a worker: the task's
// process exited and the task's `restart` policy says that is the end of it
// (see docs/task-supervision.md).
message TerminatedAllocation {
  // Allocation that reached the terminal state.
  int64 allocation_id = 1;

  // True when the exit status was one the task counts as success
  // (`restart.successExitCodes`, default `[0]`). A task whose policy is
  // `never` can also terminate unsuccessfully; the manager marks the
  // allocation complete either way and records the status.
  bool success = 2;

  // Process exit code. Unset when the process was killed by a signal, or when
  // the worker only re-adopted the pid after a restart and never had a handle
  // to reap.
  optional int32 exit_code = 3;

  // Signal that killed the process, when it was killed by one (Unix only).
  optional int32 signal = 4;

  // Human-readable rendering of the same facts, e.g. `exited with status 0`
  // or `killed by signal 9`. Carried so events and the UI do not have to
  // re-derive wording from the numbers.
  string message = 5;
}

// Allocation health snapshot item from worker to manager.
message AllocationHealth {
  // Allocation ID.
  int64 allocation_id = 1;

  // True when current health check state is healthy.
  bool healthy = 2;

  // Human-readable health status details.
  string status = 3;

  // JSON-encoded per-artifact staging states for this allocation.
  //
  // Array of objects, one per declared artifact:
  // `[{"name":"tool","source":"https://…","state":"fetching",
  //    "bytesFetched":123,"bytesTotal":456,"digest":"sha256:…",
  //    "attempts":1,"durationMs":412,"error":"…"}]`.
  // States progress `pending` -> `fetching` -> `verifying` -> `staged`,
  // or end in `failed`. Sources are redacted (no userinfo or query secrets)
  // and errors reference auth *sources* (KV path or identity name), never
  // credential values.
  //
  // Unset when the task declares no artifacts.
  optional string artifact_states = 4;
}

// Request payload for HealthCheck.
message HealthCheckRequest {
  // Worker/node ID submitting health checks.
  //
  // With ACLs enforced it must match the node token on the request (see
  // `HeartbeatRequest.id`).
  string id = 1;

  // JSON-encoded node health-check payload.
  string health_checks = 2;
}

// Reply payload for HealthCheck.
message HealthCheckReply {
  // Human-readable acknowledgement.
  //
  // Current manager reply value: `"ack"`.
  string message = 1;
}

// Node record used in APIs.
message NodeMsg {
  // Node ID.
  string id = 1;

  // Node pool.
  string pool = 2;

  // Node status string.
  //
  // On worker registration manager sets default `"active"`.
  string status = 3;

  // Scheduling availability string (for example: available/unavailable).
  //
  // On worker registration manager sets default `"available"`.
  string availability = 4;

  // JSON-encoded configuration attributes.
  string config_attrs = 5;

  // JSON-encoded fingerprint attributes.
  string fingerprint_attrs = 6;

  // JSON-encoded dynamic attributes.
  //
  // On worker registration manager initializes this to `{}`.
  string dynamic_attrs = 7;

  // JSON-encoded health check payload.
  string health_checks = 8;

  // Last heartbeat timestamp string.
  //
  // On worker registration this starts empty and is set on first heartbeat.
  //
  // FRESHNESS CAVEAT: read `heartbeat_source` before trusting this as a live
  // clock. Heartbeats are tracked in the status-lane leader's memory and only
  // status transitions are replicated, so on any other manager this value
  // comes from a periodic checkpoint and can be up to
  // `liveness.checkpointInterval` (30s by default) behind. The node's
  // `status` is exact everywhere.
  string last_heartbeat = 9;

  // Where `last_heartbeat` came from on the manager that answered:
  //
  // - `"live"` — this manager owns liveness and observed the beat itself. The
  //   timestamp is current.
  // - `"checkpoint"` — a replicated checkpoint, accurate to within
  //   `liveness.checkpointInterval`. It records the time the beat was
  //   OBSERVED, not the time the checkpoint was written, so it is coarse
  //   rather than wrong.
  // - `""` — no heartbeat has been observed, or checkpoints are disabled
  //   (`liveness.checkpointInterval: "0s"`), in which case a non-owning
  //   manager reports no time rather than an approximate one.
  //
  // Additive: a client built before this field ignores it and sees exactly
  // today's `last_heartbeat`. See docs/node-liveness.md.
  string heartbeat_source = 10;
}

// Request payload for GetHeartbeatCadence. No parameters: the report is
// always fleet-wide, because the question it answers ("is the control plane
// keeping up?") has no per-node answer.
message GetHeartbeatCadenceRequest {}

// Reply payload for GetHeartbeatCadence — one fleet's cadence report.
//
// The arithmetic behind every field is published in
// docs/heartbeat-cadence-and-scale.md; the short version is
// `sustainable_nodes ~= R x I`, where `R` is heartbeat commits per second this
// control plane sustains and `I` is the interval.
message GetHeartbeatCadenceReply {
  // Active nodes this manager currently tracks.
  uint32 active_nodes = 1;

  // The interval, in seconds, this manager is currently telling workers to
  // use. With adaptive cadence off this is the configured floor
  // (`heartbeat.minInterval`, 2s by default) and workers keep their
  // worker-type `heartbeatSeconds` instead.
  uint32 served_interval_seconds = 2;

  // The lost-node window derived from it:
  // `missed_beats_before_lost x served_interval_seconds`.
  uint32 lost_window_seconds = 3;

  // Fraction of active nodes that checked in within one interval, 0.0 to 1.0.
  // 1.0 means the fleet is keeping up. False node loss begins when this falls
  // below `served_interval_seconds / lost_window_seconds` — 0.20 at the
  // defaults. Zero, with `freshness_measurable` false, on a fleet too small to
  // measure (under 20 nodes) or on a manager that does not own liveness.
  double freshness_ratio = 4;

  // Whether `freshness_ratio` means anything. False on a tiny fleet, where the
  // ratio is pure noise, and on a non-owning manager.
  bool freshness_measurable = 5;

  // Nodes this control plane is OBSERVED to sustain at the current interval.
  //
  // A lower bound, not a ceiling: a control plane that is comfortably keeping
  // up never reveals how much more it could take, so this reads as roughly the
  // current fleet size until the fleet is actually pressed.
  uint32 sustainable_nodes_estimate = 6;

  // The value to put in `heartbeatSeconds` for a fleet this size on this
  // control plane, at the configured headroom. The remedy is computed, not
  // left as a formula for the operator to evaluate mid-incident.
  uint32 suggested_heartbeat_seconds = 7;

  // Whether the manager dictates cadence at all (`heartbeat.adaptive`). On by
  // default; false when the operator set `heartbeat.adaptive = false`, in
  // which case workers keep their worker-type `heartbeatSeconds`.
  bool adaptive_enabled = 8;

  // True when the controller wanted to back off further but hit
  // `heartbeat.maxInterval`. Backing off is not infinite; past this point the
  // answer is more control plane, and the manager warns rather than slowing
  // the fleet down further.
  bool at_max_interval = 9;

  // Missed beats before a node is marked lost
  // (`heartbeat.missedBeatsBeforeLost`, 5 by default).
  uint32 missed_beats_before_lost = 10;

  // Whether the manager that answered owns liveness — that is, leads the
  // status lane (always true outside raft mode and in `single` topology). When
  // false, every number above is zero: a manager that does not own liveness
  // reports nothing rather than guessing.
  bool is_liveness_owner = 11;
}

// Request payload for GetNodes.
message GetNodesRequest {
  // Free-text search against node ID, status, pool, and availability.
  optional string query = 1;

  // Sort key. Supported values: `id`, `status`, `last_heartbeat`, `pool`.
  //
  // Default: `id`.
  optional string sort_by = 2;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `asc`.
  optional string sort_order = 3;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 4;

  // Maximum nodes returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 5;
}

// Reply payload for GetNodes.
message GetNodesReply {
  // Nodes known to manager for the requested page.
  repeated NodeMsg nodes = 1;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;
}

// Request payload for GetNode.
message GetNodeRequest {
  // Node ID.
  string id = 1;
}

// Reply payload for GetNode.
message GetNodeReply {
  // Node record when found.
  //
  // Unset when the node ID does not exist.
  optional NodeMsg node = 1;

  // Provisional (unratified) allocations this node reported on its most
  // recent heartbeat — work it has started that the store has not recorded
  // (docs/edge-boot.md). This is what makes started-but-unconfirmed capacity
  // visible instead of invisible.
  //
  // Live state, not durable: the manager holds the last report in memory, so
  // a failover shows an empty list until the node's next heartbeat (at most
  // one heartbeat interval). It is never wrong, only briefly incomplete.
  //
  // Default: empty list.
  repeated ProvisionalClaimReport provisional_claims = 2;
}

// Request payload for RestartWorker.
message RestartWorkerRequest {
  // Node/worker ID to restart.
  string node_id = 1;
}

// Reply payload for RestartWorker.
message RestartWorkerReply {
  // Human-readable status message.
  //
  // Manager forwards the worker's restart message.
  // Built-in worker currently replies `"Worker restarting"`.
  string message = 1;
}

// Request payload for SetNodeAvailability.
message SetNodeAvailabilityRequest {
  // Node ID whose availability to change.
  string node_id = 1;

  // Target availability. Supported values:
  // - `"available"`: the node accepts new placements (uncordon).
  // - `"drained"`: the node is excluded from all new placements
  //   (cordon/drain).
  //
  // Any other value is rejected with InvalidArgument.
  string availability = 2;

  // Whether to evict the node's existing allocations.
  //
  // Only meaningful with `availability = "drained"`: `false` cordons the
  // node (existing allocations keep running), `true` drains it (a
  // `node_drain` evaluation evicts stateless allocations immediately and
  // leaves stateful allocations protected by their `stateful.onLost`
  // policy). Ignored when `availability = "available"`.
  bool evict = 3;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 4;
}

// Reply payload for SetNodeAvailability.
message SetNodeAvailabilityReply {
  // The node record after the availability change.
  //
  // Unset when the reply was replayed from a recorded idempotent result
  // (see `deduplicated`).
  optional NodeMsg node = 1;

  // Human-readable status message.
  //
  // Current manager reply formats: `"Cordoned node <id>"`,
  // `"Draining node <id>"`, `"Uncordoned node <id>"`.
  string message = 2;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 3;
}

// Request payload for GetLedger.
message GetLedgerRequest {
  // Empty request; full ledger is returned.
}

// Reply payload for GetLedger.
message GetLedgerReply {
  // Ledger rows keyed by node.
  repeated LedgerNode nodes = 1;
}

// Snapshot of one manager node's stored manager config.
message ManagerNodeConfig {
  // Manager node ID.
  string node_id = 1;

  // JSON-encoded manager configuration.
  string config_json = 2;

  // Timestamp when this snapshot was updated.
  string updated_at = 3;
}

// Request payload for GetManagerConfigs.
message GetManagerConfigsRequest {
  // Free-text search against manager node ID.
  optional string query = 1;

  // Sort key. Supported values: `node_id`, `updated_at`.
  //
  // Default: `updated_at`.
  optional string sort_by = 2;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `desc`.
  optional string sort_order = 3;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 4;

  // Maximum manager configs returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 5;
}

// Reply payload for GetManagerConfigs.
message GetManagerConfigsReply {
  // Stored manager config snapshots for the requested page.
  repeated ManagerNodeConfig configs = 1;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;
}

// Request payload for GetObservability.
message GetObservabilityRequest {
  // Maximum number of recent lines to return per stream.
  //
  // Default and max are manager-defined.
  optional uint32 max_lines = 1;
}

// Reply payload for GetObservability.
message GetObservabilityReply {
  // True when manager started with `--o11y` and trace capture is active.
  bool o11y_enabled = 1;

  // Recent JSON log lines captured by manager.
  repeated string logs = 2;

  // Recent JSON trace/span events captured by manager.
  //
  // Empty when `o11y_enabled` is false.
  repeated string traces = 3;

  // Active persistence backend identifier.
  //
  // Current values include: `local_disk`.
  string persistence_backend = 4;

  // Manager write role as reported by the persistence backend.
  //
  // Current values include: `primary`, `standby`, `candidate`.
  string persistence_role = 5;

  // True when this manager currently holds the write lease/fencing token.
  //
  // For `local_disk` mode this is always `true`.
  bool persistence_lease_held = 6;
}

// Request payload for GetRaftStatus.
message GetRaftStatusRequest {
  // Empty request; manager derives status from local persistence backend state.
}

// Snapshot of one manager's current Raft control-plane status.
message RaftStatus {
  // True when the current persistence backend is Raft-enabled.
  bool enabled = 1;

  // Persistence backend name reported by manager.
  //
  // Example: `raft`.
  string backend = 2;

  // Local manager node ID used by Raft.
  string node_id = 3;

  // Logical cluster identifier for this Raft group.
  string cluster_id = 4;

  // Local node role. Values: `primary`, `standby`, `candidate`.
  string role = 5;

  // Current known leader node ID, if available.
  optional string leader_id = 6;

  // Current Raft term observed by this manager.
  uint64 term = 7;

  // Latest committed log index observed locally.
  uint64 commit_index = 8;

  // Latest applied log index observed locally.
  uint64 applied_index = 9;

  // True when this manager currently owns write leadership/fencing.
  bool lease_held = 10;

  // Current voting members: managers that are SETTLED voters on every
  // active lane.
  //
  // A raft membership change lands in two steps — a joint configuration
  // holding the old and the new voter sets, then the uniform new one — and
  // raft reports an incoming member as a voter from the joint step onwards.
  // This field deliberately does not: a manager appears here only once every
  // lane carries it in a UNIFORM membership, so the headline can never
  // report a fault-tolerant cluster while one lane is still mid-join (a lane
  // left joint still needs a majority of the OLD voter set). Under
  // `topology = "lanes"` this is therefore stricter than any single lane's
  // voter list; per-lane detail is in `lanes`.
  repeated string voters = 11;

  // Current learner/non-voting members.
  repeated string learners = 12;

  // Additional peer addresses or IDs discovered/configured for this node.
  repeated string peers = 13;

  // Epoch timestamp (milliseconds) when the last local election transition happened.
  int64 election_epoch_ms = 14;

  // Default lifetime for newly issued Raft join tokens.
  uint64 join_token_ttl_seconds = 15;

  // Raft library family currently used by manager.
  //
  // Example: `openraft`.
  string raft_library = 16;

  // Per-lane status detail, one entry per active raft group. Topology
  // `single` reports one entry (the `control` group carrying all tables);
  // the experimental `lanes` topology reports three. Empty when the engine
  // has not started.
  repeated RaftLaneStatus lanes = 17;
}

// Status of one raft group ("lane") on this manager.
message RaftLaneStatus {
  // Lane wire name: `control`, `scheduler`, or `status`.
  string lane = 1;

  // This node's role in the lane's group. Values: `primary`, `standby`,
  // `candidate`.
  string role = 2;

  // The lane's current leader, when known.
  optional string leader_id = 3;

  // The lane's current raft term.
  uint64 term = 4;

  // Latest log index observed locally for this lane.
  uint64 commit_index = 5;

  // Latest applied log index for this lane.
  uint64 applied_index = 6;

  // Number of voting members of this lane's raft group, as known locally.
  // While a membership change is in flight this is the UNION across the
  // joint configuration's voter sets, so read `quorum`/`survives` — not this
  // count — for what the lane can actually tolerate.
  uint64 voters = 7;

  // Majority (quorum) size required to commit on this lane:
  // `voters / 2 + 1`. With quorum lost, writes stall but local reads keep
  // serving. While the lane's membership is JOINT (a change in flight) this
  // is the largest majority across the joint configuration's voter sets,
  // because a joint configuration must be agreed by a majority of each.
  uint64 quorum = 8;

  // Voter failures this lane can survive while still committing:
  // `(voters - 1) / 2`. Zero for one- and two-voter groups — an even voter
  // count adds a manager without adding fault tolerance. While the lane's
  // membership is JOINT this is the SMALLEST such number across the joint
  // configuration's voter sets: growing `{a,b}` to `{a,b,c}` reports `0`
  // while the change is in flight, because the lane still needs both `a` and
  // `b`.
  uint64 survives = 9;

  // Plain-language advisory when this lane's membership is unhealthy: a
  // membership change still in its JOINT configuration (e.g. "membership
  // change in flight: this lane is in a JOINT configuration [a, b] +
  // [a, b, c] and needs a majority of EVERY listed config to commit or
  // elect …"), even voter parity (e.g. "2 voters need both alive to commit —
  // this cluster survives zero failures. Use 1, 3, or 5 voters; add one more
  // manager or remove one.") and/or fewer voters than
  // `persistence.raft.expectedVoters`. Absent when the lane is healthy.
  optional string warning = 10;
}

// Reply payload for GetRaftStatus.
message GetRaftStatusReply {
  // Current local Raft status snapshot.
  RaftStatus status = 1;
}

// One Raft history event recorded by manager.
message RaftHistoryEvent {
  // Monotonic event sequence number (local to this manager).
  uint64 event_id = 1;

  // Event category. Examples: `election`, `failover`, `membership`.
  string event_type = 2;

  // Human-readable summary of the event.
  string message = 3;

  // Actor who initiated the event (for example `cli`, `ui`, `system`).
  string actor = 4;

  // Optional target node ID associated with the event.
  optional string target = 5;

  // Term at the time this event was recorded.
  uint64 term = 6;

  // Leader at the time this event was recorded, if known.
  optional string leader_id = 7;

  // RFC3339 timestamp when this event was recorded.
  string created_at = 8;
}

// Request payload for ListRaftHistory.
message ListRaftHistoryRequest {
  // Maximum number of recent events to return.
  //
  // Default: `50`. Maximum: manager-defined.
  optional uint32 limit = 1;
}

// Reply payload for ListRaftHistory.
message ListRaftHistoryReply {
  // Most recent events first.
  repeated RaftHistoryEvent events = 1;
}

// Request payload for IssueRaftCommand.
message IssueRaftCommandRequest {
  // Command name to execute.
  //
  // Supported values are manager-version dependent, and commonly include:
  // - `trigger-election`
  // - `step-down`
  // - `transfer-leader`
  // - `add-voter`
  // - `add-learner`
  // - `remove-member`
  string command = 1;

  // Optional target node ID used by commands that operate on another member.
  optional string target_node_id = 2;

  // Free-form actor label for auditability.
  //
  // Default: `api`.
  optional string actor = 3;
}

// Reply payload for IssueRaftCommand.
message IssueRaftCommandReply {
  // Echo of command executed by manager.
  string command = 1;

  // Event recorded as a result of the command.
  RaftHistoryEvent event = 2;

  // Latest status after command application.
  RaftStatus status = 3;

  // Plain-language advisory produced by a command that SUCCEEDED but left
  // the cluster in an ergonomically unhealthy shape — today: a membership
  // change (`add-voter`, `remove-member`) whose resulting voter count is
  // even ("2 voters need both alive to commit — this cluster survives zero
  // failures. Use 1, 3, or 5 voters; add one more manager or remove one.").
  // The same advisory is WARN-logged on the manager and recorded as a
  // `membership` event in the raft history. Absent when the command left a
  // healthy shape. Genuinely unsafe operations (removing the last voter, or
  // a removal that would leave a quorum the currently-alive members cannot
  // form) are refused outright instead of warned about.
  optional string warning = 4;
}

// Request payload for GetRaftJoinToken.
message GetRaftJoinTokenRequest {
  // Free-form actor label for auditability.
  //
  // Default: `api`.
  optional string actor = 1;
}

// Reply payload for GetRaftJoinToken.
message GetRaftJoinTokenReply {
  // Opaque short-lived token for joining this cluster.
  string token = 1;

  // RFC3339 expiry timestamp for the token.
  string expires_at = 2;

  // Snapshot of Raft status when token was issued.
  RaftStatus status = 3;
}

// Request payload for GetStateBackup.
message GetStateBackupRequest {
  // Optional server-side destination path for the backup file. Must not
  // already exist (`VACUUM INTO` refuses to overwrite). Defaults to a
  // timestamped file under `<storePath>/backups/`.
  optional string out_path = 1;
}

// Reply payload for GetStateBackup.
message GetStateBackupReply {
  // Server-side path of the written backup file.
  string path = 1;

  // Size of the backup file in bytes.
  uint64 bytes = 2;

  // Raft applied log index captured in the backup (0 outside raft mode).
  uint64 applied_index = 3;

  // How KV values are held in this backup (docs/kv-encryption.md). When
  // `enabled`, the file carries ciphertext plus the WRAPPED data keys and is
  // useless without the root key, which is deliberately NOT in it:
  // `root_key_provider` / `root_key_location` say where to find it and
  // `root_key_ids` which key(s) a restore will need. Keep them together.
  BackupEncryptionInfo encryption = 4;
}

// Request payload for GetKeyringStatus. No fields: the reply describes the
// manager that answers.
message GetKeyringStatusRequest {}

// One data key in the KV keyring (see GetKeyringStatusReply).
message KeyringKeyInfo {
  // Data key id (`dk_…`). Values reference it in `kv_entry.enc_key_id`.
  string key_id = 1;

  // `active` (encrypts new writes) or `retired` (still decrypts what it
  // protected until the rewrap converts those values).
  string state = 2;

  // Cipher this key is used with (`aes-256-gcm`).
  string algorithm = 3;

  // Unix seconds the key was created.
  int64 created_at = 4;

  // Unix seconds the key was retired; unset while active.
  optional int64 retired_at = 5;

  // Id of the root key this data key is wrapped under, and the provider
  // kind that wrapped it.
  string root_key_id = 6;
  string root_provider = 7;

  // KV values currently encrypted under this key.
  int64 value_count = 8;

  // Whether THIS manager has unwrapped the key. `false` means the values
  // under it are unreadable here; `error` says why.
  bool unwrapped = 9;
  string error = 10;
}

// Progress of the background rewrap (see GetKeyringStatusReply).
message KeyringRewrapProgress {
  // Values not yet under the active data key (plaintext rows included).
  int64 pending = 1;

  // Whether the manager's keyring loop is currently converting them.
  bool running = 2;

  // Last rewrap error on this manager, if any (cleared on success).
  string last_error = 3;
}

// Reply payload for GetKeyringStatus.
message GetKeyringStatusReply {
  // `encryption.enabled` on this manager.
  bool enabled = 1;

  // `disabled` | `uninitialized` | `pending_upgrade` | `unlocked` | `locked`.
  //
  // `uninitialized`: enabled, but no data key exists yet (the leader has
  // not run initialization); values are written as plaintext rows until it
  // does. `pending_upgrade`: raft, and a voter runs a build without the
  // keyring, so the leader is deliberately holding off (`hint` names the
  // manager). `locked`: at least one data key cannot be unwrapped here.
  string state = 2;

  // Root key provider kind (`file` | `env` | `exec`) and where it looks.
  string root_key_provider = 3;
  string root_key_location = 4;

  // Id of the root key the provider would wrap with right now, when it has
  // material.
  string root_key_id = 5;

  // Data keys, active first.
  repeated KeyringKeyInfo keys = 6;

  // KV rows stored as plaintext / encrypted.
  int64 plaintext_rows = 7;
  int64 encrypted_rows = 8;

  // Background rewrap state.
  KeyringRewrapProgress rewrap = 9;

  // Configured `encryption.dataKeyRotationAge` and the active key's age.
  string data_key_rotation_age = 10;
  int64 active_key_age_seconds = 11;

  // The one thing to do next, in plain language, when there is one
  // (copy the root key from another manager, run a rewrap, finish an
  // upgrade). Empty when everything is as it should be.
  string hint = 12;

  // The manager answering (`host:port`), since the keyring is per-manager.
  string manager = 13;
}

// Request payload for RotateDataKey.
message RotateDataKeyRequest {
  // Optional idempotency key. A repeated call with the same key returns the
  // recorded outcome with `deduplicated = true` instead of rotating again.
  optional string idempotency_key = 1;
}

// Reply payload for RotateDataKey.
message RotateDataKeyReply {
  // The new active data key.
  string key_id = 1;

  // The data key it retired (empty when there was none).
  string retired_key_id = 2;

  // True when a previous call with the same idempotency key already
  // rotated and this reply is its recorded outcome.
  bool deduplicated = 3;
}

// Request payload for RewrapKv.
message RewrapKvRequest {
  // Decrypt every value into a plaintext row instead of re-encrypting
  // under the active key. The step before disabling encryption or
  // downgrading to a build without the keyring.
  bool plaintext = 1;

  // Optional idempotency key (see RotateDataKeyRequest).
  optional string idempotency_key = 2;
}

// Reply payload for RewrapKv.
message RewrapKvReply {
  // Values rewritten by this call.
  int64 rewrapped = 1;

  // Values still pending afterwards (0 on a completed run; non-zero only
  // when a batch failed — the message says why).
  int64 remaining = 2;

  // Retired data keys garbage-collected once nothing referenced them.
  repeated string collected_keys = 3;

  bool deduplicated = 4;
}

// Request payload for RewrapRootKey.
message RewrapRootKeyRequest {
  // Optional idempotency key (see RotateDataKeyRequest).
  optional string idempotency_key = 1;
}

// Reply payload for RewrapRootKey.
message RewrapRootKeyReply {
  // Data keys now wrapped under `root_key_id`.
  int64 keys = 1;

  // The root key everything is wrapped under after this call.
  string root_key_id = 2;

  // Data keys left untouched because this manager cannot unwrap them.
  repeated string skipped = 3;

  bool deduplicated = 4;
}

// Request payload for ResetKeyring.
message ResetKeyringRequest {
  // Must be exactly `DELETE-UNDECRYPTABLE-VALUES`.
  string confirm = 1;
}

// Reply payload for ResetKeyring.
message ResetKeyringReply {
  // KV key paths whose values were deleted because nothing could decrypt them.
  repeated string deleted_values = 1;

  // Data key ids dropped from the keyring.
  repeated string dropped_keys = 2;

  // The active data key after the reset.
  string active_key_id = 3;
}

// How a state backup's KV values are protected (see GetStateBackupReply).
message BackupEncryptionInfo {
  // `encryption.enabled` on the manager that wrote the backup.
  bool enabled = 1;

  // Root key provider: `file`, `env`, or `exec`.
  string root_key_provider = 2;

  // Where the root key lives: the key file path, the variable name, or the
  // provider command. Never the key itself.
  string root_key_location = 3;

  // Ids of the root keys the backup's data keys are wrapped under
  // (`rk_…` fingerprints, or a KMS key id for `exec`). A restore needs
  // every one of them available to read every value.
  repeated string root_key_ids = 4;

  // Values still stored as plaintext rows (pre-encryption rows a rewrap has
  // not converted). 0 once `legion keyring rewrap` has run to completion.
  int64 plaintext_rows = 5;
}

// Type discriminator for KV values.
enum KvValueType {
  // Invalid/unspecified type.
  //
  // Proto3 enum default is this value, but write APIs reject it.
  KV_VALUE_TYPE_UNSPECIFIED = 0;

  // Plain string value.
  KV_VALUE_TYPE_STRING = 1;

  // JSON numeric value.
  KV_VALUE_TYPE_NUMBER = 2;

  // Arbitrary JSON value.
  KV_VALUE_TYPE_JSON = 3;
}

// KV entry record.
message KvEntry {
  // Key path.
  string key = 1;

  // Raw stored value string.
  //
  // Interpretation depends on `value_type`.
  string value = 2;

  // Type discriminator for `value`.
  KvValueType value_type = 3;

  // Monotonic version used for optimistic concurrency.
  int64 version = 4;

  // RFC3339 creation timestamp.
  string created_at = 5;

  // RFC3339 update timestamp.
  string updated_at = 6;

  // Whether the value is stored encrypted at rest (docs/kv-encryption.md).
  //
  // `value` is always the plaintext on the wire; this only reports how the
  // row is held in the store. `false` for rows written before encryption
  // was enabled (or with `encryption.enabled = false`) that no rewrap has
  // converted yet — `legion keyring status` counts them.
  bool encrypted = 7;
}

// KV lock record.
message KvLock {
  // Key this lock protects.
  string key = 1;

  // Lock token that must be provided for renew/release and optional writes.
  string lock_id = 2;

  // Optional owner label for debugging/auditing.
  optional string owner = 3;

  // RFC3339 time lock was acquired.
  string acquired_at = 4;

  // RFC3339 lock expiration timestamp.
  string expires_at = 5;
}

// Request payload for PutKv.
message PutKvRequest {
  // Key path to create or update.
  //
  // Must be non-empty.
  string key = 1;

  // Value to store.
  //
  // Interpretation and validation depend on `value_type`.
  string value = 2;

  // Value type for normalization/validation.
  //
  // Required for writes. Default enum value is
  // `KV_VALUE_TYPE_UNSPECIFIED`, which manager rejects.
  KvValueType value_type = 3;

  // Optional expected version for optimistic concurrency checks.
  //
  // Behavior:
  // - Update existing key: must match current version.
  // - Create new key: may be omitted, or explicitly `0`.
  optional int64 expected_version = 4;

  // Optional lock token; required when key is actively locked by another client.
  //
  // Default: unset.
  optional string lock_id = 5;

  // Side effect:
  // - If this key is referenced by one or more jobspec KV refs, manager recomputes
  //   affected job configs and may create/update rollouts.
}

// Reply payload for PutKv.
message PutKvReply {
  // Stored KV entry after write.
  //
  // Includes incremented `version` and normalized `value`.
  // Manager sets this on successful responses.
  KvEntry entry = 1;
}

// Request payload for GetKv.
message GetKvRequest {
  // Key path to fetch.
  //
  // Must be non-empty.
  string key = 1;
}

// Reply payload for GetKv.
message GetKvReply {
  // Entry when found; unset when key does not exist.
  optional KvEntry entry = 1;
}

// Request payload for ListKv.
message ListKvRequest {
  // Prefix filter; entries with keys beginning with this prefix are returned.
  //
  // Default empty string matches all keys.
  string prefix = 1;
}

// Reply payload for ListKv.
message ListKvReply {
  // Matching KV entries.
  repeated KvEntry entries = 1;
}

// Request payload for DeleteKv.
message DeleteKvRequest {
  // Key path to delete.
  //
  // Must be non-empty.
  string key = 1;

  // Optional expected version for optimistic concurrency checks.
  //
  // Default: unset (no version check).
  optional int64 expected_version = 2;

  // Optional lock token; required when key is actively locked by another client.
  //
  // Default: unset.
  optional string lock_id = 3;
}

// Reply payload for DeleteKv.
message DeleteKvReply {
  // Human-readable result message.
  //
  // Current manager reply value: `"kv entry deleted"`.
  string message = 1;
}

// Request payload for PatchKv.
message PatchKvRequest {
  // Key path to patch.
  //
  // Must reference an existing JSON-typed KV entry.
  string key = 1;

  // RFC6902 JSON patch payload as text.
  //
  // Must parse as a valid JSON Patch document.
  string patch_json = 2;

  // Optional expected version for optimistic concurrency checks.
  //
  // Default: unset (no version check).
  optional int64 expected_version = 3;

  // Optional lock token; required when key is actively locked by another client.
  //
  // Default: unset.
  optional string lock_id = 4;

  // Side effect:
  // - If this key is referenced by one or more jobspec KV refs, manager recomputes
  //   affected job configs and may create/update rollouts.
}

// Reply payload for PatchKv.
message PatchKvReply {
  // Updated KV entry after patch.
  //
  // Includes incremented `version`.
  // Manager sets this on successful responses.
  KvEntry entry = 1;
}

// Request payload for AcquireKvLock.
message AcquireKvLockRequest {
  // Key path to lock.
  //
  // Must be non-empty.
  string key = 1;

  // Optional caller-supplied lock token.
  //
  // If omitted, manager generates a random 32-hex-character token.
  // If provided and it matches an existing active lock ID for this key,
  // acquire is allowed even without `force=true`.
  optional string lock_id = 2;

  // Optional owner label for diagnostics.
  //
  // Default: unset.
  optional string owner = 3;

  // Lease duration in seconds.
  //
  // Must be > 0.
  int64 ttl_seconds = 4;

  // When true, allows replacing an existing non-expired lock.
  //
  // Default: `false`.
  bool force = 5;
}

// Reply payload for AcquireKvLock.
message AcquireKvLockReply {
  // Active lock state.
  //
  // Manager sets this on successful responses.
  KvLock lock = 1;
}

// Request payload for RenewKvLock.
message RenewKvLockRequest {
  // Key path.
  string key = 1;

  // Lock token currently held by caller.
  //
  // Must match the active lock's ID.
  string lock_id = 2;

  // New lease duration in seconds.
  //
  // Must be > 0.
  int64 ttl_seconds = 3;

  // Behavior note:
  // - If lock is already expired, manager removes it and returns a conflict.
}

// Reply payload for RenewKvLock.
message RenewKvLockReply {
  // Updated lock state.
  //
  // Manager sets this on successful responses.
  KvLock lock = 1;
}

// Request payload for ReleaseKvLock.
message ReleaseKvLockRequest {
  // Key path.
  string key = 1;

  // Lock token currently held by caller.
  //
  // Must match the active lock's ID.
  string lock_id = 2;
}

// Reply payload for ReleaseKvLock.
message ReleaseKvLockReply {
  // Human-readable result message.
  //
  // Current manager reply value: `"kv lock released"`.
  string message = 1;
}

// Request payload for GetKvLock.
message GetKvLockRequest {
  // Key path.
  //
  // Must be non-empty.
  string key = 1;
}

// Reply payload for GetKvLock.
message GetKvLockReply {
  // Active non-expired lock when present.
  //
  // If the stored lock is expired, manager removes it and returns unset.
  optional KvLock lock = 1;
}

// Request payload for ListServices. Currently no filters; all declared
// services are returned.
message ListServicesRequest {
}

// Aggregate view of one declared service.
message ServiceSummary {
  // Service name (from `service.name`, defaulting to the task name).
  string service = 1;

  // Job ID whose task declares this service.
  string job_id = 2;

  // Task name declaring this service.
  string task_name = 3;

  // Count of endpoints currently passing health (see ResolveService for the
  // healthy definition).
  uint32 healthy_count = 4;

  // Total endpoint (allocation) count for this service, healthy or not.
  uint32 total_count = 5;

  // Service tags declared in the task's `service.tags`.
  repeated string tags = 6;

  // Service metadata declared in the task's `service.meta`, stringified.
  //
  // Free-form, but `protocol` is conventional (`http`, `https`, `grpc`, …) and
  // is what clients use to turn an endpoint into a URL.
  map<string, string> meta = 7;

  // Connect intentions declared in the task's `service.allow`: the job IDs
  // permitted to reach this service through a `connect.upstreams` entry.
  //
  // Empty — the default — means *every* job may connect, and so does a single
  // `"*"` entry; the two are reported verbatim rather than normalized so
  // tooling can tell "no policy declared" from "explicitly open". Intentions
  // gate the connect datapath only: they filter the endpoint list a consuming
  // allocation receives in `HeartbeatReply.upstream_endpoints`, and never
  // affect who may *read* the catalog through ListServices/ResolveService.
  //
  // Reported here so a read-only caller (`job:read`) can explain why its
  // consumer resolves to nothing — `legion service doctor` prints this list —
  // without needing state-store access to the underlying task config.
  repeated string allow = 8;
}

// Reply payload for ListServices.
message ListServicesReply {
  // All declared services. Empty when no stored task config declares a
  // `service` block.
  repeated ServiceSummary services = 1;
}

// Request payload for ResolveService.
message ResolveServiceRequest {
  // Service name to resolve. Matches `service.name` (defaulting to the task
  // name) on stored task configs.
  string service = 1;

  // When true, endpoints failing (or missing) health are also returned, with
  // `healthy` set accordingly. Default false: only healthy endpoints.
  bool include_unhealthy = 2;
}

// One resolvable endpoint of a service.
message ServiceEndpoint {
  // Service name this endpoint belongs to.
  string service = 1;

  // Job ID whose task declares the service.
  string job_id = 2;

  // Task name declaring the service.
  string task_name = 3;

  // Allocation ID backing this endpoint.
  int64 allocation_id = 4;

  // Node ID currently hosting the endpoint.
  string node_id = 5;

  // Routable address (host/IP) of the endpoint's node. Derived from the
  // node's advertised worker address. Empty when the node has no advertised
  // address.
  string address = 6;

  // Host port assigned to the service's advertised port label.
  uint32 port = 7;

  // True when the endpoint's latest allocation health snapshot is healthy and
  // its node is alive.
  bool healthy = 8;

  // Human-readable health status detail from the latest snapshot (for
  // example `healthy`, `starting`, or a check failure description). Empty
  // when no snapshot has been reported yet.
  string health_status = 9;

  // Service tags declared in the task's `service.tags`.
  repeated string tags = 10;

  // Service metadata declared in the task's `service.meta`, stringified.
  //
  // Free-form, but `protocol` is conventional (`http`, `https`, `grpc`, …) and
  // is what clients use to turn `address:port` into a URL.
  map<string, string> meta = 11;

  // Name of the `network.ports` entry this endpoint advertises, when the
  // service names a port label rather than a literal port number.
  string port_label = 12;

  // True when the endpoint's advertised port terminates **mesh TLS** — its
  // task's ingress chain has `tls = { mode = "mutual", certFrom = "legion" }`
  // (docs/network-handlers.md). A consuming node's datapath then originates
  // TLS with its own node certificate and names the consuming workload in a
  // PROXY protocol v2 TLV; a plain client dialing the port directly is
  // refused at the handshake.
  bool mesh_tls = 13;
}

// Request payload for ListServiceEdges.
message ListServiceEdgesRequest {
  // Only edges into (or out of) this service; empty for the whole graph.
  string service = 1;

  // Window the observed counters are summed over, seconds. Default 300,
  // at most 900 (the manager keeps 15 minutes of per-minute buckets).
  uint32 window_secs = 2;
}

// One edge of the service graph.
message ServiceEdge {
  // The caller: the job and task whose datapath made the calls (or declared
  // the upstream).
  string caller_job = 1;
  string caller_task = 2;

  // The callee: a catalog service name, or an external upstream's `name`.
  string service = 3;

  // The endpoint tag the calls were balanced to; empty when untagged.
  string tag = 4;

  // `tcp`, `http`, or empty for a declared-only edge.
  string protocol = 5;

  // The caller's latest job config declares this service as an upstream.
  bool declared = 6;

  // The service's `allow` intentions admit the caller (always true for an
  // external upstream or an undeclared service).
  bool allowed = 7;

  // Observed over the window (zero for a declared-only edge).
  uint64 requests = 8;
  uint64 errors = 9;
  uint64 denied = 10;
  double latency_ms_avg = 11;
  uint64 latency_ms_max = 12;
  uint64 bytes_out = 13;
  uint64 bytes_in = 14;

  // Requests per second and error rate over the window.
  double rps = 15;
  double error_rate = 16;

  // When the manager last folded a sample for this edge, Unix seconds; 0 for
  // a declared-only edge.
  int64 last_seen_unix = 17;
}

// Reply payload for ListServiceEdges.
message ListServiceEdgesReply {
  repeated ServiceEdge edges = 1;

  // The window the counters cover, seconds.
  uint32 window_secs = 2;
}

// Reply payload for ResolveService.
message ResolveServiceReply {
  // Matching endpoints. Empty when the service is unknown or (by default) has
  // no healthy endpoints — callers can distinguish the two via ListServices.
  repeated ServiceEndpoint endpoints = 1;
}

// Request payload for GetArtifactCredential.
message GetArtifactCredentialRequest {
  // Worker/node ID requesting the credential.
  //
  // With ACLs enforced it must match the node token on the request (see
  // `HeartbeatRequest.id`). The credential value itself is never logged.
  string node_id = 1;

  // KV path holding the credential value (for example: "secrets/ghcr-pull").
  //
  // The KV value must be a JSON object with a `type` discriminator:
  // `{"type":"basic","username":"…","password":"…"}`,
  // `{"type":"bearer","token":"…"}`,
  // `{"type":"aws","accessKeyId":"…","secretAccessKey":"…","sessionToken":"…",
  //   "region":"…","endpoint":"…"}`, or
  // `{"type":"headers","headers":{"X-Api-Key":"…"}}`.
  string kv_path = 2;

  // Redacted artifact source the credential will be used for.
  //
  // Audit context only (scheme://host/path with userinfo and query stripped).
  string source = 3;
}

// Reply payload for GetArtifactCredential.
message GetArtifactCredentialReply {
  // JSON-encoded credential value read from KV at request time.
  //
  // Returned to the worker for immediate use; never persisted on allocation
  // rows. Rotating the KV value affects the next fetch with no job changes.
  string credential_json = 1;
}

// Request payload for QueryStateStore.
message QueryStateStoreRequest {
  // SQL statement to execute.
  //
  // The server currently accepts a single statement per request.
  string sql = 1;

  // Allows write/mutating statements when true.
  //
  // Default behavior when false: only read/query statements are accepted.
  bool allow_write = 2;
}

// One row from QueryStateStore results encoded as JSON object text.
message QueryStateStoreRow {
  // JSON object containing column name => value for one returned row.
  string json = 1;
}

// Reply payload for QueryStateStore.
message QueryStateStoreReply {
  // Statement category inferred by the manager (for example: SELECT, UPDATE).
  string statement_type = 1;

  // Ordered result column names for tabular query results.
  repeated string columns = 2;

  // Returned rows for query statements.
  //
  // Mutating statements typically return an empty list.
  repeated QueryStateStoreRow rows = 3;

  // Number of rows affected for mutating statements.
  //
  // For read-only statements this is usually zero.
  uint64 affected_rows = 4;
}

// Request payload for GetStateStoreSchema.
message GetStateStoreSchemaRequest {}

// One table/view schema in the SQLite state store.
message StateStoreSchemaObject {
  // Object kind such as table or view.
  string kind = 1;

  // Object name.
  string name = 2;

  // Full CREATE SQL for the object when available.
  string create_sql = 3;

  // Column definitions for this object.
  repeated StateStoreSchemaColumn columns = 4;
}

// One column definition inside a SQLite schema object.
message StateStoreSchemaColumn {
  // Column ordinal position from SQLite pragma output.
  int32 ordinal = 1;

  // Column name.
  string name = 2;

  // Declared SQLite type.
  string data_type = 3;

  // Whether this column is declared NOT NULL.
  bool not_null = 4;

  // Raw SQLite default expression/value when present.
  optional string default_value = 5;

  // Whether this column participates in the primary key.
  bool primary_key = 6;
}

// Reply payload for GetStateStoreSchema.
message GetStateStoreSchemaReply {
  // Ordered schema objects available in the current store.
  repeated StateStoreSchemaObject objects = 1;
}

// Request payload for ListSavedStateQueries.
message ListSavedStateQueriesRequest {}

// Saved query metadata used by the State Explorer UI.
message SavedStateQuery {
  // Unique, user-visible query name.
  string name = 1;

  // SQL text.
  string sql = 2;

  // RFC3339 creation timestamp.
  string created_at = 3;

  // RFC3339 last-update timestamp.
  string updated_at = 4;
}

// Reply payload for ListSavedStateQueries.
message ListSavedStateQueriesReply {
  // Saved queries sorted by name.
  repeated SavedStateQuery queries = 1;
}

// Request payload for UpsertSavedStateQuery.
message UpsertSavedStateQueryRequest {
  // Query name to create or overwrite.
  string name = 1;

  // SQL text to save.
  string sql = 2;
}

// Reply payload for UpsertSavedStateQuery.
message UpsertSavedStateQueryReply {
  // Saved query after create/update.
  SavedStateQuery query = 1;
}

// Request payload for DeleteSavedStateQuery.
message DeleteSavedStateQueryRequest {
  // Query name to delete.
  string name = 1;
}

// Reply payload for DeleteSavedStateQuery.
message DeleteSavedStateQueryReply {
  // Human-readable result message.
  string message = 1;
}

// One ledger row grouping a node with its current allocations.
message LedgerNode {
  // Node record.
  optional NodeMsg node = 1;

  // Allocations currently assigned to this node.
  repeated LedgerAllocation allocations = 2;
}

// Allocation record as returned in ledger responses.
message LedgerAllocation {
  // Allocation ID.
  int64 id = 1;

  // Allocation status.
  string status = 2;

  // JSON-encoded resource payload.
  string resources = 3;

  // Node ID where this allocation is placed.
  string node_id = 4;

  // Job config ID this allocation targets.
  string job_config_id = 5;

  // Task config ID this allocation targets.
  int64 task_config_id = 6;

  // Job ID this allocation belongs to.
  string job_id = 7;

  // JSON-encoded assigned network payload (address + ports) for this
  // allocation, matching the `AllocNetwork` shape. Empty string when the
  // task declares no network block.
  string network = 10;

  // Optional JSON-encoded per-artifact staging states from the latest worker
  // health snapshot. Same payload as `AllocationHealth.artifact_states`.
  //
  // Unset when the allocation's task declares no artifacts or no snapshot
  // has been received yet.
  optional string artifact_states = 8;

  // Stable instance id this allocation fulfills, set only when the backing
  // task is stateful (slot or keyed mode; see `docs/stateful-workloads.md`).
  //
  // The instance id survives reschedules: a replacement allocation for the
  // same slot/keyed instance reports the same value here. Unset for
  // stateless tasks. Full instance metadata (mode, state, slot index,
  // storage handle) is available via `GetInstance` / `ListInstances`.
  optional string instance_id = 9;
}

// Request payload for UpdateNodeDynamic.
message UpdateNodeDynamicRequest {
  // Node ID to update.
  string id = 1;

  // JSON object string merged into node dynamic attributes.
  //
  // Merge behavior is shallow object merge by key.
  // Keys present in `dynamic_diff` overwrite existing keys.
  string dynamic_diff = 2;

  // Side effect:
  // - Manager enqueues `job_update` evals for job configs currently allocated
  //   on this node, using manager default eval priority (default `50`).
}

// Reply payload for UpdateNodeDynamic.
message UpdateNodeDynamicReply {
  // Updated node record.
  //
  // Includes merged dynamic attributes as persisted by manager.
  optional NodeMsg node = 1;
}

// One scheduler event from the manager's event journal.
//
// Events are emitted by the manager whenever the scheduler does something
// observable: eval queue activity, allocation placement and removal, node
// lifecycle transitions, job lifecycle transitions, and rollout activity.
message SchedulerEvent {
  // Increasing event ID.
  //
  // IDs are assigned by the manager's state store and are never reused, so
  // they double as a resume cursor for `ListEvents`/`StreamEvents`.
  //
  // IDs are SPARSE, not consecutive: they are minted from a timestamp plus
  // the manager's raft write lane (each lane mints in its own stride, so
  // concurrent lanes can never collide), and pruning removes old ones.
  // Treat an ID only as an opaque cursor — never as a count, an index, or
  // something to increment.
  int64 id = 1;

  // Dotted event kind, namespaced by subsystem.
  //
  // Current kinds include:
  // - `scheduler.started`, `scheduler.recovered`
  // - `eval.enqueued`, `eval.completed`, `eval.failed`
  // - `allocation.placed`, `allocation.removed`, `allocation.failed`, `allocation.plan_rejected`
  // - `node.registered`, `node.ready`, `node.lost`
  // - `job.submitted`, `job.updated`, `job.stopped`, `job.destroyed`, `job.failed`
  // - `rollout.event`
  string kind = 2;

  // Event severity. Values: `info`, `warn`, `error`.
  string level = 3;

  // Job ID this event relates to, when applicable.
  optional string job_id = 4;

  // Node ID this event relates to, when applicable.
  optional string node_id = 5;

  // Eval ID this event relates to, when applicable.
  optional string eval_id = 6;

  // Allocation ID this event relates to, when applicable.
  optional int64 allocation_id = 7;

  // Rollout ID this event relates to, when applicable.
  optional int64 rollout_id = 8;

  // Human-readable event description.
  string message = 9;

  // JSON object string with kind-specific structured details.
  //
  // Always a valid JSON object; `{}` when the event has no extra detail.
  string metadata_json = 10;

  // RFC3339 timestamp when the event was recorded.
  string created_at = 11;
}

// Request payload for ListEvents.
message ListEventsRequest {
  // Exclusive lower-bound event ID cursor.
  //
  // When set, only events with `id > after_id` are returned (oldest first),
  // so repeated polling never skips an event (IDs themselves are sparse —
  // see `SchedulerEvent.id`). When omitted, the most recent
  // `limit` events are returned (still ordered oldest-to-newest).
  optional int64 after_id = 1;

  // Maximum number of events to return.
  //
  // Default when omitted: `100`. Manager bounds: clamped to `[1, 1000]`.
  optional uint32 limit = 2;

  // Optional kind filter.
  //
  // Matches events whose kind equals the value exactly, or whose kind starts
  // with `<value>.` — so `eval` matches `eval.completed` and `eval.failed`.
  optional string kind = 3;

  // Optional exact job ID filter.
  optional string job_id = 4;

  // Optional exact node ID filter.
  optional string node_id = 5;

  // Optional severity filter. Values: `info`, `warn`, `error`.
  optional string level = 6;
}

// Reply payload for ListEvents.
message ListEventsReply {
  // Matching events ordered oldest-to-newest.
  repeated SchedulerEvent events = 1;

  // Highest event ID currently stored by the manager (0 when no events).
  //
  // Clients can use this to initialize an `after_id` cursor for follow-up
  // `ListEvents` polls or a `StreamEvents` call.
  int64 latest_id = 2;
}

// Request payload for StreamEvents.
message StreamEventsRequest {
  // Exclusive lower-bound event ID to replay from.
  //
  // When set, persisted events with `id > after_id` are sent before the live
  // feed. When omitted, the stream starts with events emitted after the
  // stream is established (pure tail).
  optional int64 after_id = 1;

  // Optional kind filter. Same semantics as `ListEventsRequest.kind`.
  optional string kind = 2;

  // Optional exact job ID filter.
  optional string job_id = 3;

  // Optional exact node ID filter.
  optional string node_id = 4;

  // Optional severity filter. Values: `info`, `warn`, `error`.
  optional string level = 5;
}

// Internal eval queue item.
message Eval {
  // Eval ID.
  string id = 1;

  // Eval status (for example: pending, in_flight, failed).
  //
  // Newly enqueued evals start as `pending`.
  string status = 2;

  // Eval kind (for example: job_submit, node_drop, rollout_tick).
  string kind = 3;

  // Associated job ID when applicable.
  //
  // Default empty string when not scoped to a job.
  string job_id = 4;

  // Associated job config ID when applicable.
  //
  // Default empty string when not scoped to a job config.
  string job_config_id = 5;

  // Associated node name/ID when applicable.
  //
  // Default empty string when not scoped to a node.
  string node_name = 6;

  // Eval priority (higher processed first).
  //
  // Default when not explicitly provided: manager `default_priority`
  // (`50` in built-in config defaults).
  int64 priority = 7;
}

// === WORKER ===

// Worker is the per-node runtime API called by the manager.
service Worker {
  // Delivers one allocation payload to worker for execution/reconciliation.
  rpc PostWork (PostWorkRequest) returns (PostWorkReply);

  // Requests the worker process to restart itself.
  rpc RestartWorker (RestartWorkerRequest) returns (RestartWorkerReply);

  // Reads captured stdout/stderr files for one allocation on this node.
  rpc GetTaskLogs (GetTaskLogsRequest) returns (GetTaskLogsReply);

  // Runs an exec session against a local allocation. Called only by the
  // manager (worker plane); the manager has already authorized the caller and
  // rendered any action command into a raw argv on the `ExecStart` frame.
  rpc ExecTask (stream ExecClientFrame) returns (stream ExecServerFrame);

  // Starts work on this node from a boot ticket, without any call to a
  // manager on the critical path (docs/edge-boot.md).
  //
  // This is the edge entry point: a platform's router hands the node a
  // ticket it minted ahead of time, the node verifies it offline against the
  // cached JWKS, admits it against its own free resources, and boots to the
  // gate level. Ratification runs in parallel and its verdict arrives on
  // this same stream.
  //
  // Server-streaming so the caller learns each transition without polling —
  // a router may begin routing at `booted` and must be prepared for
  // `refused` at any point until `ratified`.
  //
  // Rejected with FailedPrecondition unless the worker was configured with
  // `edgeBoot.acceptClaims: true`. Callers are authorized by the ticket
  // alone; the worker holds no user credentials and verifies no other
  // identity.
  rpc StartClaim (StartClaimRequest) returns (stream StartClaimReply);
}

// === EXEC / ACTIONS ===

// Frames sent from the initiator (CLI, UI, or manager proxy) toward the
// process. The first frame on a stream must carry `start`.
message ExecClientFrame {
  oneof frame {
    ExecStart start   = 1;
    ExecInput stdin   = 2;
    ExecResize resize = 3;
    ExecPing ping     = 4;
  }
}

// Opens a session. Exactly one of `command` (raw exec) or `action` (named,
// server-rendered) selects what runs.
message ExecStart {
  // Target allocation (must be `active`).
  int64 allocation_id = 1;

  // Task within the allocation. Optional when the allocation runs one task.
  string task_name = 2;

  // Raw command argv (requires exec:write). Empty when running an action.
  repeated string command = 3;

  // Action name (requires action:write). Empty for raw exec.
  string action = 4;

  // Action parameter values, validated + substituted server-side.
  map<string, string> action_params = 5;

  // Allocate a PTY (interactive). When false, stdout/stderr stay separate.
  bool tty = 6;

  // Initial terminal size (tty sessions only).
  ExecWinsize winsize = 7;

  // Bearer token carried in-frame for the browser WebSocket bridge, which
  // cannot set request headers. Ignored on native gRPC legs, where the
  // `authorization` metadata is used instead.
  string bearer_token = 8;
}

// Standard-input chunk. `eof` half-closes stdin (the k8s v5 lesson) so piped
// input reaches EOF without tearing down the whole session.
message ExecInput {
  bytes data = 1;
  bool eof   = 2;
}

// Terminal dimensions in character cells.
message ExecWinsize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// Window-resize event (tty sessions).
message ExecResize {
  ExecWinsize winsize = 1;
}

// Keepalive; the peer echoes it back as `pong`.
message ExecPing {}

// Frames sent from the process back toward the initiator.
message ExecServerFrame {
  oneof frame {
    ExecOutput stdout   = 1;
    ExecOutput stderr   = 2;
    ExecExit exit       = 3;
    ExecPing pong       = 4;
    ExecStarted started = 5;
  }
}

// A chunk of captured output.
message ExecOutput {
  bytes data = 1;
}

// Terminal frame: the process exited. The stream closes after this.
message ExecExit {
  int32 code      = 1;
  string message  = 2;
}

// Acknowledges that the session is live; the UI switches to the terminal on
// receipt. `session_id` identifies the session in audit events.
message ExecStarted {
  string session_id = 1;
}

// Request payload for ListJobActions.
message ListJobActionsRequest {
  // Job whose declared actions to list.
  string job = 1;
}

// One declared action, flattened with its owning task for discovery.
message JobAction {
  string task_name          = 1;
  string name               = 2;
  string description        = 3;
  bool tty                  = 4;
  repeated JobActionParam params = 5;
}

// One declared parameter of an action.
message JobActionParam {
  string name        = 1;
  string description  = 2;
  // One of: string | int | bool | enum.
  string type        = 3;
  bool required      = 4;
  string default     = 5;
  // Allowed values for `enum` params.
  repeated string values = 6;
  // Anchored regex for `string` params (empty = unconstrained).
  string pattern     = 7;
  // Inclusive bounds for `int` params (empty = unbounded).
  string min         = 8;
  string max         = 9;
  // Redact the value in audit events + UI history.
  bool sensitive     = 10;
}

// Reply payload for ListJobActions.
message ListJobActionsReply {
  repeated JobAction actions = 1;
}

// Selects which captured stream(s) to read for a task.
//
// Used by both `Worker.GetTaskLogs` and `Manager.GetAllocationLogs`.
message GetTaskLogsRequest {
  // Allocation whose logs are requested.
  int64 allocation_id = 1;

  // Stream filter: "stdout", "stderr", or "all" (default when empty).
  string stream = 2;

  // Maximum number of bytes to return per stream.
  //
  // `0` selects the worker's built-in default cap. When a stream's file is
  // larger than the cap the returned content is truncated.
  int64 max_bytes = 3;

  // When true, return the trailing bytes of each stream (tail) rather than the
  // leading bytes. Defaults to false (head).
  bool tail = 4;

  // Byte offset to read forward from (incremental tail / follow). When > 0 the
  // worker returns bytes from this position to EOF and ignores `tail`. When the
  // offset is past EOF (the file was rotated) the read restarts from the front.
  int64 offset = 5;
}

// One captured stream's content for a single allocation.
message TaskLogStream {
  // Stream name ("stdout" or "stderr").
  string stream = 1;

  // UTF-8 (lossy) content of the (possibly truncated) stream.
  string content = 2;

  // Total size of the underlying active log file in bytes.
  int64 size_bytes = 3;

  // Whether `content` was truncated to satisfy `max_bytes`.
  bool truncated = 4;

  // Byte offset within the file where `content` begins.
  int64 start_offset = 5;

  // Byte offset to resume from on the next incremental read
  // (`start_offset` + bytes returned). Clients following a stream pass this
  // back as the request `offset`.
  int64 next_offset = 6;
}

// Reply payload for Worker.GetTaskLogs.
message GetTaskLogsReply {
  // Captured streams for the allocation. Streams with no log file are omitted.
  repeated TaskLogStream streams = 1;
}

// Request payload for Manager.GetAllocationLogs.
message GetAllocationLogsRequest {
  // Job name to gather allocation logs for. Required unless `allocation_id` is
  // set.
  string job = 1;

  // Optional: restrict the read to a single allocation id. When set, `job` is
  // ignored.
  optional int64 allocation_id = 2;

  // Stream filter: "stdout", "stderr", or "all" (default when empty).
  string stream = 3;

  // Maximum number of bytes to return per stream (`0` = worker default).
  int64 max_bytes = 4;

  // When true, return the trailing bytes of each stream rather than the leading.
  bool tail = 5;

  // Byte offset to read forward from (incremental tail / follow). Applied per
  // stream; see `GetTaskLogsRequest.offset`.
  int64 offset = 6;
}

// Captured logs for a single allocation, annotated with where they came from.
message AllocationLog {
  // Allocation id.
  int64 allocation_id = 1;

  // Node hosting the allocation.
  string node_id = 2;

  // Task name for the allocation, when resolvable.
  string task_name = 3;

  // Captured streams for the allocation.
  repeated TaskLogStream streams = 4;

  // Per-allocation error (for example: node unreachable). Empty on success.
  string error = 5;
}

// Reply payload for Manager.GetAllocationLogs.
message GetAllocationLogsReply {
  // One entry per matched allocation.
  repeated AllocationLog allocations = 1;
}

// Allocation payload sent to workers.
message TaskAllocation {
  // Allocation ID.
  int64 allocation_id = 1;

  // Job ID.
  string job_id = 2;

  // Job config ID.
  string job_config_id = 3;

  // Target node ID.
  string node_id = 4;

  // Task config ID.
  int64 task_config_id = 5;

  // Task name.
  string task_name = 6;

  // Name of the task runtime plugin that runs this task (`exec`, `container`,
  // `noop`, or a third-party plugin under `plugins/tasks/<name>/`). The worker
  // resolves this against its task-plugin registry and fails the allocation if
  // no plugin with this name is loadable. Mirrors the jobspec's
  // `tasks.<name>.runtime` field.
  string task_runtime = 7;

  // JSON-encoded task config payload.
  string task_config = 8;

  // JSON-encoded task health-check definitions.
  string task_checks = 9;

  // JSON-encoded task unhealthy handling policy.
  string task_on_unhealthy = 10;

  // JSON-encoded assigned network payload (address + ports + upstreams) for
  // this allocation, matching the `AllocNetwork` shape. Workers use it to
  // inject `LEGION_PORT_*` / `LEGION_ADDR_*` environment variables into the
  // task, and — when the task declares upstreams — the `upstreams` array
  // (`[{"service":"db","localPort":20003,"balance":"round_robin"}]`) carries
  // the loopback ports the node-local forwarders listen on, surfaced to the
  // task as `LEGION_UPSTREAM_*`.
  //
  // Empty string when the task declares no network block and no upstreams.
  string network = 14;

  // JSON-encoded `connect` block declared by the task, matching the
  // `ConnectConfig` shape: `{"upstreams":[{"service":"db"},
  // {"service":"cache","localPort":6379,"balance":"least_conn"}]}`.
  //
  // This is the *declared* form (which services the task dials and with which
  // balancing strategy); the *assigned* loopback ports live in `network`
  // alongside the task's host ports, because both come out of the same
  // per-node port space. The worker starts one loopback TCP forwarder per
  // upstream and load-balances new connections across that service's healthy
  // endpoints, which the manager refreshes every heartbeat in
  // `HeartbeatReply.upstream_endpoints`.
  //
  // Empty string (not `{}`) when the task declares no upstreams, so jobs that
  // do not use connect stay byte-identical on the wire.
  string task_connect = 17;

  // JSON-encoded list of normalized artifact specs for this task.
  //
  // This is the post-admission form: runtime-implicit artifacts (for example a
  // container `image`) are already desugared in, `resolve: "pin"` references
  // are already pinned to digests, and cluster-level auth matchers are
  // already applied. Workers stage exactly this list and never re-derive or
  // re-resolve artifacts.
  //
  // Empty string when the task declares no artifacts (the staging step is
  // skipped entirely).
  string task_artifacts = 11;

  // JSON-encoded list of workload identities declared on the task
  // (`identities[]`, see docs/workload-identity.md). Empty string or `[]`
  // when the task declares none. The worker uses this to know which tokens
  // to request via IssueWorkloadIdentityToken, how to deliver them
  // (env/file), and what to do on refresh (changeMode). The identity specs
  // carry no secrets — tokens themselves are fetched separately by the
  // worker and never transit the desired-state payload.
  string task_identities = 12;

  // Worker self-fence window, in seconds (`stateful.onLost.selfTerminateAfter`,
  // see docs/stateful-workloads.md "Node loss and fencing"). When non-zero,
  // the worker MUST locally kill this allocation once it has been unable to
  // complete a heartbeat against the manager for this long, and report it as
  // failed on the next successful heartbeat. This is the worker half of the
  // at-most-one guarantee: the manager will not plan a replacement for a
  // stateful allocation on a lost node until the node has been lost for
  // longer than this window plus a safety margin (`onLost.replaceAfter`), so
  // by the time a replacement binds the same instance id and storage handle,
  // the original is provably dead or fenced.
  //
  // 0 = no self-fencing (stateless tasks, which the manager replaces
  // eagerly). Stateful tasks always carry a non-zero value — the manager
  // applies the 90s default even when the jobspec declares no `onLost`
  // block.
  uint64 self_terminate_after_seconds = 13;

  // JSON-encoded list of volume mounts for this allocation (see
  // docs/volumes.md). Array of objects matching the `VolumeMount` shape:
  // `[{"volumeId":"…","name":"data","driver":"local-dir","params":{…},
  //    "attrs":{…},"path":"/var/lib/db","readOnly":false,
  //    "instanceVolume":true}]`.
  //
  // This is the post-admission form: the driver is resolved (the `local-dir`
  // default is already applied), the volume id is known, and `attrs` carries
  // whatever the driver recorded on a previous mount. The worker mounts
  // exactly this list through its volume drivers before starting the task and
  // unmounts on stop — it never re-derives a volume from the jobspec.
  //
  // Entries with `instanceVolume: true` come from `stateful.storage` and are
  // additionally exported as `LEGION_STORAGE_DIR`; the rest come from the
  // task's `volumes[]` claims. Every entry is exported as
  // `LEGION_VOLUME_<NAME>` with the resolved host path.
  //
  // Empty string when the task declares no volumes (the mount step is skipped
  // entirely).
  string task_volumes = 15;

  // JSON-encoded task `resources` block, exactly as declared in the jobspec
  // (`{"memory": 256, "cores": 1}`). Scheduler-side defaults are NOT folded
  // in: this is what the job asked for, so a runtime can tell "unset" from
  // "explicitly requested" and leave its own defaults alone.
  //
  // Task runtimes that isolate a workload use this to size it — the `container`
  // runtime maps `memory` (MiB) and `cores` onto the sandbox's memory/CPU
  // limits, since a guest that ignores the reservation the scheduler made on
  // its behalf can overcommit the node. Runtimes that run host processes
  // (`exec`) ignore it; enforcement there needs cgroups/jobobjects.
  //
  // Empty string when the task declares no resources.
  string task_resources = 16;

  // The task's declared stop ladder (`stop { signal, killAfter }`) as JSON,
  // e.g. `{"signal":"SIGINT","killAfter":"90s"}`.
  //
  // Carried on the allocation because the worker never sees a jobspec: it
  // rebuilds a TaskConfig from these scalar fields, so a task-level block not
  // on this message does not exist on the worker and every stop would silently
  // use the default ladder.
  //
  // Empty string when the task declared none, which is NOT the same as
  // declaring the default: the `container` runtime on Linux consults the
  // image's own `STOPSIGNAL` before falling back to `SIGTERM`, and can only do
  // that when it knows the jobspec was silent. Runtimes with nothing to signal
  // (`noop`) ignore the field entirely.
  string task_stop = 18;

  // Present only when this dispatch is a *provisional* start: work the node
  // may begin before the placement is durable (docs/edge-boot.md).
  //
  // When set, `allocation_id` is 0 — the manager mints allocation ids inside
  // the apply transaction, so a not-yet-committed placement has none. The
  // node keys the work by `provisional.claim_id` instead, and learns its
  // allocation id from the ratification verdict.
  //
  // Absent on every allocation of a job that did not opt into
  // `speculativeStart`, so a cluster that upgrades and changes nothing sends
  // byte-identical payloads. An old worker that ignores this field would run
  // the allocation immediately with no gate and no lease, which is why
  // pre-commit dispatch requires a minimum worker protocol version and falls
  // back to post-commit dispatch per node below it.
  ProvisionalAllocation provisional = 19;

  // JSON `NetworkConfig` as the task declared it: `mode`, `labels`, and any
  // inline `egress` / `ingress`. Empty when the task declares no `network`
  // block, so jobs without one stay byte-identical on the wire. The worker
  // reads `mode` and `labels` from it; the rules themselves arrive merged
  // with stored policies via `HeartbeatReply.net_policies`.
  string task_network = 20;
}

// Request payload for PostWork.
message PostWorkRequest {
  // Allocation payload to start/reconcile on worker.
  //
  // Required. Worker rejects request when this field is missing.
  TaskAllocation allocation = 1;
}

// Reply payload for PostWork.
message PostWorkReply {
  // Human-readable acknowledgement.
  //
  // Built-in worker reply value: `"Task accepted"`.
  string message = 1;
}

// === AUTH & ACL MESSAGES ===

// Request payload for WhoAmI. Identity comes from request metadata, not the body.
message WhoAmIRequest {
}

// Reply payload for WhoAmI.
message WhoAmIReply {
  // True when the manager enforces (or audits) ACLs.
  //
  // When false every caller has full access; clients should surface a
  // warning so operators know the cluster is unprotected.
  bool acl_enabled = 1;

  // True when ACLs run in audit-only mode: denials are logged but allowed.
  bool audit_only = 2;

  // How the caller was identified.
  //
  // One of: `disabled` (ACLs off), `token` (Legion ACL token), `jwt`
  // (external JWT validated by an auth method), `anonymous` (no credential).
  string source = 3;

  // Human-readable principal: token name, `user:<name>`, JWT subject, or
  // `anonymous`.
  string principal = 4;

  // Token type resolved for the caller: `management`, `client`, or `none`.
  string token_type = 5;

  // Names of the policies attached to the caller's identity.
  repeated string policies = 6;

  // RFC3339 expiry of the presented credential, when it has one.
  optional string expires_at = 7;

  // Accessor ID of the presented ACL token, when one was presented.
  //
  // Accessor IDs are safe to log and are the handle used by DeleteAclToken.
  optional string accessor_id = 8;

  // The caller's effective ACL rules as a JSON array (the same rule schema
  // as AclPolicy.rules_json), flattened from every attached policy.
  //
  // This is self-introspection: it reveals only what the caller's own
  // requests would reveal, and it is what lets clients like the UI hide
  // controls the identity cannot use. Management tokens and disabled ACLs
  // report `[{"resources":["*"],"actions":["*"]}]`. Unset for anonymous
  // callers with no anonymous policy.
  optional string rules_json = 9;
}

// Request payload for Login.
message LoginRequest {
  // Auth method name.
  //
  // `userpass` selects the built-in username/password method. Any other value
  // must match the name of a JWT/OIDC auth method in the manager config.
  string method = 1;

  // Username for the `userpass` method.
  optional string username = 2;

  // Password for the `userpass` method.
  optional string password = 3;

  // Externally issued JWT (for example an OIDC ID token) for JWT/OIDC methods.
  optional string jwt = 4;

  // Optional requested token lifetime (humantime format, for example "8h").
  //
  // Capped by the manager's configured maximum for the method. Default when
  // omitted: the method's `tokenTtl` (built-in default `24h`).
  optional string ttl = 5;
}

// Reply payload for Login.
message LoginReply {
  // Metadata for the newly minted token.
  AclTokenInfo token = 1;

  // The token secret. Returned exactly once; the manager stores only a hash.
  string secret = 2;
}

// Request payload for BootstrapAcl.
message BootstrapAclRequest {
  // Optional operator-provided secret for the initial management token
  // (infrastructure-as-code pre-seeding). Must be at least 24 characters.
  //
  // Default when omitted: the manager generates a random secret.
  optional string secret = 1;
}

// Reply payload for BootstrapAcl.
message BootstrapAclReply {
  // Metadata for the initial management token.
  AclTokenInfo token = 1;

  // The management token secret. Returned exactly once.
  string secret = 2;
}

// Metadata describing an ACL token. Never contains the secret.
message AclTokenInfo {
  // Public identifier for the token; safe to log and audit.
  string accessor_id = 1;

  // Human-readable token name. Tokens minted via Login are named
  // `<method>:<principal>` (for example "userpass:alice").
  string name = 2;

  // Token type: `management` (full access) or `client` (policy-scoped).
  string token_type = 3;

  // Names of attached policies. Empty for management tokens.
  repeated string policies = 4;

  // RFC3339 creation timestamp.
  string created_at = 5;

  // RFC3339 expiry. Omitted when the token never expires.
  optional string expires_at = 6;
}

// A named ACL policy.
//
// `rules_json` is a JSON array of rule objects:
//   [{"resources": ["job"], "actions": ["read", "write"],
//     "namespaces": ["default"], "names": ["web-*"]},
//    {"resources": ["kv"], "actions": ["read"], "paths": ["team/*"]},
//    {"resources": ["node"], "actions": ["read"], "pools": ["*"]},
//    {"resources": ["*"], "actions": ["*"], "effect": "deny",
//     "paths": ["secret/*"]}]
//
// Rule fields:
// - `resources`: resource types the rule covers (`job`, `node`, `kv`,
//   `state`, `operator`, `acl`, `exec`, `action`, `template`, or `*`).
// - `actions`: `read`, `write`, or `*`.
// - `effect`: `allow` (default) or `deny`. A matching deny rule always
//   overrides any allow.
// - Optional scope selectors (glob lists matched against the request):
//   `namespaces` (job namespaces), `names` (job names), `pools` (node
//   pools), `paths` (KV keys), `actionNames` (declared action names),
//   `templates` (job-template names). A rule with a selector only matches
//   requests that carry that attribute — which is why a `job` rule with
//   `templates: ["x"]` grants submission only through template `x` and
//   never via raw RunJob.
message AclPolicy {
  // Unique policy name. Tokens reference policies by exact name.
  string name = 1;

  // Free-form description.
  string description = 2;

  // JSON array of rules (see message comment for the schema).
  string rules_json = 3;

  // RFC3339 creation timestamp.
  string created_at = 4;

  // RFC3339 last-update timestamp.
  string updated_at = 5;
}

// Request payload for UpsertAclPolicy.
message UpsertAclPolicyRequest {
  // Policy name to create or replace.
  string name = 1;

  // Free-form description.
  string description = 2;

  // JSON array of rules (see AclPolicy for the schema). Validated on write.
  string rules_json = 3;
}

// Reply payload for UpsertAclPolicy.
message UpsertAclPolicyReply {
  // The stored policy.
  AclPolicy policy = 1;
}

// Request payload for GetAclPolicy.
message GetAclPolicyRequest {
  // Policy name (exact match).
  string name = 1;
}

// Reply payload for GetAclPolicy.
message GetAclPolicyReply {
  // The requested policy.
  AclPolicy policy = 1;
}

// Request payload for ListAclPolicies.
message ListAclPoliciesRequest {
}

// Reply payload for ListAclPolicies.
message ListAclPoliciesReply {
  // All policies, sorted by name.
  repeated AclPolicy policies = 1;
}

// Request payload for DeleteAclPolicy.
message DeleteAclPolicyRequest {
  // Policy name (exact match).
  string name = 1;
}

// Reply payload for DeleteAclPolicy.
message DeleteAclPolicyReply {
  // Human-readable status message.
  string message = 1;
}

// Request payload for CreateAclToken.
message CreateAclTokenRequest {
  // Human-readable token name.
  string name = 1;

  // Token type: `management` or `client`. Default when empty: `client`.
  string token_type = 2;

  // Names of existing policies to attach. Required (non-empty) for client
  // tokens; must be empty for management tokens.
  repeated string policies = 3;

  // Optional lifetime (humantime format, for example "720h").
  //
  // Default when omitted: the token never expires.
  optional string ttl = 4;
}

// Reply payload for CreateAclToken.
message CreateAclTokenReply {
  // Metadata for the new token.
  AclTokenInfo token = 1;

  // The token secret. Returned exactly once; the manager stores only a hash.
  string secret = 2;
}

// Request payload for ListAclTokens.
message ListAclTokensRequest {
}

// Reply payload for ListAclTokens.
message ListAclTokensReply {
  // All tokens (metadata only), newest first.
  repeated AclTokenInfo tokens = 1;
}

// Request payload for DeleteAclToken.
message DeleteAclTokenRequest {
  // Accessor ID of the token to revoke.
  string accessor_id = 1;
}

// Reply payload for DeleteAclToken.
message DeleteAclTokenReply {
  // Human-readable status message.
  string message = 1;
}

// A username/password ACL user. Never contains password material.
message AclUser {
  // Unique username.
  string username = 1;

  // Names of policies attached to tokens minted when this user logs in.
  repeated string policies = 2;

  // RFC3339 creation timestamp.
  string created_at = 3;

  // RFC3339 last-update timestamp.
  string updated_at = 4;
}

// Request payload for UpsertAclUser.
message UpsertAclUserRequest {
  // Username to create or update.
  string username = 1;

  // Plaintext password; hashed with argon2id before storage.
  //
  // When updating an existing user, an empty password keeps the current one.
  string password = 2;

  // Names of existing policies granted on login.
  repeated string policies = 3;
}

// Reply payload for UpsertAclUser.
message UpsertAclUserReply {
  // The stored user.
  AclUser user = 1;
}

// Request payload for ListAclUsers.
message ListAclUsersRequest {
}

// Reply payload for ListAclUsers.
message ListAclUsersReply {
  // All users, sorted by username.
  repeated AclUser users = 1;
}

// Request payload for DeleteAclUser.
message DeleteAclUserRequest {
  // Username (exact match).
  string username = 1;
}

// Reply payload for DeleteAclUser.
message DeleteAclUserReply {
  // Human-readable status message.
  string message = 1;
}

// === AUTH METHODS & JOIN TOKENS ===

// Request payload for GetAuthMethods.
message GetAuthMethodsRequest {
}

// Public metadata for one auth method (no secrets or keys).
message AuthMethodInfo {
  // Method name; pass to Login / `legion login --method <name>`.
  string name = 1;

  // Method kind: `userpass`, `jwt`, `oidc`, `webhook`, or `custom`.
  string kind = 2;

  // OIDC issuer URL (oidc kind only). Clients run discovery against it.
  optional string oidc_issuer = 3;

  // OAuth client ID registered for Legion at the identity provider
  // (oidc kind only). Required for browser/CLI redirect login.
  optional string oidc_client_id = 4;

  // OAuth scopes to request (oidc kind only). Default: ["openid"].
  repeated string oidc_scopes = 5;
}

// Reply payload for GetAuthMethods.
message GetAuthMethodsReply {
  // All registered auth methods, in registration order (userpass first).
  repeated AuthMethodInfo methods = 1;
}

// Request payload for CreateJoinToken.
message CreateJoinTokenRequest {
  // Worker type the token introduces (selects the worker template).
  //
  // Default when empty: "default".
  string worker_type = 1;

  // Optional lifetime (humantime format, for example "24h").
  //
  // Default when omitted: 24h. Pass "none" for a non-expiring token
  // (discouraged; prefer short-lived tokens).
  optional string ttl = 2;

  // Free-form description shown in ListJoinTokens (for example "rack 12").
  string description = 3;
}

// Metadata describing a join token. Never contains the secret.
message JoinTokenInfo {
  // Public identifier; the handle used by DeleteJoinToken.
  string id = 1;

  // Worker type this token introduces.
  string worker_type = 2;

  // Free-form description.
  string description = 3;

  // RFC3339 expiry. Omitted when the token never expires.
  optional string expires_at = 4;

  // RFC3339 creation timestamp.
  string created_at = 5;
}

// Reply payload for CreateJoinToken.
message CreateJoinTokenReply {
  // Token metadata.
  JoinTokenInfo info = 1;

  // The composite join token handed to the worker
  // (`legion join <TOKEN>`). Base64url-encoded JSON carrying the manager
  // address, the secret, and the worker type. Returned exactly once; the
  // manager stores only a hash of the embedded secret.
  string token = 2;
}

// Request payload for ListJoinTokens.
message ListJoinTokensRequest {
}

// Reply payload for ListJoinTokens.
message ListJoinTokensReply {
  // All join tokens (metadata only), newest first.
  repeated JoinTokenInfo tokens = 1;
}

// Request payload for DeleteJoinToken.
message DeleteJoinTokenRequest {
  // Join token ID to revoke.
  string id = 1;
}

// Reply payload for DeleteJoinToken.
message DeleteJoinTokenReply {
  // Human-readable status message.
  string message = 1;
}

// === EDGE BOOT (provisional allocations, gates, boot tickets) ===

// How far a node may get on a start before the placement is durable
// (docs/edge-boot.md). Both the task's `speculativeStart.mode` and a boot
// ticket's `legion.io/gate` claim carry one of these; the LOWER of the two
// always wins, so neither a jobspec nor a ticket can raise the other's
// ceiling.
enum GateLevel {
  // No speculation: today's behavior. The node is told about the allocation
  // only after the commit. This is the default for every task.
  GATE_OFF = 0;

  // The node may fetch artifacts, pull images, build root disks, and
  // provision (but not attach) node-local volumes before the commit. It may
  // NOT start the workload. Nothing outside the node can observe a staged
  // claim; the only cost of losing the race is wasted local work.
  GATE_STAGE = 1;

  // Everything `GATE_STAGE` allows, plus booting the guest and running the
  // workload with its network held shut. It may NOT open the network,
  // register in service discovery, attach shared storage, or obtain any
  // Legion-issued identity until ratified.
  //
  // The network gate is a real boundary for the `sandbox` runtime (the TAP
  // device is held down with a default-drop filter) and a weaker one for
  // host runtimes — see docs/edge-boot.md "What the gate does and does not
  // stop".
  GATE_BOOT = 2;

  // Everything `GATE_BOOT` allows, plus opening the network immediately.
  // The fastest mode, and the only one where a workload that loses its race
  // may already have produced externally visible side effects before it is
  // killed. It still cannot obtain a Legion-issued identity or attach shared
  // storage, so a loser can never act as the winner inside the cluster.
  GATE_SERVE = 3;
}

// Why a ratification was refused. Workers treat an unrecognized value as
// `REFUSAL_UNSPECIFIED` and kill the work anyway — fail-closed under skew.
enum ClaimRefusalReason {
  // Reason not stated (or from a newer manager than this worker knows).
  REFUSAL_UNSPECIFIED = 0;

  // Another allocation already owns this instance id. The expected outcome
  // of two edges racing for one sandbox: the first ratification binds, this
  // one loses.
  REFUSAL_INSTANCE_CLAIMED = 1;

  // The node no longer has room for the placement, as re-validated on the
  // fresh node row inside the apply transaction.
  REFUSAL_NO_CAPACITY = 2;

  // The node does not satisfy the task's constraints/permit, or is cordoned,
  // draining, or lost.
  REFUSAL_INELIGIBLE = 3;

  // The claim's lease expired before the ratification reached the manager.
  REFUSAL_EXPIRED = 4;

  // The boot ticket was invalid: bad signature, wrong audience, wrong pool,
  // expired, or a `jti` already spent (single-use replay).
  REFUSAL_TICKET_INVALID = 5;

  // The job config, task, or instance named by the claim does not exist.
  REFUSAL_UNKNOWN_TARGET = 6;

  // Edge boot is disabled on this manager (`edgeBoot.enabled: false`).
  REFUSAL_DISABLED = 7;

  // The manager failed to apply the ratification for an internal reason
  // (a store error, a raft election in progress). Retriable within the
  // lease; fatal at the deadline.
  REFUSAL_INTERNAL = 8;
}

// The provisional half of a dispatch: everything a worker needs to run work
// that is not yet durable, and to kill it if it never becomes durable.
//
// Absent on every allocation of a job that did not opt into
// `speculativeStart`, so today's dispatch payloads are unchanged on the wire.
message ProvisionalAllocation {
  // Claim id (`clm_<uuid>`), minted by whoever asked for the start. This is
  // the correlation key for the whole lifecycle: the worker keys its claim
  // table by it, ratification names it, and it appears in every event.
  string claim_id = 1;

  // How far this start may get before ratification.
  GateLevel gate = 2;

  // Unix seconds after which the worker MUST kill this work unconditionally
  // if it has not been ratified. This is the lease, and it is the backstop
  // for every failure mode the reply path cannot cover — a partition, a dead
  // manager, a lost reply.
  int64 lease_deadline_unix = 3;

  // Instance id this claim is racing for, when the task is stateful. Empty
  // for stateless tasks. Stable from the first millisecond, which is why an
  // edge addresses a sandbox by this rather than by an allocation id that
  // does not exist yet.
  string instance_id = 4;

  // How the start was authorized: `manager` (pre-commit dispatch from a
  // manager that is applying the plan right now) or `edge` (a node acting on
  // a boot ticket).
  string origin = 5;

  // What to do when ratification is refused: `kill` (default — a hard
  // destroy) or `stop` (the task's normal graceful-stop ladder, then
  // removal). Mirrors `speculativeStart.onRefused`.
  string on_refused = 6;

  // The boot ticket's `jti`, for edge-originated starts. Carried into
  // ratification so the manager can enforce single use, and into the audit
  // events so a start is traceable to the capability that authorized it.
  // Never the ticket itself — no ticket material ever appears in a log,
  // event, or store row.
  string ticket_jti = 7;
}

// One unratified claim a worker is holding, reported on every heartbeat.
//
// This is what makes started-but-unconfirmed work visible to an operator
// looking at capacity, and it is the catch-up channel's key: a manager that
// sees a claim it has already decided replies with a verdict in
// `HeartbeatReply.claim_verdicts`.
message ProvisionalClaimReport {
  // Claim id.
  string claim_id = 1;

  // Job config this claim runs an exact version of.
  string job_config_id = 2;

  // Task name within that config.
  string task_name = 3;

  // Instance id being raced for, empty for stateless tasks.
  string instance_id = 4;

  // Gate level actually in force (the lower of the task's mode and any
  // ticket ceiling).
  GateLevel gate = 5;

  // How far the claim has actually progressed: `claimed`, `staged`,
  // `booted`, or `serving`.
  string stage = 6;

  // Unix seconds at which the worker kills this claim if still unratified.
  int64 lease_deadline_unix = 7;

  // JSON-encoded resource request this claim is holding in the node's local
  // ledger, so the manager can show unratified usage alongside committed
  // usage.
  string resources = 8;
}

// A ratification verdict delivered out-of-band on a heartbeat.
//
// The primary delivery is the `RatifyClaim` reply. This field exists because
// that reply can be lost (the connection dies after the manager committed):
// without it the worker would kill work the cluster believes is running, and
// the instance would be bound to a dead allocation until the next reschedule.
message ClaimVerdict {
  // Claim the verdict is about.
  string claim_id = 1;

  // True when the claim was confirmed and `allocation_id` is set.
  bool confirmed = 2;

  // Manager-minted allocation id, set only when `confirmed`.
  int64 allocation_id = 3;

  // Why it was refused, when not confirmed.
  ClaimRefusalReason reason = 4;

  // Human-readable detail (`bound to node-a`), for logs and `legion instance
  // get`. Never contains ticket material.
  string detail = 5;
}

// Request payload for IssueBootTicket.
message IssueBootTicketRequest {
  // Job the ticket may start work for. Required; also the ACL scope.
  string job = 1;

  // Task within that job. Required — a ticket names one task, never a whole
  // group.
  string task = 2;

  // Exact job config id the ticket authorizes. Optional: when empty the
  // manager pins the job's current config at mint time and returns it in the
  // reply. A ticket NEVER means "latest" — pinning at mint is what keeps a
  // redeploy from silently widening what a live ticket can start.
  string job_config_id = 3;

  // Exactly one of these bounds which instance may be started:
  //
  // - `instance_id` — one specific sandbox. The narrowest capability.
  // - `instance_prefix` — any instance whose id starts with this string.
  //   Must be non-empty; an empty prefix would authorize every instance of
  //   the task. Lets a platform mint one ticket per user cohort rather than
  //   one per request, at the cost of a wider capability if the node holding
  //   it is compromised.
  //
  // Both empty is rejected for stateful tasks.
  string instance_id = 4;
  string instance_prefix = 5;

  // Node pool the ticket may be redeemed in. Required: a ticket says what
  // may run AND where. The worker checks this against its own pool offline.
  string pool = 6;

  // Ceiling on how far a redeeming node may get before ratification. The
  // task's own `speculativeStart.mode` also caps it, and the lower of the
  // two always wins. `GATE_OFF` mints a ticket that can stage nothing —
  // rejected as a mistake.
  GateLevel gate = 7;

  // Requested lifetime, e.g. `"5m"`. Defaults to `edgeBoot.defaultTicketTtl`
  // and is clamped to `edgeBoot.maxTicketTtl`. Revocation is by TTL only
  // (see docs/edge-boot.md) — the fast path cannot consult a revocation list
  // without becoming the round trip the ticket exists to avoid.
  string ttl = 8;

  // How many times the ticket may be ratified. Defaults to 1 (single use).
  // Enforced at the manager through the idempotency table, so two nodes
  // presented the same ticket both boot but only the first is confirmed.
  uint32 uses = 9;

  // Optional idempotency key. A repeat with the same key returns the
  // originally minted ticket rather than minting a second capability.
  optional string idempotency_key = 10;
}

// Reply payload for IssueBootTicket.
message IssueBootTicketReply {
  // The signed ticket. This is the only time the manager returns it — the
  // store keeps metadata (`jti`, scope, expiry, accessor) for audit and
  // single-use enforcement, never the token bytes.
  string ticket = 1;

  // The ticket's `jti`, safe to log and to correlate against events.
  string jti = 2;

  // Exact job config the ticket is pinned to.
  string job_config_id = 3;

  // Expiry, unix seconds.
  int64 expires_at_unix = 4;

  // True when this reply replayed an earlier mint for the same idempotency
  // key rather than minting a new ticket.
  bool deduplicated = 5;
}

// Request payload for ListBootTickets.
message ListBootTicketsRequest {
  // Restrict to tickets for one job. Empty lists every ticket the caller is
  // allowed to see.
  string job = 1;
}

// One outstanding boot ticket, metadata only.
message BootTicket {
  // Ticket id (`jti`).
  string jti = 1;
  // Job the ticket authorizes starts for.
  string job = 2;
  // Task within that job.
  string task = 3;
  // Exact job config the ticket is pinned to.
  string job_config_id = 4;
  // Instance id it may start, when narrowed to one.
  string instance_id = 5;
  // Instance prefix it may start, when narrowed to a cohort.
  string instance_prefix = 6;
  // Node pool it may be redeemed in.
  string pool = 7;
  // Gate ceiling.
  GateLevel gate = 8;
  // Remaining redemptions.
  uint32 uses_remaining = 9;
  // Expiry, unix seconds.
  int64 expires_at_unix = 10;
  // ACL accessor id that minted it — who to ask about a start you did not
  // expect. Never a token secret.
  string accessor_id = 11;
  // Mint time, RFC3339.
  string created_at = 12;
}

// Reply payload for ListBootTickets.
message ListBootTicketsReply {
  // Live tickets, newest first.
  repeated BootTicket tickets = 1;
}

// Request payload for RatifyClaim (worker plane).
message RatifyClaimRequest {
  // Node making the claim. Must match the node token on the request.
  string node_id = 1;

  // Claim being ratified.
  string claim_id = 2;

  // Exact job config the work runs.
  string job_config_id = 3;

  // Task within that config.
  string task_name = 4;

  // Instance id being bound, empty for stateless tasks.
  string instance_id = 5;

  // Gate level the work is currently held at, for the audit trail.
  GateLevel gate = 6;

  // Boot ticket that authorized the start, for edge-originated claims. The
  // manager re-verifies it (nodes are honest but not trusted to be the only
  // holder) and spends its `jti` when the ticket is single-use. Empty for
  // manager-originated claims, which were authorized by the submit that
  // produced them.
  string ticket = 7;
}

// Reply payload for RatifyClaim.
message RatifyClaimReply {
  // True when the placement committed. The worker opens the network and the
  // claim becomes an ordinary allocation.
  bool confirmed = 1;

  // Manager-minted allocation id, set only when `confirmed`.
  int64 allocation_id = 2;

  // Why it was refused, when not confirmed.
  ClaimRefusalReason reason = 3;

  // Human-readable detail for logs and `legion instance get`.
  string detail = 4;

  // The committed allocation, in the exact form an ordinary dispatch would
  // have carried it: the manager-minted id, the assigned network, and the
  // resolved volume mounts.
  //
  // Present only when `confirmed`. This is what lets a provisional start
  // finish as a *normal* allocation rather than as a second-class one: the
  // node replaces the payload it booted with (which could not name ports or
  // volumes, because those are assigned inside the apply transaction) before
  // it starts the workload or opens the network.
  //
  // It carries the same `provisional.claim_id`, so a node can match it to the
  // claim without trusting field ordering.
  TaskAllocation allocation = 5;
}

// Request payload for Worker.StartClaim (the edge entry point).
message StartClaimRequest {
  // Signed boot ticket authorizing this start. Verified entirely offline
  // against the cached JWKS; a node that cannot reach any manager can still
  // admit a start.
  string ticket = 1;

  // Instance id to start. Must equal the ticket's `legion.io/instance`, or
  // begin with its `legion.io/instance_prefix`.
  string instance_id = 2;

  // Caller-minted claim id (`clm_<uuid>`). Supplying it makes the call
  // retry-safe: a repeat with the same id joins the existing claim's stream
  // instead of starting a second sandbox.
  string claim_id = 3;

  // Requested gate ceiling. Capped by both the ticket's gate and the task's
  // `speculativeStart.mode`; the lowest of the three wins.
  GateLevel gate = 4;

  // Verify the ticket and local admission, then report what WOULD happen and
  // stop — no artifacts fetched, nothing booted, no claim held. For agents
  // and routers that want to self-correct before mutating anything.
  bool dry_run = 5;
}

// One transition on a StartClaim stream. The caller learns each stage
// without polling; a router may begin routing at `booted` and must expect
// `refused` at any point up to `ratified`.
message StartClaimReply {
  // Claim id (echoed, or the one the worker minted).
  string claim_id = 1;

  // Lifecycle stage reached: `admitted`, `staged`, `booted`, `serving`,
  // `ratified`, or `refused`.
  string stage = 2;

  // Manager-minted allocation id, set on the `ratified` frame only.
  int64 allocation_id = 3;

  // Refusal reason, set on the `refused` frame only.
  ClaimRefusalReason reason = 4;

  // Human-readable detail for the frame.
  string detail = 5;

  // Gate level in force for this claim, after intersecting the request, the
  // ticket, and the task's own mode.
  GateLevel gate = 6;
}

// === RAFT TRANSPORT (manager-plane internal) ===

// RaftTransport is the internal manager<->manager consensus transport for the
// replicated state store (docs/plans/durability-and-ops-execution-plan.md §2).
//
// This service is NOT part of the public Legion API and is NOT covered by the
// Manager-service ACL system (`tests/acl_endpoints.rs` classifies Manager
// RPCs only). It is called exclusively by other managers in the same cluster —
// never by workers, CLIs, or UIs.
//
// Wire contract:
// - `payload` fields carry opaque, serde-encoded openraft 0.9 protocol types
//   (serialized with serde_json — see `src/storage/raft/network.rs` /
//   `src/storage/raft/server.rs` for the exact types on each RPC). Their
//   layout is an internal detail of the openraft version compiled into the
//   manager binary and is versioned by `PROTOCOL_VERSION`
//   (`src/constants.rs`) together with the rest of the manager plane:
//   managers with incompatible protocol versions must not be mixed in one
//   cluster (docs/upgrades.md — managers upgrade first).
// - `group_id` selects the raft group ("lane"). Values are the lane wire
//   names defined by `Lane` in `src/storage/raft/mod.rs`: "control",
//   "scheduler", "status". In the default `single` topology one group
//   (the control lane) carries all tables.
// - Every RPC must carry the cluster secret in request metadata under
//   `x-legion-raft-secret`. The secret is minted at bootstrap and travels
//   only inside signed join tokens; requests with a missing or mismatched
//   secret are rejected (Unauthenticated / PermissionDenied). Shared-secret
//   auth is the documented stopgap (plan JC-7) until manager-plane mTLS
//   lands with the worker-authn work.
service RaftTransport {
  // openraft AppendEntries for one group: log replication and leader
  // heartbeats. The request payload decodes as
  // `openraft::raft::AppendEntriesRequest<TypeConfig>`; the reply payload
  // encodes `Result<AppendEntriesResponse, RaftError>` so typed raft errors
  // (including higher-vote rejections) round-trip to the caller's openraft
  // core instead of being flattened into gRPC status codes.
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  rpc AppendEntries (RaftLaneRequest) returns (RaftLaneReply);

  // openraft RequestVote for one group (leader election). Payloads decode as
  // `VoteRequest` / `Result<VoteResponse, RaftError>`.
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  rpc Vote (RaftLaneRequest) returns (RaftLaneReply);

  // openraft InstallSnapshot: transfers one snapshot *chunk* for one group.
  //
  // This is deliberately a unary RPC with a bytes payload rather than a gRPC
  // client-streaming call: openraft 0.9's default snapshot transport already
  // implements chunking (offset + done bookkeeping, bounded by the
  // `snapshot_max_chunk_size` raft config) and calls this RPC once per
  // chunk, so wrapping it in a gRPC stream would duplicate the offset/ack
  // protocol that openraft maintains anyway. Payloads decode as
  // `InstallSnapshotRequest` (vote, offset, data, done) /
  // `Result<InstallSnapshotResponse, RaftError<_, InstallSnapshotError>>`.
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  rpc InstallSnapshot (RaftLaneRequest) returns (RaftLaneReply);

  // Adds a new manager to the raft cluster (plan §A4).
  //
  // The joining manager presents the signed join token minted by
  // `legion raft join-token` (which embeds the cluster id, the leader's
  // advertise address, and the cluster secret) plus its own identity. The
  // leader validates the token, derives the joiner's deterministic raft id
  // (`fnv1a64(node_id)` — see `src/storage/raft/types.rs`), adds it as a
  // learner to every configured group so it catches up via snapshot install,
  // and later promotes it to voter. The reply reports the assigned raft id
  // and the current membership of every group so the joiner can seed its
  // peer table. One token joins all lanes.
  // ACL: manager-plane internal, authenticated by cluster secret metadata
  // (the joiner reads the secret out of the join token before calling).
  rpc Join (JoinRaftClusterRequest) returns (JoinRaftClusterReply);

  // Executes one named single-lane store write on this manager, which must
  // currently lead the lane named by `group_id` (plan §8, D2 — standing-split
  // resilience).
  //
  // A manager that receives a worker-plane write (a heartbeat, a health
  // report, an allocation failure report) but does not lead the owning lane
  // forwards the operation here instead of failing the worker: the request
  // payload is a serde_json-encoded `ForwardableLaneWrite` — a closed enum
  // of forwardable operations carrying their FULL arguments (the executor
  // never derives payload from its own, possibly-lagging replica) — and the
  // reply payload is a serde_json-encoded `ForwardOutcome`: the operation's
  // JSON-encoded return value on success, a typed not-the-leader outcome
  // (with this node's own leader hint) when the receiving manager does not
  // lead the lane either, or an error message. The receiver executes the
  // operation's non-forwarding variant, so a stale hint produces one typed
  // rejection back to the origin rather than a forwarding loop.
  //
  // Also the worker-continuity path in `single` topology: workers dial one
  // fixed manager, so after a failover the demoted ex-leader forwards their
  // liveness to the new leader instead of rejecting every heartbeat (which
  // previously marked healthy workers lost and self-fenced their stateful
  // allocations).
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  rpc ForwardLaneWrite (RaftLaneRequest) returns (RaftLaneReply);

  // Reports which nodes a manager has personally received heartbeats from,
  // to the manager that leads the status lane.
  //
  // This is what keeps liveness off the raft path under `lanes` topology with
  // a standing leadership split. Workers dial ONE manager forever, so a
  // manager that leads nothing still receives their beats; rather than
  // forwarding each beat as a replicated write (the pre-digest behavior, kept
  // as the mixed-version fallback), it batches the ids it heard from and sends
  // one of these per `liveness.digestInterval`. The cost is
  // `managers x 1 RPC/interval`, independent of fleet size — at 1000 nodes
  // across 3 managers, 2 RPCs a second carrying ~333 ids each, against ~500
  // forwarded raft writes a second before.
  //
  // Pushed rather than pulled deliberately: a pull would make the lost
  // decision itself depend on a fan-out completing, so a manager that was slow
  // at tick time would make its nodes look dead. A push lets the leader hold
  // the last digest, know how old it is, and DECLINE to decide — see
  // `liveness.peerDigestGrace`.
  //
  // Carries ids only, not per-node times. Ids plus the digest's own timestamp
  // decide liveness at `digestInterval` resolution, and it keeps the message
  // small and the merge trivial.
  //
  // ACL: manager-plane internal, authenticated by cluster secret metadata —
  // it is not a `Manager` RPC, so it takes no ACL row and
  // `tests/acl_endpoints.rs::every_manager_rpc_is_classified` does not cover
  // it. See docs/node-liveness.md.
  rpc ReportNodeLiveness (NodeLivenessDigestRequest)
    returns (NodeLivenessDigestReply);

  // Hands the cluster's KV root key to an existing member that lacks it
  // (docs/kv-encryption.md).
  //
  // A joiner receives the root key in its `Join` reply, but a member that
  // was already in the cluster when KV encryption arrived (a rolling
  // upgrade to the first release with encryption) never joins again. Each
  // manager whose `file` provider has no key calls this on the control-lane
  // leader, then on the other members, until one answers with a bundle, and
  // writes the key to its own key file. Any member that holds the key
  // answers. A member without a key, or whose provider keeps the key to
  // itself (`exec`), answers with an empty bundle; the answering member
  // never mints a key for this call.
  //
  // The answer is sealed exactly like `JoinRaftClusterReply.root_key_bundle`
  // (AES-256-GCM under a key derived from the cluster secret, bound to the
  // cluster id). The caller must be a current member of the control lane.
  // An older manager answers `Unimplemented`; the caller retries on its next
  // keyring tick.
  //
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  // It is not a `Manager` RPC, so it takes no ACL row.
  rpc FetchRootKey (FetchRootKeyRequest) returns (FetchRootKeyReply);
}

// Request payload for RaftTransport.FetchRootKey.
message FetchRootKeyRequest {
  // The calling manager's string identity (its raft `nodeId`). The answering
  // member refuses a caller whose derived raft id is not in the control
  // lane's membership.
  string node_id = 1;
}

// Reply payload for RaftTransport.FetchRootKey.
message FetchRootKeyReply {
  // The cluster id the bundle is bound to. The caller refuses a bundle for
  // any cluster but its own.
  string cluster_id = 1;

  // The root key material, sealed as in `JoinRaftClusterReply`. Empty when
  // the answering member has no exportable key (none yet, or `exec`). The
  // caller writes it to its key file only if that file does not exist yet.
  bytes root_key_bundle = 2;
}

// One manager's report of the nodes it is hearing from.
message NodeLivenessDigestRequest {
  // Sender's wire-protocol version, so a receiver can refuse a digest it
  // cannot interpret rather than silently dropping nodes from liveness.
  uint32 protocol_version = 1;

  // The reporting manager's string id ("host:port"). The leader keys its
  // per-peer staleness tracking on this, and raises
  // `legion_liveness_peer_stale{peer}` for it when the digests stop.
  string observer_manager_id = 2;

  // When the sender took this observation, unix milliseconds. Advisory: the
  // receiver times peer staleness on its OWN clock, because two managers'
  // wall clocks disagreeing must not turn into node loss.
  int64 observed_at_unix_ms = 3;

  // Every node this manager has received a heartbeat from since its last
  // digest. Authoritative for this peer: the leader REPLACES the peer's
  // previous claimed set, so a node that moved managers is not left attributed
  // to the old one.
  repeated string seen_node_ids = 4;
}

// Reply payload for RaftTransport.ReportNodeLiveness.
message NodeLivenessDigestReply {
  // True when the receiver leads the status lane and merged the digest.
  bool accepted = 1;

  // True when the receiver does NOT lead the status lane. The sender re-targets
  // using `leader_hint`, exactly as ForwardLaneWrite callers do; until it
  // does, its nodes are covered by the previous leader's `peerDigestGrace`.
  bool not_status_leader = 2;

  // The receiver's own view of who leads the status lane, as "host:port".
  // Empty when it does not know (mid-election).
  string leader_hint = 3;

  // The heartbeat interval, in seconds, the status-lane leader is serving its
  // workers. Set only on an accepted digest from a leader running adaptive
  // cadence (the default). The sender serves the same value on its own
  // heartbeat replies, so every worker gets one cadence whichever manager it
  // talks to. Absent when the leader has adaptive cadence off or predates
  // this field, and the sender then serves no interval either.
  optional uint32 served_interval_seconds = 4;
}

// Request envelope for the three openraft protocol RPCs (AppendEntries,
// Vote, InstallSnapshot).
message RaftLaneRequest {
  // Raft group ("lane") wire name: "control", "scheduler", or "status".
  // Must name a group that is active on the receiving node.
  string group_id = 1;

  // Opaque serde_json-encoded openraft request message. The concrete type
  // depends on the RPC (see the service comments); the encoding is the
  // openraft 0.9 serde representation, internal to the manager plane and
  // versioned by PROTOCOL_VERSION. Binary fields inside it (the changeset
  // in an entry, an install-snapshot chunk) are base64 strings, not JSON
  // number arrays — see `storage::raft::types::wire_bytes`.
  bytes payload = 2;
}

// Reply envelope for the three openraft protocol RPCs.
message RaftLaneReply {
  // Opaque serde_json-encoded `Result<Reply, RaftError>` (see the service
  // comments for the concrete type per RPC). Application-level raft errors
  // travel here; gRPC status codes are reserved for transport/auth/dispatch
  // failures (unreachable group, bad secret, undecodable payload).
  bytes payload = 1;
}

// Request payload for RaftTransport.Join.
message JoinRaftClusterRequest {
  // The signed join token minted by `legion raft join-token` on the leader.
  // Carries cluster id, leader advertise address, and the cluster secret;
  // the leader re-validates it here so a leaked advertise address alone is
  // not enough to join.
  string join_token = 1;

  // The joining manager's string identity (its manager node id/name). The
  // raft node id used in membership is derived from this deterministically:
  // `fnv1a64(node_id)`.
  string node_id = 2;

  // "host:port" the cluster should dial to reach the joining manager's gRPC
  // listener (the RaftTransport service shares the manager's tonic
  // listener).
  string advertise_addr = 3;

  // The joiner's configured raft topology ("single" or "lanes"), so the
  // leader can refuse a mixed-topology cluster at enrollment (plan JC-43).
  // A joiner configured differently would enroll into groups it does not
  // run (or run groups nobody replicates to), which is unrecoverable once
  // its log advances. Empty means a pre-JC-43 manager, which is only ever
  // "single".
  string topology = 4;
}

// Reply payload for RaftTransport.Join.
message JoinRaftClusterReply {
  // The raft node id assigned to the joiner: `fnv1a64(request.node_id)`.
  // Deterministic, so re-joins and restarts always map to the same id.
  uint64 assigned_raft_id = 1;

  // The cluster id this membership belongs to (from the join token).
  string cluster_id = 2;

  // Current membership of every active raft group, so the joiner can seed
  // its peer table before its first snapshot install.
  repeated RaftGroupMembership groups = 3;

  // The cluster's KV root key material for the joiner (docs/kv-encryption.md),
  // so "join the cluster" is one command on a cluster whose root key lives
  // in a file: AES-256-GCM under a key derived (HKDF-SHA256) from the
  // cluster secret, bound to the cluster id. Empty when the leader's
  // provider does not export material (`exec` — a KMS-held key never
  // leaves the KMS) or has none. The joiner writes it to its own key file
  // only if that file does not exist yet, never overwriting one.
  bytes root_key_bundle = 4;
}

// Membership of one raft group ("lane").
message RaftGroupMembership {
  // Lane wire name: "control", "scheduler", or "status".
  string group_id = 1;

  // All members currently known to this group (voters and learners).
  repeated RaftMemberInfo members = 2;
}

// One raft group member.
message RaftMemberInfo {
  // The member's raft node id (`fnv1a64` of its manager string id).
  uint64 raft_id = 1;

  // The member's manager string id (decoded from the "name@host:port"
  // openraft BasicNode address — see `src/storage/raft/types.rs`).
  string node_id = 2;

  // "host:port" of the member's gRPC listener.
  string advertise_addr = 3;

  // True for voters, false for learners still catching up.
  bool voter = 4;
}

// ---------------------------------------------------------------------------
// Network policy (docs/network-handlers.md)
// ---------------------------------------------------------------------------

// A stored network policy object.
message NetPolicy {
  // Unique name; letters, digits, '-', '_', '.'.
  string name = 1;

  // Merge priority: higher applies first among `require` policies and wins
  // among `default` ones.
  int64 priority = 2;

  // `require` or `default`.
  string enforcement = 3;

  // The whole object as canonical JSON (a `NetPolicyObject`): selector,
  // enforcement, optional mode, egress, ingress, description. Normalized —
  // `allow` sugar is already expanded into rules.
  string object_json = 4;

  // Free-form description from the object.
  string description = 5;

  string created_at = 6;
  string updated_at = 7;
}

// Request payload for UpsertNetPolicy.
message UpsertNetPolicyRequest {
  // A `NetPolicyObject` as JSON, exactly as `legion net policy apply -f`
  // reads it (Nickel evaluated to JSON). Validated on write.
  string object_json = 1;

  // When set, validate and report which running allocations would be
  // affected, but write nothing.
  bool dry_run = 2;
}

// Reply payload for UpsertNetPolicy.
message UpsertNetPolicyReply {
  // The stored (normalized) policy. On a dry run, what would be stored.
  NetPolicy policy = 1;

  // Running allocations whose effective policy would change, as
  // `job/task@allocation` strings. Populated on dry runs and on writes.
  repeated string affected_allocations = 2;
}

// Request payload for GetNetPolicyObject.
message GetNetPolicyObjectRequest {
  string name = 1;
}

// Reply payload for GetNetPolicyObject.
message GetNetPolicyObjectReply {
  NetPolicy policy = 1;
}

// Request payload for ListNetPolicies.
message ListNetPoliciesRequest {}

// Reply payload for ListNetPolicies.
message ListNetPoliciesReply {
  repeated NetPolicy policies = 1;

  // Monotonic generation of the policy set; changes on every write.
  uint64 generation = 2;
}

// Request payload for DeleteNetPolicy.
message DeleteNetPolicyRequest {
  string name = 1;
}

// Reply payload for DeleteNetPolicy.
message DeleteNetPolicyReply {}

// Request payload for ShowNetPolicy.
message ShowNetPolicyRequest {
  // Job id.
  string job_id = 1;

  // Task name; when empty and the job has one task, that task.
  string task_name = 2;

  // Node pool to match selectors against; empty means "any pool" (pool
  // selectors are treated as matching).
  string node_pool = 3;
}

// Reply payload for ShowNetPolicy.
message ShowNetPolicyReply {
  // The merged `EffectivePolicy` as JSON: `mode`, `egress`, `ingress`, each
  // rule and handler carrying `source` (`policy/<name>#<index>` or
  // `task#<index>`), the ordered `sources`, and the content `hash`.
  string effective_json = 1;

  // Names of the stored policies that matched, in application order.
  repeated string matched_policies = 2;

  // The task's declared `network.mode` and the mode the merge resolved.
  string declared_mode = 3;
  string effective_mode = 4;

  // The node datapath's last-reported status for this task's allocations
  // (one entry per running allocation; empty when none has reported), as
  // JSON `NetAllocStatus` objects. Best effort and at most one heartbeat
  // stale.
  repeated string node_status_json = 5;
}

// Request payload for TestNetPolicy.
message TestNetPolicyRequest {
  string job_id = 1;
  string task_name = 2;
  string node_pool = 3;

  // Egress test: a destination as `host[:port]`, an IP, or a URL
  // (`https://api.github.com/user` sets host, port, and path).
  string to = 4;

  // Ingress test: the peer, as `host[:port]` / IP, optionally with an
  // identity (`prod:default:checkout:web`).
  string from = 5;
  string identity = 6;

  // Request-time facts for HTTP chains. Optional.
  string method = 7;
  string path = 8;
}

// Reply payload for TestNetPolicy.
message TestNetPolicyReply {
  // `allow`, `deny`, or `defer` (a request-time rule would decide and no
  // method/path was given).
  string verdict = 1;

  // The rule that decided (`policy/<name>#<index>`, `task#<index>`, or
  // `fallthrough`); empty on allow-by-absence.
  string source = 2;

  // The rule's `reason`, if any.
  string reason = 3;

  // Which direction was tested and which protocol the chain runs.
  string direction = 4;
  string protocol = 5;

  // Human-readable one-line explanation.
  string explanation = 6;
}

// Request payload for FetchNetPolicy (worker plane).
message FetchNetPolicyRequest {
  // Node id of the caller. With ACLs enforced it must match the node token
  // on the request (see `HeartbeatRequest.id`).
  string node_id = 1;

  // Content hash from `HeartbeatReply.net_policies`.
  string hash = 2;
}

// Reply payload for FetchNetPolicy.
message FetchNetPolicyReply {
  // The `EffectivePolicy` as JSON. Its `hash` field equals the request hash.
  string effective_json = 1;
}

// One allocation's effective policy, by hash.
message AllocNetPolicy {
  int64 allocation_id = 1;

  // sha256 of the canonical merged policy JSON.
  string policy_hash = 2;
}

// One denial (or run of identical denials) reported by a node datapath.
message NetDenial {
  int64 allocation_id = 1;
  string job_id = 2;
  string task_name = 3;

  // `egress` or `ingress`.
  string direction = 4;

  // `host:port` (egress destination or ingress peer).
  string destination = 5;

  // The rule that denied: `policy/<name>#<index>`, `task#<index>`, or
  // `fallthrough`.
  string source = 6;

  // The rule's reason, if any.
  string reason = 7;

  // `tcp`, `http`, or `dns`.
  string protocol = 8;

  // Verified peer identity, when known.
  string identity = 9;

  // Number of identical denials folded into this entry.
  uint32 count = 10;

  // The task's `network.labels`, for attribution.
  map<string, string> labels = 11;

  // HTTP mode: the method and path denied, when a request-time rule decided.
  string method = 12;
  string path = 13;
}

// The node datapath's status for one allocation, reported on the heartbeat.
message NetAllocStatus {
  int64 allocation_id = 1;

  // Effective `network.mode` the allocation runs in (`host` or `gated`).
  string mode = 2;

  // `gated` only: the namespace exists and every listener inside it is bound
  // (upstream ports, VIPs, resolver, egress proxy). A gated allocation whose
  // capture is not ready has no network.
  bool capture_ready = 3;

  // The policy hash the datapath is enforcing; empty while pending.
  string policy_hash = 4;

  // Upstream keys whose listener is bound.
  repeated string upstreams_bound = 5;

  // Port labels whose ingress listener is bound on the advertised port.
  repeated string ingress_bound = 6;

  // Whether the allocation's resolver is serving.
  bool resolver_ready = 7;

  // Whether the egress proxy is serving (gated only).
  bool proxy_ready = 8;

  // Whether the edge-boot gate is currently shut for this allocation.
  bool gate_shut = 9;

  // Human-readable problems the datapath has with this allocation, e.g.
  // "port 8080 ingress listener: address in use".
  repeated string problems = 10;

  // Every external handler hop on the allocation's effective chains and
  // upstreams (`authz`, `proxy`), with the health the datapath has observed.
  repeated NetHandlerStatus handlers = 11;

  // Whether the ingress chain's TLS material is loaded: the BYO files parse,
  // or the node holds a mesh certificate for `certFrom = "legion"`. Always
  // true when no ingress chain terminates TLS.
  bool tls_ready = 12;

  // Why `tls_ready` is false, when it is.
  string tls_error = 13;

  // Whether this node currently holds a mesh certificate.
  bool mesh_identity = 14;
}

// One external handler hop as the datapath sees it.
message NetHandlerStatus {
  // Where the hop came from: `policy/<name>#<index>`, `task#<index>`, or
  // `upstream/<key>#<index>`.
  string source = 1;

  // `authz` or `proxy`.
  string handler = 2;

  // The webhook URL, or the resolved proxy target (`service`, `node`, or
  // `port` label) and how many endpoints it currently has.
  string target = 3;

  // False once the last call failed (timeout, connection refused, bad
  // reply) or the proxy target has no endpoint. A chain fails closed on an
  // unhealthy hop unless the hop says `onError = "allow"`.
  bool healthy = 4;

  // The last failure, if any.
  string last_error = 5;

  // Calls and failures since the worker started.
  uint64 calls = 6;
  uint64 errors = 7;
}
