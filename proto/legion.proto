syntax = "proto3";
package legion;

// === MANAGER ===

service ManagerNode {
  rpc ManagerJoin (ManagerJoinRequest) returns (ManagerJoinReply);
  rpc WorkerJoin (WorkerJoinRequest) returns (WorkerJoinReply);
  rpc RunJob (RunJobRequest) returns (RunJobReply);
  rpc GetJobStatus (GetJobStatusRequest) returns (GetJobStatusReply);
  rpc GetJoinToken (GetJoinTokenRequest) returns (GetJoinTokenReply);
}

message ManagerJoinRequest {
  // Request message contains the address of the joining node
  string address = 1;
}

message ManagerJoinReply {
  // Reply contains the greeting message
  string message = 1;
}

message WorkerJoinRequest {
  // Request message contains the join-token
  string token = 1;
}

message WorkerJoinReply {
  // Reply contains a message for now, but eventually a bunch of config
  string message = 1;
}

message RunJobRequest {
  // Request message contains the address of the joining node
  string name = 1;
}

message RunJobReply {
  // Reply contains the greeting message
  string message = 1;
}

message GetJobStatusRequest {
  // Request message contains the address of the joining node
  string name = 1;
}

message GetJobStatusReply {
  // Reply contains the greeting message
  string message = 1;
}

message GetJoinTokenRequest {
  bool one_time = 1;
}

message GetJoinTokenReply {
  string token = 1;
}

// === WORKER ===

service WorkerNode {
  rpc PostWork (PostWorkRequest) returns (PostWorkReply);
}

message PostWorkRequest {
  string message = 1;
}

message PostWorkReply {
  string message = 1;
}
