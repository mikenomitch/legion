syntax = "proto3";
package legion;

// Legion gRPC API.
//
// Conventions used throughout this file:
// - `*_json` and many string fields contain JSON payloads serialized as strings.
// - Timestamps are generally RFC3339 strings unless a field explicitly says Unix timestamp.
// - Optional fields are omitted when not provided by the client/server.

// === MANAGER ===

// Manager is the primary control-plane API.
//
// It is used by:
// - Workers for registration, heartbeats, and health updates.
// - CLI/UI clients for job, rollout, node, ledger, and KV operations.
service Manager {
  // Fetches effective worker-type configuration before a worker registers.
  //
  // This is the first manager call in the worker join flow.
  rpc WorkerPreRegister (WorkerPreRegisterRequest)
    returns (WorkerPreRegisterReply);

  // Registers or upserts a worker node in manager state.
  //
  // A worker should call this after pre-registration and after local fingerprinting.
  //
  // A registration is new capacity, so it also queues a capacity pass (a
  // `node_join` evaluation with no node) that re-evaluates jobs short of
  // their count and jobs with `count.per` tasks. While one pass is pending,
  // further registrations queue nothing. Failing to queue the pass does not
  // fail the registration.
  //
  // A join token may introduce a new node or rejoin one that has gone `lost`,
  // but registering under the name of a node that is still live is
  // PERMISSION_DENIED unless the request also carries that node's own token
  // (a restart). See docs/auth-and-acls.md, "Worker nodes".
  //
  // A registration whose `config_attrs` claim a `workerFleet` (the worker
  // simulator) is PERMISSION_DENIED unless the join token's worker type
  // grants that fleet in its `workerFleet` attribute (a name, or a `*`
  // glob), or, for a node-token re-registration, the node already belongs
  // to that fleet. See docs/worker-simulation.md, "One fleet certificate".
  rpc WorkerRegister (WorkerRegisterRequest) returns (WorkerRegisterReply);

  // Submits or updates a job from a fully rendered jobspec.
  //
  // Depending on current state, this may create a new job config, create a rollout,
  // and enqueue reconciliation work.
  rpc RunJob (RunJobRequest) returns (RunJobReply);

  // Returns the submitted source files (submissions) associated with the latest job config.
  rpc GetJobSpec (GetJobSpecRequest) returns (GetJobSpecReply);

  // Returns submissions for a specific job config ID.
  rpc GetJobSpecByConfig (GetJobSpecByConfigRequest) returns (GetJobSpecReply);

  // Lists known job spec versions for one job.
  rpc ListJobSpecHistory (ListJobSpecHistoryRequest) returns (ListJobSpecHistoryReply);

  // Returns metadata for one job (status, creation time, etc), what a
  // blocked job waits for (`Job.blocked`), and the replacements of failed
  // allocations still waiting out their reschedule backoff
  // (`Job.reschedule_backoffs`).
  rpc GetJobInfo (GetJobInfoRequest) returns (GetJobInfoReply);

  // Lists rollouts, optionally filtered by job and active status.
  rpc ListRollouts (ListRolloutsRequest) returns (ListRolloutsReply);

  // Returns one rollout by numeric rollout ID.
  rpc GetRollout (GetRolloutRequest) returns (GetRolloutReply);

  // Returns rollout plus per-group runtime status and allocation health snapshots.
  rpc GetRolloutStatus (GetRolloutStatusRequest) returns (GetRolloutStatusReply);

  // Returns ordered rollout event history for a rollout.
  rpc ListRolloutEvents (ListRolloutEventsRequest) returns (ListRolloutEventsReply);

  // Manually advances a rollout (all groups or selected groups).
  rpc AdvanceRollout (AdvanceRolloutRequest) returns (AdvanceRolloutReply);

  // Stops an in-flight rollout and optionally reverts to the previous config.
  rpc StopRollout (StopRolloutRequest) returns (StopRolloutReply);

  // Computes a placement plan for a jobspec without mutating cluster state.
  rpc PlanJob (PlanJobRequest) returns (PlanJobReply);

  // Marks a job as stopped and enqueues stop reconciliation.
  rpc StopJob (StopJobRequest) returns (StopJobReply);

  // Sets (or clears) a task's count override — the `legion job scale`
  // surface (docs/autoscaling.md). Changes the effective desired count
  // WITHOUT creating a new job config version or starting a rollout: the
  // override is layered over the spec's `count` and reconciled by a
  // `job_scale` eval (scale-out places only the shortfall; scale-in
  // retires surplus allocations, highest slot indices first for slot-mode
  // stateful tasks and newest-first for stateless ones). A scale-IN
  // requested while a rollout is in flight is recorded as pending and
  // applied when the rollout finishes (scale-out applies immediately).
  // Guarded by `scale:write`, deliberately separate from `job:write`.
  //
  // On an autoscaled task (one with `autoscale` in its spec) the policy owns
  // the count, so a person's write is a time-boxed pin: `count` with
  // `pin_for_seconds` holds the count there until the pin expires, `min` or
  // `max` with `pin_for_seconds` holds a floor or a ceiling, and `release`
  // ends a pin early. A `count` without `pin_for_seconds` is refused with
  // FAILED_PRECONDITION and a hint. The autoscaler itself writes with
  // `source = "autoscaler"`, `expected_version` (compare-and-set: a stale
  // writer gets FAILED_PRECONDITION and re-reads), and the `decision` that
  // made the change; its writes to a paused or count-pinned task are
  // refused. When the autoscaled task shares its group with other tasks,
  // every task of the group moves to the count in one write. Every applied
  // or deferred write is recorded in the task's scale history.
  rpc ScaleTask (ScaleTaskRequest) returns (ScaleTaskReply);

  // Reports every task's spec count, live override (or pending scale-in),
  // and effective desired count for one job. The read half of the scale
  // surface; `scale:read`.
  rpc GetJobScaleStatus (GetJobScaleStatusRequest) returns (GetJobScaleStatusReply);

  // Reads what a scaling decision needs about a batch of tasks, cluster-wide,
  // in one call (docs/autoscaling.md, "Scaling inputs"): replica counts and
  // readiness, measured CPU and memory against the reservations, request
  // rate, errors, and latency for a service the task backs, replicas the
  // scheduler has not placed, whether a rollout is active, and how fresh the
  // measurements are.
  //
  // Measured usage never touches the state store. Each manager rolls up the
  // usage reports and service-graph samples its own workers send, per
  // (node, task), and every 10 seconds ships the rollups that changed to the
  // manager that leads the status lane, on the liveness digest. That manager
  // merges them (the newest rollup per (node, task) wins, so a node that
  // moves between managers is never counted twice), keeps one hour of
  // 10-second totals in memory, and answers this RPC. Any other manager
  // forwards the request to it, so every manager returns the same answer.
  // Replica counts, the desired count, and rollouts come from the replicated
  // state store.
  //
  // After the status lane changes hands, the new leader starts empty and
  // asks every peer for a full resync on its first digest. Until that lands
  // (about one 10-second interval), targets read
  // `freshness.state = "resyncing"` and their usage is partial.
  //
  // ACL: `scale:read`. The request is gated coarsely before anything is
  // looked up. A request that names targets is refused whole with
  // PERMISSION_DENIED when any named job is outside the caller's grant; a
  // namespace listing (no targets) silently leaves such jobs out.
  rpc GetScalingInputs (GetScalingInputsRequest) returns (GetScalingInputsReply);

  // === AUTOSCALING ===
  //
  // Task autoscaling (docs/autoscaling.md): `autoscale` on a task in a
  // jobspec, resolved against layered defaults (built-in, then the cluster's
  // scaling defaults, then every namespace policy's `autoscale`, then the
  // task's own record), and acted on by the bundled autoscaler app
  // (`legion-system/autoscaler`, docs/apps.md). The app reads policies from
  // WatchScalingPolicies and measurements from GetScalingInputs, writes
  // counts through ScaleTask (compare-and-set, with the decision attached),
  // and reports what it is doing through ReportScalingStatus. People read
  // that back with GetScalingStatus and GetScaleHistory, and freeze it with
  // PauseScaling.

  // Streams the effective scaling policy of every autoscaled task the caller
  // may read (`scale:read`), resolved live against the layered defaults.
  //
  // The first message is the full set. A new full set follows whenever any
  // input changes: a job with `autoscale` is submitted, stopped, or
  // destroyed; the cluster's scaling defaults change; a namespace policy's
  // `autoscale` changes. Each message replaces the previous one; a consumer
  // never merges. The manager checks for changes about once a second and
  // sends nothing while nothing changed, so an idle stream costs one small
  // read per second on the answering manager. Any manager answers: policies
  // are computed from replicated state.
  //
  // A policy that no longer resolves (a defaults change applied with
  // `force`, or two namespace policies that disagree) is still sent, with
  // `state = "invalid"` and the reason in `error`: the autoscaler holds it
  // and reports it, rather than dropping it silently.
  //
  // ACL: `scale:read`, gated before anything is read; policies of jobs
  // outside the caller's grant are left out. Re-checks the caller's
  // credential periodically, like StreamEvents.
  rpc WatchScalingPolicies (WatchScalingPoliciesRequest) returns (stream ScalingPolicySet);

  // Sets the cluster's scaling defaults: the record every autoscaled task
  // inherits for the fields it, and its namespace policies, leave unset
  // (`legion scaling defaults apply`). The record has the jobspec
  // `autoscale` shape without `checks`, and an inherited `min` must be a
  // multiple of `count` of at least "1x".
  //
  // Every autoscaled task's effective policy is re-resolved first. When the
  // change would leave any of them invalid (a cluster `min` above a task's
  // own `max`, say), the apply is refused with FAILED_PRECONDITION listing
  // them, unless `force` is set; then those policies are held `invalid`
  // until fixed. `dry_run` returns the same report and writes nothing.
  // Inheriting tasks pick the change up live, with no resubmit.
  //
  // ACL: `operator:write`. Retry-safe with `idempotency_key`.
  rpc ApplyScalingDefaults (ApplyScalingDefaultsRequest) returns (ApplyScalingDefaultsReply);

  // Reads the cluster's scaling defaults as written, and the effective
  // defaults for one namespace with the origin of every field (built-in,
  // cluster defaults, or a namespace policy): what a task with
  // `autoscale = true` in that namespace would get.
  //
  // ACL: `scale:read` on the namespace.
  rpc GetScalingDefaults (GetScalingDefaultsRequest) returns (GetScalingDefaultsReply);

  // The autoscaler app's heartbeat: one call per evaluation tick, carrying
  // the last evaluation of every target it evaluated. Held in the memory of
  // the manager that leads the status lane (other managers forward it), and
  // read back by GetScalingStatus, which reports the app NOT RUNNING once no
  // report has arrived for three of the app's intervals. Also the channel
  // for the app's state-change events (`scale.limited`, `scale.flapping`,
  // `scale.check_failed`), which the manager records.
  //
  // ACL: app-plane. Only the bundled autoscaler's own workload identity (a
  // token whose job grant belongs to an allocation of
  // `legion-system/autoscaler`) or a management token may call it, so a
  // caller with `scale:write` cannot forge the app's status. With ACLs
  // disabled every caller is trusted, as everywhere else.
  rpc ReportScalingStatus (ReportScalingStatusRequest) returns (ReportScalingStatusReply);

  // Records an autoscaler action that is not a count write. Today that is
  // a `dry-run` policy's "would" decision: a `scale_history` row with
  // `applied = false`, so `legion scaling history` shows what the policy
  // would have done. Node-group and external-target action intents will
  // use the same RPC.
  //
  // ACL: app-plane, like ReportScalingStatus.
  rpc RecordScalingAction (RecordScalingActionRequest) returns (RecordScalingActionReply);

  // Reports every autoscaled task's live state: its effective count, bounds
  // and mode, the autoscaler's last evaluation of it (what it wants, the
  // state, the one-line summary), pins and pauses, and the last recorded
  // change; and whether the autoscaler app is running at all. With
  // `detail`, also the last evaluation's full stage-by-stage decision and
  // the effective policy with the origin of every field
  // (`legion scaling explain`).
  //
  // Answered by the status-lane leader, which holds the app's reports (other
  // managers forward). Works with the app down, and says so.
  //
  // ACL: `scale:read`, gated before any lookup; targets of jobs outside the
  // caller's grant are left out (a request naming such a job is refused).
  rpc GetScalingStatus (GetScalingStatusRequest) returns (GetScalingStatusReply);

  // Lists the durable record of scaling changes for a job, newest first:
  // every count write (by people and by the autoscaler, applied or
  // deferred), pins and releases, and a `dry-run` policy's "would" rows.
  // History is capped at 200 rows per task.
  //
  // ACL: `scale:read` on the job.
  rpc GetScaleHistory (GetScaleHistoryRequest) returns (GetScaleHistoryReply);

  // Pauses autoscaling for one task, every autoscaled task of one job, or
  // the whole cluster (`all`), optionally for a duration; or resumes it
  // (`resume`). A pause is replicated state, enforced in two places: the
  // autoscaler skips paused targets, and ScaleTask refuses autoscaler
  // writes to them, so a pause holds even against a misbehaving app. People
  // can still scale a paused task by hand.
  //
  // ACL: `scale:write` on the job; `operator:write` for `all`. Retry-safe
  // with `idempotency_key`.
  rpc PauseScaling (PauseScalingRequest) returns (PauseScalingReply);

  // How many nodes of each node-group template the pending work needs
  // (docs/autoscaling.md, "Capacity demand"; the `nodegroup.pending` input
  // of node autoscaling).
  //
  // Pending work is every task of an active job that is short of its
  // effective count (the count `legion job scale` and the autoscaler set),
  // counted against its allocations across config versions, plus keyed
  // instances that have no allocation. Left out: `count.per` tasks (they
  // follow nodes rather than ask for them), cron tasks, finished batch
  // tasks, and jobs whose eval is still pending or in flight (the scheduler
  // has not tried the capacity that exists yet; they are listed in
  // `awaiting_scheduler`). A blocked eval is exactly what this is for.
  //
  // For each template the manager builds a synthetic node (the worker
  // type's pool, namespaces, attributes and resources, then the shape, or a
  // copy of an existing member) and packs the pending replicas onto copies
  // of it, first fit decreasing, with the scheduler's own feasibility
  // functions: the permit and pool, the node's namespaces, constraints,
  // volume drivers, resources (with `reservedResources`, `capacity` and
  // oversubscription), `distinct`, static ports, and a gang's quorum, which
  // places together or not at all. A task group's tasks pack as one unit.
  // Nodes already on their way (`upcoming`) absorb pending work first,
  // across all templates. Each template is then answered on its own: "if
  // only this group grew, how many nodes would the work it can host need?"
  // Replicas no template can host are `unfittable`, with each template's
  // failing rule: a jobspec or policy problem, not a capacity problem.
  //
  // The answer is approximate, on the safe side: first fit is not the
  // scheduler's scoring, and preemption, node-local disk, and the free room
  // on existing nodes are not modelled, so it can over-ask by a node. It is
  // a point-in-time read on whichever manager answers, computed off the
  // scheduler's path; nothing is written.
  //
  // ACL: `node:read`, gated before anything is read, then on each
  // template's pool. Node counts cover all pending work, but a pending or
  // unfittable entry names its job only when the caller has `job:read` on
  // it; entries for other jobs keep their counts and rules and leave the
  // job, group and task names empty (`redacted = true`).
  //
  // Errors:
  // - InvalidArgument: no templates, a template without a name, two with
  //   the same name, an invalid shape, or more than 64 templates.
  // - NotFound: `like_node` names a node that does not exist.
  // - PermissionDenied: `node:read` missing for a template's pool.
  rpc GetCapacityDemand (GetCapacityDemandRequest) returns (GetCapacityDemandReply);

  // Permanently removes a stopped job and related records.
  rpc DestroyJob (DestroyJobRequest) returns (DestroyJobReply);

  // Lists jobs known by the manager.
  rpc ListJobs (ListJobsRequest) returns (ListJobsReply);

  // === NAMESPACES ===
  //
  // A namespace is the name scope, permission scope and policy anchor that
  // jobs live in (docs/namespaces.md). It is NOT an isolation boundary: two
  // namespaces may each hold a job called `web`, an ACL rule's `namespaces`
  // selector confines a token to some of them, and a namespace policy caps
  // what a group of them may use — but creating a namespace moves no
  // workload onto other machines, networks or kernels. Node pools,
  // `network.mode = "gated"` and the `sandbox` runtime do that.
  //
  // `default` always exists and cannot be deleted. A job's namespace is part
  // of its id: `payments-prod/web`, or the bare name `web` for a job in
  // `default`. Every field that names a job accepts either form.

  // Lists the namespaces the caller can see: those where it holds any allow
  // (`namespace:read`, or a read or write on any namespaced resource there).
  // A caller that can see none receives an empty list, not an error.
  //
  // ACL: per-item; the list itself is open to any authenticated caller.
  rpc ListNamespaces (ListNamespacesRequest) returns (ListNamespacesReply);

  // Returns one namespace with what it holds, by kind. NOT_FOUND when it
  // does not exist.
  //
  // ACL: `namespace:read` on the namespace.
  rpc GetNamespace (GetNamespaceRequest) returns (GetNamespaceReply);

  // Creates a namespace, or updates an existing one's description and meta.
  // The name is a DNS label (lowercase letters, digits and `-`, starting and
  // ending alphanumeric, at most 63 characters); the `legion-` prefix is
  // reserved. Namespaces cannot be renamed. With `dry_run`, validates and
  // reports which ACL policies would reach the namespace without writing.
  //
  // ACL: `namespace:write` on the namespace's name, so a rule with
  // `namespaces = ["payments-*"]` lets its holder create payments
  // environments and nothing else.
  rpc ApplyNamespace (ApplyNamespaceRequest) returns (ApplyNamespaceReply);

  // Deletes a namespace. Refused with FAILED_PRECONDITION while it holds
  // anything (jobs in any state, volumes, snapshots), naming what is in the
  // way by kind. With `cascade`, stops and destroys every job, then deletes
  // its volumes and snapshots, then the namespace — synchronously, in that
  // order, reporting each step. There is no `Terminating` state: a cascade
  // that fails halfway leaves the namespace present and the call re-runnable,
  // and the final delete is one conditional write, so a submit that races in
  // makes it refuse rather than succeed falsely. `default` cannot be deleted.
  //
  // ACL: `namespace:write` on the namespace; a cascade additionally needs
  // `job:write` there (and `snapshot:write` when it holds snapshots), so the
  // right to delete an environment is never a back door to destroying
  // workloads the caller could not otherwise touch.
  rpc DeleteNamespace (DeleteNamespaceRequest) returns (DeleteNamespaceReply);

  // --- Namespace policies (docs/namespaces.md, "Namespace policies") ---
  //
  // A namespace policy is a cluster object that selects namespaces by glob
  // and governs the jobs in them: an aggregate quota per priority band
  // across EVERY matching namespace, a job count, a namespace count,
  // allowed and default node pools, allowed runtimes, and allowed host
  // volumes. Every policy matching a namespace applies; quotas are checked
  // independently and allowlists intersect, so a second policy can only
  // narrow. Checks run at admission (job submit, `job scale`, instance
  // create, namespace create), never in placement, and never evict or
  // re-judge work that was already admitted. Policies are governance, so
  // they sit at ACL-policy privilege: a namespace writer cannot raise its
  // own limits.

  // Lists every namespace policy.
  //
  // ACL: `acl:read`.
  rpc ListNamespacePolicies (ListNamespacePoliciesRequest) returns (ListNamespacePoliciesReply);

  // Returns one namespace policy, with each matching namespace's charged
  // usage. NOT_FOUND when none has the name.
  //
  // ACL: `acl:read`.
  rpc GetNamespacePolicy (GetNamespacePolicyRequest) returns (GetNamespacePolicyReply);

  // Creates or replaces a namespace policy. The object is validated
  // (namespace globs, band names, non-negative limits, a default pool
  // inside the allowed pools) and stored normalized. With `dry_run`, writes
  // nothing and reports, as `violations`, every existing job and count the
  // policy would have refused had it been in force: the preview of what it
  // will refuse next. A stored policy never evicts or rejects a job already
  // admitted.
  //
  // ACL: `acl:write`.
  rpc ApplyNamespacePolicy (ApplyNamespacePolicyRequest) returns (ApplyNamespacePolicyReply);

  // Deletes a namespace policy. NOT_FOUND when none has the name.
  //
  // ACL: `acl:write`.
  rpc DeleteNamespacePolicy (DeleteNamespacePolicyRequest) returns (DeleteNamespacePolicyReply);

  // === JOB TEMPLATES ===
  //
  // Job templates are cluster-resident, immutably versioned Nickel
  // documents with declared, typed variables. Anyone with `template:read`
  // can browse them; `template:write` creates new versions or deletes them;
  // submitting a job *through* a template is gated by `job:write` rules
  // carrying the `templates` scope selector (see AclPolicy), which is how
  // an operator locks an account down to "may only submit via template X".
  // Rendering happens on the manager (imports are forbidden; templates are
  // self-contained), so thin clients like the UI get the same result as the
  // CLI. See docs/job-templates.md.

  // Creates the next immutable version of a named job template.
  //
  // The source must evaluate to a record with an optional `description`,
  // an optional `variables` list, and a
  // `job | not_exported = fun vars => ...` function that returns the
  // jobspec. `not_exported` is what keeps `job` out of the published
  // manifest. Invalid manifests are rejected here, not at run
  // time. When every declared variable has a default, the manager also
  // trial-renders the template and validates the resulting jobspec.
  // Every Nickel evaluation here (and in RenderJobTemplate/RunJobTemplate)
  // gets a 5-second budget (INVALID_ARGUMENT "exceeded the 5s limit" when
  // it runs over) and a manager-wide concurrency cap (RESOURCE_EXHAUSTED,
  // retryable, when every evaluation slot stays busy for the budget).
  // Requires `template:write` scoped to the template name.
  rpc UpsertJobTemplate (UpsertJobTemplateRequest) returns (UpsertJobTemplateReply);

  // Lists job templates (latest-version summaries).
  //
  // Requires `template:read`; results are filtered to templates the caller
  // can read.
  rpc ListJobTemplates (ListJobTemplatesRequest) returns (ListJobTemplatesReply);

  // Returns one job template version (latest when `version` is omitted),
  // including its source, variable definitions, and version history.
  // Requires `template:read` scoped to the template name.
  rpc GetJobTemplate (GetJobTemplateRequest) returns (GetJobTemplateReply);

  // Deletes a job template and all of its versions.
  //
  // Jobs already created from the template keep running and keep their
  // provenance records; only the template itself disappears. Requires
  // `template:write` scoped to the template name.
  rpc DeleteJobTemplate (DeleteJobTemplateRequest) returns (DeleteJobTemplateReply);

  // Renders a template with the given variables without submitting.
  //
  // The dry-run twin of RunJobTemplate: validates the variables, renders
  // the jobspec, validates it, and returns it. Mutates nothing. Requires
  // the same access as RunJobTemplate (`job:write` for the rendered job
  // name with the template attribute set), so a caller can always preview
  // exactly what it is allowed to submit.
  rpc RenderJobTemplate (RenderJobTemplateRequest) returns (RenderJobTemplateReply);

  // Renders a template with the given variables and submits the result as
  // a job (create or update), stamping template provenance on the config.
  //
  // ACL: requires `job:write` for the rendered job name evaluated with the
  // template attribute set — satisfied either by an ordinary `job:write`
  // rule or by one scoped with `templates: [...]`. A run that would update
  // an existing job whose latest config did not come from this template
  // fails with FAILED_PRECONDITION unless the caller also holds plain
  // `job:write` on that job name (this stops a template-only identity from
  // hijacking unrelated jobs when the rendered name is user-influenced).
  rpc RunJobTemplate (RunJobTemplateRequest) returns (RunJobTemplateReply);

  // Creates a keyed-mode stateful instance for a job's keyed task and
  // enqueues placement.
  //
  // Keyed instances (see docs/stateful-workloads.md) are the sandbox/dispatch
  // primitive: each instance is a long-lived logical entity with a unique,
  // **never-recycled** id that persists across allocations. Unlike slot mode,
  // Keyed tasks cannot define `count` (rejected at job parse time) — the
  // number of live instances
  // created through this RPC is the task's desired allocation count (zero
  // instances = zero allocations).
  //
  // Id assignment: when `instance_id` is absent the server mints an
  // unnamed id, `<task>-<26 lowercase base32 characters>` (130 random bits),
  // unless the target task sets `stateful.requireId: true`, which rejects
  // the request instead. A caller-supplied `instance_id` is a name and is
  // always accepted when valid. That shape is reserved for minted ids: a
  // caller id ending in `-` plus 26 characters of `[a-z2-7]` is refused, so
  // nobody can re-create an unnamed instance by typing its id. Named and
  // unnamed instances differ only on destroy (see DestroyInstance and
  // `InstanceInfo.named`).
  //
  // Errors:
  // - NotFound: the job does not exist.
  // - InvalidArgument: no keyed task matches `group`/`task`, the match is
  //   ambiguous, the id has an invalid charset (must match
  //   `[A-Za-z0-9._-]{1,128}`) or the reserved minted-id shape, or
  //   `requireId: true` and no id was given.
  // - AlreadyExists: the id collides with ANY existing instance row of the
  //   job — including Stopped instances and Terminated tombstones — or
  //   structurally aliases the reserved slot-id pattern
  //   `{job}-{group}-{slot}` of a slot-mode stateful task in the same job
  //   (the slot and keyed id spaces are kept disjoint so a keyed id can never
  //   adopt, or be adopted by, a slot placement). A stopped instance still
  //   owns its id, and a destroyed id can never be created again for the
  //   lifetime of the job (the never-recycle guarantee; destroying the whole
  //   job clears its instance history — see DestroyJob).
  //
  // `from_snapshot` restores the new instance from a snapshot
  // instead of booting it empty. See `CreateInstances` for the contract,
  // which is the same for one instance.
  //
  // Session-mode tasks (`stateful.mode = "session"`, docs/session-mode.md):
  // a create without `instance_id` starts an unnamed session and writes
  // nothing to the replicated store. The manager's session router picks a
  // node whose envelope for the task has room (most room first, from the
  // session index), sends the start straight to that node, and tries the
  // next node when one refuses. The reply carries `mode = "session"`,
  // `durable = false`, and the node. With an `idempotency_key` the session
  // id is derived from the key, the caller, the job, and the task, so a
  // retry finds the running session and answers `deduplicated` without any
  // record. A create with `instance_id` is an ordinary keyed create (a named
  // instance is durable from birth), unless the task sets
  // `stateful.promote.onName = false`, which refuses it. `from_snapshot` is
  // refused for a session. Session-specific errors:
  // - ResourceExhausted: no node's envelope for the task has room. Retryable
  //   once sessions end or envelopes are added.
  // - FailedPrecondition: no node holds an envelope for the task yet.
  rpc CreateInstance (CreateInstanceRequest) returns (CreateInstanceReply);

  // Creates several keyed-mode stateful instances in one atomic call and
  // enqueues a single placement evaluation for the batch.
  //
  // The request may carry explicit `instance_ids`, a `count` of server-minted
  // ids, or both; the call creates every explicit id PLUS `count` freshly
  // minted ids. Creation is ALL-OR-NOTHING inside one storage transaction:
  // if any explicit id is invalid or collides with ANY existing instance row
  // (live, Stopped, or a Terminated tombstone — ids are never recycled), the
  // whole call fails and NO instance is created. The reply lists every id
  // that was created, in request order (explicit ids first, then minted ids).
  //
  // Task resolution (`group`/`task`) follows the same disambiguation rules as
  // `CreateInstance`: filters may be omitted when the job has exactly one
  // keyed task; ambiguity is rejected, never guessed.
  //
  // Interaction with `stateful.requireId`:
  // - `requireId: true` requires every id to be caller-supplied, so
  //   `count > 0` (server minting) contradicts it and is rejected with
  //   InvalidArgument.
  // - Without it, any mix of explicit ids and minted ids is accepted.
  //
  // Errors:
  // - NotFound: the job does not exist.
  // - FailedPrecondition: the job is stopped (run it before creating
  //   instances).
  // - InvalidArgument: no keyed task matches `group`/`task` or the match is
  //   ambiguous; `instance_ids` is empty AND `count` is 0 (nothing to
  //   create); an id has an invalid charset (must match
  //   `[A-Za-z0-9._-]{1,128}`, the offending id is named); or the task
  //   sets `requireId: true` and `count > 0`.
  // - AlreadyExists: an id (named in the message) collides with an existing
  //   instance row — including duplicates within the request itself, Stopped
  //   instances, and Terminated tombstones. Nothing is created.
  //
  // Restoring from a snapshot (docs/suspend-and-resume.md, "Create from a
  // snapshot"): with `from_snapshot` set to a snapshot id or
  // a name of the job (see SetSnapshotAlias), every created instance starts
  // from that snapshot instead of booting empty. Each gets its own clone of
  // the snapshot's volume (the volume driver's `clone` op) and its own
  // identity (allocation id, hostname, workload-identity token, fresh
  // entropy, and for a memory snapshot of a TAP-wired sandbox its own MAC
  // and TAP device). A `local` snapshot pins the instances to its node and
  // is checked against its `compat` there. A `published` one places each
  // instance on any node whose worker can fetch it and whose fingerprint
  // passes its `compat`. Either way one call creates at most 64 instances.
  // A restore that fails on the node follows `suspend.onRestoreFailure`
  // like a fork does (see ForkInstance). The snapshot itself is untouched
  // and can seed any number of later creates.
  //
  // `from_snapshot` also needs `snapshot:read` on the job (restoring reads
  // the snapshot), and adds these errors:
  // - NotFound: no snapshot with that id or name in the job.
  // - InvalidArgument: the snapshot was taken from another task, or more
  //   than 64 instances were asked for.
  // - FailedPrecondition: the snapshot is not `local` or `published`, or is
  //   a suspend or fork checkpoint (owned by an instance, not a seed; take a
  //   manual snapshot). A memory snapshot whose network shape the task no
  //   longer has (a gated guest into a TAP config, or the reverse) is
  //   accepted here and fails the restore by name (`restore needs gated
  //   networking: ...`), after which `onRestoreFailure` decides.
  rpc CreateInstances (CreateInstancesRequest) returns (CreateInstancesReply);

  // Destroys a keyed-mode instance: stops its current allocation, drops its
  // storage handle, and marks the instance Terminated.
  //
  // A named instance (`InstanceInfo.named`: a caller-chosen id, or a fork of
  // one) keeps its row as a tombstone so its id can never be re-created —
  // and its workload identity `sub` never re-minted for a different
  // workload — for the lifetime of the job (the never-recycle guarantee).
  // Destroying the whole job (DestroyJob) cascades and clears its instance
  // history, after which the id is free again; a live job never recycles a
  // destroyed id. An unnamed instance (a server-minted id) leaves no row at
  // all: its id is unique by 130 random bits and its shape is reserved, so
  // it is never reused either, and the store holds live instances rather
  // than history. The storage handle is always dropped on destroy — a
  // destroyed sandbox's state must not be reattachable. (This is
  // intentionally stricter than slot-mode scale-in, which retains storage by
  // default for a later scale-out.)
  //
  // Destroying an already-Terminated instance succeeds as a no-op, so the
  // call is safe to retry even without an idempotency key. A retried destroy
  // of an unnamed instance answers NOT_FOUND, since nothing is left; pass an
  // `idempotency_key` to get the first call's reply back instead.
  //
  // Destroy also applies to Stopped instances: the row transitions
  // stopped -> terminated and its retained storage handle is dropped. It
  // applies to Suspended instances the same way, and their suspend
  // checkpoint is reclaimed on its node.
  //
  // A running session (docs/session-mode.md) is ended on its node, which
  // leaves nothing behind: a session has no row to tombstone. The same coarse
  // `job:write` check precedes the session lookup as in GetInstance. Ending a
  // session writes nothing, so `idempotency_key` records nothing for it;
  // instead, a repeat on the manager that ended the session within the last
  // ten minutes answers `"Session <id> already ended"`, and a repeat that
  // lands on another manager answers NotFound.
  //
  // Errors:
  // - NotFound: no instance row and no running session has this id.
  // - InvalidArgument: the instance is slot-mode (slot lifecycles are owned
  //   by the scheduler via `count.num`, not this API).
  rpc DestroyInstance (DestroyInstanceRequest) returns (DestroyInstanceReply);

  // Stops (pauses) a keyed-mode instance WITHOUT tombstoning it.
  //
  // The instance's current allocation is stopped through the normal
  // allocation-stop path (the hosting worker stops the task on its next
  // heartbeat reconcile), and the instance transitions to `stopped`. Unlike
  // `DestroyInstance` this is fully reversible:
  // - the row is RETAINED and the id stays owned — `CreateInstance` with the
  //   same id still fails with AlreadyExists (stopped is not destroyed);
  // - the storage handle is RETAINED, so a later `StartInstance` revives the
  //   instance with its persisted state;
  // - `StartInstance` moves it back to `pending` and re-places it.
  //
  // While stopped, the instance is NOT part of the keyed task's desired
  // allocation count: the scheduler plans no allocation for it, and job
  // resubmits / config updates / reschedules will not resurrect it. Only an
  // explicit `StartInstance` does.
  //
  // A `suspended` instance can be stopped too: its checkpoint is discarded
  // (and any held reservation released), and the next `StartInstance` boots
  // it cold.
  //
  // Stopping an already-stopped instance succeeds as a no-op, so the call is
  // safe to retry even without an idempotency key.
  //
  // On a running session (docs/session-mode.md) stop is destroy: the session
  // ends on its node and nothing remains to start again. A repeat behaves as
  // DestroyInstance describes for sessions.
  //
  // Errors:
  // - NotFound: no instance row and no running session has this id.
  // - InvalidArgument: the instance is slot-mode (slot lifecycles are owned
  //   by the scheduler via `count.num`; stop the job or scale in instead).
  // - FailedPrecondition: the instance is Terminated. Destroyed instances
  //   are tombstoned forever (never-recycle) and can never be stopped,
  //   started, or re-created.
  rpc StopInstance (StopInstanceRequest) returns (StopInstanceReply);

  // Starts a stopped keyed-mode instance, or resumes a suspended one.
  //
  // A `stopped` instance transitions `stopped -> pending` and a placement
  // evaluation is enqueued (exactly like `CreateInstance` does), so the
  // scheduler places a new allocation bound to the same instance id and its
  // RETAINED storage handle — the revived workload is *the same* logical
  // instance, booted cold.
  //
  // A `suspended` instance resumes from its checkpoint
  // (docs/suspend-and-resume.md): it transitions `suspended -> pending` with
  // its checkpoint as the restore source, and placement pins it to the node
  // that holds the checkpoint (`durability = "local"`), checking the
  // manifest's `compat` there. The node restores instead of booting: a
  // memory checkpoint resumes the guest where it was, with a refreshed
  // identity (a new allocation id and a newly issued workload-identity
  // token naming it); a disk checkpoint boots fresh on the retained volume.
  // The reply returns once the resume is queued. `instance.resumed` (or
  // `instance.restore_failed`) reports the outcome, and `instance get` shows
  // `last_restore_ms`. A held reservation (`suspend.reserve`) is released in
  // the same transaction, so the restore lands on the capacity it held.
  //
  // When the checkpoint cannot be used (it was lost with its node, or its
  // capture failed), `suspend.onRestoreFailure` decides: `cold` (default)
  // boots fresh on the retained storage and emits `instance.restore_failed`;
  // `fail` leaves the instance `suspended` and returns FailedPrecondition
  // with the reason, which also lands in the instance's `detail`. A resume
  // that waits longer than `suspend.resumeTimeout` (default 30s) for its
  // checkpoint's node also boots cold under `onRestoreFailure = "cold"`.
  // `cold = true` discards the checkpoint and boots fresh: the responder's
  // escape hatch.
  //
  // Starting an instance that is already live (pending, active, or
  // rescheduling) succeeds as a no-op, so the call is safe to retry even
  // without an idempotency key. The one exception is a `rescheduling`
  // instance whose replacement waits out its task's reschedule backoff
  // (`InstanceInfo.reschedule_backoff`): the backoff is lifted and the
  // replacement placed now. A repeat finds no backoff and is the no-op.
  //
  // A running session (docs/session-mode.md) is live too, and answers the
  // same no-op. A suspended session resumes on the node its id is tagged
  // with. A session whose task sets `suspend.durability = "store"` resumes
  // from its manifest in the workers' content store on another node with
  // room when that node lost it, dropped its local copy, is full, or does
  // not answer; the new node claims the next generation and the reply's
  // message names the node it moved from. A session the manifest says is
  // running on a silent node moves only once that node is marked down or
  // lost, or with `force_move` (docs/session-mode.md, "Moving a session").
  // Nothing is written to raft.
  //
  // Errors:
  // - NotFound: no instance row, archive manifest, or running session has
  //   this id.
  // - Unavailable: a session's node does not answer (a `local` session lives
  //   only there), or a `store` session's manifest says it runs on a node
  //   that did not answer and is not marked down (`running_elsewhere`;
  //   retry, or pass `force_move`).
  // - Aborted: a `store` session's resume lost its generation claim to a
  //   racing resume (`superseded`, naming the winner).
  // - InvalidArgument: the instance is slot-mode and not `rescheduling` (slot
  //   lifecycles are owned by the scheduler via `count.num`, not this API;
  //   lifting a slot instance's reschedule backoff is the one start it
  //   takes).
  // - FailedPrecondition: the instance is Terminated (destroyed ids are
  //   tombstoned forever — create a NEW id instead), the owning job is
  //   stopped (run the job first; a stopped job schedules nothing), or a
  //   suspended instance's checkpoint is unusable under
  //   `onRestoreFailure = "fail"` (retry with `cold = true`).
  rpc StartInstance (StartInstanceRequest) returns (StartInstanceReply);

  // Suspends a keyed-mode instance: checkpoint it, stop it, and release its
  // reservation (docs/suspend-and-resume.md).
  //
  // The manager records a `purpose = suspend` snapshot and asks the
  // instance's node, on its next heartbeat, to capture the running
  // allocation and leave it stopped. A memory checkpoint pauses the guest,
  // writes its memory and device state into the node content store, and
  // only then stops the VMM. A disk checkpoint stops the task and retains
  // its volume in place (no copy is made). When the node reports success,
  // one transaction deletes the allocation (freeing its reservation, which
  // `legion node usage` shows), sets the instance `suspended` with
  // `checkpoint_id`, and emits `instance.suspended` and `allocation.removed`
  // with `cause = suspended`. With `suspend.reserve = true` the allocation
  // row stays, holding the reservation, and is never dispatched.
  //
  // A suspend never stops a workload it failed to capture: on a capture
  // failure the instance stays `active`, its allocation keeps running, and
  // `instance.suspend_failed` carries the node's error. The reply returns
  // once the suspend is queued; poll GetInstance (or `legion instance
  // suspend --wait`) for `state = suspended`.
  //
  // Suspended instances hold no allocation, do not count toward desired,
  // survive a job stop, and keep their checkpoint until they resume
  // successfully, are stopped, or are destroyed. Suspend checkpoints are
  // never subject to `snapshots.ttl` or `snapshots.keep`.
  //
  // ACLs: `job:write` on the instance's job, plus `snapshot:write` when the
  // checkpoint is `memory` (a memory checkpoint holds everything the
  // workload had in RAM, including secrets).
  //
  // Mutating and retry-safe: pass `idempotency_key`, and a retry returns
  // the first call's result with `deduplicated = true`. Suspending an
  // instance that is already suspended, or already being suspended, is a
  // no-op that names the existing checkpoint.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: the instance is slot-mode, `checkpoint` is not
  //   `memory` or `disk`, or the task is not a keyed stateful task.
  // - FailedPrecondition: the instance has no running allocation (it is
  //   pending, rescheduling, stopped, or terminated); its node runs a worker
  //   without the `checkpoint` capability (the message names the worker
  //   version: upgrade it); a memory checkpoint was asked of a runtime that
  //   supports disk only (`Hint: use --checkpoint disk`), of a sandbox not
  //   launched for memory checkpoints, or of a gated sandbox on a
  //   Firecracker older than 1.16.1, which cannot move a restored guest's
  //   vsock to its new allocation's socket (`Hint: upgrade Firecracker on
  //   the node, or use --checkpoint disk`).
  //   With `suspend.durability = "store"`, the instance's data is
  //   on a node-local volume (`local-dir`, or a driver advertising
  //   `nodeLocal`), or its node's worker has no `contentStore` (it does not
  //   advertise the `content-publish` capability).
  //
  // With `suspend.durability = "store"`, the suspend completes exactly
  // as above (the instance is `suspended` once the checkpoint is on the
  // node), and the node then publishes the checkpoint to its
  // `contentStore`. When the upload finishes the snapshot is `published`
  // (`snapshot.published`), a resume can run on any compatible node, and
  // node loss no longer loses it. A failed upload leaves it `local`, with
  // the reason in the snapshot's `error` and `snapshot.publish_failed`, and
  // the manager asks the node to publish again after one minute, then five
  // (three attempts in all).
  //
  // A running session (docs/session-mode.md) cannot be suspended: the call
  // answers FailedPrecondition and names PromoteInstance, which gives the
  // session a row without restarting it.
  rpc SuspendInstance (SuspendInstanceRequest) returns (SuspendInstanceReply);

  // Fork and named snapshots ----------------------------------------------

  // Forks a running keyed instance into `count` new instances
  // (docs/suspend-and-resume.md, "Fork").
  //
  // The origin is checkpointed live: a memory checkpoint pauses the guest
  // only while its memory and disks are captured (`pause_ms`), then it
  // resumes; a disk checkpoint copies the instance volume while the task
  // keeps running (crash-consistent, like pulling the power cord). The
  // origin keeps its allocation, id, storage, and identity throughout.
  //
  // Each fork is a NEW keyed instance of the origin's task, created by this
  // call and returned in `instances`:
  // - Its id is `<origin>-f<n>`, with `n` the lowest number whose id has
  //   never existed (ids are never recycled). An origin id too long to
  //   suffix gets server-minted ids instead.
  // - Its storage is a clone of the origin's volume at the checkpoint, made
  //   with the volume driver's `clone` op (a reflink or a sparse copy on
  //   `local-dir`), so a write in one fork is never seen by another or by
  //   the origin.
  // - Its identity is its own: a new allocation id, hostname, and workload
  //   identity token, fresh entropy, and for a memory fork of a sandbox
  //   wired to a TAP device, its own MAC address and TAP device.
  //
  // Forks wait in `pending` (`pending_op = forking`) until the checkpoint
  // lands. Then `instance.forked` is emitted and they are placed. By default
  // the checkpoint is node-local, so every fork is pinned to the origin's
  // node, and a fork that does not fit there waits for room like any pending
  // placement. A failed capture leaves the origin running, terminates the
  // forks with the reason in their `detail`, and emits
  // `instance.fork_failed`.
  //
  // With `spread = true` the checkpoint is published (`durability =
  // store`) to the origin node's `contentStore`, and the forks wait for the
  // publish rather than the capture. Each fork is then placed on a
  // compatible node that none of its siblings runs on (any node whose
  // worker can fetch published snapshots, whose fingerprint passes the
  // checkpoint's `compat`), fetches the parts there, and restores. The
  // origin's node may take one fork. A fork with no such node left waits,
  // like a `distinct` placement. A publish that fails for good (after the
  // manager's retries) terminates the forks with the reason and emits
  // `instance.fork_failed`; the origin keeps running. A fork whose restore fails on the node follows
  // the task's `suspend.onRestoreFailure`: `cold` (default) boots it fresh
  // on its cloned volume, `fail` stops it. Either way
  // `instance.restore_failed` names the reason.
  //
  // Forks of one memory checkpoint on one node map the same memory file
  // copy-on-write (Firecracker), so unmodified pages are shared. Each fork
  // is still charged its full memory reservation.
  //
  // The fork checkpoint (`purpose = fork`) is reclaimed once every fork has
  // restored from it (for a spread fork, the origin node's copy; the
  // published parts stay in the content store, which Legion never deletes
  // from). It is never subject to `snapshots.ttl` or `snapshots.keep`. A
  // fork stopped before it restored keeps its checkpoint, and restores from
  // it when started.
  //
  // ACLs: `job:write` and `snapshot:write` on the origin's job (a fork reads
  // everything the origin held in memory).
  //
  // Mutating and retry-safe: pass `idempotency_key`, and a retry returns the
  // first call's forks with `deduplicated = true` instead of creating more.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: the instance is slot-mode, `count` is above 64, or
  //   `checkpoint` is not `memory` or `disk`.
  // - FailedPrecondition, each with a message naming the fix:
  //   - the origin has no running allocation, is being suspended or resumed,
  //     or its job is stopped;
  //   - its node runs a worker without the `checkpoint` capability;
  //   - a disk fork of an instance with no `stateful.storage` volume, or one
  //     whose volume driver lacks the `snapshot` or `clone` op (so `exec`
  //     and `container` tasks without a snapshot-capable volume cannot fork);
  //   - a memory fork of a task that cannot take one (not a sandbox, or not
  //     launched for memory checkpoints), of a Firecracker sandbox wired to
  //     a TAP device on Firecracker older than 1.12, which cannot move a
  //     restored NIC to a new TAP device, or of a gated Firecracker sandbox
  //     on Firecracker older than 1.16.1, which cannot move a restored
  //     guest's vsock to the fork's own socket;
  //   - a disk fork of a sandbox wired to a TAP device: every fork would
  //     boot on the TAP device the origin holds;
  //   - `spread = true` with a disk checkpoint, with an instance that has a
  //     `stateful.storage` volume (forks clone it on the origin's node, so
  //     a fork elsewhere could not get its copy), or on a node whose worker
  //     has no `contentStore` to publish to.
  //
  // A running session (docs/session-mode.md) cannot be forked: the call
  // answers FailedPrecondition and names PromoteInstance, which gives the
  // session a row without restarting it.
  rpc ForkInstance (ForkInstanceRequest) returns (ForkInstanceReply);

  // Operator override for the node-loss confirmation gate (the K8s analog is
  // force-deleting a pod stuck on a lost node): immediately frees a stateful
  // instance's allocation on a LOST node for replacement, without waiting for
  // `stateful.onLost.replaceAfter` to elapse (and despite `replaceAfter:
  // "never"`). See docs/stateful-workloads.md "Node loss and fencing".
  //
  // The gated allocation row is removed (the instance transitions to
  // `rescheduling`, keeping its id and storage handle) and a reschedule
  // evaluation is enqueued that excludes the lost node, so the replacement
  // re-binds the same instance elsewhere.
  //
  // DANGER: this asserts the lost node's workload is dead. If the node is
  // merely partitioned and its worker has not yet self-fenced
  // (`onLost.selfTerminateAfter`), forcing a replacement can run the
  // instance twice (split-brain on its storage handle and workload-identity
  // subject). Only force when the node is confirmed dead/isolated.
  //
  // Works for slot and keyed instances alike.
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - FailedPrecondition: the instance has no current allocation, or its
  //   allocation's node is not `lost` (the gate only ever holds allocations
  //   on lost nodes; everything else reschedules through the normal paths).
  //
  // A running session (docs/session-mode.md) cannot be replaced: the call
  // answers FailedPrecondition and names PromoteInstance, which gives the
  // session a row without restarting it.
  rpc ReplaceInstance (ReplaceInstanceRequest) returns (ReplaceInstanceReply);

  // Lists stateful instances (slot and keyed) for a job, optionally filtered
  // by group. Includes Terminated rows (slot rows retained for scale-out
  // re-materialization; keyed rows retained forever as never-recycle
  // tombstones).
  //
  // The job's running sessions (docs/session-mode.md) follow the rows, read
  // from the session index of this manager and every peer: `durable =
  // false`, `mode = "session"`. `complete` says whether every node that can
  // run sessions has reported, and `as_of` when the index was read.
  rpc ListInstances (ListInstancesRequest) returns (ListInstancesReply);

  // Returns one stateful instance by id.
  //
  // A session (docs/session-mode.md) has no row: when the id names none,
  // the manager looks it up in the session index its peers and the nodes'
  // heartbeats keep, after a coarse `job:read` check on any job (so a
  // caller without job access cannot probe which session ids exist), then
  // enforces `job:read` on the session's own job.
  //
  // Errors:
  // - NotFound: no instance row and no running session has this id.
  rpc GetInstance (GetInstanceRequest) returns (GetInstanceReply);

  // Promotes a running session (docs/session-mode.md) to a keyed instance:
  // one scheduler-lane entry writes an instance row and an allocation row
  // bound to it on the session's node, and the node adopts the running
  // session as that allocation in place. Nothing restarts. From then on the
  // instance is keyed: listed exactly, at most one live allocation, rescheduled
  // on node loss, and kept as a tombstone on destroy when it is named.
  //
  // The new allocation reserves nothing of its own: the session already sits
  // inside its node's envelope, and stays inside it until it stops. A
  // replacement placed after node loss reserves the task's full resources,
  // like any keyed placement.
  //
  // ACL: `job:write` on the session's job, checked coarsely before the
  // session lookup and precisely after it.
  //
  // Retry-safe without a key too: when the instance the request would create
  // already exists and was promoted from this session, the reply describes
  // it with `deduplicated = true`.
  //
  // The manager pushes the new allocation to the session's node right away.
  // The push is best effort: the rows are written either way, and a node the
  // push misses adopts the session from its next desired set.
  //
  // Errors:
  // - NotFound: no running session has this id.
  // - AlreadyExists: `new_id` (or the session id) names an existing instance
  //   that was not promoted from this session, including a tombstone.
  // - InvalidArgument: `new_id` is not a valid keyed id, or the task sets
  //   `stateful.promote.onName = false` and `new_id` is set.
  // - FailedPrecondition: the session's job config no longer has its task.
  rpc PromoteInstance (PromoteInstanceRequest) returns (PromoteInstanceReply);

  // Lists every node that holds an envelope for a session task, for a
  // picker (Envoy, HAProxy, or a platform's own code) that starts sessions
  // at the nodes directly with a session ticket (`Worker.StartSession`,
  // docs/session-mode.md, "Starting at the edge").
  //
  // Answered from this manager's own state: the envelope allocations and
  // node rows in the replicated store, plus the session index's usage. No
  // node is called and nothing is written, so a picker can poll it every
  // few seconds from any manager. It is advisory: a stale entry costs a
  // refusal or a connect timeout and a hop to the next node, never a wrong
  // start, because each node admits or refuses on its own.
  //
  // Every node with an envelope is listed, accepting or not, so a picker
  // can keep its `tag -> address` map (for routing an existing session by
  // its id) apart from its ring (accepting nodes only).
  //
  // ACL: `job:read` on the job.
  //
  // Errors:
  // - InvalidArgument: no `job_id`.
  // - NotFound: no such job.
  // - FailedPrecondition: `task_name` names no session task of the job, or
  //   the job has more than one session task and `task_name` is empty.
  rpc ListSessionNodes (ListSessionNodesRequest) returns (ListSessionNodesReply);

  // === SNAPSHOTS (see docs/suspend-and-resume.md) ===

  // Captures a point-in-time snapshot of an instance's running allocation.
  //
  // A snapshot is either:
  // - `disk`: a copy of the instance's `stateful.storage` volume, taken with
  //   the volume driver's `snapshot` op. Works for every runtime whose
  //   instance volume uses a driver that advertises `snapshot` (the built-in
  //   `local-dir` does). The task keeps running, so the copy is
  //   crash-consistent, like pulling the power cord.
  // - `memory`: the guest's memory and device state plus its root disk and
  //   instance volume, captured while the guest is paused. Only `sandbox`
  //   tasks on Firecracker or cloud-hypervisor support it, and only when the
  //   task declares a `snapshots` block (which launches the sandbox ready
  //   for checkpoints). The guest resumes as soon as the capture finishes.
  //
  // The call returns as soon as the snapshot row exists, in state
  // `capturing`. The instance's node takes the snapshot on its next
  // heartbeat and reports back, which moves it to `local` (success, the
  // bytes live on that node) or `failed` (with `error`). Poll GetSnapshot,
  // or use `legion snapshot create --wait`, to wait for the outcome.
  //
  // A snapshot is local to the node that captured it: restoring it pins the
  // instance to that node, and losing the node loses the snapshot. With
  // `publish` the node also uploads it to its `contentStore` once
  // captured, and the snapshot moves `local -> published`: it then restores
  // on any compatible node and survives the node. Expiry follows the task's
  // `snapshots { ttl, keep }` block.
  //
  // Requires `snapshot:write` on the instance's job. A memory snapshot holds
  // everything the workload had in memory, secrets included, so granting
  // `snapshot:write` on a job is equivalent to granting read access to its
  // in-memory secrets (docs/auth-and-acls.md).
  //
  // Errors:
  // - NotFound: no instance row with this id exists.
  // - InvalidArgument: `kind` is not `memory` or `disk`, or `name` has an
  //   invalid charset (must match `[A-Za-z0-9._-]{1,64}`).
  // - FailedPrecondition, each with a message naming the fix:
  //   - the instance has no running allocation (it is pending, stopped, or
  //     terminated);
  //   - the instance's node runs a worker that does not advertise the
  //     `checkpoint` capability (the message names the worker version;
  //     upgrade the worker);
  //   - `memory` was asked for a task that cannot take one: not a `sandbox`
  //     task, no `snapshots` block, or `snapshots.memory = false`;
  //   - `memory` was asked of a gated sandbox on a Firecracker older than
  //     1.16.1, which cannot move a restored guest's vsock to a new socket
  //     (the message names the node and version);
  //   - `disk` was asked for an instance with no `stateful.storage` volume;
  //   - a snapshot of this instance is already being captured.
  // - AlreadyExists: `name` is already used by another snapshot of the job.
  //
  // A running session (docs/session-mode.md) cannot be snapshotted: the call
  // answers FailedPrecondition and names PromoteInstance, which gives the
  // session a row without restarting it.
  rpc CreateSnapshot (CreateSnapshotRequest) returns (CreateSnapshotReply);

  // Lists snapshots, newest first, optionally filtered by job, instance, or
  // state. Includes `failed` rows (until they expire) so a failed capture
  // stays diagnosable. Rows the caller has no `snapshot:read` on are left
  // out rather than failing the call.
  rpc ListSnapshots (ListSnapshotsRequest) returns (ListSnapshotsReply);

  // Returns one snapshot by id, including its manifest.
  //
  // Requires `snapshot:read` on the snapshot's job.
  //
  // Errors:
  // - NotFound: no snapshot with this id exists (or it was deleted).
  rpc GetSnapshot (GetSnapshotRequest) returns (GetSnapshotReply);

  // Deletes a snapshot.
  //
  // The row moves to `deleting` and the owning node reclaims the bytes on its
  // next heartbeat: it releases the snapshot's pins in the node content store
  // (memory parts) and runs the volume driver's `snapshot-delete` op (disk
  // part). The row is removed, and `snapshot.deleted` emitted, once the node
  // confirms. A snapshot whose node no longer exists is removed at once,
  // since there is nothing left to reclaim.
  //
  // Deleting a snapshot that is already `deleting` succeeds as a no-op.
  // A snapshot an instance is currently restoring from cannot be deleted
  // until the restore reports back.
  //
  // Requires `snapshot:write` on the snapshot's job.
  //
  // Errors:
  // - NotFound: no snapshot with this id exists.
  // - FailedPrecondition: the snapshot is still `capturing`, or an instance
  //   is restoring from it right now.
  rpc DeleteSnapshot (DeleteSnapshotRequest) returns (DeleteSnapshotReply);

  // Rolls a keyed instance back to one of its own snapshots, in place.
  //
  // The instance keeps its id and storage handle. Its current allocation is
  // stopped (stop notice cause `restore`), the instance moves to `pending`
  // with the snapshot recorded as its restore source, and a placement
  // evaluation is enqueued. The scheduler places the replacement:
  //
  // - **Pinned to the snapshot's node.** A `local` snapshot exists on one
  //   node only, so the replacement can only run there. When that node is
  //   down or full, the instance waits in `pending` with the reason in the
  //   placement diagnostic.
  // - **Checked for compatibility.** A memory snapshot records the VMM and
  //   CPU it was taken on (`compat` in the manifest). A node whose
  //   `sandbox.vmm.<name>.version`, `cpu.vendor`, `cpu.model`, or
  //   `cpu.features` differ is rejected, and the diagnostic names the
  //   attribute and both values (for example
  //   `cpu.model is "6:143:8", the checkpoint needs "6:106:6"`).
  //
  // The node then restores the instance volume from the snapshot's disk
  // part, and for a memory snapshot loads the guest's memory instead of
  // booting it. The worker reports the outcome, which emits
  // `snapshot.restored` or `snapshot.restore_failed`. A failed restore fails
  // the allocation with the worker's error, and the normal restart and
  // reschedule path then boots the instance cold on its retained storage.
  //
  // Restoring uses the instance's current job config (network policy,
  // mounts, identity), never values from the snapshot.
  //
  // Requires `snapshot:read` on the snapshot's job (reading the snapshot is
  // what a restore does) and `job:write` (it replaces an allocation).
  //
  // Errors:
  // - NotFound: the instance or the snapshot does not exist.
  // - InvalidArgument: the snapshot belongs to a different instance (to
  //   start a new instance from it, use CreateInstance(s) `from_snapshot`;
  //   to copy a running instance, use ForkInstance), or the instance is
  //   slot-mode (slot lifecycles are owned by the scheduler).
  // - FailedPrecondition: the instance is stopped or terminated, its job is
  //   stopped, or the snapshot is not `local` or `published` (still
  //   capturing, failed, deleting, or lost with its node).
  //
  // A `published` snapshot is not pinned: the replacement is
  // placed on any node whose fingerprint passes the manifest's `compat`,
  // preferring nodes that already hold its parts (the `locality` score), and
  // that node fetches the parts from the content store before restoring.
  //
  // A running session (docs/session-mode.md) cannot be restored: the call
  // answers FailedPrecondition and names PromoteInstance, which gives the
  // session a row without restarting it.
  rpc RestoreInstance (RestoreInstanceRequest) returns (RestoreInstanceReply);

  // Points a snapshot name (an alias) at a snapshot of the same job,
  // creating the name or moving it.
  //
  // A name is how a golden snapshot is used: `CreateInstance(s)` with
  // `from_snapshot = "<name>"` restores new instances from whatever the
  // name points at right now, so a weekly rebuild takes a new snapshot and
  // repoints the name, and every create after that uses it. Repointing never
  // touches the snapshot it moves away from, and instances already restoring
  // from it are unaffected.
  //
  // Names are unique within a job and share the namespace of
  // `CreateSnapshot`'s `name` (`[A-Za-z0-9._-]{1,64}`, not starting with
  // `snap-`). Only a `local` or `published` `manual` snapshot can be named:
  // a suspend checkpoint belongs to its instance and a fork checkpoint to
  // its forks, and both are reclaimed when they are spent. Deleting a
  // snapshot removes the names pointing at it. Instances created from a
  // `published` snapshot may run on any compatible node.
  //
  // Requires `snapshot:write` on the job.
  //
  // Mutating and retry-safe: pass `idempotency_key`. Pointing a name at the
  // snapshot it already names is a no-op.
  //
  // Errors:
  // - NotFound: the snapshot does not exist.
  // - InvalidArgument: the name has an invalid charset, or the snapshot
  //   belongs to another job.
  // - FailedPrecondition: the snapshot is not `local`, or its purpose is not
  //   `manual`.
  rpc SetSnapshotAlias (SetSnapshotAliasRequest) returns (SetSnapshotAliasReply);

  // Removes a snapshot name. The snapshot itself is untouched.
  //
  // Requires `snapshot:write` on the job. Removing a name that does not
  // exist succeeds as a no-op, so the call is safe to retry.
  rpc DeleteSnapshotAlias (DeleteSnapshotAliasRequest) returns (DeleteSnapshotAliasReply);

  // Pre-fetches a published snapshot's parts onto matching nodes, so a later
  // resume, restore, or fork there starts from local bytes
  // (docs/suspend-and-resume.md, "Warming nodes"). This is the artifact
  // cache plan's warm operation applied to a snapshot.
  //
  // The manager picks every available node that matches `constraints` (node
  // attributes, the same `key = value` matching a jobspec `constraint`
  // block uses; empty matches every node) and whose fingerprint passes the
  // manifest's `compat` (a node that could never restore the snapshot is
  // not warmed). Each picked node gets a `warm` checkpoint request on its
  // next heartbeat. The node fetches each part it does not already hold
  // from its published URL through its ordinary artifact fetcher, verifies
  // the digest, and stores it unpinned in its content store, where the
  // location index advertises it and the `locality` score then prefers the
  // node. The reply returns as soon as the requests are queued.
  //
  // Warming is best effort and never blocks placement. A node that cannot
  // fetch (no access to the store, a full content store) reports why in the
  // `snapshot.warm_failed` event and is simply not warm. Warmed parts are
  // ordinary cache entries: LRU and the content store's idle TTL can evict
  // them. Warming the same snapshot again is a no-op on nodes that already
  // hold the parts or already have a warm queued, so the call is idempotent
  // by nature. Queued warms live in the memory of the manager that accepted
  // the call and are lost if it restarts before the nodes heartbeat.
  //
  // Requires `snapshot:read` on the snapshot's job (warming only reads it).
  //
  // Errors:
  // - NotFound: no snapshot with this id (or name within `job_id`).
  // - InvalidArgument: a constraint is not `key=value`.
  // - FailedPrecondition: the snapshot is not `published` (a `local`
  //   snapshot exists on one node only; publish it with `durability =
  //   "store"` or `snapshot create --publish`), or no available node matches.
  rpc WarmSnapshot (WarmSnapshotRequest) returns (WarmSnapshotReply);

  // === VOLUMES (see docs/volumes.md) ===

  // Lists volumes, optionally filtered by job, node, driver, instance, or
  // state. Live volumes only by default: `destroyed` tombstones are left out
  // unless the request sets `include_destroyed` or filters on
  // `state = "destroyed"`, so an operator can still see where a job's storage
  // went after it was reclaimed.
  //
  // A volume is the concrete storage behind an instance's opaque
  // `{driver}/{volume_id}` storage handle: which driver owns it, which node it
  // is pinned to (node-local drivers only), what the driver recorded about it,
  // and where it sits in the reclaim state machine.
  rpc ListVolumes (ListVolumesRequest) returns (ListVolumesReply);

  // Returns one volume by id.
  //
  // Errors:
  // - NotFound: no volume row with this id exists.
  rpc GetVolume (GetVolumeRequest) returns (GetVolumeReply);

  // Deletes a volume: detaches it from its instance (which will mint a fresh
  // one on its next placement) and queues its storage for the owning worker's
  // `destroy`.
  //
  // Refuses with FailedPrecondition while a live allocation is running against
  // the volume — deleting storage under a running workload is the one mistake
  // this API must not allow. Stop the workload first (job stop, instance stop,
  // scale in). `force` overrides the refusal, and the worker still refuses to
  // run a driver destroy for a volume it currently has mounted, so even a
  // forced delete only abandons the record. Confirmed asynchronously — the volume sits in `destroying`
  // until the driver reports success, and the manager re-dispatches on every
  // heartbeat until it does, so nothing leaks if a worker dies mid-destroy.
  //
  // `force` skips driver confirmation and marks the volume `destroyed`
  // immediately. This is the escape hatch for a node-local volume whose node
  // is never coming back; it leaves whatever bytes exist on that node, which
  // is why it is not the default.
  //
  // Deleting an already-`destroyed` volume succeeds as a no-op, so the call is
  // safe to retry.
  //
  // ACL: `job:write` on the volume's job. A volume no job owns needs
  // cluster-wide `job:write` (a rule with no `names` or `namespaces`).
  //
  // Errors:
  // - NotFound: no volume row with this id exists.
  // - FailedPrecondition: a live allocation is running against the volume and
  //   `force` was not set.
  rpc DeleteVolume (DeleteVolumeRequest) returns (DeleteVolumeReply);

  // Lists the volume drivers installed across the cluster, with each one's
  // capabilities and the nodes providing it.
  //
  // The manager loads no storage drivers itself: everything here is
  // aggregated from what workers advertise in their fingerprints. That is also
  // what job admission validates against, so this endpoint answers "why was my
  // job rejected for driver X" directly.
  rpc ListVolumeDrivers (ListVolumeDriversRequest) returns (ListVolumeDriversReply);

  // Issues a short-lived, asymmetrically-signed OIDC workload-identity token
  // for one named identity declared on the task of a placed allocation
  // (see docs/workload-identity.md).
  //
  // Called by the worker that hosts the allocation — never by the task
  // itself — at task launch and again before each token expiry (the refresh
  // loop). The manager derives **all** claims server-side from the
  // scheduling record (region, job, group, task, node, alloc, and the stable
  // instance/slot for stateful tasks) and applies the audience, TTL, subject
  // template, and extra claims of the *named identity in the stored task
  // spec*. A stateful task's token also carries `legion.io/epoch`, its
  // instance's current identity epoch: a fork or snapshot capture raises it,
  // and Legion's own verifiers (the `legion` auth method) refuse tokens from
  // earlier epochs, since copies of them sit in the checkpoint (see
  // `TaskAllocation.identity_epoch` and docs/workload-identity.md, "Forks and
  // snapshots"). Nothing security-relevant is read from the request, so a
  // compromised worker can only obtain tokens for allocations placed on it,
  // scoped to audiences the spec already declared.
  //
  // Authorization: the caller must present the per-node worker token minted
  // at WorkerRegister (attached to every worker-plane RPC), whose principal
  // is `node:<node_id>`. The manager requires that principal to match the
  // request's `node_id`, which in turn must be the node the allocation is
  // placed on — so a worker can only obtain tokens for allocations on its own
  // node, and cannot forge a peer's node id to steal that peer's federation
  // credentials. Management tokens (and ACL-disabled deployments) are exempt.
  //
  // Errors:
  // - FailedPrecondition: workload identity is not enabled on this manager
  //   (`workloadIdentity.enabled: false`, the default).
  // - NotFound: no allocation with `alloc_id` exists, or the allocation's
  //   task does not declare an identity named `identity_name`.
  // - PermissionDenied: the allocation exists but is not placed on
  //   `node_id` (a worker may only request tokens for its own allocations).
  // - Unavailable: this manager has no signing key yet. It is a raft
  //   follower that started before the leader's key replicated to it, and
  //   adopts the key within seconds. Retry.
  // - Internal: signing failed.
  rpc IssueWorkloadIdentityToken (IssueWorkloadIdentityTokenRequest)
      returns (IssueWorkloadIdentityTokenReply);

  // Issues a short-lived, asymmetrically-signed OIDC token for a *node*
  // identity — the cluster-grain credential declared under
  // `workloadIdentity.nodeIdentities` (see docs/workload-identity.md). Unlike
  // a task identity it is scoped to the worker node, not an allocation: its
  // claims are `region`, `pool`, and `node` (audit-only), with
  // `legion.io/scope = "node"` so relying parties can tell node tokens from
  // task tokens issued by the same cluster. Used by the worker to authenticate
  // cluster-level artifact fetches (`auth.nodeIdentity`) and, later, pre-warm.
  //
  // Called by the worker for its own node. Authorization is identical to
  // IssueWorkloadIdentityToken: the caller's authenticated per-node worker
  // token principal (`node:<node_id>`) must match the request's `node_id`, so
  // a worker cannot mint another node's credential. All claims are derived
  // server-side from the node's registration record and the named identity's
  // config — never from the request.
  //
  // Errors:
  // - FailedPrecondition: workload identity is not enabled on this manager.
  // - NotFound: no node with `node_id` is registered, or no node identity
  //   named `identity_name` is configured.
  // - PermissionDenied: `node_id` does not match the caller's credential.
  // - Unavailable: this manager has no signing key yet (see
  //   IssueWorkloadIdentityToken). Retry.
  // - Internal: signing failed.
  rpc IssueNodeIdentityToken (IssueNodeIdentityTokenRequest)
      returns (IssueNodeIdentityTokenReply);

  // Sign a worker node's **node certificate** from a CSR. The certificate is
  // the node's identity on every plane Legion runs between its own
  // processes: the mTLS worker plane listener (what a manager verifies when
  // it dials the node, docs/auth-and-acls.md, "The worker plane") and the
  // mesh (`service.mesh = true`, docs/network-handlers.md, "The mesh").
  //
  // The worker generates its key pair locally and sends only a CSR; the
  // private key never crosses the network. The manager has the CSR's public
  // key signed by the cluster CA with SANs it chooses itself,
  // `<node>.node.legion` and `legion://node/<node id>`, ignoring every name,
  // extension, and subject the CSR requests. Valid for 24 hours. Workers call
  // it right after registration (the listener needs it), again after a third
  // of the lifetime, and at once when a heartbeat reply's
  // `cluster_ca_pins` differ from the bundle they hold (a rotation, or a CA
  // added to or removed from the bundle).
  //
  // Who signs is the manager's `clusterCa.provider` (docs/cluster-ca.md):
  // the built-in CA (the default; the first call creates it, replicated with
  // the control lane), an operator-provided CA on the manager's disk
  // (`file`), or an external signer such as Vault PKI (`exec`). Whatever a
  // `file` or `exec` provider returns is verified before it is handed out:
  // it must chain to the trust bundle, carry the CSR's public key, carry
  // exactly the SANs above, carry serverAuth and clientAuth and no other
  // extended key usage, not be a CA, and be valid for between 2 hours and
  // the requested 24 hours plus 10 minutes.
  //
  // `fleet` is for the simulator only (`legion start worker --simulate`),
  // which serves every simulated node from one listener: the certificate
  // then names the fleet (`<fleet>.fleet.legion`, `legion://fleet/<name>`)
  // instead of the node, and the caller's node must have registered with the
  // `workerFleet` config attribute set to the same name. Registration admits
  // that attribute only when the node's worker type grants the fleet
  // (WorkerRegister), so the fleet is the operator's choice, not the node's.
  //
  // The node's *workload* identities are never certificates: a dialing node
  // names the workload it forwards for in a PROXY protocol v2 TLV inside the
  // node-to-node TLS session, and the receiving node trusts that attribution
  // because the peer proved it is a node.
  //
  // Called by the worker for its own node. Authorization is identical to
  // IssueNodeIdentityToken: the caller's authenticated per-node principal
  // (`node:<node_id>`) must match the request's `node_id`.
  //
  // Errors:
  // - InvalidArgument: `csr_pem` is missing or is not a valid CSR, or
  //   `fleet` does not match the node's registered `workerFleet`.
  // - NotFound: no node with `node_id` is registered.
  // - PermissionDenied: `node_id` does not match the caller's credential.
  // - Unavailable: the cluster CA is not available on this manager yet (the
  //   built-in CA has not replicated, or an `exec` provider could not be
  //   run or did not answer). The worker keeps its certificate and retries.
  // - FailedPrecondition: the CA needs an operator: the provider returned a
  //   certificate Legion refuses (the message names the provider and the
  //   mismatch), its CA files are unusable, or this manager's CA disagrees
  //   with the cluster's (`GetMeshCa.problem` says why).
  // - Internal: the built-in CA could not be created or signing failed.
  rpc IssueNodeCertificate (IssueNodeCertificateRequest)
      returns (IssueNodeCertificateReply);

  // Fetch the material a node's datapath needs for the allocations placed
  // on it, in one call per heartbeat: network-policy bodies by hash, the
  // KV-held certificates and CA bundles behind `network.ports[].tls` and
  // `connect.upstreams[].ca`, and the values behind
  // `connect.upstreams[].credentials` (docs/network-handlers.md). One call
  // serves every kind, so a new kind of material (or a new place a value
  // comes from) is a provider on the manager, not a new call.
  //
  // Each `MaterialRef` names a kind and what it is for, never where the
  // value lives:
  // - `policy`: `key` is a content hash from `HeartbeatReply.net_policies`;
  //   `value` is the `EffectivePolicy` as JSON. Policies are
  //   content-addressed, so a node running a thousand identical sandboxes
  //   fetches one body once.
  // - `port_cert`: `allocation_id` and `key` (a port label) name a port whose
  //   `tls.cert = { kv }`; `value` is the PEM bundle (chain, leaf first,
  //   then the private key), validated by the manager first.
  // - `client_ca`: the same, for the port's `tls.clients.ca = { kv }`;
  //   `value` is a PEM CA bundle.
  // - `upstream_ca`: `allocation_id` and `key` (an upstream key) name an
  //   external upstream whose `ca = { kv }`; `value` is a PEM CA bundle.
  // - `credential`: `allocation_id`, `key` (the upstream's key), and `part`
  //   (the header, lower-cased) name one injected header; `value` is the KV
  //   value or a freshly minted workload-identity token.
  //
  // The manager derives every KV path and identity itself, from the
  // allocation's own declaration (its ports, as placed, and its task's
  // `connect` block), after checking the allocation is placed on the
  // calling node. So a node can only ever read material that a job on it
  // declares, and a job can only declare a KV path its submitter could read
  // (RunJob and template runs require `kv:read` on it).
  //
  // Workers pass the version they already hold (`MaterialRef.version`): the
  // KV entry's version, or for an identity token its expiry in unix
  // seconds, which the manager re-mints once less than half the identity's
  // TTL remains. An unchanged value comes back `unchanged` with no material
  // on the wire. Material is held in memory only on the worker: never in
  // its state files, never in a log line.
  //
  // Per-ref problems (not placed here, no such declaration, key missing,
  // bundle invalid, workload identity disabled) come back in that ref's
  // `error` rather than failing the call, so one broken certificate or
  // missing secret never blocks the others. `absent` marks the
  // authoritative ones (the key or the declaration is gone): the worker
  // drops what it holds, so requests that need it fail closed. Any other
  // error, and a failed call, keeps the last good value (fail-static).
  //
  // ACL: worker plane. The caller's authenticated per-node principal
  // (`node:<node_id>`) must match the request's `node_id`.
  //
  // Errors:
  // - PermissionDenied: `node_id` does not match the caller's credential.
  // - Internal: the node's allocations could not be loaded.
  rpc FetchDatapathMaterial (FetchDatapathMaterialRequest)
      returns (FetchDatapathMaterialReply);

  // Worker heartbeat endpoint.
  //
  // Workers send runtime state, failures, and allocation health snapshots.
  // The manager returns the desired allocations for that worker node,
  // unless the worker receives its work over `StreamWork`: then the reply
  // says so (`desired_via_stream`) and leaves the desired set out, and the
  // heartbeat carries only a digest of what the worker holds
  // (`work_stream`), so its size no longer grows with what the node runs.
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);

  // Sequenced delivery of work to one worker (docs/
  // architecture-managers-workers.md, "Delivery"; sandbox-scaling plan,
  // Phase 2).
  //
  // The worker opens this stream once and keeps it open. Its first frame is
  // `StreamWorkRequest.open`, naming its node and the last position it
  // applied (`last_epoch`, `last_seq`); every later frame is an `ack` of the
  // highest `seq` it applied. The manager sends `StreamWorkReply` messages:
  //
  // - **Deltas.** Each committed change to an allocation on the node (placed,
  //   updated, stopped, removed) becomes the next message on the node's
  //   sequence: `upserts` carries the full `TaskAllocation` payload, exactly
  //   what the heartbeat's desired set would have carried, and `stops` the
  //   allocations that left the desired set with why. A placement reaches the
  //   worker one network round trip after it commits, whatever the heartbeat
  //   cadence.
  // - **Full resync.** A message with `resync = true` carries the node's whole
  //   desired set and replaces what the worker holds. It is the first message
  //   on a stream that cannot resume: a new `epoch` (this manager process is
  //   not the one the worker last streamed from, as after a failover or a
  //   restart), a `last_seq` ahead of the manager's, or a `last_seq` older
  //   than the messages the manager still keeps. It also follows a heartbeat
  //   whose digest disagreed with the manager's (`HeartbeatReply.work_resync`).
  // - **Checkpoint work.** A snapshot of the node entering a state that is
  //   work for it (a capture, a delete, a publish), or a warm queued for it,
  //   is pushed in `checkpoint_requests` on the next message, so the node
  //   starts it one round trip after it commits instead of at its next
  //   heartbeat. Each piece of work is pushed once per stream; a new stream
  //   gets every piece still outstanding.
  //
  // A worker that reconnects with the same `epoch` and a `last_seq` the
  // manager still holds gets the messages after it replayed, then live
  // deltas: nothing is lost and nothing is applied twice. A replayed message
  // carries its allocation changes only, never its `checkpoint_requests`.
  // Acked messages are pruned. The log is held in the manager's memory
  // only: the committed allocation rows are the durable record, so a new
  // manager process resyncs instead of replaying.
  //
  // Any manager serves the stream, leader or follower, from its own
  // replica of the store.
  //
  // Called by the worker for its own node: the caller's authenticated
  // per-node principal (`node:<node_id>`) must match `open.node_id`.
  // Worker-plane endpoint: workers authenticate with their node token.
  //
  // Errors:
  // - InvalidArgument: the first frame is not `open`, or names no node.
  // - PermissionDenied: `open.node_id` does not match the caller's
  //   credential.
  rpc StreamWork (stream StreamWorkRequest) returns (stream StreamWorkReply);

  // Worker node health-check endpoint.
  //
  // Workers report node-level and plugin readiness checks.
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckReply);

  // Lists all nodes known by the manager.
  rpc GetNodes (GetNodesRequest) returns (GetNodesReply);

  // Returns one node by ID.
  rpc GetNode (GetNodeRequest) returns (GetNodeReply);

  // Reports whether this fleet is sustaining its heartbeat cadence, and what
  // to do about it if it is not.
  //
  // Read-only and cheap: every field is derived from the liveness snapshot the
  // status checker already takes each tick, so calling this costs no extra
  // scan. Backs `legion node cadence`.
  //
  // Answer with care on a manager that does not lead the status lane: it does
  // not own liveness, so it reports zeros rather than a guess. Ask any manager
  // and check `is_liveness_owner` in the reply.
  //
  // ACL: node:read, unscoped (the report is fleet-wide).
  // See docs/heartbeat-cadence-and-scale.md.
  rpc GetHeartbeatCadence (GetHeartbeatCadenceRequest)
    returns (GetHeartbeatCadenceReply);

  // Reports one node's memory and CPU: what it has, what the scheduler has
  // reserved on it, and what its allocations actually use, per allocation.
  //
  // Capacity and reservations come from the state store. Usage comes from
  // the node's own cgroup measurements, which workers with
  // `resourceEnforcement.enabled` send on the heartbeat every 10 seconds.
  // The manager keeps usage in memory only and never writes it to the state
  // store, so a manager restart or failover shows no usage until the next
  // report arrives, and a manager that did not receive this node's
  // heartbeats has none to show (`usage_reported` is false). Usage is
  // never a scheduling input: placement still packs on reservations.
  //
  // Allocations on runtimes the worker does not govern (`noop`, third-party
  // plugins that have not adopted enforcement) and on workers with
  // enforcement off are listed with their reservation and no usage.
  //
  // Backs `legion node usage <node>` and the `legion_node_usage` MCP tool.
  //
  // Errors:
  // - NotFound: no node with `node_id` is registered.
  // - PermissionDenied: the caller lacks node:read on the node's pool.
  //
  // ACL: node:read, scoped to the node's pool (checked unscoped before the
  // lookup, so a caller with no node access cannot probe which nodes exist).
  // See docs/resource-enforcement.md, "Measuring usage".
  rpc GetNodeUsage (GetNodeUsageRequest) returns (GetNodeUsageReply);

  // Reports capacity, reservations, and measured usage for many nodes in one
  // call: the batch form of GetNodeUsage, for fleet views such as the
  // workers index and `legion node usage` with no node.
  //
  // Each entry is exactly the GetNodeUsage reply for that node, built from
  // the same state and the same in-memory usage table, so the two never
  // disagree. Per-allocation rows are left out unless `include_allocations`
  // is set, which keeps a 100-node reply small: a fleet view needs the
  // per-node totals (`memory`, `cpu`, `usage_reported`, the pressure
  // response), not every allocation.
  //
  // `node_ids` empty means every registered node, ordered by node id, capped
  // at 500 nodes (the reply's `truncated` says when the cap cut it short).
  // Unknown ids are left out of the reply rather than failing the call, so
  // a list built from a page that has since changed still answers.
  //
  // Usage is held in the memory of the manager that received each node's
  // heartbeats: a node whose heartbeats go to another manager, or that has
  // not reported since this manager started, has `usage_reported = false`,
  // exactly as in GetNodeUsage.
  //
  // ACL: node:read. Gated unscoped first (`AclScope::any()`), then each node
  // is filtered by its pool, so a pool-scoped token sees only its pools'
  // nodes and never learns that others exist.
  //
  // Errors:
  // - InvalidArgument: more than 500 `node_ids`.
  // - PermissionDenied: the caller has no node:read at all.
  rpc ListNodeUsage (ListNodeUsageRequest) returns (ListNodeUsageReply);

  // Reports what one node holds for content locality: the content its worker
  // advertises to the manager's location index (digest and bytes per entry),
  // which snapshot each entry belongs to when the manager knows, and the
  // node's snapshots with their published state and how many of their parts
  // the node holds right now.
  //
  // This is the read side of the location index the scheduler's `locality`
  // score uses (docs/artifacts.md, "Content locality"): the same data, so an
  // operator can see why a placement preferred a node. It is leader-local
  // soft state, never persisted or replicated: a manager that just started,
  // took over, or does not receive this node's heartbeats has no entries for
  // it, and says so with `index_reported = false`. Only entries of at least
  // 1 MiB are advertised, so small artifacts never appear.
  //
  // The content store's byte budgets and per-class totals are not part of
  // this reply: the index carries digests, not classes.
  //
  // ACL: node:read, scoped to the node's pool (checked unscoped before the
  // lookup, so a caller with no node access cannot probe which nodes exist).
  // Snapshot rows are filtered by `snapshot:read` on their job and left out
  // when the caller lacks it; content entries that belong to a snapshot the
  // caller cannot read keep their digest and bytes but lose the snapshot id.
  //
  // Errors:
  // - NotFound: no node with `node_id` is registered.
  // - PermissionDenied: the caller lacks node:read on the node's pool.
  rpc GetNodeContent (GetNodeContentRequest) returns (GetNodeContentReply);

  // Proxies a restart request to a worker node, over the mTLS worker plane
  // (the manager's own certificate; the node's name verified).
  //
  // Errors:
  // - PermissionDenied: caller lacks `node:write` on the node's pool.
  // - NotFound: no such node.
  // - FailedPrecondition: the node registered no worker address, or runs
  //   worker protocol 2 or older (a plaintext address managers never dial).
  // - Unavailable: the worker could not be reached or failed TLS
  //   verification; the message names the node, address, and port.
  rpc RestartWorker (RestartWorkerRequest) returns (RestartWorkerReply);

  // Sets a node's scheduling availability: cordon, drain, or uncordon.
  //
  // Availability is the schedulability axis of a node, independent of its
  // health status. Only nodes with availability `"available"` are considered
  // for new placements; setting any other value excludes the node from all
  // future scheduling decisions while leaving its status and heartbeats
  // untouched.
  //
  // Three operator flows map onto this RPC:
  // - Cordon: `availability = "drained"`, `evict = false`. New placements
  //   stop; existing allocations keep running on the node.
  // - Drain: `availability = "drained"`, `evict = true`. New placements
  //   stop, and a `node_drain` evaluation is enqueued that evicts the node's
  //   existing allocations so the scheduler replaces them elsewhere.
  //   Stateless allocations are evicted immediately; stateful allocations
  //   are protected by their `stateful.onLost` policy and are never
  //   force-moved by a drain (use ReplaceInstance for an operator override).
  // - Uncordon: `availability = "available"`. The node re-enters the
  //   scheduling pool; existing allocations elsewhere are not moved back
  //   automatically. Like a worker registration, it queues a capacity pass
  //   that re-evaluates jobs short of their count.
  //
  // The call is level-triggered and idempotent: setting the value a node
  // already has is a no-op besides the emitted event, and eviction works by
  // removing allocation rows so the next worker heartbeat reconciles the
  // desired state.
  //
  // Errors:
  // - NotFound: no node with `node_id` exists.
  // - InvalidArgument: `availability` is not `"available"` or `"drained"`.
  // - PermissionDenied: caller lacks `node:write` for the node's pool.
  rpc SetNodeAvailability (SetNodeAvailabilityRequest)
      returns (SetNodeAvailabilityReply);

  // Removes a node's record and revokes its node token, in one write
  // (docs/architecture-managers-workers.md, "Forgetting a node"). For dead
  // records (a machine that is gone and will not come back), and the last
  // step of node-group scale-in (drain, terminate, forget).
  //
  // A forgotten node is gone from `legion node list` and from scheduling.
  // Its node token no longer authenticates, so a worker still running there
  // cannot heartbeat or re-register under its old identity: it would have
  // to join again with a join token, which a node group's spent
  // `max_uses` token refuses. Its allocations, if any (only with `force`),
  // are removed and replaced elsewhere, snapshots stored on it are marked
  // lost, and its liveness row is swept by the next orphan pass.
  //
  // The guard, unless `force` is set, refuses (FailedPrecondition, naming
  // what to do) a node that:
  // - still has allocations, including stateful ones held by their
  //   `stateful.onLost` policy: drain it first, or wait for the policy;
  // - is live and schedulable: its status is `active` and it is not
  //   cordoned. Cordon or drain it first, or wait until it is marked lost
  //   (a cordoned, empty node may be forgotten while it still heartbeats:
  //   that is the scale-in flow, which terminates the machine first);
  // - holds node-local volumes, whose data lives on that machine.
  //
  // `force` asserts the machine is gone for good: the record is removed
  // whatever its state, its allocations are released for replacement at
  // once (stateful instances included, without waiting for
  // `onLost.replaceAfter`), and node-local volumes stay pinned to the
  // missing node until an operator replaces their instances.
  //
  // Retry-safe: with an `idempotency_key`, a repeat of a request that
  // succeeded replays its result with `deduplicated = true` instead of
  // answering NotFound.
  //
  // Errors:
  // - InvalidArgument: `node_id` is empty.
  // - NotFound: no node with `node_id` exists.
  // - FailedPrecondition: the guard refused (see above).
  // - PermissionDenied: caller lacks `node:write` for the node's pool.
  rpc ForgetNode (ForgetNodeRequest) returns (ForgetNodeReply);

  // Retrieves captured task stdout/stderr for a job's allocations.
  //
  // The manager locates the node hosting each allocation and proxies the read
  // to that worker's `Worker.GetTaskLogs` RPC.
  //
  // Removed allocations stay reachable for a day: the manager remembers where
  // every removed allocation ran (job, task, node, why it was removed) for 24
  // hours, and the worker keeps the files for its log retention (7 days by
  // default, `LEGION_LOG_RETENTION_DAYS`). So:
  // - `allocation_id` names a live allocation or one removed within the
  //   window; either way the reply carries it, with `removed` set for the
  //   latter.
  // - `job` returns the job's live allocations. When it has none (it failed,
  //   finished, was stopped, or was destroyed) the reply holds its most
  //   recently removed allocations instead, newest first, at most 10.
  //   `include_removed` appends them even when live ones exist.
  //
  // A node that is gone, unreachable, or has pruned the files fills that
  // allocation's `error` instead of failing the whole request. A worker's
  // own error is relayed by its message (never as raw transport output). A
  // worker the manager cannot reach over the mTLS worker plane gets an
  // `error` that names the node, its address, and the port managers dial
  // (4848 by default); a worker on protocol 2 or older (plaintext address)
  // gets one naming its version.
  //
  // Errors:
  // - InvalidArgument: neither `job` nor `allocation_id` is set.
  // - NotFound: no such allocation, live or removed within the window; or no
  //   such job and no removed allocations of that name within the window.
  // - PermissionDenied: caller lacks `job:read` on the allocation's job.
  rpc GetAllocationLogs (GetAllocationLogsRequest)
    returns (GetAllocationLogsReply);

  // Opens an interactive or one-shot exec session inside a running
  // allocation, streaming stdin/stdout/stderr/resize frames both ways. The
  // manager authorizes the request, resolves the allocation to its node, and
  // proxies the stream to that worker's `Worker.ExecTask`.
  //
  // The first client frame must be an `ExecStart`. Raw commands require
  // `exec:write` (with `host: true` for host-level runtimes); action runs
  // require `action:write` (or `exec:write`) and are rendered server-side
  // from the stored job spec.
  //
  // The session re-checks its credential every 30 seconds. Once the token is
  // revoked or expired, or its policies no longer grant the session, the
  // stream ends with that auth error (`UNAUTHENTICATED` or
  // `PERMISSION_DENIED`) and the worker-side process is cancelled.
  //
  // The manager dials the worker over the mTLS worker plane
  // (docs/auth-and-acls.md, "The worker plane"): its own manager certificate,
  // the cluster CA as the only root, the node's name verified. An error the
  // worker returns (no such allocation, a refused command) is relayed with
  // its own code.
  //
  // Worker-plane errors:
  // - Unavailable: the worker could not be reached or failed TLS
  //   verification. The message names the node, its address, and the port
  //   managers dial (4848 by default), and how to fix it. Retryable.
  // - FailedPrecondition: the node registered no worker address, or
  //   advertises a plaintext `http://` address because it runs worker
  //   protocol 2 or older (the message names the version); upgrade the
  //   worker.
  rpc ExecAllocation (stream ExecClientFrame) returns (stream ExecServerFrame);

  // Lists the actions declared on a job's tasks (for CLI + UI discovery).
  rpc ListJobActions (ListJobActionsRequest) returns (ListJobActionsReply);

  // Mints an exec ticket: a short-lived credential for direct exec, where
  // the client opens `Worker.ExecTask` on the worker itself instead of
  // streaming every byte through a manager (docs/exec-and-actions.md,
  // "Direct exec").
  //
  // Authorization is exactly `ExecAllocation`'s: a coarse `exec:write` or
  // `action:write` gate before any lookup, then `exec:write` on the job
  // (with `host` for host-level runtimes) for a command, or `action:write`
  // on the (job, action) — or `exec:write` on the job — for an action, whose
  // argv is rendered here from the stored job spec. The ticket names what
  // was authorized and nothing else: one node, one allocation, the job and
  // task, the rendered argv (absent for an `exec` ticket minted without a
  // command, which allows any command), the tty flag, and how long the
  // session may run.
  //
  // Minting is a signature, not a write: no raft entry, no idempotency
  // record. The mint is logged under the `exec_audit` target; the worker
  // reports the redemption and the exit code on its next heartbeat, logged
  // under `exec_audit` too. A ticket is single use on its node and expires
  // after `ttl` (default `exec.tickets.defaultTtl`, 60s). The session it
  // opens ends after `max_session` (default `exec.tickets.maxSession`, 1h),
  // never later than the minting credential expires, and within one worker
  // heartbeat of the minting token being deleted or losing the grant.
  //
  // The ticket is signed with the workload-identity key, so the manager
  // must run with `workloadIdentity.enabled: true`.
  //
  // Errors:
  // - PermissionDenied: the caller could not open this session through
  //   `ExecAllocation`.
  // - NotFound: no such allocation, instance, task, or action (only after
  //   the coarse gate, so it reveals nothing to a caller without exec).
  // - FailedPrecondition: exec or workload identity is disabled on this
  //   manager; the allocation is not running; the instance has no running
  //   allocation; the node advertises no authenticated worker address.
  // - InvalidArgument: neither a command nor an action; a bad `ttl` or
  //   `max_session`, or one above the manager's ceiling; bad action params.
  rpc MintExecTicket (MintExecTicketRequest) returns (MintExecTicketReply);

  // Registers a delegated exec minting key (docs/exec-and-actions.md,
  // "Delegated minting keys"): a platform's ES256 public key whose exec
  // tickets workers accept for jobs matching `jobs`, with no manager call
  // per ticket. One control-lane write per key, never per session.
  //
  // A key's tickets are narrower than the `exec:write` grant that could mint
  // them: they never open a session in a host-level runtime (`exec`), their
  // redeem window is at most `max_ttl`, and their sessions run at most
  // `max_session`. Workers learn keys on their heartbeat, so a new key works
  // on a node within one heartbeat interval.
  //
  // ACL: `acl:write` (a key is a credential that mints shell access).
  // Retry-safe with `idempotency_key`.
  //
  // Errors:
  // - PermissionDenied: caller lacks `acl:write`.
  // - InvalidArgument: `public_key_pem` is not a P-256 public key; `jobs` is
  //   empty; `max_ttl` or `max_session` is not a duration, is zero, or is
  //   above the manager's `exec.tickets` ceiling.
  rpc CreateExecKey (CreateExecKeyRequest) returns (CreateExecKeyReply);

  // Lists delegated exec minting keys. Public keys are public; there is no
  // secret to hide. ACL: `acl:read`.
  rpc ListExecKeys (ListExecKeysRequest) returns (ListExecKeysReply);

  // Deletes a delegated exec minting key. Workers stop accepting its tickets
  // on their next heartbeat, and open sessions it minted end then too, with
  // `PermissionDenied`. ACL: `acl:write`. Retry-safe with `idempotency_key`.
  //
  // Errors: PermissionDenied without `acl:write`; NotFound for an unknown id.
  rpc DeleteExecKey (DeleteExecKeyRequest) returns (DeleteExecKeyReply);

  // Returns node + allocation view of cluster state (the "ledger").
  rpc GetLedger (GetLedgerRequest) returns (GetLedgerReply);

  // Returns config snapshots stored by manager instances.
  //
  // A manager writes its snapshot when it starts as, or later becomes, the
  // control-lane leader, so under raft a manager that has never led has no
  // snapshot here. For the list of managers in the cluster use
  // `ListManagers`, which reads the raft membership instead.
  rpc GetManagerConfigs (GetManagerConfigsRequest)
    returns (GetManagerConfigsReply);

  // Lists every manager in the cluster with its raft role, advertised
  // address, and whether the answering manager can reach it. Backs the UI's
  // Managers page and `legion raft members`.
  //
  // The roster comes from the replicated raft membership (voters and
  // learners), which every manager holds, so any manager, leader or
  // follower, answers with the full list. Outside raft mode the reply holds
  // exactly one entry: the answering manager.
  //
  // Reachability is probed live from the answering manager: it calls
  // `GetRaftStatus` on every other member concurrently, forwarding the
  // caller's credential, with a short per-member timeout. A member that
  // does not answer is still listed, with `reachable = false` and the
  // reason in `probe_error`. Because it is the answering manager's view, a
  // partitioned manager reports its peers unreachable while the rest of the
  // cluster reports it unreachable.
  //
  // Read-only. Costs one `GetRaftStatus` call per other member.
  //
  // ACL: operator:read, unscoped (the roster is cluster-wide). Peers enforce
  // the same rule on the forwarded credential, so a caller denied there sees
  // `reachable = false` with a `PermissionDenied` `probe_error`.
  rpc ListManagers (ListManagersRequest) returns (ListManagersReply);

  // Returns observability status and recent manager-side logs/traces.
  rpc GetObservability (GetObservabilityRequest)
    returns (GetObservabilityReply);

  // Reports the adaptive scheduler-concurrency controller: how many evals this
  // manager will PLAN at once right now, why, and whether the cluster's
  // conflicts are concurrency-driven or capacity-driven.
  //
  // The question it answers is one no other endpoint does — "are placements
  // slow because the scheduler is holding itself back, or because the cluster
  // is full?" — and the two have opposite remedies ("wait" versus "add
  // nodes"). Backs `legion scheduler concurrency`.
  //
  // Read-only and cheap: every field comes from a snapshot the controller
  // already publishes each 500ms tick, so calling this costs no extra work on
  // the plan path.
  //
  // Answer with care on a manager that does not lead the scheduler lane: it
  // does no planning, so it reports zeros rather than a guess. Ask any manager
  // and check `is_scheduler_lane_leader` in the reply.
  //
  // ACL: operator:read, unscoped (the report is cluster-wide).
  // See docs/adaptive-scheduler-concurrency.md.
  rpc GetSchedulerConcurrency (GetSchedulerConcurrencyRequest)
    returns (GetSchedulerConcurrencyReply);

  // Returns the local manager's Raft control-plane status.
  //
  // This endpoint is available even before full Raft state replication is enabled,
  // and is intended for election/failover visibility and operator workflows.
  rpc GetRaftStatus (GetRaftStatusRequest) returns (GetRaftStatusReply);

  // Lists recent Raft control-plane events for this manager.
  //
  // Events include elections, leader transfers, membership updates, and token issuance.
  rpc ListRaftHistory (ListRaftHistoryRequest) returns (ListRaftHistoryReply);

  // Applies an operator-triggered Raft control command on this manager.
  //
  // Typical commands include election triggers, leader transfer, and membership changes.
  rpc IssueRaftCommand (IssueRaftCommandRequest) returns (IssueRaftCommandReply);

  // Issues a short-lived join token that can be used by a manager to join a Raft cluster.
  rpc GetRaftJoinToken (GetRaftJoinTokenRequest) returns (GetRaftJoinTokenReply);

  // Writes a consistent point-in-time backup of the manager state store to a
  // server-side path (`VACUUM INTO` on the live database) and returns where
  // it landed, its size, and the raft applied index it captures.
  //
  // Works in every persistence mode. In raft mode the call is leader-only:
  // a non-leader returns FAILED_PRECONDITION naming the current leader so
  // the caller can redial. Restore is an offline operation: start the
  // manager with `--restore-from <path>` (see docs/upgrades.md).
  //
  // Requires `operator:write`.
  rpc GetStateBackup (GetStateBackupRequest) returns (GetStateBackupReply);

  // Reports the KV encryption keyring on THIS manager (docs/kv-encryption.md):
  // whether encryption is on, whether every data key is unwrapped here
  // (`unlocked`) or which ones are not (`locked`, with the reason and the
  // root key location), the data keys with how many values each protects,
  // how many rows are still plaintext, and a one-line `hint` naming the
  // next step when there is one. Every manager answers for itself, because
  // the root key is per-manager state — ask each one when diagnosing.
  //
  // Requires `operator:read`.
  rpc GetKeyringStatus (GetKeyringStatusRequest) returns (GetKeyringStatusReply);

  // Rotates the KV data key: a new active key is written in one replicated
  // control-lane write and the previous key is retired but kept, so values
  // already stored stay readable. The manager then re-encrypts every value
  // under the new key in the background (versions and timestamps untouched,
  // no job restarts) and garbage-collects the retired key once nothing
  // references it. Automatic at `encryption.dataKeyRotationAge`; this RPC
  // is the on-demand form (an offboarding, a suspected exposure).
  //
  // Raft: leader-only (a follower answers FAILED_PRECONDITION naming the
  // leader). Requires `operator:write`. Retry-safe via `idempotency_key`.
  rpc RotateDataKey (RotateDataKeyRequest) returns (RotateDataKeyReply);

  // Re-encrypts KV values in batches until every value is under the active
  // data key — or, with `plaintext = true`, decrypts every value into a
  // plaintext row (the step before `encryption.enabled = false` or a
  // downgrade). Runs to completion before replying; each batch is one
  // replicated write of at most 256 rows. Values are unchanged, so nothing
  // on the KV-reactive path fires.
  //
  // Raft: leader-only. Requires `operator:write`. Retry-safe via
  // `idempotency_key` (a repeat simply finds nothing left to do).
  rpc RewrapKv (RewrapKvRequest) returns (RewrapKvReply);

  // Re-wraps every data key under the root key provider's CURRENT key, in
  // one replicated write, without touching any value. This is how a root
  // key rotation completes: for the `file`/`env` providers, put the new key
  // FIRST (older keys stay for unwrapping), call this, then remove the old
  // key everywhere; for an `exec` provider, after the KMS key changed.
  //
  // Raft: leader-only. Requires `operator:write`. Retry-safe via
  // `idempotency_key`.
  rpc RewrapRootKey (RewrapRootKeyRequest) returns (RewrapRootKeyReply);

  // Break-glass recovery when the root key is gone for good: deletes every
  // KV value this manager cannot decrypt, drops the data keys it cannot
  // unwrap, initializes a fresh keyring, and reports exactly which keys
  // were lost. Jobs that referenced a deleted value fail through the
  // normal `missing_kv_dependency` path and recover when the value is put
  // back. `confirm` must equal `DELETE-UNDECRYPTABLE-VALUES`.
  //
  // Raft: leader-only. Requires `operator:write`.
  rpc ResetKeyring (ResetKeyringRequest) returns (ResetKeyringReply);

  // Applies dynamic attribute updates to a node and triggers affected evaluations.
  rpc UpdateNodeDynamic (UpdateNodeDynamicRequest)
    returns (UpdateNodeDynamicReply);

  // Creates or updates a KV entry.
  //
  // Jobs that reference the key (legacy `$key` jobspec references or
  // watched task kv injections) are reconciled: their configs are
  // re-rendered from the new value and the per-reference `onChange` policy
  // (none/restart/rollout/fail) is applied. Rapid writes are coalesced per
  // the manager's `kvDebounceMs` window (default 500ms; with a non-zero
  // window reconciliation errors are logged on the manager instead of
  // failing this RPC). See docs/kv-store.md "Reactive updates".
  rpc PutKv (PutKvRequest) returns (PutKvReply);

  // Gets one KV entry by key.
  rpc GetKv (GetKvRequest) returns (GetKvReply);

  // Lists KV entries by prefix.
  rpc ListKv (ListKvRequest) returns (ListKvReply);

  // Deletes one KV entry by key.
  //
  // Deletion is a first-class reconciliation event: jobs watching the key
  // resolve their per-reference `onDelete` policy (default `fail`, which
  // marks the job and its allocations failed with reason
  // `missing_kv_dependency`; a later PutKv to the key recovers the job via
  // `onChange`). Legacy `$key` references treat deletion as `fail`. Events
  // are debounced like PutKv. See docs/kv-store.md "Reactive updates".
  rpc DeleteKv (DeleteKvRequest) returns (DeleteKvReply);

  // Applies an RFC6902 JSON patch to a JSON-typed KV entry.
  //
  // Triggers the same KV-change reconciliation (and debouncing) as PutKv.
  rpc PatchKv (PatchKvRequest) returns (PatchKvReply);

  // Acquires (or force-acquires) a lock for a KV key.
  rpc AcquireKvLock (AcquireKvLockRequest) returns (AcquireKvLockReply);

  // Renews an existing KV lock lease.
  rpc RenewKvLock (RenewKvLockRequest) returns (RenewKvLockReply);

  // Releases an existing KV lock.
  rpc ReleaseKvLock (ReleaseKvLockRequest) returns (ReleaseKvLockReply);

  // Returns current non-expired lock state for a KV key.
  rpc GetKvLock (GetKvLockRequest) returns (GetKvLockReply);

  // Lists all declared services with aggregate endpoint health.
  //
  // A service exists when a stored task config declares a `service` block.
  // The reply is derived (a projection) from task configs, allocations, and
  // allocation health snapshots; there is no separate registration mechanism
  // and no way for the catalog to drift from scheduler state.
  rpc ListServices (ListServicesRequest) returns (ListServicesReply);

  // The service graph: who calls whom, with RED (docs/network-handlers.md,
  // "Service graph"). One edge per (caller job, caller task, service, tag):
  // what the callers *declared* (a `connect.upstreams` entry, and whether the
  // service's `allow` intentions admit it) and what their datapaths
  // *observed* over the window — requests, errors, denials, latency, bytes,
  // folded from every node's heartbeat. Observed edges appear within one
  // heartbeat of the first call. Like ListServices, a projection: `job:read`.
  rpc ListServiceEdges (ListServiceEdgesRequest) returns (ListServiceEdgesReply);

  // Resolves one service name to its endpoint addresses and ports.
  //
  // By default only healthy endpoints are returned: an endpoint is healthy
  // when its allocation's latest health snapshot reports healthy AND its node
  // is not lost/down. Endpoints without any health snapshot yet (still
  // booting) are excluded unless `include_unhealthy` is set.
  rpc ResolveService (ResolveServiceRequest) returns (ResolveServiceReply);

  // Creates or replaces a network policy object (docs/network-handlers.md).
  //
  // A policy is a selector (node pools, namespaces, runtimes, job globs,
  // labels) plus the egress/ingress rules and handlers to apply to every task
  // it matches, with `enforcement = "require"` (always applied, ahead of the
  // task's own block, never weakened) or `"default"` (applied only when the
  // task declares nothing itself). The object is normalized and validated
  // here — `allow` sugar is desugared, protocol/handler names checked, and a
  // `default` policy that would tie with an existing one on priority and
  // selector is rejected so the winner is never decided at runtime. Takes
  // effect on every matching running allocation within one heartbeat; no
  // task is restarted.
  //
  // ACL: `net:write`, scoped by the policy's own `nodePools` / `namespaces`
  // selectors.
  rpc UpsertNetPolicy (UpsertNetPolicyRequest) returns (UpsertNetPolicyReply);

  // Fetches one stored policy object by name. ACL: `net:read`.
  rpc GetNetPolicyObject (GetNetPolicyObjectRequest) returns (GetNetPolicyObjectReply);

  // Lists stored policies in merge order: `require` first, then priority
  // descending, then name. ACL: `net:read`; entries are filtered to the
  // caller's scope.
  rpc ListNetPolicies (ListNetPoliciesRequest) returns (ListNetPoliciesReply);

  // Deletes a stored policy. Matching allocations lose it on their next
  // heartbeat. ACL: `net:write`.
  rpc DeleteNetPolicy (DeleteNetPolicyRequest) returns (DeleteNetPolicyReply);

  // Shows the *effective* policy for one task of a job: every matching
  // stored policy merged with the task's inline `network.egress` /
  // `network.ingress`, with each rule and handler naming the policy it came
  // from. This is exactly what the node datapath runs — the same merge
  // function — and the one thing a client cannot compute itself, because
  // stored policies live in the manager. `node_pool` narrows selector
  // matching to a pool (a job may land in several). ACL: `net:read` on the
  // job.
  rpc ShowNetPolicy (ShowNetPolicyRequest) returns (ShowNetPolicyReply);

  // Dry-runs a verdict: would this task be allowed to reach `to` (egress) or
  // be reached from `from` (ingress)? Returns the verdict, the rule that
  // decided it, and its reason, without sending anything — so an operator or
  // an agent can ask "is that host blocked?" instead of watching a connection
  // hang. Connect-time rules are evaluated; request-time rules (path,
  // method, header) are evaluated when `method`/`path` are given, otherwise
  // reported as `defer`. ACL: `net:read` on the job.
  rpc TestNetPolicy (TestNetPolicyRequest) returns (TestNetPolicyReply);

  // Creates or replaces a network plugin object: a WASM module on the
  // proxy-wasm ABI that runs inside the node datapath as one more handler
  // (docs/network-plugins.md). The object names the module (a `.wasm` URL
  // pinned by `sha256:` checksum), the stages it acts at, who may reference
  // it (`usableBy`), the node pools it may run on, its limits, the JSON
  // Schema every reference's `config` must satisfy, the HTTP targets it may
  // call, and the KV-held keys it may sign with. Validated on write; a
  // plugin that a stored policy references must keep stages that policy can
  // run and a schema its config still satisfies, or the write is refused.
  // Nodes running the plugin pick up the new revision on their next
  // heartbeat and fetch the module once per node.
  //
  // ACL: `net:write`. A `usableBy = "policies"` plugin with `nodePools`
  // needs it on each pool; one without pools, and every `usableBy = "jobs"`
  // plugin, and any plugin whose module is a `file://` node path, needs it
  // unscoped (cluster-wide). Naming a `credentials` KV path also needs
  // `kv:read` on that path.
  rpc UpsertNetPlugin (UpsertNetPluginRequest) returns (UpsertNetPluginReply);

  // Fetches one stored plugin object by name, with the policy objects that
  // reference it. ACL: `net:read`.
  rpc GetNetPlugin (GetNetPluginRequest) returns (GetNetPluginReply);

  // Lists stored plugin objects by name. ACL: `net:read`.
  rpc ListNetPlugins (ListNetPluginsRequest) returns (ListNetPluginsReply);

  // Deletes a stored plugin object. Refused while a stored policy object
  // references it (the error names them). A job that references it keeps
  // running; its plugin hops fail with "plugin not found" and follow their
  // `onError` from the next heartbeat. ACL: `net:write`, as for
  // UpsertNetPlugin.
  rpc DeleteNetPlugin (DeleteNetPluginRequest) returns (DeleteNetPluginReply);

  // Where a plugin runs and how it is doing, as each node last reported it
  // on its heartbeat: the revision and module the node holds, whether the
  // module is fetched and instantiated, calls, errors, the last error, and
  // the p99 callback time. ACL: `net:read`.
  rpc GetNetPluginStatus (GetNetPluginStatusRequest) returns (GetNetPluginStatusReply);

  // The cluster CA as the answering manager sees it — what an operator
  // hands a non-Legion client that must reach a mesh-TLS port or the worker
  // plane (`legion sandbox start --node`, `legion exec --direct`), or
  // verifies a node certificate against. Returns the signing CA, the full
  // trust bundle (both CAs during a built-in rotation), the chain leaves
  // carry, the pin new join tokens carry, where a rotation stands, which
  // provider supplies the CA (`builtin`, `file`, or `exec`;
  // docs/cluster-ca.md), and anything wrong with it on this manager. Never
  // a key.
  //
  // Never fails for a CA problem: an unusable provider or a manager that
  // disagrees with the cluster is reported in `problem`, so this is the
  // call to diagnose one with. Empty `cert_pem` when no CA exists yet (the
  // built-in CA is created on first use: the first join token or node
  // certificate). ACL: `net:read`.
  rpc GetMeshCa (GetMeshCaRequest) returns (GetMeshCaReply);

  // Rotate the built-in cluster CA in two steps, without breaking any
  // connection (worker-plane-auth plan §6.9). The new CA is generated,
  // cross-signed by the current one, and signs every certificate from now
  // on; the previous CA stays in every holder's trust bundle for one
  // certificate lifetime (24 hours), and chains carry the cross-signed
  // certificate meanwhile, so a holder that has not refreshed its bundle
  // yet keeps verifying. Nodes re-issue their certificates within one
  // heartbeat (the reply names the new CA). Join tokens minted before the
  // rotation keep working during the overlap; after it, mint new ones.
  // ACL: `net:write` (unscoped).
  //
  // Errors:
  // - FailedPrecondition: the manager's `clusterCa.provider` is `file` or
  //   `exec`. Legion does not hold that CA's key, so it cannot rotate it;
  //   the message names the provider and the procedure (add the new CA to
  //   the trust bundle, wait a heartbeat, switch the signing CA, drop the
  //   old CA a day later; docs/cluster-ca.md#rotation).
  rpc RotateMeshCa (RotateMeshCaRequest) returns (RotateMeshCaReply);

  // Resolves an artifact credential stored in KV for a worker about to fetch.
  //
  // Called by workers over their existing authenticated manager channel
  // immediately before fetching an artifact whose spec (or cluster default)
  // names a KV credential path. The credential value is returned to the
  // worker and is never persisted on allocations, logged, or traced.
  //
  // A node is served only paths its own work names: an artifact `auth.kv` of
  // an allocation placed on it, of the task of a live boot ticket for its
  // pool (edge starts stage before the allocation exists), or its pool's
  // `contentStore.auth.kv`. Any other path is NOT_FOUND, decided before the
  // value is read, so a node cannot probe which paths exist. A spec that
  // names `auth.kv` itself needed `kv:read` on the path to be admitted (see
  // docs/artifacts.md).
  //
  // Errors:
  // - PermissionDenied: `node_id` does not match the caller's credential.
  // - NotFound: no work on the node names `kv_path`, or the KV entry is
  //   missing.
  rpc GetArtifactCredential (GetArtifactCredentialRequest)
    returns (GetArtifactCredentialReply);

  // Executes a SQL statement directly against the manager state store.
  //
  // Read-only mode is the default safety behavior and rejects write statements
  // unless explicitly enabled in the request.
  //
  // Private key material, password hashes, and recorded idempotency replies
  // (`idempotency_record.response_message`, which can hold a live boot
  // ticket) always read as NULL, in any
  // statement and however the query reaches them: `signing_key.private_key_pem`,
  // `net_mesh_ca.key_pem`, and `acl_user.password_hash`. Predicates on those
  // columns match nothing, and `INSERT ... SELECT` copies NULL.
  //
  // ACL: `state:read`, or `state:write` when `allow_write` is set.
  rpc QueryStateStore (QueryStateStoreRequest) returns (QueryStateStoreReply);

  // Returns a structured schema snapshot for the manager SQLite state store.
  rpc GetStateStoreSchema (GetStateStoreSchemaRequest)
    returns (GetStateStoreSchemaReply);

  // Lists recent scheduler events from the manager's event journal.
  //
  // Events describe what the scheduler is doing: evals enqueued/completed,
  // allocations placed/removed/failed, node lifecycle changes, job lifecycle
  // changes, and rollout activity. Results are ordered oldest-to-newest and
  // support cursor-based polling via `after_id`.
  //
  // ACL: `operator:read` sees every event. A caller without it but with
  // `job:read` somewhere (a namespace tenant) sees only the events of jobs
  // it may read, plus the lifecycle events of namespaces it reaches
  // (docs/namespaces.md); cluster events (nodes, raft, the scheduler) and
  // other tenants' events are left out, so a page may hold fewer than
  // `limit` events. Neither kind of caller can widen this with a filter.
  rpc ListEvents (ListEventsRequest) returns (ListEventsReply);

  // Streams scheduler events as they happen (server-streaming).
  //
  // When `after_id` is set, persisted events with `id > after_id` are
  // replayed first, then the live feed continues seamlessly. Clients that
  // disconnect can resume without gaps by passing the last event ID they saw.
  //
  // ACL: as ListEvents — `operator:read` for the whole feed, or `job:read`
  // for the events of the jobs the caller may read — re-checked every 30
  // seconds while the stream runs, against the same filter every event
  // passes. Once the token is revoked or expired, or its policies no longer
  // grant what the stream was opened with, the stream ends with that auth
  // error.
  rpc StreamEvents (StreamEventsRequest) returns (stream SchedulerEvent);

  // Lists user-saved State Explorer query snippets.
  rpc ListSavedStateQueries (ListSavedStateQueriesRequest)
    returns (ListSavedStateQueriesReply);

  // Creates or overwrites a saved State Explorer query by name.
  rpc UpsertSavedStateQuery (UpsertSavedStateQueryRequest)
    returns (UpsertSavedStateQueryReply);

  // Deletes a saved State Explorer query by name.
  rpc DeleteSavedStateQuery (DeleteSavedStateQueryRequest)
    returns (DeleteSavedStateQueryReply);

  // === AUTH & ACL ===
  //
  // Legion's ACL system is token-based: callers present a bearer credential in
  // the `authorization` metadata header (`Bearer <secret>`). Credentials are
  // either opaque Legion ACL tokens (minted by CreateAclToken or Login, or the
  // initial management token the manager mints itself at first start) or
  // externally issued JWTs validated against a configured auth method. Each
  // request resolves to a set of named policies; policies contain scoped
  // allow/deny rules over resources (`job`, `node`, `kv`, `state`,
  // `operator`, `acl`) and actions (`read`, `write`).
  //
  // ACLs are on by default (`acl.enabled = true`). When a manager starts with
  // ACLs on and no management token exists, it mints one itself, as a
  // replicated write on the control-lane leader, and writes the secret to
  // `<dataDir>/bootstrap-token` and to the CLI token file for the manager's
  // local address (`~/.legion/tokens/<host>_<port>`), both mode 0600. There is no open bootstrap endpoint: the
  // secret never crosses the network. `acl.bootstrapSecretFile` pre-seeds the
  // secret for infrastructure-as-code. Recovery is "delete the management
  // tokens, then restart the manager".
  //
  // When ACLs are explicitly disabled (`acl.enabled = false`) every endpoint
  // behaves as if the caller held a management token.

  // Reports how the manager authenticated the caller and what access applies.
  //
  // This endpoint never requires a credential: anonymous callers receive the
  // anonymous identity. UI and CLI clients use it to discover whether ACLs are
  // enabled and to introspect the presented credential.
  rpc WhoAmI (WhoAmIRequest) returns (WhoAmIReply);

  // Exchanges login credentials for a newly minted Legion ACL token.
  //
  // Supported methods: the built-in `userpass` method (username/password
  // verified against stored ACL users) and any JWT/OIDC auth method configured
  // on the manager (`method` = the configured method name, `jwt` = the
  // externally issued token). The reply contains the token secret exactly
  // once; the manager stores only a hash of it.
  //
  // A token minted through the `legion` method (a workload's identity token)
  // expires no later than that identity token does, whatever `ttl` asks for:
  // a fork or snapshot retires the identity token, and a login token copied
  // with it must not outlive it.
  rpc Login (LoginRequest) returns (LoginReply);

  // Creates or replaces a named ACL policy. Requires `acl:write`.
  rpc UpsertAclPolicy (UpsertAclPolicyRequest) returns (UpsertAclPolicyReply);

  // Returns one ACL policy by exact name. Requires `acl:read`.
  rpc GetAclPolicy (GetAclPolicyRequest) returns (GetAclPolicyReply);

  // Lists all ACL policies. Requires `acl:read`.
  rpc ListAclPolicies (ListAclPoliciesRequest) returns (ListAclPoliciesReply);

  // Deletes an ACL policy by exact name. Requires `acl:write`.
  //
  // Tokens referencing the deleted policy lose the access it granted.
  rpc DeleteAclPolicy (DeleteAclPolicyRequest) returns (DeleteAclPolicyReply);

  // Creates a new ACL token attached to existing policies.
  //
  // Requires `acl:write`. Creating a `management` token additionally requires
  // the caller to hold a management token.
  rpc CreateAclToken (CreateAclTokenRequest) returns (CreateAclTokenReply);

  // Lists ACL tokens. Requires `acl:read`.
  //
  // Only accessor IDs and metadata are returned; secrets are never stored or
  // returned after creation.
  rpc ListAclTokens (ListAclTokensRequest) returns (ListAclTokensReply);

  // Deletes (revokes) an ACL token by accessor ID. Requires `acl:write`.
  rpc DeleteAclToken (DeleteAclTokenRequest) returns (DeleteAclTokenReply);

  // Creates or updates a username/password ACL user. Requires `acl:write`.
  //
  // Passwords are hashed with argon2id; plaintext is never stored.
  rpc UpsertAclUser (UpsertAclUserRequest) returns (UpsertAclUserReply);

  // Lists username/password ACL users. Requires `acl:read`.
  rpc ListAclUsers (ListAclUsersRequest) returns (ListAclUsersReply);

  // Deletes a username/password ACL user. Requires `acl:write`.
  //
  // Tokens previously minted via Login remain valid until they expire or are
  // deleted; deleting the user only prevents future logins.
  rpc DeleteAclUser (DeleteAclUserRequest) returns (DeleteAclUserReply);

  // Lists job grants: what each job config version's `legion` identities
  // were granted at submit, and by whom (docs/workload-identity.md,
  // "Permissions"). Requires `acl:read`.
  //
  // A job asks for access to Legion itself with `permissions` (inline ACL
  // rules) and `policies` (policy names) on the reserved `legion` identity
  // of a task. Every path that stores a job config (RunJob, RunJobTemplate)
  // grants them only when the submitting token holds every one, and records
  // the grant with the version, in the submitter's name. A workload's
  // `legion` token then carries the grant of the version its allocation
  // runs, resolved when the token is verified. Versions that ask for nothing
  // have no grant and are not listed.
  //
  // Revoked grants are left out unless `include_revoked` is set.
  rpc ListGrants (ListGrantsRequest) returns (ListGrantsReply);

  // Revokes a job's grants: every version's, or one version's. Requires
  // `acl:write`.
  //
  // A workload token resolves its grant every time it is verified, so the
  // job's tokens (and ACL tokens minted from them with `legion login
  // --method legion`) lose the access at their next request; tokens keep
  // whatever `controlPlaneBindings` give them. Allocations keep running.
  // Revocation does not stick to the job: the next submit of the job by
  // someone who holds the access grants it again, as a submit always does.
  //
  // Retry-safe: a repeated `idempotency_key` returns the first reply with
  // `deduplicated` set. Revoking a job with no live grants succeeds and
  // revokes nothing (`revoked = 0`).
  //
  // Errors:
  // - InvalidArgument: `job` is empty.
  rpc RevokeGrant (RevokeGrantRequest) returns (RevokeGrantReply);

  // Lists installed apps (docs/apps.md): each app's record, settings, grant,
  // status, and where it runs. Requires `app:read`; the list is filtered to
  // the apps the caller may read (`names` selector).
  //
  // An app is a job in the reserved `legion-system` namespace, a grant (what
  // that job's `legion` identity may do), and registrations. Its status is
  // derived when it is read: `stopped` (disabled), `degraded` (the
  // reconciler's last pass failed, or fewer replicas run than asked for),
  // `pending` (nothing runs yet, with why), or `running`.
  rpc ListApps (ListAppsRequest) returns (ListAppsReply);

  // Shows one app: everything ListApps reports, plus its manifest, config,
  // and the reconciler's last action, error, and build marker. Requires
  // `app:read` on the app.
  //
  // Errors:
  // - NotFound: no app of that name is installed.
  rpc GetApp (GetAppRequest) returns (GetAppReply);

  // Installs an app from a manifest (`legion app install <file|url>`).
  // Requires `app:write` on the app's name, and every permission the
  // manifest asks for: the same grant check a job submit runs (docs/
  // workload-identity.md, "Permissions"), against the installer. The grant
  // is recorded on the app record in the installer's name, and the app
  // reconciler then submits the app's job in `legion-system`.
  //
  // `dry_run` validates the manifest and the installer's coverage and
  // returns the prompt (`prompt`) without installing, which is how the CLI
  // shows what the app runs, where, as whom, and with what grant before it
  // asks. A dry run that the grant check would refuse still answers, with
  // the refusal in `uncovered`.
  //
  // Retry-safe: a repeated `idempotency_key` returns the first reply with
  // `deduplicated` set.
  //
  // Errors:
  // - InvalidArgument: the manifest does not parse or validate (unknown
  //   fields, a bad name, a missing `version`, a config schema that does
  //   not compile or has a remote `$ref`, a default that fails it, a job
  //   fragment that does not parse), or `config_json` fails the schema.
  // - PermissionDenied: the caller lacks `app:write`, or a permission the
  //   manifest asks for.
  // - AlreadyExists: an app of that name is installed (use UpgradeApp).
  // - FailedPrecondition: the name is a bundled app's.
  rpc InstallApp (InstallAppRequest) returns (InstallAppReply);

  // Replaces an installed app's manifest (`legion app upgrade`). Requires
  // `app:write` and, because a new manifest changes the code the app runs,
  // every permission the new manifest asks for, checked against the caller
  // as at install.
  //
  // The reply carries the permission diff. When the new manifest asks for a
  // permission the recorded grant does not hold, nothing changes unless
  // `approve` is set: the reply has `upgraded = false` and the diff, so the
  // CLI can ask. A manifest that only keeps or drops permissions upgrades
  // without `approve`. The stored config is checked against the new
  // schema; a config that no longer matches refuses the upgrade.
  //
  // Retry-safe with `idempotency_key`.
  //
  // Errors:
  // - NotFound: no app of that name.
  // - InvalidArgument: the manifest is invalid, names another app, or the
  //   stored config fails its schema.
  // - PermissionDenied: the caller lacks `app:write` or a permission.
  // - FailedPrecondition: the app is bundled (bundled apps upgrade with the
  //   binary).
  rpc UpgradeApp (UpgradeAppRequest) returns (UpgradeAppReply);

  // Uninstalls an app (`legion app uninstall`): stops its job, revokes the
  // job's grants, and deletes the record. The stopped job stays in
  // `legion-system` until someone destroys it. Requires `app:write`.
  //
  // Retry-safe with `idempotency_key`; uninstalling an app that is not
  // installed is NotFound.
  //
  // Errors:
  // - FailedPrecondition: the app is bundled; disable it instead.
  rpc UninstallApp (UninstallAppRequest) returns (UninstallAppReply);

  // Enables or disables an app (`legion app enable|disable`). Disabling
  // stops the app's job and keeps its record, config, and grant; enabling
  // runs it again. Requires `app:write`. Setting the state an app already
  // has is a write too: it retries a reconcile the last failure parked.
  //
  // Retry-safe with `idempotency_key`.
  rpc SetAppEnabled (SetAppEnabledRequest) returns (SetAppEnabledReply);

  // Changes an app's settings (`legion app set`): replicas, placement, the
  // pool for worker placement, and CPU and memory per task. The reconciler
  // re-renders the job and rolls it. Requires `app:write`.
  //
  // Retry-safe with `idempotency_key`.
  //
  // Errors:
  // - InvalidArgument: replicas outside 1-32, an unknown placement, a pool
  //   with `managers` placement, a zero resource.
  rpc UpdateAppSettings (UpdateAppSettingsRequest) returns (UpdateAppSettingsReply);

  // Replaces an app's config (`legion app config set`), validated against
  // the manifest's config schema. The reconciler renders it into the job as
  // a file (`$LEGION_APP_CONFIG`) and rolls the job: the job's version
  // history is the config's history. Requires `app:write`; a change to any
  // of the manifest's `codeFields` (plugin sources, endpoints the app runs)
  // also requires every permission of the app's recorded grant, as install
  // does, so `app:write` is never a path to the app's grant.
  //
  // Retry-safe with `idempotency_key`.
  //
  // Errors:
  // - InvalidArgument: `config_json` is not JSON or fails the schema.
  // - PermissionDenied: a code field changed and the caller does not hold
  //   the app's grant.
  rpc SetAppConfig (SetAppConfigRequest) returns (SetAppConfigReply);

  // Lists the UI extensions installed apps register (docs/apps.md, "Views
  // and actions"; docs/ui-architecture.md, "App extensions"): the pages,
  // overview cards, job and node panels, and task badges the SPA draws from
  // apps' declarative views, and the apps' sandboxed pages (`ui.pages`,
  // listed in the `nav` slot with `page` set). Requires `app:read`; the
  // list is filtered to the apps the caller may read (`names` selector),
  // and to enabled apps.
  //
  // Each entry the manifest declares with a `permission` is filtered by it,
  // checked as the caller:
  // - with `context` set, on that context's scope (the job's namespace and
  //   name for `job` and `task` slots; the node's pool for `node`), exactly
  //   as GetAppView will check it, so the SPA shows a panel only to viewers
  //   who may see it;
  // - without `context`, on any scope ("does the caller hold it
  //   anywhere?"), which is what the sidebar and overview need at login.
  //   A sandboxed page's permission is always checked this way, as
  //   GetAppPage checks it.
  //
  // An entry without a permission needs only `app:read` on its app.
  //
  // Nothing is forwarded to any app: this answers from the installed
  // manifests alone.
  //
  // Errors:
  // - InvalidArgument: an unknown `slot`, or a `context` whose slot is not
  //   `slot` or that does not fit its slot (see AppViewContext).
  rpc ListUiExtensions (ListUiExtensionsRequest) returns (ListUiExtensionsReply);

  // Renders one of an app's declarative views (`legion app view`, the
  // `legion_app_view` MCP tool, and every app panel in the SPA). The one
  // data path for all three (apps plan §6.5).
  //
  // The manager authorizes before anything reaches the app:
  // 1. `app:read` on the app;
  // 2. the view must be registered in the context's slot;
  // 3. the entry's declared `permission`, checked as the caller on the
  //    context's scope (on any scope for `nav` and `overview`). A caller
  //    without it is refused here, and the app sees no request at all.
  //
  // Only then does it forward `GET /legion/v1/views/<view>?<context>` to
  // one running allocation of the app's job, over the worker plane
  // (`Worker.ForwardAppRequest`), to the port the manifest's `ui.port`
  // names. The request carries a **viewer assertion** in the
  // `Legion-Viewer` header: a JWT signed with the cluster's
  // workload-identity key, `aud = app:<name>`, living 60 seconds, whose
  // `legion.io/viewer` claim names the caller (principal, accessor id), the
  // permission checked and where, and the context exactly as the query
  // carries it. Apps must refuse a request whose assertion is missing,
  // expired, for another audience, or for another context; the app
  // framework does (docs/apps.md, "The viewer assertion").
  //
  // The answer is validated against the view schema (`legion-view/1`: the
  // closed block set, no unknown fields, no raw HTML, links only to
  // `http(s)` or in-app routes) before it is returned. A view may answer
  // `{ "hidden": true }`: nothing to show for this context.
  //
  // Errors:
  // - InvalidArgument: a context that does not fit its slot.
  // - PermissionDenied: the caller lacks `app:read` or the entry's
  //   permission on the context.
  // - NotFound: no such app, or the app registers no such view in that
  //   slot (or the app answered 404 for it).
  // - FailedPrecondition: the app is disabled; workload identity is off on
  //   this manager (`workloadIdentity.enabled`), so no assertion can be
  //   signed; or the app answered with a view that fails the schema, or
  //   refused the assertion (the message names which).
  // - Unavailable: no allocation of the app's job is running, or its node
  //   or port cannot be reached (retryable).
  // - DeadlineExceeded: the app did not answer within 10 seconds.
  rpc GetAppView (GetAppViewRequest) returns (GetAppViewReply);

  // Invokes an action an app declares (`ui.actions`), the button in a
  // view's `actions` block. Mutating, retry-safe with `idempotency_key`,
  // and audited: every invocation that passes `app:read` records an
  // `app.action` event (app, action, caller, context, outcome `ok`,
  // `failed`, or `denied`).
  //
  // Authorization, before anything reaches the app:
  // 1. `app:read` on the app;
  // 2. the action must be declared, and the context must have a scope
  //    (`job`, `task`, or `node`): actions are never pressed on the
  //    sidebar or the overview;
  // 3. the action's declared `permission` (required on every action),
  //    checked as the caller on the context's scope. `app:write` is not
  //    needed: the declared permission is what the button may do, and
  //    `app:write` would let every operator who presses it reconfigure the
  //    app.
  //
  // `inputs_json` is checked against the action's typed inputs (string,
  // number, duration, enum, boolean); unknown inputs are refused and
  // defaults filled in. The manager then forwards `POST
  // /legion/v1/actions/<action>` with `{ "context": {...}, "inputs":
  // {...} }` and a viewer assertion that also carries the SHA-256 of the
  // inputs' canonical JSON, so an app acts only on the context and inputs
  // the manager authorized.
  //
  // The app answers `{ "message": "...", "view": {...} }`; `view`, when
  // present, is a refreshed view, validated like GetAppView's.
  //
  // Errors: as GetAppView, plus InvalidArgument for inputs that fail their
  // declaration, and FailedPrecondition carrying the app's own message when
  // the app reports the action failed (HTTP 4xx other than 401, 403, 404).
  rpc InvokeAppAction (InvokeAppActionRequest) returns (InvokeAppActionReply);

  // Fetches one of an app's sandboxed pages (`ui.pages`; docs/apps.md,
  // "Sandboxed pages"; apps plan §6.5, tier 2): the single-file HTML bundle
  // the SPA mounts in an `<iframe sandbox="allow-scripts" srcdoc=...>`
  // under a strict Content-Security-Policy, and the Manager RPCs the page
  // may call through the SPA's bridge as the viewer.
  //
  // Authorized exactly like GetAppView, before anything reaches the app:
  // 1. `app:read` on the app;
  // 2. the page must be declared in the app's manifest;
  // 3. the page's declared `permission`, if any, checked as the caller on
  //    any scope (pages live in the sidebar, like a `nav` view).
  //
  // Only then does the manager forward `GET <bundle>` (default
  // `/legion/v1/pages/<page>`) to one running allocation of the app's job,
  // with a viewer assertion whose `legion.io/viewer` claim has `kind =
  // "page"`, the page's name, and the `nav` slot's empty context. The answer
  // must be `200` with a `text/html` content type, UTF-8, and at most 1 MiB;
  // the manager does not sanitize it (a page is code, confined by the SPA's
  // sandbox and CSP, not by the manager).
  //
  // Errors:
  // - PermissionDenied: the caller lacks `app:read` or the page's
  //   permission.
  // - NotFound: no such app, or the app declares no such page (or answered
  //   404 for it).
  // - FailedPrecondition: the app is disabled; workload identity is off on
  //   this manager; the app refused the viewer assertion; or the answer is
  //   not UTF-8 HTML within 1 MiB (the message names which).
  // - Unavailable: no allocation of the app's job is running, or its node
  //   or port cannot be reached (retryable).
  // - DeadlineExceeded: the app did not answer within 10 seconds.
  rpc GetAppPage (GetAppPageRequest) returns (GetAppPageReply);

  // Lists the auth methods clients may log in with.
  //
  // Open endpoint: login UIs need this before any credential exists. Only
  // public metadata is returned (names, types, OIDC client settings) —
  // never secrets or validation keys.
  rpc GetAuthMethods (GetAuthMethodsRequest) returns (GetAuthMethodsReply);

  // Creates a worker join token. Requires `node:write`.
  //
  // The reply contains a self-describing composite token (manager address +
  // secret + worker type) that introduces a worker in one command:
  // `legion join <TOKEN>`. The manager stores only a hash of the secret.
  // The token also pins the cluster CA (`caHash`): the trust-bundle CA the
  // signing CA chains to, whichever `clusterCa.provider` supplies it
  // (docs/cluster-ca.md). A joining worker refuses a manager whose chain
  // does not lead to it.
  //
  // Errors:
  // - Unavailable: the cluster CA is not available on this manager yet (the
  //   built-in CA has not replicated, or an `exec` provider did not answer).
  // - FailedPrecondition: the cluster CA needs an operator (unusable CA
  //   files, or this manager disagrees with the cluster's CA;
  //   `GetMeshCa.problem` says why).
  rpc CreateJoinToken (CreateJoinTokenRequest) returns (CreateJoinTokenReply);

  // Lists worker join tokens (metadata only). Requires `node:read`.
  rpc ListJoinTokens (ListJoinTokensRequest) returns (ListJoinTokensReply);

  // Deletes (revokes) a worker join token by ID. Requires `node:write`.
  //
  // Workers already registered keep their node tokens; revocation only
  // prevents future joins with this token.
  rpc DeleteJoinToken (DeleteJoinTokenRequest) returns (DeleteJoinTokenReply);

  // Mints a boot ticket: a short-lived, narrow capability that lets an edge
  // node start one workload on its own, without any call to a manager
  // (docs/edge-boot.md). Requires `boot:write`, scoped by job name.
  //
  // The ticket is a JWT signed by the cluster's workload-identity signer and
  // verified offline by the worker against the published JWKS. It names an
  // exact job config, one task, the instance id (or a non-empty instance
  // prefix) it may start, the node pool it may run in, and the furthest gate
  // level the start may reach. Tickets are single-use by default; a second
  // ratification carrying the same `jti` is refused.
  //
  // `boot:write` is deliberately separate from `job:write`: a platform's
  // ticket minter should be able to authorize individual starts without
  // holding the right to redeploy the fleet.
  //
  // Refused with FailedPrecondition when `edgeBoot.enabled` is false on the
  // manager — minting is an explicit operator decision, because it grows a
  // compromised node's blast radius from "runs what it was given" to "runs
  // anything a live ticket names".
  rpc IssueBootTicket (IssueBootTicketRequest) returns (IssueBootTicketReply);

  // Lists outstanding boot tickets (metadata only — never the token bytes).
  // Requires `boot:read`. Rows expire with the ticket, so this is the live
  // set of capabilities the cluster has handed out.
  rpc ListBootTickets (ListBootTicketsRequest) returns (ListBootTicketsReply);

  // Ratifies a provisional allocation: the durable commit that decides who
  // really owns an instance (docs/edge-boot.md).
  //
  // Worker plane — called by the node that started the work, authenticated
  // with its node token. The manager turns the claim into an ordinary plan
  // submission with a single placement on the calling node and applies it
  // through the same transaction every other placement goes through, with
  // the same constraint and capacity re-validation against committed rows
  // and the same at-most-one-live-allocation instance binding. It skips the
  // plan epoch compare-and-set, because it never planned against a
  // snapshot, so concurrent ratifications of one job do not refuse each
  // other. A refusal here is that apply failing. There is no second code
  // path for correctness.
  //
  // The reply is the verdict: `confirmed` carries the manager-minted
  // allocation id (the worker opens the network and the work becomes a normal
  // allocation), `refused` carries a machine-readable reason the worker kills
  // the work with.
  //
  // Only the raft leader ratifies. A follower answers `FAILED_PRECONDITION`
  // ("this manager is not the raft leader…") instead of a verdict. It wrote
  // nothing and the ticket is unspent, so the caller sends the same request
  // to the leader.
  rpc RatifyClaim (RatifyClaimRequest) returns (RatifyClaimReply);
}

// Request payload for WorkerPreRegister.
message WorkerPreRegisterRequest {
  // Worker type name (for example: "default").
  //
  // This selects the worker template stored on the manager.
  // No manager-side default is applied by this RPC.
  //
  // When the caller authenticates with a join token, this must equal the
  // worker type the token was minted for; anything else is refused with
  // `PERMISSION_DENIED` (audit-only mode logs and allows it).
  string worker_type = 1;

  // Join token secret (the `secret` field of a decoded join token).
  //
  // When ACLs are enforced the caller must present either this (validated
  // against the manager's stored join tokens) or an already-issued node
  // token as its bearer credential, with this field left unset — the path a
  // restarted worker takes, so it does not depend on its join token still
  // being valid. Ignored when ACLs are disabled.
  optional string join_token = 2;
}

// Effective worker configuration returned by pre-registration.
message WorkerConfig {
  // Worker type name that produced this config.
  string name = 1;

  // Node pool this worker belongs to.
  string pool = 2;

  // Additional dynamic node-check plugin names to execute on worker.
  //
  // Default: empty list when worker type does not specify checks.
  repeated string additional_node_checks = 3;

  // Static worker attributes injected into node config attrs at registration.
  //
  // Default: empty object `{}` when worker type does not set attributes.
  map<string, string> attributes = 4;

  // Optional prefix used when auto-generating worker IDs.
  //
  // Default: unset.
  optional string name_prefix = 5;

  // JSON-encoded total node resource overrides/capabilities.
  //
  // Default: `{}` (from worker-type storage defaults).
  string resources = 6;

  // JSON-encoded reserved resource amounts/items unavailable for scheduling.
  //
  // Default: `{}` (from worker-type storage defaults).
  string reserved_resources = 7;

  // Optional maximum number of allocations this worker should host.
  //
  // Default: unset (no explicit max allocation cap).
  optional uint32 max_allocations = 8;

  // JSON-encoded artifact fetch settings for this worker.
  //
  // Shape: `{"fetch":{"parallelism":4,"attempts":3,"timeout":"10m",
  //          "maxArtifactSize":"50GiB","allowedSchemes":["https","s3",
  //          "oci","git","file"]}}`.
  //
  // The worker config's top-level `content` block (the node content store,
  // see docs/artifacts.md) rides in this payload under a `content` key:
  // `{"content":{"enabled":true,"budgets":{"artifacts":"10%",
  //   "snapshots":"50GiB"},"ttl":"72h","minFreeDisk":"5GiB"}}`. A budget
  // is a fixed size or a share of the filesystem holding the store, which
  // the worker sizes when it starts. Absent budgets take the defaults: 10%
  // clamped to 1..20 GiB for artifacts, 20% clamped to 2..200 GiB for
  // snapshots.
  //
  // Default: empty string (worker applies conservative built-in defaults,
  // including an enabled content store).
  string artifacts = 9;

  // JSON-encoded host volumes this worker offers to jobs (see
  // docs/volumes.md). These are paths that already exist on the machine —
  // a models directory, a dedicated NVMe mount — which jobs claim by name
  // through the `host` volume driver.
  //
  // Shape: `{"models":{"path":"/mnt/models","readOnly":true},
  //          "pgdata":{"path":"/mnt/nvme0/pg","create":true}}`.
  // `readOnly` makes a read-write claim an error rather than silently
  // downgrading it; `create` (default false) makes the worker create a
  // missing directory, which is off by default so a typo cannot silently
  // produce an empty volume where real data was meant to be.
  //
  // Default: empty string (the `host` driver reports itself unavailable on
  // this node, and jobs claiming it are rejected at admission).
  string host_volumes = 10;

  // How often this worker heartbeats the manager, in seconds (worker-type
  // config `heartbeatSeconds`). Workers clamp the value to 1..=30 and add
  // ±10% jitter per beat. The manager marks a node lost after 10s without
  // a heartbeat, so values above ~3 trade detection margin for load; the
  // manager logs a warning when serving such a config. At large fleets the
  // cadence is the manager-load knob: 10k workers at the default 2s is
  // 5,000 heartbeats/second.
  //
  // Default: unset (workers use the built-in 2s default).
  optional uint32 heartbeat_seconds = 11;

  // JSON-encoded resource-enforcement settings for this worker (see
  // docs/task-supervision.md). Shape:
  // `{"enabled":true,"cgroupParent":"legion"}`.
  //
  // When enabled, a Linux worker puts each `exec` task in a cgroup v2 subtree
  // it creates under `cgroupParent` and writes the task's `resources` there as
  // real limits (`memory.max`, `cpu.max`), instead of treating them as
  // scheduling arithmetic only. Off by default: turning declared resources
  // into kernel limits can OOM-kill a workload whose declaration was only ever
  // an estimate, so it is a deliberate per-worker choice.
  //
  // Default: empty string (enforcement off; `resources` stays advisory for
  // `exec` tasks).
  string resource_enforcement = 12;

  // JSON-encoded edge-boot settings for this worker (see docs/edge-boot.md).
  // Shape: `{"acceptClaims":true,"jwksRefresh":"5m","clockSkew":"30s"}`.
  //
  // `acceptClaims` decides whether this node serves `Worker.StartClaim` — that
  // is, whether it will start work on a boot ticket at all. Off by default,
  // independently of the manager's `edgeBoot.enabled`: an operator who turns
  // the feature on cluster-wide still chooses which nodes are edges.
  //
  // Default: empty string (this node accepts no edge starts).
  string edge_boot = 13;

  // JSON-encoded `container` runtime settings for this worker type (see
  // docs/task-runtime-container.md, "Capabilities"). Shape:
  // `{"allowCaps":["CAP_CHOWN","CAP_NET_RAW",...]}` or `{"allowCaps":["ALL"]}`.
  //
  // `allowCaps` is the set of Linux capabilities a `container` task on this
  // node may end up with after its `security.capabilities` adjustments (the
  // default set, less `drop`, plus `add`). A task whose effective set holds
  // anything outside it fails at start on this node, with a message naming
  // each refused capability and this field. The manager writes the names
  // normalized (`CAP_` prefixed, sorted); `["ALL"]` allows every capability.
  //
  // Default: empty string (the default set: Docker's default capabilities
  // less `CAP_NET_RAW`, so jobs may drop capabilities but add none).
  string container = 14;
  // JSON-encoded security settings for workers of this type, folded by the
  // manager from the worker config's top-level blocks
  // (docs/network-handlers.md, "The host guard"):
  //
  // - `hostGuard`: `{"allow": ["10.0.1.7:9100"], "deny": ["192.0.2.10/32"]}`.
  //   Destinations no allocation may reach through the datapath are fixed
  //   (loopback, the node's own addresses, link-local, cloud metadata);
  //   `allow` opens one `ip:port` (or `cidr:port`) each, `deny` adds
  //   destinations. Job policy can't widen the guard; only this can.
  //
  // Default: empty string (the default guard, no overrides).
  string security = 15;

  // The namespaces whose jobs nodes of this type accept (worker-type config
  // `namespaces`), as names or `*`-globs: `["ci-*"]`, `["legion-system"]`.
  // The worker records the list on its node as the `namespaces` config
  // attribute, and the scheduler refuses to place a job whose namespace no
  // entry matches, whatever the job's `permit` says: it is a restriction of
  // the node, not a toleration a job can write. The blocked-eval wake pass
  // applies the same check, so a restricted node never wakes a job it would
  // refuse. Globs follow the reserved-prefix rule: `*` matches every
  // namespace except reserved `legion-*` ones, which only a pattern that
  // itself starts with `legion-` matches. See docs/namespaces.md, "Nodes
  // that accept only some namespaces".
  //
  // Default: empty (the node accepts every namespace, reserved ones
  // included).
  repeated string namespaces = 16;
}

// Reply payload for WorkerPreRegister.
message WorkerPreRegisterReply {
  // Effective worker configuration to use for this worker instance.
  //
  // Manager sets this on successful responses.
  WorkerConfig config = 1;

  // The cluster's workload-identity issuer, the same value as
  // `HeartbeatReply.workload_identity_issuer`: delivered here so a node
  // that verifies tickets (edge boot, direct exec) knows the `iss` to expect
  // before its first heartbeat.
  //
  // Default: empty when workload identity is disabled on this manager.
  string workload_identity_issuer = 2;
}

// Request payload for WorkerRegister.
message WorkerRegisterRequest {
  // Worker/node ID to register.
  //
  // With ACLs enforced, a caller authenticated by a node token (and no join
  // token) may only re-register its own node; any other name is refused with
  // `PERMISSION_DENIED`. A join token admits any name.
  string name = 1;

  // Pool assigned to this worker.
  //
  // With ACLs enforced this must match what the credential pins: the pool of
  // the join token's worker type, or (for a node-token re-registration) the
  // node's current pool. A mismatch is refused with `PERMISSION_DENIED`.
  // Audit-only mode logs the mismatch and allows it.
  string pool = 2;

  // JSON object string of node configuration attributes.
  //
  // `workerFleet` (set by the worker simulator) is checked against the
  // credential: with ACLs enforced, a join token's worker type must grant
  // the fleet through its own `workerFleet` attribute (an exact name or a
  // `*` glob such as `sim-*`), and a node token may not change the fleet
  // its node joined with. Either refusal is `PERMISSION_DENIED`; audit-only
  // mode logs it and allows it.
  string config_attrs = 3;

  // JSON object string of node fingerprint attributes collected on worker.
  string fingerprint_attrs = 4;

  // JSON object/string with current worker health-check results.
  string health_checks = 5;

  // Manager-populated defaults on registration (not client-provided):
  // - `status = "active"`
  // - `availability = "available"` for a new node; re-registration keeps an
  //   operator's `drained` (a cordoned node stays cordoned) and turns the
  //   `unavailable` that node loss sets back into `available` (a registering
  //   worker is alive)
  // - `dynamic_attrs = {}`
  // - `last_heartbeat = ""` until first heartbeat

  // Join token secret (the `secret` field of a decoded join token).
  //
  // When ACLs are enforced, a registration must present either this or the
  // node's own current node token as its bearer credential (with this field
  // left unset). A node token can re-register only its own node, in its
  // current pool. Ignored when ACLs are disabled.
  optional string join_token = 6;

  // Semantic build version of the worker binary (its Cargo package version,
  // e.g. `"0.1.0"`). Informational: recorded into the node's `dynamic_attrs`
  // (`buildVersion`) so `legion node list` and the UI can surface fleet
  // version skew. Build-version differences never cause rejection; only
  // `protocol_version` gates admission.
  //
  // Default: empty string (workers built before version reporting existed).
  string build_version = 7;

  // Worker<->manager wire-protocol version this worker speaks. Bumped only
  // for breaking wire-contract changes to worker-plane RPCs.
  //
  // Skew policy (rolling upgrades are managers-first, then workers):
  // - `0` (unset — proto3 default, i.e. a worker built before versioning):
  //   accepted; the manager logs a warning.
  // - `1..=<manager's supported version>`: accepted.
  // - greater than the manager's supported version: rejected with
  //   `FAILED_PRECONDITION` — the worker was upgraded before the manager.
  //   Upgrade all managers first, then retry the worker.
  //
  // Recorded into the node's `dynamic_attrs` (`protocolVersion`) for fleet
  // observability.
  //
  // Default: `0` (see above).
  uint32 protocol_version = 8;

  // Optional features this worker implements, beyond what its protocol
  // version implies. Recorded into the node's `dynamic_attrs`
  // (`capabilities`). The manager sends feature-specific work only to
  // workers that list the feature, and refuses the request that would need
  // it otherwise with FailedPrecondition naming the worker's version.
  //
  // Known values:
  // - `checkpoint`: the worker takes and reclaims snapshots
  //   (`HeartbeatReply.checkpoint_requests`) and starts allocations from
  //   `TaskAllocation.restore`.
  //
  // Default: empty (a worker that predates capabilities).
  repeated string capabilities = 9;

  // A hash of the worker's own executable, computed once at startup (the
  // first 16 bytes of its SHA-256, as hex). Recorded into the node's
  // `dynamic_attrs` as `buildId`, next to `buildVersion`. `buildVersion` is
  // the package version, which a rebuild without a version bump does not
  // change; together they are the build the app reconciler rolls bundled
  // apps on (docs/apps.md, "Upgrades"): an app's build marker moves only
  // when every ready node its placement allows reports the same pair.
  //
  // Default: empty (a worker that predates it). Such a node is left out of
  // every bundled app's build marker.
  string build_id = 10;

  // Per-host node attributes from `legion join --attr k=v` (and `legion
  // start worker --attr`), such as the machine's provider id:
  // `legion.provider-id = "i-0abc"`. Merged into the node's attributes over
  // its worker type's, and under the join token's: token, then `--attr`,
  // then worker type. Keys under the reserved `legion.` prefix are refused
  // with InvalidArgument, except the per-host ones (`legion.provider-id`),
  // and so are keys Legion reads as node structure (`namespaces`,
  // `resources`, ...). At most 64 entries; keys up to 128 bytes, values up
  // to 1024. See docs/auth-and-acls.md, "Node attributes from the join".
  //
  // Default: empty.
  map<string, string> join_attributes = 11;
}

// Reply payload for WorkerRegister.
message WorkerRegisterReply {
  // Human-readable status message.
  //
  // Current manager reply value: `"Worker registered"`.
  string message = 1;

  // Per-node credential for subsequent worker-plane calls (Heartbeat,
  // HealthCheck, and the identity, certificate, and credential issuers).
  // Workers attach it as a bearer credential exactly like an ACL token.
  //
  // Minted only when ACLs are enforced, and only when the caller registered
  // with a join token (or a management token): that registration rotates it
  // (the node's previous node token is revoked). A worker that re-registers
  // by presenting its CURRENT node token as its bearer credential — what a
  // restarted worker does, from the token it persisted with mode 0600 in its
  // state directory — gets no new token here: absent means "keep using the
  // one you presented". That is what lets a worker restart after its join
  // token has expired or been revoked, and it removes the window in which a
  // crash between the manager's rotation and the worker's write would lose
  // the only valid credential.
  //
  // Node tokens do not expire. Removing the node or resetting ACL state
  // revokes it; the worker then falls back to its join token.
  optional string node_token = 2;

  // Semantic build version of the manager binary that handled this
  // registration (its Cargo package version, e.g. `"0.1.0"`).
  // Informational: workers log it after registering and warn when it
  // differs from their own build version, so operators can spot skew from
  // worker logs as well as from `legion node list`.
  //
  // Empty when the manager predates version reporting.
  string manager_build_version = 3;

  // The worker<->manager wire-protocol version this manager supports (see
  // `WorkerRegisterRequest.protocol_version` for the skew policy). Workers
  // at or below this version are compatible. `0` means the manager predates
  // version reporting.
  uint32 manager_protocol_version = 4;

  // Every manager in the cluster, in the same form and with the same
  // semantics as `HeartbeatReply.manager_addresses`: delivered at
  // registration so a worker knows its failover set before its first
  // heartbeat. Empty outside `persistence.type = "raft"`.
  repeated string manager_addresses = 5;
}

// One submission unit that contributed to a rendered jobspec.
message Submission {
  // Original submission path (file path, module path, or logical label).
  string path = 1;

  // Full submission content as text.
  string content = 2;

  // True when this submission is the primary entrypoint file.
  bool is_primary = 3;
}

// Request payload for RunJob.
message RunJobRequest {
  // Fully rendered job specification as JSON text.
  //
  // This is the canonical input consumed by manager scheduling/validation logic.
  string parsed_jobspec = 1;

  // Source submissions used to produce `parsed_jobspec`.
  repeated Submission submissions = 2;

  // Optional eval-queue priority override for THIS submission.
  //
  // Higher values are processed sooner in the eval queue. This overrides the
  // queue position only; it does not change the job's priority band, and so
  // it has no effect on preemption.
  //
  // Default when omitted: the eval priority implied by the jobspec's
  // `priority` band — `critical` 90, `high` 70, `elevated` 60, `normal` 50,
  // `low` 30, `background` 15 — falling back to the manager's
  // `defaultPriority` (50) for a job whose band cannot be resolved.
  optional int64 priority = 3;

  // When true, enqueues a reschedule even when the job spec content is unchanged.
  //
  // Default: `false`.
  bool force_reschedule = 4;

  // Optional idempotency key.
  //
  // When set and non-empty, the manager deduplicates retried requests carrying
  // the same key: the first request is applied and its outcome recorded; any
  // later request with the same key returns the recorded reply without
  // re-applying. This lets clients (especially automated agents) safely retry
  // after a timeout without risking a double submission. Unset disables
  // deduplication.
  //
  // Keys are scoped to the RPC and to the caller (the ACL token's accessor
  // ID, or the principal for JWT and anonymous callers): the same key on a
  // different RPC, or from a different caller, is a new request and never
  // replays another caller's reply. The key also covers the request: the same
  // key with different arguments fails with INVALID_ARGUMENT instead of
  // replaying the first reply. Records are kept for 24 hours, then pruned; a
  // retry after that is applied again. Every other RPC's `idempotency_key`
  // follows these rules.
  optional string idempotency_key = 5;

  // Namespace to submit into (`legion job run -n`). The jobspec may name
  // one too (`namespace = "prod"`): when both are set and differ the
  // request is INVALID_ARGUMENT rather than one winning, and authorization
  // runs against the resolved namespace, never the request field alone.
  // Neither set means `default`. The namespace must exist (NOT_FOUND
  // otherwise; namespaces are never created implicitly).
  optional string namespace = 6;

  // Accept a jobspec that carries keys Legion does not know
  // (`legion job run --allow-unknown-fields`).
  //
  // Default `false`: every unknown key, at the job level, in a task, or in
  // any nested block, fails the request with INVALID_ARGUMENT. The message
  // names each key with its path and, when one is close, the known key it
  // most likely meant: `web: task web: unknown field `cuont` (did you mean
  // `count`?)`.
  //
  // When `true`:
  // - a key directly on an extension point (the job's top level, a task, an
  //   entry in a task's `volumes`, an entry in `network.ports`, or a task's
  //   `service` block) is kept, unvalidated, in that block's
  //   `pendingExtensions` map, and stored with the version. Nothing acts on
  //   it. These are the places where apps will declare their own keys, so a
  //   key there may belong to an app that is not installed yet;
  // - a key anywhere else is dropped;
  // - each kept or dropped key is listed in `RunJobReply.warnings`, and the
  //   set is recorded on the job config version this request creates
  //   (`GetJobInfoReply.unknown_fields`, `legion job info`).
  //
  // The flag is about keys Legion does not know. A value Legion knows is
  // wrong (a bad type, an out-of-range number, an unknown runtime) is still
  // an error. It does not relax blocks that are strict on their own: the
  // network policy blocks (`network.egress`, `network.ingress`, an
  // upstream's `handlers`), value sources (`{ kv = … }`), the runtime's
  // `config`, and the `count`, `gang`, and `schedule` shorthands.
  //
  // A resubmit with the same flag and spec is `unchanged` and keeps the
  // record of the version it matched. A manager that predates this field
  // ignores it and drops every unknown key silently.
  bool allow_unknown_fields = 7;
}

// Reply payload for RunJob.
message RunJobReply {
  // Human-readable outcome message (created/updated/unchanged/rollout state).
  //
  // Current manager reply values include:
  // - `"Job submit success"`
  // - `"Rollout started"`
  // - `"Rollout created; waiting for manual start"`
  // - `"Job config unchanged; no update needed (the job is running; use
  //   --force-reschedule to restart it)"`
  // - `"Job config unchanged; forced reschedule queued"`
  // - `"Job config unchanged; job was stopped, starting it again"`
  // - `"Job config unchanged; job had failed, starting it again"`
  // - `"Job config unchanged; job was not running, starting it again"`
  //
  // An unchanged spec restarts the job (a `job_update` eval) when the job was
  // stopped or failed, or when nothing of it is running or queued to run.
  string message = 1;

  // True when this reply carries a previously recorded result for the request's
  // `idempotency_key` rather than this request's own.
  //
  // Set in two cases:
  // - the recorded result was found *before* this request did any work (the
  //   ordinary retry-after-timeout case); and
  // - two requests carrying the same key raced, both missed that lookup, and
  //   this one lost — the manager records the first outcome only, so the loser
  //   is handed the winner's `message` with `deduplicated = true`. The loser's
  //   own submit is harmless (an identical spec resolves to "unchanged"), so it
  //   is corrected rather than failed.
  //
  // In both cases `message` describes the recorded outcome, not this request's.
  bool deduplicated = 2;

  // Advisory lines, one per warning, without the `warning: ` prefix. The
  // same lines are appended to `message`, each after `warning: `, for
  // clients that print only the message.
  //
  // They start with every unknown key `allow_unknown_fields` kept or
  // dropped, dropped keys first (`task web: dropped unknown field
  // `stop.signall``, `task postgres: volume data: kept `backup` as pending
  // (no installed app declares it)`), then the submit's other warnings: a
  // priority band preemption cannot honor, `resources` a runtime cannot
  // enforce as written, a gated task with no egress, and the like (the lines
  // `PlanJobReply.warnings` carries).
  //
  // A `deduplicated` reply rebuilds this list from the recorded `message`.
  repeated string warnings = 3;
}

// One declared job-template variable.
//
// Declared in the template source's `variables` list and used by clients
// (UI form generation, CLI coercion) and by the manager for validation.
message JobTemplateVariable {
  // Variable key. Must match `[a-zA-Z_][a-zA-Z0-9_]*`. The rendered
  // template receives all declared keys as fields of the single `vars`
  // record its `job` function is applied to.
  string key = 1;

  // Variable type. One of: `string`, `text` (multiline string), `number`,
  // `boolean`, `select` (one of `options`), `multi_select` (list drawn
  // from `options`), `json` (any JSON value, passed through verbatim).
  string type = 2;

  // Human-readable label for forms. Defaults to `key` when empty.
  string label = 3;

  // Optional helper text shown next to the input.
  optional string description = 4;

  // Whether a value must be provided at run time. Defaults to true when
  // the variable has no default, false when it has one. A variable with
  // `required: false` and no default renders as JSON `null`.
  bool required = 5;

  // Default value as JSON text, matching `type` (for example `"draft"`,
  // `24`, `false`, `["a","b"]`). Unset means no default.
  optional string default_json = 6;

  // Allowed values for `select` / `multi_select` types; empty otherwise.
  repeated string options = 7;
}

// Metadata for one stored template version (no source).
message JobTemplateVersionInfo {
  // Version number, 1-indexed and immutable once written.
  uint32 version = 1;

  // RFC3339 creation timestamp.
  string created_at = 2;

  // Principal that created this version (token name, `user:<name>`, or
  // empty when ACLs were disabled).
  string created_by = 3;
}

// One full job template version.
message JobTemplate {
  // Template name: lowercase alphanumerics and dashes, like a job name.
  // The name is the template's identity; there is no separate display name.
  string name = 1;

  // Version number of this document.
  uint32 version = 2;

  // Latest version number that exists for this template.
  uint32 latest_version = 3;

  // Optional user-facing description from the template manifest.
  optional string description = 4;

  // Raw Nickel source of this version.
  string source_nickel = 5;

  // Declared variables from the manifest, in declaration order.
  repeated JobTemplateVariable variables = 6;

  // RFC3339 creation timestamp of this version.
  string created_at = 7;

  // Principal that created this version.
  string created_by = 8;
}

// Latest-version summary row for ListJobTemplates.
message JobTemplateSummary {
  // Template name.
  string name = 1;

  // Latest version number.
  uint32 latest_version = 2;

  // Description from the latest version.
  optional string description = 3;

  // Number of declared variables in the latest version.
  uint32 variable_count = 4;

  // RFC3339 timestamp of the latest version's creation.
  string updated_at = 5;
}

// Provenance of a job config that was produced by RunJobTemplate.
message JobTemplateProvenance {
  // Template name.
  string name = 1;

  // Template version that rendered the config.
  uint32 version = 2;
}

// Request payload for UpsertJobTemplate.
message UpsertJobTemplateRequest {
  // Template name. Creating a name that already exists appends the next
  // version; versions are never overwritten.
  string name = 1;

  // Full Nickel source. Must be self-contained (imports are rejected) and
  // at most 512 KiB. See JobTemplate for the required document shape.
  string source_nickel = 2;
}

// Reply payload for UpsertJobTemplate.
message UpsertJobTemplateReply {
  // The stored version.
  JobTemplate template = 1;
}

// Request payload for ListJobTemplates.
message ListJobTemplatesRequest {
  // Optional case-insensitive substring filter over name and description.
  optional string query = 1;
}

// Reply payload for ListJobTemplates.
message ListJobTemplatesReply {
  // Templates the caller may read, most recently updated first.
  repeated JobTemplateSummary templates = 1;
}

// Request payload for GetJobTemplate.
message GetJobTemplateRequest {
  // Template name (exact match).
  string name = 1;

  // Version to fetch. Omit for the latest.
  optional uint32 version = 2;
}

// Reply payload for GetJobTemplate.
message GetJobTemplateReply {
  // The requested version.
  JobTemplate template = 1;

  // All stored versions of this template, newest first.
  repeated JobTemplateVersionInfo versions = 2;
}

// Request payload for DeleteJobTemplate.
message DeleteJobTemplateRequest {
  // Template name (exact match). Deletes every version.
  string name = 1;
}

// Reply payload for DeleteJobTemplate.
message DeleteJobTemplateReply {
  // Human-readable status message.
  string message = 1;
}

// Request payload for RenderJobTemplate.
message RenderJobTemplateRequest {
  // Template name.
  string name = 1;

  // Version to render. Omit for the latest.
  optional uint32 version = 2;

  // Variable values as a JSON object keyed by variable key, for example
  // `{"scene": "s3://bucket/x", "frames": 48}`. Values are validated
  // against the declared types; strings are leniently coerced (`"48"`
  // satisfies a `number`). At most 64 KiB.
  string variables_json = 3;

  // Namespace to render for (see RunJobTemplateRequest.namespace); scopes
  // the ACL check and the rendered job's id.
  optional string namespace = 4;
}

// Reply payload for RenderJobTemplate.
message RenderJobTemplateReply {
  // The rendered jobspec as JSON text, exactly what RunJobTemplate would
  // submit with the same inputs.
  string rendered_jobspec = 1;

  // Name of the job the rendered spec declares.
  string job_name = 2;
}

// Request payload for RunJobTemplate.
message RunJobTemplateRequest {
  // Template name.
  string name = 1;

  // Version to render. Omit for the latest.
  optional uint32 version = 2;

  // Variable values as a JSON object keyed by variable key (see
  // RenderJobTemplateRequest.variables_json).
  string variables_json = 3;

  // Optional eval priority override (see RunJobRequest.priority).
  optional int64 priority = 4;

  // When true, enqueues a reschedule even when the rendered spec is
  // unchanged. Default: `false`.
  bool force_reschedule = 5;

  // Optional idempotency key (see RunJobRequest.idempotency_key).
  optional string idempotency_key = 6;

  // Namespace the rendered job lands in. Templates are cluster objects
  // (docs/job-templates.md); running one into a namespace is a `job:write`
  // there, scoped by the `templates` selector. Resolved against a
  // `namespace` the template renders exactly as RunJobRequest.namespace is.
  optional string namespace = 7;

  // Accept a rendered spec that carries keys Legion does not know
  // (`legion template run --allow-unknown-fields`). Default `false`: every
  // unknown key fails the run with INVALID_ARGUMENT. When `true`, keys on
  // extension points are kept as pending and the rest are dropped, exactly
  // as RunJobRequest.allow_unknown_fields describes, and each one is listed
  // in `RunJobTemplateReply.warnings` and recorded on the version.
  bool allow_unknown_fields = 8;
}

// Reply payload for RunJobTemplate.
message RunJobTemplateReply {
  // Human-readable outcome message (same vocabulary as RunJobReply).
  string message = 1;

  // True when replayed from a previously recorded idempotent result.
  bool deduplicated = 2;

  // Name of the job that was created or updated.
  string job_name = 3;

  // Job config ID produced (or matched, when unchanged) by this run.
  string job_config_id = 4;

  // Advisory lines, one per warning, without the `warning: ` prefix: the
  // same lines RunJobReply.warnings carries (unknown keys the run kept or
  // dropped under `allow_unknown_fields` among them). Also appended to
  // `message`, each after `warning: `.
  repeated string warnings = 5;
}

// Request payload for GetJobInfo.
message GetJobInfoRequest {
  // Job name (also used as job ID in current manager implementation).
  string name = 1;
}

// Reply payload for GetJobInfo.
message GetJobInfoReply {
  // Job metadata for the requested job.
  //
  // Manager returns NotFound instead of returning this field unset.
  Job job = 1;

  // Template that rendered the job's latest config, when it was submitted
  // via RunJobTemplate. Unset for raw RunJob submissions.
  optional JobTemplateProvenance template = 2;

  // Set when the job's latest version was submitted by the app reconciler:
  // the job belongs to an app (docs/apps.md), and the reconciler reverts
  // any direct edit to it within seconds. Unset for every other job, and
  // for an app's job whose latest version someone else submitted (the edit
  // the reconciler is about to revert).
  optional ManagedByInfo managed_by = 3;

  // What `allow_unknown_fields` kept and dropped when the job's latest
  // config version was submitted. Unset when that submit kept and dropped
  // nothing (every submit without the flag, and one with the flag whose
  // spec had no unknown keys). `legion job info` prints it as
  // `submitted with --allow-unknown-fields: dropped …; … pending`.
  //
  // It describes the submit that created the version. Resubmitting a spec
  // that renders to the same config is `unchanged` and leaves it in place,
  // even when the resubmit no longer carries the dropped keys.
  optional UnknownFieldsRecord unknown_fields = 4;
}

// The app that manages a job (GetJobInfoReply.managed_by).
message ManagedByInfo {
  // The app's name (`legion app status <app>`).
  string app = 1;

  // The digest of the render the reconciler submitted. The reconciler
  // compares it with the digest of a fresh render of the app record; a
  // difference resubmits the job.
  string digest = 2;
}

// One jobspec key Legion did not know, as `allow_unknown_fields` handled it.
message UnknownJobspecField {
  // Where the key's block sits, as error messages name it: `task postgres`,
  // `task postgres: volume data`, `task web: port http`. Empty for a key at
  // the job's top level.
  string scope = 1;

  // The key, dotted from its scope: `backup`, `stop.signall`,
  // `checks[0].everyy`.
  string path = 2;

  // For a kept key, the extension point it sits on: `job`, `task`,
  // `volume`, `port`, or `service`. Empty for a dropped key.
  string point = 3;
}

// The unknown keys one submit kept and dropped under
// `allow_unknown_fields`, recorded on the job config version it created.
message UnknownFieldsRecord {
  // Keys on extension points, kept unvalidated in the block's
  // `pendingExtensions` map. Nothing acts on them; they stay with every
  // version whose spec still carries them.
  repeated UnknownJobspecField pending = 1;

  // Keys elsewhere, dropped: the version does not carry them.
  repeated UnknownJobspecField dropped = 2;
}

// Request payload for ListRollouts.
message ListRolloutsRequest {
  // Optional job ID filter.
  //
  // When omitted (or blank), rollouts for all jobs are returned.
  optional string job_id = 1;

  // When true, only active (non-terminal) rollouts are returned.
  //
  // Default: `false` (returns both active and terminal rollouts).
  bool active_only = 2;

  // Free-text search against rollout ID, job ID, status, and strategy fields.
  optional string query = 3;

  // Sort key. Supported values: `updated_at`, `created_at`, `status`, `job_id`.
  //
  // Default: `updated_at`.
  optional string sort_by = 4;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `desc`.
  optional string sort_order = 5;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 6;

  // Maximum rollouts returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 7;

  // Namespaces to list: names or `*`-globs; `["*"]` for every namespace the
  // caller can read. Empty means `default`. Ignored when `job_id` is set,
  // since a job names its own namespace. Items are still filtered by
  // `job:read`, so `*` widens what is considered, never what is visible.
  repeated string namespaces = 8;
}

// Rollout record.
message Rollout {
  // Unique rollout ID.
  int64 id = 1;

  // Job ID this rollout belongs to.
  string job_id = 2;

  // Previous job config ID being replaced (if any).
  optional string from_job_config_id = 3;

  // Target job config ID for this rollout.
  string to_job_config_id = 4;

  // Rollout status.
  //
  // Common values include: pending, running, waiting_manual_start,
  // waiting_manual_advance, completed, failed, cancelled, completed_incomplete.
  string status = 5;

  // True when rollout finished but did not fully reach desired target.
  bool incomplete = 6;

  // Human-readable rollout status message.
  string message = 7;

  // Strategy plugin name used to resolve rollout behavior.
  optional string strategy = 8;

  // Progression mode (for example: auto/manual) as stored by manager.
  optional string progression = 9;

  // Replacement mode (for example: createFirst/destroyFirst) as stored by manager.
  optional string replacement = 10;

  // Whether rollout prefers in-place replacement behavior.
  optional bool in_place = 11;

  // JSON-encoded rollout envelope/config/runtime state.
  string config_json = 12;

  // RFC3339 creation timestamp.
  string created_at = 13;

  // RFC3339 update timestamp.
  string updated_at = 14;

  // RFC3339 completion timestamp for terminal rollouts.
  optional string completed_at = 15;
}

// Reply payload for ListRollouts.
message ListRolloutsReply {
  // Matching rollout records for the requested page.
  repeated Rollout rollouts = 1;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;
}

// Request payload for GetRollout.
message GetRolloutRequest {
  // Rollout ID.
  int64 id = 1;
}

// Reply payload for GetRollout.
message GetRolloutReply {
  // Rollout when found; unset when not found.
  optional Rollout rollout = 1;
}

// Allocation-level status as seen in a rollout group status response.
message RolloutAllocationStatus {
  // Allocation ID.
  int64 allocation_id = 1;

  // Node hosting this allocation.
  string node_id = 2;

  // Task config ID backing this allocation.
  int64 task_config_id = 3;

  // Task name for display and filtering.
  string task_name = 4;

  // Task group name.
  string task_group = 5;

  // Task lifecycle (for example: service, batch, sidecar).
  string lifecycle = 6;

  // Allocation runtime status string.
  string status = 7;

  // Rollout role for this allocation, typically replacement or replacee.
  string role = 8;

  // Optional derived node health flag at query time.
  optional bool node_healthy = 9;

  // Optional allocation health flag from latest worker snapshot.
  optional bool allocation_healthy = 10;

  // Optional allocation health status text from latest worker snapshot.
  optional string allocation_health = 11;

  // Optional JSON-encoded per-artifact staging states from the latest worker
  // snapshot. Same payload as `AllocationHealth.artifact_states`: an array of
  // `{"name","source","state","bytesFetched","bytesTotal","digest",
  //   "attempts","durationMs","error"}` objects.
  //
  // Unset when the allocation's task declares no artifacts or no snapshot
  // has been received yet.
  optional string artifact_states = 12;
}

// Group-level rollout status.
message RolloutGroupStatus {
  // Group name.
  string group = 1;

  // Current step index (0-based in runtime state, API returns current numeric index).
  uint32 step_index = 2;

  // Total number of computed rollout steps for this group.
  uint32 total_steps = 3;

  // Number of queued manual-advance credits for this group.
  uint32 pending_manual_advances = 4;

  // Allocations participating in this group's rollout.
  repeated RolloutAllocationStatus allocations = 5;
}

// Request payload for GetRolloutStatus.
message GetRolloutStatusRequest {
  // Rollout ID.
  int64 id = 1;
}

// Reply payload for GetRolloutStatus.
message GetRolloutStatusReply {
  // Rollout record when found.
  optional Rollout rollout = 1;

  // Per-group runtime status.
  repeated RolloutGroupStatus groups = 2;
}

// Rollout event record.
message RolloutEvent {
  // Event ID.
  int64 id = 1;

  // Rollout ID this event belongs to.
  int64 rollout_id = 2;

  // Job ID this event belongs to.
  string job_id = 3;

  // Optional task group this event is scoped to.
  optional string group_name = 4;

  // Event severity level (for example: info, warn, error).
  string level = 5;

  // Human-readable event message.
  string message = 6;

  // JSON metadata payload as string.
  string metadata_json = 7;

  // RFC3339 creation timestamp.
  string created_at = 8;
}

// Request payload for ListRolloutEvents.
message ListRolloutEventsRequest {
  // Rollout ID.
  //
  // Must be greater than 0.
  int64 rollout_id = 1;

  // Optional maximum number of events to return.
  //
  // Default when omitted: `500`.
  // Manager bounds: clamped to `[1, 2000]`.
  optional uint32 limit = 2;
}

// Reply payload for ListRolloutEvents.
message ListRolloutEventsReply {
  // Ordered rollout events (oldest to newest within the returned window).
  repeated RolloutEvent events = 1;
}

// Request payload for AdvanceRollout.
message AdvanceRolloutRequest {
  // Rollout ID.
  int64 id = 1;

  // Group names to advance.
  //
  // Empty (default) means advance all groups in the rollout.
  repeated string groups = 2;

  // Optional eval priority for generated rollout tick work.
  //
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 3;
}

// Reply payload for AdvanceRollout.
message AdvanceRolloutReply {
  // Human-readable queue/advance message.
  //
  // Current manager reply value: `"Rollout advance queued"`.
  string message = 1;

  // Updated rollout record after queuing manual advance.
  optional Rollout rollout = 2;
}

// Request payload for StopRollout.
message StopRolloutRequest {
  // Rollout ID to stop.
  int64 id = 1;

  // When true, remove allocations for the rollout target config and re-schedule from
  // the rollout source config (when present).
  bool revert = 2;

  // Optional eval priority for any rollback scheduling.
  //
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 3;
}

// Reply payload for StopRollout.
message StopRolloutReply {
  // Human-readable stop/revert message.
  string message = 1;

  // Updated rollout record after stop processing.
  optional Rollout rollout = 2;
}

// Request payload for GetJobSpec.
message GetJobSpecRequest {
  // Job name.
  string name = 1;
}

// Request payload for GetJobSpecByConfig.
message GetJobSpecByConfigRequest {
  // Job config ID.
  string config_id = 1;
}

// Reply payload for GetJobSpec.
message GetJobSpecReply {
  // Source submissions associated with the job config, exactly as the
  // submitter sent them (usually Nickel source, not JSON). Read these to show
  // what was typed; read `rendered_jobspec` to learn what the job is.
  // Ordered primary first (`is_primary`), then in the order they were
  // submitted, so the first entry is the file the submitter named.
  repeated Submission submissions = 2;

  // The job config the manager stored, as a JSON object: `name`, `priority`,
  // `version`, `rollout`/`rollout_by_group` when set, and `tasks` — each
  // task in the same camelCase shape `RunJobRequest.parsed_jobspec` accepts
  // (`group`, `runtime`, `lifecycle`, `count`, `dependsOn`, `config`,
  // `resources`, `checks`, `network`, `service`, `stateful`, ...).
  //
  // This is the authoritative structure of the job whatever language it was
  // written in, with scale overrides NOT applied (`count` is the spec's).
  // Empty string only when the config could not be loaded, which the
  // manager reports as an error instead.
  string rendered_jobspec = 3;
}

// One job spec history entry.
message JobSpecHistoryItem {
  // Job config ID.
  string config_id = 1;

  // RFC3339 timestamp when config was created.
  string created_at = 2;

  // Monotonic config version.
  optional int64 version = 3;

  // Template that rendered this config, when it was submitted via
  // RunJobTemplate. Unset for raw RunJob submissions.
  optional JobTemplateProvenance template = 4;
}

// Request payload for ListJobSpecHistory.
message ListJobSpecHistoryRequest {
  // Job name.
  string name = 1;
}

// Reply payload for ListJobSpecHistory.
message ListJobSpecHistoryReply {
  // History in newest-first order.
  repeated JobSpecHistoryItem items = 1;
}

// Request payload for PlanJob.
message PlanJobRequest {
  // Fully rendered jobspec JSON to plan.
  string parsed_jobspec = 1;

  // Namespace to plan into; resolved against the jobspec's own `namespace`
  // exactly as RunJobRequest.namespace is.
  optional string namespace = 2;

  // Plan a jobspec that carries keys Legion does not know
  // (`legion job plan --allow-unknown-fields`), as a submit with
  // RunJobRequest.allow_unknown_fields would take it: keys on extension
  // points kept as pending, the rest dropped, each listed in
  // `PlanJobReply.warnings`. Default `false`: every unknown key fails the
  // plan with INVALID_ARGUMENT, as it would fail the submit. Nothing is
  // recorded; a plan stores nothing.
  bool allow_unknown_fields = 3;
}

// Reply payload for PlanJob.
message PlanJobReply {
  // Planned allocations for display.
  repeated PlannedAllocation allocations = 1;

  // Human-readable planning summary.
  string message = 2;

  // True when a job with the same name already exists.
  bool matches_existing = 3;

  // True when existing config is content-identical to planned config.
  bool same_content = 4;

  // Per-task scheduling-index usage for this plan: which declared index (if
  // any) generated each task's placement candidates, and why not when none
  // did. One entry per task the plan considered. See
  // docs/scheduling-indexes.md for the model.
  repeated TaskIndexUsage index_usage = 5;

  // Allocations this plan would displace to make room for `allocations`.
  //
  // Empty when the plan places without preemption, which is the common case:
  // the preemption pass only runs for a task that could not otherwise be
  // placed. Populated in `enforce` mode (what a submit would evict) and in
  // `observe` mode (what enforce mode *would* evict, given that observe
  // commits nothing) — so the preview answers the same question either way.
  //
  // A victim younger than `preemption.victimExemptAge` is listed with a
  // non-zero `eligible_in_seconds` when the guard alone keeps the placement
  // from fitting: the submit waits that long, then evicts it.
  //
  // This is a plan against a snapshot, not a reservation. The real submit
  // re-plans, so the victims it takes may differ if the cluster moved in
  // between. See docs/preemption-and-eviction.md.
  repeated PlannedPreemption preemptions = 6;

  // The cluster's preemption mode at plan time: `enforce`, `observe` or
  // `off`. Present so a client can explain an empty `preemptions` list —
  // "nothing needed displacing" and "preemption is off" look identical
  // otherwise, which is exactly the discoverability failure this field
  // exists to prevent.
  string preemption_mode = 7;

  // Valid settings that will not do what the author most likely expects,
  // one human-readable line each (the same lines `RunJob` returns). Today: a
  // task that would run gated (a `container` on a Linux node by default, or
  // any task with `network.mode = "gated"`) with no `network.egress` and no
  // stored policy object covering it, whose outbound connections would all
  // be refused with `gated-default`. Each line ends with a `hint:` naming the
  // fix. Empty when there is nothing to say.
  //
  // Under `allow_unknown_fields`, the list starts with one line per unknown
  // key the submit would drop (`task web: dropped unknown field
  // `stop.signall``) or keep as pending (`task postgres: volume data: kept
  // `backup` as pending (no installed app declares it)`).
  repeated string warnings = 8;

  // One report per task that sets `gang` (docs/gang-scheduling.md), in task
  // order: whether its quorum would place right now, and if not, how far it
  // got and why the first missing replica did not fit.
  //
  // A gang that would not reach its quorum is not an error. The reply then
  // succeeds with `allocations` empty (a gang short of its quorum places
  // nothing, and neither does the rest of its job), the report's
  // `would_place` false, and `message` saying the job would wait: a submit
  // would block its eval until the whole quorum fits. A dry run of a job
  // without `gang` still fails when a replica does not fit, as before.
  //
  // Like the rest of the reply, this is a plan against a snapshot, not a
  // reservation.
  repeated GangReport gang_reports = 9;

  // One entry per task with `autoscale`, in task order: its effective
  // policy as the cluster's current defaults resolve it, so nothing about
  // `autoscale = true` is hidden (docs/autoscaling.md).
  repeated AutoscalePlan autoscale = 10;
}

// The effective autoscaling policy of one task in a plan.
message AutoscalePlan {
  // `job/group/task`.
  string target = 1;

  // The effective record (JSON), with bounds as written (`"4x"`) and every
  // default filled.
  string effective_json = 2;

  // The human summary, one line each:
  // `hold cpu at 70% of 500MHz per replica, 1m average over ready replicas`,
  // `bounds 2..8 (min = count, max = 4 x count)`, `up: ...`, `down: ...`.
  repeated string summary = 3;

  // Every field with the level it came from.
  repeated ScalingProvenanceRow provenance = 4;

  // The effective policy's digest.
  string digest = 5;
}

// How one gang task fared in one plan (docs/gang-scheduling.md). The same
// shape is `PlanJobReply.gang_reports` for a dry run and `JobBlocked.gang`
// for a gang that is waiting, so a client reads one set of fields either way.
message GangReport {
  // The gang task's name.
  string task = 1;

  // The task's desired replica count in this plan: its `count`, after a
  // `job scale` override or a rollout's target.
  uint32 desired = 2;

  // The quorum: how many replicas must run together. `gang.min` when set,
  // else `desired`; never above `desired`.
  uint32 min = 3;

  // Replicas of the task already running. 0 for a fresh placement (a submit,
  // a restart, a dry run); non-zero when the plan tops up a running gang that
  // lost members.
  uint32 running = 4;

  // Replicas the plan could place before the first one that did not fit.
  // Replicas place one at a time, best node first, so this is how many fit in
  // the order the scheduler would place them.
  uint32 placeable = 5;

  // True when `running + placeable` reaches `min`: the plan places the
  // quorum (and any further replicas that fit). False when it does not: the
  // plan places nothing at all, and the job waits.
  bool would_place = 6;

  // Schedulable nodes whose constraints, permit, and volume drivers accept
  // the task, whether or not they have room. 0 points at the jobspec (a
  // constraint no node satisfies) rather than at capacity.
  uint32 eligible_nodes = 7;

  // Schedulable nodes the plan considered.
  uint32 nodes = 8;

  // Why the first replica that did not fit did not, in the scheduler's words
  // (capacity, a static port, disk, a pinned node, preemption's diagnosis).
  // Empty when every replica fit.
  string reason = 9;

  // The gang's `placementTimeout` in seconds: how long it may wait, short of
  // its quorum, before its job is failed. 0 when it waits indefinitely (the
  // default).
  uint64 placement_timeout_seconds = 10;

  // `JobBlocked.gang` only: when this wait began, as Unix seconds — the first
  // time the gang blocked short of its quorum, kept across every later
  // re-plan that blocked again. A successful plan, a stop, or a restart ends
  // the wait. 0 in a dry run.
  int64 waiting_since = 11;

  // `JobBlocked.gang` only: when the wait times out (`waiting_since` plus
  // `placement_timeout_seconds`), as Unix seconds. If the gang is still short
  // then, its job is failed and every allocation of it stops. 0 when the gang
  // has no placement timeout, and in a dry run.
  int64 deadline = 12;
}

// One allocation a plan would displace.
message PlannedPreemption {
  // Node the victim runs on, which is also the node the preemptor would be
  // placed on: preemption only ever frees the node it places onto.
  string node_id = 1;

  // Victim's job name.
  string job_id = 2;

  // Victim's task name.
  string task_name = 3;

  // Victim's priority band. Always strictly below the preempting job's.
  string band = 4;

  // Victim's allocation ID.
  int64 allocation_id = 5;

  // The victim's `stop.killAfter` in seconds — how long it gets between the
  // stop signal and SIGKILL (docs/graceful-stop.md).
  uint64 kill_after_seconds = 6;

  // Seconds until the victim ages past `preemption.victimExemptAge` and may
  // be evicted. 0 for a victim a submit would evict right away.
  //
  // Non-zero only when the guard is the one thing between the placement and
  // room: every victim the placement needs is younger than the guard. The
  // plan then still shows the placement and these victims, because that is
  // what the submit converges to. The submit itself waits: its eval retries
  // once the youngest victim is old enough (`eval.blocked` names the wait),
  // and evicts then. Before this field, the plan failed with "no available
  // nodes" in that window while the submit went on to preempt.
  uint64 eligible_in_seconds = 7;
}

// How candidate construction went for one planned task — the scheduling
// index's explain record. The scan (a full pass over every available node)
// remains the authoritative fallback; these fields describe whether and how
// an index short-circuited it.
message TaskIndexUsage {
  // Task the entry describes.
  string task_name = 1;

  // Name of the index that served candidates (e.g. the built-in "fit"), or
  // empty when the plain scan ran.
  string index = 2;

  // "on" when the index generated the candidates, "shadow" when it ran
  // alongside the authoritative scan for comparison. Empty when no index
  // participated.
  string mode = 3;

  // Number of candidate nodes handed to placement scoring.
  uint32 candidates = 4;

  // True when the candidate list was cut to the per-task budget, keeping the
  // index's nearest-fit-first order.
  bool truncated = 5;

  // Times placement exhausted a truncated candidate list and widened back to
  // the full scan mid-task.
  uint32 refills = 6;

  // True when the scan ended up serving after the index came up short
  // (empty coverage, or a truncated list that ran dry).
  bool fell_back = 7;

  // Shadow mode only: whether the index's candidate set matched the scan's
  // exactly. Absent outside shadow mode.
  optional bool shadow_agreement = 8;

  // Why no index served when one might have been expected to — e.g.
  // "no usable index: gpu needs [region]". Empty otherwise.
  string reason = 9;

  // When bounded candidate scoring engaged for any of this task's
  // placements (the fleet-size threshold in the manager's
  // `schedulerSettings.score_sample` was met), the number of eligible
  // nodes actually scored per placement: the placement is the best of
  // this many uniformly drawn feasible candidates rather than of every
  // feasible node. 0 means every placement was scored exactly.
  // Feasibility (constraints, permits, resources) is never sampled — a
  // sampled placement is always a valid one.
  uint32 score_sampled = 10;
}

// Planned allocation display item.
message PlannedAllocation {
  // Target node ID.
  string node_id = 1;

  // Task config ID in the planned context.
  int64 task_config_id = 2;

  // Task name for readability.
  string task_name = 3;

  // Ranked candidate node IDs for this placement, best first; the first
  // entry is always node_id. At apply time the store binds the placement to
  // the first candidate whose node epoch is unchanged since planning, so
  // under contention the allocation may land on a lower-ranked
  // (near-equivalent by score) candidate instead of node_id. A single entry
  // means no fallback: the placement applies to node_id or the plan is
  // rejected and retried. Empty only when the manager predates candidate
  // lists. Controlled by schedulerSettings.plan_candidates; see
  // docs/late-binding-plan-apply.md.
  repeated string candidate_nodes = 4;
}

// Request payload for StopJob.
message StopJobRequest {
  // Job name.
  string name = 1;

  // Optional eval priority override.
  //
  // Default when omitted: manager `default_priority`
  // (`50` in built-in config defaults).
  optional int64 priority = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 3;
}

// Reply payload for StopJob.
message StopJobReply {
  // Human-readable status message.
  //
  // Current manager reply format: `"Stopped <job-name>"`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for ScaleTask (docs/autoscaling.md).
message ScaleTaskRequest {
  // Job name.
  string name = 1;

  // Task group, when the job has more than one scalable task. Optional:
  // a job with exactly one scalable task needs neither selector; an
  // ambiguous request is rejected with the candidate list.
  optional string task_group = 2;

  // Task name, same rules as `task_group`.
  optional string task_name = 3;

  // The desired count. Required unless `reset` is set. Keyed stateful
  // tasks (no count) and `count: { per: ... }` tasks are rejected.
  optional uint32 count = 4;

  // Drop the override (and any pending scale-in) and return ownership of
  // the count to the job spec. Mutually exclusive with `count`.
  bool reset = 5;

  // Free-text audit note recorded on the override and in the
  // `scale.applied` event.
  optional string reason = 6;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 7;

  // Compare-and-set: apply only when the task's override row is at exactly
  // this version, else fail with FAILED_PRECONDITION
  // (`version conflict: ...`) and change nothing. 0 means "no override row
  // exists". Read the current version from `ScalingInputs.override_version`
  // or `TaskScaleStatus.version`. A version is a cluster-wide counter
  // stamped on every write of the row, so it never repeats, even after the
  // row is deleted and recreated. Unset: no check (a person's write).
  optional uint64 expected_version = 8;

  // Why the count changed, as the autoscaler decided it: recorded in the
  // task's scale history with the write. Optional for people.
  ScaleDecision decision = 9;

  // Who is writing: `operator` (the default, also for an empty string),
  // `autoscaler`, or `wake`. `autoscaler` and `wake` are honored only from
  // the bundled autoscaler's own identity (or a management token); from
  // any other caller the write is treated as `operator`. An `autoscaler`
  // write is refused while the task is paused or pinned to a count, and
  // must stay within a pinned floor or ceiling.
  string source = 10;

  // Pin: hold the result for this many seconds. With `count` it pins the
  // count; with `min` and/or `max` it pins a floor and/or ceiling the
  // autoscaler stays within. Required for a person's count on an
  // autoscaled task; refused on a task without `autoscale`.
  optional uint64 pin_for_seconds = 11;

  // A pinned floor (with `pin_for_seconds`). The count is raised to it at
  // once when below.
  optional uint32 min = 12;

  // A pinned ceiling (with `pin_for_seconds`). The count is lowered to it at
  // once when above.
  optional uint32 max = 13;

  // End the task's pin now and leave the count where it is: the autoscaler
  // takes over again at its normal rate. Mutually exclusive with `count`,
  // `reset`, `min`, and `max`.
  bool release = 14;
}

// Why a count changed (ScaleTask, RecordScalingAction), as the autoscaler
// recorded it. Stored with the task's scale history row.
message ScaleDecision {
  // An id for the decision, unique per target (`d-` and hex), named in
  // events and `legion scaling explain`.
  string id = 1;

  // The one-line why: `cpu 0.91 vs 0.70 (4 ready); rate-limited from 7`.
  string summary = 2;

  // The digest of the effective policy that decided (hex SHA-256 of
  // `policy_json`). The manager keeps that policy once per digest, so a
  // history row's digest always resolves to the exact policy, even after
  // the defaults that shaped it change.
  string policy_digest = 3;

  // The effective policy as canonical JSON. Must hash to `policy_digest`,
  // else the write is refused.
  string policy_json = 4;

  // The full decision as the engine made it (JSON): each check's reading
  // and recommendation, and every pipeline stage's before, after, and note.
  string detail_json = 5;

  // When the decision was made, unix milliseconds.
  int64 evaluated_at_unix_ms = 6;
}

// Reply payload for ScaleTask.
message ScaleTaskReply {
  // Human-readable outcome, e.g.
  // `"web/default/web: 4 -> 6 (spec count 2; override active)"`, the
  // deferral notice
  // `"deferred: rollout web-7 is in progress; scale-in to 2 applies when it completes"`,
  // or for a pin
  // `"web/default/web: 6 -> 12; autoscaling pinned until 05:10 UTC (legion job scale web --release)"`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;

  // True when the request was a scale-in during an active rollout and was
  // recorded as pending rather than applied (see ScaleTask's RPC comment).
  bool deferred = 3;

  // The override row's version after this write (the next write's
  // `expected_version`). 0 when the row was removed (`reset`) or the reply
  // is a replay.
  uint64 version = 4;

  // When the pin set by this write expires, unix milliseconds. Unset when
  // the write set no pin.
  optional int64 pinned_until_unix_ms = 5;
}

// Request payload for GetJobScaleStatus.
message GetJobScaleStatusRequest {
  // Job name.
  string name = 1;
}

// One task's scale state (GetJobScaleStatus).
message TaskScaleStatus {
  // Task group name.
  string task_group = 1;

  // Task name.
  string task_name = 2;

  // The spec's `count.num` in the latest job config version.
  uint32 spec_count = 3;

  // The applied override count, when one exists and binds to the current
  // spec. An override binds only to the spec count it was laid over; a row
  // laid over a different spec count is not reported here and does not move
  // `effective_count`.
  optional uint32 override_count = 4;

  // A recorded scale-in waiting for the active rollout to finish, when
  // one exists.
  optional uint32 pending_count = 5;

  // The count the scheduler currently converges to: the binding override
  // if there is one, else `spec_count`. Read through the same accessor the
  // scheduler, rollouts, and quota use, so this always agrees with what
  // placement does.
  uint32 effective_count = 6;

  // Who set the override: `operator`, `autoscaler`, or `wake`.
  string source = 7;

  // The audit note recorded with the override, if any.
  string reason = 8;

  // RFC 3339 timestamp of the last override write; empty when no
  // override exists.
  string updated_at = 9;

  // Whether the task has `autoscale` in its latest spec: the autoscaler owns
  // its count, and a person's count is a pin.
  bool autoscaled = 10;

  // For an autoscaled task, its effective policy in one line
  // (`2..8, cpu 70%, enforce`), or `invalid: <why>` when it does not
  // resolve. Empty otherwise.
  string policy_summary = 11;

  // The active pin, if any.
  ScalePin pin = 12;

  // The pause that covers this task, if any (its own, its job's, or the
  // cluster-wide one).
  ScalingPauseInfo pause = 13;

  // When the autoscaler last evaluated the task, unix milliseconds; 0 when
  // it has not (since the status-lane leader started).
  int64 last_evaluation_unix_ms = 14;

  // The autoscaler's last word on the task (see `ScalingTargetStatus.state`);
  // empty for a task without `autoscale`.
  string state = 15;

  // The override row's version (`ScaleTaskRequest.expected_version`); 0
  // when no row exists.
  uint64 version = 16;
}

// A time-boxed pin on an autoscaled task (`legion job scale --for`).
// `min == max` pins the count.
message ScalePin {
  // When the pin ends, unix milliseconds.
  int64 until_unix_ms = 1;

  // The pinned floor, if any.
  optional uint32 min = 2;

  // The pinned ceiling, if any.
  optional uint32 max = 3;

  // Who pinned (the token's principal).
  string by = 4;

  // The reason given.
  string reason = 5;
}

// A pause covering a target (`legion scaling pause`).
message ScalingPauseInfo {
  // What the pause covers: `all` (cluster-wide), `job`, or `task`.
  string scope = 1;

  // When the pause ends, unix milliseconds; unset holds until
  // `legion scaling resume`.
  optional int64 until_unix_ms = 2;

  // Who paused.
  string by = 3;

  // The reason given.
  string reason = 4;

  // When the pause was set, unix milliseconds.
  int64 since_unix_ms = 5;
}

// Reply payload for GetJobScaleStatus.
message GetJobScaleStatusReply {
  // One entry per task in the job's latest config, spec-order.
  repeated TaskScaleStatus tasks = 1;
}

// Request payload for GetScalingInputs (docs/autoscaling.md, "Scaling
// inputs").
message GetScalingInputsRequest {
  // The tasks to read. Each selector names a job and optionally narrows it
  // to one task group and/or task name; a selector that names neither reads
  // every task of the job. At most 1000 selectors.
  //
  // When empty, every job in `namespaces` is read instead.
  repeated ScalingTargetSelector targets = 1;

  // Used only when `targets` is empty: namespaces to list, as names or
  // `*`-globs (`["*"]` for every namespace). Empty means `default`. Jobs the
  // caller lacks `scale:read` on are left out, so `*` widens what is
  // considered, never what is visible.
  repeated string namespaces = 2;

  // Also return this many seconds of each target's history, as the
  // 10-second points the answering manager keeps in memory
  // (`ScalingInputs.history`, oldest first). 0, the default, returns none.
  // Values above 3600 (the hour the manager keeps) are clamped to 3600.
  uint32 history_seconds = 3;
}

// One job, or one task of it, to read scaling inputs for.
message ScalingTargetSelector {
  // Job id (`namespace/name`, or the bare name for a job in `default`).
  // Required.
  string job = 1;

  // Narrow to tasks in this group. Unset or empty matches every group.
  optional string task_group = 2;

  // Narrow to the task with this name. Unset or empty matches every task.
  optional string task_name = 3;
}

// Reply payload for GetScalingInputs.
message GetScalingInputsReply {
  // One entry per task the request resolved to, in request order (spec
  // order within a job). A selector that names no existing job or task
  // yields one entry with `error` set rather than failing the batch.
  repeated ScalingInputs inputs = 1;

  // The manager that answered: its raft node id, or `local` for a
  // single-manager cluster. It is the status-lane leader, wherever the
  // request was sent.
  string served_by = 2;

  // Seconds since the answering manager took the status lane (or started,
  // for a single manager). The merged usage is younger than this: a recent
  // takeover means a recent, possibly partial, resync.
  uint64 leader_for_seconds = 3;
}

// Request payload for GetCapacityDemand.
message GetCapacityDemandRequest {
  // The node-group templates to size, each answered on its own. At least
  // one, at most 64, with distinct names.
  repeated NodeGroupTemplate templates = 1;
}

// One node group's template: what a new member would look like.
//
// The synthetic node is built in this order, each step overriding the last:
// 1. `like_node` (a copy of that member: its pool, attributes, fingerprint
//    and capacity), or else what a node of `worker_type` registers as: the
//    type's pool, `namespaces`, attributes, custom `resources`,
//    `reservedResources`, `maxAllocations` and oversubscription;
// 2. `pool`, when set;
// 3. `shape`: `cpu`, `memory` and `cores` become the node's capacity (with
//    no member to copy, the shape is the whole machine; on a copy it can
//    only lower it), and its attributes and resources are added;
// 4. `legion.nodegroup = <name>`, which every member of a node group
//    carries (its join token stamps it), so constraints on it are honored.
message NodeGroupTemplate {
  // The node group's name: echoed in the reply, and the value of the
  // template node's `legion.nodegroup` attribute. Required.
  string name = 1;

  // The worker type members join as. Default: `default`. A type that does
  // not exist contributes nothing (the shape alone describes the node).
  string worker_type = 2;

  // The pool members join. Default: the worker type's pool, else
  // `default`.
  optional string pool = 3;

  // A member's size and attributes. Optional when `like_node` is set.
  NodeGroupShape shape = 4;

  // An existing node to copy: its observed capacity and attributes are a
  // better template than a declared shape once one member has joined.
  optional string like_node = 5;

  // Members already asked for that have not joined yet. They absorb pending
  // work before any template is sized, so a group that was just asked to
  // grow is not asked again for the same replicas. Default: 0.
  uint32 upcoming = 6;
}

// A member's size and attributes, as `GetCapacityDemand` builds its node.
message NodeGroupShape {
  // CPU in MHz (all cores together), the unit task `cpu` reservations use.
  // Unset: unbounded.
  optional uint64 cpu = 1;

  // Memory in MiB. Unset: unbounded.
  optional uint64 memory = 2;

  // Whole cores, for tasks that reserve `cores`. Unset: unbounded.
  optional uint32 cores = 3;

  // Node attributes every member has (`arch = "amd64"`), seen by
  // constraints and `distinct`. `legion.nodegroup` is set from the
  // template's name and may not be given here.
  map<string, string> attributes = 4;

  // Custom resources a member offers, as a JSON object in a worker type's
  // `resources` form: `{"gpu": 2}` or `{"gpu": ["g0", "g1"]}`. Default:
  // empty.
  string resources_json = 5;

  // The most allocations one member takes. Unset: the worker type's, else
  // unbounded.
  optional uint32 max_allocations = 6;
}

// Reply payload for GetCapacityDemand.
message GetCapacityDemandReply {
  // One entry per template, in request order.
  repeated NodeGroupDemand groups = 1;

  // The pending work considered, one entry per job task group that is short
  // (a task group's tasks place together, so they are one unit). Ordered by
  // job, then group. `NodeGroupDemand.refusals` and `unfittable` point here
  // by index.
  repeated PendingCapacity pending = 2;

  // Pending replicas no single template can host, with every template's
  // failing rule.
  repeated UnfittableCapacity unfittable = 3;

  // Jobs short of their count whose eval is still pending or in flight:
  // the scheduler has not tried the capacity that exists, so they are not
  // demand yet. Names of jobs the caller cannot read are left out (see
  // `awaiting_scheduler_redacted`).
  repeated string awaiting_scheduler = 4;

  // How many `awaiting_scheduler` jobs were left out because the caller
  // lacks `job:read` on them.
  uint32 awaiting_scheduler_redacted = 5;

  // Set when the pending work was larger than one call simulates (20,000
  // replicas): the rest is listed in `pending` but was not packed, so node
  // counts are a floor.
  bool truncated = 6;

  // RFC3339 time the answer was computed.
  string computed_at = 7;
}

// One template's answer.
message NodeGroupDemand {
  // The node group's name, from the request.
  string name = 1;

  // New nodes of this template the pending work it can host needs: the
  // `nodegroup.pending` input. 0 when it can host none of it (see
  // `refusals`) or the upcoming nodes already absorb it.
  uint32 nodes = 2;

  // Pending replicas those nodes would host.
  uint32 replicas = 3;

  // Pending replicas this template's upcoming nodes absorbed (they are not
  // in `replicas`).
  uint32 absorbed = 4;

  // CPU the hosted replicas reserve, MHz.
  double cpu_requested_mhz = 5;

  // Memory the hosted replicas reserve, MiB.
  double memory_requested_mib = 6;

  // CPU the `nodes` new nodes offer, MHz. 0 when the template does not
  // bound CPU.
  double cpu_capacity_mhz = 7;

  // Memory the `nodes` new nodes offer, MiB. 0 when the template does not
  // bound memory.
  double memory_capacity_mib = 8;

  // Pending work this template cannot host, and why.
  repeated CapacityRefusal refusals = 9;

  // The pool of the synthetic node the template was sized as, for checking
  // what the manager understood.
  string node_pool = 10;

  // The synthetic node's config attributes, as a JSON object.
  string node_attributes_json = 11;
}

// Why a template cannot host some pending replicas.
message CapacityRefusal {
  // Index into `GetCapacityDemandReply.pending`.
  uint32 pending_index = 1;

  // Replicas refused.
  uint32 replicas = 2;

  // The failing rule: `permit` (pool or restrictions), `namespace` (the
  // node's `namespaces`), `constraint`, `volume-driver`, `resources` (one
  // replica is larger than an empty node), `distinct` (no value left for
  // more replicas), `static-port` (members of one group claim the same
  // port), `gang` (the quorum cannot place together), or `invalid` (the
  // task does not parse).
  string rule = 3;

  // What failed, in words: `one replica needs memory 16384 > 8192 per
  // node`.
  string detail = 4;
}

// One unit of pending work: a job's task group short of its count.
message PendingCapacity {
  // Canonical job id. Empty when `redacted`.
  string job_id = 1;

  // The job's namespace.
  string namespace = 2;

  // The task group. Empty when `redacted`.
  string task_group = 3;

  // The group's short tasks. Empty when `redacted`.
  repeated string tasks = 4;

  // The count the group should have.
  uint32 desired = 5;

  // Allocations it has, across config versions.
  uint32 placed = 6;

  // Replicas waiting (`desired - placed`).
  uint32 pending = 7;

  // For a gang: its quorum, which places together.
  optional uint32 gang_quorum = 8;

  // What one replica reserves (every short task of the group together), as
  // a JSON object of normalized resources (`{"cpu": 500, "memory": 256}`).
  string resources_json = 9;

  // Replicas the upcoming nodes absorbed.
  uint32 absorbed = 10;

  // Set when the caller lacks `job:read` on the job: the names are left
  // out, the counts and rules are kept.
  bool redacted = 11;
}

// Pending replicas no single template can host.
message UnfittableCapacity {
  // Index into `GetCapacityDemandReply.pending`.
  uint32 pending_index = 1;

  // Replicas no template can host (pending minus the most any one
  // template hosts).
  uint32 replicas = 2;

  // Each template's failing rule for them.
  repeated TemplateRefusal reasons = 3;
}

// One template's reason, in `UnfittableCapacity`.
message TemplateRefusal {
  // The template.
  string template = 1;

  // The rule (see `CapacityRefusal.rule`).
  string rule = 2;

  // What failed.
  string detail = 3;
}

// The scaling inputs of one task (`job_id`, `task_group`, `task_name`).
//
// Replica counts and the desired count are read from the replicated state
// store when the request is answered. Measured CPU, memory, and requests are
// the newest rollups the answering manager holds, at most one 10-second
// rollup interval behind the worker samples they come from; see
// `freshness`.
message ScalingInputs {
  // Canonical job id.
  string job_id = 1;

  // Task group.
  string task_group = 2;

  // Task name.
  string task_name = 3;

  // Set when the selector resolved to nothing: `job not found`, or `no task
  // matches group=<g> task=<t>`. Every other field is then empty, and the
  // job and selector fields above echo the request.
  string error = 4;

  // The count the scheduler converges to (`Store::effective_task_count`:
  // the binding count override, else the spec's `count`). 0 for a stopped
  // or failed job. For a task without a scalable count (`count_scalable`
  // false), the number of placed replicas.
  uint32 desired_replicas = 5;

  // Whether the task has a count `legion job scale` can change: false for
  // keyed stateful tasks (no count) and `count.per` tasks.
  bool count_scalable = 6;

  // Allocations of this task the scheduler has placed, across every version
  // of the job (a rollout runs old and new replicas side by side).
  uint32 placed_replicas = 7;

  // Placed replicas whose latest health report says healthy.
  uint32 ready_replicas = 8;

  // `desired_replicas - placed_replicas`, floored at 0: replicas the
  // scheduler has not placed, usually for lack of room. Always 0 for tasks
  // without a scalable count and for batch and cron tasks, whose
  // allocations end by design.
  uint32 unplaced_replicas = 9;

  // Whether a rollout of this job is in flight. Scale-in is deferred during
  // one (docs/autoscaling.md), and new replicas are still warming.
  bool rollout_active = 10;

  // One replica's reservation in the job's latest spec, after
  // `taskResourceDefaults`.
  ScalingReservation reservation = 11;

  // Measured CPU, summed over the replicas that reported.
  ScalingCpuInputs cpu = 12;

  // Measured memory, summed over the replicas that reported.
  ScalingMemoryInputs memory = 13;

  // Requests into the service this task backs (its `service` block), from
  // the service graph. Unset when the task backs no service.
  //
  // Recorded on the CALLING side, so only internal callers are counted:
  // traffic from outside Legion into an advertised port is not seen, and
  // neither is traffic that bypasses the datapath in `host` mode
  // (docs/network-handlers.md, "Service graph"). A service backed by several
  // tasks reports the service's totals on each of them.
  optional ScalingRequestInputs requests = 14;

  // How current the measured inputs are.
  ScalingDataFreshness freshness = 15;

  // Up to `history_seconds` of 10-second totals, oldest first. Empty unless
  // the request asked for history. The answering manager keeps one hour in
  // memory for at most 4096 tasks; a manager that recently took the status
  // lane holds only what it has seen since.
  repeated ScalingInputsPoint history = 16;

  // The task's override row version, for a compare-and-set ScaleTask
  // (`ScaleTaskRequest.expected_version`); 0 when no row exists.
  uint64 override_version = 17;

  // The task's active pin, if any.
  ScalePin pin = 18;

  // The pause that covers the task, if any.
  ScalingPauseInfo pause = 19;
}

// One replica's reservation (GetScalingInputs).
message ScalingReservation {
  // CPU in MHz. 0 when the task reserves whole cores (`cores`) instead.
  double cpu_mhz = 1;

  // Whole cores. 0 when the task reserves MHz. Utilization treats `cores =
  // N` as N x 1000 millicores, and converts to MHz with each node's clock.
  double cores = 2;

  // Memory in MiB.
  double memory_mib = 3;
}

// Measured CPU of one task (GetScalingInputs), summed over its replicas'
// latest samples.
message ScalingCpuInputs {
  // Replicas with a current usage sample. Only governed runtimes (exec,
  // container, sandbox) on workers with `resourceEnforcement` on report
  // usage; others count in `placed_replicas` but never here.
  uint32 measured_replicas = 1;

  // Measured CPU in millicores (1000 = one core busy), as the workers sample
  // it.
  uint64 used_millicores = 2;

  // Measured CPU in MHz: each replica's millicores times its node's
  // `mhz_per_core`, the arithmetic GetNodeUsage uses. Replicas on nodes that
  // report no clock speed contribute 0.
  double used_mhz = 3;

  // The measured replicas' reservations in MHz (a `cores = N` reservation is
  // N x the node's `mhz_per_core`).
  double reserved_mhz = 4;

  // Mean utilization against the reservation, over the replicas where it can
  // be computed: sum of used millicores / sum of reserved millicores. 0.7
  // means 70% of the reservation. 0 when no replica is measurable.
  double utilization = 5;

  // The busiest replica's utilization against its reservation.
  double max_utilization = 6;

  // Per-replica utilization histogram: `histogram[i]` counts replicas whose
  // utilization is below `histogram_bounds[i]` (and not below the previous
  // bound). The last bucket has no upper bound and counts everything at or
  // above the last entry of `histogram_bounds`, so `histogram` has one more
  // entry than `histogram_bounds`. The bounds are fixed:
  // 0.1, 0.25, 0.5, 0.7, 0.85, 1.0, 1.5.
  repeated uint32 histogram = 7;

  // Upper bounds of every bucket but the last; see `histogram`.
  repeated double histogram_bounds = 8;

  // Measured replicas whose utilization cannot be computed: no CPU
  // reservation, or an MHz reservation on a node that reports no clock
  // speed. Counted in `measured_replicas` and `used_millicores`, left out
  // of `utilization` and `histogram`.
  uint32 unmeasurable_replicas = 9;
}

// Measured memory of one task (GetScalingInputs).
message ScalingMemoryInputs {
  // Replicas with a current usage sample.
  uint32 measured_replicas = 1;

  // Current memory (`memory.current`, page cache included), in MiB, summed.
  double used_mib = 2;

  // The measured replicas' reservations in MiB, summed.
  double reserved_mib = 3;

  // `used_mib / reserved_mib`; 0 when nothing is reserved.
  double utilization = 4;

  // The largest single replica's memory against its reservation.
  double max_utilization = 5;
}

// Requests into one service (GetScalingInputs), from the caller-side service
// graph, over the most recent rollup interval of every calling node.
message ScalingRequestInputs {
  // The service, as a canonical reference (`namespace/name`, or the bare
  // name in `default`).
  string service = 1;

  // Requests (HTTP upstreams) or connections (TCP upstreams) per second that
  // reached an endpoint, summed over every calling node.
  double requests_per_second = 2;

  // Of those, 5xx answers plus attempts that reached no endpoint, per
  // second.
  double errors_per_second = 3;

  // `errors / (requests + errors)`, the share of attempts that failed, as
  // `ListServiceEdges` computes `error_rate`; 0 with no attempts.
  double error_ratio = 4;

  // Mean request latency in milliseconds (HTTP upstreams only); 0 with no
  // HTTP requests.
  double latency_ms_mean = 5;

  // The slowest request in the window, milliseconds.
  uint64 latency_ms_max = 6;

  // Nodes whose callers contributed.
  uint32 calling_nodes = 7;
}

// How current one task's measured inputs are (GetScalingInputs).
message ScalingDataFreshness {
  // - `current`: rollups for this task are in hand, each confirmed by its
  //   reporting manager within the last 35 seconds.
  // - `missing`: no rollup: nothing reports usage for the task (no
  //   replicas, a runtime that reports no usage, enforcement off), or the
  //   managers that held its rollups stopped confirming them.
  // - `resyncing`: the answering manager took the status lane less than one
  //   rollup interval ago, and peers' full resyncs may not have landed. The
  //   numbers may be partial; treat them as missing.
  string state = 1;

  // The newest worker sample among the task's rollups, unix milliseconds
  // (the worker's clock). 0 when `missing`.
  int64 sampled_at_unix_ms = 2;

  // Seconds since the least recently confirmed rollup was confirmed by the
  // manager that holds it, on the answering manager's clock. Usually under
  // 10.
  uint32 age_seconds = 3;

  // Nodes with a current rollup for the task: nodes running its replicas,
  // plus nodes whose callers reach the service it backs.
  uint32 reporting_nodes = 4;
}

// One 10-second point of a task's history (GetScalingInputs), the totals the
// answering manager computed at `at_unix_ms`.
message ScalingInputsPoint {
  // When the point was taken, unix milliseconds, answering manager's clock.
  int64 at_unix_ms = 1;

  // `ScalingCpuInputs.measured_replicas` at the time.
  uint32 measured_replicas = 2;

  // `ScalingCpuInputs.used_mhz`.
  double cpu_used_mhz = 3;

  // `ScalingCpuInputs.utilization`.
  double cpu_utilization = 4;

  // `ScalingMemoryInputs.used_mib`.
  double memory_used_mib = 5;

  // `ScalingMemoryInputs.utilization`.
  double memory_utilization = 6;

  // `ScalingRequestInputs.requests_per_second`; 0 when the task backs no
  // service.
  double requests_per_second = 7;

  // `ScalingRequestInputs.errors_per_second`.
  double errors_per_second = 8;

  // `ScalingRequestInputs.latency_ms_mean`.
  double latency_ms_mean = 9;
}

// Request payload for WatchScalingPolicies.
message WatchScalingPoliciesRequest {
  // Namespaces to watch, as names or `*`-globs. Empty means every namespace
  // the caller can read, which is what the autoscaler asks for. Jobs the
  // caller lacks `scale:read` on are always left out.
  repeated string namespaces = 1;
}

// One message of WatchScalingPolicies: the complete set of effective task
// policies at one moment. Each message replaces the previous one.
message ScalingPolicySet {
  // Every autoscaled task of every running job in scope, sorted by job id,
  // group, task.
  repeated ScalingPolicy policies = 1;

  // Increases by one with every message on this stream.
  uint64 generation = 2;

  // When the set was resolved, unix milliseconds (the answering manager's
  // clock).
  int64 resolved_at_unix_ms = 3;

  // The version of the cluster's scaling defaults the set was resolved
  // against (0: none set).
  uint64 defaults_version = 4;
}

// One autoscaled task's effective policy.
//
// The policy targets the task, or its whole group when the group has other
// tasks: then `members` lists every task of the group, all of which move to
// the same count in one ScaleTask write, and utilization is the group's
// summed usage over its summed reservations.
message ScalingPolicy {
  // Canonical job id.
  string job_id = 1;

  // Task group.
  string task_group = 2;

  // The task that carries `autoscale`.
  string task_name = 3;

  // Every task the policy moves: just `task_name`, or every task of the
  // group, in spec order.
  repeated string members = 4;

  // The task's spec `count` (the default floor).
  uint32 count = 5;

  // `ok`, or `invalid` when the policy does not resolve against the
  // current defaults (see `error`); an invalid policy is held, never acted
  // on.
  string state = 6;

  // Why the policy is invalid; empty when `state = "ok"`.
  string error = 7;

  // The digest of the effective policy (hex SHA-256 of `policy_json`).
  string digest = 8;

  // The effective policy as canonical JSON: every default filled, every
  // `"Nx"` bound resolved (`min`, `max`, `cpu`, `memory`, `checks`, `up`,
  // `down`, `headroom`, `warmup`, `tolerance`, `window`, `schedule`,
  // `onMissing`, `mode`). Empty when invalid.
  string policy_json = 9;

  // The policy in one line: `2..8, cpu 70%, enforce`.
  string summary = 10;

  // The task's runtime (whether it reports usage is the runtime's).
  string runtime = 11;
}

// Request payload for ApplyScalingDefaults.
message ApplyScalingDefaultsRequest {
  // The cluster-level record as JSON (the CLI evaluates a Nickel file to
  // it): the jobspec `autoscale` record without `checks`, e.g.
  // `{"cpu": 0.6, "max": "6x", "down": {"stabilize": "10m"}}`. `{}` clears
  // every cluster default, so the built-ins apply.
  string defaults_json = 1;

  // Validate and report the effect on every inheriting policy; write
  // nothing.
  bool dry_run = 2;

  // Apply even when some inheriting policies would become invalid; they
  // are then held `invalid` until fixed.
  bool force = 3;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 4;
}

// Reply payload for ApplyScalingDefaults.
message ApplyScalingDefaultsReply {
  // Human-readable outcome:
  // `scaling defaults: v3 applied; 4 policies changed, 0 invalid`.
  string message = 1;

  // Whether the defaults were written (false for a dry run, an unchanged
  // record, or a refusal reported as a dry run).
  bool applied = 2;

  // The defaults' version after the call.
  uint64 version = 3;

  // Every autoscaled task whose effective policy changes, or becomes
  // invalid.
  repeated ScalingPolicyChange changes = 4;

  // How many of `changes` are invalid under the new defaults.
  uint32 invalid = 5;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 6;
}

// How one task's effective policy changes under new defaults.
message ScalingPolicyChange {
  // `job/group/task`.
  string target = 1;

  // The effective policy's digest before the change (empty if it was
  // already invalid).
  string before_digest = 2;

  // The digest after (empty if it becomes invalid).
  string after_digest = 3;

  // Why it becomes invalid; empty when it stays valid.
  string error = 4;

  // The field paths whose effective value changes (`max`, `down.stabilize`).
  repeated string fields = 5;
}

// Request payload for GetScalingDefaults.
message GetScalingDefaultsRequest {
  // The namespace whose effective defaults to report. Empty means `default`.
  string namespace = 1;
}

// Reply payload for GetScalingDefaults.
message GetScalingDefaultsReply {
  // The cluster-level record as written (JSON); `{}` when none is set.
  string cluster_json = 1;

  // The cluster defaults' version; 0 when none was ever applied.
  uint64 version = 2;

  // Who applied the current cluster defaults.
  string updated_by = 3;

  // When, RFC 3339.
  string updated_at = 4;

  // The namespace the effective rows are for.
  string namespace = 5;

  // The effective defaults for `namespace`, one row per field, with the
  // level each value came from. Bounds are shown as written (`"1x"`).
  repeated ScalingProvenanceRow effective = 6;

  // Set when the namespace's defaults do not resolve: two namespace
  // policies set one field differently. `effective` is then empty.
  string error = 7;

  // The namespace policies governing `namespace` that set `autoscale`.
  repeated string policies = 8;
}

// One field of an effective policy or defaults, and where it came from.
message ScalingProvenanceRow {
  // The field path (`min`, `cpu`, `down.step`, `onMissing`).
  string field = 1;

  // The effective value, for people (`4 ("1x" of count 4)`, `10m`).
  string value = 2;

  // `built-in`, `cluster defaults`, `namespace policy <name>`, or
  // `jobspec`.
  string origin = 3;
}

// Request payload for ReportScalingStatus.
message ReportScalingStatusRequest {
  // The reporting app instance (its allocation id, or a name), shown by
  // `legion scaling status`.
  string instance = 1;

  // The app's evaluation interval in seconds. The app counts as NOT
  // RUNNING once no report has arrived for three intervals.
  uint32 interval_seconds = 2;

  // The app-wide mode: `enforce`, or `dry-run` when the app's config forces
  // every policy to dry-run.
  string mode = 3;

  // The last evaluation of every target the app evaluated this tick.
  repeated ScalingTargetReport targets = 4;

  // The app's build (its `legion` version).
  string version = 5;
}

// The autoscaler's last evaluation of one target.
message ScalingTargetReport {
  // Canonical job id.
  string job_id = 1;

  // Task group.
  string task_group = 2;

  // The task that carries `autoscale`.
  string task_name = 3;

  // The outcome in one word:
  // - `ok`: the count is where the policy wants it;
  // - `scaled`: this evaluation changed the count;
  // - `held`: a safeguard held a change back (the summary says which);
  // - `limited`: a bound, quota, or capacity limited the count;
  // - `deferred`: a scale-in waits for a rollout;
  // - `pinned`, `paused`: an operator holds the target;
  // - `dry-run`: the policy would have changed the count;
  // - `missing-data`: no check has data;
  // - `invalid`: the policy does not resolve;
  // - `error`: the evaluation or write failed (the summary says why).
  string state = 4;

  // The count when evaluated.
  uint32 current = 5;

  // The count the policy wants after every safeguard.
  uint32 want = 6;

  // When evaluated, unix milliseconds.
  int64 evaluated_at_unix_ms = 7;

  // The one-line why.
  string summary = 8;

  // The full decision (JSON: checks and stages). Empty when it is
  // unchanged since the previous report; the manager keeps the last one.
  string decision_json = 9;

  // The digest of the effective policy evaluated.
  string policy_digest = 10;

  // State changes worth an event, at most one of each kind per episode.
  repeated ScalingEventFlag events = 11;
}

// A state change the autoscaler reports for the manager to record as an
// event.
message ScalingEventFlag {
  // `limited` (`scale.limited`), `flapping` (`scale.flapping`), or
  // `check_failed` (`scale.check_failed`).
  string kind = 1;

  // What happened, for people.
  string message = 2;
}

// Reply payload for ReportScalingStatus.
message ReportScalingStatusReply {
  // Targets accepted.
  uint32 accepted = 1;

  // The manager that holds the report (raft node id, or `local`).
  string served_by = 2;
}

// Request payload for RecordScalingAction.
message RecordScalingActionRequest {
  // Canonical job id.
  string job_id = 1;

  // Task group.
  string task_group = 2;

  // Task name.
  string task_name = 3;

  // The action: `would` (a dry-run policy's decision). Other kinds are
  // refused.
  string kind = 4;

  // The count when decided.
  uint32 from = 5;

  // The count the policy would have written.
  uint32 to = 6;

  // The decision.
  ScaleDecision decision = 7;
}

// Reply payload for RecordScalingAction.
message RecordScalingActionReply {
  // The history row written.
  uint64 history_id = 1;
}

// Request payload for GetScalingStatus.
message GetScalingStatusRequest {
  // Namespaces to list, as names or `*`-globs. Empty means `default`
  // (or the namespace of `job`, when set).
  repeated string namespaces = 1;

  // Only this job's targets.
  string job = 2;

  // With `job`: only targets in this group.
  optional string task_group = 3;

  // With `job`: only this task's target.
  optional string task_name = 4;

  // Include each target's full last decision and its effective policy with
  // provenance (`legion scaling explain`).
  bool detail = 5;
}

// Reply payload for GetScalingStatus.
message GetScalingStatusReply {
  // The autoscaler app, as the reports show it.
  ScalingAppStatus app = 1;

  // One entry per autoscaled task in scope, sorted by job, group, task.
  repeated ScalingTargetStatus targets = 2;
}

// Whether the autoscaler is running.
message ScalingAppStatus {
  // - `running`: a report arrived within three of the app's intervals;
  // - `not-running`: none did (`message` says since when, and what the
  //   app's job is doing);
  // - `starting`: the answering manager took the status lane too recently
  //   to tell;
  // - `disabled`: the app is disabled (`legion app disable autoscaler`).
  string state = 1;

  // For people: `running 1/1 (alloc 42), last evaluation 3s ago`, or
  // `NOT RUNNING since 14:05 UTC (app job legion-system/autoscaler pending:
  // no node in pool legion-system)`.
  string message = 2;

  // When the last report arrived, unix milliseconds; 0 for none.
  int64 last_report_unix_ms = 3;

  // The app's reported interval, seconds.
  uint32 interval_seconds = 4;

  // The reporting instance.
  string instance = 5;

  // The app-wide mode it reported.
  string mode = 6;

  // The manager that answered (the status-lane leader).
  string served_by = 7;

  // The cluster-wide pause, if one is active.
  ScalingPauseInfo paused_all = 8;
}

// One autoscaled task's live state.
message ScalingTargetStatus {
  // Canonical job id.
  string job_id = 1;

  // Task group.
  string task_group = 2;

  // The task that carries `autoscale`.
  string task_name = 3;

  // Every task the policy moves (see `ScalingPolicy.members`).
  repeated string members = 4;

  // The effective mode: `enforce` or `dry-run`.
  string mode = 5;

  // The effective count now.
  uint32 now = 6;

  // What the autoscaler wanted at its last evaluation (= `now` when it held
  // or has not evaluated).
  uint32 want = 7;

  // The effective floor.
  uint32 min = 8;

  // The effective ceiling.
  uint32 max = 9;

  // The last evaluation's state (see `ScalingTargetReport.state`), or:
  // `stale` when the last evaluation is older than three of the app's
  // intervals, `not-evaluated` when there is none, `invalid` when the policy
  // does not resolve.
  string state = 10;

  // When last evaluated, unix milliseconds; 0 for never.
  int64 last_evaluation_unix_ms = 11;

  // The last evaluation's one-line why.
  string summary = 12;

  // The newest scale-history row, if any.
  ScaleHistoryEntry last_change = 13;

  // The active pin, if any.
  ScalePin pin = 14;

  // The pause covering the target, if any.
  ScalingPauseInfo pause = 15;

  // The effective policy's digest.
  string policy_digest = 16;

  // Why the policy is invalid, when it is.
  string error = 17;

  // With `detail`: the last evaluation's full decision (JSON).
  string decision_json = 18;

  // With `detail`: the effective policy, field by field, with origins.
  repeated ScalingProvenanceRow policy = 19;

  // With `detail`: the effective policy as JSON.
  string policy_json = 20;

  // The override row's version.
  uint64 version = 21;

  // The policy in one line (`2..8, cpu 70%, enforce`).
  string policy_summary = 22;
}

// Request payload for GetScaleHistory.
message GetScaleHistoryRequest {
  // Job name.
  string job = 1;

  // Only rows for tasks in this group.
  optional string task_group = 2;

  // Only rows for this task.
  optional string task_name = 3;

  // At most this many rows, newest first. 0 means 50; at most 1000.
  uint32 limit = 4;

  // Include each row's full decision and the effective policy its digest
  // resolves to.
  bool detail = 5;
}

// Reply payload for GetScaleHistory.
message GetScaleHistoryReply {
  // Newest first.
  repeated ScaleHistoryEntry entries = 1;
}

// One durable scaling record.
message ScaleHistoryEntry {
  // Row id, increasing.
  uint64 id = 1;

  // Canonical job id.
  string job_id = 2;

  // Task group.
  string task_group = 3;

  // Task name.
  string task_name = 4;

  // When, unix milliseconds.
  int64 at_unix_ms = 5;

  // The count before.
  uint32 from = 6;

  // The count after (or the count a `would` row wanted).
  uint32 to = 7;

  // `operator`, `autoscaler`, or `wake`.
  string source = 8;

  // Who wrote it (the token's principal).
  string principal = 9;

  // The one-line why (the decision's summary, or a person's reason).
  string summary = 10;

  // Whether the count actually changed: false for `would` and `deferred`
  // rows.
  bool applied = 11;

  // `scaled`, `deferred` (a scale-in waiting for a rollout), `would` (a
  // dry-run decision), `pinned`, `released`, or `reset`.
  string kind = 12;

  // The digest of the effective policy that decided; empty for people.
  string policy_digest = 13;

  // With `detail`: the decision (JSON).
  string decision_json = 14;

  // With `detail`: the effective policy the digest resolves to (JSON).
  string policy_json = 15;

  // The decision's id, if any.
  string decision_id = 16;
}

// Request payload for PauseScaling.
message PauseScalingRequest {
  // The job to pause (or resume). Empty with `all`.
  string job = 1;

  // Narrow to the autoscaled task of this group.
  optional string task_group = 2;

  // Narrow to this task.
  optional string task_name = 3;

  // Pause (or resume) the whole cluster: the kill switch.
  bool all = 4;

  // Pause for this many seconds; unset holds until resumed.
  optional uint64 for_seconds = 5;

  // Why, shown on every status surface.
  string reason = 6;

  // Resume instead: remove the pause at this scope.
  bool resume = 7;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 8;
}

// Reply payload for PauseScaling.
message PauseScalingReply {
  // Human-readable outcome: `paused web (every autoscaled task) until
  // 15:10 UTC`, `resumed autoscaling cluster-wide`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key`.
  bool deduplicated = 2;

  // When the pause ends, unix milliseconds; unset for "until resumed" and
  // for a resume.
  optional int64 until_unix_ms = 3;
}

// Request payload for DestroyJob.
message DestroyJobRequest {
  // Job name.
  string name = 1;

  // Reserved for future eval-priority support.
  //
  // Current manager implementation ignores this field.
  optional int64 priority = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 3;
}

// Reply payload for DestroyJob.
message DestroyJobReply {
  // Human-readable status message.
  //
  // Current manager reply format: `"Destroyed <job-name>"`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for CreateInstance.
message CreateInstanceRequest {
  // Job name (also used as job ID in current manager implementation). The
  // job's latest config must declare at least one keyed-mode stateful task.
  string job_id = 1;

  // Optional task-group filter used to resolve the target task.
  //
  // May be omitted when the job has exactly one keyed task. Required (along
  // with `task` when a group holds several keyed tasks) whenever the keyed
  // task would otherwise be ambiguous; ambiguity is rejected with
  // InvalidArgument rather than guessed.
  optional string group = 2;

  // Optional task-name filter used to resolve the target task. Same
  // disambiguation rules as `group`.
  optional string task = 3;

  // Optional caller-supplied instance key.
  //
  // Must match `[A-Za-z0-9._-]{1,128}`. The stored id is the key qualified
  // by the job's namespace, exactly as job ids are: `user-42` in `default`,
  // `payments/user-42` in `payments` (reply `instance_id`). It must not
  // collide with any existing instance id of the namespace — including
  // Terminated tombstones (destroyed ids are never reusable); another
  // namespace's `user-42` is a different instance. Required when the task sets
  // `stateful.requireId: true`. Optional otherwise (the server mints an id
  // when absent). A valid explicit key is always honored.
  optional string instance_id = 4;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. The
  // recorded replay carries the originally created instance id.
  optional string idempotency_key = 5;

  // Restore the new instance from this snapshot (an id, or a name of the
  // job) instead of booting it empty. Needs `snapshot:read` on the job. See
  // `CreateInstances` for the full contract.
  optional string from_snapshot = 6;
}

// Reply payload for CreateInstance.
message CreateInstanceReply {
  // The created instance's stable, canonical id: the caller's key qualified
  // by the job's namespace (`payments/user-42`; bare in `default`), or a
  // server-minted id, which is cluster-unique and never qualified. Every
  // instance RPC takes this form. This is the value the task sees as
  // `LEGION_INSTANCE_ID` (the key alone is `LEGION_INSTANCE_KEY`) and the id
  // its storage handle and workload identity bind to.
  string instance_id = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;

  // The snapshot id the instance restores from, resolved from
  // `from_snapshot` (a name resolves to the snapshot it named at call
  // time). Empty when the instance boots empty.
  string restoring_from = 3;

  // `keyed` for an instance with a row, `session` for an unnamed session of
  // a session-mode task (docs/session-mode.md), started on a node with
  // envelope room and recorded nowhere but on that node and in the
  // managers' session index.
  string mode = 4;

  // Whether the instance has a row in the replicated store, and so the
  // keyed guarantees: an exact listing, at most one live allocation,
  // rescheduling on node loss. False for a session until it is promoted
  // (PromoteInstance).
  bool durable = 5;

  // The node a session was started on. Empty for a keyed create, whose
  // placement the scheduler decides after this call returns.
  string node_id = 6;

  // A session's state: `starting` for a session this call started, or the
  // state its node last reported (`starting` or `running`) for a
  // deduplicated create. Empty for a keyed create (see `GetInstance` for its
  // state).
  string state = 7;
}

// Request payload for CreateInstances (atomic batch create).
message CreateInstancesRequest {
  // Job name (also used as job ID in current manager implementation). The
  // job's latest config must declare at least one keyed-mode stateful task.
  string job_id = 1;

  // Optional task-group filter used to resolve the target task. Same
  // disambiguation rules as `CreateInstanceRequest.group`.
  optional string group = 2;

  // Optional task-name filter used to resolve the target task. Same
  // disambiguation rules as `CreateInstanceRequest.task`.
  optional string task = 3;

  // Explicit instance keys to create. Each must match
  // `[A-Za-z0-9._-]{1,128}` and must not collide with any existing instance
  // id (including Stopped instances and Terminated tombstones) nor repeat
  // within this list. Any violation fails the WHOLE call (nothing is
  // created), naming the offending id. May be empty when `count > 0`.
  repeated string instance_ids = 4;

  // Number of additional server-minted instances to create on top of
  // `instance_ids`. Rejected (InvalidArgument) when the task sets
  // `stateful.requireId: true`, which requires caller-supplied ids. At
  // least one of `instance_ids` / `count` must be non-empty/non-zero.
  uint32 count = 5;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. The
  // recorded replay carries the originally created instance ids.
  optional string idempotency_key = 6;

  // Restore every created instance from this snapshot (an id, or a name of
  // the job) instead of booting it empty. Needs `snapshot:read` on the job,
  // and caps the batch at 64 instances. See the RPC comment.
  optional string from_snapshot = 7;
}

// Reply payload for CreateInstances.
message CreateInstancesReply {
  // Every instance id created by this call, in request order: the explicit
  // `instance_ids` first, then the `count` server-minted ids. On failure
  // nothing is created and this RPC returns an error status instead.
  repeated string instance_ids = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;

  // The snapshot id every instance restores from, resolved from
  // `from_snapshot`. Empty when the instances boot empty.
  string restoring_from = 3;
}

// Request payload for DestroyInstance.
message DestroyInstanceRequest {
  // Stable instance id to destroy. Must reference a keyed-mode instance.
  string instance_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for DestroyInstance.
message DestroyInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply values:
  // - `"Destroyed instance <id>"` — terminated by this request.
  // - `"Instance <id> already terminated"` — no-op on a tombstone.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for StopInstance.
message StopInstanceRequest {
  // Stable instance id to stop. Must reference a keyed-mode instance that is
  // not Terminated (tombstones can never be stopped or restarted).
  string instance_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for StopInstance.
message StopInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply values:
  // - `"Stopped instance <id>"` — stopped by this request.
  // - `"Instance <id> already stopped"` — no-op on a stopped instance.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for StartInstance.
message StartInstanceRequest {
  // Stable instance id to start. Must reference a keyed-mode instance that
  // is not Terminated, on a job that is not stopped.
  string instance_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;

  // Suspended instances only: discard the checkpoint and boot fresh on the
  // retained storage instead of restoring. Ignored for a stopped instance,
  // which always boots fresh. Default false.
  bool cold = 3;

  // Sessions with `suspend.durability = "store"` only
  // (docs/session-mode.md, "Moving a session"): move the session to
  // another node even though the node holding it has not been marked down
  // or lost. By default a running session whose node does not answer moves
  // only once the managers mark that node down or lost; until then the
  // call answers UNAVAILABLE naming the node, because the session may still
  // be running there. A suspended session moves without it. A forced move
  // of a running session leaves two copies until the old one is fenced.
  // Ignored for keyed instances. Default false.
  bool force_move = 4;
}

// Reply payload for StartInstance.
message StartInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply values:
  // - `"Started instance <id>"` — moved stopped -> pending and queued for
  //  placement by this request.
  // - `"Instance <id> already running"` — no-op on a live
  //  (pending/active/rescheduling) instance, or on a running session
  //  (docs/session-mode.md).
  // - `"Retrying instance <id> now: lifted its reschedule backoff"` — the
  //  instance was `rescheduling` and its replacement was waiting out the
  //  task's reschedule backoff (`InstanceInfo.reschedule_backoff`); the
  //  backoff is lifted and a placement queued. The move history stays, so
  //  another failure backs off from where it was.
  // - `"Resuming instance <id> from <snapshot> on <node>"` — a suspended
  //  instance queued to restore from its checkpoint.
  // - `"Started instance <id> cold ..."` — a suspended instance booting
  //  fresh (`cold = true`, or an unusable checkpoint under
  //  `onRestoreFailure = "cold"`, with the reason).
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;

  // The checkpoint a suspended instance is resuming from. Empty when the
  // instance boots cold (a stopped instance, `cold = true`, or an unusable
  // checkpoint).
  string resuming_from = 3;

  // The node holding that checkpoint, where the restore is pinned. Empty
  // when `resuming_from` is, and when the checkpoint is `published`, which
  // restores on any compatible node.
  string node_id = 4;
}

// Request payload for SuspendInstance.
message SuspendInstanceRequest {
  // Stable id of the keyed-mode instance to suspend. It must be `active`
  // (have a running allocation).
  string instance_id = 1;

  // `memory` or `disk`; empty uses the task's `suspend.checkpoint`, else
  // the best the instance can take: memory for a sandbox launched for
  // memory checkpoints, disk otherwise. `memory` also needs `snapshot:write`.
  optional string checkpoint = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 3;
}

// Reply payload for SuspendInstance.
message SuspendInstanceReply {
  // Human-readable status: `"Suspending instance <id> (<kind> checkpoint
  // <snapshot> on <node>)"`, `"Instance <id> already suspended (<snapshot>)"`,
  // or `"Instance <id> is already being suspended (<snapshot>)"`.
  string message = 1;

  // The suspend checkpoint's snapshot id (`snap-...`). Follow it with
  // GetSnapshot, or watch the instance's `checkpoint_id`.
  string snapshot_id = 2;

  // `memory` or `disk`: the checkpoint kind this suspend takes.
  string kind = 3;

  // The node capturing the checkpoint, where its local copy stays.
  string node_id = 4;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 5;

  // The task's `suspend.durability`: `local` (the checkpoint stays on
  // `node_id`, and a resume is pinned there) or `store` (once captured, the
  // node also publishes it to its `contentStore`; the snapshot moves to
  // `published`, emits `snapshot.published`, and can resume on any
  // compatible node).
  string durability = 6;
}

// Fork ---------------------------------------------------------------------

// Request payload for ForkInstance.
message ForkInstanceRequest {
  // Stable id of the keyed-mode instance to fork. It must be `active` (have
  // a running allocation), and it keeps running.
  string instance_id = 1;

  // How many forks to create, 1 to 64. 0 means 1.
  uint32 count = 2;

  // Place the forks on distinct nodes. The fork takes a memory checkpoint,
  // publishes it to the origin node's `contentStore` (`durability =
  // store`), and places each fork, once the publish lands, on a compatible
  // node none of its siblings runs on. Needs an instance without a
  // `stateful.storage` volume, on a worker with a `contentStore`. See
  // ForkInstance.
  bool spread = 3;

  // `memory` or `disk`; empty takes a memory checkpoint when the origin can
  // (a sandbox launched for memory checkpoints on Firecracker or
  // cloud-hypervisor), else a disk checkpoint of its instance volume. A
  // disk fork boots each fork fresh on its cloned volume.
  optional string checkpoint = 4;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. A retry
  // with the same key returns the first call's forks and creates nothing.
  optional string idempotency_key = 5;
}

// Reply payload for ForkInstance.
message ForkInstanceReply {
  // The forked instance.
  string origin = 1;

  // The fork checkpoint's snapshot id (`snap-...`, `purpose = fork`). Follow
  // it with GetSnapshot: `state = local` means the capture landed and the
  // forks are being placed (for a spread fork, `published`).
  string snapshot = 2;

  // How long the origin was paused for the capture, in milliseconds, once
  // the capture has landed. 0 while it is still capturing, and for a disk
  // fork, which does not pause the origin. `legion instance fork --wait`
  // waits for the capture and fills it in.
  uint64 pause_ms = 3;

  // The new instances' ids, in creation order.
  repeated string instances = 4;

  // `memory` or `disk`: the checkpoint kind the fork takes.
  string kind = 5;

  // The node holding the checkpoint: where every fork runs, unless
  // `durability` is `store`.
  string node_id = 6;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 7;

  // `local`: the forks run on `node_id`. `store` (a spread fork): the
  // checkpoint is published first, and each fork runs on its own node.
  string durability = 8;

  // One-line notes about side effects of the fork's capture on the origin,
  // printed by `legion instance fork` as `note: ...`. Today: a memory fork
  // of a gated sandbox on Firecracker resets the origin's open network
  // connections (the origin keeps running). Empty when there is nothing to
  // say, and on a deduplicated reply.
  repeated string notes = 9;
}

// Request payload for ReplaceInstance.
message ReplaceInstanceRequest {
  // Stable instance id whose lost-node allocation to force-replace. Must
  // reference an instance whose current allocation sits on a `lost` node.
  string instance_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for ReplaceInstance.
message ReplaceInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply value:
  // - `"Replacing instance <id>: freed allocation <alloc> on lost node
  //   <node>"` — the gate was overridden and a reschedule eval enqueued.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// One stateful instance (see docs/stateful-workloads.md). An instance is the
// stable identity one level above an allocation: it survives reschedules,
// owns the storage binding, and feeds the workload-identity subject.
message InstanceInfo {
  // Stable id, unique within the cluster. Slot mode: the deterministic
  // `{job}-{group}-{slot}` ordinal id. Keyed mode: the caller-supplied key
  // (never recycled: destroy keeps a tombstone) or a server-minted
  // `<task>-<26 base32>` id (unique by 130 random bits, with no tombstone;
  // see `named`).
  string instance_id = 1;

  // Owning job name.
  string job_id = 2;

  // Task group the instance belongs to.
  string group = 3;

  // Task name the instance currently belongs to (informational; identity is
  // keyed by `instance_id`).
  string task = 4;

  // Id-assignment mode: `slot` or `keyed`.
  string mode = 5;

  // Lifecycle state: `pending` (never placed, or queued for re-placement
  // after StartInstance), `active` (live allocation), `rescheduling` (lost
  // its allocation; a replacement will re-bind the same id and storage),
  // `stopped` (keyed only: paused via StopInstance or a job stop; row and
  // storage handle retained, id still owned, revivable via StartInstance),
  // `suspended` (keyed only: checkpointed by SuspendInstance; holds no
  // allocation, does not count toward desired, and StartInstance restores it
  // from `checkpoint_id`), or `terminated` (slot scale-in / keyed destroy /
  // job destroy; rows retained — keyed tombstones forever).
  string state = 6;

  // Ordinal slot index `0..count.num-1`; present only in slot mode.
  optional uint32 slot_index = 7;

  // The allocation currently fulfilling this instance, if any.
  optional int64 current_alloc_id = 8;

  // Opaque persistent-storage handle bound to the instance, when the task
  // declares `stateful.storage`. Stable across reschedules and retained
  // while `stopped` (StopInstance / job stop). Dropped on keyed destroy;
  // retained on slot scale-in unless `retainOnScaleIn: false`, and retained
  // on job stop unless `retainOnStop: false` (slot mode only; the K8s
  // `whenDeleted` analog — job destroy always deletes every instance row).
  optional string storage_handle = 9;

  // RFC3339 creation timestamp.
  string created_at = 10;

  // RFC3339 timestamp of the last state/binding change.
  string updated_at = 11;

  // Diagnostic detail explaining a non-obvious lifecycle situation; unset in
  // the common case. Three producers:
  //
  // - `pending-loss-confirmation: ...` — the instance's current allocation
  //   sits on a `lost` node and the manager is waiting out
  //   `stateful.onLost.replaceAfter` (or `replaceAfter: "never"` requires node
  //   recovery / ReplaceInstance) before rebinding it. The instance stays
  //   `active` while gated — its workload may well still be running on the
  //   partitioned node. See docs/stateful-workloads.md "Node loss and fencing".
  //
  // - `volume-pinned: ...` — the instance is awaiting placement and holds
  //   node-local storage, so it can only be placed on the node holding its
  //   data. It waits for that node rather than starting on empty storage;
  //   `legion volume delete --force <id>` abandons the data and frees the
  //   instance to place elsewhere. See docs/volumes.md.
  //
  // - The last suspend or restore failure (`suspend failed: ...`, `restore
  //   from <snapshot> failed, booted cold: ...`, `... the instance stays
  //   suspended (onRestoreFailure = "fail")`), until the next successful
  //   suspend or resume clears it. See docs/suspend-and-resume.md.
  optional string detail = 12;

  // Measured usage of the instance's current allocation, from the latest
  // report its node sent (see GetNodeUsage). Absent when the instance has no
  // allocation, its runtime is not governed, its worker has enforcement off,
  // or this manager has not received a report for it since it started.
  optional AllocationUsage usage = 13;

  // The snapshot this instance is restoring from (RestoreInstance or a
  // resume), until its node reports the restore's outcome. Absent otherwise.
  optional string restore_snapshot_id = 14;

  // Suspend and resume (docs/suspend-and-resume.md) ---------------------

  // The suspend checkpoint (`snap-...`) a resume restores from. Set while
  // the instance is `suspended` and while a resume is in flight.
  optional string checkpoint_id = 15;

  // That checkpoint's kind: `memory` or `disk`.
  optional string checkpoint_kind = 16;

  // Where the checkpoint is meant to live, from the task's
  // `suspend.durability`: `local` (on `checkpoint_node_id` only) or `store`
  // (also published to that node's `contentStore`; see
  // `checkpoint_state`).
  optional string checkpoint_durability = 17;

  // The node holding the checkpoint. A resume is pinned to it.
  optional string checkpoint_node_id = 18;

  // RFC 3339 time of the last successful suspend.
  optional string suspended_at = 19;

  // Why the instance is (or was last) suspended: `manual` (SuspendInstance),
  // `idle` (the task's `suspend.idle` policy: quiet for `idle.after`), or
  // `pressure` (the node's memory pressure response took the `suspend` step
  // because the task sets `suspend.onPressure = true`). While a suspend is in
  // flight it names the reason of that suspend.
  optional string suspend_reason = 20;

  // The snapshot the instance last resumed or restored from.
  optional string restored_from_snapshot_id = 21;

  // How long the last restore took on the node, in milliseconds.
  optional uint64 last_restore_ms = 22;

  // How long the last suspend's capture took on the node, in milliseconds.
  optional uint64 last_suspend_ms = 23;

  // The checkpoint's size in bytes (0 for a disk checkpoint, whose volume
  // stays in place).
  optional uint64 checkpoint_bytes = 24;

  // An operation in flight: `suspending` (capture requested, not yet
  // reported), `resuming` (restore requested, not yet reported), or
  // `forking` (a fork waiting for its origin's checkpoint to land;
  // it is not placed until then).
  optional string pending_op = 25;

  // Automatic suspend (docs/suspend-and-resume.md, "Idle policy").

  // RFC 3339 time since which the running allocation has been quiet by the
  // signals its task's `suspend.idle.signals` counts. Unset when the task has
  // no idle policy, when the instance is not running, or when its node sends
  // no usage reports (a worker without `resourceEnforcement.enabled`, where
  // the idle policy cannot act; `detail` says so).
  optional string idle_since = 26;

  // The task's `suspend.idle.after`, in seconds: the idle sweep suspends the
  // instance once `idle_since` is this far in the past. Unset when the task
  // has no idle policy.
  optional uint64 idle_after_seconds = 27;

  // The checkpoint snapshot's state: `local` (on `checkpoint_node_id` only;
  // a resume is pinned there) or `published` (in the content store; a
  // resume goes to any compatible node). A `store`-durability checkpoint is
  // `local` until its upload finishes. See `checkpoint_durability`.
  optional string checkpoint_state = 28;

  // Why the instance's last allocation stopped: the cause, a detail
  // sentence, a hint when there is something to change, and when. Recorded
  // by the manager in the same transaction that removes the allocation, so
  // it survives the allocation row and needs no `operator:read` on events
  // (job:read on the instance is enough). For a memory pressure eviction it
  // carries the worker's detail and hint, the same text as the
  // `node.pressure` event. Unset for an instance whose allocation has never
  // stopped, and for stops recorded by a manager that predates the field.
  // Replaced by each later stop, so a rollout after a pressure eviction
  // shows `update`.
  optional InstanceStop last_stop = 29;

  // Which checkpoints the instance can take right now: memory, disk,
  // published, and spread, each with the reason when not. Computed by the
  // manager from the running allocation, its node, and the task, with the
  // same checks CreateSnapshot, SuspendInstance, and ForkInstance apply
  // (including a stored network policy that gates the task, which the job
  // spec cannot show). Set only while the instance is `active` with a
  // running allocation; unset otherwise, since nothing can be checkpointed.
  optional CheckpointSupport checkpoint_support = 30;

  // The instance this one was forked from (ForkInstance), kept for the
  // instance's lifetime so fork lineage survives the fork checkpoint being
  // reclaimed. Unset for instances not created by a fork.
  optional string forked_from = 31;

  // MiB of memory a suspended instance keeps charged to its node, so a
  // resume finds room: its job's `suspend.reserve` share of its
  // reservation, applied when the suspend landed. Unset when the instance holds nothing (the default)
  // or is not suspended. With `reserve = true` this is the whole
  // reservation.
  optional double held_memory_mib = 32;

  // CPU (MHz) the suspended instance keeps charged to its node, the same
  // way as `held_memory_mib`. Exclusive cores are held only with a full
  // hold, and are not counted here.
  optional double held_cpu_mhz = 33;

  // Set when the instance's last resume or restore could not restore its
  // checkpoint and `suspend.onRestoreFailure = "cold"` (the default) booted
  // it fresh on its retained storage instead. The workload's running
  // processes and memory are gone, though its volume is intact. Covers a
  // resume (StartInstance) whose restore failed on the node, whose
  // checkpoint was lost or failed, or that waited past `resumeTimeout`, a
  // fork or `from_snapshot` create whose restore failed, and a
  // RestoreInstance rollback whose restore failed.
  //
  // Persisted on the instance, unlike the `instance.restore_failed` event,
  // and kept until the next resume or restore starts, so a client that
  // checks later still sees it. An explicit `StartInstance { cold: true }`
  // clears it and sets nothing, since that cold boot was asked for. Unset
  // otherwise. See docs/suspend-and-resume.md, "When a resume cannot
  // restore".
  optional InstanceColdBoot cold_boot = 34;

  // The IPv4 address the running allocation's guest holds, for a `sandbox`
  // on `config.network = { mode = "tap", bridge = ... }`. Legion leases it
  // from the bridge's pool in the node's worker config
  // (`sandbox.bridges.<bridge>`) at boot, and leases a fresh one on every
  // restore and fork, which the guest applies before its workload runs
  // again: a fork never answers on its origin's address, and a resume on
  // the same node gets its previous address back when it is still free.
  // From the node's latest network status report, so unset for a few
  // seconds after a start, and unset for gated and loopback-only sandboxes
  // and every other runtime. See docs/task-runtime-sandbox.md, "Addressing".
  optional string guest_address = 35;

  // The bridge `guest_address` belongs to (`br0`). Set exactly when
  // `guest_address` is.
  optional string guest_bridge = 36;

  // Where the instance's current allocation serves each of its declared
  // `network.ports`: the node's advertised address and the advertised
  // (host) port, the same pair the service catalog publishes. Empty while
  // the instance has no allocation (pending, suspended, stopped) and on
  // rows placed before the node advertised an address. Set by GetInstance
  // only; ListInstances leaves it empty. `legion start gateway` dials the
  // entry named by `wake.port` (docs/gateway.md).
  repeated InstanceEndpoint endpoints = 37;

  // The task's `suspend.wake` block, when it declares one: the instance
  // accepts wake on request through `legion start gateway`, which resumes
  // it when a request arrives while it is suspended and holds the request
  // until the instance serves. Unset means the gateway refuses to route to
  // this instance. Resolved from the newest config of the instance's job
  // and task. Set by GetInstance only.
  optional InstanceWake wake = 38;

  // Whether the instance id is a name. True for a caller-chosen keyed id, a
  // fork of a named instance (`<origin>-f<n>`), a seeded
  // `initialInstances` id, an edge-boot id, and every slot id. False for a
  // keyed id the server minted (`<task>-<26 lowercase base32 characters>`,
  // CreateInstance without `instance_id`, or a fork of an unnamed
  // instance). DestroyInstance keeps a named instance's row as a
  // `terminated` tombstone for the life of its job, so the id is never
  // reused; it deletes an unnamed instance's row, whose id is unique by 130
  // random bits and has a shape callers may not choose, so no one can
  // re-create it. After that, GetInstance answers NOT_FOUND for the id. See
  // docs/stateful-workloads.md, "Id rules".
  bool named = 39;

  // Whether the suspended instance is archived (its task's
  // `suspend.archive`): its checkpoint was published and its snapshot row
  // moved to an archive manifest in the `contentStore`, at
  // `manifest_url`. The instance stays `suspended`, StartInstance reads the
  // manifest back and resumes it like any published checkpoint, and
  // `checkpoint_kind`, `checkpoint_state`, `checkpoint_node_id`, and
  // `checkpoint_bytes` are unset while it is archived, since the row they
  // come from is gone. An instance archived with `archive = "manifestOnly"`
  // has no row at all: GetInstance reads it from its manifest, and
  // ListInstances shows it only with `include_idle`. See
  // docs/suspend-and-resume.md, "Archived instances".
  bool archived = 40;

  // The archive manifest's URL (`s3://…/manifests/<job>/<group>/<task>/<id>.json`
  // or `file://…`). Set exactly when `archived` is.
  optional string manifest_url = 41;

  // Whether the instance has a row in the replicated store (docs/session-mode.md).
  // True for every slot and keyed instance, including a promoted session.
  // False for an unnamed session (`mode = "session"`): it lives on its node
  // and in the managers' session index, ends when its node is lost, and is
  // listed from that index, which can lag its node by a heartbeat. Also
  // false for an archived instance with no row (`archive = "manifestOnly"`),
  // whose archive manifest is its whole record.
  bool durable = 42;

  // The session this instance was promoted from (PromoteInstance), kept for
  // the instance's lifetime. Equal to `instance_id` when the promotion kept
  // the session's id. Unset for instances that were never sessions.
  optional string promoted_from = 43;

  // The node the instance runs on: its current allocation's node for an
  // instance with a row, or the node running a session (`mode =
  // "session"`). Unset when the instance has no current allocation
  // (pending, rescheduling, stopped, suspended, or terminated).
  optional string node_id = 44;

  // When the manager that started the session issued it, RFC 3339. Of two
  // copies of one session id on two nodes, the later one is stopped.
  // Sessions only.
  optional string lease_issued_at = 45;

  // The envelope allocation the session runs inside. Sessions only.
  optional int64 envelope_alloc_id = 46;

  // Set while the instance is `rescheduling` because its last allocation
  // failed and the replacement waits out the task's reschedule backoff
  // (`on_unhealthy.move_delay`, doubled per consecutive failure, capped at
  // 30 minutes; docs/jobs-tasks-and-scheduling.md,
  // "Manager-side move logic"). No eval places the instance before
  // `next_attempt_at`. `detail` carries the same facts as a sentence, with
  // how to retry now: StartInstance lifts the backoff of a keyed instance,
  // and `legion job run <spec> --force-reschedule` lifts every backoff of
  // the job. Replicated, so every manager reports it. Unset otherwise.
  optional RescheduleBackoff reschedule_backoff = 47;
}

// A failed allocation's replacement waiting out its task's reschedule
// backoff (InstanceInfo.reschedule_backoff, Job.reschedule_backoffs). The
// manager records it in the same replicated write that removes the failed
// allocation, and the scheduler leaves the replacement unplaced until
// `next_attempt_at`, whatever eval runs for the job in the meantime. The
// `allocation.reschedule_deferred` event announces each one
// (docs/event-stream.md).
message RescheduleBackoff {
  // The task whose replacement is deferred.
  string task = 1;

  // The task's group.
  string group = 2;

  // The stateful instance waiting for the replacement. Empty for a
  // stateless task.
  string instance_id = 3;

  // The allocation that failed.
  int64 allocation_id = 4;

  // The node it failed on. The replacement avoids that node when another
  // has room.
  string node_id = 5;

  // How many times in a row the instance (or, for a stateless task, the
  // task) failed, counting this failure: a failure continues the count
  // while it comes within `move_period` of the previous replacement's
  // release, so it resets once a replacement survives a whole period. The
  // backoff is `move_delay` doubled per earlier failure in the count. The
  // job's failure budget is separate: with `move_count` set, the job fails
  // when a failure finds `move_count` moves of the task inside
  // `move_period`.
  uint32 attempt = 6;

  // The backoff this failure got, in seconds.
  uint64 delay_seconds = 7;

  // When the replacement may be placed, RFC 3339 (UTC).
  string next_attempt_at = 8;

  // Why the allocation failed: the worker's reason (or the memory pressure
  // response's sentence for an `evict-bursting` eviction), on one line and
  // cut to 400 characters. The `allocation.failed` event has the full text.
  string reason = 9;

  // The operator-facing sentence: `attempt 4 failed (<reason>); next
  // attempt at <time> (backoff 4m)`.
  string summary = 10;
}

// One served port of an instance (InstanceInfo.endpoints).
message InstanceEndpoint {
  // The port's label in the task's `network.ports` (`http`).
  string port = 1;

  // The node's advertised address (an IP or hostname). Empty when the node
  // advertises none.
  string address = 2;

  // The advertised port number: what the catalog, health checks, and the
  // gateway dial. With an ingress chain this is the datapath's port in front
  // of the task, so the chain applies to gateway traffic too.
  uint32 number = 3;
}

// The resolved `suspend.wake` block of an instance's task.
message InstanceWake {
  // The `network.ports` label requests are sent to.
  string port = 1;

  // How long a gateway holds a request while the instance resumes before it
  // answers `503` with `Retry-After`, in milliseconds. Defaults to 30000.
  uint64 timeout_ms = 2;
}

// A cold boot that replaced a restore (InstanceInfo.cold_boot).
message InstanceColdBoot {
  // The snapshot the instance was restoring from: its suspend checkpoint, a
  // fork checkpoint, or the snapshot a rollback or `from_snapshot` create
  // named.
  string snapshot_id = 1;

  // Why the restore did not happen: the node's restore error, or the
  // manager's reason (`checkpoint ... is lost (its node is gone)`, `the
  // resume could not be placed ... within resumeTimeout (30s)`).
  string reason = 2;

  // RFC 3339 time the manager chose the cold boot.
  string at = 3;
}

// Request for `Manager.ListSessionNodes`.
message ListSessionNodesRequest {
  // The job. Required.
  string job_id = 1;
  // The session task. Optional when the job has exactly one.
  string task_name = 2;
}

// One node holding an envelope for the session task.
message SessionNode {
  // The node id.
  string node_id = 1;
  // The node's worker-plane address (`https://host:4848`), where
  // `Worker.StartSession`, `GetSession`, and `StopSession` are served.
  // Empty when the node has not advertised one.
  string address = 2;
  // The node's tag: the 8 characters a session id minted on this node
  // carries before its final `.` (`workspace-q4n7c2rd.01J...`). A picker
  // maps a session id's tag to this node to route requests for it.
  string tag = 3;
  // Whether a picker should send new edge starts here: the node is ready,
  // available (not draining or ineligible), has an address, advertises the
  // `edge-sessions` capability, and its envelope has room for one more
  // session of this task.
  bool accepting = 4;
  // Why `accepting` is false: `lost`, `down`, `draining`, `ineligible`,
  // `no-address`, `no-edge-sessions` (the node does not serve
  // `StartSession`: `edgeBoot.acceptClaims` is off), or `full`. Empty when
  // accepting.
  string reason = 5;
  // The envelope's room left, as a JSON object of amounts (`{"cpu":21500,
  // "memory":44032}`), from the last reports plus this manager's own
  // recent starts.
  string room = 6;
  // How many more sessions of this task's size fit in `room`: a weight for
  // weighted balancers. 0 when full.
  uint32 weight = 7;
  // Sessions the node last reported for this task.
  uint32 sessions = 8;
}

// Reply for `Manager.ListSessionNodes`.
message ListSessionNodesReply {
  string job_id = 1;
  string task_name = 2;
  // One entry per node with an envelope, sorted by node id.
  repeated SessionNode nodes = 3;
  // When the list was read, RFC 3339.
  string as_of = 4;
}

// Request payload for ListInstances.
message ListInstancesRequest {
  // Job name whose instances to list.
  string job_id = 1;

  // Optional exact-match group filter.
  optional string group = 2;

  // Also list archived instances that have no row in the manager's store
  // (`suspend.archive = "manifestOnly"`), read from the job's archive
  // manifests in every `contentStore` the cluster's worker types publish
  // to. They come after the rows, as `suspended` and `archived`, one page
  // of `idle_page_size` per call: pass `next_idle_page_token` back as
  // `idle_page_token` for the next. Rows are always listed in full; only
  // the bucket listing pages. Default false: a list reads the store only.
  bool include_idle = 3;

  // With `include_idle`: where the bucket listing resumes, from the
  // previous reply's `next_idle_page_token`. Empty starts at the beginning.
  string idle_page_token = 4;

  // With `include_idle`: the most bucket-listed instances to return.
  // Default 1000, at most 10000.
  uint32 idle_page_size = 5;

  // The most running sessions (`mode = "session"`) to return, in session
  // id order. Unset: 5000. At most 50000. 0 returns no sessions, only
  // `session_count` and `sessions_by_node`: what a dashboard needs at any
  // scale. Rows are always listed in full.
  optional uint32 session_limit = 6;

  // Where the session listing resumes: the previous reply's
  // `next_session_page_token`. Empty starts at the lowest id.
  string session_page_token = 7;
}

// Reply payload for ListInstances.
message ListInstancesReply {
  // Instances ordered by group, slot index, then instance id. Includes
  // Terminated rows (tombstones). With `include_idle`, the bucket-listed
  // archived instances follow, ordered by group, task, then id.
  repeated InstanceInfo instances = 1;

  // With `include_idle`: the token for the next page of the bucket
  // listing. Empty when the listing is complete.
  string next_idle_page_token = 2;

  // Whether the running sessions listed (`mode = "session"`) are every
  // session the job has: true when, for every live node that can run
  // sessions, some manager holds a full session report. False right after a
  // manager starts or a node joins, until those reports land (one heartbeat
  // each). Always true for a job with no session task. Rows are always
  // listed in full.
  bool complete = 3;

  // When the session part of the listing was read, RFC 3339. A session's
  // own entry can be up to one heartbeat older than this.
  string as_of = 4;

  // The token for the next page of sessions (`session_page_token`). Empty
  // when this reply holds the last of them.
  string next_session_page_token = 5;

  // How many running sessions the job has, from the session index's
  // per-node totals, whatever `session_limit` returned. Counted like
  // `complete`: nodes not reported yet are missing from it.
  uint64 session_count = 6;

  // `session_count` by node id.
  map<string, uint64> sessions_by_node = 7;
}

// Request payload for PromoteInstance.
message PromoteInstanceRequest {
  // The running session to promote.
  string instance_id = 1;

  // A name for the promoted instance. Must be a valid keyed id
  // (`[A-Za-z0-9._-]{1,128}`, not the minted shape) that no instance has
  // ever had. Empty keeps the session's own id, which stays unnamed: its row
  // is deleted on destroy, like any minted id. Refused when the task sets
  // `stateful.promote.onName = false`. The running workload keeps the
  // `LEGION_INSTANCE_ID` it started with until it restarts.
  string new_id = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. The
  // recorded replay carries the promoted instance id.
  optional string idempotency_key = 3;
}

// Reply payload for PromoteInstance.
message PromoteInstanceReply {
  // The promoted instance's id: `new_id`, or the session id.
  string instance_id = 1;

  // The session it was promoted from.
  string promoted_from = 2;

  // The node the session runs on, which the new allocation is bound to.
  string node_id = 3;

  // The allocation the node adopts the session as.
  int64 allocation_id = 4;

  // Always true: the instance now has a row.
  bool durable = 5;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 6;
}

// Request payload for GetInstance.
message GetInstanceRequest {
  // Canonical instance id to fetch (`payments/user-42`, bare in `default`,
  // or a minted id). Clients resolve `-n` / `LEGION_NAMESPACE` into it.
  string instance_id = 1;
}

// Reply payload for GetInstance.
message GetInstanceReply {
  // The requested instance. Manager returns NotFound instead of returning
  // this field unset.
  InstanceInfo instance = 1;

  // A node has started this instance but the placement is not durable yet
  // (docs/edge-boot.md). Set only while a claim is live and unratified; the
  // moment it is confirmed the instance has an ordinary `current_alloc_id`
  // and this goes away.
  //
  // This is what makes "started but not yet confirmed" a state an operator or
  // an agent can see, rather than an instance that inexplicably has no
  // allocation while a sandbox is demonstrably running on a node.
  //
  // Derived from the reporting node's last heartbeat and held in manager
  // memory, so after a manager failover it is unset until that node's next
  // heartbeat — briefly incomplete, never wrong.
  ProvisionalClaimReport provisional = 2;

  // Node holding that claim. Empty when `provisional` is unset.
  string provisional_node_id = 3;
}

// One snapshot (see docs/suspend-and-resume.md): a point-in-time capture of
// an instance, recorded by the manager and stored on the node that took it.
message SnapshotInfo {
  // Snapshot id (`snap-<hex>`), unique within the cluster and never reused.
  string snapshot_id = 1;

  // Owning job name.
  string job_id = 2;

  // Task the snapshot was taken from.
  string task = 3;

  // Instance the snapshot was taken from.
  string instance_id = 4;

  // Optional operator-chosen name, unique within the job. Empty when the
  // snapshot was created without `--name`.
  string name = 5;

  // `memory` (guest memory, device state, root disk, and instance volume) or
  // `disk` (the instance volume only).
  string kind = 6;

  // Why the snapshot exists: `manual` (CreateSnapshot), `suspend` (an
  // instance's suspend checkpoint, SuspendInstance), or `fork` (a fork
  // checkpoint, ForkInstance, reclaimed once every fork has restored).
  string purpose = 7;

  // Lifecycle state:
  // - `capturing`: the row exists and the node has been asked to capture.
  // - `local`: captured; the bytes live on `node_id`.
  // - `published`: captured and uploaded to the capturing node's
  //   `contentStore`. Any compatible node restores it, and it survives the
  //   loss of `node_id`.
  // - `failed`: the node could not capture it; `error` says why. Failed rows
  //   expire like any other.
  // - `deleting`: DeleteSnapshot (or expiry) asked the node to reclaim it.
  // - `lost`: its node was removed from the cluster, taking the bytes with
  //   it.
  string state = 8;

  // Node holding the snapshot's bytes.
  string node_id = 9;

  // Allocation the snapshot was captured from.
  int64 allocation_id = 10;

  // Total bytes captured: memory parts plus the volume copy, as the node
  // reported them. Zero until the capture finishes.
  uint64 total_bytes = 11;

  // How long the capture took on the node, in milliseconds. For a memory
  // snapshot this includes the paused window. Zero until it finishes.
  uint64 duration_ms = 12;

  // Why the capture or the reclaim failed. Empty otherwise.
  string error = 13;

  // RFC3339 creation timestamp.
  string created_at = 14;

  // RFC3339 time after which the snapshot is deleted automatically, from the
  // task's `snapshots.ttl`. Empty when it never expires on its own.
  string expires_at = 15;

  // The snapshot manifest as JSON, once captured: the memory parts with
  // their digests and sizes, the volume snapshot refs, and the `compat`
  // block (VMM type and version, guest shape, CPU vendor, model, and feature
  // digest) that placement checks a restore against. Empty while
  // `capturing`. Returned by GetSnapshot only; ListSnapshots leaves it empty
  // to keep list replies small.
  string manifest_json = 16;

  // How long the workload was paused for the capture, in milliseconds.
  // Only a live memory capture pauses (manual or fork); 0 for a disk
  // capture, which never pauses, and until the capture finishes.
  uint64 pause_ms = 17;

  // Every name (SetSnapshotAlias, or `CreateSnapshot.name`) that points at
  // this snapshot right now.
  repeated string aliases = 18;

  // `local` (stays on `node_id`) or `store` (published once captured: the
  // state moves `local -> published`, and the manifest's memory parts gain
  // a `url` each). A `store` snapshot whose upload failed stays `local`
  // with the reason in `error` (`publish attempt N of 3 failed, retrying
  // in ...` while the manager retries, `publish failed after 3 attempts`
  // once it gives up), and keeps working from its node.
  string durability = 19;

  // RFC3339 time the upload finished. Empty unless `published`.
  string published_at = 20;

  // Which nodes hold the snapshot's memory parts right now, from this
  // manager's content location index: the capturing node while it keeps
  // them, plus every node that fetched or warmed a `published` snapshot.
  // Returned by GetSnapshot only (ListSnapshots leaves it empty), and empty
  // for a disk snapshot, whose volume copy lives in the volume driver, and
  // on a manager that holds no content reports (it just started or took
  // over). Best effort: the index is soft state, refreshed every heartbeat.
  repeated SnapshotHolder holders = 21;
}

// Request payload for CreateSnapshot.
message CreateSnapshotRequest {
  // Instance to snapshot. Its current allocation must be running.
  string instance_id = 1;

  // `disk` (default when empty) or `memory`.
  string kind = 2;

  // Optional name, unique within the job, `[A-Za-z0-9._-]{1,64}`.
  optional string name = 3;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. A retry
  // with the same key returns the snapshot the first call created.
  optional string idempotency_key = 4;

  // Publish the snapshot to the node's `contentStore` once captured
  // (`durability = "store"`), so it restores on any compatible node and
  // survives the node. Only a snapshot made entirely of content-store parts
  // can be published: a memory snapshot of a sandbox with no
  // `stateful.storage` volume. A volume snapshot lives in its driver on one
  // node, so `publish` with a disk snapshot, or with an instance that has a
  // volume, is FailedPrecondition. So is a node whose worker has no
  // `contentStore` configured (it does not advertise the `content-publish`
  // capability). Default false.
  bool publish = 5;
}

// Reply payload for CreateSnapshot.
message CreateSnapshotReply {
  // The new snapshot, in state `capturing`.
  SnapshotInfo snapshot = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh. The snapshot is then the one
  // the original call created, in whatever state it has reached since.
  bool deduplicated = 2;

  // One-line notes about side effects of this capture the caller should
  // know, printed by `legion snapshot create` as `note: ...`. Today: a live
  // memory capture of a gated sandbox on Firecracker resets the guest's open
  // network connections (Firecracker resets every vsock connection at
  // snapshot time; the guest keeps running and new connections work). Empty
  // when there is nothing to say, and on a deduplicated reply.
  repeated string notes = 3;
}

// Request payload for ListSnapshots.
message ListSnapshotsRequest {
  // Optional exact-match job filter.
  optional string job_id = 1;

  // Optional exact-match instance filter.
  optional string instance_id = 2;

  // Optional exact-match state filter (`capturing`, `local`, `published`,
  // `failed`, `deleting`, `lost`).
  optional string state = 3;

  // Namespaces to list (see `ListRolloutsRequest.namespaces`): empty means
  // `default`, `["*"]` every namespace; ignored when `job_id` is set.
  repeated string namespaces = 4;
}

// Reply payload for ListSnapshots.
message ListSnapshotsReply {
  // Matching snapshots, newest first, without `manifest_json`.
  repeated SnapshotInfo snapshots = 1;
}

// Request payload for GetSnapshot.
message GetSnapshotRequest {
  // Snapshot id, or a snapshot name. A name must be qualified with
  // `job_id`, since names are unique only within a job.
  string snapshot = 1;

  // Job the named snapshot belongs to. Ignored when `snapshot` is an id.
  optional string job_id = 2;
}

// Reply payload for GetSnapshot.
message GetSnapshotReply {
  // The snapshot, with `manifest_json`.
  SnapshotInfo snapshot = 1;
}

// Request payload for DeleteSnapshot.
message DeleteSnapshotRequest {
  // Snapshot id to delete.
  string snapshot_id = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for DeleteSnapshot.
message DeleteSnapshotReply {
  // Human-readable status message.
  //
  // Current manager reply values:
  // - `"Deleting snapshot <id>"` — the node reclaims it on its next heartbeat.
  // - `"Deleted snapshot <id>"` — removed at once (its node is gone).
  // - `"Snapshot <id> already deleting"` — no-op.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Request payload for RestoreInstance.
message RestoreInstanceRequest {
  // Keyed instance to roll back.
  string instance_id = 1;

  // Snapshot to roll back to: an id, or a name of a snapshot of this
  // instance's job.
  string snapshot = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 3;
}

// Reply payload for RestoreInstance.
message RestoreInstanceReply {
  // Human-readable status message.
  //
  // Current manager reply value:
  // - `"Restoring instance <id> from snapshot <snapshot>"`.
  string message = 1;

  // The snapshot the instance is restoring from (resolved from a name, when
  // one was given).
  string snapshot_id = 2;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 3;
}

// Named snapshots ----------------------------------------------------------

// Request payload for SetSnapshotAlias.
message SetSnapshotAliasRequest {
  // Job the name belongs to.
  string job_id = 1;

  // The name, `[A-Za-z0-9._-]{1,64}`, not starting with `snap-`.
  string name = 2;

  // The snapshot to point it at: an id, or another name of the same job.
  string snapshot = 3;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 4;
}

// Reply payload for SetSnapshotAlias.
message SetSnapshotAliasReply {
  // Human-readable status: `"Pointed <name> at <snapshot>"`, `"Moved <name>
  // from <old> to <snapshot>"`, or `"<name> already points at <snapshot>"`.
  string message = 1;

  // The snapshot id the name now points at.
  string snapshot_id = 2;

  // The snapshot id it pointed at before. Empty when the name is new.
  string previous_snapshot_id = 3;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 4;
}

// Request payload for DeleteSnapshotAlias.
message DeleteSnapshotAliasRequest {
  // Job the name belongs to.
  string job_id = 1;

  // The name to remove.
  string name = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 3;
}

// Reply payload for DeleteSnapshotAlias.
message DeleteSnapshotAliasReply {
  // Human-readable status: `"Removed <name> (it pointed at <snapshot>)"` or
  // `"No snapshot name <name> in job <job>"`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 2;
}

// Snapshot warming ---------------------------------------------------------

// Request payload for WarmSnapshot.
message WarmSnapshotRequest {
  // Snapshot id, or a snapshot name qualified with `job_id`.
  string snapshot = 1;

  // Job the named snapshot belongs to. Ignored when `snapshot` is an id.
  optional string job_id = 2;

  // Node attribute constraints, each `key=value` (for example
  // `region=us-west`, `pool=gpu`), all of which a node must match. Keys are
  // node attributes as a jobspec `constraint` block names them. Empty warms
  // every available node that can restore the snapshot.
  repeated string constraints = 3;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. Warming
  // is idempotent by nature (a node that holds the parts, or has a warm
  // queued, is skipped), so the key only replays the first reply.
  optional string idempotency_key = 4;
}

// Reply payload for WarmSnapshot.
message WarmSnapshotReply {
  // The snapshot being warmed (resolved from a name, when one was given).
  string snapshot_id = 1;

  // Nodes asked to fetch the parts on their next heartbeat.
  repeated string nodes = 2;

  // Matching nodes skipped because they already hold every part.
  repeated string already_warm = 3;

  // Matching nodes skipped because their fingerprint fails the manifest's
  // `compat` (they could never restore this memory snapshot), each as
  // `<node>: <reason>`.
  repeated string incompatible = 4;

  // Human-readable summary: `"Warming snapshot <id> on <n> node(s)"`.
  string message = 5;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 6;
}

// Work a manager asks a worker to do on a snapshot, pushed on the worker's
// `StreamWork` stream (`StreamWorkReply.checkpoint_requests`) the moment it
// becomes outstanding, and re-sent in `HeartbeatReply.checkpoint_requests`.
//
// This is the manager-to-worker half of the checkpoint channel. The push
// makes the worker start promptly; the heartbeat is the record. The manager
// re-sends every request on every heartbeat until the worker's matching
// `SnapshotReport` has been applied, so a worker that restarts, a push lost
// with its stream, or a report lost to a failed heartbeat, simply retries.
// Workers deduplicate by `snapshot_id` and `op`: a request for work already
// done re-sends the recorded report instead of redoing it. A worker forgets
// finished work only when a heartbeat reply leaves it out after a heartbeat
// that carried its report, so an older reply racing a newer push cannot
// make it redo the work.
//
// The manager only sends requests to a worker that advertised the
// `checkpoint` capability at registration.
message CheckpointRequest {
  // Snapshot the work is for. Also the content-store pin owner and the
  // volume snapshot id on the node.
  string snapshot_id = 1;

  // `capture`, `delete`, `publish`, or `warm`. Workers treat an unknown op
  // as an error and report it, so a newer manager's op is never silently
  // dropped.
  //
  // `publish` seals every memory part named by `manifest_json` with its key
  // from `part_keys`, uploads it to the worker's `contentStore`, and reports
  // the manifest with each part's `url` and `keyId` filled in. `warm`
  // fetches the parts named by `manifest_json` from their URLs, opens them
  // with their keys, and stores them in the node content store.
  string op = 2;

  // `capture`: the running allocation to capture. Unset for `delete`.
  int64 allocation_id = 3;

  // `capture`: `memory` or `disk`.
  string kind = 4;

  // `capture`: what the allocation does once captured. `resume` (keep
  // running, which manual snapshots and forks send) or `stop` (suspend).
  string then = 5;

  // `capture`: `manual`, `suspend`, or `fork`. Informational on the worker.
  string purpose = 6;

  // `delete`: the manifest JSON the capture reported, so the worker can
  // release the right content-store pins and volume snapshots. Empty when the
  // capture never finished, in which case the worker reclaims by snapshot id
  // alone. `publish`: the manifest to publish. `warm`: the published
  // manifest, whose parts carry their URLs.
  string manifest_json = 7;

  // `publish` and `warm`: one key per memory part of `manifest_json`, which
  // the worker seals each part with before it uploads it, or opens each
  // fetched part with (docs/suspend-and-resume.md, "Security"). The manager
  // derives them from the cluster's checkpoint key and sends them only with
  // the work it chose to send this worker. Empty for `capture` and `delete`,
  // and when the manager could not derive them (see `part_key_error`).
  repeated CheckpointPartKey part_keys = 8;

  // Why `part_keys` is empty or incomplete: the keyring is locked on the
  // manager, the cluster has no checkpoint key yet, or a part names a key
  // the cluster no longer has. The worker fails the work with this message.
  // Empty when every key is present.
  string part_key_error = 9;

  // `publish` of a suspend checkpoint whose task sets `suspend.archive`
  // (docs/suspend-and-resume.md, "Archived instances"): once every part is
  // uploaded, the worker also writes an archive manifest to this object
  // name under its `contentStore` root
  // (`manifests/<job>/<group>/<task>/<instance>.json`) and reports its URL
  // in `SnapshotReport.manifest_url`. The publish fails, and is retried
  // like any failed publish, when that write fails. Empty for every other
  // piece of work.
  string manifest_object = 10;

  // With `manifest_object`: the identity envelope the manager needs to
  // rebuild the instance and its snapshot row on resume, as JSON (instance
  // id, job, group, task, the snapshot's kind and capture metadata). The
  // worker writes it verbatim as the archive manifest's `envelope`, beside
  // the published checkpoint manifest, and does not interpret it.
  string manifest_envelope = 11;

  // `publish`: the snapshot's job's chunk key. A published part is stored
  // as fixed-size chunks plus a sealed index (docs/suspend-and-resume.md,
  // "How published parts are stored"), and the worker derives each chunk's
  // key from this one, scoped to its current dedup window, so a chunk the
  // job already uploaded in the window is not uploaded again. Unset for
  // every other op, and when the manager could not derive it (the reason is
  // in `part_key_error`, and the publish fails).
  CheckpointChunkKey chunk_key = 12;
}

// A job's chunk key (docs/suspend-and-resume.md, "Published checkpoint
// encryption"): HKDF-SHA256 of the job's session sealing key with the
// context `chunks`, so the manager (for a keyed snapshot's publish) and a
// session's node (with no manager on the path) derive the same key, and
// checkpoints of one job share chunks whichever path published them. A
// worker holding it can name and seal chunks of that job only. It cannot
// open any part index, whose key comes from the part key. The generated
// Rust type redacts `key` from Debug output and never serializes it.
message CheckpointChunkKey {
  // `<checkpoint key id>/session/<job>/chunks`. Informational: chunk keys
  // are recorded in each part's sealed index, so a reader never needs it.
  string key_id = 1;

  // 32 bytes. Never logged and never written to disk.
  bytes key = 2;
}

// The key for one published checkpoint part. A worker receives it with the
// publish, warm, or restore work that needs it and keeps it in memory only.
// The generated Rust type redacts `key` from Debug output and never
// serializes it.
message CheckpointPartKey {
  // `sha256:<hex>` of the part's plaintext, as in the manifest.
  string digest = 1;

  // The checkpoint key this part key is derived from (`ck_…`), recorded in
  // the published manifest as the part's `keyId`.
  string key_id = 2;

  // 32 bytes. Derives both the AES-256-GCM key the part is sealed under and
  // the name of the sealed object in the content store.
  bytes key = 3;
}

// A session sealing key (session durability plan §6.6,
// docs/session-mode.md "Idle sessions"). An unpromoted session with
// `suspend.durability = "store"` publishes its checkpoint parts with no
// manager on the path, so the node cannot ask for a part key per digest
// the way a keyed snapshot's publish does. Instead every envelope payload
// of a job whose session task sets `durability = "store"` carries one key
// per checkpoint key in the cluster keyring, derived for that job:
// HKDF-SHA256 of the checkpoint key with the job name as context. A node
// derives each part's key from it exactly as the manager derives a keyed
// part's key from the checkpoint key itself, so parts are still sealed per
// digest, and any node holding an envelope of the job can open the
// session checkpoints of that job and no other. Workers never see the
// checkpoint key. The generated Rust type redacts `key` from Debug output
// and never serializes it, so it never reaches the worker's state file or
// session log.
message SessionSealKey {
  // `<checkpoint key id>/session/<job>`: recorded as the `keyId` of every
  // part sealed under it, so a node opening the part finds the key again
  // after the keyring rotates.
  string key_id = 1;

  // 32 bytes. Never logged and never written to disk.
  bytes key = 2;
}

// The outcome of one piece of checkpoint work, reported by a worker in
// `HeartbeatRequest.snapshot_reports` (the worker-to-manager half of the
// checkpoint channel).
message SnapshotReport {
  // Snapshot the outcome is for.
  string snapshot_id = 1;

  // `capture`, `delete`, `restore`, `publish`, or `warm`.
  string op = 2;

  // Whether the work succeeded.
  bool ok = 3;

  // Why it failed. Empty on success.
  string error = 4;

  // `capture`: the manifest JSON (memory parts with digests, volume refs,
  // `compat`). `publish`: the same manifest with each memory part's `url`
  // set. Empty for other ops or on failure.
  string manifest_json = 5;

  // `capture`, `restore`, `publish`, and `warm`: wall time on the worker,
  // in milliseconds.
  uint64 duration_ms = 6;

  // `capture`: total bytes captured. `publish` and `warm`: bytes actually
  // moved (0 when the destination already held every part). Zero otherwise.
  uint64 total_bytes = 7;

  // `capture`: the allocation captured. `restore`: the allocation that was
  // started from the snapshot.
  int64 allocation_id = 8;

  // A `capture` the worker took on its own, with no CheckpointRequest: the
  // memory pressure response's `suspend` step checkpointed and stopped the
  // allocation (its task sets `suspend.onPressure = true`), and
  // `snapshot_id` is an id the worker minted. The manager has no snapshot
  // row for it, so it inserts one (`purpose = suspend`, `state = local`) and
  // applies the same suspend transaction a SuspendInstance capture does, with
  // `suspend_reason = pressure`. When the instance has moved on (stopped,
  // destroyed, or rescheduled while the node was out of contact), the row is
  // inserted as `deleting` instead, and the node reclaims the checkpoint.
  // The worker re-sends the report on every heartbeat until the manager
  // drops the allocation from its desired set, so a report lost to a failed
  // heartbeat or a manager failover still lands. Only successful captures
  // are reported this way: a failed one resumes the task and reports
  // nothing.
  bool local_suspension = 9;

  // `capture`: how long the workload was paused, in milliseconds (a live
  // memory capture only; 0 otherwise). Older workers leave it 0.
  uint64 pause_ms = 10;

  // `publish` with `CheckpointRequest.manifest_object`: the URL of the
  // archive manifest the worker wrote (`s3://…` or `file://…`). The
  // manager archives the suspended instance in the same transaction that
  // marks the snapshot published: it drops the snapshot row and records
  // this URL on the instance. Empty otherwise.
  string manifest_url = 11;
}

// A snapshot an allocation should start from instead of booting, attached
// to `TaskAllocation.restore` while its instance is restoring.
message SnapshotRestore {
  // The snapshot to restore.
  string snapshot_id = 1;

  // `memory` or `disk`.
  string kind = 2;

  // The snapshot manifest JSON. The worker restores the volume refs it names
  // with the driver's `restore` op before mounting, and for a memory
  // snapshot loads the memory parts (looked up by digest in the node content
  // store) instead of calling the runtime's `start`. A part missing from the
  // node content store that carries a `url` (a published snapshot) is
  // fetched first, through the worker's artifact fetchers, opened with its
  // key from `part_keys`, verified against its digest, and stored in the
  // content store. A `url` under the worker's own `contentStore.url` is
  // fetched with that worker's `contentStore.auth` (or its ambient AWS
  // credentials). Any other `url` is fetched anonymously, and a refusal says
  // the worker has no credential for that store. The allocation shows
  // `staging artifacts` meanwhile.
  string manifest_json = 3;

  // The task's `suspend.onResume` argv. After a memory restore the guest
  // agent runs it once the guest's identity is refreshed (new allocation id,
  // hostname, workload-identity token, reseeded RNG, resynced clock). Empty
  // when the task declares none; ignored for a disk restore, which boots
  // fresh and runs the task's own startup instead.
  repeated string on_resume = 4;

  // The allocation restores into a NEW instance, not the one the snapshot
  // was taken from (ForkInstance, or CreateInstance(s) `from_snapshot`).
  // The worker then clones the snapshot's volumes into the allocation's own
  // instance volumes (the driver's `clone` op) instead of rolling them back,
  // and for a memory restore gives the guest a new MAC and, when its NIC is
  // wired to a TAP device, a TAP device of its own.
  bool fork = 5;

  // The instance the allocation serves. The guest's identity refresh
  // re-exports it as `LEGION_INSTANCE_ID`, which a fork must change.
  string instance_id = 6;

  // One key per published memory part of `manifest_json`, to open the
  // sealed parts this worker has to fetch. Only a part missing from the
  // node content store needs its key, so a restore on the node that holds
  // every part succeeds without them. Empty for a snapshot that was never
  // published.
  repeated CheckpointPartKey part_keys = 7;

  // Why `part_keys` is empty or incomplete (a locked keyring on the
  // manager, or a part sealed under a key the cluster no longer has). A
  // restore that has to fetch such a part fails with this message.
  string part_key_error = 8;
}

// === VOLUME MESSAGES (see docs/volumes.md) ===

// One volume: the concrete storage behind an instance's opaque
// `{driver}/{volume_id}` storage handle.
message VolumeInfo {
  // Volume id — the second half of the storage handle.
  string volume_id = 1;

  // Declared name within its task. `data` for the per-instance volume that
  // comes from `stateful.storage`; otherwise the name from `volumes[]`.
  string name = 2;

  // Volume driver that materializes it (`local-dir`, `host`, `nfs`, `tmpfs`,
  // or an installed exec driver).
  string driver = 3;

  // Owning job, when the volume belongs to one.
  optional string job_id = 4;

  // The instance whose lifecycle owns this volume. Unset for volumes that
  // outlive any instance.
  optional string instance_id = 5;

  // Task the volume was declared on.
  optional string task_name = 6;

  // Lifecycle state:
  // - `pending`: the row and handle exist; no worker has materialized it yet
  //   (provisioning is lazy — the first mount creates the storage);
  // - `created`: a worker mounted it at least once, and `node_id` is set;
  // - `destroying`: reclaim requested; a worker runs the driver's `destroy`
  //   and confirms (re-dispatched every heartbeat until it does);
  // - `destroyed`: reclaimed. The row is kept as a tombstone.
  string state = 7;

  // Node the volume lives on. For node-local drivers this is a hard placement
  // constraint on the owning instance from the moment it is set: a
  // replacement allocation can only be placed on this node.
  optional string node_id = 8;

  // True when the volume only exists on `node_id`, so its instance can only be
  // replaced there. False for network storage (`nfs`), whose instances
  // reschedule freely.
  bool node_local = 9;

  // True when the volume is mounted read-only.
  bool read_only = 10;

  // How the volume is handed to its consumer: `filesystem` (a host directory
  // the task reads directly) or `block` (a raw device or disk image the task
  // attaches — what a microVM runtime needs). The same split Kubernetes makes
  // with `volumeMode`, for the same reason. See docs/volumes.md.
  string volume_mode = 17;

  // Block mode: the filesystem the device carries (`ext4`). Unset for
  // filesystem-mode volumes.
  optional string fs = 18;

  // JSON object of the driver params the volume was created with.
  string params = 11;

  // JSON object of driver-recorded metadata (an NFS source, a dataset name),
  // handed back to the driver on every later operation.
  string attrs = 12;

  // Host path from the most recent successful mount. Diagnostic only — the
  // driver is always asked again rather than trusting this.
  optional string mount_path = 13;

  // Last driver failure, so a stuck volume explains itself here rather than
  // only in a worker log.
  optional string last_error = 14;

  // RFC3339 creation timestamp.
  string created_at = 15;

  // RFC3339 timestamp of the last state change.
  string updated_at = 16;
}

// Request payload for ListVolumes. Every filter is optional; omitting all of
// them lists every live volume in the cluster.
message ListVolumesRequest {
  // Only volumes owned by this job.
  optional string job_id = 1;

  // Only volumes currently living on this node.
  optional string node_id = 2;

  // Only volumes materialized by this driver.
  optional string driver = 3;

  // Only volumes owned by this instance.
  optional string instance_id = 4;

  // Only volumes in this state (`pending`, `created`, `destroying`,
  // `destroyed`). Asking for `destroyed` returns tombstones whatever
  // `include_destroyed` says.
  optional string state = 5;

  // Also return `destroyed` tombstones: volumes whose storage the driver
  // already reclaimed, kept as records of where a job's storage went. Off by
  // default, so a destroyed instance's volume drops out of the list once its
  // reclaim is confirmed. `legion volume list --all` sets it.
  bool include_destroyed = 6;

  // Namespaces to list (see `ListRolloutsRequest.namespaces`): empty means
  // `default`, `["*"]` every namespace; ignored when `job_id` is set. A
  // volume no job owns is listed only under `*`.
  repeated string namespaces = 7;
}

// Reply payload for ListVolumes.
message ListVolumesReply {
  // Matching volumes, newest first.
  repeated VolumeInfo volumes = 1;
}

// Request payload for GetVolume.
message GetVolumeRequest {
  // Volume id to fetch.
  string volume_id = 1;
}

// Reply payload for GetVolume.
message GetVolumeReply {
  // The requested volume. Manager returns NotFound instead of returning this
  // field unset.
  VolumeInfo volume = 1;
}

// Request payload for DeleteVolume.
message DeleteVolumeRequest {
  // Volume id to delete.
  string volume_id = 1;

  // Skip driver confirmation and mark the volume destroyed immediately. Use
  // only when the owning node is gone for good: whatever bytes exist there are
  // left behind.
  bool force = 2;

  // Optional idempotency key; a repeat with the same key returns the first
  // result and reports `deduplicated`.
  optional string idempotency_key = 3;
}

// Reply payload for DeleteVolume.
message DeleteVolumeReply {
  // The volume after the request, in `destroying` (queued for its driver) or
  // `destroyed` (forced).
  VolumeInfo volume = 1;

  // Human-readable acknowledgement.
  string message = 2;

  // True when an idempotency key replayed a previous call.
  bool deduplicated = 3;
}

// Request payload for ListVolumeDrivers.
message ListVolumeDriversRequest {
}

// One volume driver as the cluster sees it, aggregated from worker
// fingerprints.
message VolumeDriverInfo {
  // Driver name, as used in `stateful.storage.driver` / `volumes[].driver`.
  string name = 1;

  // True when the driver's volumes only exist on the node that created them,
  // so instances holding one are pinned there.
  bool node_local = 2;

  // True when volume contents do NOT survive an unmount (`tmpfs`). Rejected
  // for `stateful.storage`, which promises data survives reschedules.
  bool ephemeral = 3;

  // Access modes the driver supports (`single-writer`, `multi-reader`).
  repeated string access_modes = 4;

  // Params a job MUST supply. Admission names any that are missing.
  repeated string required_params = 5;

  // Params a job MAY supply.
  repeated string optional_params = 6;

  // Volume modes this driver can serve (`filesystem`, `block`). Admission
  // intersects this with the task runtime's supported modes and the job's
  // requested mode, so a mismatch is a submit-time error rather than a task
  // that starts and immediately fails.
  repeated string volume_modes = 10;

  // Optional contract operations this driver implements beyond the required
  // four (`snapshot`, `restore`, `clone`, `expand`). Empty for a driver that
  // implements only the required set.
  repeated string ops = 11;

  // One line of human-readable context: what the driver does, or why it is
  // unusable on the nodes that have it.
  string detail = 7;

  // Every node with the driver installed, including ones where it is unusable
  // (no `mount` binary, wrong OS, no host volumes declared).
  repeated string nodes = 8;

  // Nodes where the driver is installed AND usable — the set placement can
  // actually use.
  repeated string available_nodes = 9;
}

// Reply payload for ListVolumeDrivers.
message ListVolumeDriversReply {
  // Installed drivers, sorted by name.
  repeated VolumeDriverInfo drivers = 1;
}

// Request payload for ListJobs.
message ListJobsRequest {
  // Free-text search against job name, ID, and status.
  optional string query = 1;

  // Sort key. Supported values: `name`, `status`, `created_at`, `updated_at`.
  //
  // Default: `updated_at`.
  optional string sort_by = 2;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `desc`.
  optional string sort_order = 3;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 4;

  // Maximum jobs returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 5;

  // Keep only jobs whose derived status (see `Job.status`) equals this value
  // (case-insensitive, exact — `run` does not match `running`; use `query`
  // for substring search).
  // Applied after `query` and before paging, so `total_count` reflects the
  // filtered set. Omit or leave empty to return every status.
  optional string status = 6;

  // Namespaces to list: names or `*`-globs (`payments-*`), each entry
  // optionally a comma-separated list. Empty means `default`; `["*"]` means
  // every namespace. Whatever the selection, only jobs the caller may read
  // are returned — `*` widens what is considered, never what is visible.
  repeated string namespaces = 7;
}

// Job metadata record.
message Job {
  // Canonical job id: `namespace/name`, or the bare name for a job in the
  // `default` namespace. Every field that names a job accepts it.
  string id = 1;

  // Job name, without the namespace.
  string name = 2;

  // Job status, derived from the job's workload each time it is read. First
  // match wins:
  //
  // - `stopped`: `StopJob` stopped the job. `RunJob` brings it back.
  // - `failed`: a required KV dependency vanished (`onDelete: fail`), or
  //   nothing is live and a task's last run failed (it spent its restart and
  //   move budgets, or exited unsuccessfully under a policy that does not
  //   restart it).
  // - `running`: at least one allocation of any version of the job is live
  //   (placed and not yet terminal).
  // - `blocked`: nothing is live, and the job's eval found no room for a
  //   placement and waits for capacity that could help (docs/
  //   scheduler-and-eval-loop.md, "Blocked evals"). It places on its own when
  //   that capacity appears; `blocked` below says what it waits for. Takes
  //   the place `pending` would have.
  // - `pending`: nothing is live, and a task that wants an allocation has not
  //   finished: it is waiting to be placed or waiting on a `dependsOn`
  //   condition.
  // - `scheduled`: nothing is live, nothing is pending, and a cron task
  //   (`schedule`) finished its last run and waits for the next one.
  // - `complete`: nothing is live, and every task that wants an allocation
  //   finished successfully. A batch job reads this once it is done.
  // - `suspended`: no task wants an allocation, and at least one keyed
  //   instance is suspended.
  // - `idle`: no task wants an allocation: every task is scaled to zero, or
  //   a keyed task has no pending, active, or rescheduling instances.
  //
  // Task outcomes come from the job's latest spec version; live allocations
  // count from every version, so a job mid-rollout reads `running`. The
  // state store's `job.status` column is not this value: it holds the
  // lifecycle flag (`active`, `stopped`, `failed`) the derivation starts
  // from.
  string status = 3;

  // Unix timestamp (seconds) when job was created. Immutable for the life of
  // the job — resubmitting a new spec version does not move it.
  int64 created_at = 4;

  // Unix timestamp (seconds) of the last change to the job, and the value the
  // UI's "Updated" column shows. Stamped when a new spec version is submitted
  // and on every status transition the manager records (`stopped`, `failed`,
  // recovery back to `done`, and an acknowledged restart request). Never
  // moved by allocation churn, heartbeats, or reads.
  //
  // Equals `created_at` for a job that has not changed since submission, and
  // for rows written by a manager older than the column (backfilled once at
  // migration time).
  int64 updated_at = 5;

  // Priority band of the job's latest config: `critical`, `high`,
  // `elevated`, `normal` (the default), `low`, or `background`.
  //
  // The band orders the eval queue and governs preemption: an allocation may
  // only ever be displaced by a job in a STRICTLY higher band, never by a
  // peer. See docs/preemption-and-eviction.md. Empty only when read from a
  // manager that predates bands.
  string priority = 6;

  // Set while the job has an eval blocked on capacity
  // (docs/scheduler-and-eval-loop.md, "Blocked evals"), whatever `status`
  // reads: a job with a live allocation reads `running` and still says here
  // what its other placements wait for; with nothing live it reads
  // `blocked`. Unset for a job stopped or failed by its lifecycle.
  optional JobBlocked blocked = 7;

  // Replacements of failed allocations still waiting out their reschedule
  // backoff, soonest next attempt first (docs/jobs-tasks-and-scheduling.md,
  // "Manager-side move logic"). A job whose only replica waits here reads
  // `pending`, and nothing places the replica before its `next_attempt_at`;
  // `legion job run <spec> --force-reschedule` lifts every backoff of the
  // job and places them now. Set by GetJobInfo only; ListJobs leaves it
  // empty.
  repeated RescheduleBackoff reschedule_backoffs = 8;

  // The namespace the job lives in (docs/namespaces.md). `default` for a
  // job whose `id` has no namespace segment.
  string namespace = 9;
}

// What a blocked job waits for.
message JobBlocked {
  // The blocking key: `class:pool=<pool>[,<attr>=<value>...]` (any node of
  // that pool whose attributes match the task's `=` constraints can help),
  // `node:<id>` (a resume pinned to the node holding its checkpoint or
  // node-local storage), or `escaped` (the cluster had no schedulable node at
  // all; any capacity wakes it).
  string key = 1;

  // The task that could not place.
  string task = 2;

  // What one placement of `task` asks for that no eligible node had free:
  // `cpu` (e.g. `500MHz`) and `memory` (e.g. `512MiB`), for the resources the
  // task declares. Per placement, not the job's total.
  map<string, string> shortfall = 3;

  // The scheduler's diagnosis, the message the eval used to fail with.
  string message = 4;

  // Unix timestamp (seconds) when the eval blocked.
  int64 since = 5;

  // The blocked eval's id.
  string eval_id = 6;

  // Set when the task that could not place is a gang
  // (docs/gang-scheduling.md): how many of its replicas fit at the last
  // attempt, against the quorum it must place together. `would_place` is
  // always false here. Unset for every other task.
  GangReport gang = 7;
}

// Reply payload for ListJobs.
message ListJobsReply {
  // Jobs known to manager for the requested page.
  repeated Job jobs = 1;

  // Number of jobs per status string (`running`, `stopped`, `failed`, …),
  // counted over every job the caller may read that matches `query` — BEFORE
  // the `status` filter and before paging. A client rendering a status filter
  // can therefore show stable counts on every option while one is selected.
  // Statuses with no jobs are absent rather than zero.
  map<string, uint32> status_counts = 5;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;

  // Jobs the caller may read in namespaces the request did NOT select, and
  // how many namespaces they are spread over — so an empty list can say
  // "14 jobs in 2 other namespaces you can read; use -A" instead of
  // looking like the jobs are gone. Zero when the request selected `*`.
  uint32 elsewhere_count = 6;
  uint32 elsewhere_namespaces = 7;
}

// Request payload for IssueWorkloadIdentityToken.
message IssueWorkloadIdentityTokenRequest {
  // Allocation the token is requested for. Must exist and be placed on
  // `node_id`. All token claims are derived from this allocation's
  // scheduling record on the manager — never from the request.
  int64 alloc_id = 1;

  // Name of the identity declared in the allocation's task spec
  // (`identities[].name`). Selects the audience, TTL, subject template,
  // delivery, and extra claims. Unknown names are rejected with NotFound.
  string identity_name = 2;

  // Node id of the calling worker (the same id used in Heartbeat). The
  // manager rejects the request with PermissionDenied unless the allocation
  // is placed on this node. See the RPC comment for the trust model.
  string node_id = 3;
}

// Reply payload for IssueWorkloadIdentityToken.
message IssueWorkloadIdentityTokenReply {
  // The signed JWT (ES256, `kid` header references a key in the published
  // JWKS). Treat as a secret: never log it; deliver it only to the task it
  // was issued for.
  string token = 1;

  // Token expiry (`exp`) as Unix seconds. Workers schedule the refresh loop
  // from this (re-issue at roughly half the remaining TTL).
  int64 expires_at = 2;

  // Echo of the identity name the token was issued for.
  string name = 3;
}

// Request payload for IssueNodeIdentityToken.
message IssueNodeIdentityTokenRequest {
  // The worker node the token is requested for. Must be registered and must
  // match the caller's authenticated per-node credential.
  string node_id = 1;

  // Name of the node identity declared under `workloadIdentity.nodeIdentities`.
  // Selects the audience, TTL, and subject template. Unknown names → NotFound.
  string identity_name = 2;
}

// Reply payload for IssueNodeIdentityToken.
message IssueNodeIdentityTokenReply {
  // The signed JWT (ES256). Treat as a secret: never log it.
  string token = 1;

  // Token expiry (`exp`) as Unix seconds.
  int64 expires_at = 2;

  // Echo of the node identity name the token was issued for.
  string name = 3;
}

// Request payload for GetMeshCa.
message GetMeshCaRequest {}

// Reply payload for GetMeshCa.
message GetMeshCaReply {
  // The CA certificate that signs leaves, PEM; empty when none exists yet
  // or the provider could not supply one (see `problem`). For `file` and
  // `exec` this is often an intermediate under the organization's root.
  string cert_pem = 1;

  // When the signing CA was created (`builtin`), or its `notBefore` (other
  // providers), RFC 3339; empty when none exists.
  string created_at = 2;

  // Every CA a holder should trust, PEM, the anchor (the CA `pin` names)
  // first. `builtin`: the signing CA, then the previous CA while a
  // rotation's overlap lasts. `file`: `clusterCa.bundlePath`, or the
  // signing CA itself when unset. `exec`: what the provider's `describe`
  // reports. Clients that verify node or manager certificates
  // (`legion sandbox start --node`, direct exec) use this, not `cert_pem`.
  string bundle_pem = 3;

  // The pin (`sha256:<hex of its DER>`) of the trust-bundle CA the signing
  // CA chains to — the signing CA itself for `builtin` — as join tokens
  // carry it in `caHash`.
  string pin = 4;

  // Where a built-in rotation stands: `stable` (one CA) or `overlap` (the
  // new CA signs and the previous one is still trusted until
  // `overlap_until`). Always `stable` for `file` and `exec`, which rotate
  // outside Legion.
  string phase = 5;

  // When the previous CA leaves the bundle (RFC 3339); empty when `stable`.
  string overlap_until = 6;

  // The previous CA certificate, PEM, while it is still trusted; empty
  // otherwise.
  string previous_cert_pem = 7;

  // Which provider supplies the CA on the answering manager: `builtin`,
  // `file`, or `exec` (`clusterCa.provider`, docs/cluster-ca.md). Set even
  // when no CA exists yet.
  string provider = 8;

  // Where the provider's CA comes from, for display: the certificate (and
  // bundle) paths for `file`, the command for `exec`; empty for `builtin`.
  string provider_location = 9;

  // The certificates a leaf carries after itself, PEM: the intermediates
  // between a leaf and the anchor, or (`builtin`, during a rotation's
  // overlap) the new CA cross-signed by the previous one. Empty when the
  // signing CA is itself in the trust bundle.
  string chain_pem = 10;

  // Why this manager will not sign right now, or what is degraded; empty
  // when the CA is healthy. Examples: the provider's command failed (with
  // its stderr), the CA files changed and cannot be used (the previous CA
  // keeps signing), or this manager's CA and the one the control-lane
  // leader recorded do not trust each other (both pins and the recording
  // manager are named). While it names a disagreement, the manager signs
  // no certificates and mints no join tokens.
  string problem = 11;
}

// Request payload for RotateMeshCa.
message RotateMeshCaRequest {}

// Reply payload for RotateMeshCa (built-in provider only).
message RotateMeshCaReply {
  // The new CA certificate, PEM.
  string cert_pem = 1;

  // When it was created (RFC 3339).
  string created_at = 2;

  // The new CA's pin (`sha256:<hex>`), which join tokens minted from now on
  // carry.
  string pin = 3;

  // When the previous CA leaves the trust bundle (RFC 3339): one node
  // certificate lifetime from now.
  string overlap_until = 4;
}

// Request payload for IssueNodeCertificate.
message IssueNodeCertificateRequest {
  // The worker node the certificate is for. Must match the caller's
  // authenticated per-node credential.
  string node_id = 1;

  // Required. A PEM certificate signing request for a key the worker
  // generated and keeps. Only its public key is used; the manager chooses
  // the certificate's names.
  string csr_pem = 2;

  // Simulator only: sign a fleet certificate (`<fleet>.fleet.legion`,
  // `legion://fleet/<fleet>`) instead of a node certificate. The node must
  // have registered with config attribute `workerFleet` equal to this name.
  // Empty for every real worker.
  string fleet = 3;
}

// Reply payload for IssueNodeCertificate.
message IssueNodeCertificateReply {
  // The node certificate chain, PEM, leaf first. SANs: `<node>.node.legion`
  // and `legion://node/<node id>` (or the fleet names for a fleet
  // certificate). After the leaf come the intermediates between it and the
  // trust bundle (a `file`/`exec` provider's signing CA when it is not
  // itself in the bundle), or, during a built-in rotation's overlap, the new
  // CA cross-signed by the previous one.
  string cert_pem = 1;

  reserved 2;
  reserved "key_pem";

  // The cluster CA trust bundle, PEM, anchor first: the built-in signing
  // CA plus the previous CA while a rotation's overlap lasts, or what a
  // `file`/`exec` provider trusts (docs/cluster-ca.md). What a node
  // verifies managers and peers against. A worker joining with a token
  // checks that this bundle contains the token's pinned CA before trusting
  // it.
  string ca_pem = 3;

  // Certificate expiry as Unix seconds.
  int64 expires_at = 4;
}

// One piece of material a node asks for: what kind, and what it is for.
// Never where the value lives; the manager derives that (see
// `FetchDatapathMaterial`).
message MaterialRef {
  // `policy`, `port_cert`, `client_ca`, `upstream_ca`, or `credential`.
  string kind = 1;

  // The allocation (manager-facing id) the material is for. 0 for `policy`,
  // which is shared by content hash.
  int64 allocation_id = 2;

  // `policy`: the content hash. `port_cert` and `client_ca`: the port
  // label. `upstream_ca` and `credential`: the upstream's key (its `name`,
  // or the catalog service its `to` names).
  string key = 3;

  // `credential`: the injected header, lower-cased. Empty otherwise.
  string part = 4;

  // The version the worker already holds, or 0 for none: the KV entry's
  // version, or an identity token's expiry in unix seconds. Unused for
  // `policy` (a hash never changes).
  int64 version = 5;
}

// The answer for one `MaterialRef`.
message Material {
  // The ref this answers, echoed as sent.
  MaterialRef ref = 1;

  // Where the value comes from, as the declaration names it: `kv
  // certs/app`, `identity api`, or `policy <hash>`. Set even when `error`
  // is, so the worker can report which key is at fault.
  string source = 2;

  // The value's current version (see `MaterialRef.version`). The worker
  // sends it back next time.
  int64 version = 3;

  // True when the version the worker sent is still current. No value is
  // returned.
  bool unchanged = 4;

  // The material: an `EffectivePolicy` as JSON (`policy`), a PEM bundle
  // (`port_cert`), a CA bundle (`client_ca`, `upstream_ca`), or a header
  // value (`credential`). Treat as a secret:
  // never log it, never write it to disk.
  string value = 5;

  // Why no value was returned. Empty on success.
  string error = 6;

  // True when `error` is authoritative: the key or the declaration is gone,
  // so the worker drops what it holds instead of keeping it.
  bool absent = 7;
}

// Request payload for FetchDatapathMaterial.
message FetchDatapathMaterialRequest {
  // The worker node asking. Must match the caller's authenticated per-node
  // credential.
  string node_id = 1;

  // What the node's datapath needs: policy bodies it holds an assignment
  // without a body for, and the certificates and credentials its
  // allocations declare.
  repeated MaterialRef refs = 2;
}

// Reply payload for FetchDatapathMaterial.
message FetchDatapathMaterialReply {
  // One entry per requested ref, in request order.
  repeated Material materials = 1;
}

// Request payload for Heartbeat.
message HeartbeatRequest {
  // Worker/node ID sending heartbeat.
  //
  // With ACLs enforced it must match the node token on the request (a
  // management token may heartbeat for any node); a mismatch is refused with
  // `PERMISSION_DENIED`.
  string id = 1;

  // Allocation IDs currently known/running on worker. Informational: the
  // manager decides the desired set from its own rows, not from this list.
  // A worker that reports `work_stream` leaves it empty (the digest stands
  // in for it).
  //
  // Default: empty list.
  repeated int64 allocation_ids = 2;

  // Allocations that failed on worker since last heartbeat.
  //
  // Default: empty list.
  repeated FailedAllocation failed_allocations = 3;

  // Per-allocation health snapshots from worker. A worker without
  // `work_stream` sends every allocation's health on every beat. A worker
  // on the stream sends only the snapshots that changed since the last
  // reply that set `HeartbeatReply.desired_via_stream`, and everything again
  // after any other reply. Either way the manager writes only the rows whose
  // values changed, so a steady beat writes nothing.
  //
  // Default: empty list.
  repeated AllocationHealth allocation_health = 4;

  // Volume operation outcomes since the last heartbeat (see
  // docs/volumes.md). Workers own the drivers; the manager owns the volume
  // state machine, and this is how driver results get back to it: a
  // successful mount pins the volume's node, a failure is recorded on the
  // row (and surfaced by `legion volume list`), and a confirmed destroy is
  // what advances a volume from `destroying` to `destroyed`.
  //
  // Default: empty list.
  repeated VolumeReport volume_reports = 5;

  // Allocations whose task process reached a terminal state since the last
  // heartbeat *without* failing — the task exited with a status its `restart`
  // policy treats as done (see docs/task-supervision.md). Failures travel in
  // `failed_allocations` instead, because the manager reschedules those.
  //
  // This is what makes a batch task's success real: the manager marks the
  // allocation complete and the task successful only when a worker says the
  // process exited successfully, instead of assuming it at placement.
  //
  // Sent only by workers at protocol version 2 and above.
  //
  // Default: empty list.
  repeated TerminatedAllocation terminated_allocations = 6;

  // Unratified provisional allocations this node is currently holding (see
  // docs/edge-boot.md). Reported on every heartbeat so started-but-
  // unconfirmed work is visible to an operator looking at capacity, and so a
  // manager that already decided a claim can re-deliver its verdict in
  // `HeartbeatReply.claim_verdicts` when the `RatifyClaim` reply was lost.
  //
  // Claims disappear from this list the moment they are confirmed (they
  // become ordinary allocations and appear in `allocation_ids`) or killed.
  //
  // Default: empty list — nodes running only committed work pay nothing.
  repeated ProvisionalClaimReport provisional_claims = 7;

  // Denials the node datapath recorded since the last heartbeat, one entry
  // per distinct (allocation, direction, destination, rule), with a count.
  // The manager turns each into a `net_denied` event carrying the job,
  // allocation, matched rule, destination, and identity, so "which rule
  // blocked it" is answerable from the event stream without node access.
  // Bounded: a node reports at most 256 entries per heartbeat and folds the
  // rest into a single `truncated` entry.
  repeated NetDenial net_denials = 8;

  // The node datapath's view of each desired allocation's networking: its
  // mode, whether its namespace and listeners are ready, which policy hash
  // it is enforcing. `legion net doctor` and the UI read this back through
  // ShowNetPolicy so "is it enforced?" is answered by the node that
  // enforces it, not inferred by the manager.
  repeated NetAllocStatus net_status = 9;

  // The service graph's raw material: what each allocation's datapath saw
  // per (upstream service, endpoint tag) since the last heartbeat — request
  // and connection counts, errors, denials, latency, bytes. Deltas, folded
  // by the manager into per-(caller, service) windows for ListServiceEdges.
  // Restored on a failed heartbeat like every other report on this request.
  repeated NetEdgeSample net_edges = 10;

  // Measured memory and CPU for this node and its governed allocations
  // (docs/resource-enforcement.md, "Measuring usage"). Sent only by workers
  // with `resourceEnforcement.enabled`, and only on the heartbeat that falls
  // due after each 10-second report interval, so most heartbeats carry
  // nothing here. The manager keeps the latest report per node in memory and
  // never writes it to the state store.
  //
  // Absent on every heartbeat from a worker that predates usage reporting,
  // which the manager treats exactly like a worker with enforcement off.
  optional UsageReport usage = 11;

  // What the node's memory pressure response did since the last successful
  // heartbeat (docs/resource-enforcement.md, "Memory pressure"). The worker
  // acts first, because waiting on the manager while a node runs out of
  // memory would be wrong, and reports here afterwards. Restored and re-sent
  // on a failed heartbeat, like every other report on this request.
  //
  // The manager turns each entry into a `node.pressure` event. For the
  // eviction steps it also removes the allocation with
  // `cause = node_pressure` and asks the scheduler to replace it, exactly as
  // for any other platform-initiated stop. An entry naming an allocation the
  // manager does not place on this node is logged and ignored.
  //
  // Empty on every heartbeat of a node that was never short of memory, and
  // from every worker that predates the pressure response.
  repeated PressureAction pressure_actions = 12;

  // Outcomes of checkpoint work since the last heartbeat (see
  // `CheckpointRequest` for the channel's contract): a capture's manifest or
  // error, a delete's confirmation, and whether an allocation started from a
  // `TaskAllocation.restore` payload succeeded. Re-sent by the worker
  // whenever the manager re-sends the request it answers, and restored on a
  // failed heartbeat like every other report on this request.
  //
  // A worker does not hold a fresh outcome for its next scheduled beat: it
  // sends a heartbeat at once, so a suspend, resume, fork, publish, or warm
  // settles one round trip after the node finishes it. A delete's
  // confirmation is the exception (nothing waits on it), and rides the next
  // scheduled beat. The out-of-band beat is an ordinary heartbeat, carrying
  // everything else the worker has to report, so the manager sees the
  // outcome and the node's other changes in the order they happened.
  //
  // Default: empty list.
  repeated SnapshotReport snapshot_reports = 13;
  // Content locality: what this node's content store holds, for the manager's location index
  // (docs/artifacts.md, "Content locality"). The scheduler's `locality`
  // score term reads that index to prefer nodes that already hold a
  // placement's bytes.
  //
  // Sent on every heartbeat by workers that support it. The first report a
  // worker process sends is a full set; after that each report is a delta
  // against the epoch the manager last acknowledged, and an unchanged store
  // sends an empty delta whose `epoch` equals its `base_epoch`. A manager
  // that cannot apply a report (it has no state for the node after a
  // restart or failover, or the epochs disagree after a lost reply) sets
  // `HeartbeatReply.content_resync`, and the worker answers with a full set
  // on its next heartbeat.
  //
  // Absent from workers that predate content locality. The manager treats
  // such a node as holding nothing, so it scores 0 on locality.
  optional ContentLocationReport content_locations = 14;

  // The worker's `StreamWork` position and a digest of the desired set it
  // holds, sent instead of `allocation_ids` by a worker that receives its
  // work over the stream (sandbox-scaling plan, Phase 2). The manager
  // compares the digest with its own for the node once every message up to
  // `seq` has been applied, and answers `HeartbeatReply.work_resync` when
  // they differ, so a delta lost to a bug is caught within one beat.
  //
  // Absent from workers that do not stream, which get today's full desired
  // set in every reply.
  optional WorkStreamState work_stream = 15;

  // Direct exec sessions this worker has finished since its last heartbeat
  // (docs/exec-and-actions.md, "Direct exec"): one record per redeemed exec
  // ticket, so the manager's `exec_audit` log holds direct sessions as it
  // holds proxied ones. Restored and re-sent on a failed heartbeat; a
  // worker keeps at most 1,024 records and drops the oldest past that, with
  // a warning.
  //
  // Default: empty list.
  repeated ExecAuditRecord exec_audit = 16;

  // Direct exec sessions open on this worker right now. The manager checks
  // each one's minting credential again, as the proxied path does every 30
  // seconds, and names the sessions that no longer hold in
  // `HeartbeatReply.revoked_exec_sessions`.
  //
  // Default: empty list.
  repeated ExecSessionRef exec_sessions = 17;

  // The version of the delegated exec keys this worker holds
  // (`HeartbeatReply.exec_keys_version`). A worker that admits exec tickets
  // sends `"none"` until it has received a set; a worker that does not
  // sends nothing, and the manager skips the lookup.
  //
  // Default: empty (the worker does not admit exec tickets).
  string exec_keys_version = 18;

  // The sessions this node runs (docs/session-mode.md), for the manager's
  // in-memory session index. Same epoch protocol as `content_locations`: a
  // worker process opens with a full report, then sends deltas against the
  // epoch the manager last acknowledged; a manager that cannot apply one
  // sets `HeartbeatReply.session_resync`, and the next report is full. A
  // worker also sends a full report every 30 beats, as a backstop. Absent
  // from workers without the `sessions` capability.
  optional SessionReport session_report = 19;

  // Resizes this node asks for its elastic envelopes (docs/session-mode.md,
  // "Elastic envelopes"): at most one per envelope, re-sent on every
  // heartbeat until a reply's `HeartbeatReply.envelope_resizes` answers it.
  // The node decides, because only it knows what its sessions hold at every
  // instant: it grows an envelope when its sessions fill more than 90% of
  // it, and shrinks one after they used less than half of it for
  // `stateful.envelope.shrinkAfter`. Before it asks to shrink, the node caps
  // its own admission at the smaller size, so no session can be running
  // over the envelope when the shrink commits.
  //
  // The manager applies each as one scheduler-lane write (forwarded to the
  // lane leader when it does not lead). Repeating a request that already
  // applied is answered `applied` and writes nothing.
  //
  // Default: empty list. Fixed envelopes never send one.
  repeated EnvelopeResize envelope_resizes = 20;

  // The node datapath's network plugins (docs/network-plugins.md): one
  // entry per plugin a local allocation references, with its revision,
  // module state, and health. Replaced wholesale per node on every beat and
  // kept in memory by the manager for GetNetPluginStatus and
  // `legion net doctor`. Empty on a node that runs no plugin.
  repeated NetPluginNodeStatus net_plugins = 21;
}

// One envelope resize a node asks for. See
// `HeartbeatRequest.envelope_resizes`.
message EnvelopeResize {
  // The envelope's allocation id, as its payload named it.
  int64 allocation_id = 1;

  // The size the node believes is committed, as a JSON `resources` object
  // (`{"cpu":6000,"memory":6144}`). The resize is a compare-and-set on it:
  // when the row holds something else, the answer is `stale`.
  string from = 2;

  // The size the node asks for, with the same keys. Every key is at or
  // above `from` (a grow) or at or below it (a shrink), and every key stays
  // within the session task's `envelope.resources` and `envelope.max`.
  string to = 3;
}

// The manager's answer to one `EnvelopeResize`. See
// `HeartbeatReply.envelope_resizes`.
message EnvelopeResizeResult {
  // The envelope's allocation id, as the request named it.
  int64 allocation_id = 1;

  // What happened:
  //
  // - `applied`: the row now holds `to` (or already did).
  // - `partial`: a grow that did not fully fit the node; the row holds
  //   `size`, between `from` and `to`.
  // - `refused`: a grow with no room on the node, or on a node that is not
  //   `available` (draining or ineligible). Nothing was written; `size` is
  //   unchanged.
  // - `stale`: the row did not hold `from`; nothing was written, and `size`
  //   is what it holds.
  // - `gone`: the allocation is not a live envelope on this node.
  // - `invalid`: `to` is outside the envelope's bounds or does not size its
  //   keys.
  // - `error`: the write failed (for example, no raft leader); the node
  //   asks again on its next heartbeat.
  string outcome = 2;

  // The committed size after this answer, as a JSON `resources` object.
  // Empty for `gone`, `invalid`, and `error`.
  string size = 3;

  // Why, for `refused`, `stale`, `gone`, `invalid`, and `error`.
  string message = 4;
}

// One heartbeat's session report. See `HeartbeatRequest.session_report`.
message SessionReport {
  // The worker's session epoch after this report. A worker process starts
  // at 0 and its first (full) report carries 1. A delta that changes
  // something carries `base_epoch + 1`; an unchanged probe carries
  // `base_epoch`.
  uint64 epoch = 1;

  // The epoch this delta applies on top of. Ignored when `full`.
  uint64 base_epoch = 2;

  // True when `upserts` is every session on the node, replacing whatever the
  // manager held. `removed` is empty on a full report.
  bool full = 3;

  // Sessions started or changed since `base_epoch` (or all of them).
  repeated SessionStatus upserts = 4;

  // Session ids that ended since `base_epoch`: stopped, exited, promoted
  // (a promoted session is an allocation from then on), or killed because
  // their envelope left the node.
  repeated string removed = 5;
}

// One session as its node reports it.
message SessionStatus {
  // The session id: `<task>-<node tag>.<26 base32>` when minted by a router
  // or a node (the tag names the node it started on, session durability
  // plan §6.3), or `<task>-<26 base32>` when derived from an idempotency
  // key.
  string session_id = 1;

  // Its job, the exact job config it runs, and its task.
  string job_id = 2;
  string job_config_id = 3;
  string task_name = 4;

  // The envelope allocation it runs inside, by the manager's id. Changes
  // when a job update replaces the envelope on the node.
  int64 envelope_allocation_id = 5;

  // `starting` (admitted, not running yet), `running`, or `suspended`
  // (checkpointed on its node, nothing running, not using envelope room;
  // `Worker.ResumeSession` or `legion instance start` brings it back). A
  // session whose local checkpoint was evicted is not reported at all: for
  // `suspend.keepFor` after the eviction its node answers a request for it
  // with NotFound starting `evicted`, naming when and why.
  string state = 6;

  // When the session was issued, unix milliseconds: by the manager that
  // routed it, or by the node itself for an edge start.
  int64 lease_issued_at_unix_ms = 7;

  // The session's reserved resources, as a JSON object.
  string resources = 8;

  // The session's generation (session durability plan §6.7): 1 at start,
  // one more for every resume that claimed its manifest. Of two copies of
  // one session id, the higher generation survives, then the earlier
  // lease, then the lower node id.
  uint64 generation = 9;

  // Who started it: `manager` (a manager's session router) or `edge` (a
  // session ticket presented to `Worker.StartSession`).
  string origin = 10;

  // For an edge start, the `jti` of the session ticket it was started
  // with. Empty otherwise.
  string ticket_jti = 11;

  // The checkpoint the session holds, when it has one: the one a
  // suspended session resumes from, or a running session's latest
  // periodic (`suspend.checkpointEvery`) or worker-stop checkpoint. Absent
  // for a running session that was never checkpointed.
  SessionCheckpointInfo checkpoint = 12;
}

// A session's checkpoint, as its node reports it in `SessionStatus`.
message SessionCheckpointInfo {
  // `local` (the checkpoint lives only on this node) or `store` (the task
  // sets `suspend.durability = "store"`, and the checkpoint is published to
  // the node's `contentStore`).
  string durability = 1;

  // The checkpoint's snapshot id (`snap-...`).
  string snapshot_id = 2;

  // `memory` or `disk` (a disk checkpoint of a session holds only its
  // spec, so a resume boots it fresh under the same id).
  string kind = 3;

  // Bytes the checkpoint's memory parts hold.
  uint64 bytes = 4;

  // When it was taken, RFC 3339.
  string taken_at = 5;

  // With `durability = "store"`, the URL of the session manifest that
  // names the published checkpoint
  // (`<contentStore.url>/sessions/<job>/<id-prefix>/<id>.json`), once the
  // publish finished. Empty while the publish is pending (the content store
  // is unreachable, or the node has no sealing key yet; the node retries)
  // and for a `local` checkpoint.
  string published_url = 6;
}

// Where a worker's `StreamWork` delivery stands, as its heartbeat reports
// it.
message WorkStreamState {
  // The `StreamWorkReply.epoch` of the messages the worker applied.
  uint64 epoch = 1;

  // The highest `StreamWorkReply.seq` the worker applied.
  uint64 seq = 2;

  // Digest of the allocation ids in the worker's desired set after `seq`:
  // `<count>:<xor of splitmix64(id)>`, both in lowercase hex. Order
  // independent, so either side can update it per delta.
  string digest = 3;
}

// One frame from the worker on `StreamWork`.
message StreamWorkRequest {
  oneof frame {
    // The first frame, and only the first.
    StreamWorkOpen open = 1;
    // Every later frame: the highest message the worker has applied.
    StreamWorkAck ack = 2;
  }
}

// Opens a `StreamWork` stream.
message StreamWorkOpen {
  // The worker's node id. Must match the caller's node credential.
  string node_id = 1;

  // The `epoch` of the last message the worker applied, or 0 when it holds
  // nothing (a fresh worker process). A value other than the manager's
  // current epoch gets a full resync.
  uint64 last_epoch = 2;

  // The `seq` of the last message the worker applied, or 0. The manager
  // replays everything after it when it still holds those messages, and
  // resyncs otherwise.
  uint64 last_seq = 3;
}

// Acknowledges every `StreamWork` message up to `seq`, so the manager can
// prune them.
message StreamWorkAck {
  uint64 epoch = 1;
  uint64 seq = 2;
}

// One message on `StreamWork`.
message StreamWorkReply {
  // The manager process's delivery epoch: a random non-zero value chosen
  // when the manager starts. Positions from another epoch cannot be
  // resumed.
  uint64 epoch = 1;

  // This message's position in the node's sequence. Starts at 1 and grows
  // by one per message.
  uint64 seq = 2;

  // `true` when `upserts` is the node's whole desired set and replaces
  // everything the worker holds. `stops` is empty on a resync.
  bool resync = 3;

  // Allocations added to or changed in the node's desired set, as full
  // payloads (the same `TaskAllocation` the heartbeat's desired set carries,
  // restore payload and band included). The worker launches the new ones
  // at once and replaces its copy of the rest.
  repeated TaskAllocation upserts = 4;

  // Allocations that left the node's desired set: stopped, removed,
  // suspended, preempted. `cause` is the stop notice's cause, empty when
  // the manager recorded none. A message carrying stops (or a resync, or a
  // changed payload) makes the worker run its reconcile at once, which
  // stops anything the desired set no longer lists.
  repeated StopNotice stops = 5;

  // The digest of the worker's desired set after applying this message, in
  // the `WorkStreamState.digest` form.
  string digest = 6;

  // Checkpoint work for the node that became outstanding since the last
  // message: the same `CheckpointRequest`s the heartbeat reply carries, part
  // keys included, pushed the moment the snapshot row (or queued warm)
  // committed. The worker starts each one at once, deduplicated against
  // work it already has in flight or finished, exactly as it does for a
  // request that arrives on a heartbeat.
  //
  // A hint, not the record. Each request is pushed once per stream (a new
  // stream gets every one still outstanding), never replayed, and does not
  // count toward `digest`. The heartbeat reply still carries the node's
  // whole checkpoint work on every beat, and that full set is what tells
  // the worker the manager is done with a piece of work. So a lost message,
  // or a worker that ignores this field, waits for its next heartbeat
  // instead of losing anything. Only sent to workers that advertised the
  // `checkpoint` capability. A message may carry only this field, with no
  // `upserts` or `stops`; it still takes the next `seq`.
  repeated CheckpointRequest checkpoint_requests = 7;
}

// One finished (or refused-after-verification) direct exec session.
message ExecAuditRecord {
  // The ticket's `jti`.
  string jti = 1;
  // The ticket's `sub`: `accessor:<id>` of the minting token, or
  // `principal:<name>` for a credential without an accessor.
  string subject = 2;
  int64 allocation_id = 3;
  string job = 4;
  string task = 5;
  // The argv that ran. Empty for an action session: a rendered action argv
  // can carry sensitive parameter values, so only `action` is reported.
  repeated string command = 6;
  // Set when the ticket was minted for an action.
  string action = 7;
  bool tty = 8;
  // The process's exit code; -1 when it was killed or never reported one.
  int32 exit_code = 9;
  // Unix seconds.
  int64 started_at = 10;
  int64 ended_at = 11;
  // Why the session ended when the process did not end it:
  // `"max_session"`, `"revoked: <reason>"`, `"client disconnected"`.
  string ended_by = 12;
}

// A direct exec session open on a worker, for the manager's re-check.
message ExecSessionRef {
  string jti = 1;
  // The ticket's `sub`.
  string subject = 2;
  string job = 3;
  // Set for an action ticket: re-checked as `action:write` on the (job,
  // action), or `exec:write` on the job.
  string action = 4;
  int64 allocation_id = 5;
}

// A direct exec session the worker must end.
message RevokedExecSession {
  string jti = 1;
  // Ends the session's stream with this message, e.g. "the token that
  // minted this session was deleted".
  string reason = 2;
}

// Content locality. One heartbeat's content advertisement. See
// `HeartbeatRequest.content_locations` for the protocol.
message ContentLocationReport {
  // The worker's content epoch after this report. A worker process starts
  // at 0 and its first (full) report carries epoch 1. Each delta that
  // changes something carries `base_epoch + 1`, and an unchanged probe
  // carries `base_epoch`.
  uint64 epoch = 1;

  // The epoch this delta applies on top of. The manager applies the delta
  // only when it holds exactly this epoch for the node. Ignored when `full`.
  uint64 base_epoch = 2;

  // True when `added` is the node's entire advertised set, replacing
  // whatever the manager held. `removed` is empty on a full report.
  bool full = 3;

  // Content added since `base_epoch` (or the whole set when `full`). Only
  // entries of at least 1 MiB are advertised: smaller content downloads in
  // well under a heartbeat and is not worth steering placement for. The
  // manager drops smaller entries a worker sends anyway.
  repeated ContentLocation added = 4;

  // Digests (`sha256:<hex>`) removed since `base_epoch`: evicted, expired,
  // or dropped as corrupt.
  repeated string removed = 5;

  // The store's `snapshots` budget class and the free space on its disk,
  // sent on every report whatever its epoch outcome, so the manager can show
  // checkpoint headroom and keep new memory-checkpoint instances off a node
  // with no room for their checkpoint (see `SnapshotBudget`).
  optional SnapshotBudget snapshot_budget = 6;
}

// Content locality. One piece of content a node holds.
message ContentLocation {
  // Content digest, `sha256:<hex>`, as the node content store keys it. For
  // a digest-pinned artifact this is the artifact's `checksum`.
  string digest = 1;

  // Size in bytes.
  uint64 bytes = 2;
}

// One action the memory pressure response took on one allocation.
message PressureAction {
  // The allocation acted on.
  int64 allocation_id = 1;

  // Owning job, so the event names it without a lookup.
  string job_id = 2;

  // Which step acted: `reclaim` (asked the kernel to reclaim the
  // allocation's memory above its reservation, or inflated a sandbox's
  // balloon by that much, nothing stopped), `suspend` (checkpointed and
  // stopped an instance whose task sets `suspend.onPressure = true`; the
  // instance is `suspended` and resumes later), `evict-bursting` (stopped an
  // allocation using more than its reservation), or `evict-reserved`
  // (stopped an allocation within its reservation, only on nodes with
  // `oversubscribe.memory` above 1).
  string step = 3;

  // Bytes the action freed: measured for `reclaim` (`memory.current` before
  // minus after), and the allocation's `memory.current` for an eviction,
  // which is what stopping it gives back.
  uint64 freed_bytes = 4;

  // The allocation's `memory.current` when the step chose it.
  uint64 used_bytes = 5;

  // The allocation's reservation (`resources.memory`) in bytes.
  uint64 reserved_bytes = 6;

  // Node `MemAvailable` when the step ran.
  uint64 available_bytes = 7;

  // The `minFree` threshold in force, in bytes.
  uint64 min_free_bytes = 8;

  // Node-wide PSI `some avg10` when the step ran, in percent. Zero when the
  // kernel has no PSI.
  double stall_percent = 9;

  // The `maxStall` threshold in force, in percent.
  double max_stall_percent = 10;

  // One sentence naming the step and the numbers, e.g. "evicted by
  // evict-bursting on w-03: using 1.9 GiB of a 400 MiB reservation while
  // free memory was 1.1 GiB (threshold 2 GiB)". Shown as the event message.
  string detail = 11;

  // What the job author can change so it does not happen again. Empty for
  // `reclaim`, which stops nothing.
  string hint = 12;

  // When the step ran, in Unix milliseconds.
  int64 at_unix_ms = 13;

  // `suspend` only: the checkpoint the worker minted. The same id arrives in
  // `SnapshotReport.snapshot_id` with `local_suspension = true`, and becomes
  // the instance's `checkpoint_id`.
  string snapshot_id = 14;
}

// The state of one node's memory pressure response, as its worker reports it
// with usage. Absent from workers that predate the response.
message MemoryPressureStatus {
  // Whether the response is on. On by default whenever
  // `resourceEnforcement.enabled` is, unless the worker type sets
  // `memoryPressure.enabled = false` or the node has no `/proc/meminfo` to
  // watch (a non-Linux worker).
  bool enabled = 1;

  // Whether a trigger is firing right now: free memory below `minFree`,
  // or stall above `maxStall`.
  bool under_pressure = 2;

  // `minFree` resolved for this node, in bytes. Default 5% of node memory,
  // at least 256 MiB and at most 4 GiB.
  uint64 min_free_bytes = 3;

  // `maxStall` in percent. Default 10.
  double max_stall_percent = 4;

  // `settle` in seconds. Default 5.
  uint64 settle_seconds = 5;

  // The steps this node may take, in the order it takes them. `suspend` is
  // accepted in config but takes no action yet, and `evict-reserved` is
  // listed only when `oversubscribe.memory` is above 1, because it never
  // runs otherwise.
  repeated string steps = 6;
}

// One usage report: a point-in-time sample of a node and every allocation
// the worker governs (see HeartbeatRequest.usage).
message UsageReport {
  // When the worker took the sample, in Unix milliseconds. Lets a reader
  // tell a fresh report from one that is a few intervals old.
  int64 sampled_at_unix_ms = 1;

  // One entry per allocation running in a worker-owned cgroup: `exec`,
  // `container`, and `sandbox` tasks on a worker with enforcement on.
  // Allocations on ungoverned runtimes are absent.
  repeated AllocationUsage allocations = 2;

  // Node-wide memory as the kernel reports it. Absent when the worker could
  // not read it (a non-Linux worker).
  optional NodeMemoryUsage node_memory = 3;

  // The node's memory pressure response: whether it is on, its thresholds,
  // and whether it is acting now. Absent from workers that predate it.
  optional MemoryPressureStatus pressure = 4;
}

// Measured usage of one allocation, read from its cgroup v2 files.
//
// Byte and microsecond counters are the kernel's own numbers. They count
// everything in the allocation's cgroup: for a `sandbox` task that is the
// VMM process, so guest memory the VMM has touched counts as used even if
// the guest has since freed it.
message AllocationUsage {
  // The allocation measured.
  int64 allocation_id = 1;

  // `memory.current`: every byte charged to the cgroup right now, page
  // cache included. This is what the cgroup's `memory.max` is compared to.
  uint64 memory_current_bytes = 2;

  // Highest `memory.current` seen since the allocation started. Read from
  // `memory.peak` on kernels that have it (5.19 and later), otherwise the
  // highest value this worker has sampled, which can miss short spikes
  // between samples.
  uint64 memory_peak_bytes = 3;

  // `anon` from `memory.stat`: anonymous memory (heap, stack, guest RAM).
  // Unlike page cache, the kernel cannot drop it without swap, so it is the
  // part of `memory_current_bytes` that only stopping or checkpointing the
  // task would give back.
  uint64 memory_anon_bytes = 4;

  // `usage_usec` from `cpu.stat`: total CPU time used since the cgroup was
  // created, in microseconds. Monotonic; take differences between reports
  // for a rate.
  uint64 cpu_usage_usec = 5;

  // Average CPU use over the last report interval, in thousandths of a CPU
  // (1000 = one full core). Zero on the first report for an allocation,
  // which has no previous sample to compare against.
  uint64 cpu_millicores = 6;

  // `some avg10` from the cgroup's `memory.pressure`: the percentage of the
  // last 10 seconds in which at least one task in the allocation was stalled
  // waiting on memory (0.0 to 100.0). Zero when the kernel has no PSI
  // support.
  double psi_memory_some_avg10 = 7;

  // Unix seconds of the last observed activity: the most recent report
  // interval in which the allocation used at least 1% of a CPU, moved
  // traffic through the node datapath (connections it dialed, or ingress
  // connections to its ports), or had an exec session open. Starts at the
  // time the worker first measured the allocation, so a task that never does
  // anything reports its first sample time.
  int64 last_activity_unix = 8;

  // This allocation's place in the node's pressure order: 1 is the first
  // allocation the memory pressure response would act on if the node ran
  // short right now, 2 the next, and so on. 0 when no step would ever act on
  // it (within its reservation on a node without oversubscription, a
  // `critical` task within its reservation, or node-pinned storage that is
  // not bursting) or when the response is off. Computed by the worker from
  // the same function that drives the response, on every report.
  uint32 pressure_rank = 9;

  // The steps that would act on this allocation, in the order they would
  // run, e.g. ["reclaim", "evict-bursting"], or ["reclaim", "suspend"] for a
  // task that sets `suspend.onPressure = true` (a suspended allocation is
  // gone, so no later step reaches it). Empty when `pressure_rank` is 0.
  repeated string pressure_steps = 10;

  // Automatic suspend.

  // Unix seconds since which the allocation has been quiet by the signals
  // its task's `suspend.idle.signals` counts (`network`, `connections`,
  // `cpu`, `exec`). 0 when the task has no idle policy. Starts at the first
  // sample, so an allocation is never idle for longer than it has run. The
  // manager's idle sweep suspends the instance once it is `idle_after_seconds`
  // in the past.
  int64 idle_since_unix = 11;

  // The task's `suspend.idle.after` in seconds, carried from the allocation's
  // own task config so the manager's sweep needs no store read. 0 when the
  // task has no idle policy.
  uint64 idle_after_seconds = 12;
}

// Node-wide memory, from the kernel's view of the whole machine rather than
// any one cgroup.
message NodeMemoryUsage {
  // `MemTotal` from /proc/meminfo: physical memory the kernel manages.
  uint64 total_bytes = 1;

  // `MemAvailable` from /proc/meminfo: the kernel's estimate of memory that
  // can be handed to new work without swapping, reclaimable cache included.
  // The number to watch for "is this node running short".
  uint64 available_bytes = 2;

  // `some avg10` from /proc/pressure/memory: the percentage of the last 10
  // seconds in which at least one task on the node was stalled waiting on
  // memory (0.0 to 100.0).
  double psi_some_avg10 = 3;

  // Whether the kernel exposes pressure stall information. When false,
  // `psi_some_avg10` is meaningless rather than zero.
  bool psi_available = 4;
}

// One edge sample: an allocation talking to a service through its datapath
// since the last heartbeat (docs/network-handlers.md, "Service graph").
message NetEdgeSample {
  // The calling allocation; the manager maps it to (job, task).
  int64 allocation_id = 1;

  // The upstream key: a catalog service name, or an external upstream's
  // `name`.
  string service = 2;

  // The endpoint's service tag the flow was balanced to (HTTP mode with a
  // `split`, or the endpoint's first tag); empty when untagged or external.
  string tag = 3;

  // `tcp` (connections) or `http` (requests).
  string protocol = 4;

  // Requests (HTTP mode) or connections (L4) that reached an endpoint.
  uint64 requests = 5;

  // Requests answered 5xx, and connections or requests that failed to reach
  // any endpoint (dial errors, timeouts, no endpoints).
  uint64 errors = 6;

  // Connections or requests denied by policy or a handler.
  uint64 denied = 7;

  // HTTP mode: sum and max of request latency, milliseconds, over
  // `requests`.
  uint64 latency_ms_sum = 8;
  uint64 latency_ms_max = 9;

  // Bytes toward the service and back.
  uint64 bytes_out = 10;
  uint64 bytes_in = 11;
}

// Reply payload for Heartbeat.
message HeartbeatReply {
  // Human-readable acknowledgement.
  //
  // Current manager reply value: `"ack"`.
  string message = 1;

  // Desired allocation set this worker should reconcile to.
  //
  // Default: empty list when manager has no desired allocations for this node.
  repeated TaskAllocation desired_allocations = 2;

  // Volumes this worker should reclaim by calling its driver's `destroy`
  // (see docs/volumes.md). The manager re-sends a volume on every heartbeat
  // until the worker confirms it in `HeartbeatRequest.volume_reports`, so a
  // worker that dies mid-destroy simply retries and storage is never leaked.
  //
  // A node-local volume is only ever sent to the node it is pinned to.
  //
  // Default: empty list.
  repeated VolumeDestroyRequest volume_destroy = 3;

  // Current endpoint set for every upstream declared by the desired
  // allocations on this node (see `TaskAllocation.task_connect`). This is the
  // service-discovery feed for the node-local forwarders: the worker applies
  // it to the running forwarders and the next accepted connection is balanced
  // across the addresses listed here.
  //
  // One entry per (allocation, upstream service) pair, refreshed on every
  // heartbeat — that is, every `WORKER_HEARTBEAT_DURATION_SEC` (2s), which is
  // the endpoint refresh cadence a consumer observes after a backend comes up,
  // goes unhealthy, or moves.
  //
  // Default: empty list when no desired allocation declares upstreams. The
  // manager performs no catalog work at all in that case, so nodes running
  // only plain jobs pay nothing for this field.
  repeated UpstreamEndpoints upstream_endpoints = 4;

  // Why the manager is stopping allocations on this node.
  //
  // Workers learn that an allocation should stop by noticing it is *absent*
  // from `desired_allocations` — an absence carries no reason, so a drain, a
  // rollout replacement, a `job stop` and a reschedule were historically
  // indistinguishable to the worker and to anything reading its logs. This
  // field supplies the missing reason, letting the worker hand a
  // `StopCause` to the task runtime and log why each task went away.
  //
  // Delivery is **best effort and advisory**. The manager records a notice in
  // the same transaction that removes the allocation, re-sends every live
  // notice on each heartbeat, and prunes notices by age
  // (`STOP_NOTICE_RETENTION_SECS`, 10 minutes). A worker that reconciles
  // before the notice reaches it — or one talking to a manager older than
  // this field — stops the allocation with cause `unknown` rather than
  // waiting. A stop is never delayed or skipped for want of a notice.
  //
  // The list is a snapshot, not a delta: each heartbeat carries every notice
  // the manager currently holds for this node, and the worker replaces its
  // copy wholesale.
  //
  // Default: empty list when no allocation on this node was recently removed.
  repeated StopNotice stop_notices = 5;

  // Catch-up verdicts for claims the worker reported in
  // `HeartbeatRequest.provisional_claims` that the manager has already
  // decided (see `ClaimVerdict`). The `RatifyClaim` reply is the primary
  // channel; this covers the case where that reply was lost after the
  // manager committed.
  //
  // Default: empty list.
  repeated ClaimVerdict claim_verdicts = 6;

  // The interval, in seconds, the manager wants this worker to heartbeat at.
  //
  // Present whenever the manager runs adaptive cadence, which is the default
  // (`heartbeat.adaptive`, `heartbeat.targetRatePerSecond` in the manager
  // config). The manager derives it from fleet size alone; at the defaults
  // every fleet up to 2,500 nodes is served the 2s floor. Absent when the
  // operator turned adaptive cadence off (`heartbeat.adaptive = false`) or
  // the manager predates it, and absent means "use your worker-type
  // `heartbeatSeconds`".
  //
  // The value is a FLOOR, not an override: a worker beats at the larger of
  // this and its worker-type `heartbeatSeconds`, so a slow batch pool keeps
  // its own cadence until the fleet grows past it. A manager that does not
  // lead the status lane relays the interval it last learned from the leader
  // in its liveness digest reply, so a worker gets the same answer from any
  // manager.
  //
  // The manager derives this node's lost-node window from the SAME value
  // (`missedBeatsBeforeLost x interval`), so a worker that honors a slower
  // cadence is never penalized for it. A worker that ignores the field — an
  // older build — is also never penalized: the manager widens a node's window
  // the moment it decides to slow down, before any worker has been told, and
  // only narrows a window after observing that node actually beating at the
  // faster rate.
  //
  // A worker that adopts a new interval sleeps one uniform `[0, interval)`
  // before resuming its normal jittered cadence, so a fleet that all learns
  // the new value within one old interval spreads across the new period
  // instead of re-phasing onto the same boundary.
  //
  // See docs/heartbeat-cadence-and-scale.md.
  optional uint32 next_interval_seconds = 7;

  // The effective network policy for each desired allocation, as a content
  // hash. The worker fetches a body it has not seen via `FetchDatapathMaterial`
  // and caches it; identical merged policies share one hash and one fetch.
  // An allocation absent from this list has no policy. Delivered every
  // heartbeat, applied only after a successful one, so a manager outage
  // keeps the last known good policy (fail-static). Empty on clusters with
  // no stored policy and no task declaring one — the zero-cost path.
  repeated AllocNetPolicy net_policies = 8;

  // Checkpoint work for this node: snapshots to capture from a running
  // allocation and snapshots to reclaim (see `CheckpointRequest`). Re-sent
  // every heartbeat until the worker's `SnapshotReport` for it has been
  // applied. Sent only to workers that advertised the `checkpoint`
  // capability at registration.
  //
  // Always the node's whole outstanding set, streaming worker or not: a
  // streaming worker got each request pushed on `StreamWork` when it became
  // outstanding, and this list is how it learns which finished work the
  // manager has applied (it is no longer listed).
  //
  // Default: empty list. Costs one indexed lookup per heartbeat.
  repeated CheckpointRequest checkpoint_requests = 9;
  // Content locality: true when this manager could not apply the heartbeat's
  // `content_locations` report: it holds no state for the node (it just
  // started or just became leader) or the report's `base_epoch` does not
  // match what it holds. The worker sends a full content report on its next
  // heartbeat. Until it lands, the node scores 0 on locality, which costs
  // placement quality for one heartbeat and never correctness.
  //
  // Default: false. Never set for a heartbeat that carried no report.
  bool content_resync = 10;

  // The desired set was left out of this reply because the worker receives
  // it over `StreamWork` (sandbox-scaling plan, Phase 2): `desired_allocations`
  // and `stop_notices` are empty and must not be read as "run nothing". Set
  // only when the request carried `work_stream` in the epoch of a stream
  // this manager is serving for the node.
  bool desired_via_stream = 11;

  // The worker's `work_stream.digest` disagreed with the manager's at the
  // same `seq`: the manager will send a full resync on the stream. Never set
  // while messages the worker has not applied are in flight.
  bool work_resync = 12;

  // Every manager in the cluster, as `scheme://host:port` addresses the
  // worker can dial, so a worker is not tied to the one manager its join
  // token names.
  //
  // Populated from the replicated raft membership (voters and learners): each
  // entry is a member's raft `advertiseAddr`, which is the same listener as
  // its Manager API (the raft transport shares it), prefixed with the scheme
  // of the answering manager's own API listener (`https` when `server.tls`
  // is enabled, `http` otherwise). The
  // worker persists the list beside its state (`managers.json` in the worker
  // state directory) and, after consecutive transport failures to its
  // current manager, moves to the next one in the list — and on to the next
  // after that, wrapping around, so it returns to a recovered manager the
  // same way. Any manager accepts any worker-plane call: a manager that does
  // not lead the owning raft lane forwards the write to the leader. A
  // restarted worker reads the persisted list, so it comes up even when the
  // manager named in its token is down.
  //
  // The list is a snapshot, not a delta: the worker replaces its copy
  // wholesale whenever it changes, and always keeps the address from its
  // join token as a last resort. Addresses must be reachable from workers;
  // when managers advertise a raft address workers cannot reach, the worker
  // tries each one in turn and keeps the ones that answer.
  //
  // Default: empty on a manager that does not run `persistence.type = "raft"`
  // (there is no other manager to fail over to) or that predates this
  // field; an empty list leaves the worker's known set unchanged.
  // See docs/architecture-managers-workers.md.
  repeated string manager_addresses = 13;
  reserved 14;
  reserved "cluster_ca_pin";

  // The direct exec sessions from `HeartbeatRequest.exec_sessions` whose
  // minting credential no longer holds: the token was deleted or expired,
  // or its policies no longer grant the session. The worker kills each
  // session's process and ends its stream with `PermissionDenied` and the
  // reason. This bounds revocation of a direct session to one heartbeat
  // interval.
  //
  // Default: empty list.
  repeated RevokedExecSession revoked_exec_sessions = 15;

  // The current set of delegated exec keys, sent only when
  // `HeartbeatRequest.exec_keys_version` was non-empty and differs from
  // `exec_keys_version` below. The worker replaces its set with this one,
  // so a deleted key stops working on its next heartbeat. Empty with a
  // changed version means no keys.
  repeated ExecKey exec_keys = 16;

  // The version `exec_keys` describes. Empty when the request carried no
  // version.
  string exec_keys_version = 17;

  // The manager could not apply the request's `session_report` (it holds
  // no state for the node, or the epochs disagree): the worker sends a full
  // report next.
  bool session_resync = 18;

  // Sessions this node should end now (docs/session-mode.md): the later of
  // two copies of one session id the manager found on two nodes. Re-sent on
  // every beat until the node's report no longer lists them. Sessions the
  // node does not run are ignored.
  repeated string stop_sessions = 19;

  // Allocation ids from the request's `terminated_allocations` that this
  // manager could not record, so the worker must send them again on its
  // next heartbeat. A terminal report is sent once, and a batch task's
  // dependents wait on it: dropping one leaves the allocation `placed` and
  // every `success` or `complete` dependent held forever.
  //
  // A report is listed when recording it failed (the write could not reach
  // the lane leader, say) or when this manager has no row for the
  // allocation yet, which happens when the heartbeat lands on a replica
  // that has not applied the placement. A report from a node that does not
  // own the allocation is never listed. The worker stops re-sending once it
  // no longer holds the allocation, so a report for an allocation that was
  // removed for good ends with the allocation.
  //
  // Default: empty list.
  repeated int64 retry_terminated_allocations = 20;

  // Allocation ids from the request's `failed_allocations` that this
  // manager could not record, so the worker must send them again on its
  // next heartbeat. A failure is reported once, and the worker has already
  // torn the allocation down: dropping the report leaves the allocation
  // placed on a node that no longer runs it, and nothing replaces it.
  //
  // A report is listed when reading the allocation or recording the
  // failure failed (the write could not reach the lane leader, say). A
  // report for an allocation this manager has no row for, one already
  // removed, or one from a node that does not own the allocation is never
  // listed.
  //
  // Default: empty list.
  repeated int64 retry_failed_allocations = 24;

  // The cluster's workload-identity issuer: the `iss` every token and
  // ticket the managers sign carries (docs/workload-identity.md, "Issuer").
  // A worker checks boot, session, and exec tickets against this value, not
  // against the manager address in its join token, so a ticket minted on
  // any manager verifies on any node. Refreshed every beat, so a changed
  // `workloadIdentity.issuer` reaches every node within one heartbeat.
  //
  // Default: empty when workload identity is disabled on the answering
  // manager; an empty value leaves the worker's expected issuer unchanged.
  string workload_identity_issuer = 21;

  // Answers to this heartbeat's `HeartbeatRequest.envelope_resizes`, one
  // per request, in request order (docs/session-mode.md, "Elastic
  // envelopes"). A node lifts its shrink cap, adopts the committed `size`,
  // or backs off growing from these. The resized allocation also reaches
  // the node as a changed payload (`TaskAllocation.envelope_resources`).
  //
  // Default: empty list.
  repeated EnvelopeResizeResult envelope_resizes = 22;

  // The pins (`sha256:<hex>`) of every CA in the cluster's trust bundle as
  // the answering manager sees it, the anchor (the CA the signing CA chains
  // to) first. A worker whose held bundle has a different first pin, or a
  // different set of pins, re-issues its node certificate at once instead
  // of waiting for its refresh timer, and the reply carries the new bundle:
  // that is how a `legion net ca rotate`, or a CA added to or removed from
  // a `file`/`exec` provider's bundle, reaches every node within one
  // heartbeat (docs/cluster-ca.md#rotation). Empty when no cluster CA
  // exists yet or the manager cannot vouch for one (its provider failed, or
  // it disagrees with the cluster); a worker then keeps what it holds.
  repeated string cluster_ca_pins = 23;
}

// Why one allocation is being stopped.
//
// Sent in `HeartbeatReply.stop_notices`. See that field for delivery
// semantics and `docs/graceful-stop.md` for the full contract.
message StopNotice {
  // Allocation the manager removed. Matches an ID the worker previously
  // received in `HeartbeatReply.desired_allocations`.
  int64 allocation_id = 1;

  // Why it was removed. One of:
  //
  // - `stop` — the job, or a keyed instance of it, was stopped by a user.
  // - `update` — replaced by a newer job config (a rollout or in-place
  //   update).
  // - `drain` — the node is draining and its work is moving elsewhere.
  // - `reschedule` — moved by the scheduler (failure recovery, `onLost`
  //   handling, or a scheduler-driven move).
  // - `destroy` — the job was destroyed outright.
  // - `node_lost` — the node was removed or declared lost, clearing its
  //   allocations.
  // - `preempted` — displaced to make room for higher-priority work
  //   (docs/preemption-and-eviction.md).
  // - `scale_in` — the task's count was lowered by `legion job scale` and
  //   this allocation was surplus.
  // - `restore` — the allocation's instance is being rolled back to a
  //   snapshot (RestoreInstance); a replacement restores from it.
  //
  // Workers treat an unrecognized value as `unknown` and stop the allocation
  // anyway, so the manager may add causes without a coordinated upgrade.
  string cause = 2;

  // Name of the job that displaced this allocation. Set only when `cause` is
  // `preempted`; empty otherwise. The worker copies it into the on-disk stop
  // notice (`LEGION_STOP_NOTICE_PATH`) so a task can tell "the platform
  // wanted my capacity for job X" from "my operator stopped me".
  //
  // Best-effort, like the cause itself: a stop that reconciles before its
  // notice arrives is still carried out, just without attribution.
  string preemptor_job = 3;

  // Priority band of the job named in `preemptor_job` (`critical`, `high`,
  // `elevated`, `normal`, `low`, `background`). Empty when `preemptor_job`
  // is.
  string preemptor_band = 4;
}

// The endpoints one allocation may currently reach for one upstream service.
//
// Sent in `HeartbeatReply.upstream_endpoints`, this is the manager's answer to
// "where should this allocation's forwarder for service X send traffic right
// now". It is a snapshot, not a delta: each heartbeat carries the full list.
message UpstreamEndpoints {
  // Allocation consuming the service — the allocation whose task declared this
  // upstream in its `connect` block. Identifies which node-local forwarder the
  // endpoint list applies to.
  int64 allocation_id = 1;

  // The upstream's key: its `connect.upstreams[].name`, or the catalog
  // service its `to` names when it has no name. This is how the node's
  // listener is known, so the worker matches the list to one of its
  // listeners without relying on ordering. For a `proxy` handler's feed
  // (`for_handler`), the handler's service name.
  string service = 2;

  // Endpoints the consumer may dial, already filtered by the manager:
  //
  // - **healthy only** — an endpoint appears when its latest health snapshot is
  //   healthy *and* its node is alive, the same liveness rule `ResolveService`
  //   applies. Unhealthy or lost backends are simply absent.
  // - **intention filtered** — when the target service declares
  //   `service.allow`, an endpoint is visible only if that list is empty,
  //   contains `"*"`, or contains the consuming allocation's job id. A denied
  //   consumer receives an empty list rather than an error.
  //
  // Endpoint fields carry the same meaning as in `ResolveServiceReply`; a
  // consumer dials `address:port`, and skips entries whose `address` is empty
  // or whose `port` is 0 (the backing node advertises no address yet).
  //
  // An empty list is authoritative and means "send no traffic": it is how a
  // scaled-to-zero, unhealthy, or intention-denied service is reported.
  // Workers only replace their endpoint list on a *successful* heartbeat, so a
  // manager outage leaves the last known good set in place (fail-static)
  // rather than blackholing traffic.
  repeated ServiceEndpoint endpoints = 3;

  // True when this list resolves a `proxy` **handler's** target
  // (`handlers = [{ handler = "proxy", service = "..." }]` on the
  // allocation's effective policy or one of its upstreams) rather than a
  // `connect.upstreams` entry. The worker keeps the two apart: handler
  // targets are dialed by the datapath when a chain hands a flow off, and
  // never get a loopback listener of their own.
  bool for_handler = 4;
}

// One volume operation outcome reported by a worker.
message VolumeReport {
  // Volume ID (the second half of an instance's `driver/volume_id` storage
  // handle).
  string volume_id = 1;

  // Operation this reports on: `mount`, `unmount`, or `destroy`.
  string op = 2;

  // True when the driver succeeded.
  bool ok = 3;

  // Host path the volume was mounted at. Set for successful mounts only.
  string mount_path = 4;

  // Whether the driver reports this volume as node-local. Authoritative: the
  // worker asked the driver, so this overrides the manager's mint-time guess
  // and determines whether the owning instance is pinned to this node.
  bool node_local = 5;

  // JSON object of driver metadata to persist on the volume row and hand back
  // on the next operation (an NFS source, a ZFS dataset). Empty when the
  // driver recorded nothing.
  string attrs = 6;

  // Failure detail when `ok` is false. Recorded on the volume row so a stuck
  // volume explains itself in `legion volume list` rather than only in a
  // worker log.
  string error = 7;

  // Block mode: the filesystem the driver reports the device carries
  // (`ext4`), recorded on the volume row so a consumer knows what to mount
  // inside a guest without probing. Empty for filesystem-mode mounts.
  string fs = 8;

  // True when this mount CREATED the storage rather than reattaching it. Lets
  // a consumer tell first-boot-initialize from reattach without guessing from
  // an empty directory.
  bool fresh = 9;
}

// One volume the manager wants a worker to reclaim.
message VolumeDestroyRequest {
  // Volume ID to destroy.
  string volume_id = 1;

  // Driver that owns it.
  string driver = 2;

  // Volume name within its task (`data` for instance storage).
  string name = 3;

  // JSON object of the driver params the volume was created with. Drivers
  // that need them to find the storage (an NFS `server`/`export`) get them
  // back here.
  string params = 4;

  // JSON object of driver metadata recorded on previous operations.
  string attrs = 5;
}

// Failed allocation report item from worker to manager.
message FailedAllocation {
  // Failed allocation ID.
  int64 allocation_id = 1;

  // Failure reason text.
  string reason = 2;

  // JSON-encoded final per-artifact staging states when the failure was an
  // artifact staging failure (same payload as
  // `AllocationHealth.artifact_states`). The manager turns failed rows into
  // `artifact.failed` scheduler events with per-artifact detail (redacted
  // source, error, attempts) instead of parsing the reason text.
  //
  // Unset for non-artifact failures.
  optional string artifact_states = 3;
}

// A terminal, non-failure allocation outcome reported by a worker: the task's
// process exited and the task's `restart` policy says that is the end of it
// (see docs/task-supervision.md).
message TerminatedAllocation {
  // Allocation that reached the terminal state.
  int64 allocation_id = 1;

  // True when the exit status was one the task counts as success
  // (`restart.successExitCodes`, default `[0]`). A task whose policy is
  // `never` can also terminate unsuccessfully; the manager marks the
  // allocation complete either way and records the status.
  bool success = 2;

  // Process exit code. Unset when the process was killed by a signal, or when
  // the worker only re-adopted the pid after a restart and never had a handle
  // to reap.
  optional int32 exit_code = 3;

  // Signal that killed the process, when it was killed by one (Unix only).
  optional int32 signal = 4;

  // Human-readable rendering of the same facts, e.g. `exited with status 0`
  // or `killed by signal 9`. Carried so events and the UI do not have to
  // re-derive wording from the numbers.
  string message = 5;
}

// Allocation health snapshot item from worker to manager.
message AllocationHealth {
  // Allocation ID.
  int64 allocation_id = 1;

  // True when current health check state is healthy.
  bool healthy = 2;

  // Human-readable health status details.
  string status = 3;

  // JSON-encoded per-artifact staging states for this allocation.
  //
  // Array of objects, one per declared artifact:
  // `[{"name":"tool","source":"https://…","state":"fetching",
  //    "bytesFetched":123,"bytesTotal":456,"digest":"sha256:…",
  //    "attempts":1,"durationMs":412,"error":"…"}]`.
  // States progress `pending` -> `fetching` -> `verifying` -> `staged`,
  // or end in `failed`. Sources are redacted (no userinfo or query secrets)
  // and errors reference auth *sources* (KV path or identity name), never
  // credential values. A row also carries `"cache":"hit"` when the artifact
  // was staged from the node content store, or `"cache":"miss"` when it was
  // fetched and stored there. `cache` is absent for artifacts the store
  // cannot serve (no `checksum`, or a source that is not a single file).
  //
  // Unset when the task declares no artifacts.
  optional string artifact_states = 4;
}

// Request payload for HealthCheck.
message HealthCheckRequest {
  // Worker/node ID submitting health checks.
  //
  // With ACLs enforced it must match the node token on the request (see
  // `HeartbeatRequest.id`).
  string id = 1;

  // JSON-encoded node health-check payload.
  string health_checks = 2;
}

// Reply payload for HealthCheck.
message HealthCheckReply {
  // Human-readable acknowledgement.
  //
  // Current manager reply value: `"ack"`.
  string message = 1;
}

// Node record used in APIs.
message NodeMsg {
  // Node ID.
  string id = 1;

  // Node pool.
  string pool = 2;

  // Node status string.
  //
  // On worker registration manager sets default `"active"`.
  string status = 3;

  // Scheduling availability string (for example: available/unavailable).
  //
  // On worker registration manager sets default `"available"`.
  string availability = 4;

  // JSON-encoded configuration attributes.
  string config_attrs = 5;

  // JSON-encoded fingerprint attributes.
  string fingerprint_attrs = 6;

  // JSON-encoded dynamic attributes.
  //
  // On worker registration manager initializes this to `{}`.
  string dynamic_attrs = 7;

  // JSON-encoded health check payload.
  string health_checks = 8;

  // Last heartbeat timestamp string.
  //
  // On worker registration this starts empty and is set on first heartbeat.
  //
  // FRESHNESS CAVEAT: read `heartbeat_source` before trusting this as a live
  // clock. Heartbeats are tracked in the status-lane leader's memory and only
  // status transitions are replicated, so on any other manager this value
  // comes from a periodic checkpoint and can be up to
  // `liveness.checkpointInterval` (30s by default) behind. The node's
  // `status` is exact everywhere.
  string last_heartbeat = 9;

  // Where `last_heartbeat` came from on the manager that answered:
  //
  // - `"live"` — this manager owns liveness and observed the beat itself. The
  //   timestamp is current.
  // - `"checkpoint"` — a replicated checkpoint, accurate to within
  //   `liveness.checkpointInterval`. It records the time the beat was
  //   OBSERVED, not the time the checkpoint was written, so it is coarse
  //   rather than wrong.
  // - `""` — no heartbeat has been observed, or checkpoints are disabled
  //   (`liveness.checkpointInterval: "0s"`), in which case a non-owning
  //   manager reports no time rather than an approximate one.
  //
  // Additive: a client built before this field ignores it and sees exactly
  // today's `last_heartbeat`. See docs/node-liveness.md.
  string heartbeat_source = 10;
}

// Request payload for GetNodeUsage.
message GetNodeUsageRequest {
  // The node to report on.
  string node_id = 1;
}

// Reply payload for GetNodeUsage: one node's capacity, reservations, and
// measured usage.
//
// How the node responds to memory pressure lives on `memory` (its
// oversubscription ratio and response status) and on each
// `NodeAllocationUsage` (its place in the pressure order), not in a separate
// list.
message GetNodeUsageReply {
  // The node reported on.
  string node_id = 1;

  // Node status (`ready`, `lost`, ...), as in GetNode.
  string status = 2;

  // Whether this manager holds a usage report for the node. False when the
  // node's worker has enforcement off, predates usage reporting, has not
  // reported since this manager started, or sends its heartbeats to another
  // manager. Capacity and reservations are filled in either way.
  bool usage_reported = 3;

  // When the worker took the sample behind this reply, in Unix
  // milliseconds. Zero when `usage_reported` is false.
  int64 sampled_at_unix_ms = 4;

  // Seconds between the sample and this reply. Reports arrive every 10
  // seconds, so a value well above that means the node stopped reporting.
  int64 report_age_seconds = 5;

  // Memory: capacity, reservations, use, and pressure.
  NodeResourceUsage memory = 6;

  // CPU: capacity, reservations, and use.
  NodeResourceUsage cpu = 7;

  // One entry per allocation the scheduler has placed on the node, ordered
  // by allocation id.
  repeated NodeAllocationUsage allocations = 8;

  // Capacity for resumes: suspended instances whose checkpoint is on this
  // node, what they keep charged, and the node's `snapshots` content budget
  // their checkpoints fill.
  SuspendedCapacity suspended = 9;
}

// Suspended instances on one node, as `legion node usage` prints
// them: "suspended: 3 instances, 768 MiB held". A suspended instance counts
// here when its checkpoint is local to this node (captured here and not
// published), or when it holds capacity here. A published checkpoint
// (`suspend.durability = "store"`) belongs to no node: its parts live in the
// `contentStore`, and the copy on the node that captured it is an ordinary
// cache entry (see docs/suspend-and-resume.md, "Capacity for resumes").
message SuspendedCapacity {
  // Suspended instances whose checkpoint is local to this node, plus any
  // others that hold capacity here.
  uint32 instances = 1;

  // Of those, how many keep a charge on the node (a held allocation row,
  // from the job's `suspend.reserve`). Their
  // rows also appear in `GetNodeUsageReply.allocations` with
  // `suspended = true`, and their held amounts are already part of the
  // reply's `memory.reserved` and `cpu.reserved`.
  uint32 holding = 2;

  // Memory (MiB) the holding instances keep charged.
  double held_memory_mib = 3;

  // CPU (MHz) the holding instances keep charged.
  double held_cpu_mhz = 4;

  // Bytes of the local (unpublished) checkpoints counted in `instances`,
  // from the manager's snapshot records. Memory checkpoints are stored in
  // the node's content store under the `snapshots` budget, pinned. Disk
  // checkpoints of node-local volumes are retained in place and report 0.
  uint64 checkpoint_bytes = 5;

  // The node's `snapshots` content budget and content-disk free space as
  // its worker last reported them. Unset when the worker has no content
  // store or no heartbeat has reached this manager since it started.
  optional SnapshotBudget snapshot_budget = 6;
}

// A node content store's `snapshots` budget class
// (`content.budgets.snapshots`), which holds memory checkpoints, and the
// disk it lives on. Workers report it on every heartbeat with a content
// report.
//
// The room a new checkpoint can use on the node, which the scheduler checks
// before placing a new instance of a task that suspends to memory, is the
// smaller of two numbers:
//
// - the budget's room: `budget_bytes - pinned_bytes`, since unpinned
//   checkpoint parts are evicted to make room within the budget;
// - the disk's room: `disk_free_bytes + reclaimable_bytes -
//   min_free_disk_bytes`, since the store evicts unpinned content of any
//   class before it lets the disk drop below `content.minFreeDisk`, and
//   refuses the write after that.
//
// When that room is smaller than a task's expected checkpoint, the scheduler
// does not place new instances of the task on the node. Without
// `disk_free_bytes` only the budget is checked.
message SnapshotBudget {
  // The budget in bytes, as the worker sized it at start. A share budget
  // (`"20%"`, and the default) is already resolved against the size of the
  // filesystem holding the store.
  uint64 budget_bytes = 1;

  // Bytes the class holds now.
  uint64 used_bytes = 2;

  // Bytes of the class pinned by a live owner: the checkpoint of a
  // suspended instance or a snapshot that has not been published.
  // Published checkpoints are not pinned on their node (their parts live in
  // the `contentStore`), so their bytes count in `used_bytes` but not here.
  // Pinned content is never evicted.
  uint64 pinned_bytes = 3;

  // Free bytes on the filesystem holding the node content store, as
  // available to an unprivileged process (`statvfs` `f_bavail`), read when
  // the report was built. Unset when the platform cannot say, and then only
  // the budget limits placement.
  optional uint64 disk_free_bytes = 4;

  // The worker's `content.minFreeDisk` in bytes: the free space the store
  // keeps on that filesystem. 0 when the floor is off.
  uint64 min_free_disk_bytes = 5;

  // Bytes of unpinned content in the store, across every class (cached
  // artifacts, published or fetched checkpoint parts). The store evicts
  // them before it lets the disk drop below `min_free_disk_bytes`, so they
  // count as room on the disk. An evicted blob that a running task still
  // holds open (a hard link into a restored allocation) frees no space, so
  // this can overstate the room slightly.
  uint64 reclaimable_bytes = 6;
}

// One resource on one node. Memory is in MiB and bytes, CPU in MHz, matching
// how jobs declare them.
message NodeResourceUsage {
  // Schedulable capacity: the node's fingerprinted amount minus its
  // worker-type `reservedResources`. MiB for memory, MHz for CPU.
  double capacity = 1;

  // Sum of the reservations of every allocation placed on the node, in the
  // same unit as `capacity`. This is what the scheduler packs against.
  double reserved = 2;

  // Measured use, in the same unit as `capacity`: the sum of
  // `memory_current_bytes` (memory) or `cpu_millicores` converted to MHz at
  // the node's MHz-per-core (CPU) over governed allocations. Zero when no
  // usage has been reported. Allocations on ungoverned runtimes are not
  // counted, so this can understate a mixed node.
  double used = 3;

  // Memory only: physical memory (`MemTotal`) in bytes, before
  // `reservedResources`. Zero for CPU, or when not reported.
  uint64 physical_bytes = 4;

  // Memory only: `MemAvailable` in bytes. Zero for CPU, or when not
  // reported.
  uint64 available_bytes = 5;

  // Memory only: node-wide PSI `some avg10`, in percent. Zero for CPU, or
  // when not reported.
  double pressure_some_avg10 = 6;

  // Memory only: whether `pressure_some_avg10` was measured.
  bool pressure_available = 7;

  // The node's oversubscription ratio for this resource
  // (`resourceEnforcement.oversubscribe.memory` / `.cpu` on its worker
  // type), 1.0 when off. Already folded into `capacity`: physical capacity
  // after `reservedResources` is `capacity / oversubscribe_ratio`.
  double oversubscribe_ratio = 8;

  // Memory only: the node's memory pressure response, from its latest usage
  // report. Absent for CPU, for unreported nodes, and from workers that
  // predate the response.
  optional MemoryPressureStatus pressure_response = 9;

  // CPU only: the node's fingerprinted core count, 0 when unknown. Set even
  // when the platform reports no usable clock speed (Apple Silicon), where
  // `capacity` in MHz is 0 and cores are the only honest figure.
  double cores = 10;

  // CPU only: measured use in thousandths of a core, summed over governed
  // allocations (1000 = one full core). Unlike `used`, this needs no
  // MHz-per-core figure, so it is filled on nodes that report no clock
  // speed. Zero when no usage has been reported.
  uint64 used_millicores = 11;
}

// One allocation on a node, with its reservation and measured usage.
message NodeAllocationUsage {
  // The allocation.
  int64 allocation_id = 1;

  // Owning job.
  string job_id = 2;

  // The stateful instance the allocation fulfills, when there is one.
  optional string instance_id = 3;

  // Reserved memory, in MiB: the task's `resources.memory` after defaults.
  double reserved_memory_mib = 4;

  // Reserved CPU, in MHz: the task's `resources.cpu` after defaults.
  double reserved_cpu_mhz = 5;

  // The latest measured usage, when the node reported it for this
  // allocation. Absent for ungoverned runtimes and unreported nodes.
  optional AllocationUsage usage = 6;

  // Seconds since `usage.last_activity_unix`, measured at the sample time.
  // Zero when the allocation was active in the last report interval, or when
  // there is no usage.
  int64 idle_seconds = 7;

  // The burst ceiling, in MiB: the task's `resources.memoryMax`. Zero when
  // the task sets none, which means the reservation is the limit.
  double memory_max_mib = 8;

  // The owning job's priority band (`critical` .. `background`). The
  // pressure order acts on lower bands first.
  string band = 9;

  // The allocation's place in the node's pressure order, copied from
  // `usage.pressure_rank`: 1 is acted on first. 0 when nothing would act on
  // it, or when the node reported no order. Backs the "UNDER PRESSURE, IN
  // ORDER" table of `legion node usage`.
  uint32 pressure_rank = 10;

  // The steps that would act on it, in order, copied from
  // `usage.pressure_steps`.
  repeated string pressure_steps = 11;

  // True when this row is a suspended instance's held charge (status
  // `suspended`), not running work. Its `reserved_*` figures are the held
  // share, and it has no `usage`.
  bool suspended = 12;
}

// Request payload for ListNodeUsage.
message ListNodeUsageRequest {
  // The nodes to report on. Empty means every registered node (up to 500,
  // ordered by node id). At most 500 ids. Unknown ids, and nodes in pools
  // the caller cannot read, are left out of the reply.
  repeated string node_ids = 1;

  // Also fill each entry's per-allocation rows (`allocations`). Default
  // false: fleet views need the per-node totals only.
  bool include_allocations = 2;
}

// Reply payload for ListNodeUsage.
message ListNodeUsageReply {
  // One GetNodeUsage reply per node, in the order of `node_ids` (or by node
  // id when it was empty). `allocations` is empty unless
  // `include_allocations` was set; the totals in `memory` and `cpu` always
  // count every allocation.
  repeated GetNodeUsageReply nodes = 1;

  // True when `node_ids` was empty and the fleet has more than 500 nodes, so
  // the reply stops at the first 500 by node id. Ask for the rest by id.
  bool truncated = 2;
}

// Request payload for GetNodeContent.
message GetNodeContentRequest {
  // The node to report on.
  string node_id = 1;
}

// Reply payload for GetNodeContent: what one node holds, as this manager's
// content location index and snapshot table know it.
message GetNodeContentReply {
  // The node reported on.
  string node_id = 1;

  // Whether this manager holds a content report for the node. False when the
  // node's worker has no content store, predates content reports, has not
  // reported since this manager started (the next heartbeat asks it for a
  // full report), or sends its heartbeats to another manager. `entries` is
  // empty when false, and the scheduler scores the node 0 on locality.
  bool index_reported = 2;

  // The worker's content epoch this manager last applied. It moves by one
  // every time the node's advertised set changes. 0 when not reported.
  uint64 epoch = 3;

  // Every piece of content the node advertises, largest first. Only entries
  // of at least 1 MiB are advertised.
  repeated NodeContentEntry entries = 4;

  // Sum of `entries[].bytes`.
  uint64 advertised_bytes = 5;

  // Whether the node's worker can publish snapshots to a shared store (it
  // advertises the `content-publish` capability, because its worker type
  // sets `contentStore { url }`). Without it, a `durability = "store"`
  // suspend, a spread fork, or `snapshot create --publish` refuses this
  // node.
  bool can_publish = 6;

  // Whether the node's worker can capture snapshots at all (the
  // `checkpoint` capability).
  bool can_checkpoint = 7;

  // Snapshots related to this node, newest first: every snapshot captured
  // here that still exists (any state but `lost`), plus every `published`
  // snapshot captured elsewhere that this node holds at least one part of
  // (fetched for a restore or a fork, or warmed by WarmSnapshot). Rows on
  // jobs the caller has no `snapshot:read` on are left out.
  repeated NodeSnapshotContent snapshots = 8;
}

// One piece of content a node advertises.
message NodeContentEntry {
  // Content digest, `sha256:<hex>`.
  string digest = 1;

  // Size in bytes.
  uint64 bytes = 2;

  // The snapshot this digest is a part of, when it is a memory part of a
  // snapshot this manager knows (and the caller may read). Empty for
  // artifacts and for parts of snapshots that no longer exist.
  string snapshot_id = 3;

  // The part's role in that snapshot (`memory`, `vm-state`, `rootfs`, ...).
  // Empty when `snapshot_id` is.
  string role = 4;

  // How many nodes in the index advertise this digest, this one included.
  uint32 holders = 5;
}

// One snapshot, as it relates to one node.
message NodeSnapshotContent {
  // The snapshot (as ListSnapshots returns it: no manifest).
  SnapshotInfo snapshot = 1;

  // True when this node captured the snapshot (`snapshot.node_id`). A
  // `local` snapshot lives only on its capturing node.
  bool captured_here = 2;

  // How many of the snapshot's memory parts this node advertises right now.
  // A disk snapshot has no memory parts (its volume copy lives in the volume
  // driver, not the content store), so both counts are 0.
  uint32 parts_here = 3;

  // How many memory parts the snapshot has.
  uint32 parts_total = 4;

  // Bytes of those parts this node holds.
  uint64 bytes_here = 5;
}

// One node holding a snapshot's parts (SnapshotInfo.holders).
message SnapshotHolder {
  // The node.
  string node_id = 1;

  // How many of the snapshot's memory parts the node advertises.
  uint32 parts_here = 2;

  // How many memory parts the snapshot has.
  uint32 parts_total = 3;

  // Bytes of those parts the node holds.
  uint64 bytes_here = 4;

  // True for the node that captured the snapshot.
  bool captured_here = 5;
}

// Why an instance's last allocation stopped (InstanceInfo.last_stop).
message InstanceStop {
  // The stop cause, in the vocabulary of stop notices
  // (docs/graceful-stop.md): `stop`, `update`, `drain`, `reschedule`,
  // `destroy`, `node_lost`, `scale_in`, `preempted`, `node_pressure`,
  // `restore`, `suspended`, `gang`, `failed`.
  string cause = 1;

  // A sentence saying what happened. For `node_pressure` this is the
  // worker's own detail sentence, with the step and the numbers (the same
  // text as the `node.pressure` event). For `failed` it names the node and
  // the worker's failure reason (an exit status, a failed check, a stderr
  // tail), cut to one line of at most 400 characters; the full reason is on
  // the `allocation.failed` event. Otherwise a sentence built from the
  // cause.
  string detail = 2;

  // What the reader can change, when there is something: for
  // `node_pressure`, the worker's hint (for example "raise
  // resources.memory toward real usage"). Empty otherwise.
  string hint = 3;

  // RFC 3339 time the manager recorded the stop.
  string at = 4;

  // The allocation that stopped.
  int64 allocation_id = 5;

  // The node it ran on.
  string node_id = 6;

  // For `preempted`: the job that took the capacity.
  string preemptor_job = 7;
}

// Which checkpoints a running instance can take right now
// (InstanceInfo.checkpoint_support), computed by the manager with the same
// checks CreateSnapshot, SuspendInstance, and ForkInstance apply, including
// what the job spec cannot show: the node's worker version and VMM, its
// volume driver's ops, and a stored network policy that gates the task.
// Each `*_blocker` is the FailedPrecondition message that RPC would return
// (with its `Hint:` line), so a client can show it without calling. The
// checks are the ones that depend on the instance, its node, and its task;
// ACLs are not part of it.
message CheckpointSupport {
  // CreateSnapshot `kind = memory` would be accepted.
  bool snapshot_memory = 1;
  string snapshot_memory_blocker = 2;

  // CreateSnapshot `kind = disk` would be accepted.
  bool snapshot_disk = 3;
  string snapshot_disk_blocker = 4;

  // SuspendInstance `checkpoint = memory` would be accepted. A disk suspend
  // leaves the volume in place and needs nothing beyond a keyed instance on
  // a worker that can checkpoint, so it has no field of its own: see
  // `suspend_default`.
  bool suspend_memory = 5;
  string suspend_memory_blocker = 6;

  // The kind SuspendInstance takes with no `checkpoint`: the task's
  // `suspend.checkpoint`, else memory when possible, else disk. Empty when
  // the instance cannot be suspended at all (slot mode, or a worker without
  // the `checkpoint` capability); `suspend_blocker` says why.
  string suspend_default = 7;
  string suspend_blocker = 8;

  // ForkInstance `checkpoint = memory` would be accepted.
  bool fork_memory = 9;
  string fork_memory_blocker = 10;

  // ForkInstance `checkpoint = disk` would be accepted.
  bool fork_disk = 11;
  string fork_disk_blocker = 12;

  // ForkInstance `spread = true` would be accepted: a memory fork whose
  // checkpoint can be published (no node-local volume, and a worker with a
  // `contentStore`).
  bool spread = 13;
  string spread_blocker = 14;

  // CreateSnapshot `publish = true` with a memory snapshot would be
  // accepted.
  bool publish = 15;
  string publish_blocker = 16;
}

// Request payload for GetHeartbeatCadence. No parameters: the report is
// always fleet-wide, because the question it answers ("is the control plane
// keeping up?") has no per-node answer.
message GetHeartbeatCadenceRequest {}

// Reply payload for GetHeartbeatCadence — one fleet's cadence report.
//
// The arithmetic behind every field is published in
// docs/heartbeat-cadence-and-scale.md; the short version is
// `sustainable_nodes ~= R x I`, where `R` is heartbeat commits per second this
// control plane sustains and `I` is the interval.
message GetHeartbeatCadenceReply {
  // Active nodes this manager currently tracks.
  uint32 active_nodes = 1;

  // The interval, in seconds, this manager is currently telling workers to
  // use. With adaptive cadence off this is the configured floor
  // (`heartbeat.minInterval`, 2s by default) and workers keep their
  // worker-type `heartbeatSeconds` instead.
  uint32 served_interval_seconds = 2;

  // The lost-node window derived from it:
  // `missed_beats_before_lost x served_interval_seconds`.
  uint32 lost_window_seconds = 3;

  // Fraction of active nodes that checked in within one interval, 0.0 to 1.0.
  // 1.0 means the fleet is keeping up. False node loss begins when this falls
  // below `served_interval_seconds / lost_window_seconds` — 0.20 at the
  // defaults. Zero, with `freshness_measurable` false, on a fleet too small to
  // measure (under 20 nodes) or on a manager that does not own liveness.
  double freshness_ratio = 4;

  // Whether `freshness_ratio` means anything. False on a tiny fleet, where the
  // ratio is pure noise, and on a non-owning manager.
  bool freshness_measurable = 5;

  // Nodes this control plane is OBSERVED to sustain at the current interval.
  //
  // A lower bound, not a ceiling: a control plane that is comfortably keeping
  // up never reveals how much more it could take, so this reads as roughly the
  // current fleet size until the fleet is actually pressed.
  uint32 sustainable_nodes_estimate = 6;

  // The value to put in `heartbeatSeconds` for a fleet this size on this
  // control plane, at the configured headroom. The remedy is computed, not
  // left as a formula for the operator to evaluate mid-incident.
  uint32 suggested_heartbeat_seconds = 7;

  // Whether the manager dictates cadence at all (`heartbeat.adaptive`). On by
  // default; false when the operator set `heartbeat.adaptive = false`, in
  // which case workers keep their worker-type `heartbeatSeconds`.
  bool adaptive_enabled = 8;

  // True when the controller wanted to back off further but hit
  // `heartbeat.maxInterval`. Backing off is not infinite; past this point the
  // answer is more control plane, and the manager warns rather than slowing
  // the fleet down further.
  bool at_max_interval = 9;

  // Missed beats before a node is marked lost
  // (`heartbeat.missedBeatsBeforeLost`, 5 by default).
  uint32 missed_beats_before_lost = 10;

  // Whether the manager that answered owns liveness — that is, leads the
  // status lane (always true outside raft mode and in `single` topology). When
  // false, every number above is zero: a manager that does not own liveness
  // reports nothing rather than guessing.
  bool is_liveness_owner = 11;
}

// Request payload for GetNodes.
message GetNodesRequest {
  // Free-text search against node ID, status, pool, and availability.
  optional string query = 1;

  // Sort key. Supported values: `id`, `status`, `last_heartbeat`, `pool`.
  //
  // Default: `id`.
  optional string sort_by = 2;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `asc`.
  optional string sort_order = 3;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 4;

  // Maximum nodes returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 5;
}

// Reply payload for GetNodes.
message GetNodesReply {
  // Nodes known to manager for the requested page.
  repeated NodeMsg nodes = 1;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;
}

// Request payload for GetNode.
message GetNodeRequest {
  // Node ID.
  string id = 1;
}

// Reply payload for GetNode.
message GetNodeReply {
  // Node record when found.
  //
  // Unset when the node ID does not exist.
  optional NodeMsg node = 1;

  // Provisional (unratified) allocations this node reported on its most
  // recent heartbeat — work it has started that the store has not recorded
  // (docs/edge-boot.md). This is what makes started-but-unconfirmed capacity
  // visible instead of invisible.
  //
  // Live state, not durable: the manager holds the last report in memory, so
  // a failover shows an empty list until the node's next heartbeat (at most
  // one heartbeat interval). It is never wrong, only briefly incomplete.
  //
  // Default: empty list.
  repeated ProvisionalClaimReport provisional_claims = 2;
}

// Request payload for RestartWorker.
message RestartWorkerRequest {
  // Node/worker ID to restart.
  string node_id = 1;
}

// Reply payload for RestartWorker.
message RestartWorkerReply {
  // Human-readable status message.
  //
  // Manager forwards the worker's restart message.
  // Built-in worker currently replies `"Worker restarting"`.
  string message = 1;
}

// Request payload for SetNodeAvailability.
message SetNodeAvailabilityRequest {
  // Node ID whose availability to change.
  string node_id = 1;

  // Target availability. Supported values:
  // - `"available"`: the node accepts new placements (uncordon).
  // - `"drained"`: the node is excluded from all new placements
  //   (cordon/drain).
  //
  // Any other value is rejected with InvalidArgument.
  string availability = 2;

  // Whether to evict the node's existing allocations.
  //
  // Only meaningful with `availability = "drained"`: `false` cordons the
  // node (existing allocations keep running), `true` drains it (a
  // `node_drain` evaluation evicts stateless allocations immediately and
  // leaves stateful allocations protected by their `stateful.onLost`
  // policy). Ignored when `availability = "available"`.
  bool evict = 3;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 4;
}

// Reply payload for SetNodeAvailability.
message SetNodeAvailabilityReply {
  // The node record after the availability change.
  //
  // Unset when the reply was replayed from a recorded idempotent result
  // (see `deduplicated`).
  optional NodeMsg node = 1;

  // Human-readable status message.
  //
  // Current manager reply formats: `"Cordoned node <id>"`,
  // `"Draining node <id>"`, `"Uncordoned node <id>"`.
  string message = 2;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh.
  bool deduplicated = 3;
}

// Request payload for ForgetNode.
message ForgetNodeRequest {
  // The node to forget. Required.
  string node_id = 1;

  // Forget it whatever the guard says: the machine is gone for good. See
  // `ForgetNode` for what that does to its allocations and volumes.
  // Default: false.
  bool force = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`. A
  // repeat of a forget that succeeded replays its result instead of
  // answering NotFound.
  optional string idempotency_key = 3;
}

// Reply payload for ForgetNode.
message ForgetNodeReply {
  // Human-readable status message: `"Forgot node <id>"`.
  string message = 1;

  // True when replayed from a recorded result for the request's
  // `idempotency_key` rather than applied fresh; the counts below are 0
  // then.
  bool deduplicated = 2;

  // Allocations removed with the node (only with `force`).
  uint32 allocations_removed = 3;

  // Node tokens revoked (normally 1; 0 for a node that never had one, such
  // as one registered with ACLs off).
  uint32 tokens_revoked = 4;

  // Node-local volumes still pinned to the forgotten node (only with
  // `force`). Their instances cannot be placed until an operator replaces
  // them (`legion instance replace`).
  uint32 volumes_orphaned = 5;

  // Snapshots stored on the node, now marked lost.
  uint32 snapshots_lost = 6;
}

// Request payload for GetLedger.
message GetLedgerRequest {
  // Empty request; full ledger is returned.
}

// Reply payload for GetLedger.
message GetLedgerReply {
  // Ledger rows keyed by node.
  repeated LedgerNode nodes = 1;
}

// Snapshot of one manager node's stored manager config.
message ManagerNodeConfig {
  // Manager node ID.
  string node_id = 1;

  // JSON-encoded manager configuration.
  string config_json = 2;

  // Timestamp when this snapshot was updated.
  string updated_at = 3;
}

// Request payload for GetManagerConfigs.
message GetManagerConfigsRequest {
  // Free-text search against manager node ID.
  optional string query = 1;

  // Sort key. Supported values: `node_id`, `updated_at`.
  //
  // Default: `updated_at`.
  optional string sort_by = 2;

  // Sort direction. Supported values: `asc`, `desc`.
  //
  // Default: `desc`.
  optional string sort_order = 3;

  // 1-indexed page number.
  //
  // Default: `1`.
  optional uint32 page = 4;

  // Maximum manager configs returned in a page.
  //
  // Default: `20`.
  optional uint32 page_size = 5;
}

// Reply payload for GetManagerConfigs.
message GetManagerConfigsReply {
  // Stored manager config snapshots for the requested page.
  repeated ManagerNodeConfig configs = 1;

  // Total number of records matching the filter before pagination.
  uint32 total_count = 2;

  // 1-indexed page number returned.
  uint32 page = 3;

  // Page size used to produce this reply.
  uint32 page_size = 4;
}

// Request payload for ListManagers. No parameters: the roster is small
// (raft clusters run 1, 3, or 5 managers) and returned whole.
message ListManagersRequest {}

// One manager in the cluster, as the answering manager sees it.
message ManagerMember {
  // The manager's identity. Under raft this is its raft node id
  // (`persistence.raft.nodeId`); outside raft it is the manager's listener
  // `host:port`. Matches `ManagerNodeConfig.node_id` for the manager's
  // config snapshot.
  string node_id = 1;

  // The manager's advertised `host:port`: its raft advertise address, which
  // is also its API listener. Outside raft, the host and port of
  // `server.advertiseAddr` (or the listener address).
  string advertise_addr = 2;

  // Raft role, per the answering manager's replicated membership:
  //
  // - `leader`: leads the control lane (membership, joins, config).
  // - `follower`: a settled voter that does not lead the control lane.
  // - `learner`: a non-voting member, or a joiner whose promotion to voter
  //   has not settled on every lane yet.
  // - `standalone`: outside raft mode (local_disk or streaming persistence).
  //
  // Under `topology = "lanes"`, check `leader_lanes` for the lanes a
  // manager leads, which can differ from the control lane during a
  // leadership change.
  string role = 3;

  // True when the manager is a settled voter on every active lane (the same
  // rule as `RaftStatus.voters`). Always false outside raft mode.
  bool voter = 4;

  // Raft lanes this manager leads, by wire name (`control`, `scheduler`,
  // `status`). Under the default `single` topology this is `["control"]` for
  // the leader and empty for everyone else. Empty outside raft mode.
  repeated string leader_lanes = 5;

  // True for the manager that answered this request.
  bool is_self = 6;

  // Whether the answering manager reached this manager just now. Always
  // true for the answering manager itself.
  bool reachable = 7;

  // Why the probe failed, when `reachable` is false. Examples: a timeout,
  // `Unavailable` (connection refused), or `PermissionDenied`.
  optional string probe_error = 8;

  // Round-trip time of the probe in milliseconds, when it succeeded.
  // Absent for the answering manager itself.
  optional uint64 probe_latency_ms = 9;

  // The raft term the manager reports for itself, when reachable. A member
  // on an older term than its peers has missed an election. Absent outside
  // raft mode.
  optional uint64 term = 10;

  // The latest log index the manager reports it has applied, when
  // reachable. Compare across members to see replication lag. Absent
  // outside raft mode.
  optional uint64 applied_index = 11;

  // When this manager's config snapshot was last written, if it has one
  // (`GetManagerConfigs`). Absent for a manager that has never led under
  // raft. Same format as `ManagerNodeConfig.updated_at`.
  optional string config_updated_at = 12;
}

// Reply payload for ListManagers.
message ListManagersReply {
  // Every manager, sorted by `node_id`. Outside raft mode, exactly the
  // answering manager. Under raft, the members of the answering manager's
  // replicated membership, which is empty only while its raft engine is
  // still starting.
  repeated ManagerMember managers = 1;

  // Persistence backend of the answering manager: `raft`, `local_disk`, or
  // `streaming`.
  string persistence_backend = 2;

  // `node_id` of the manager that answered.
  string answered_by = 3;
}

// Request payload for GetSchedulerConcurrency. No parameters: the controller
// is per-manager and global, so there is nothing to scope the question to.
message GetSchedulerConcurrencyRequest {}

// Reply payload for GetSchedulerConcurrency — one manager's view of how much
// planning it is admitting, and why.
//
// The controller measures its own plan-apply conflict rate and tunes how many
// evals it will PLAN at once between `floor` and `ceiling` (AIMD: halve on
// congestion, add one back after calm). The arithmetic behind every field is
// published in docs/adaptive-scheduler-concurrency.md.
message GetSchedulerConcurrencyReply {
  // The controller's mode, as configured in
  // `schedulerSettings.adaptiveConcurrency.mode`:
  // - `enforce` — measure and actuate.
  // - `observe` — measure and publish what it WOULD do, actuate nothing.
  //   The default.
  // - `off` — the controller does not run; `evalThreads` is the fixed planner
  //   count, exactly as before this feature existed. Every numeric field below
  //   is zero in this mode.
  string mode = 1;

  // Planners currently admitted. In `observe` mode this is the SHADOW limit —
  // what the controller would be enforcing — which is what makes observe mode
  // useful on its own.
  uint32 limit = 2;

  // Lower bound on `limit` (`adaptiveConcurrency.min`, 1 by default). Never 0:
  // a floor of 0 is a stuck scheduler, not a throttled one.
  uint32 floor = 3;

  // Upper bound on `limit`. `adaptiveConcurrency.max` if set, otherwise
  // `evalThreads`, and never above `evalThreads`.
  uint32 ceiling = 4;

  // The manager's configured `evalThreads`: the size of the worker pool, and
  // the ceiling the controller works under. The controller never admits more
  // planners than this and, in `enforce`, backs off below it on evidence.
  uint32 eval_threads = 5;

  // Admission permits held right now — eval workers currently inside a
  // planning eval. 0 when the controller is off, which never consults the gate.
  uint32 in_flight = 6;

  // What the controller is doing:
  // - `steady` — running at the ceiling; nothing is held back.
  // - `throttled` — below the ceiling, and conflicts have not yet subsided.
  // - `probing` — below the ceiling and accumulating calm ticks toward an
  //   increase.
  // - `saturated` — backing off did NOT improve goodput, so the conflicts are
  //   capacity-driven rather than concurrency-driven. The remedy is nodes, not
  //   patience, and the controller has stopped applying an actuator that
  //   cannot help.
  string state = 7;

  // How long the controller has been in `state`, in seconds.
  uint32 seconds_in_state = 8;

  // Smoothed plan rejection rate, 0.0 to 1.0:
  // `rejected / (applied + fallback + rejected)`. Plans that bound but slid
  // down a candidate list count as PROGRESS, not as conflict — that is the
  // point of late binding, and throttling to avoid absorbed races would be
  // throttling to avoid the feature working.
  double conflict_rate = 9;

  // Smoothed fraction of plans that bound at a lower-ranked candidate: races
  // ABSORBED by late binding. Reported for diagnosis and never fed into the
  // controller's decision.
  double fallback_rate = 10;

  // Smoothed plans that actually placed, per second. This — not the conflict
  // rate — is the objective; the conflict rate is only its fast leading
  // indicator, and every decrease is verified against this before it is kept.
  double goodput = 11;

  // Raw plan outcomes in the most recent 500ms window, so the percentages
  // above can be checked by hand.
  uint32 window_applied = 12;
  uint32 window_fallback = 13;
  uint32 window_rejected = 14;

  // The last limit change: `increase`, `decrease`, or `revert` (a decrease
  // undone because it did not improve goodput). Empty if the controller has
  // not moved the limit yet.
  string last_adjustment_direction = 15;

  // The limit before and after that change.
  uint32 last_adjustment_from = 16;
  uint32 last_adjustment_to = 17;

  // How long ago it happened, in seconds.
  uint32 last_adjustment_seconds_ago = 18;

  // Relative change in goodput since that adjustment, as a fraction (0.18 =
  // +18%). This is what says whether backing off actually bought anything.
  double last_adjustment_goodput_delta = 19;

  // Times a throttled worker claimed a non-planning eval (today: `job_stop`)
  // instead of the queue head. This counts the one deviation from strict
  // priority order the admission gate introduces: it is a cross-class
  // inversion only, never within a class, and it exists so an operator's
  // `job stop` during an incident does not queue behind the storm it is
  // trying to end.
  uint64 admission_skips = 20;

  // Whether the manager that answered leads the scheduler lane, and therefore
  // does the planning (always true outside raft mode and in `single`
  // topology). When false, every number above is zero: a manager that does no
  // planning reports nothing rather than guessing.
  bool is_scheduler_lane_leader = 21;
}

// Request payload for GetObservability.
message GetObservabilityRequest {
  // Maximum number of recent lines to return per stream.
  //
  // Default and max are manager-defined.
  optional uint32 max_lines = 1;
}

// Reply payload for GetObservability.
message GetObservabilityReply {
  // True when manager started with `--o11y` and trace capture is active.
  bool o11y_enabled = 1;

  // Recent JSON log lines captured by manager.
  repeated string logs = 2;

  // Recent JSON trace/span events captured by manager.
  //
  // Empty when `o11y_enabled` is false.
  repeated string traces = 3;

  // Active persistence backend identifier.
  //
  // Current values include: `local_disk`.
  string persistence_backend = 4;

  // Manager write role as reported by the persistence backend.
  //
  // Current values include: `primary`, `standby`, `candidate`.
  string persistence_role = 5;

  // True when this manager currently holds the write lease/fencing token.
  //
  // For `local_disk` mode this is always `true`.
  bool persistence_lease_held = 6;
}

// Request payload for GetRaftStatus.
message GetRaftStatusRequest {
  // Empty request; manager derives status from local persistence backend state.
}

// Snapshot of one manager's current Raft control-plane status.
message RaftStatus {
  // True when the current persistence backend is Raft-enabled.
  bool enabled = 1;

  // Persistence backend name reported by manager.
  //
  // Example: `raft`.
  string backend = 2;

  // Local manager node ID used by Raft.
  string node_id = 3;

  // Logical cluster identifier for this Raft group.
  string cluster_id = 4;

  // Local node role. Values: `primary`, `standby`, `candidate`.
  string role = 5;

  // Current known leader node ID, if available.
  optional string leader_id = 6;

  // Current Raft term observed by this manager.
  uint64 term = 7;

  // Latest committed log index observed locally.
  uint64 commit_index = 8;

  // Latest applied log index observed locally.
  uint64 applied_index = 9;

  // True when this manager currently owns write leadership/fencing.
  bool lease_held = 10;

  // Current voting members: managers that are SETTLED voters on every
  // active lane.
  //
  // A raft membership change lands in two steps — a joint configuration
  // holding the old and the new voter sets, then the uniform new one — and
  // raft reports an incoming member as a voter from the joint step onwards.
  // This field deliberately does not: a manager appears here only once every
  // lane carries it in a UNIFORM membership, so the headline can never
  // report a fault-tolerant cluster while one lane is still mid-join (a lane
  // left joint still needs a majority of the OLD voter set). Under
  // `topology = "lanes"` this is therefore stricter than any single lane's
  // voter list; per-lane detail is in `lanes`.
  repeated string voters = 11;

  // Current learner/non-voting members.
  repeated string learners = 12;

  // Additional peer addresses or IDs discovered/configured for this node.
  repeated string peers = 13;

  // Epoch timestamp (milliseconds) when the last local election transition happened.
  int64 election_epoch_ms = 14;

  // Default lifetime for newly issued Raft join tokens.
  uint64 join_token_ttl_seconds = 15;

  // Raft library family currently used by manager.
  //
  // Example: `openraft`.
  string raft_library = 16;

  // Per-lane status detail, one entry per active raft group. Topology
  // `single` reports one entry (the `control` group carrying all tables);
  // the experimental `lanes` topology reports three. Empty when the engine
  // has not started.
  repeated RaftLaneStatus lanes = 17;
}

// Status of one raft group ("lane") on this manager.
message RaftLaneStatus {
  // Lane wire name: `control`, `scheduler`, or `status`.
  string lane = 1;

  // This node's role in the lane's group. Values: `primary`, `standby`,
  // `candidate`.
  string role = 2;

  // The lane's current leader, when known.
  optional string leader_id = 3;

  // The lane's current raft term.
  uint64 term = 4;

  // Latest log index observed locally for this lane.
  uint64 commit_index = 5;

  // Latest applied log index for this lane.
  uint64 applied_index = 6;

  // Number of voting members of this lane's raft group, as known locally.
  // While a membership change is in flight this is the UNION across the
  // joint configuration's voter sets, so read `quorum`/`survives` — not this
  // count — for what the lane can actually tolerate.
  uint64 voters = 7;

  // Majority (quorum) size required to commit on this lane:
  // `voters / 2 + 1`. With quorum lost, writes stall but local reads keep
  // serving. While the lane's membership is JOINT (a change in flight) this
  // is the largest majority across the joint configuration's voter sets,
  // because a joint configuration must be agreed by a majority of each.
  uint64 quorum = 8;

  // Voter failures this lane can survive while still committing:
  // `(voters - 1) / 2`. Zero for one- and two-voter groups — an even voter
  // count adds a manager without adding fault tolerance. While the lane's
  // membership is JOINT this is the SMALLEST such number across the joint
  // configuration's voter sets: growing `{a,b}` to `{a,b,c}` reports `0`
  // while the change is in flight, because the lane still needs both `a` and
  // `b`.
  uint64 survives = 9;

  // Plain-language advisory when this lane's membership is unhealthy: a
  // membership change still in its JOINT configuration (e.g. "membership
  // change in flight: this lane is in a JOINT configuration [a, b] +
  // [a, b, c] and needs a majority of EVERY listed config to commit or
  // elect …"), even voter parity (e.g. "2 voters need both alive to commit —
  // this cluster survives zero failures. Use 1, 3, or 5 voters; add one more
  // manager or remove one.") and/or fewer voters than
  // `persistence.raft.expectedVoters`. Absent when the lane is healthy.
  optional string warning = 10;
}

// Reply payload for GetRaftStatus.
message GetRaftStatusReply {
  // Current local Raft status snapshot.
  RaftStatus status = 1;
}

// One Raft history event recorded by manager.
message RaftHistoryEvent {
  // Monotonic event sequence number (local to this manager).
  uint64 event_id = 1;

  // Event category. Examples: `election`, `failover`, `membership`.
  string event_type = 2;

  // Human-readable summary of the event.
  string message = 3;

  // Actor who initiated the event (for example `cli`, `ui`, `system`).
  string actor = 4;

  // Optional target node ID associated with the event.
  optional string target = 5;

  // Term at the time this event was recorded.
  uint64 term = 6;

  // Leader at the time this event was recorded, if known.
  optional string leader_id = 7;

  // RFC3339 timestamp when this event was recorded.
  string created_at = 8;
}

// Request payload for ListRaftHistory.
message ListRaftHistoryRequest {
  // Maximum number of recent events to return.
  //
  // Default: `50`. Maximum: manager-defined.
  optional uint32 limit = 1;
}

// Reply payload for ListRaftHistory.
message ListRaftHistoryReply {
  // Most recent events first.
  repeated RaftHistoryEvent events = 1;
}

// Request payload for IssueRaftCommand.
message IssueRaftCommandRequest {
  // Command name to execute.
  //
  // Supported values are manager-version dependent, and commonly include:
  // - `trigger-election`
  // - `step-down`
  // - `transfer-leader`
  // - `add-voter`
  // - `add-learner`
  // - `remove-member`
  string command = 1;

  // Optional target node ID used by commands that operate on another member.
  optional string target_node_id = 2;

  // Free-form actor label for auditability.
  //
  // Default: `api`.
  optional string actor = 3;
}

// Reply payload for IssueRaftCommand.
message IssueRaftCommandReply {
  // Echo of command executed by manager.
  string command = 1;

  // Event recorded as a result of the command.
  RaftHistoryEvent event = 2;

  // Latest status after command application.
  RaftStatus status = 3;

  // Plain-language advisory produced by a command that SUCCEEDED but left
  // the cluster in an ergonomically unhealthy shape — today: a membership
  // change (`add-voter`, `remove-member`) whose resulting voter count is
  // even ("2 voters need both alive to commit — this cluster survives zero
  // failures. Use 1, 3, or 5 voters; add one more manager or remove one.").
  // The same advisory is WARN-logged on the manager and recorded as a
  // `membership` event in the raft history. Absent when the command left a
  // healthy shape. Genuinely unsafe operations (removing the last voter, or
  // a removal that would leave a quorum the currently-alive members cannot
  // form) are refused outright instead of warned about.
  optional string warning = 4;
}

// Request payload for GetRaftJoinToken.
message GetRaftJoinTokenRequest {
  // Free-form actor label for auditability.
  //
  // Default: `api`.
  optional string actor = 1;
}

// Reply payload for GetRaftJoinToken.
message GetRaftJoinTokenReply {
  // Opaque short-lived token for joining this cluster.
  string token = 1;

  // RFC3339 expiry timestamp for the token.
  string expires_at = 2;

  // Snapshot of Raft status when token was issued.
  RaftStatus status = 3;
}

// Request payload for GetStateBackup.
message GetStateBackupRequest {
  // Optional server-side destination path for the backup file. Must not
  // already exist (`VACUUM INTO` refuses to overwrite). Defaults to a
  // timestamped file under `<storePath>/backups/`.
  optional string out_path = 1;
}

// Reply payload for GetStateBackup.
message GetStateBackupReply {
  // Server-side path of the written backup file.
  string path = 1;

  // Size of the backup file in bytes.
  uint64 bytes = 2;

  // Raft applied log index captured in the backup (0 outside raft mode).
  uint64 applied_index = 3;

  // How KV values are held in this backup (docs/kv-encryption.md). When
  // `enabled`, the file carries ciphertext plus the WRAPPED data keys and is
  // useless without the root key, which is deliberately NOT in it:
  // `root_key_provider` / `root_key_location` say where to find it and
  // `root_key_ids` which key(s) a restore will need. Keep them together.
  BackupEncryptionInfo encryption = 4;
}

// Request payload for GetKeyringStatus. No fields: the reply describes the
// manager that answers.
message GetKeyringStatusRequest {}

// One key in the KV keyring (see GetKeyringStatusReply): a data key, or
// the checkpoint key.
message KeyringKeyInfo {
  // Data key id (`dk_…`), which values reference in `kv_entry.enc_key_id`,
  // or checkpoint key id (`ck_…`), which published checkpoint manifests
  // reference as each part's `keyId`.
  string key_id = 1;

  // `active` (encrypts new writes), `retired` (still decrypts what it
  // protected until the rewrap converts those values), or `checkpoint` (the
  // key published checkpoint parts are sealed under; it never seals a KV
  // value, never rotates with the data keys, and is never collected).
  string state = 2;

  // `aes-256-gcm` for a data key, `hkdf-sha256` for the checkpoint key
  // (each part's AES-256-GCM key is derived from it).
  string algorithm = 3;

  // Unix seconds the key was created.
  int64 created_at = 4;

  // Unix seconds the key was retired; unset while active.
  optional int64 retired_at = 5;

  // Id of the root key this data key is wrapped under, and the provider
  // kind that wrapped it.
  string root_key_id = 6;
  string root_provider = 7;

  // KV values currently encrypted under this key.
  int64 value_count = 8;

  // Whether THIS manager has unwrapped the key. `false` means the values
  // under it are unreadable here; `error` says why.
  bool unwrapped = 9;
  string error = 10;
}

// Progress of the background rewrap (see GetKeyringStatusReply).
message KeyringRewrapProgress {
  // Values not yet under the active data key (plaintext rows included).
  int64 pending = 1;

  // Whether the manager's keyring loop is currently converting them.
  bool running = 2;

  // Last rewrap error on this manager, if any (cleared on success).
  string last_error = 3;
}

// Reply payload for GetKeyringStatus.
message GetKeyringStatusReply {
  // `encryption.enabled` on this manager.
  bool enabled = 1;

  // `disabled` | `uninitialized` | `pending_upgrade` | `unlocked` | `locked`.
  //
  // `uninitialized`: enabled, but no data key exists yet (the leader has
  // not run initialization); values are written as plaintext rows until it
  // does. `pending_upgrade`: raft, and a voter runs a build without the
  // keyring, so the leader is deliberately holding off (`hint` names the
  // manager). `locked`: at least one data key cannot be unwrapped here.
  string state = 2;

  // Root key provider kind (`file` | `env` | `exec`) and where it looks.
  string root_key_provider = 3;
  string root_key_location = 4;

  // Id of the root key the provider would wrap with right now, when it has
  // material.
  string root_key_id = 5;

  // Data keys, active first.
  repeated KeyringKeyInfo keys = 6;

  // KV rows stored as plaintext / encrypted.
  int64 plaintext_rows = 7;
  int64 encrypted_rows = 8;

  // Background rewrap state.
  KeyringRewrapProgress rewrap = 9;

  // Configured `encryption.dataKeyRotationAge` and the active key's age.
  string data_key_rotation_age = 10;
  int64 active_key_age_seconds = 11;

  // The one thing to do next, in plain language, when there is one
  // (copy the root key from another manager, run a rewrap, finish an
  // upgrade). Empty when everything is as it should be.
  string hint = 12;

  // The manager answering (`host:port`), since the keyring is per-manager.
  string manager = 13;
}

// Request payload for RotateDataKey.
message RotateDataKeyRequest {
  // Optional idempotency key. A repeated call with the same key returns the
  // recorded outcome with `deduplicated = true` instead of rotating again.
  optional string idempotency_key = 1;
}

// Reply payload for RotateDataKey.
message RotateDataKeyReply {
  // The new active data key.
  string key_id = 1;

  // The data key it retired (empty when there was none).
  string retired_key_id = 2;

  // True when a previous call with the same idempotency key already
  // rotated and this reply is its recorded outcome.
  bool deduplicated = 3;
}

// Request payload for RewrapKv.
message RewrapKvRequest {
  // Decrypt every value into a plaintext row instead of re-encrypting
  // under the active key. The step before disabling encryption or
  // downgrading to a build without the keyring.
  bool plaintext = 1;

  // Optional idempotency key (see RotateDataKeyRequest).
  optional string idempotency_key = 2;
}

// Reply payload for RewrapKv.
message RewrapKvReply {
  // Values rewritten by this call.
  int64 rewrapped = 1;

  // Values still pending afterwards (0 on a completed run; non-zero only
  // when a batch failed — the message says why).
  int64 remaining = 2;

  // Retired data keys garbage-collected once nothing referenced them.
  repeated string collected_keys = 3;

  bool deduplicated = 4;
}

// Request payload for RewrapRootKey.
message RewrapRootKeyRequest {
  // Optional idempotency key (see RotateDataKeyRequest).
  optional string idempotency_key = 1;
}

// Reply payload for RewrapRootKey.
message RewrapRootKeyReply {
  // Data keys now wrapped under `root_key_id`.
  int64 keys = 1;

  // The root key everything is wrapped under after this call.
  string root_key_id = 2;

  // Data keys left untouched because this manager cannot unwrap them.
  repeated string skipped = 3;

  bool deduplicated = 4;
}

// Request payload for ResetKeyring.
message ResetKeyringRequest {
  // Must be exactly `DELETE-UNDECRYPTABLE-VALUES`.
  string confirm = 1;
}

// Reply payload for ResetKeyring.
message ResetKeyringReply {
  // KV key paths whose values were deleted because nothing could decrypt them.
  repeated string deleted_values = 1;

  // Data key ids dropped from the keyring.
  repeated string dropped_keys = 2;

  // The active data key after the reset.
  string active_key_id = 3;
}

// How a state backup's KV values are protected (see GetStateBackupReply).
message BackupEncryptionInfo {
  // `encryption.enabled` on the manager that wrote the backup.
  bool enabled = 1;

  // Root key provider: `file`, `env`, or `exec`.
  string root_key_provider = 2;

  // Where the root key lives: the key file path, the variable name, or the
  // provider command. Never the key itself.
  string root_key_location = 3;

  // Ids of the root keys the backup's data keys are wrapped under
  // (`rk_…` fingerprints, or a KMS key id for `exec`). A restore needs
  // every one of them available to read every value.
  repeated string root_key_ids = 4;

  // Values still stored as plaintext rows (pre-encryption rows a rewrap has
  // not converted). 0 once `legion keyring rewrap` has run to completion.
  int64 plaintext_rows = 5;
}

// Type discriminator for KV values.
enum KvValueType {
  // Invalid/unspecified type.
  //
  // Proto3 enum default is this value, but write APIs reject it.
  KV_VALUE_TYPE_UNSPECIFIED = 0;

  // Plain string value.
  KV_VALUE_TYPE_STRING = 1;

  // JSON numeric value.
  KV_VALUE_TYPE_NUMBER = 2;

  // Arbitrary JSON value.
  KV_VALUE_TYPE_JSON = 3;
}

// KV entry record.
message KvEntry {
  // Key path.
  string key = 1;

  // Raw stored value string.
  //
  // Interpretation depends on `value_type`.
  string value = 2;

  // Type discriminator for `value`.
  KvValueType value_type = 3;

  // Monotonic version used for optimistic concurrency.
  int64 version = 4;

  // RFC3339 creation timestamp.
  string created_at = 5;

  // RFC3339 update timestamp.
  string updated_at = 6;

  // Whether the value is stored encrypted at rest (docs/kv-encryption.md).
  //
  // `value` is always the plaintext on the wire; this only reports how the
  // row is held in the store. `false` for rows written before encryption
  // was enabled (or with `encryption.enabled = false`) that no rewrap has
  // converted yet — `legion keyring status` counts them.
  bool encrypted = 7;
}

// KV lock record.
message KvLock {
  // Key this lock protects.
  string key = 1;

  // Lock token that must be provided for renew/release and optional writes.
  string lock_id = 2;

  // Optional owner label for debugging/auditing.
  optional string owner = 3;

  // RFC3339 time lock was acquired.
  string acquired_at = 4;

  // RFC3339 lock expiration timestamp.
  string expires_at = 5;
}

// Request payload for PutKv.
message PutKvRequest {
  // Key path to create or update.
  //
  // Must be non-empty.
  string key = 1;

  // Value to store.
  //
  // Interpretation and validation depend on `value_type`.
  string value = 2;

  // Value type for normalization/validation.
  //
  // Required for writes. Default enum value is
  // `KV_VALUE_TYPE_UNSPECIFIED`, which manager rejects.
  KvValueType value_type = 3;

  // Optional expected version for optimistic concurrency checks.
  //
  // Behavior:
  // - Update existing key: must match current version.
  // - Create new key: may be omitted, or explicitly `0`.
  optional int64 expected_version = 4;

  // Optional lock token; required when key is actively locked by another client.
  //
  // Default: unset.
  optional string lock_id = 5;

  // Side effect:
  // - If this key is referenced by one or more jobspec KV refs, manager recomputes
  //   affected job configs and may create/update rollouts.
}

// Reply payload for PutKv.
message PutKvReply {
  // Stored KV entry after write.
  //
  // Includes incremented `version` and normalized `value`.
  // Manager sets this on successful responses.
  KvEntry entry = 1;
}

// Request payload for GetKv.
message GetKvRequest {
  // Key path to fetch.
  //
  // Must be non-empty.
  string key = 1;

  // Return the entry without its value: `entry.value` is the empty string
  // and the manager does not decrypt it. Everything else (type, version,
  // timestamps, `encrypted`, and `GetKvReply.references`) is returned.
  //
  // For a client that shows a key's details and reveals the value only on
  // request. Default `false`. Needs the same `kv:read` as a full read.
  bool metadata_only = 2;
}

// Reply payload for GetKv.
message GetKvReply {
  // Entry when found; unset when key does not exist.
  optional KvEntry entry = 1;

  // Jobs whose current config reads this key: through a `$path/key`
  // reference anywhere in the jobspec, or through a task's `kvInjections`
  // (env vars and files rendered from KV). One entry per place the key is
  // read, so a job that reads it twice appears twice with different
  // `json_pointer`s.
  //
  // Recorded at submit time from the job's latest config; a job that stopped
  // reading the key drops out when its next version is submitted. Only jobs
  // the caller holds `job:read` on are listed, so the list can be shorter
  // than the real set. Returned even when `entry` is unset, so a reference
  // to a key that was deleted is still visible.
  repeated KvJobReference references = 2;
}

// One place a job's config reads a KV key (GetKvReply.references).
message KvJobReference {
  // Job that reads the key.
  string job_id = 1;

  // Job config that recorded the reference (the job's latest version when
  // it was submitted).
  string job_config_id = 2;

  // Where in the job config the key is read, as a JSON pointer: for example
  // `/tasks/0/config/env/DB_PASSWORD` for a `$path/key` reference, or
  // `/tasks/web/kvInjections/env/GREETING` for an injected env var.
  string json_pointer = 3;
}

// Request payload for ListKv.
message ListKvRequest {
  // Prefix filter; entries with keys beginning with this prefix are returned.
  //
  // Default empty string matches all keys.
  string prefix = 1;

  // Return each entry's value. Default `false`: entries come back with
  // `value` set to the empty string, and the manager never decrypts them.
  //
  // Listing is for browsing keys; reading a secret should be a deliberate
  // act, so a listing does not ship every plaintext to whoever asks for the
  // key names. Fetch one value with `GetKv`, or set this to `true` (as
  // `legion kv list --values` does) to get them all. Every other field
  // (type, version, timestamps, `encrypted`) is returned either way.
  bool include_values = 2;
}

// Reply payload for ListKv.
message ListKvReply {
  // Matching KV entries.
  repeated KvEntry entries = 1;
}

// Request payload for DeleteKv.
message DeleteKvRequest {
  // Key path to delete.
  //
  // Must be non-empty.
  string key = 1;

  // Optional expected version for optimistic concurrency checks.
  //
  // Default: unset (no version check).
  optional int64 expected_version = 2;

  // Optional lock token; required when key is actively locked by another client.
  //
  // Default: unset.
  optional string lock_id = 3;
}

// Reply payload for DeleteKv.
message DeleteKvReply {
  // Human-readable result message.
  //
  // Current manager reply value: `"kv entry deleted"`.
  string message = 1;
}

// Request payload for PatchKv.
message PatchKvRequest {
  // Key path to patch.
  //
  // Must reference an existing JSON-typed KV entry.
  string key = 1;

  // RFC6902 JSON patch payload as text.
  //
  // Must parse as a valid JSON Patch document.
  string patch_json = 2;

  // Optional expected version for optimistic concurrency checks.
  //
  // Default: unset (no version check).
  optional int64 expected_version = 3;

  // Optional lock token; required when key is actively locked by another client.
  //
  // Default: unset.
  optional string lock_id = 4;

  // Side effect:
  // - If this key is referenced by one or more jobspec KV refs, manager recomputes
  //   affected job configs and may create/update rollouts.
}

// Reply payload for PatchKv.
message PatchKvReply {
  // Updated KV entry after patch.
  //
  // Includes incremented `version`.
  // Manager sets this on successful responses.
  KvEntry entry = 1;
}

// Request payload for AcquireKvLock.
message AcquireKvLockRequest {
  // Key path to lock.
  //
  // Must be non-empty.
  string key = 1;

  // Optional caller-supplied lock token.
  //
  // If omitted, manager generates a random 32-hex-character token.
  // If provided and it matches an existing active lock ID for this key,
  // acquire is allowed even without `force=true`.
  optional string lock_id = 2;

  // Optional owner label for diagnostics.
  //
  // Default: unset.
  optional string owner = 3;

  // Lease duration in seconds.
  //
  // Must be > 0.
  int64 ttl_seconds = 4;

  // When true, allows replacing an existing non-expired lock.
  //
  // Default: `false`.
  bool force = 5;
}

// Reply payload for AcquireKvLock.
message AcquireKvLockReply {
  // Active lock state.
  //
  // Manager sets this on successful responses.
  KvLock lock = 1;
}

// Request payload for RenewKvLock.
message RenewKvLockRequest {
  // Key path.
  string key = 1;

  // Lock token currently held by caller.
  //
  // Must match the active lock's ID.
  string lock_id = 2;

  // New lease duration in seconds.
  //
  // Must be > 0.
  int64 ttl_seconds = 3;

  // Behavior note:
  // - If lock is already expired, manager removes it and returns a conflict.
}

// Reply payload for RenewKvLock.
message RenewKvLockReply {
  // Updated lock state.
  //
  // Manager sets this on successful responses.
  KvLock lock = 1;
}

// Request payload for ReleaseKvLock.
message ReleaseKvLockRequest {
  // Key path.
  string key = 1;

  // Lock token currently held by caller.
  //
  // Must match the active lock's ID.
  string lock_id = 2;
}

// Reply payload for ReleaseKvLock.
message ReleaseKvLockReply {
  // Human-readable result message.
  //
  // Current manager reply value: `"kv lock released"`.
  string message = 1;
}

// Request payload for GetKvLock.
message GetKvLockRequest {
  // Key path.
  //
  // Must be non-empty.
  string key = 1;
}

// Reply payload for GetKvLock.
message GetKvLockReply {
  // Active non-expired lock when present.
  //
  // If the stored lock is expired, manager removes it and returns unset.
  optional KvLock lock = 1;
}

// Request payload for ListServices.
message ListServicesRequest {
  // Namespaces to list services from: names or `*`-globs (docs/
  // namespaces.md), as ListJobsRequest.namespaces: empty means `default`,
  // `["*"]` every namespace the caller can read. A service is identified by
  // its namespace and name, so two namespaces' `web` are two entries.
  repeated string namespaces = 1;
}

// Aggregate view of one declared service.
message ServiceSummary {
  // Service name (from `service.name`, defaulting to the task name).
  string service = 1;

  // Job ID whose task declares this service.
  string job_id = 2;

  // Task name declaring this service.
  string task_name = 3;

  // Count of endpoints currently passing health (see ResolveService for the
  // healthy definition).
  uint32 healthy_count = 4;

  // Total endpoint (allocation) count for this service, healthy or not.
  uint32 total_count = 5;

  // Service tags declared in the task's `service.tags`.
  repeated string tags = 6;

  // Service metadata declared in the task's `service.meta`, stringified.
  //
  // Free-form, but `protocol` is conventional (`http`, `https`, `grpc`, …) and
  // is what clients use to turn an endpoint into a URL.
  map<string, string> meta = 7;

  // Who may call the service, from the task's `service.allow`: bare entries
  // are job id globs (`web`, `agent-*`), entries with colons are workload
  // identity globs over `<region>:<job>:<group>:<task>`
  // (`*:billing:*:worker`).
  //
  // Empty — the default — means *every* caller may connect, and so does a
  // single `"*"` entry; the two are reported verbatim rather than normalized
  // so tooling can tell "no policy declared" from "explicitly open". The list
  // filters the endpoint list a consuming allocation receives in
  // `HeartbeatReply.upstream_endpoints`; on a `service.mesh = true` service
  // the receiving node also refuses a verified caller outside it
  // (`Legion-Denied-By: service/allow`). It never affects who may *read* the
  // catalog through ListServices/ResolveService.
  //
  // Reported here so a read-only caller (`job:read`) can explain why its
  // consumer resolves to nothing — `legion service doctor` prints this list —
  // without needing state-store access to the underlying task config.
  //
  // A bare entry (or `*`) admits jobs in the service's own namespace only;
  // a qualified entry (`checkout-prod/api`, `payments-*/api`, `*/*`) admits
  // jobs from another (docs/namespaces.md, "Crossing a namespace").
  repeated string allow = 8;

  // The namespace the service lives in: its declaring job's.
  string namespace = 9;
}

// Reply payload for ListServices.
message ListServicesReply {
  // All declared services. Empty when no stored task config declares a
  // `service` block.
  repeated ServiceSummary services = 1;
}

// Request payload for ResolveService.
message ResolveServiceRequest {
  // Service to resolve: `web` for the service in the `default` namespace,
  // `payments-prod/web` for one in another. Matches `service.name`
  // (defaulting to the task name) on stored task configs in that namespace.
  // Only endpoints of jobs the caller may read are returned.
  string service = 1;

  // When true, endpoints failing (or missing) health are also returned, with
  // `healthy` set accordingly. Default false: only healthy endpoints.
  bool include_unhealthy = 2;
}

// One resolvable endpoint of a service.
message ServiceEndpoint {
  // Service name this endpoint belongs to.
  string service = 1;

  // Job ID whose task declares the service.
  string job_id = 2;

  // Task name declaring the service.
  string task_name = 3;

  // Allocation ID backing this endpoint.
  int64 allocation_id = 4;

  // Node ID currently hosting the endpoint.
  string node_id = 5;

  // Routable address (host/IP) of the endpoint's node. Derived from the
  // node's advertised worker address. Empty when the node has no advertised
  // address.
  string address = 6;

  // Host port assigned to the service's advertised port label.
  uint32 port = 7;

  // True when the endpoint's latest allocation health snapshot is healthy and
  // its node is alive.
  bool healthy = 8;

  // Human-readable health status detail from the latest snapshot (for
  // example `healthy`, `starting`, or a check failure description). Empty
  // when no snapshot has been reported yet.
  string health_status = 9;

  // Service tags declared in the task's `service.tags`.
  repeated string tags = 10;

  // Service metadata declared in the task's `service.meta`, stringified.
  //
  // Free-form, but `protocol` is conventional (`http`, `https`, `grpc`, …) and
  // is what clients use to turn `address:port` into a URL.
  map<string, string> meta = 11;

  // Name of the `network.ports` entry this endpoint advertises, when the
  // service names a port label rather than a literal port number.
  string port_label = 12;

  // True when the endpoint's advertised port terminates **mesh TLS** — its
  // task's service is on the mesh (`service.mesh = true`, or imposed by a
  // policy object), resolved at placement (docs/network-handlers.md). A consuming node's datapath then originates
  // TLS with its own node certificate and names the consuming workload in a
  // PROXY protocol v2 TLV; a plain client dialing the port directly is
  // refused at the handshake.
  bool mesh_tls = 13;

  // Public host name or IP of the endpoint's node, when its worker was
  // started with `LEGION_WORKER_PUBLIC_ADDRESS`; empty otherwise.
  //
  // `address` is where the cluster reaches the endpoint (usually a private
  // address); this is where a client outside the private network reaches
  // the same `port`, for links in the UI and CLI. Display only: nothing in
  // the cluster dials it, and it does not open the port — the node's
  // firewall or security group must still allow the traffic.
  string public_address = 14;

  // The namespace the endpoint's service lives in (its job's).
  string namespace = 15;
}

// Request payload for ListServiceEdges.
message ListServiceEdgesRequest {
  // Only edges into (or out of) this service or job; empty for the whole
  // graph. Matches an edge's `target` (the canonical service, e.g.
  // `payments-prod/api`), its `service` key, or its `caller_job`.
  string service = 1;

  // Window the observed counters are summed over, seconds. Default 300,
  // at most 900 (the manager keeps 15 minutes of per-minute buckets).
  uint32 window_secs = 2;
}

// One edge of the service graph.
message ServiceEdge {
  // The caller: the job and task whose datapath made the calls (or declared
  // the upstream).
  string caller_job = 1;
  string caller_task = 2;

  // The callee: a catalog service name, or an external upstream's `name`.
  string service = 3;

  // The endpoint tag the calls were balanced to; empty when untagged.
  string tag = 4;

  // `tcp`, `http`, or empty for a declared-only edge.
  string protocol = 5;

  // The caller's latest job config declares this service as an upstream.
  bool declared = 6;

  // The service's `allow` intentions admit the caller (always true for an
  // external upstream or an undeclared service).
  bool allowed = 7;

  // Observed over the window (zero for a declared-only edge).
  uint64 requests = 8;
  uint64 errors = 9;
  uint64 denied = 10;
  double latency_ms_avg = 11;
  uint64 latency_ms_max = 12;
  uint64 bytes_out = 13;
  uint64 bytes_in = 14;

  // Requests per second and error rate over the window.
  double rps = 15;
  double error_rate = 16;

  // When the manager last folded a sample for this edge, Unix seconds; 0 for
  // a declared-only edge.
  int64 last_seen_unix = 17;

  // The canonical service `service` resolves to (`payments-prod/api`, bare
  // in `default`): `service` is the caller's upstream key (an alias, or
  // `api.payments-prod` for a crossing), this is the catalog entry it
  // dials. Equal to `service` for an external upstream.
  string target = 18;
}

// Reply payload for ListServiceEdges.
message ListServiceEdgesReply {
  repeated ServiceEdge edges = 1;

  // The window the counters cover, seconds.
  uint32 window_secs = 2;
}

// Reply payload for ResolveService.
message ResolveServiceReply {
  // Matching endpoints. Empty when the service is unknown or (by default) has
  // no healthy endpoints — callers can distinguish the two via ListServices.
  repeated ServiceEndpoint endpoints = 1;
}

// Request payload for GetArtifactCredential.
message GetArtifactCredentialRequest {
  // Worker/node ID requesting the credential.
  //
  // With ACLs enforced it must match the node token on the request (see
  // `HeartbeatRequest.id`). The credential value itself is never logged.
  string node_id = 1;

  // KV path holding the credential value (for example: "secrets/ghcr-pull").
  //
  // The KV value must be a JSON object with a `type` discriminator:
  // `{"type":"basic","username":"…","password":"…"}`,
  // `{"type":"bearer","token":"…"}`,
  // `{"type":"aws","accessKeyId":"…","secretAccessKey":"…","sessionToken":"…",
  //   "region":"…","endpoint":"…"}`, or
  // `{"type":"headers","headers":{"X-Api-Key":"…"}}`.
  string kv_path = 2;

  // Redacted artifact source the credential will be used for.
  //
  // Audit context only (scheme://host/path with userinfo and query stripped).
  string source = 3;
}

// Reply payload for GetArtifactCredential.
message GetArtifactCredentialReply {
  // JSON-encoded credential value read from KV at request time.
  //
  // Returned to the worker for immediate use; never persisted on allocation
  // rows. Rotating the KV value affects the next fetch with no job changes.
  string credential_json = 1;
}

// Request payload for QueryStateStore.
message QueryStateStoreRequest {
  // SQL statement to execute.
  //
  // The server currently accepts a single statement per request.
  string sql = 1;

  // Allows write/mutating statements when true.
  //
  // Default behavior when false: only read/query statements are accepted.
  bool allow_write = 2;
}

// One row from QueryStateStore results encoded as JSON object text.
message QueryStateStoreRow {
  // JSON object containing column name => value for one returned row.
  string json = 1;
}

// Reply payload for QueryStateStore.
message QueryStateStoreReply {
  // Statement category inferred by the manager (for example: SELECT, UPDATE).
  string statement_type = 1;

  // Ordered result column names for tabular query results.
  repeated string columns = 2;

  // Returned rows for query statements.
  //
  // Mutating statements typically return an empty list.
  repeated QueryStateStoreRow rows = 3;

  // Number of rows affected for mutating statements.
  //
  // For read-only statements this is usually zero.
  uint64 affected_rows = 4;
}

// Request payload for GetStateStoreSchema.
message GetStateStoreSchemaRequest {}

// One table/view schema in the SQLite state store.
message StateStoreSchemaObject {
  // Object kind such as table or view.
  string kind = 1;

  // Object name.
  string name = 2;

  // Full CREATE SQL for the object when available.
  string create_sql = 3;

  // Column definitions for this object.
  repeated StateStoreSchemaColumn columns = 4;
}

// One column definition inside a SQLite schema object.
message StateStoreSchemaColumn {
  // Column ordinal position from SQLite pragma output.
  int32 ordinal = 1;

  // Column name.
  string name = 2;

  // Declared SQLite type.
  string data_type = 3;

  // Whether this column is declared NOT NULL.
  bool not_null = 4;

  // Raw SQLite default expression/value when present.
  optional string default_value = 5;

  // Whether this column participates in the primary key.
  bool primary_key = 6;
}

// Reply payload for GetStateStoreSchema.
message GetStateStoreSchemaReply {
  // Ordered schema objects available in the current store.
  repeated StateStoreSchemaObject objects = 1;
}

// Request payload for ListSavedStateQueries.
message ListSavedStateQueriesRequest {}

// Saved query metadata used by the State Explorer UI.
message SavedStateQuery {
  // Unique, user-visible query name.
  string name = 1;

  // SQL text.
  string sql = 2;

  // RFC3339 creation timestamp.
  string created_at = 3;

  // RFC3339 last-update timestamp.
  string updated_at = 4;
}

// Reply payload for ListSavedStateQueries.
message ListSavedStateQueriesReply {
  // Saved queries sorted by name.
  repeated SavedStateQuery queries = 1;
}

// Request payload for UpsertSavedStateQuery.
message UpsertSavedStateQueryRequest {
  // Query name to create or overwrite.
  string name = 1;

  // SQL text to save.
  string sql = 2;
}

// Reply payload for UpsertSavedStateQuery.
message UpsertSavedStateQueryReply {
  // Saved query after create/update.
  SavedStateQuery query = 1;
}

// Request payload for DeleteSavedStateQuery.
message DeleteSavedStateQueryRequest {
  // Query name to delete.
  string name = 1;
}

// Reply payload for DeleteSavedStateQuery.
message DeleteSavedStateQueryReply {
  // Human-readable result message.
  string message = 1;
}

// One ledger row grouping a node with its current allocations.
message LedgerNode {
  // Node record.
  optional NodeMsg node = 1;

  // Allocations currently assigned to this node.
  repeated LedgerAllocation allocations = 2;
}

// Allocation record as returned in ledger responses.
message LedgerAllocation {
  // Allocation ID.
  int64 id = 1;

  // Allocation status.
  string status = 2;

  // JSON-encoded resource payload.
  string resources = 3;

  // Node ID where this allocation is placed.
  string node_id = 4;

  // Job config ID this allocation targets.
  string job_config_id = 5;

  // Task config ID this allocation targets.
  int64 task_config_id = 6;

  // Job ID this allocation belongs to.
  string job_id = 7;

  // JSON-encoded assigned network payload (address + ports) for this
  // allocation, matching the `AllocNetwork` shape. Empty string when the
  // task declares no network block.
  string network = 10;

  // Optional JSON-encoded per-artifact staging states from the latest worker
  // health snapshot. Same payload as `AllocationHealth.artifact_states`.
  //
  // Unset when the allocation's task declares no artifacts or no snapshot
  // has been received yet.
  optional string artifact_states = 8;

  // Stable instance id this allocation fulfills, set only when the backing
  // task is stateful (slot or keyed mode; see `docs/stateful-workloads.md`).
  //
  // The instance id survives reschedules: a replacement allocation for the
  // same slot/keyed instance reports the same value here. Unset for
  // stateless tasks. Full instance metadata (mode, state, slot index,
  // storage handle) is available via `GetInstance` / `ListInstances`.
  optional string instance_id = 9;

  // Name of the task this allocation runs (the `name` of the task config
  // named by `task_config_id`).
  //
  // Lets a client group a job's allocations by task without a second
  // lookup. Empty only when the task config row is gone, which a live
  // allocation never sees.
  string task_name = 11;
}

// Request payload for UpdateNodeDynamic.
message UpdateNodeDynamicRequest {
  // Node ID to update.
  string id = 1;

  // JSON object string merged into node dynamic attributes.
  //
  // Merge behavior is shallow object merge by key.
  // Keys present in `dynamic_diff` overwrite existing keys.
  string dynamic_diff = 2;

  // Side effect:
  // - Manager enqueues `job_update` evals for job configs currently allocated
  //   on this node, using manager default eval priority (default `50`).
}

// Reply payload for UpdateNodeDynamic.
message UpdateNodeDynamicReply {
  // Updated node record.
  //
  // Includes merged dynamic attributes as persisted by manager.
  optional NodeMsg node = 1;
}

// One scheduler event from the manager's event journal.
//
// Events are emitted by the manager whenever the scheduler does something
// observable: eval queue activity, allocation placement and removal, node
// lifecycle transitions, job lifecycle transitions, and rollout activity.
message SchedulerEvent {
  // Increasing event ID.
  //
  // IDs are assigned by the manager's state store and are never reused, so
  // they double as a resume cursor for `ListEvents`/`StreamEvents`.
  //
  // IDs are SPARSE, not consecutive: they are minted from a timestamp plus
  // the manager's raft write lane (each lane mints in its own stride, so
  // concurrent lanes can never collide), and pruning removes old ones.
  // Treat an ID only as an opaque cursor — never as a count, an index, or
  // something to increment.
  int64 id = 1;

  // Dotted event kind, namespaced by subsystem.
  //
  // Current kinds include:
  // - `scheduler.started`, `scheduler.recovered`
  // - `eval.enqueued`, `eval.completed`, `eval.failed`
  // - `allocation.placed`, `allocation.removed`, `allocation.failed`, `allocation.plan_rejected`
  // - `node.registered`, `node.ready`, `node.lost`
  // - `job.submitted`, `job.updated`, `job.stopped`, `job.destroyed`, `job.failed`
  // - `rollout.event`
  string kind = 2;

  // Event severity. Values: `info`, `warn`, `error`.
  string level = 3;

  // Job ID this event relates to, when applicable.
  optional string job_id = 4;

  // Node ID this event relates to, when applicable.
  optional string node_id = 5;

  // Eval ID this event relates to, when applicable.
  optional string eval_id = 6;

  // Allocation ID this event relates to, when applicable.
  optional int64 allocation_id = 7;

  // Rollout ID this event relates to, when applicable.
  optional int64 rollout_id = 8;

  // Human-readable event description.
  string message = 9;

  // JSON object string with kind-specific structured details.
  //
  // Always a valid JSON object; `{}` when the event has no extra detail.
  string metadata_json = 10;

  // RFC3339 timestamp when the event was recorded.
  string created_at = 11;

  // The namespace the event belongs to: its job's, or the namespace a
  // `namespace.*` lifecycle event is about. Empty for cluster events
  // (nodes, raft, the scheduler).
  string namespace = 12;
}

// Request payload for ListEvents.
message ListEventsRequest {
  // Exclusive lower-bound event ID cursor.
  //
  // When set, only events with `id > after_id` are returned (oldest first),
  // so repeated polling never skips an event (IDs themselves are sparse —
  // see `SchedulerEvent.id`). When omitted, the most recent
  // `limit` events are returned (still ordered oldest-to-newest).
  optional int64 after_id = 1;

  // Maximum number of events to return.
  //
  // Default when omitted: `100`. Manager bounds: clamped to `[1, 1000]`.
  optional uint32 limit = 2;

  // Optional kind filter.
  //
  // Matches events whose kind equals the value exactly, or whose kind starts
  // with `<value>.` — so `eval` matches `eval.completed` and `eval.failed`.
  optional string kind = 3;

  // Optional exact job ID filter.
  optional string job_id = 4;

  // Optional exact node ID filter.
  optional string node_id = 5;

  // Optional severity filter. Values: `info`, `warn`, `error`.
  optional string level = 6;

  // Optional stateful instance filter: only events about this instance.
  //
  // An event is about an instance when its `metadata_json` names it — as
  // `instanceId` (suspend, resume, restore, fork, snapshot, volume, and
  // provisional-start events) or `instance_id` (`node.pressure`), as one of `instances` (the
  // forks an `instance.forked` or `instance.fork_failed` created), or as one
  // of `suspending` (the instances an `instance.make_room` suspended) — or
  // when it is about an allocation that fulfilled the instance, matched the
  // way `allocation_id` matches (so `allocation.placed`, `allocation.failed`,
  // `allocation.stopping`, and the rest). The allocation match covers
  // allocations the manager still has a row for; events about an allocation
  // whose row has since been pruned match only through their metadata.
  //
  // Combines with the other filters (AND). Matched exactly; an unknown id
  // simply matches nothing.
  optional string instance_id = 7;

  // Optional allocation filter: only events about this allocation.
  //
  // Matches `SchedulerEvent.allocation_id`, and also the batched events that
  // cover several allocations and so leave that field unset: they list them
  // in metadata as `placements[].allocationId` (`allocation.placed`) or
  // `allocations[].allocationId` (`allocation.stopping`,
  // `allocation.preempted`), or `victims[].allocationId`
  // (`allocation.preempt_planned`). A batched event lists at most its first
  // 20 allocations, so a batch of more than 20 matches only for those 20. `allocation.removed` events name no allocation ids and never
  // match.
  optional int64 allocation_id = 8;

  // Optional namespace filter: names or `*`-globs (docs/namespaces.md).
  // Keeps only events whose `namespace` matches, so cluster events (which
  // have none) are left out. Empty means no namespace filter — every event
  // the caller may see. Narrows what is visible, never widens it.
  repeated string namespaces = 9;
}

// Reply payload for ListEvents.
message ListEventsReply {
  // Matching events ordered oldest-to-newest.
  repeated SchedulerEvent events = 1;

  // Highest event ID currently stored by the manager (0 when no events).
  //
  // Clients can use this to initialize an `after_id` cursor for follow-up
  // `ListEvents` polls or a `StreamEvents` call.
  int64 latest_id = 2;
}

// Request payload for StreamEvents.
message StreamEventsRequest {
  // Exclusive lower-bound event ID to replay from.
  //
  // When set, persisted events with `id > after_id` are sent before the live
  // feed. When omitted, the stream starts with events emitted after the
  // stream is established (pure tail).
  optional int64 after_id = 1;

  // Optional kind filter. Same semantics as `ListEventsRequest.kind`.
  optional string kind = 2;

  // Optional exact job ID filter.
  optional string job_id = 3;

  // Optional exact node ID filter.
  optional string node_id = 4;

  // Optional severity filter. Values: `info`, `warn`, `error`.
  optional string level = 5;

  // Optional stateful instance filter. Same semantics as
  // `ListEventsRequest.instance_id`, with one difference for live events:
  // the allocation match is resolved against the instance's allocations when
  // each event arrives, so an allocation placed after the stream opened is
  // still matched.
  optional string instance_id = 6;

  // Optional allocation filter. Same semantics as
  // `ListEventsRequest.allocation_id`.
  optional int64 allocation_id = 7;

  // Optional namespace filter. Same semantics as
  // `ListEventsRequest.namespaces`.
  repeated string namespaces = 8;
}

// Internal eval queue item.
message Eval {
  // Eval ID.
  string id = 1;

  // Eval status: `pending`, `in_flight`, `blocked`, or `failed`.
  //
  // Newly enqueued evals start as `pending`. `in_flight` is reported only by
  // the manager whose eval worker has claimed the eval: a claim is that
  // manager's memory, and every other manager shows the row as `pending`.
  // `blocked` means the eval's plan found no room and it waits, under a key
  // (`class:pool=…`, `node:<id>`, `escaped`), for capacity that could help;
  // it returns to `pending` on its own (docs/scheduler-and-eval-loop.md,
  // "Blocked evals"). `failed` evals are never retried.
  string status = 2;

  // Eval kind (for example: job_submit, node_drop, rollout_tick).
  string kind = 3;

  // Associated job ID when applicable.
  //
  // Default empty string when not scoped to a job.
  string job_id = 4;

  // Associated job config ID when applicable.
  //
  // Default empty string when not scoped to a job config.
  string job_config_id = 5;

  // Associated node name/ID when applicable.
  //
  // Default empty string when not scoped to a node.
  string node_name = 6;

  // Eval priority (higher processed first).
  //
  // Default when not explicitly provided: manager `default_priority`
  // (`50` in built-in config defaults).
  int64 priority = 7;
}

// === WORKER ===

// Worker is the per-node runtime API: the worker plane, served by every
// worker on `LEGION_WORKER_HOST:LEGION_WORKER_PORT` (default `0.0.0.0:4848`)
// and advertised as the node's `workerAddress` (`https://<host>:<port>`).
//
// It is always mutual TLS (docs/auth-and-acls.md, "The worker plane"). The
// worker serves its node certificate (IssueNodeCertificate) and requests,
// but does not require, a client certificate chaining to the cluster CA.
// Each RPC admits named caller classes, checked before the request is read:
//
// - `manager`: a client certificate from the cluster CA carrying a
//   `legion://manager/<id>` URI SAN. Every manager mints its own. A node
//   certificate is not a manager certificate.
// - `ticket`: a signed ticket in the request, verified offline. A client
//   certificate is not needed and is ignored.
//
// A call without an admitted class is refused with Unauthenticated, for
// example `GetTaskLogs is a manager-only worker RPC: present a Legion
// manager certificate`. These checks hold whether or not the cluster runs
// ACLs: managers apply ACLs before they dial, and only managers hold
// manager certificates.
service Worker {
  // The worker plane (docs/architecture-managers-workers.md, "The worker
  // plane"). Every worker serves this service over mutual TLS with its node
  // certificate (`<node>.node.legion`, `legion://node/<id>`), on
  // `LEGION_WORKER_HOST:LEGION_WORKER_PORT` (default `0.0.0.0:4848`). There
  // is no plaintext listener. Client certificates are requested, not
  // required; one that is presented must chain to the cluster CA or the
  // handshake fails.
  //
  // Each RPC admits named caller classes, checked before anything else:
  // - `manager`: a client certificate from the cluster CA carrying a
  //   `legion://manager/<id>` URI SAN. A node's certificate is signed by the
  //   same CA but is not a manager certificate.
  // - `ticket`: no client certificate; the request carries a ticket the RPC
  //   verifies offline.
  // A request that presents a certificate other than a manager's is refused
  // with Unauthenticated, never treated as a ticket holder.
  // `tests/integration/worker_plane_classes.rs` fails the build when an RPC here has no
  // class.

  // Delivers one allocation payload to worker for execution/reconciliation.
  // Caller class: manager. Errors: Unauthenticated without a manager
  // certificate.
  rpc PostWork (PostWorkRequest) returns (PostWorkReply);

  // Requests the worker process to restart itself. Caller class: manager.
  // Errors: Unauthenticated without a manager certificate;
  // FailedPrecondition when `node_id` names a node other than this worker
  // (a manager holding a stale address never restarts the wrong machine).
  rpc RestartWorker (RestartWorkerRequest) returns (RestartWorkerReply);

  // Reads captured stdout/stderr files for one allocation on this node.
  // Caller class: manager. Errors: Unauthenticated without a manager
  // certificate.
  rpc GetTaskLogs (GetTaskLogsRequest) returns (GetTaskLogsReply);

  // Runs an exec session against a local allocation. Caller classes:
  // manager, ticket.
  //
  // - manager: the manager has already authorized the caller and rendered
  //   any action command into a raw argv on the `ExecStart` frame.
  // - ticket (direct exec, docs/exec-and-actions.md "Direct exec"): no
  //   client certificate, and `ExecStart.exec_ticket` carries a ticket from
  //   `Manager.MintExecTicket`. Admitted only on a worker whose config sets
  //   `exec = { direct = true }`. The worker verifies the ticket offline
  //   against the cluster JWKS: signature, `aud = legion:exec`, expiry with
  //   the worker's clock skew, issued after this worker process started,
  //   `legion.io/node` is this node, the allocation is running here under
  //   the ticket's job and task, the `ExecStart` argv and tty fit the ticket,
  //   and the `jti` has not been redeemed on this node. The session ends
  //   after the ticket's `legion.io/max_session` seconds, or when a manager
  //   names it in `HeartbeatReply.revoked_exec_sessions`.
  //
  // Errors: Unauthenticated when the request carries neither a manager
  // certificate nor a ticket ("ExecTask admits a manager certificate or an
  // exec ticket; this request carried neither"), or presents a certificate
  // that is not a manager's; FailedPrecondition for a ticket on a worker
  // without `exec.direct`; PermissionDenied for a ticket that fails any
  // check above, with the check named.
  rpc ExecTask (stream ExecClientFrame) returns (stream ExecServerFrame);

  // Delivers one HTTP request to an app allocation's UI port and returns
  // the answer: the unary subset of a worker-plane tunnel that app views
  // and actions need (docs/apps.md, "Views and actions";
  // Manager.GetAppView). Caller class: manager. The manager has already
  // authorized the viewer and put a signed viewer assertion in the
  // request's `legion-viewer` header; the worker adds nothing and checks
  // nothing about the viewer.
  //
  // What the worker does check, so this is not a general proxy:
  // - the allocation runs on this node, now, and its job is the request's
  //   `job_id`, in the reserved `legion-system` namespace (apps only);
  // - the allocation declares the port label `port`;
  // - the method is GET or POST, the path starts with `/legion/v1/`, only
  //   the `legion-viewer`, `content-type`, and `accept` headers pass, and
  //   the body is at most 256 KiB.
  //
  // It then dials the port the way the ingress datapath does (loopback,
  // inside the task's network namespace when it is gated; a sandbox guest
  // over vsock or its bridge address), never a caller-named address, sends
  // one HTTP/1.1 request, and reads at most 1 MiB of answer within 10
  // seconds.
  //
  // Errors: Unauthenticated without a manager certificate; InvalidArgument
  // for a request outside the limits above; NotFound when the allocation
  // does not run here or runs another job; FailedPrecondition when the job
  // is not an app's or the port is not declared; Unavailable when the port
  // cannot be dialed; DeadlineExceeded when the app does not answer in
  // time.
  rpc ForwardAppRequest (ForwardAppRequestRequest) returns (ForwardAppRequestReply);

  // Starts work on this node from a boot ticket, without any call to a
  // manager on the critical path (docs/edge-boot.md). Caller class: ticket.
  //
  // This is the edge entry point: a platform's router hands the node a
  // ticket it minted ahead of time, the node verifies it offline against the
  // cached JWKS, admits it against its own free resources, and boots to the
  // gate level. Ratification runs in parallel and its verdict arrives on
  // this same stream.
  //
  // Server-streaming so the caller learns each transition without polling —
  // a router may begin routing at `booted` and must be prepared for
  // `refused` at any point until `ratified`.
  //
  // Rejected with FailedPrecondition unless the worker was configured with
  // `edgeBoot.acceptClaims: true`.
  //
  // Rejected with ResourceExhausted, carrying the stable error code
  // `OVERLOADED` in the `legion-error-code` response metadata, when the
  // node's claim window stayed full for `edgeBoot.queueTimeout`
  // (docs/edge-boot.md, "Overload"). The window bounds the unratified edge
  // claims a node holds (`edgeBoot.maxProvisionalPerNode`) and halves when
  // ratifications come back later than `edgeBoot.overloadThreshold` of their
  // lease. Such a refusal happens before admission: nothing is held, booted,
  // or spent, so a retry may present the same ticket. Retry with backoff.
  // A message that says recent ratifications were slow means the managers
  // are behind, which other nodes of the pool share.
  //
  // Caller class: `ticket`. Callers are authorized by the boot ticket
  // alone; no client certificate is needed and one that is presented is
  // ignored. Callers dial `https://` and verify the node's certificate
  // against the cluster CA (`legion net ca show`), as `legion sandbox
  // start` does.
  rpc StartClaim (StartClaimRequest) returns (stream StartClaimReply);

  // Answers a manager's reachability check (docs/architecture-managers-
  // workers.md, "Reachability"). The manager that accepts a registration
  // probes the worker's advertised address once its worker plane is up, and
  // records the outcome on the node (`workerPlane` in its dynamic
  // attributes, shown by `legion node info`). Informational only: it does
  // not feed node readiness. Caller class: manager. Errors: Unauthenticated
  // without a manager certificate.
  rpc Probe (ProbeRequest) returns (ProbeReply);

  // Ends sessions on this node (docs/session-mode.md). Called by a manager
  // for `instance stop` or `instance destroy` on a session, and to stop the
  // later copy of a duplicated session id. Ids the node does not run are
  // ignored, so the call is idempotent.
  //
  // Caller class: `manager` (a client certificate from the cluster CA
  // carrying `legion://manager/<id>`); anything else is refused with
  // `Unauthenticated`.
  rpc StopSessions (StopSessionsRequest) returns (StopSessionsReply);

  // Answers for one session on this node (session durability plan §6.3,
  // docs/session-mode.md "Routing"). A manager calls it to route `instance
  // get|stop|start|promote` on a session id straight to the node its id
  // names, instead of asking every manager's session index.
  //
  // The node's answer is authoritative for itself:
  // - OK with the session's status when the node holds it, running or
  //   sleeping.
  // - NotFound when it does not. The message starts with `wrong_node` when
  //   the id's node tag is not this node's (the caller routed by something
  //   other than the id, or the session moved), and with `not_found`
  //   otherwise. A node that evicted a local-only checkpoint answers
  //   NotFound starting with `evicted` for `suspend.keepFor` after the
  //   eviction, naming when and why.
  //
  // Caller classes: `manager`, and `ticket` (a session ticket, see
  // `StartSession`, for the session's job and task).
  rpc GetSession (GetSessionRequest) returns (GetSessionReply);

  // Starts a session of a session task on this node from a session ticket,
  // with no manager on the path (session durability plan §6.4,
  // docs/session-mode.md "Starting at the edge"). The node verifies the
  // ticket offline, mints the session id with its own node tag, admits the
  // session into its envelope, launches it, and answers once it is running.
  // Managers learn about it from the node's next heartbeat; nothing is
  // written to raft.
  //
  // A platform keeps a consistent-hash ring over `ListSessionNodes` and
  // sends each new session to a node on it. Every later request for the
  // session is routed by its id's node tag, never by hashing again.
  //
  // With `idempotency_key`, the node derives the session id from the key
  // (the untagged shape) and answers a retry that lands on it from its own
  // table with `deduplicated = true`. A retry that lands on another node
  // (a ring change) starts a second copy there; the managers' duplicate
  // sweep stops one of the two (docs/session-mode.md, "Duplicates"). For a
  // task with `suspend.durability = "store"` the node first creates the
  // session's manifest in its `contentStore` with a conditional create
  // (`If-None-Match: *`), so of two nodes that derived the same id only one
  // starts it; the other answers ALREADY_EXISTS naming the first.
  //
  // With `resume_id`, the call resumes an existing session of a `store`
  // task on this node from its manifest instead of starting a new one
  // (docs/session-mode.md, "Moving a session"): the session may have run or
  // slept on another node. A session the manifest says is suspended moves
  // at once. One it says is running on another node is probed there first
  // (`GetSession`, 2 seconds, with this call's ticket): if it runs there,
  // this node claims the next generation and asks that node to stop its
  // copy (`StopSession`) before launching; if that node does not answer,
  // the call answers UNAVAILABLE unless `force_move` is set. The reply's
  // `resumed_from`, `generation`, and `moved_from` say what happened.
  //
  // Caller class: `ticket` (a session ticket: `legion.io/scope = session`,
  // minted with `IssueBootTicket` and `scope = "session"`). Admitted only on
  // a worker with `edgeBoot.acceptClaims: true`.
  //
  // Errors:
  // - FailedPrecondition: edge starts are off on this node, or it holds no
  //   envelope for the task. Not retryable here; try another node.
  // - ResourceExhausted: the envelope is full, or every launch slot stayed
  //   busy for `edgeBoot.queueTimeout`. Retryable on another node.
  // - PermissionDenied: the ticket failed verification (named check).
  // - InvalidArgument: `resume_id` is not a session id of the ticket's task.
  // - NotFound: `resume_id` names a session with no manifest (it ended, or
  //   was never published).
  // - AlreadyExists: an idempotent start of a `store` session that another
  //   node created first. The message ends in `[winner node=<id>
  //   generation=<g>]`; send the session's requests there.
  // - Aborted: a resume lost its generation claim to a racing resume
  //   (`superseded`), naming the winner the same way. Not retryable here.
  // - Unavailable: the content store could not be reached (no generation
  //   can be claimed, so nothing started), or a move found the session
  //   running on a node that did not answer the probe
  //   (`running_elsewhere`). Retry later, or with `force_move` once that
  //   node is known to be down.
  // - Internal: the runtime failed to start the session.
  rpc StartSession (StartSessionRequest) returns (StartSessionReply);

  // Ends one session on this node. Caller class: `ticket` (a session ticket
  // for the session's job and task). Idempotent: a session the node no
  // longer runs answers `stopped = false`. NotFound with `wrong_node` when
  // the id's tag names another node.
  rpc StopSession (StopSessionRequest) returns (StopSessionReply);

  // Suspends sessions on this node (session durability plan §6.6,
  // docs/session-mode.md "Idle sessions"). A manager calls it to route
  // `legion instance suspend <session>` to the node the session id's tag
  // names. For each id the node captures a checkpoint into its content
  // store (a memory checkpoint for a sandbox launched for checkpoints, else
  // a disk checkpoint, which of a session holds only its spec), stops the
  // process, frees the session's share of its envelope, and records the
  // session as `suspended` in its session log, so it survives a worker
  // restart. The checkpoint stays on this node, pinned until the task's
  // `suspend.keepFor` expires, the job stops, or disk pressure
  // (`content.minFreeDisk`) evicts it. Nothing is written to raft.
  //
  // Each id is answered on its own, in `suspended` or `failed`. A session
  // that is already suspended counts as suspended (the call is
  // idempotent). A failed capture leaves the session running. The reply
  // comes once every capture has finished, which for a memory checkpoint
  // takes as long as writing the guest's memory.
  //
  // Only sessions whose task sets a `suspend` block can be suspended; a
  // promoted session is suspended through its row
  // (`Manager.SuspendInstance`). With `durability = "store"` the node then
  // publishes the checkpoint's memory parts, sealed, to its `contentStore`
  // and writes the session's manifest (`suspended`, at the session's
  // generation) with a conditional write; the local copy becomes an
  // evictable cache entry. Such a session can resume on any node with an
  // envelope for its task. A `store` session on a node without a
  // `contentStore` fails FailedPrecondition. A manifest naming a newer
  // generation fails the suspend with Aborted (`superseded`): this copy was
  // stale and has ended. An unreachable content store keeps the session
  // suspended here, unpublished, and the node retries the publish; the
  // entry's `published_url` is empty until it lands.
  //
  // Caller class: `manager` (a client certificate from the cluster CA
  // carrying `legion://manager/<id>`); anything else is refused with
  // `Unauthenticated`.
  rpc SuspendSessions (SuspendSessionsRequest) returns (SuspendSessionsReply);

  // Resumes a suspended session on this node under the same id (session
  // durability plan §6.6). A manager calls it to route `legion instance
  // start <session>` to the node the id's tag names. The node admits the
  // session into its task's envelope again and restores it from its local
  // memory checkpoint, or boots it fresh when the checkpoint is a disk one
  // (it holds only the session's spec) or `cold` is set. The answer comes
  // once the session's runtime returned. A local session never moves, so
  // its generation stays 1.
  //
  // A `store` session (`suspend.durability = "store"`) claims the next
  // generation in its manifest before it starts, with a conditional write;
  // a node whose claim loses answers Aborted naming the winner. With
  // `job_id` and `task_name` set, the node resumes the session from its
  // manifest even when it never held it (the manager's fallback when the
  // tagged node lost the session, evicted its local copy, is full, or does
  // not answer): it admits the session, claims the next generation on the
  // manifest it read, leaves a fence marker for the old node, and restores
  // from the published checkpoint. A manifest naming another node as
  // running the session refuses FailedPrecondition `running_elsewhere`
  // unless `force_move` is set; the caller probes that node first.
  //
  // A session that is already running answers OK with
  // `already_running = true`.
  //
  // Errors:
  // - NotFound: the node does not hold the session. The message starts
  //   with `evicted` when the node evicted its local checkpoint (naming
  //   when and why; reported for `suspend.keepFor` after the eviction, and
  //   not retryable: the session is gone), with `wrong_node` when the id's
  //   node tag names another node, and with `not_found` otherwise.
  // - ResourceExhausted: the envelope has no room for the session right
  //   now, or every launch slot stayed busy for `edgeBoot.queueTimeout`.
  //   Retryable; the session stays suspended with its checkpoint.
  // - FailedPrecondition: the node holds no envelope for the session's
  //   task any more (the job stopped or was moved).
  // - FailedPrecondition `running_elsewhere`: the manifest says another
  //   node runs the session (the message ends in `[winner node=<id>
  //   generation=<g>]`). Probe that node; retry with `force_move` only if it
  //   does not run it or is down.
  // - Aborted: another suspend, checkpoint, or resume of the session is in
  //   progress (retryable), or the generation claim lost (`superseded`,
  //   naming the winner; not retryable here).
  // - Unavailable: the content store holding the session's manifest could
  //   not be reached; nothing was claimed or started.
  // - Internal: the restore failed. The session stays suspended with its
  //   checkpoint (a `store` session's manifest is handed back as
  //   `suspended`).
  //
  // Caller class: `manager`; anything else is refused with
  // `Unauthenticated`.
  rpc ResumeSession (ResumeSessionRequest) returns (ResumeSessionReply);
}

// Request payload for Worker.StartSession.
message StartSessionRequest {
  // The session ticket.
  string ticket = 1;

  // The job and session task to start. Optional: they default to the
  // ticket's, and must match it when set.
  string job_id = 2;
  string task_name = 3;

  // Optional idempotency key. The same key always derives the same session
  // id, so a retry to the same node is answered from its table.
  string idempotency_key = 4;

  // Wait until the session is running before answering (default true:
  // `false` answers once the session is admitted, in state `starting`).
  optional bool wait = 5;

  // Resume this existing session on the receiving node instead of starting
  // a new one (session durability plan §6.6, docs/session-mode.md "Moving a
  // session"). Only a session whose task sets `suspend.durability =
  // "store"` can resume on a node other than the one holding it: the node
  // reads its manifest at the path its id and the ticket's job give, claims
  // the next generation with a conditional write, and restores it under the
  // same id, fetching its checkpoint parts from the content store. A
  // session this node holds suspended resumes from its own checkpoint
  // (claiming the next generation as well); one already running here
  // answers `deduplicated = true`. `idempotency_key` is ignored.
  //
  // The reply's `node_id` is where the session now runs. Its id keeps the
  // node tag it was minted with, which is stale after a move: a picker
  // should cache `session id -> node` from this reply and prefer it over
  // the tag.
  string resume_id = 6;

  // With `resume_id`, move a session the manifest says is running on
  // another node without first reaching that node. By default the node
  // probes the old node (`Worker.GetSession` with the caller's ticket, 2 s)
  // and, when it answers that the session runs there, asks it to stop its
  // copy (`Worker.StopSession`) before moving; when the probe fails it
  // refuses with UNAVAILABLE naming the old node. Set this only when
  // `ListSessionNodes` shows that node down or lost: a forced move of a
  // session that is still running leaves two copies until the old one is
  // fenced (docs/session-mode.md, "No split brain").
  bool force_move = 7;
}

// Reply payload for Worker.StartSession.
message StartSessionReply {
  // The new session's id: `<task>-<this node's tag>.<26 base32>`, or the
  // derived id for an idempotent start.
  string session_id = 1;

  // This node's id.
  string node_id = 2;

  // `running`, or `starting` when the caller did not wait.
  string state = 3;

  // True when an idempotent retry found the session already running here,
  // or a `resume_id` found it running here.
  bool deduplicated = 4;

  // With `resume_id`: `local` (restored from this node's own copy of the
  // checkpoint), `store` (its parts fetched from the content store), or
  // `cold` (a disk checkpoint, which of a session holds only its spec, so
  // it booted fresh under the same id). Empty for a new session.
  string resumed_from = 5;

  // The session's generation after this call: 1 for a new session, the
  // generation the resume claimed otherwise.
  uint64 generation = 6;

  // With `resume_id`, the node the session ran on before, when it moved
  // here. Empty otherwise.
  string moved_from = 7;
}

// Request payload for Worker.StopSession.
message StopSessionRequest {
  // The session ticket.
  string ticket = 1;

  // The session to end.
  string session_id = 2;
}

// Reply payload for Worker.StopSession.
message StopSessionReply {
  // True when this call ended the session; false when it was already gone.
  bool stopped = 1;

  // This node's id.
  string node_id = 2;
}

// Request payload for Worker.GetSession.
message GetSessionRequest {
  // The session id.
  string session_id = 1;

  // A session ticket, for the `ticket` caller class. Empty for a manager.
  string ticket = 2;
}

// Reply payload for Worker.GetSession.
message GetSessionReply {
  // The session, as this node reports it in its heartbeat.
  SessionStatus session = 1;

  // This node's id.
  string node_id = 2;
}

// Request payload for Worker.StopSessions.
message StopSessionsRequest {
  // The sessions to end.
  repeated string session_ids = 1;

  // Why, for the node's log: `stop`, `destroy`, or `duplicate`.
  string reason = 2;
}

// Reply payload for Worker.StopSessions.
message StopSessionsReply {
  // The ids this node was running and has ended.
  repeated string stopped = 1;
}

// Request payload for Worker.SuspendSessions.
message SuspendSessionsRequest {
  // The sessions to suspend. Ids the node does not hold are answered in
  // `failed`.
  repeated string session_ids = 1;

  // Why, for the node's log: `manual` (`legion instance suspend`) or
  // another short word.
  string reason = 2;
}

// Reply payload for Worker.SuspendSessions.
message SuspendSessionsReply {
  // The sessions now suspended on this node, including any that already
  // were.
  repeated SuspendedSession suspended = 1;

  // The sessions that were not suspended, each with why. A session whose
  // capture failed keeps running.
  repeated SessionSleepFailure failed = 2;
}

// One session a node suspended.
message SuspendedSession {
  // The session id.
  string session_id = 1;

  // The checkpoint's snapshot id (`snap-...`), local to the node: its parts
  // are pinned in the node content store and never published.
  string snapshot_id = 2;

  // `memory` (the guest's memory, restored on resume) or `disk` (nothing
  // but the session's spec: a resume boots it fresh under the same id).
  string kind = 3;

  // Bytes the checkpoint holds in the node content store.
  uint64 bytes = 4;

  // True when the session was already suspended before this call.
  bool already_suspended = 5;

  // `local` or `store` (the task's `suspend.durability`).
  string durability = 6;

  // With `durability = "store"`: the session manifest's URL once the
  // checkpoint is published. Empty when the content store could not be
  // reached: the suspend still succeeded on this node, the parts stay
  // pinned here, and the node retries the publish until it lands.
  string published_url = 7;
}

// Why a node did not suspend one session.
message SessionSleepFailure {
  // The session id.
  string session_id = 1;

  // The gRPC code the failure would carry on its own: `NOT_FOUND`,
  // `FAILED_PRECONDITION`, `ABORTED`, or `INTERNAL`.
  string code = 2;

  // What went wrong. A NOT_FOUND message starts with `not_found`,
  // `evicted`, or `wrong_node`, as `GetSession` answers.
  string message = 3;
}

// Request payload for Worker.ResumeSession.
message ResumeSessionRequest {
  // The suspended session to resume.
  string session_id = 1;

  // Discard the checkpoint and boot the session fresh under the same id.
  bool cold = 2;

  // The session's job and task. Required only to resume a `store` session
  // this node does not hold (a move): its manifest lives at
  // `<contentStore.url>/sessions/<job>/<id-prefix>/<id>.json`, and the node
  // admits it into its envelope for that task. Ignored for a session the
  // node holds.
  string job_id = 3;
  string task_name = 4;

  // Move a session the manifest says is running on another node without
  // that node's agreement. A manager sets it only after its own probe of
  // that node failed and the node is marked down or lost (or the caller
  // passed `StartInstanceRequest.force_move`). Without it, a manifest
  // naming another node as running answers FAILED_PRECONDITION starting
  // `running_elsewhere`, naming the node and generation, so the manager can
  // probe that node first.
  bool force_move = 5;
}

// Reply payload for Worker.ResumeSession.
message ResumeSessionReply {
  // The session as it stands after the resume: `running`, or `starting`
  // when its runtime is still coming up.
  SessionStatus session = 1;

  // This node's id.
  string node_id = 2;

  // `local` (restored from the node's memory checkpoint), `store` (a
  // memory checkpoint whose parts were fetched from the content store: a
  // move, or a local copy the node had evicted), or `cold` (booted fresh: a
  // disk checkpoint, or `cold` was asked). Empty when the session was
  // already running.
  string resumed_from = 3;

  // True when the session was running already and nothing was done.
  bool already_running = 4;

  // The session's generation after the resume. A `local` session never
  // moves, so its generation stays 1; every resume of a `store` session
  // claims one more.
  uint64 generation = 5;

  // The node the session ran on before this resume, when it moved here.
  // Empty when it resumed on its own node.
  string moved_from = 6;
}

// Request payload for Worker.Probe. Empty: the TLS handshake and the
// manager-class check are the probe.
message ProbeRequest {}

// Reply payload for Worker.Probe.
message ProbeReply {
  // The node id this worker serves, so a manager that dialed a stale or
  // reused address learns it reached a different node. A simulated fleet
  // answers with its fleet name.
  string node_id = 1;

  // The worker's protocol version (`PROTOCOL_VERSION`, docs/upgrades.md).
  uint64 protocol_version = 2;
}

// === EXEC / ACTIONS ===

// Frames sent from the initiator (CLI, UI, or manager proxy) toward the
// process. The first frame on a stream must carry `start`.
message ExecClientFrame {
  oneof frame {
    ExecStart start   = 1;
    ExecInput stdin   = 2;
    ExecResize resize = 3;
    ExecPing ping     = 4;
  }
}

// Opens a session. Exactly one of `command` (raw exec) or `action` (named,
// server-rendered) selects what runs.
message ExecStart {
  // Target allocation (must be `active`).
  int64 allocation_id = 1;

  // Task within the allocation. Optional when the allocation runs one task.
  string task_name = 2;

  // Raw command argv (requires exec:write). Empty when running an action.
  repeated string command = 3;

  // Action name (requires action:write). Empty for raw exec.
  string action = 4;

  // Action parameter values, validated + substituted server-side.
  map<string, string> action_params = 5;

  // Allocate a PTY (interactive). When false, stdout/stderr stay separate.
  bool tty = 6;

  // Initial terminal size (tty sessions only).
  ExecWinsize winsize = 7;

  // Bearer token carried in-frame for the browser WebSocket bridge, which
  // cannot set request headers. Ignored on native gRPC legs, where the
  // `authorization` metadata is used instead.
  string bearer_token = 8;

  // Target an instance instead of an allocation: the manager resolves it to
  // the instance's current allocation after the coarse ACL gate, so a
  // caller holding a stable instance id reaches it across reschedules and
  // resumes (each of which is a new allocation). Takes precedence over
  // `allocation_id` when set. Manager legs only; a worker ignores it.
  //
  // Errors: NotFound for an unknown instance; FailedPrecondition when the
  // instance has no running allocation (suspended, stopped, or between
  // placements).
  string instance_id = 9;

  // An exec ticket from `Manager.MintExecTicket`, presented to
  // `Worker.ExecTask` by a direct-exec client with no client certificate.
  // `allocation_id` may be 0 (the ticket names the allocation) and
  // `command` may be empty (the ticket's argv runs); when set they must
  // match the ticket. `action` and `action_params` are ignored: an action
  // ticket carries its rendered argv. Ignored on manager legs.
  string exec_ticket = 10;
}

// Standard-input chunk. `eof` half-closes stdin (the k8s v5 lesson) so piped
// input reaches EOF without tearing down the whole session.
message ExecInput {
  bytes data = 1;
  bool eof   = 2;
}

// Terminal dimensions in character cells.
message ExecWinsize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// Window-resize event (tty sessions).
message ExecResize {
  ExecWinsize winsize = 1;
}

// Keepalive; the peer echoes it back as `pong`.
message ExecPing {}

// Frames sent from the process back toward the initiator.
message ExecServerFrame {
  oneof frame {
    ExecOutput stdout   = 1;
    ExecOutput stderr   = 2;
    ExecExit exit       = 3;
    ExecPing pong       = 4;
    ExecStarted started = 5;
  }
}

// A chunk of captured output.
message ExecOutput {
  bytes data = 1;
}

// Terminal frame: the process exited. The stream closes after this.
message ExecExit {
  int32 code      = 1;
  string message  = 2;
}

// Acknowledges that the session is live; the UI switches to the terminal on
// receipt. `session_id` identifies the session in audit events.
message ExecStarted {
  string session_id = 1;
}

// Request payload for MintExecTicket. The target and command fields mean
// what they mean on `ExecStart`.
message MintExecTicketRequest {
  // Target allocation. Ignored when `instance_id` is set.
  int64 allocation_id = 1;

  // Target instance, resolved to its current allocation.
  string instance_id = 2;

  // Task within the allocation. Optional when the allocation runs one task.
  string task_name = 3;

  // Raw argv the ticket allows (`exec:write`). Empty with an empty
  // `action` mints a ticket that allows any command in the target, which
  // needs the same `exec:write` grant.
  repeated string command = 4;

  // Action to run (`action:write`, or `exec:write`). Its argv is rendered
  // here from the stored job spec and written into the ticket.
  string action = 5;

  // Action parameter values, validated and substituted as for
  // `ExecAllocation`. Sensitive values never appear in the audit log.
  map<string, string> action_params = 6;

  // Whether the session is interactive. For an action, the action's own
  // `tty` wins.
  bool tty = 7;

  // How long the ticket can be redeemed, e.g. `"30s"`. Default:
  // `exec.tickets.defaultTtl` (60s); at most `exec.tickets.maxTtl` (10m).
  string ttl = 8;

  // How long the session may run once opened, e.g. `"15m"`. Default and
  // ceiling: `exec.tickets.maxSession` (1h). Clamped to the minting
  // credential's own expiry.
  string max_session = 9;
}

// Reply payload for MintExecTicket.
message MintExecTicketReply {
  // The ticket (a JWT). A credential: pass it to the worker in
  // `ExecStart.exec_ticket` and nowhere else.
  string ticket = 1;

  // The worker's advertised worker-plane address,
  // e.g. `"https://10.0.3.17:4848"`.
  string worker_address = 2;

  // The node the ticket is redeemable on. The worker's certificate names
  // `<node>.node.legion`; a client verifies that name, not the address.
  string node = 3;

  // When the ticket stops being redeemable, RFC 3339 UTC.
  string expires_at = 4;

  // The cluster CA bundle, PEM: the only roots a client should trust for
  // the worker connection.
  string ca_pem = 5;

  // The allocation the ticket opens a session in (resolved from
  // `instance_id` when the request named one).
  int64 allocation_id = 6;

  // The ticket's id, as the audit log and the worker's report name it.
  string jti = 7;

  // Seconds the session may run once opened.
  uint64 max_session_seconds = 8;
}

// A delegated exec minting key.
message ExecKey {
  // `xk_` and random characters. A ticket signed with this key carries it as
  // its JWT `kid` header and `sub = "key:<id>"`.
  string id = 1;
  // A label for people, e.g. `"agents-platform"`.
  string name = 2;
  // Job pattern the key's tickets may open sessions in: a name glob
  // (`"agents-*"`, jobs in `default`) or `namespace-glob/name-glob`
  // (`"agents/*"`). See `CreateExecKeyRequest.jobs`.
  string jobs = 3;
  // The ES256 (P-256) public key, SPKI PEM.
  string public_key_pem = 4;
  // The longest redeem window (`exp - iat`) a ticket may have.
  uint64 max_ttl_seconds = 5;
  // The longest `legion.io/max_session` a ticket may name.
  uint64 max_session_seconds = 6;
  // Who created it: `accessor:<id>` or `principal:<name>`.
  string created_by = 7;
  // RFC 3339 UTC.
  string created_at = 8;
}

// Request payload for CreateExecKey.
message CreateExecKeyRequest {
  // A label for people. Optional.
  string name = 1;
  // Job pattern the key's tickets may reach. Required. `"agents-*"`
  // matches jobs in the `default` namespace only; `"agents/*"` or
  // `"agents-*/web*"` is `namespace-glob/name-glob`, so reaching into a
  // namespace is written into the pattern and `*` alone never crosses
  // one. More than one `/` is InvalidArgument.
  string jobs = 2;
  // The ES256 (P-256) public key, SPKI PEM (`openssl ec -pubout`). Required.
  string public_key_pem = 3;
  // Ceiling on a ticket's redeem window, e.g. `"5m"`. Default and ceiling:
  // the manager's `exec.tickets.maxTtl` (10m).
  string max_ttl = 4;
  // Ceiling on a ticket's session length, e.g. `"30m"`. Default and ceiling:
  // the manager's `exec.tickets.maxSession` (1h).
  string max_session = 5;
  // Retry-safe create: a repeat with the same key returns the same key.
  optional string idempotency_key = 6;
}

// Reply payload for CreateExecKey.
message CreateExecKeyReply {
  ExecKey key = 1;
  // True when this answered a retry of an earlier create.
  bool deduplicated = 2;
}

// Request payload for ListExecKeys.
message ListExecKeysRequest {}

// Reply payload for ListExecKeys, newest first.
message ListExecKeysReply {
  repeated ExecKey keys = 1;
}

// Request payload for DeleteExecKey.
message DeleteExecKeyRequest {
  string id = 1;
  // Retry-safe delete: a repeat with the same key reports `deduplicated`.
  optional string idempotency_key = 2;
}

// Reply payload for DeleteExecKey.
message DeleteExecKeyReply {
  bool deduplicated = 1;
}

// Request payload for ListJobActions.
message ListJobActionsRequest {
  // Job whose declared actions to list.
  string job = 1;
}

// One declared action, flattened with its owning task for discovery.
message JobAction {
  string task_name          = 1;
  string name               = 2;
  string description        = 3;
  bool tty                  = 4;
  repeated JobActionParam params = 5;
}

// One declared parameter of an action.
message JobActionParam {
  string name        = 1;
  string description  = 2;
  // One of: string | int | bool | enum.
  string type        = 3;
  bool required      = 4;
  string default     = 5;
  // Allowed values for `enum` params.
  repeated string values = 6;
  // Anchored regex for `string` params (empty = unconstrained).
  string pattern     = 7;
  // Inclusive bounds for `int` params (empty = unbounded).
  string min         = 8;
  string max         = 9;
  // Redact the value in audit events + UI history.
  bool sensitive     = 10;
}

// Reply payload for ListJobActions.
message ListJobActionsReply {
  repeated JobAction actions = 1;
}

// One HTTP header of a forwarded app request or answer.
message AppHttpHeader {
  // The header's name, lowercase.
  string name = 1;
  // Its value.
  string value = 2;
}

// Request payload for Worker.ForwardAppRequest.
message ForwardAppRequestRequest {
  // The app allocation to deliver to (the manager's id).
  int64 allocation_id = 1;
  // The job the manager expects it to run (`legion-system/<app>`); the
  // worker refuses an allocation running anything else.
  string job_id = 2;
  // The port label (`network.ports[].name`) to deliver to: the manifest's
  // `ui.port`.
  string port = 3;
  // `GET` or `POST`.
  string method = 4;
  // The path and query, starting `/legion/v1/`.
  string path = 5;
  // Headers: `legion-viewer`, `content-type`, `accept`; others are dropped.
  repeated AppHttpHeader headers = 6;
  // The body (POST), at most 256 KiB.
  bytes body = 7;
}

// Response payload for Worker.ForwardAppRequest.
message ForwardAppRequestReply {
  // The app's HTTP status.
  uint32 status = 1;
  // Its `content-type`.
  string content_type = 2;
  // Its body, at most 1 MiB.
  bytes body = 3;
}

// Selects which captured stream(s) to read for a task.
//
// Used by both `Worker.GetTaskLogs` and `Manager.GetAllocationLogs`.
message GetTaskLogsRequest {
  // Allocation whose logs are requested.
  int64 allocation_id = 1;

  // Stream filter: "stdout", "stderr", or "all" (default when empty).
  string stream = 2;

  // Maximum number of bytes to return per stream.
  //
  // `0` selects the worker's built-in default cap. When a stream's file is
  // larger than the cap the returned content is truncated.
  int64 max_bytes = 3;

  // When true, return the trailing bytes of each stream (tail) rather than the
  // leading bytes. Defaults to false (head).
  bool tail = 4;

  // Byte offset to read forward from (incremental tail / follow). When > 0 the
  // worker returns bytes from this position to EOF and ignores `tail`. When the
  // offset is past EOF (the file was rotated) the read restarts from the front.
  int64 offset = 5;
}

// One captured stream's content for a single allocation.
message TaskLogStream {
  // Stream name ("stdout" or "stderr").
  string stream = 1;

  // UTF-8 (lossy) content of the (possibly truncated) stream.
  string content = 2;

  // Total size of the underlying active log file in bytes.
  int64 size_bytes = 3;

  // Whether `content` was truncated to satisfy `max_bytes`.
  bool truncated = 4;

  // Byte offset within the file where `content` begins.
  int64 start_offset = 5;

  // Byte offset to resume from on the next incremental read
  // (`start_offset` + bytes returned). Clients following a stream pass this
  // back as the request `offset`.
  int64 next_offset = 6;
}

// Reply payload for Worker.GetTaskLogs.
message GetTaskLogsReply {
  // Captured streams for the allocation. Streams with no log file are omitted.
  repeated TaskLogStream streams = 1;
}

// Request payload for Manager.GetAllocationLogs.
message GetAllocationLogsRequest {
  // Job name to gather allocation logs for. Required unless `allocation_id` is
  // set.
  string job = 1;

  // Optional: restrict the read to a single allocation id. When set, `job` is
  // ignored.
  optional int64 allocation_id = 2;

  // Stream filter: "stdout", "stderr", or "all" (default when empty).
  string stream = 3;

  // Maximum number of bytes to return per stream (`0` = worker default).
  int64 max_bytes = 4;

  // When true, return the trailing bytes of each stream rather than the leading.
  bool tail = 5;

  // Byte offset to read forward from (incremental tail / follow). Applied per
  // stream; see `GetTaskLogsRequest.offset`.
  int64 offset = 6;

  // Also return the job's recently removed allocations (newest first, at
  // most 10, removed within the last 24 hours) after its live ones. Without
  // it they are returned only when the job has no live allocation. Ignored
  // when `allocation_id` is set, which reaches a removed allocation anyway.
  bool include_removed = 7;
}

// Captured logs for a single allocation, annotated with where they came from.
message AllocationLog {
  // Allocation id.
  int64 allocation_id = 1;

  // Node hosting the allocation.
  string node_id = 2;

  // Task name for the allocation, when resolvable.
  string task_name = 3;

  // Captured streams for the allocation.
  repeated TaskLogStream streams = 4;

  // Per-allocation error (for example: node unreachable). Empty on success.
  string error = 5;

  // True when the allocation was already removed (stopped, replaced,
  // rescheduled, its job destroyed) and its logs were read from the node's
  // retained files. A removed allocation's output is final.
  bool removed = 6;

  // Why a removed allocation was removed: a stop cause such as `stop`,
  // `update`, `node_lost`, `preempted`, `destroy`, `scale_in`. Empty for a
  // live allocation, or when the removal named no cause.
  string removal_cause = 7;

  // When a removed allocation was removed, in unix seconds. 0 for a live
  // allocation.
  int64 removed_at_unix = 8;

  // The allocation's status: `placed`, `complete`, or `failed` for a live
  // row; for a removed one, its status at removal.
  string status = 9;
}

// Reply payload for Manager.GetAllocationLogs.
message GetAllocationLogsReply {
  // One entry per matched allocation.
  repeated AllocationLog allocations = 1;
}

// Allocation payload sent to workers.
message TaskAllocation {
  // Allocation ID.
  int64 allocation_id = 1;

  // Job ID.
  string job_id = 2;

  // Job config ID.
  string job_config_id = 3;

  // Target node ID.
  string node_id = 4;

  // Task config ID.
  int64 task_config_id = 5;

  // Task name.
  string task_name = 6;

  // Name of the task runtime plugin that runs this task (`exec`, `container`,
  // `noop`, or a third-party plugin under `plugins/tasks/<name>/`). The worker
  // resolves this against its task-plugin registry and fails the allocation if
  // no plugin with this name is loadable. Mirrors the jobspec's
  // `tasks.<name>.runtime` field.
  string task_runtime = 7;

  // JSON-encoded task config payload.
  string task_config = 8;

  // JSON-encoded task health-check definitions.
  string task_checks = 9;

  // JSON-encoded task unhealthy handling policy.
  string task_on_unhealthy = 10;

  // JSON-encoded assigned network payload (address + ports + upstreams) for
  // this allocation, matching the `AllocNetwork` shape. Workers use it to
  // inject `LEGION_PORT_*` / `LEGION_ADDR_*` environment variables into the
  // task, and — when the task declares upstreams — the `upstreams` array
  // (`[{"key":"db","balance":"least_latency","vip":"127.42.7.2",
  // "canonicalPort":5432}]`) carries each upstream's address: its VIP and
  // canonical port, plus a `localPort` when it has a loopback port (a pinned
  // `port`, a node with no VIP block, or a sandbox). The task sees one
  // address per upstream as `LEGION_UPSTREAM_<KEY>`.
  //
  // Empty string when the task declares no network block and no upstreams.
  string network = 14;

  // JSON-encoded `connect` block declared by the task, matching the
  // `ConnectConfig` shape: `{"upstreams":[{"to":"db"},
  // {"to":"http://cache","port":6379,"balance":"least_conn"}]}`.
  //
  // This is the *declared* form (what the task dials, over which protocol,
  // and with which balancing strategy); the *assigned* addresses live in
  // `network` alongside the task's host ports, because loopback ports come
  // out of the same per-node port space. The worker starts one forwarder per
  // upstream and load-balances new connections across that service's healthy
  // endpoints, which the manager refreshes every heartbeat in
  // `HeartbeatReply.upstream_endpoints`. An upstream that names no `balance`
  // uses `least_latency` (docs/service-discovery.md, "Balancing strategies").
  //
  // Empty string (not `{}`) when the task declares no upstreams, so jobs that
  // do not use connect stay byte-identical on the wire.
  string task_connect = 17;

  // JSON-encoded list of normalized artifact specs for this task.
  //
  // This is the post-admission form: runtime-implicit artifacts (for example a
  // container `image`) are already desugared in, `resolve: "pin"` references
  // are already pinned to digests, and cluster-level auth matchers are
  // already applied. Workers stage exactly this list and never re-derive or
  // re-resolve artifacts.
  //
  // Empty string when the task declares no artifacts (the staging step is
  // skipped entirely).
  string task_artifacts = 11;

  // JSON-encoded list of workload identities declared on the task
  // (`identities[]`, see docs/workload-identity.md). Empty string or `[]`
  // when the task declares none. The worker uses this to know which tokens
  // to request via IssueWorkloadIdentityToken, how to deliver them
  // (env/file), and what to do on refresh (changeMode). The identity specs
  // carry no secrets — tokens themselves are fetched separately by the
  // worker and never transit the desired-state payload.
  string task_identities = 12;

  // Worker self-fence window, in seconds (`stateful.onLost.selfTerminateAfter`,
  // see docs/stateful-workloads.md "Node loss and fencing"). When non-zero,
  // the worker MUST locally kill this allocation once it has been unable to
  // complete a heartbeat against the manager for this long, and report it as
  // failed on the next successful heartbeat. This is the worker half of the
  // at-most-one guarantee: the manager will not plan a replacement for a
  // stateful allocation on a lost node until the node has been lost for
  // longer than this window plus a safety margin (`onLost.replaceAfter`), so
  // by the time a replacement binds the same instance id and storage handle,
  // the original is provably dead or fenced.
  //
  // 0 = no self-fencing (stateless tasks, which the manager replaces
  // eagerly). Stateful tasks always carry a non-zero value — the manager
  // applies the 90s default even when the jobspec declares no `onLost`
  // block.
  uint64 self_terminate_after_seconds = 13;

  // JSON-encoded list of volume mounts for this allocation (see
  // docs/volumes.md). Array of objects matching the `VolumeMount` shape:
  // `[{"volumeId":"…","name":"data","driver":"local-dir","params":{…},
  //    "attrs":{…},"path":"/var/lib/db","readOnly":false,
  //    "instanceVolume":true}]`.
  //
  // This is the post-admission form: the driver is resolved (the `local-dir`
  // default is already applied), the volume id is known, and `attrs` carries
  // whatever the driver recorded on a previous mount. The worker mounts
  // exactly this list through its volume drivers before starting the task and
  // unmounts on stop — it never re-derives a volume from the jobspec.
  //
  // Entries with `instanceVolume: true` come from `stateful.storage` and are
  // additionally exported as `LEGION_STORAGE_DIR`; the rest come from the
  // task's `volumes[]` claims. Every entry is exported as
  // `LEGION_VOLUME_<NAME>` with the resolved host path.
  //
  // Empty string when the task declares no volumes (the mount step is skipped
  // entirely).
  string task_volumes = 15;

  // JSON-encoded task `resources` block, exactly as declared in the jobspec
  // (`{"memory": 256, "cores": 1}`). Scheduler-side defaults are NOT folded
  // in: this is what the job asked for, so a runtime can tell "unset" from
  // "explicitly requested" and leave its own defaults alone.
  //
  // Task runtimes that isolate a workload use this to size it — the `container`
  // runtime maps `memory` (MiB) and `cores` onto the sandbox's memory/CPU
  // limits, since a guest that ignores the reservation the scheduler made on
  // its behalf can overcommit the node. Runtimes that run host processes
  // (`exec`) ignore it; enforcement there needs cgroups/jobobjects.
  //
  // Empty string when the task declares no resources.
  string task_resources = 16;

  // The task's declared stop ladder (`stop { signal, killAfter }`) as JSON,
  // e.g. `{"signal":"SIGINT","killAfter":"90s"}`.
  //
  // Carried on the allocation because the worker never sees a jobspec: it
  // rebuilds a TaskConfig from these scalar fields, so a task-level block not
  // on this message does not exist on the worker and every stop would silently
  // use the default ladder.
  //
  // Empty string when the task declared none, which is NOT the same as
  // declaring the default: the `container` runtime on Linux consults the
  // image's own `STOPSIGNAL` before falling back to `SIGTERM`, and can only do
  // that when it knows the jobspec was silent. Runtimes with nothing to signal
  // (`noop`) ignore the field entirely.
  string task_stop = 18;

  // Present only when this dispatch is a *provisional* start: work the node
  // may begin before the placement is durable (docs/edge-boot.md).
  //
  // When set, `allocation_id` is 0 — the manager mints allocation ids inside
  // the apply transaction, so a not-yet-committed placement has none. The
  // node keys the work by `provisional.claim_id` instead, and learns its
  // allocation id from the ratification verdict.
  //
  // Absent on every allocation of a job that did not opt into
  // `speculativeStart`, so a cluster that upgrades and changes nothing sends
  // byte-identical payloads. An old worker that ignores this field would run
  // the allocation immediately with no gate and no lease, which is why
  // pre-commit dispatch requires a minimum worker protocol version and falls
  // back to post-commit dispatch per node below it.
  ProvisionalAllocation provisional = 19;

  // JSON `NetworkConfig` as the task declared it: `mode`, `labels`, and any
  // inline `egress` / `ingress`. Empty when the task declares no `network`
  // block, so jobs without one stay byte-identical on the wire. The worker
  // reads `mode` and `labels` from it; the rules themselves arrive merged
  // with stored policies via `HeartbeatReply.net_policies`.
  string task_network = 20;

  // The owning job config's priority band (`critical`, `high`, `elevated`,
  // `normal`, `low`, `background`). The worker's memory pressure response
  // orders its candidates by band, lowest first
  // (docs/resource-enforcement.md, "Memory pressure"). Empty from a manager
  // that predates the field, which the worker reads as `normal`.
  string priority_band = 21;
  // Start this allocation from a snapshot instead of booting it. Set while
  // the allocation's instance is restoring (RestoreInstance), and cleared by
  // the manager once the worker reports the restore's outcome in
  // `HeartbeatRequest.snapshot_reports`.
  //
  // Absent for every ordinary allocation.
  optional SnapshotRestore restore = 22;

  // The task's `suspend` block as JSON (docs/suspend-and-resume.md). The
  // worker reads its idle policy (`suspend.idle`) to report idle-since with
  // usage, `suspend.onPressure` to let its memory pressure response suspend
  // the instance, and whether it asks for memory checkpoints, which decides
  // how a sandbox launches (an identity disk, device links, a VMM API
  // socket). Empty when the task declares no `suspend`, so jobs without one
  // stay byte-identical on the wire. A worker that predates the field
  // ignores it, and a manager that predates it leaves it empty: such a node
  // reports no idle time and launches no sandbox ready for checkpoints.
  string task_suspend = 23;
  // The task's `snapshots` block as JSON (docs/suspend-and-resume.md,
  // "Snapshots"). A sandbox that opts into memory snapshots launches ready
  // for them. Empty when the task declares no `snapshots`.
  string task_snapshots = 24;

  // The allocation's instance's identity epoch (docs/workload-identity.md,
  // "Forks and snapshots"). The manager moves an instance to a new epoch
  // when a fork or snapshot of it is captured, and from then on refuses its
  // workload-identity tokens from earlier epochs, since copies of them sit
  // in the checkpoint. A worker that sees this value rise re-issues the
  // allocation's tokens at once, rather than at its next refresh, so the
  // running instance holds a current token again within a heartbeat.
  //
  // 0 for an allocation without an instance, and for an instance never
  // forked or snapshotted. A worker that predates the field ignores it and
  // refreshes on its normal schedule.
  uint64 identity_epoch = 25;

  // The task's `lifecycle` as declared in the jobspec: `service`, `batch`,
  // or `sidecar`.
  //
  // Carried because the worker never sees a jobspec: it rebuilds the task
  // from the fields on this message, and the lifecycle decides what a process
  // exit means there. Together with `task_restart` it selects the restart
  // policy the worker's task supervisor applies (docs/task-supervision.md):
  // a `batch` task defaults to `onFailure`, so an exit with a status in
  // `restart.successExitCodes` (default `[0]`) ends the allocation and is
  // reported once in `HeartbeatRequest.terminated_allocations` with
  // `success = true`, which the manager records as allocation status
  // `complete` and task status `success`. A `batch` task on a runtime that
  // tracks no process (`noop`) is reported complete at start instead.
  // `service` and `sidecar` default to `always`: they are relaunched in place
  // on any exit.
  //
  // Always set by the manager. An empty string (a payload built by hand, or
  // by a manager that predates the field) is read as `service`, which is the
  // jobspec default.
  string task_lifecycle = 26;

  // The task's `restart` block as JSON, exactly as declared:
  // `{"policy":"onFailure","delay":"5s","successExitCodes":[0,2]}`.
  //
  // `policy` is `always`, `onFailure`, or `never`; `delay` is the wait before
  // an in-place relaunch (defaults to `on_unhealthy.restart_delay`);
  // `successExitCodes` lists the exit statuses that count as success. The
  // worker's supervisor applies it on every observed exit, sharing one
  // restart budget (`on_unhealthy.restart_count` within `restart_period`)
  // with health-check restarts; a wanted restart the budget refuses fails the
  // allocation, which the manager then reschedules.
  //
  // Empty string when the task declares no `restart` block, which is NOT the
  // same as declaring `always`: the policy then follows `task_lifecycle`
  // (`onFailure` for `batch`, `always` otherwise).
  string task_restart = 27;

  // The session this allocation's instance was promoted from
  // (PromoteInstance, docs/session-mode.md). A node running that session
  // adopts it as this allocation instead of starting anything, through any
  // delivery path (a push, a heartbeat's desired set, the work stream).
  // A node without it starts the allocation normally, which is what a
  // replacement after node loss does. Empty otherwise.
  string promoted_from_session = 28;

  // On an envelope allocation only: the full spec of the session task the
  // envelope serves, as JSON, and that task's config id
  // (docs/session-mode.md, "Starting at the edge"). A node holding the
  // envelope can then start the task's sessions from a session ticket
  // (`Worker.StartSession`) with no manager on the path: the spec it starts
  // is exactly the one its envelope was placed for. Empty on every other
  // allocation.
  string session_task_spec = 29;
  int64 session_task_config_id = 30;

  // On an envelope allocation whose session task sets
  // `suspend.durability = "store"` only: the job's session sealing keys,
  // the current one first (see `SessionSealKey`). The node seals the
  // checkpoint parts its sessions publish with the first, and opens parts
  // sealed under any of them. Empty on every other allocation, and when the
  // manager's keyring has no checkpoint key (the keyring is off or locked);
  // a `store` session whose memory checkpoint has parts to seal then stays
  // suspended on its node unpublished until the keys arrive.
  repeated SessionSealKey session_seal_keys = 31;

  // On an envelope allocation only: the envelope's committed size, as the
  // JSON `resources` object on its allocation row, such as
  // `{"cpu":12000,"memory":12288}` (docs/session-mode.md, "Elastic
  // envelopes"). A fixed envelope always carries its
  // `stateful.envelope.resources`. An elastic one carries whatever the node
  // last grew or shrank it to, between `envelope.resources` and
  // `envelope.max`. The node admits sessions against this size, not against
  // `task_resources` (the floor). A changed size is re-sent like any changed
  // payload: on the work stream, or in the next desired set. Empty on every
  // other allocation, and the node then falls back to `task_resources`.
  string envelope_resources = 32;

  // JSON `SpeculativeStartConfig` as the task declared it (`mode`,
  // `ratifyTimeout`, `onRefused`). Empty when the task declares no
  // `speculativeStart` block. A node caches each task config it is
  // dispatched and redeems boot tickets against that cache
  // (docs/edge-boot.md, "The spec cache"), and the task's own mode caps how
  // far an edge start may get: a node that receives it empty treats the task
  // as `off` and refuses its edge starts.
  string task_speculative_start = 33;

  // The task's group (`tasks[].group`). Together with `job_id` and
  // `task_name` it forms the workload identity subject
  // `<region>:<job>:<group>:<task>`: the identity a consuming node names
  // its workload by on a mesh connection, and what `service.allow` and
  // ingress `identity` rules match.
  string task_group = 34;

  // JSON `ServiceConfig` as the task declared it (`name`, `port`, `mesh`,
  // `allow`, ...). Empty when the task advertises no service. The manager
  // reads `mesh` and `allow` from it to compile the receiving side's
  // `service/allow` check into the allocation's ingress policy.
  string task_service = 35;
}

// Request payload for PostWork.
message PostWorkRequest {
  // Allocation payload to start/reconcile on worker.
  //
  // Required. Worker rejects request when this field is missing.
  TaskAllocation allocation = 1;
}

// Reply payload for PostWork.
message PostWorkReply {
  // Human-readable acknowledgement.
  //
  // Built-in worker reply value: `"Task accepted"`.
  string message = 1;
}

// === AUTH & ACL MESSAGES ===

// Request payload for WhoAmI. Identity comes from request metadata, not the body.
message WhoAmIRequest {
}

// Reply payload for WhoAmI.
message WhoAmIReply {
  // True when the manager enforces (or audits) ACLs.
  //
  // When false every caller has full access; clients should surface a
  // warning so operators know the cluster is unprotected.
  bool acl_enabled = 1;

  // True when ACLs run in audit-only mode: denials are logged but allowed.
  bool audit_only = 2;

  // How the caller was identified.
  //
  // One of: `disabled` (ACLs off), `token` (Legion ACL token), `jwt`
  // (external JWT validated by an auth method), `anonymous` (no credential).
  string source = 3;

  // Human-readable principal: token name, `user:<name>`, JWT subject, or
  // `anonymous`.
  string principal = 4;

  // Token type resolved for the caller: `management`, `client`, or `none`.
  string token_type = 5;

  // Names of the policies attached to the caller's identity.
  repeated string policies = 6;

  // RFC3339 expiry of the presented credential, when it has one.
  optional string expires_at = 7;

  // Accessor ID of the presented ACL token, when one was presented.
  //
  // Accessor IDs are safe to log and are the handle used by DeleteAclToken.
  optional string accessor_id = 8;

  // The caller's effective ACL rules as a JSON array (the same rule schema
  // as AclPolicy.rules_json), flattened from every attached policy.
  //
  // This is self-introspection: it reveals only what the caller's own
  // requests would reveal, and it is what lets clients like the UI hide
  // controls the identity cannot use. Management tokens and disabled ACLs
  // report `[{"resources":["*"],"actions":["*"]}]`. Unset for anonymous
  // callers with no anonymous policy.
  optional string rules_json = 9;

  // Namespaces the caller holds any allow in (the same rule ListNamespaces
  // filters by), so a client can pick a default and decide whether to show
  // a namespace switcher without probing. Management tokens and disabled
  // ACLs list every namespace.
  repeated string readable_namespaces = 10;
}

// Request payload for Login.
message LoginRequest {
  // Auth method name.
  //
  // `userpass` selects the built-in username/password method. Any other value
  // must match the name of a JWT/OIDC auth method in the manager config.
  string method = 1;

  // Username for the `userpass` method.
  optional string username = 2;

  // Password for the `userpass` method.
  optional string password = 3;

  // Externally issued JWT (for example an OIDC ID token) for JWT/OIDC methods.
  optional string jwt = 4;

  // Optional requested token lifetime (humantime format, for example "8h").
  //
  // Capped by the manager's configured maximum for the method. Default when
  // omitted: the method's `tokenTtl` (built-in default `24h`).
  optional string ttl = 5;
}

// Reply payload for Login.
message LoginReply {
  // Metadata for the newly minted token.
  AclTokenInfo token = 1;

  // The token secret. Returned exactly once; the manager stores only a hash.
  string secret = 2;
}

// Metadata describing an ACL token. Never contains the secret.
message AclTokenInfo {
  // Public identifier for the token; safe to log and audit.
  string accessor_id = 1;

  // Human-readable token name. Tokens minted via Login are named
  // `<method>:<principal>` (for example "userpass:alice").
  string name = 2;

  // Token type: `management` (full access) or `client` (policy-scoped).
  string token_type = 3;

  // Names of attached policies. Empty for management tokens.
  repeated string policies = 4;

  // RFC3339 creation timestamp.
  string created_at = 5;

  // RFC3339 expiry. Omitted when the token never expires.
  optional string expires_at = 6;
}

// A named ACL policy.
//
// `rules_json` is a JSON array of rule objects:
//   [{"resources": ["job"], "actions": ["read", "write"],
//     "namespaces": ["default"], "names": ["web-*"]},
//    {"resources": ["kv"], "actions": ["read"], "paths": ["team/*"]},
//    {"resources": ["node"], "actions": ["read"], "pools": ["*"]},
//    {"resources": ["*"], "actions": ["*"], "effect": "deny",
//     "paths": ["secret/*"]}]
//
// Rule fields:
// - `resources`: resource types the rule covers (`job`, `node`, `kv`,
//   `state`, `operator`, `acl`, `exec`, `action`, `template`, or `*`).
// - `actions`: `read`, `write`, or `*`.
// - `effect`: `allow` (default) or `deny`. A matching deny rule always
//   overrides any allow.
// - Optional scope selectors (glob lists matched against the request):
//   `namespaces` (job namespaces), `names` (job names), `pools` (node
//   pools), `paths` (KV keys), `actionNames` (declared action names),
//   `templates` (job-template names). A rule with a selector only matches
//   requests that carry that attribute — which is why a `job` rule with
//   `templates: ["x"]` grants submission only through template `x` and
//   never via raw RunJob.
message AclPolicy {
  // Unique policy name. Tokens reference policies by exact name.
  string name = 1;

  // Free-form description.
  string description = 2;

  // JSON array of rules (see message comment for the schema).
  string rules_json = 3;

  // RFC3339 creation timestamp.
  string created_at = 4;

  // RFC3339 last-update timestamp.
  string updated_at = 5;
}

// Request payload for UpsertAclPolicy.
message UpsertAclPolicyRequest {
  // Policy name to create or replace.
  string name = 1;

  // Free-form description.
  string description = 2;

  // JSON array of rules (see AclPolicy for the schema). Validated on write.
  string rules_json = 3;
}

// Reply payload for UpsertAclPolicy.
message UpsertAclPolicyReply {
  // The stored policy.
  AclPolicy policy = 1;

  // Advisories that did not stop the write, e.g. a rule naming an exact
  // namespace that does not exist yet (`rule 0 names namespace
  // 'payments-prdo', which does not exist`). Policies are often written
  // before the namespaces they name, so this never refuses; globs never
  // warn.
  repeated string warnings = 2;
}

// Request payload for GetAclPolicy.
message GetAclPolicyRequest {
  // Policy name (exact match).
  string name = 1;
}

// Reply payload for GetAclPolicy.
message GetAclPolicyReply {
  // The requested policy.
  AclPolicy policy = 1;
}

// Request payload for ListAclPolicies.
message ListAclPoliciesRequest {
}

// Reply payload for ListAclPolicies.
message ListAclPoliciesReply {
  // All policies, sorted by name.
  repeated AclPolicy policies = 1;
}

// Request payload for DeleteAclPolicy.
message DeleteAclPolicyRequest {
  // Policy name (exact match).
  string name = 1;
}

// Reply payload for DeleteAclPolicy.
message DeleteAclPolicyReply {
  // Human-readable status message.
  string message = 1;
}

// Request payload for CreateAclToken.
message CreateAclTokenRequest {
  // Human-readable token name.
  string name = 1;

  // Token type: `management` or `client`. Default when empty: `client`.
  string token_type = 2;

  // Names of existing policies to attach. Required (non-empty) for client
  // tokens; must be empty for management tokens.
  repeated string policies = 3;

  // Optional lifetime (humantime format, for example "720h").
  //
  // Default when omitted: the token never expires.
  optional string ttl = 4;
}

// Reply payload for CreateAclToken.
message CreateAclTokenReply {
  // Metadata for the new token.
  AclTokenInfo token = 1;

  // The token secret. Returned exactly once; the manager stores only a hash.
  string secret = 2;
}

// Request payload for ListAclTokens.
message ListAclTokensRequest {
}

// Reply payload for ListAclTokens.
message ListAclTokensReply {
  // All tokens (metadata only), newest first.
  repeated AclTokenInfo tokens = 1;
}

// Request payload for DeleteAclToken.
message DeleteAclTokenRequest {
  // Accessor ID of the token to revoke.
  string accessor_id = 1;
}

// Reply payload for DeleteAclToken.
message DeleteAclTokenReply {
  // Human-readable status message.
  string message = 1;
}

// A username/password ACL user. Never contains password material.
message AclUser {
  // Unique username.
  string username = 1;

  // Names of policies attached to tokens minted when this user logs in.
  repeated string policies = 2;

  // RFC3339 creation timestamp.
  string created_at = 3;

  // RFC3339 last-update timestamp.
  string updated_at = 4;
}

// Request payload for UpsertAclUser.
message UpsertAclUserRequest {
  // Username to create or update.
  string username = 1;

  // Plaintext password; hashed with argon2id before storage.
  //
  // When updating an existing user, an empty password keeps the current one.
  string password = 2;

  // Names of existing policies granted on login.
  repeated string policies = 3;
}

// Reply payload for UpsertAclUser.
message UpsertAclUserReply {
  // The stored user.
  AclUser user = 1;
}

// Request payload for ListAclUsers.
message ListAclUsersRequest {
}

// Reply payload for ListAclUsers.
message ListAclUsersReply {
  // All users, sorted by username.
  repeated AclUser users = 1;
}

// Request payload for DeleteAclUser.
message DeleteAclUserRequest {
  // Username (exact match).
  string username = 1;
}

// Reply payload for DeleteAclUser.
message DeleteAclUserReply {
  // Human-readable status message.
  string message = 1;
}

// Request payload for ListGrants.
message ListGrantsRequest {
  // Only this job's grants: its canonical id (`namespace/name`, or the bare
  // name for a job in `default`). Unset or empty lists every job's.
  optional string job = 1;

  // Also list revoked grants, with who revoked them and when.
  //
  // Default: false.
  bool include_revoked = 2;
}

// What one task's `legion` identity was granted.
message TaskGrantInfo {
  // The task's group.
  string group = 1;

  // The task's name.
  string task = 2;

  // The inline rules granted (`permissions` on the identity), as a JSON
  // array in the shape `legion acl policy apply` takes. `[]` when the
  // identity named only policies.
  string permissions_json = 3;

  // The policy names granted (`policies` on the identity). Resolved by name
  // when a token is verified, so a later edit to a policy applies to the
  // grant too.
  repeated string policies = 4;
}

// One job config version's grant.
message JobGrant {
  // The job's canonical id.
  string job_id = 1;

  // The job config version the grant belongs to; allocations of other
  // versions resolve those versions' grants.
  int64 version = 2;

  // The job config id (`<job id>-<version>`).
  string job_config_id = 3;

  // What each task asking for something was granted.
  repeated TaskGrantInfo tasks = 4;

  // The principal whose submit was checked and granted it (for example
  // `userpass:alice`). A version Legion stored itself, re-rendering a job
  // after a KV change, carries the previous version's grant, and its granter,
  // when it asks for exactly the same.
  string granted_by = 5;

  // When the grant was recorded (RFC3339).
  string granted_at = 6;

  // When the grant was revoked (RFC3339), empty while it is live.
  string revoked_at = 7;

  // Who revoked it, empty while it is live.
  string revoked_by = 8;
}

// Reply payload for ListGrants.
message ListGrantsReply {
  // Grants, by job id, newest version first.
  repeated JobGrant grants = 1;
}

// Request payload for RevokeGrant.
message RevokeGrantRequest {
  // The job's canonical id (`namespace/name`, or the bare name in
  // `default`). Required.
  string job = 1;

  // Revoke only this version's grant. Unset revokes every version's, which
  // is what stops a running job's access whatever version it runs.
  optional int64 version = 2;

  // Optional key to dedupe retries; a repeat returns the first reply with
  // `deduplicated = true`.
  optional string idempotency_key = 3;
}

// Reply payload for RevokeGrant.
message RevokeGrantReply {
  // Human-readable status message.
  string message = 1;

  // How many live grants this call revoked.
  uint32 revoked = 2;

  // True when `idempotency_key` matched an earlier call, whose reply this
  // is.
  bool deduplicated = 3;
}

// === APPS ===

// Request payload for ListApps.
message ListAppsRequest {
}

// Reply payload for ListApps.
message ListAppsReply {
  // Installed apps the caller may read, by name.
  repeated App apps = 1;
}

// An app's settings (`legion app set`).
message AppSettingsInfo {
  // Copies of each task. 1-32.
  uint32 replicas = 1;

  // `managers`, `workers`, or `any` (docs/apps.md, "Placement").
  string placement = 2;

  // CPU (MHz) for each task, overriding the manifest. Unset keeps the
  // manifest's.
  optional uint64 cpu = 3;

  // Memory (MiB) for each task, overriding the manifest.
  optional uint64 memory = 4;

  // The worker pool for `workers` and `any` placement. Unset is `default`.
  optional string pool = 5;
}

// What an app's `legion` identity was granted.
message AppGrantInfo {
  // The granted rules, as a JSON array in the shape `legion acl policy
  // apply` takes.
  string rules_json = 1;

  // Who approved them: the installer (`userpass:alice`), or
  // `legion:bootstrap` for a bundled app's seed.
  string granted_by = 2;

  // When (RFC3339).
  string granted_at = 3;
}

// The app reconciler's view of an app.
message AppReconcileInfo {
  // The digest of the last render the reconciler submitted or found.
  string last_digest = 1;

  // What its last pass did: `created the job`, `reverted a direct edit by
  // userpass:alice`, `stopped (app disabled)`.
  string last_action = 2;

  // Its last error, empty after a success.
  string last_error = 3;

  // When the last action or error was recorded (RFC3339).
  string last_at = 4;

  // The build marker a bundled app's job is rendered for
  // (`<buildVersion>+<buildId>`), empty for installed apps and before any
  // eligible node reported its build.
  string build_marker = 5;

  // What the app waits for, when anything: `upgrade waiting: 2 of 3
  // eligible nodes on 0.15.0 (waiting for mgr-3)`.
  string marker_reason = 6;

  // The digest stamped on the job's latest version (`managedBy`). Empty
  // when the latest version was submitted by someone else.
  string job_digest = 7;
}

// An installed app.
message App {
  // The app's name; its job is `legion-system/<name>`.
  string name = 1;

  // The manifest's description.
  string description = 2;

  // The manifest's version, or a bundled app's build marker version.
  string version = 3;

  // `bundled`, `file`, or `url`.
  string source = 4;

  // The file or URL the manifest was installed from; empty for bundled
  // apps.
  string source_ref = 5;

  // Whether the app should run.
  bool enabled = 6;

  AppSettingsInfo settings = 7;

  // `running`, `degraded`, `pending`, or `stopped`.
  string status = 8;

  // Why, when the status needs one: `2/3 running`, `reconcile failing:
  // ...`, `waiting for an eligible node to report its build`.
  string status_detail = 9;

  // The app's job (`legion-system/<name>`).
  string job_id = 10;

  // Allocations running.
  uint32 running = 11;

  // Allocations the app should run: replicas times tasks, 0 when disabled.
  uint32 desired = 12;

  // The digest of the stored manifest.
  string manifest_digest = 13;

  // The stored manifest, as JSON.
  string manifest_json = 14;

  // The app's config, as JSON.
  string config_json = 15;

  AppGrantInfo grant = 16;

  // Who installed it.
  string installed_by = 17;

  // When it was installed, and last changed (RFC3339).
  string installed_at = 18;
  string updated_at = 19;

  AppReconcileInfo reconcile = 20;

  // The UI slots the manifest registers (`nav`, `job`, ...).
  repeated string ui_slots = 21;

  // Things an operator should know: no system worker on its managers,
  // workload identity off (the app has no Legion credentials).
  repeated string notes = 22;

  // The nodes running it.
  repeated string running_on = 23;
}

// Request payload for GetApp.
message GetAppRequest {
  // The app's name.
  string name = 1;
}

// Reply payload for GetApp.
message GetAppReply {
  App app = 1;
}

// Request payload for InstallApp.
message InstallAppRequest {
  // The manifest, as JSON (the CLI evaluates a Nickel manifest first).
  string manifest_json = 1;

  // `file` or `url`: where the manifest came from.
  string source = 2;

  // The path or URL, recorded for `legion app status`.
  string source_ref = 3;

  // Validate and check the grant, and return the prompt, without
  // installing.
  bool dry_run = 4;

  // The initial config, as JSON. Unset installs the manifest's default.
  optional string config_json = 5;

  // Optional key to dedupe retries; a repeat returns the first reply with
  // `deduplicated = true`.
  optional string idempotency_key = 6;
}

// Reply payload for InstallApp.
message InstallAppReply {
  // The installed app (on a dry run, the record it would be).
  App app = 1;

  // Human-readable status message.
  string message = 2;

  // True when `idempotency_key` matched an earlier call.
  bool deduplicated = 3;

  // The install prompt: what the app runs, where, as whom, what it asks
  // for, and its UI, one line each.
  repeated string prompt = 4;

  // On a dry run, the first permission the caller does not hold, worded as
  // the refusal would be; empty when the caller holds them all.
  string uncovered = 5;
}

// Request payload for UpgradeApp.
message UpgradeAppRequest {
  // The app to upgrade.
  string name = 1;

  // The new manifest, as JSON. Its `name` must be the app's.
  string manifest_json = 2;

  // The path or URL it came from.
  string source_ref = 3;

  // Approve permissions the new manifest adds. Without it, an upgrade that
  // adds any changes nothing and returns the diff.
  bool approve = 4;

  // Show the diff and the prompt without upgrading.
  bool dry_run = 5;

  // Optional key to dedupe retries.
  optional string idempotency_key = 6;

  // The config to run the new manifest with, as JSON. Unset keeps the
  // stored config, which must then match the new manifest's schema.
  optional string config_json = 7;
}

// How an upgrade changes an app's grant.
message PermissionDiff {
  // Rules the new manifest adds, as a JSON array.
  string added_json = 1;

  // Rules it drops.
  string removed_json = 2;

  // Rules both have.
  string unchanged_json = 3;
}

// Reply payload for UpgradeApp.
message UpgradeAppReply {
  // The app after the call (unchanged when `upgraded` is false).
  App app = 1;

  PermissionDiff diff = 2;

  // Whether the manifest was replaced.
  bool upgraded = 3;

  // Human-readable status message; says why when `upgraded` is false.
  string message = 4;

  // True when `idempotency_key` matched an earlier call.
  bool deduplicated = 5;

  // The new manifest's install prompt.
  repeated string prompt = 6;
}

// Request payload for UninstallApp.
message UninstallAppRequest {
  string name = 1;

  // Optional key to dedupe retries.
  optional string idempotency_key = 2;
}

// Reply payload for UninstallApp.
message UninstallAppReply {
  // Human-readable status message.
  string message = 1;

  // How many job grants were revoked.
  uint32 revoked_grants = 2;

  // True when `idempotency_key` matched an earlier call.
  bool deduplicated = 3;
}

// Request payload for SetAppEnabled.
message SetAppEnabledRequest {
  string name = 1;

  // True runs the app; false stops its job and keeps everything else.
  bool enabled = 2;

  // Optional key to dedupe retries.
  optional string idempotency_key = 3;
}

// Reply payload for SetAppEnabled.
message SetAppEnabledReply {
  App app = 1;

  // Human-readable status message.
  string message = 2;

  // True when `idempotency_key` matched an earlier call.
  bool deduplicated = 3;
}

// Request payload for UpdateAppSettings. Unset fields keep their value.
message UpdateAppSettingsRequest {
  string name = 1;

  optional uint32 replicas = 2;

  // `managers`, `workers`, or `any`.
  optional string placement = 3;

  // CPU (MHz) per task; 0 clears the override.
  optional uint64 cpu = 4;

  // Memory (MiB) per task; 0 clears the override.
  optional uint64 memory = 5;

  // The worker pool for `workers` and `any` placement; empty clears it.
  optional string pool = 6;

  // Optional key to dedupe retries.
  optional string idempotency_key = 7;
}

// Reply payload for UpdateAppSettings.
message UpdateAppSettingsReply {
  App app = 1;

  // Human-readable status message: what changed.
  string message = 2;

  // True when `idempotency_key` matched an earlier call.
  bool deduplicated = 3;
}

// Request payload for SetAppConfig.
message SetAppConfigRequest {
  string name = 1;

  // The whole new config, as JSON.
  string config_json = 2;

  // Optional key to dedupe retries.
  optional string idempotency_key = 3;
}

// Reply payload for SetAppConfig.
message SetAppConfigReply {
  App app = 1;

  // Human-readable status message.
  string message = 2;

  // The code fields the change touched (concrete JSON pointers); the
  // caller's grant was checked when any did.
  repeated string code_fields_changed = 3;

  // True when `idempotency_key` matched an earlier call.
  bool deduplicated = 4;
}

// === APP UI EXTENSIONS (docs/apps.md, "Views and actions") ===

// Where an app view or action is shown, and what it is about. The manager
// checks a declared permission on this context, and the viewer assertion
// carries it to the app exactly as the request does. Which fields a slot
// takes:
// - `nav`, `overview`: none;
// - `job`: `namespace` (default `default`) and `job`;
// - `task`: `namespace`, `job`, `task`, and `group` when the task has one;
// - `node`: `node`.
//
// Any other field set for the slot is InvalidArgument.
message AppViewContext {
  // `nav`, `overview`, `job`, `task`, or `node`.
  string slot = 1;
  // The job's namespace (`job` and `task`).
  string namespace = 2;
  // The job's bare name, or its canonical id `namespace/name` (split into
  // `namespace` and `job` on the way in).
  string job = 3;
  // The task's group (`task`, optional).
  string group = 4;
  // The task's name (`task`).
  string task = 5;
  // The node's id (`node`).
  string node = 6;
}

// A permission a UI extension or action declares: an ACL resource and
// action, checked as the viewer.
message UiPermission {
  // An ACL resource: `job`, `scale`, `node`, ...
  string resource = 1;
  // `read` or `write`.
  string action = 2;
}

// One UI registration the caller may see.
message UiExtension {
  // The app that registers it.
  string app = 1;
  // `nav`, `overview`, `job`, `task`, or `node`.
  string slot = 2;
  // The page's, card's, or panel's title (the sidebar label for `nav`).
  // Empty for a task entry that only shows a badge.
  string title = 3;
  // The sidebar icon name (`nav`); the SPA uses a default for one it does
  // not know.
  string icon = 4;
  // The view to fetch with GetAppView. Empty for a task entry that only
  // shows a badge.
  string view = 5;
  // For `task`: the view whose `badge` the task row shows.
  string badge = 6;
  // The permission the entry declares, when it declares one.
  UiPermission permission = 7;
  // How often the SPA re-fetches the app's views, in seconds (the
  // manifest's `ui.refresh`); 0 means on page load and on demand only.
  uint32 refresh_seconds = 8;
  // The app's one-line description.
  string app_description = 9;
  // For `nav`: the sandboxed page this entry opens (`ui.pages[].name`),
  // fetched with GetAppPage; `view` is then empty. The SPA routes it to
  // `/apps/<app>/pages/<page>`.
  string page = 10;
}

// Request payload for ListUiExtensions.
message ListUiExtensionsRequest {
  // Only this slot's entries; empty for every slot.
  string slot = 1;
  // When set, entries are filtered by their permission on this context;
  // `context.slot` must equal `slot`.
  AppViewContext context = 2;
  // Only this app's entries; empty for every app.
  string app = 3;
}

// Response payload for ListUiExtensions.
message ListUiExtensionsReply {
  // The entries, by app name, then slot, then declaration order.
  repeated UiExtension extensions = 1;
}

// Request payload for GetAppView.
message GetAppViewRequest {
  // The app's name.
  string app = 1;
  // The view's name. Empty picks the first entry the caller may see in the
  // context's slot (its view, or a task entry's badge view).
  string view = 2;
  // Where the view is shown. Required (its `slot` at least).
  AppViewContext context = 3;
}

// An action a view's `actions` block offers: its declaration, and whether
// the caller may invoke it on this context.
message AppActionInfo {
  // The action's name, for InvokeAppAction.
  string name = 1;
  // Its title, the default button label.
  string title = 2;
  // The confirmation to show, with `{job}` and the other context
  // placeholders filled in. Empty when none is needed: a `write` action
  // always has one (its own, or "<title>?").
  string confirm = 3;
  // The declared inputs, as a JSON object keyed by input name:
  // `{ "for": { "type": "duration", "default": "1h" } }`. Types are
  // `string`, `number`, `duration`, `enum` (with `values`), and `boolean`.
  string inputs_json = 4;
  // The permission InvokeAppAction checks as the caller.
  UiPermission permission = 5;
  // Whether the caller holds it on this context. The SPA disables the
  // button otherwise; the check runs again on invocation.
  bool allowed = 6;
  // Whether the action is a `write`.
  bool mutating = 7;
}

// Response payload for GetAppView.
message GetAppViewReply {
  // The app's name.
  string app = 1;
  // The view that was rendered.
  string view = 2;
  // The context, normalized (namespace filled in, `ns/job` split).
  AppViewContext context = 3;
  // The view document, validated, as JSON: `{ "view": "legion-view/1",
  // "title"?, "badge"?, "hidden"?, "blocks": [...] }` (docs/apps.md, "The
  // view schema").
  string view_json = 4;
  // The entry's title; the document's own `title` overrides it.
  string title = 5;
  // The actions the document's `actions` blocks reference.
  repeated AppActionInfo actions = 6;
  // The app's `ui.refresh`, in seconds; 0 for none.
  uint32 refresh_seconds = 7;
  // The allocation that answered.
  int64 allocation_id = 8;
  // The node it runs on.
  string node_id = 9;
}

// Request payload for InvokeAppAction.
message InvokeAppActionRequest {
  // The app's name.
  string app = 1;
  // The action's name (`ui.actions[].name`).
  string action = 2;
  // Where it was pressed: a `job`, `task`, or `node` context.
  AppViewContext context = 3;
  // The inputs, as a JSON object; empty or `{}` for the defaults.
  string inputs_json = 4;
  // Optional client key for retry-safe submission: a repeated key from the
  // same caller with the same arguments returns the first successful
  // reply with `deduplicated` set, and the app sees one request.
  optional string idempotency_key = 5;
}

// Response payload for InvokeAppAction.
message InvokeAppActionReply {
  // What the app says happened.
  string message = 1;
  // A refreshed view the app returned, validated, as JSON; empty when it
  // returned none.
  string view_json = 2;
  // True when `idempotency_key` matched an earlier call.
  bool deduplicated = 3;
  // The inputs the action ran with, defaults filled in, as JSON.
  string inputs_json = 4;
}

// Request payload for GetAppPage.
message GetAppPageRequest {
  // The app's name.
  string app = 1;
  // The page's name (`ui.pages[].name`).
  string page = 2;
}

// A Manager RPC a sandboxed page may call through the SPA's bridge.
message AppPageRpc {
  // The RPC's name, as `proto/legion.proto` spells it (`GetJobInfo`).
  string method = 1;
  // Whether the call changes something. The SPA asks the viewer before
  // every such call, naming the app, the RPC, and its target; reads run
  // without asking. Classified by what the call does, not by its ACL action.
  bool mutating = 2;
}

// Response payload for GetAppPage.
message GetAppPageReply {
  // The app's name.
  string app = 1;
  // The page's name.
  string page = 2;
  // The page's title (`ui.pages[].title`).
  string title = 3;
  // The page's single-file HTML bundle, as the app served it (UTF-8, at
  // most 1 MiB). The SPA prepends its Content-Security-Policy and the
  // bridge's script, and mounts it in a sandboxed `srcdoc` iframe.
  string html = 4;
  // The RPCs the page may call through the bridge (`ui.pages[].rpcs`), as
  // the viewer. Every bridged call carries the `legion-app-page: <app>/<page>`
  // header, and the manager refuses one whose RPC is not on this list.
  repeated AppPageRpc rpcs = 5;
  // The allocation that answered.
  int64 allocation_id = 6;
  // The node it runs on.
  string node_id = 7;
}

// === AUTH METHODS & JOIN TOKENS ===

// Request payload for GetAuthMethods.
message GetAuthMethodsRequest {
}

// Public metadata for one auth method (no secrets or keys).
message AuthMethodInfo {
  // Method name; pass to Login / `legion login --method <name>`.
  string name = 1;

  // Method kind: `userpass`, `jwt`, `oidc`, `webhook`, or `custom`.
  string kind = 2;

  // OIDC issuer URL (oidc kind only). Clients run discovery against it.
  optional string oidc_issuer = 3;

  // OAuth client ID registered for Legion at the identity provider
  // (oidc kind only). Required for browser/CLI redirect login.
  optional string oidc_client_id = 4;

  // OAuth scopes to request (oidc kind only). Default: ["openid"].
  repeated string oidc_scopes = 5;
}

// Reply payload for GetAuthMethods.
message GetAuthMethodsReply {
  // All registered auth methods, in registration order (userpass first).
  repeated AuthMethodInfo methods = 1;
}

// Request payload for CreateJoinToken.
message CreateJoinTokenRequest {
  // Worker type the token introduces (selects the worker template).
  //
  // Default when empty: "default".
  string worker_type = 1;

  // Optional lifetime (humantime format, for example "24h").
  //
  // Default when omitted: 24h. Pass "none" for a non-expiring token
  // (discouraged; prefer short-lived tokens).
  optional string ttl = 2;

  // Free-form description shown in ListJoinTokens (for example "rack 12").
  string description = 3;

  // The most nodes that may register with this token. Each new node that
  // registers with it uses it once; a node re-registering under its own
  // name (a restart that fell back to the join token, or a node that was
  // marked lost rejoining) does not. Once spent, the token refuses new
  // nodes with PERMISSION_DENIED. A node that `ForgetNode` removed is new
  // again, so a spent token cannot bring it back.
  //
  // Default: unset (no limit). 0 is refused with InvalidArgument.
  optional uint32 max_uses = 4;

  // Node attributes stamped on every node that registers with this token
  // (`legion.nodegroup = "workers-general"`). They take precedence over the
  // worker's `--attr` values and its worker type's attributes, and survive
  // the node's restarts. Keys Legion reads as node structure (`namespaces`,
  // `resources`, `restriction`, ...) and `legion.role` and `legion.join`
  // are refused with InvalidArgument. At most 64 entries; keys up to 128
  // bytes, values up to 1024. See docs/auth-and-acls.md, "Node attributes
  // from the join".
  //
  // Default: empty.
  map<string, string> attributes = 5;
}

// Metadata describing a join token. Never contains the secret.
message JoinTokenInfo {
  // Public identifier; the handle used by DeleteJoinToken.
  string id = 1;

  // Worker type this token introduces.
  string worker_type = 2;

  // Free-form description.
  string description = 3;

  // RFC3339 expiry. Omitted when the token never expires.
  optional string expires_at = 4;

  // RFC3339 creation timestamp.
  string created_at = 5;

  // The most nodes that may register with this token. Unset: no limit.
  optional uint32 max_uses = 6;

  // New nodes that have registered with this token so far.
  uint32 uses = 7;

  // Node attributes stamped on every node that registers with it.
  map<string, string> attributes = 8;
}

// Reply payload for CreateJoinToken.
message CreateJoinTokenReply {
  // Token metadata.
  JoinTokenInfo info = 1;

  // The composite join token handed to the worker
  // (`legion join <TOKEN>`). Base64url-encoded JSON carrying the manager
  // address, the secret, and the worker type. Returned exactly once; the
  // manager stores only a hash of the embedded secret.
  string token = 2;

  // Set when the token is unusable from another machine: the manager binds
  // every interface (`server.host` is `0.0.0.0` or `::`) but has no
  // `server.advertiseAddr`, so the address it embeds is loopback. A remote
  // worker would dial its own loopback and retry forever, and nothing on the
  // manager would look wrong. The text names the embedded address and the
  // setting that fixes it. The token is still valid for a worker on the
  // manager's own machine.
  //
  // Default: empty (the embedded address is the one the operator chose).
  string warning = 3;
}

// Request payload for ListJoinTokens.
message ListJoinTokensRequest {
}

// Reply payload for ListJoinTokens.
message ListJoinTokensReply {
  // All join tokens (metadata only), newest first.
  repeated JoinTokenInfo tokens = 1;
}

// Request payload for DeleteJoinToken.
message DeleteJoinTokenRequest {
  // Join token ID to revoke.
  string id = 1;
}

// Reply payload for DeleteJoinToken.
message DeleteJoinTokenReply {
  // Human-readable status message.
  string message = 1;
}

// === EDGE BOOT (provisional allocations, gates, boot tickets) ===

// How far a node may get on a start before the placement is durable
// (docs/edge-boot.md). Both the task's `speculativeStart.mode` and a boot
// ticket's `legion.io/gate` claim carry one of these; the LOWER of the two
// always wins, so neither a jobspec nor a ticket can raise the other's
// ceiling.
enum GateLevel {
  // No speculation: today's behavior. The node is told about the allocation
  // only after the commit. This is the default for every task.
  GATE_OFF = 0;

  // The node may fetch artifacts, pull images, build root disks, and
  // provision (but not attach) node-local volumes before the commit. It may
  // NOT start the workload. Nothing outside the node can observe a staged
  // claim; the only cost of losing the race is wasted local work.
  GATE_STAGE = 1;

  // Everything `GATE_STAGE` allows, plus booting the guest and running the
  // workload with its network held shut. It may NOT open the network,
  // register in service discovery, attach shared storage, or obtain any
  // Legion-issued identity until ratified.
  //
  // The network gate is a real boundary for the `sandbox` runtime (the TAP
  // device is held down with a default-drop filter) and a weaker one for
  // host runtimes — see docs/edge-boot.md "What the gate does and does not
  // stop".
  GATE_BOOT = 2;

  // Everything `GATE_BOOT` allows, plus opening the network immediately.
  // The fastest mode, and the only one where a workload that loses its race
  // may already have produced externally visible side effects before it is
  // killed. It still cannot obtain a Legion-issued identity or attach shared
  // storage, so a loser can never act as the winner inside the cluster.
  GATE_SERVE = 3;
}

// Why a ratification was refused. Workers treat an unrecognized value as
// `REFUSAL_UNSPECIFIED` and kill the work anyway — fail-closed under skew.
enum ClaimRefusalReason {
  // Reason not stated (or from a newer manager than this worker knows).
  REFUSAL_UNSPECIFIED = 0;

  // Another allocation already owns this instance id. The expected outcome
  // of two edges racing for one sandbox: the first ratification binds, this
  // one loses.
  REFUSAL_INSTANCE_CLAIMED = 1;

  // The node no longer has room for the placement, as re-validated on the
  // fresh node row inside the apply transaction.
  REFUSAL_NO_CAPACITY = 2;

  // The node does not satisfy the task's constraints/permit, or is cordoned,
  // draining, or lost.
  REFUSAL_INELIGIBLE = 3;

  // The claim's lease expired before the ratification reached the manager.
  REFUSAL_EXPIRED = 4;

  // The boot ticket was invalid: bad signature, wrong audience, wrong pool,
  // expired, or a `jti` already spent (single-use replay).
  REFUSAL_TICKET_INVALID = 5;

  // The job config, task, or instance named by the claim does not exist.
  REFUSAL_UNKNOWN_TARGET = 6;

  // Edge boot is disabled on this manager (`edgeBoot.enabled: false`).
  REFUSAL_DISABLED = 7;

  // The manager failed to apply the ratification for an internal reason
  // (a store error, a raft election in progress). Retriable within the
  // lease; fatal at the deadline.
  REFUSAL_INTERNAL = 8;
}

// The provisional half of a dispatch: everything a worker needs to run work
// that is not yet durable, and to kill it if it never becomes durable.
//
// Absent on every allocation of a job that did not opt into
// `speculativeStart`, so today's dispatch payloads are unchanged on the wire.
message ProvisionalAllocation {
  // Claim id (`clm_<uuid>`), minted by whoever asked for the start. This is
  // the correlation key for the whole lifecycle: the worker keys its claim
  // table by it, ratification names it, and it appears in every event.
  string claim_id = 1;

  // How far this start may get before ratification.
  GateLevel gate = 2;

  // Unix seconds after which the worker MUST kill this work unconditionally
  // if it has not been ratified. This is the lease, and it is the backstop
  // for every failure mode the reply path cannot cover — a partition, a dead
  // manager, a lost reply.
  int64 lease_deadline_unix = 3;

  // Instance id this claim is racing for, when the task is stateful. Empty
  // for stateless tasks. Stable from the first millisecond, which is why an
  // edge addresses a sandbox by this rather than by an allocation id that
  // does not exist yet.
  string instance_id = 4;

  // How the start was authorized: `manager` (pre-commit dispatch from a
  // manager that is applying the plan right now) or `edge` (a node acting on
  // a boot ticket).
  string origin = 5;

  // What to do when ratification is refused: `kill` (default — a hard
  // destroy) or `stop` (the task's normal graceful-stop ladder, then
  // removal). Mirrors `speculativeStart.onRefused`.
  string on_refused = 6;

  // The boot ticket's `jti`, for edge-originated starts. Carried into
  // ratification so the manager can enforce single use, and into the audit
  // events so a start is traceable to the capability that authorized it.
  // Never the ticket itself — no ticket material ever appears in a log,
  // event, or store row.
  string ticket_jti = 7;

  // Set when this start is an unnamed session (docs/session-mode.md) sent by
  // a manager's session router. The node admits it against its envelope for
  // the task instead of its own free resources, keeps it under the claim id
  // `session:<instance_id>` with no lease deadline, never reports it in
  // `provisional_claims`, and reports it in `session_report` instead. It
  // runs until it exits, is stopped, is promoted, or its envelope leaves the
  // node. Refused with RESOURCE_EXHAUSTED when the envelope has no room and
  // FAILED_PRECONDITION when the node holds no envelope for the task.
  optional SessionStart session = 8;
}

// A session start (`ProvisionalAllocation.session`).
message SessionStart {
  // When the router issued the session, unix milliseconds. Breaks a tie
  // between two copies of one session id: the later one is stopped.
  int64 lease_issued_at_unix_ms = 1;
}

// One unratified claim a worker is holding, reported on every heartbeat.
//
// This is what makes started-but-unconfirmed work visible to an operator
// looking at capacity, and it is the catch-up channel's key: a manager that
// sees a claim it has already decided replies with a verdict in
// `HeartbeatReply.claim_verdicts`.
message ProvisionalClaimReport {
  // Claim id.
  string claim_id = 1;

  // Job config this claim runs an exact version of.
  string job_config_id = 2;

  // Task name within that config.
  string task_name = 3;

  // Instance id being raced for, empty for stateless tasks.
  string instance_id = 4;

  // Gate level actually in force (the lower of the task's mode and any
  // ticket ceiling).
  GateLevel gate = 5;

  // How far the claim has actually progressed: `claimed`, `staged`,
  // `booted`, or `serving`.
  string stage = 6;

  // Unix seconds at which the worker kills this claim if still unratified.
  int64 lease_deadline_unix = 7;

  // JSON-encoded resource request this claim is holding in the node's local
  // ledger, so the manager can show unratified usage alongside committed
  // usage.
  string resources = 8;
}

// A ratification verdict delivered out-of-band on a heartbeat.
//
// The primary delivery is the `RatifyClaim` reply. This field exists because
// that reply can be lost (the connection dies after the manager committed):
// without it the worker would kill work the cluster believes is running, and
// the instance would be bound to a dead allocation until the next reschedule.
message ClaimVerdict {
  // Claim the verdict is about.
  string claim_id = 1;

  // True when the claim was confirmed and `allocation_id` is set.
  bool confirmed = 2;

  // Manager-minted allocation id, set only when `confirmed`.
  int64 allocation_id = 3;

  // Why it was refused, when not confirmed.
  ClaimRefusalReason reason = 4;

  // Human-readable detail (`bound to node-a`), for logs and `legion instance
  // get`. Never contains ticket material.
  string detail = 5;
}

// Request payload for IssueBootTicket.
message IssueBootTicketRequest {
  // Job the ticket may start work for. Required; also the ACL scope.
  string job = 1;

  // Task within that job. Required — a ticket names one task, never a whole
  // group.
  string task = 2;

  // Exact job config id the ticket authorizes. Optional: when empty the
  // manager pins the job's current config at mint time and returns it in the
  // reply. A ticket NEVER means "latest" — pinning at mint is what keeps a
  // redeploy from silently widening what a live ticket can start. When set,
  // it must be a config of `job` (the job `boot:write` was checked against);
  // another job's config is NOT_FOUND.
  string job_config_id = 3;

  // Exactly one of these bounds which instance may be started:
  //
  // - `instance_id` — one specific sandbox. The narrowest capability.
  // - `instance_prefix` — any instance whose id starts with this string.
  //   Must be non-empty; an empty prefix would authorize every instance of
  //   the task. Lets a platform mint one ticket per user cohort rather than
  //   one per request, at the cost of a wider capability if the node holding
  //   it is compromised.
  //
  // Both empty is rejected for stateful tasks.
  //
  // Either may be written as a key (`user-42`, `user-`): it is qualified in
  // `job`'s namespace (`payments/user-42`), exactly as instance ids are
  // (docs/namespaces.md, "Instances"). The ticket carries the canonical
  // form, and that is the `StartClaimRequest.instance_id` a node accepts.
  string instance_id = 4;
  string instance_prefix = 5;

  // Node pool the ticket may be redeemed in. Required: a ticket says what
  // may run AND where. The worker checks this against its own pool offline.
  string pool = 6;

  // Ceiling on how far a redeeming node may get before ratification. The
  // task's own `speculativeStart.mode` also caps it, and the lower of the
  // two always wins. `GATE_OFF` mints a ticket that can stage nothing —
  // rejected as a mistake.
  GateLevel gate = 7;

  // Requested lifetime, e.g. `"5m"`. Defaults to `edgeBoot.defaultTicketTtl`
  // and is clamped to `edgeBoot.maxTicketTtl`. Revocation is by TTL only
  // (see docs/edge-boot.md) — the fast path cannot consult a revocation list
  // without becoming the round trip the ticket exists to avoid.
  string ttl = 8;

  // How many times the ticket may be ratified. Defaults to 1 (single use).
  // Enforced at the manager through the idempotency table, so two nodes
  // presented the same ticket both boot but only the first is confirmed.
  uint32 uses = 9;

  // Optional idempotency key. A repeat with the same key returns the
  // originally minted ticket rather than minting a second capability.
  optional string idempotency_key = 10;

  // What the ticket authorizes: `boot` (the default) or `session`.
  //
  // A `session` ticket (session durability plan §6.4) lets its holder start,
  // read, and stop sessions of one session task, on any node of `pool` that
  // holds the task's envelope (`Worker.StartSession`, `GetSession`,
  // `StopSession`), until it expires. It names no instance, prefix, or job
  // config (the node starts the spec of the envelope it holds), so
  // `instance_id`, `instance_prefix`, `job_config_id`, and `gate` must be
  // empty. It is not spent per session: `uses` must be 0 or 1 and is
  // recorded as 0 (unlimited); the envelopes' room bounds what it can
  // start. The task must be a session task.
  string scope = 11;
}

// Reply payload for IssueBootTicket.
message IssueBootTicketReply {
  // The signed ticket. This is the only time the manager returns it — the
  // store keeps metadata (`jti`, scope, expiry, accessor) for audit and
  // single-use enforcement, never the token bytes.
  string ticket = 1;

  // The ticket's `jti`, safe to log and to correlate against events.
  string jti = 2;

  // Exact job config the ticket is pinned to.
  string job_config_id = 3;

  // Expiry, unix seconds.
  int64 expires_at_unix = 4;

  // True when this reply replayed an earlier mint for the same idempotency
  // key rather than minting a new ticket.
  bool deduplicated = 5;
}

// Request payload for ListBootTickets.
message ListBootTicketsRequest {
  // Restrict to tickets for one job. Empty lists every ticket the caller is
  // allowed to see.
  string job = 1;
}

// One outstanding boot ticket, metadata only.
message BootTicket {
  // Ticket id (`jti`).
  string jti = 1;
  // Job the ticket authorizes starts for.
  string job = 2;
  // Task within that job.
  string task = 3;
  // Exact job config the ticket is pinned to.
  string job_config_id = 4;
  // Instance id it may start, when narrowed to one.
  string instance_id = 5;
  // Instance prefix it may start, when narrowed to a cohort.
  string instance_prefix = 6;
  // Node pool it may be redeemed in.
  string pool = 7;
  // Gate ceiling.
  GateLevel gate = 8;
  // Remaining redemptions.
  uint32 uses_remaining = 9;
  // Expiry, unix seconds.
  int64 expires_at_unix = 10;
  // ACL accessor id that minted it — who to ask about a start you did not
  // expect. Never a token secret.
  string accessor_id = 11;
  // Mint time, RFC3339.
  string created_at = 12;
  // `boot` or `session` (see `IssueBootTicketRequest.scope`).
  string scope = 13;
}

// Reply payload for ListBootTickets.
message ListBootTicketsReply {
  // Live tickets, newest first.
  repeated BootTicket tickets = 1;
}

// Request payload for RatifyClaim (worker plane).
message RatifyClaimRequest {
  // Node making the claim. Must match the node token on the request.
  string node_id = 1;

  // Claim being ratified.
  string claim_id = 2;

  // Exact job config the work runs.
  string job_config_id = 3;

  // Task within that config.
  string task_name = 4;

  // Instance id being bound, empty for stateless tasks.
  string instance_id = 5;

  // Gate level the work is currently held at, for the audit trail.
  GateLevel gate = 6;

  // Boot ticket that authorized the start. Required: a claim without one is
  // refused `TICKET_INVALID`. The manager re-verifies it (nodes are honest
  // but not trusted to be the only holder), refuses it unless it names this
  // claim's `job_config_id` and `task_name` with a gate at least `gate`, and
  // spends its `jti` when the ticket is single-use.
  string ticket = 7;
}

// Reply payload for RatifyClaim.
message RatifyClaimReply {
  // True when the placement committed. The worker opens the network and the
  // claim becomes an ordinary allocation.
  bool confirmed = 1;

  // Manager-minted allocation id, set only when `confirmed`.
  int64 allocation_id = 2;

  // Why it was refused, when not confirmed.
  ClaimRefusalReason reason = 3;

  // Human-readable detail for logs and `legion instance get`.
  string detail = 4;

  // The committed allocation, in the exact form an ordinary dispatch would
  // have carried it: the manager-minted id, the assigned network, and the
  // resolved volume mounts.
  //
  // Present only when `confirmed`. This is what lets a provisional start
  // finish as a *normal* allocation rather than as a second-class one: the
  // node replaces the payload it booted with (which could not name ports or
  // volumes, because those are assigned inside the apply transaction) before
  // it starts the workload or opens the network.
  //
  // It carries the same `provisional.claim_id`, so a node can match it to the
  // claim without trusting field ordering.
  TaskAllocation allocation = 5;
}

// Request payload for Worker.StartClaim (the edge entry point).
message StartClaimRequest {
  // Signed boot ticket authorizing this start. Verified entirely offline
  // against the cached JWKS; a node that cannot reach any manager can still
  // admit a start.
  string ticket = 1;

  // Instance id to start. Must equal the ticket's `legion.io/instance`, or
  // begin with its `legion.io/instance_prefix`.
  string instance_id = 2;

  // Caller-minted claim id (`clm_<uuid>`). Supplying it makes the call
  // retry-safe: a repeat with the same id joins the existing claim's stream
  // instead of starting a second sandbox.
  string claim_id = 3;

  // Requested gate ceiling. Capped by both the ticket's gate and the task's
  // `speculativeStart.mode`; the lowest of the three wins.
  GateLevel gate = 4;

  // Verify the ticket and local admission, then report what WOULD happen and
  // stop — no artifacts fetched, nothing booted, no claim held. For agents
  // and routers that want to self-correct before mutating anything.
  bool dry_run = 5;
}

// One transition on a StartClaim stream. The caller learns each stage
// without polling; a router may begin routing at `booted` and must expect
// `refused` at any point up to `ratified`.
message StartClaimReply {
  // Claim id (echoed, or the one the worker minted).
  string claim_id = 1;

  // Lifecycle stage reached: `admitted`, `staged`, `booted`, `serving`,
  // `ratified`, or `refused`.
  string stage = 2;

  // Manager-minted allocation id, set on the `ratified` frame only.
  int64 allocation_id = 3;

  // Refusal reason, set on the `refused` frame only.
  ClaimRefusalReason reason = 4;

  // Human-readable detail for the frame.
  string detail = 5;

  // Gate level in force for this claim, after intersecting the request, the
  // ticket, and the task's own mode.
  GateLevel gate = 6;
}

// === RAFT TRANSPORT (manager-plane internal) ===

// RaftTransport is the internal manager<->manager consensus transport for the
// replicated state store (docs/plans/durability-and-ops-execution-plan.md §2).
//
// This service is NOT part of the public Legion API and is NOT covered by the
// Manager-service ACL system (`tests/integration/acl_endpoints.rs` classifies Manager
// RPCs only). It is called exclusively by other managers in the same cluster —
// never by workers, CLIs, or UIs.
//
// Wire contract:
// - `payload` fields carry opaque, serde-encoded openraft 0.9 protocol types
//   (serialized with serde_json — see `src/storage/raft/network.rs` /
//   `src/storage/raft/server.rs` for the exact types on each RPC). Their
//   layout is an internal detail of the openraft version compiled into the
//   manager binary and is versioned by `PROTOCOL_VERSION`
//   (`src/constants.rs`) together with the rest of the manager plane:
//   managers with incompatible protocol versions must not be mixed in one
//   cluster (docs/upgrades.md — managers upgrade first).
// - `group_id` selects the raft group ("lane"). Values are the lane wire
//   names defined by `Lane` in `src/storage/raft/mod.rs`: "control",
//   "scheduler", "status". In the default `single` topology one group
//   (the control lane) carries all tables.
// - Every RPC must carry the cluster secret in request metadata under
//   `x-legion-raft-secret`. The secret is minted at bootstrap and travels
//   only inside signed join tokens; requests with a missing or mismatched
//   secret are rejected (Unauthenticated / PermissionDenied). Shared-secret
//   auth is the documented stopgap (plan JC-7) until manager-plane mTLS
//   lands with the worker-authn work.
service RaftTransport {
  // openraft AppendEntries for one group: log replication and leader
  // heartbeats. The request payload decodes as
  // `openraft::raft::AppendEntriesRequest<TypeConfig>`; the reply payload
  // encodes `Result<AppendEntriesResponse, RaftError>` so typed raft errors
  // (including higher-vote rejections) round-trip to the caller's openraft
  // core instead of being flattened into gRPC status codes.
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  rpc AppendEntries (RaftLaneRequest) returns (RaftLaneReply);

  // openraft RequestVote for one group (leader election). Payloads decode as
  // `VoteRequest` / `Result<VoteResponse, RaftError>`.
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  rpc Vote (RaftLaneRequest) returns (RaftLaneReply);

  // openraft InstallSnapshot: transfers one snapshot *chunk* for one group.
  //
  // This is deliberately a unary RPC with a bytes payload rather than a gRPC
  // client-streaming call: openraft 0.9's default snapshot transport already
  // implements chunking (offset + done bookkeeping, bounded by the
  // `snapshot_max_chunk_size` raft config) and calls this RPC once per
  // chunk, so wrapping it in a gRPC stream would duplicate the offset/ack
  // protocol that openraft maintains anyway. Payloads decode as
  // `InstallSnapshotRequest` (vote, offset, data, done) /
  // `Result<InstallSnapshotResponse, RaftError<_, InstallSnapshotError>>`.
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  rpc InstallSnapshot (RaftLaneRequest) returns (RaftLaneReply);

  // Adds a new manager to the raft cluster (plan §A4).
  //
  // The joining manager presents the signed join token minted by
  // `legion raft join-token` (which embeds the cluster id, the leader's
  // advertise address, and the cluster secret) plus its own identity. The
  // leader validates the token, derives the joiner's deterministic raft id
  // (`fnv1a64(node_id)` — see `src/storage/raft/types.rs`), adds it as a
  // learner to every configured group so it catches up via snapshot install,
  // and later promotes it to voter. The reply reports the assigned raft id
  // and the current membership of every group so the joiner can seed its
  // peer table. One token joins all lanes.
  // ACL: manager-plane internal, authenticated by cluster secret metadata
  // (the joiner reads the secret out of the join token before calling).
  rpc Join (JoinRaftClusterRequest) returns (JoinRaftClusterReply);

  // Executes one named single-lane store write on this manager, which must
  // currently lead the lane named by `group_id` (plan §8, D2 — standing-split
  // resilience).
  //
  // A manager that receives a worker-plane write (a heartbeat, a health
  // report, an allocation failure report) but does not lead the owning lane
  // forwards the operation here instead of failing the worker: the request
  // payload is a serde_json-encoded `ForwardableLaneWrite` — a closed enum
  // of forwardable operations carrying their FULL arguments (the executor
  // never derives payload from its own, possibly-lagging replica) — and the
  // reply payload is a serde_json-encoded `ForwardOutcome`: the operation's
  // JSON-encoded return value on success, a typed not-the-leader outcome
  // (with this node's own leader hint) when the receiving manager does not
  // lead the lane either, or an error message. The receiver executes the
  // operation's non-forwarding variant, so a stale hint produces one typed
  // rejection back to the origin rather than a forwarding loop.
  //
  // Also the worker-continuity path in `single` topology: workers dial one
  // fixed manager, so after a failover the demoted ex-leader forwards their
  // liveness to the new leader instead of rejecting every heartbeat (which
  // previously marked healthy workers lost and self-fenced their stateful
  // allocations).
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  rpc ForwardLaneWrite (RaftLaneRequest) returns (RaftLaneReply);

  // Reports which nodes a manager has personally received heartbeats from,
  // to the manager that leads the status lane.
  //
  // This is what keeps liveness off the raft path under `lanes` topology with
  // a standing leadership split. Workers dial ONE manager forever, so a
  // manager that leads nothing still receives their beats; rather than
  // forwarding each beat as a replicated write (the pre-digest behavior, kept
  // as the mixed-version fallback), it batches the ids it heard from and sends
  // one of these per `liveness.digestInterval`. The cost is
  // `managers x 1 RPC/interval`, independent of fleet size — at 1000 nodes
  // across 3 managers, 2 RPCs a second carrying ~333 ids each, against ~500
  // forwarded raft writes a second before.
  //
  // Pushed rather than pulled deliberately: a pull would make the lost
  // decision itself depend on a fan-out completing, so a manager that was slow
  // at tick time would make its nodes look dead. A push lets the leader hold
  // the last digest, know how old it is, and DECLINE to decide — see
  // `liveness.peerDigestGrace`.
  //
  // Carries ids only, not per-node times. Ids plus the digest's own timestamp
  // decide liveness at `digestInterval` resolution, and it keeps the message
  // small and the merge trivial.
  //
  // The same RPC carries the sender's scaling-input rollups (`rollups`,
  // docs/autoscaling.md "Scaling inputs") every 10 seconds, on a digest of
  // their own with no node ids, so the liveness digest itself stays as small
  // and as frequent as it was. Delta-encoded; the reply's `rollup_resync`
  // asks for a full set.
  //
  // ACL: manager-plane internal, authenticated by cluster secret metadata —
  // it is not a `Manager` RPC, so it takes no ACL row and
  // `tests/integration/acl_endpoints.rs::every_manager_rpc_is_classified` does not cover
  // it. See docs/node-liveness.md.
  rpc ReportNodeLiveness (NodeLivenessDigestRequest)
    returns (NodeLivenessDigestReply);

  // Hands the cluster's KV root key to an existing member that lacks it
  // (docs/kv-encryption.md).
  //
  // A joiner receives the root key in its `Join` reply, but a member that
  // was already in the cluster when KV encryption arrived (a rolling
  // upgrade to the first release with encryption) never joins again. Each
  // manager whose `file` provider has no key calls this on the control-lane
  // leader, then on the other members, until one answers with a bundle, and
  // writes the key to its own key file. Any member that holds the key
  // answers. A member without a key, or whose provider keeps the key to
  // itself (`exec`), answers with an empty bundle; the answering member
  // never mints a key for this call.
  //
  // The answer is sealed exactly like `JoinRaftClusterReply.root_key_bundle`
  // (AES-256-GCM under a key derived from the cluster secret, bound to the
  // cluster id). The caller must be a current member of the control lane.
  // An older manager answers `Unimplemented`; the caller retries on its next
  // keyring tick.
  //
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  // It is not a `Manager` RPC, so it takes no ACL row.
  rpc FetchRootKey (FetchRootKeyRequest) returns (FetchRootKeyReply);

  // Asks this manager to campaign for leadership of every raft group it
  // runs, now. The building block of `legion raft command transfer-leader`
  // and `step-down`: openraft 0.9 has no leader-transfer API, so the manager
  // the operator talks to asks the TARGET to start an election (the
  // equivalent of running `trigger-election` on the target), re-asking no
  // faster than one election timeout until the target leads the control
  // group or the command's deadline passes. The answer only says the
  // campaign started; the caller watches leadership itself.
  //
  // A campaign while the current leader is healthy is not free: voters
  // holding a live leader lease refuse it, and leadership moves once the
  // incumbent observes the higher term. Expect the term to rise by a few.
  //
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  // The operator-facing gate is `IssueRaftCommand` (`operator:write`); this
  // is not a `Manager` RPC, so it takes no ACL row. An older manager answers
  // `Unimplemented`, and the command reports that the target must be
  // upgraded.
  rpc TriggerElection (TriggerElectionRequest) returns (TriggerElectionReply);

  // Reads this manager's session index (docs/session-mode.md). Each manager
  // indexes the sessions of the nodes that heartbeat to it, so a manager
  // answering a GetInstance, ListInstances, or CreateInstance for a session
  // asks every peer and merges the answers. Read-only, and answered by
  // every member, leader or not.
  //
  // ACL: manager-plane internal, authenticated by cluster secret metadata.
  // It is not a `Manager` RPC, so it takes no ACL row; the calling manager
  // has already authorized its own caller.
  rpc QuerySessions (QuerySessionsRequest) returns (QuerySessionsReply);
}

// Request payload for RaftTransport.TriggerElection.
message TriggerElectionRequest {
  // The requesting manager's raft `nodeId`, recorded in the target's raft
  // history so the campaign is attributable.
  string requested_by = 1;

  // The actor the operator command named (`legion raft command --actor`),
  // for the same history entry. Empty means "api".
  string actor = 2;
}

// Reply payload for RaftTransport.TriggerElection.
message TriggerElectionReply {
  // The answering manager's raft `nodeId` — the one now campaigning.
  string node_id = 1;

  // Raft groups (lane wire names) on which the campaign was started.
  repeated string lanes = 2;
}

// Request payload for RaftTransport.QuerySessions. Exactly one of
// `session_id` and `job_id` is set.
message QuerySessionsRequest {
  // Every entry for this session id (normally one; two while a duplicate
  // converges).
  string session_id = 1;

  // Every session of this job, or of this job's `task_name` when set.
  string job_id = 2;
  string task_name = 3;

  // With `job_id`: return only per-node totals in `node_usage`, not the
  // sessions themselves. What the session router reads.
  bool usage_only = 4;

  // Every reported entry for each of these session ids, when
  // `session_id` is empty: the managers' batched duplicate sweep, which
  // asks its peers about all the derived ids newly reported to it once a
  // second in one call. Router starts not yet reported are not included.
  repeated string session_ids = 5;

  // With `job_id` (not `usage_only`): only sessions whose id sorts after
  // this one. With `limit`, a page of a listing.
  string after_session_id = 6;

  // With `job_id` (not `usage_only`): at most this many sessions, the
  // lowest ids first. 0 returns them all.
  uint32 limit = 7;
}

// Reply payload for RaftTransport.QuerySessions.
message QuerySessionsReply {
  // The matching sessions, with the node each runs on.
  repeated IndexedSession sessions = 1;

  // The nodes this manager holds a full session report for, and how long
  // ago each last reported. A node that moved between managers can be held
  // by two for a while; the caller takes the node's sessions from the
  // manager that heard from it last.
  repeated CoveredNode covered_nodes = 2;

  // With `usage_only`: per-node totals of the matching sessions.
  repeated NodeSessionUsage node_usage = 3;
}

// A node a manager's session index covers (`QuerySessionsReply`).
message CoveredNode {
  string node_id = 1;
  // Milliseconds since the node's last session report reached this manager.
  uint64 age_ms = 2;
}

// One session in a manager's session index.
message IndexedSession {
  string node_id = 1;
  SessionStatus status = 2;
  // Recorded by this manager's session router when it started the session,
  // and not yet in a report from the node. Stands in for the report for a
  // heartbeat or two, so a read right after a create finds the session.
  bool recent = 3;
}

// The sessions of one job (and task) on one node, totalled.
message NodeSessionUsage {
  string node_id = 1;
  uint32 sessions = 2;
  // Summed `resources`, as a JSON object of amounts.
  string resources = 3;
}

// Request payload for RaftTransport.FetchRootKey.
message FetchRootKeyRequest {
  // The calling manager's string identity (its raft `nodeId`). The answering
  // member refuses a caller whose derived raft id is not in the control
  // lane's membership.
  string node_id = 1;
}

// Reply payload for RaftTransport.FetchRootKey.
message FetchRootKeyReply {
  // The cluster id the bundle is bound to. The caller refuses a bundle for
  // any cluster but its own.
  string cluster_id = 1;

  // The root key material, sealed as in `JoinRaftClusterReply`. Empty when
  // the answering member has no exportable key (none yet, or `exec`). The
  // caller writes it to its key file only if that file does not exist yet.
  bytes root_key_bundle = 2;
}

// One manager's report of the nodes it is hearing from.
message NodeLivenessDigestRequest {
  // Sender's wire-protocol version, so a receiver can refuse a digest it
  // cannot interpret rather than silently dropping nodes from liveness.
  uint32 protocol_version = 1;

  // The reporting manager's string id ("host:port"). The leader keys its
  // per-peer staleness tracking on this, and raises
  // `legion_liveness_peer_stale{peer}` for it when the digests stop.
  string observer_manager_id = 2;

  // When the sender took this observation, unix milliseconds. Advisory: the
  // receiver times peer staleness on its OWN clock, because two managers'
  // wall clocks disagreeing must not turn into node loss.
  int64 observed_at_unix_ms = 3;

  // Every node this manager has received a heartbeat from since its last
  // digest. Authoritative for this peer: the leader REPLACES the peer's
  // previous claimed set, so a node that moved managers is not left attributed
  // to the old one.
  //
  // A digest that carries only `rollups` leaves this empty, and the leader
  // then leaves the peer's liveness state untouched: an empty list is not a
  // liveness observation.
  repeated string seen_node_ids = 4;

  // The sender's scaling-input rollups (docs/autoscaling.md, "Scaling
  // inputs"), sent every 10 seconds on a digest of their own. Unset on an
  // ordinary liveness digest.
  RollupSync rollups = 5;
}

// One manager's per-(node, task) usage and service-graph rollups, shipped to
// the status-lane leader on `ReportNodeLiveness` (docs/autoscaling.md,
// "Scaling inputs").
//
// Delta-encoded against what the leader already holds from this sender: a
// `full` sync replaces everything the sender contributed before, and a delta
// applies only on top of the sync numbered `base_seq` in the same `epoch`.
// When the leader cannot apply a delta (it just took the lane, restarted, or
// missed a sync), it drops it and answers `rollup_resync`, and the sender
// sends a full set at once.
message RollupSync {
  // The sender's rollup session: random, fixed for the life of the sending
  // process. A new epoch means the leader's state for this sender is void.
  uint64 epoch = 1;

  // This sync's number, increasing within an epoch.
  uint64 seq = 2;

  // The sync this delta builds on. Ignored when `full`.
  uint64 base_seq = 3;

  // True when `rollups` is the sender's complete set.
  bool full = 4;

  // Rollups added or changed since `base_seq` (or every rollup, when
  // `full`), plus `removed` entries for (node, task) pairs the sender no
  // longer reports.
  repeated TargetRollup rollups = 5;
}

// Usage and service-graph totals for one task on one node, as one manager
// saw them in its latest reports (docs/autoscaling.md, "Scaling inputs").
//
// The usage half sums the replicas of the task that run on the node. The
// request half sums what CALLERS on the node sent to the service the task
// backs, so a node can carry a request half for a task it runs no replica
// of. The leader keeps the newest rollup per (node, task), by
// `sampled_at_unix_ms`, whichever manager sent it.
message TargetRollup {
  // The node the totals were measured on.
  string node_id = 1;

  // The task: job id, group, and name.
  string job_id = 2;
  string task_group = 3;
  string task_name = 4;

  // The node's newest usage sample folded in, unix milliseconds on the
  // worker's clock; for a request-only rollup, when the sender folded the
  // window, on the sender's clock.
  int64 sampled_at_unix_ms = 5;

  // The sender no longer reports this (node, task): drop it, unless another
  // manager's newer rollup has replaced it. Every other field is empty.
  bool removed = 6;

  // Replicas of the task on the node with a usage sample.
  uint32 replicas = 7;

  // CPU sums over those replicas: measured millicores; measured MHz (the
  // node's `mhz_per_core` times millicores / 1000, 0 when the node reports
  // no clock); reserved MHz (`cores = N` counts as N x `mhz_per_core`).
  uint64 cpu_used_millicores = 8;
  double cpu_used_mhz = 9;
  double cpu_reserved_mhz = 10;

  // Used and reserved millicores over the replicas whose utilization can be
  // computed (`cores = N` reserves N x 1000), so the leader can divide sums
  // rather than average ratios.
  uint64 cpu_util_used_millicores = 11;
  double cpu_util_reserved_millicores = 12;

  // The busiest replica's utilization, and the per-replica histogram over
  // `ScalingCpuInputs.histogram_bounds` (one more bucket than bounds).
  double cpu_utilization_max = 13;
  repeated uint32 cpu_utilization_histogram = 14;

  // Replicas whose utilization cannot be computed.
  uint32 cpu_unmeasurable = 15;

  // Memory sums: current bytes, reserved MiB; and the largest single
  // replica's current memory against its reservation.
  uint64 memory_used_bytes = 16;
  double memory_reserved_mib = 17;
  double memory_utilization_max = 18;

  // Requests into the task's service from callers on this node over
  // `edge_window_ms`: attempts that reached an endpoint, failures, and the
  // latency sum and max (HTTP). All 0, with a 0 window, when no caller on the
  // node reached the service.
  uint64 edge_requests = 19;
  uint64 edge_errors = 20;
  uint64 edge_latency_ms_sum = 21;
  uint64 edge_latency_ms_max = 22;
  uint32 edge_window_ms = 23;
}

// Reply payload for RaftTransport.ReportNodeLiveness.
message NodeLivenessDigestReply {
  // True when the receiver leads the status lane and merged the digest.
  bool accepted = 1;

  // True when the receiver does NOT lead the status lane. The sender re-targets
  // using `leader_hint`, exactly as ForwardLaneWrite callers do; until it
  // does, its nodes are covered by the previous leader's `peerDigestGrace`.
  bool not_status_leader = 2;

  // The receiver's own view of who leads the status lane, as "host:port".
  // Empty when it does not know (mid-election).
  string leader_hint = 3;

  // The heartbeat interval, in seconds, the status-lane leader is serving its
  // workers. Set only on an accepted digest from a leader running adaptive
  // cadence (the default). The sender serves the same value on its own
  // heartbeat replies, so every worker gets one cadence whichever manager it
  // talks to. Absent when the leader has adaptive cadence off or predates
  // this field, and the sender then serves no interval either.
  optional uint32 served_interval_seconds = 4;

  // Set on an accepted digest whose `rollups` the leader could not apply: it
  // holds no state for this sender (it just took the status lane or
  // restarted), the epoch changed, or `base_seq` is not the last sync it
  // applied. The sender answers with a full sync.
  bool rollup_resync = 5;
}

// Request envelope for the three openraft protocol RPCs (AppendEntries,
// Vote, InstallSnapshot).
message RaftLaneRequest {
  // Raft group ("lane") wire name: "control", "scheduler", or "status".
  // Must name a group that is active on the receiving node.
  string group_id = 1;

  // Opaque serde_json-encoded openraft request message. The concrete type
  // depends on the RPC (see the service comments); the encoding is the
  // openraft 0.9 serde representation, internal to the manager plane and
  // versioned by PROTOCOL_VERSION. Binary fields inside it (the changeset
  // in an entry, an install-snapshot chunk) are base64 strings, not JSON
  // number arrays — see `storage::raft::types::wire_bytes`.
  bytes payload = 2;
}

// Reply envelope for the three openraft protocol RPCs.
message RaftLaneReply {
  // Opaque serde_json-encoded `Result<Reply, RaftError>` (see the service
  // comments for the concrete type per RPC). Application-level raft errors
  // travel here; gRPC status codes are reserved for transport/auth/dispatch
  // failures (unreachable group, bad secret, undecodable payload).
  bytes payload = 1;
}

// Request payload for RaftTransport.Join.
message JoinRaftClusterRequest {
  // The signed join token minted by `legion raft join-token` on the leader.
  // Carries cluster id, leader advertise address, and the cluster secret;
  // the leader re-validates it here so a leaked advertise address alone is
  // not enough to join.
  string join_token = 1;

  // The joining manager's string identity (its manager node id/name). The
  // raft node id used in membership is derived from this deterministically:
  // `fnv1a64(node_id)`.
  string node_id = 2;

  // "host:port" the cluster should dial to reach the joining manager's gRPC
  // listener (the RaftTransport service shares the manager's tonic
  // listener).
  string advertise_addr = 3;

  // The joiner's configured raft topology ("single" or "lanes"), so the
  // leader can refuse a mixed-topology cluster at enrollment (plan JC-43).
  // A joiner configured differently would enroll into groups it does not
  // run (or run groups nobody replicates to), which is unrecoverable once
  // its log advances. Empty means a pre-JC-43 manager, which is only ever
  // "single".
  string topology = 4;
}

// Reply payload for RaftTransport.Join.
message JoinRaftClusterReply {
  // The raft node id assigned to the joiner: `fnv1a64(request.node_id)`.
  // Deterministic, so re-joins and restarts always map to the same id.
  uint64 assigned_raft_id = 1;

  // The cluster id this membership belongs to (from the join token).
  string cluster_id = 2;

  // Current membership of every active raft group, so the joiner can seed
  // its peer table before its first snapshot install.
  repeated RaftGroupMembership groups = 3;

  // The cluster's KV root key material for the joiner (docs/kv-encryption.md),
  // so "join the cluster" is one command on a cluster whose root key lives
  // in a file: AES-256-GCM under a key derived (HKDF-SHA256) from the
  // cluster secret, bound to the cluster id. Empty when the leader's
  // provider does not export material (`exec` — a KMS-held key never
  // leaves the KMS) or has none. The joiner writes it to its own key file
  // only if that file does not exist yet, never overwriting one.
  bytes root_key_bundle = 4;
}

// Membership of one raft group ("lane").
message RaftGroupMembership {
  // Lane wire name: "control", "scheduler", or "status".
  string group_id = 1;

  // All members currently known to this group (voters and learners).
  repeated RaftMemberInfo members = 2;
}

// One raft group member.
message RaftMemberInfo {
  // The member's raft node id (`fnv1a64` of its manager string id).
  uint64 raft_id = 1;

  // The member's manager string id (decoded from the "name@host:port"
  // openraft BasicNode address — see `src/storage/raft/types.rs`).
  string node_id = 2;

  // "host:port" of the member's gRPC listener.
  string advertise_addr = 3;

  // True for voters, false for learners still catching up.
  bool voter = 4;
}

// ---------------------------------------------------------------------------
// Network policy (docs/network-handlers.md)
// ---------------------------------------------------------------------------

// A stored network policy object.
message NetPolicy {
  // Unique name; letters, digits, '-', '_', '.'.
  string name = 1;

  // Merge priority: higher applies first among `require` policies and wins
  // among `default` ones.
  int64 priority = 2;

  // `require` or `default`.
  string enforcement = 3;

  // The whole object as canonical JSON (a `NetPolicyObject`): selector,
  // enforcement, optional mode, egress, ingress, description. Normalized —
  // `allow` sugar is already expanded into rules.
  string object_json = 4;

  // Free-form description from the object.
  string description = 5;

  string created_at = 6;
  string updated_at = 7;
}

// Request payload for UpsertNetPolicy.
message UpsertNetPolicyRequest {
  // A `NetPolicyObject` as JSON, exactly as `legion net policy apply -f`
  // reads it (Nickel evaluated to JSON). Validated on write.
  string object_json = 1;

  // When set, validate and report which running allocations would be
  // affected, but write nothing.
  bool dry_run = 2;
}

// Reply payload for UpsertNetPolicy.
message UpsertNetPolicyReply {
  // The stored (normalized) policy. On a dry run, what would be stored.
  NetPolicy policy = 1;

  // Running allocations whose effective policy would change, as
  // `job/task@allocation` strings. Populated on dry runs and on writes.
  repeated string affected_allocations = 2;

  // Advisory lines about what the policy would do to running work, one per
  // affected task, populated on dry runs and on writes. Today: an upstream
  // whose `to` does not speak HTTP (a bare service name, `tcp://`, or
  // `tls://`) under an HTTP chain whose first rule for it needs a path,
  // method, or header. A policy never changes how a stream is parsed, so
  // such connections are refused at connect; the line names the task, the
  // upstream, and the rule, and says how to fix it.
  repeated string warnings = 3;
}

// Request payload for GetNetPolicyObject.
message GetNetPolicyObjectRequest {
  string name = 1;
}

// Reply payload for GetNetPolicyObject.
message GetNetPolicyObjectReply {
  NetPolicy policy = 1;
}

// Request payload for ListNetPolicies.
message ListNetPoliciesRequest {}

// Reply payload for ListNetPolicies.
message ListNetPoliciesReply {
  repeated NetPolicy policies = 1;

  // Monotonic generation of the policy set; changes on every write.
  uint64 generation = 2;
}

// Request payload for DeleteNetPolicy.
message DeleteNetPolicyRequest {
  string name = 1;
}

// Reply payload for DeleteNetPolicy.
message DeleteNetPolicyReply {}

// A stored network plugin object (docs/network-plugins.md).
message NetPlugin {
  // Unique name; what a `{ plugin = { name = ... } }` hop references.
  string name = 1;

  // The normalized `NetPluginObject` as JSON: `module`, `stages`,
  // `usableBy`, `nodePools`, `limits`, `configSchema`, `targets`, and
  // `credentials` (KV paths only, never values).
  string object_json = 2;

  // The cluster-wide plugin generation this version was written at. A
  // revision names one version of one plugin forever, even across a delete
  // and a re-create; nodes report the revision they run.
  uint64 revision = 3;

  // RFC 3339 timestamps of the first write and of this version.
  string created_at = 4;
  string updated_at = 5;

  // The stages the module acts at, in pipeline order: `connect`,
  // `request`, `body`, `response`, `done`.
  repeated string stages = 6;

  // `policies` or `jobs`.
  string usable_by = 7;

  // The module's `sha256:` checksum.
  string module_checksum = 8;

  // Stored policy objects whose chains reference this plugin. Filled by
  // GetNetPlugin and GetNetPluginStatus; empty in list replies.
  repeated string referenced_by = 9;
}

// Request payload for UpsertNetPlugin.
message UpsertNetPluginRequest {
  // A `NetPluginObject` as JSON, exactly as `legion net plugin apply -f`
  // reads it (Nickel evaluated to JSON). Validated on write.
  string object_json = 1;

  // When set, validate (including every referencing policy's config against
  // the new schema) and report what would be stored, but write nothing.
  bool dry_run = 2;

  // Optional: retries with the same key (from the same caller) return the
  // first call's stored plugin with `deduplicated = true` instead of writing
  // a new revision. Ignored on dry runs.
  optional string idempotency_key = 3;
}

// Reply payload for UpsertNetPlugin.
message UpsertNetPluginReply {
  // The stored (normalized) plugin. On a dry run, what would be stored,
  // with `revision` 0.
  NetPlugin plugin = 1;

  // True when `idempotency_key` matched an earlier call; nothing was
  // written and `plugin` is that call's result as currently stored.
  bool deduplicated = 2;
}

// Request payload for GetNetPlugin.
message GetNetPluginRequest {
  string name = 1;
}

// Reply payload for GetNetPlugin.
message GetNetPluginReply {
  NetPlugin plugin = 1;
}

// Request payload for ListNetPlugins.
message ListNetPluginsRequest {}

// Reply payload for ListNetPlugins.
message ListNetPluginsReply {
  repeated NetPlugin plugins = 1;

  // Monotonic generation of the plugin set; changes on every write.
  uint64 generation = 2;
}

// Request payload for DeleteNetPlugin.
message DeleteNetPluginRequest {
  string name = 1;
}

// Reply payload for DeleteNetPlugin.
message DeleteNetPluginReply {}

// Request payload for GetNetPluginStatus.
message GetNetPluginStatusRequest {
  string name = 1;
}

// Reply payload for GetNetPluginStatus.
message GetNetPluginStatusReply {
  // The stored object, with `referenced_by` filled.
  NetPlugin plugin = 1;

  // One entry per node that holds the plugin, from its last heartbeat. A
  // plugin no running allocation uses is on no node.
  repeated NetPluginNodeStatus nodes = 2;
}

// One node's view of one plugin, reported on every heartbeat
// (`HeartbeatRequest.net_plugins`) and read back by GetNetPluginStatus,
// `legion net plugin status`, and `legion net doctor`.
message NetPluginNodeStatus {
  // The reporting node. Empty on the heartbeat (the node is the caller);
  // filled by the manager in GetNetPluginStatus.
  string node_id = 1;

  // The plugin's name.
  string plugin = 2;

  // The revision the node holds; 0 before the object reached it.
  uint64 revision = 3;

  // The module checksum the node runs (`sha256:<hex>`).
  string module_checksum = 4;

  // `fetching` (the object arrived, the module is being fetched or
  // compiled), `ready`, or `failed` (see `error`).
  string state = 5;

  // Why the module is not ready: the fetch, checksum, compile, or
  // instantiation error. A hop whose plugin is not ready fails with this
  // reason and follows its `onError`.
  string error = 6;

  // Callbacks run and callbacks that failed (trap, fuel or deadline
  // exhausted, memory limit) since the worker started.
  uint64 calls = 7;
  uint64 errors = 8;

  // The last callback failure, if any.
  string last_error = 9;

  // 99th percentile callback time over the last 1024 callbacks, in
  // microseconds.
  uint64 p99_micros = 10;

  // Live module instances on the node: one per (scope, config) the plugin
  // runs under, times the instances its concurrency needed.
  uint64 instances = 11;
}

// Request payload for ShowNetPolicy.
message ShowNetPolicyRequest {
  // Job id.
  string job_id = 1;

  // Task name; when empty and the job has one task, that task.
  string task_name = 2;

  // Node pool to match selectors against; empty means "any pool" (pool
  // selectors are treated as matching).
  string node_pool = 3;
}

// Reply payload for ShowNetPolicy.
message ShowNetPolicyReply {
  // The merged `EffectivePolicy` as JSON: `mode`, `egress`, `ingress`, each
  // rule and handler carrying `source` (`policy/<name>#<index>` or
  // `task#<index>`), the ordered `sources`, and the content `hash`.
  string effective_json = 1;

  // Names of the stored policies that matched, in application order.
  repeated string matched_policies = 2;

  // The task's declared `network.mode`, and the mode it resolves to: the one
  // a matching `require` policy imposes, else the declared one with `auto`
  // resolved for the task's runtime (assuming a microVM node for a sandbox;
  // each allocation's node status carries the mode it actually runs in).
  string declared_mode = 3;
  string effective_mode = 4;

  // The node datapath's last-reported status for this task's allocations
  // (one entry per running allocation; empty when none has reported), as
  // JSON `NetAllocStatus` objects. Best effort and at most one heartbeat
  // stale.
  repeated string node_status_json = 5;

  // Notes about how the task's network is actually enforced, beyond its
  // mode, printed by `legion net doctor` as warnings. Today:
  // `egress-unenforced: ...` for a sandbox that runs without Legion's
  // egress policy only because its node is a dev backend (Apple
  // `container`, a Linux OCI runtime) with no vsock to the datapath. Empty
  // in the common case.
  repeated string notes = 6;
}

// Request payload for TestNetPolicy.
message TestNetPolicyRequest {
  string job_id = 1;
  string task_name = 2;
  string node_pool = 3;

  // Egress test: a destination as `host[:port]`, an IP, or a URL
  // (`https://api.github.com/user` sets host, port, and path).
  string to = 4;

  // Ingress test: the peer, as `host[:port]` / IP.
  string from = 5;

  // Ingress test: the caller's verified workload identity,
  // `<region>:<job>:<group>:<task>` (`global:checkout:web:web`), as the mesh
  // port or a mutual port would see it. On a `service.mesh = true` service
  // with a closed `service.allow`, an identity outside the list is denied
  // by `service/allow` before any rule.
  string identity = 6;

  // Request-time facts for HTTP chains. Optional.
  string method = 7;
  string path = 8;
}

// Reply payload for TestNetPolicy.
message TestNetPolicyReply {
  // `allow`, `deny`, or `defer` (a request-time rule would decide and no
  // method/path was given).
  string verdict = 1;

  // The rule that decided (`policy/<name>#<index>`, `task#<index>`, or
  // `fallthrough`); empty on allow-by-absence. `gated-default` when the task
  // runs gated and no task block or policy object covers its egress at all:
  // gated denies everything nothing allows. `host-guard` for an egress
  // target the host guard refuses, which is answered before any policy: the
  // manager resolves the name and judges the built-in classes (loopback,
  // link-local, cloud metadata). A node's own addresses and its `hostGuard`
  // overrides are judged on the worker only.
  string source = 2;

  // The rule's `reason`, if any.
  string reason = 3;

  // Which direction was tested and which protocol the chain runs.
  string direction = 4;
  string protocol = 5;

  // Human-readable one-line explanation.
  string explanation = 6;

  // How to change the verdict, when there is an obvious fix. Set for a
  // `gated-default` denial: allow the destination in the task's
  // `network.egress.allow`, or apply a policy object. Set for a `host-guard`
  // denial: the guard is changed on the worker (`hostGuard.allow`), not in
  // job policy. Empty otherwise.
  string hint = 7;
}

// One allocation's effective policy, by hash.
message AllocNetPolicy {
  int64 allocation_id = 1;

  // sha256 of the canonical merged policy JSON.
  string policy_hash = 2;
}

// One denial (or run of identical denials) reported by a node datapath.
message NetDenial {
  int64 allocation_id = 1;
  string job_id = 2;
  string task_name = 3;

  // `egress` or `ingress`.
  string direction = 4;

  // `host:port` (egress destination or ingress peer).
  string destination = 5;

  // What denied. A rule: `policy/<name>#<index>`, `task#<index>`, or
  // `fallthrough`. Or a layer below policy: `host-guard` (the destination,
  // or every address its name resolved to, is loopback, this node, link-local
  // / cloud metadata, or in the worker's `hostGuard.deny`; no policy can
  // allow it), `gate` (the edge-boot gate is shut), or `policy-pending` (a
  // gated allocation whose policy has not arrived).
  string source = 6;

  // The rule's reason, if any. For `host-guard`, the address and its class,
  // e.g. `169.254.169.254 is link-local (cloud metadata); allocations may not
  // reach it`, or `<name> resolves to <ip> (<class>); ...` for a hostname.
  string reason = 7;

  // `tcp`, `http`, or `dns`.
  string protocol = 8;

  // Verified peer identity, when known.
  string identity = 9;

  // Number of identical denials folded into this entry.
  uint32 count = 10;

  // The task's `network.labels`, for attribution.
  map<string, string> labels = 11;

  // HTTP mode: the method and path denied, when a request-time rule decided.
  string method = 12;
  string path = 13;
}

// The node datapath's status for one allocation, reported on the heartbeat.
message NetAllocStatus {
  int64 allocation_id = 1;

  // Effective `network.mode` the allocation runs in (`host` or `gated`).
  string mode = 2;

  // `gated` only: the namespace exists and every listener inside it is bound
  // (upstream ports, VIPs, resolver, egress proxy). A gated allocation whose
  // capture is not ready has no network.
  bool capture_ready = 3;

  // The policy hash the datapath is enforcing; empty while pending.
  string policy_hash = 4;

  // Upstream keys whose listener is bound.
  repeated string upstreams_bound = 5;

  // Port labels whose ingress listener is bound on the advertised port.
  repeated string ingress_bound = 6;

  // Whether the allocation's resolver is serving.
  bool resolver_ready = 7;

  // Whether the egress proxy is serving (gated only).
  bool proxy_ready = 8;

  // Whether the edge-boot gate is currently shut for this allocation.
  bool gate_shut = 9;

  // Human-readable problems the datapath has with this allocation, e.g.
  // "port 8080 ingress listener: address in use".
  repeated string problems = 10;

  // Every external handler hop on the allocation's effective chains and
  // upstreams (`authz`, `proxy`), with the health the datapath has observed.
  repeated NetHandlerStatus handlers = 11;

  // Whether the TLS material of every port that terminates TLS is loaded:
  // a port's own `tls` (its KV-held certificate and client CA have arrived,
  // or its files parse), or, for the service's mesh port, the node's mesh
  // certificate. Always true when no port terminates TLS.
  bool tls_ready = 12;

  // Why `tls_ready` is false, when it is.
  string tls_error = 13;

  // Whether this node currently holds a mesh certificate.
  bool mesh_identity = 14;

  // A TAP-wired `sandbox`'s guest address, leased from its bridge's pool
  // (`sandbox.bridges.<bridge>` in the worker config) at boot and on every
  // restore and fork. Empty for every other allocation. The manager surfaces
  // it as `InstanceInfo.guest_address`. A TAP sandbox is reported here even
  // when it declares no ports, upstreams, or VIPs, with `mode = "host"`.
  string guest_address = 15;

  // The bridge `guest_address` belongs to. Empty exactly when it is.
  string guest_bridge = 16;

  // The kernel classifier's view of the allocation, on a node whose
  // `netKernel` attribute is active (docs/network-handlers.md, "The kernel
  // classifier"). Absent elsewhere, and for an allocation whose cgroup leaf
  // does not exist yet.
  optional NetKernelStatus kernel = 17;
}

// What the kernel classifier holds for one allocation, and what it did with
// the allocation's flows since the previous report.
message NetKernelStatus {
  // The allocation's cgroup leaf is described to the classifier: the host
  // guard applies, and its port-53 traffic goes to its resolver.
  bool attached = 1;

  // Its egress chain is compiled into the kernel and enforced at
  // `connect()`: denied flows fail with `EPERM`, and allowed flows that
  // nothing reads connect directly. False for a gated allocation (its
  // namespace is the boundary), a sandbox (its sockets live in its guest),
  // an allocation with no egress chain, and a chain the kernel cannot hold
  // (`reason`).
  bool enforced = 2;

  // Flows only netd can decide (a request-time rule, a host rule for an
  // address the resolver never returned, a chain with hops) are redirected
  // to a capture listener rather than refused.
  bool capture = 3;

  // Compiled connect-time rules.
  uint32 rules = 4;

  // Why the chain is not enforced in the kernel, when it is not. Empty
  // otherwise.
  string reason = 5;

  // Connections passed straight through (no proxy hop) since the previous
  // report.
  uint64 passed = 6;

  // Connections redirected to the capture listener since the previous
  // report.
  uint64 redirected = 7;

  // Connections refused in the kernel since the previous report.
  uint64 denied = 8;
}

// One external handler hop as the datapath sees it.
message NetHandlerStatus {
  // Where the hop came from: `policy/<name>#<index>`, `task#<index>`, or
  // `upstream/<key>#<index>`.
  string source = 1;

  // The handler kind: `authz`, `proxy`, `dlp`, or `plugin`.
  string handler = 2;

  // The webhook URL, or the resolved proxy target (`service`, `node`, or
  // `port` label) and how many endpoints it currently has.
  string target = 3;

  // False once the last call failed (timeout, connection refused, bad
  // reply) or the proxy target has no endpoint. A chain fails closed on an
  // unhealthy hop unless the hop says `onError = "allow"`.
  bool healthy = 4;

  // The last failure, if any.
  string last_error = 5;

  // Calls and failures since the worker started.
  uint64 calls = 6;
  uint64 errors = 7;
}

// ---------------------------------------------------------------------------
// Namespaces (docs/namespaces.md)
// ---------------------------------------------------------------------------

// A namespace: the name scope, permission scope and policy anchor jobs live
// in. NOT an isolation boundary — it moves no workload onto other machines,
// networks or kernels (node pools, `gated` networking and the `sandbox`
// runtime do that). See docs/namespaces.md, "What a namespace isolates".
message Namespace {
  // DNS-label name: lowercase letters, digits and `-`, at most 63
  // characters. Immutable; `default` always exists.
  string name = 1;

  // Free-form description.
  string description = 2;

  // Free-form metadata (`owner`, `slack`, ...). Legion never reads it.
  map<string, string> meta = 3;

  // RFC3339 creation time. Empty on a dry-run reply for a new namespace.
  string created_at = 4;

  // RFC3339 time of the last description/meta change.
  string updated_at = 5;

  // What the namespace holds, by kind. Populated by ListNamespaces and
  // GetNamespace.
  NamespaceCounts counts = 6;
}

// Object counts in a namespace, by kind.
message NamespaceCounts {
  // Jobs in any state (stopped and failed included).
  uint32 jobs = 1;

  // Volumes owned by a job in the namespace.
  uint32 volumes = 2;

  // Snapshots of a job in the namespace.
  uint32 snapshots = 3;
}

// What a namespace holds, by id.
message NamespaceContents {
  // Canonical job ids (`ns/name`).
  repeated string jobs = 1;

  // Volume ids.
  repeated string volumes = 2;

  // Snapshot ids.
  repeated string snapshots = 3;
}

// One ACL policy rule that reaches a namespace: an allow rule over a
// namespaced resource whose `namespaces` selector matches it (or a `*`
// resource rule with no selector). The blast-radius report shown when a
// namespace is created.
message NamespaceReach {
  // ACL policy name.
  string policy = 1;

  // Index of the rule inside the policy.
  uint32 rule_index = 2;

  // `resource:action` pairs the rule grants, e.g. `job:read`, `job:write`.
  repeated string grants = 3;

  // The rule's `namespaces` selector as written; empty for a `*` resource
  // rule without one (which reaches every namespace).
  repeated string namespaces = 4;
}

// Request payload for ListNamespaces.
message ListNamespacesRequest {}

// Reply payload for ListNamespaces.
message ListNamespacesReply {
  // Namespaces the caller can see, by name.
  repeated Namespace namespaces = 1;
}

// Request payload for GetNamespace.
message GetNamespaceRequest {
  string name = 1;
}

// Reply payload for GetNamespace.
message GetNamespaceReply {
  Namespace namespace = 1;

  // The ACL policy rules that reach this namespace. Only filled for callers
  // holding `acl:read` (it names policies); empty otherwise.
  repeated NamespaceReach reaching_rules = 2;

  // What the namespace's jobs are charged, per band (see `BandUsage`): the
  // figure every quota governing it is checked against.
  repeated BandUsage usage = 3;

  // The namespace policies governing it, each with the aggregate it is
  // checked against. Shown to any caller with `namespace:read`, so a tenant
  // sees its effective limits without `acl:read`.
  repeated NamespacePolicyStatus policies = 4;
}

// Request payload for ApplyNamespace.
message ApplyNamespaceRequest {
  // The namespace to create or update. `created_at`, `updated_at` and
  // `counts` are ignored.
  Namespace namespace = 1;

  // When set, validate and report the policies that would reach it, but
  // write nothing.
  bool dry_run = 2;
}

// Reply payload for ApplyNamespace.
message ApplyNamespaceReply {
  // The stored namespace; on a dry run, what would be stored.
  Namespace namespace = 1;

  // True when this call created the namespace (or, on a dry run, would).
  bool created = 2;

  // The ACL policy rules that reach the namespace — on creation, the
  // grants that take effect the moment it exists, including through
  // selectors like `["*"]` written long before. Only filled for callers
  // holding `acl:read`.
  repeated NamespaceReach reaching_rules = 3;
}

// Request payload for DeleteNamespace.
message DeleteNamespaceRequest {
  string name = 1;

  // Stop and destroy everything in the namespace first, then delete it.
  bool cascade = 2;

  // Report what would be deleted (and, for a non-empty namespace without
  // `cascade`, why it would be refused) without changing anything.
  bool dry_run = 3;

  // Optional idempotency key; see RunJobRequest.idempotency_key.
  optional string idempotency_key = 4;
}

// Reply payload for DeleteNamespace.
message DeleteNamespaceReply {
  // True when the namespace was deleted (false on a dry run).
  bool deleted = 1;

  // On a dry run, what the namespace holds; after a cascade, what was
  // removed.
  NamespaceContents contents = 2;

  // Human-readable cascade steps, in order (`Stopped payments-old/web`).
  repeated string steps = 3;

  // True when this reply was replayed from an earlier request with the same
  // `idempotency_key`.
  bool deduplicated = 4;
}

// One priority band's charged reservations (docs/namespaces.md, "How quota
// is charged"): per job, the larger of what its spec declares (effective
// count times reservation, for count-driven tasks) and what its live
// allocations reserve, summed.
message BandUsage {
  // `critical`, `high`, `elevated`, `normal`, `low` or `background`.
  string band = 1;

  // CPU in MHz.
  double cpu = 2;

  // Memory in MiB.
  double memory = 3;

  // Exclusive cores.
  double cores = 4;

  // Live allocations (not `complete` or `failed`) in the band.
  uint64 allocations = 5;
}

// A namespace policy as stored.
message NamespacePolicy {
  // Unique name: letters, digits, `-`, `_` and `.`.
  string name = 1;

  // The namespace globs the policy governs, as stored (sorted).
  repeated string namespaces = 2;

  // The whole object as normalized JSON, exactly as `legion namespace
  // policy apply -f` reads it: `name`, `description`, `namespaces`,
  // `quota` (band -> `{ cpu (MHz), memory (MiB), cores }`), `maxJobs`,
  // `maxNamespaces`, `pools { allowed, default }`, `runtimes`,
  // `hostVolumes`. An unset allowlist allows everything; an empty one
  // allows nothing. Memory written as a size (`"128Gi"`) is stored as MiB.
  string object_json = 3;

  // Free-form description from the object.
  string description = 4;

  // RFC3339 creation and last-update times. Empty on a dry run of a new
  // policy.
  string created_at = 5;
  string updated_at = 6;
}

// One policy governing a namespace, with the aggregate it is checked
// against: summed over every namespace the policy matches, which may
// include namespaces the caller cannot read (only totals are shown).
message NamespacePolicyStatus {
  NamespacePolicy policy = 1;

  // Charged usage per band across every matching namespace.
  repeated BandUsage usage = 2;

  // Jobs across every matching namespace (the `maxJobs` figure).
  uint64 jobs = 3;

  // Namespaces the policy matches (the `maxNamespaces` figure).
  uint64 namespaces = 4;
}

// Request payload for ListNamespacePolicies.
message ListNamespacePoliciesRequest {}

// Reply payload for ListNamespacePolicies.
message ListNamespacePoliciesReply {
  // Every policy, by name.
  repeated NamespacePolicy policies = 1;
}

// Request payload for GetNamespacePolicy.
message GetNamespacePolicyRequest {
  // The policy name.
  string name = 1;
}

// Reply payload for GetNamespacePolicy.
message GetNamespacePolicyReply {
  // The policy with its aggregate usage.
  NamespacePolicyStatus status = 1;

  // Charged usage of each existing namespace the policy matches, by name:
  // the breakdown of `status.usage`.
  map<string, NamespaceBandUsages> by_namespace = 2;
}

// A list of band usages, for map values.
message NamespaceBandUsages {
  repeated BandUsage usage = 1;
}

// Request payload for ApplyNamespacePolicy.
message ApplyNamespacePolicyRequest {
  // The policy object as JSON (Nickel evaluated to JSON by the CLI). See
  // `NamespacePolicy.object_json` for the fields.
  string object_json = 1;

  // When set, validate and report `violations` without writing.
  bool dry_run = 2;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 3;

  // Apply even when the policy's `autoscale` would leave some autoscaled
  // task's effective policy invalid (docs/autoscaling.md). Without it such
  // an apply is refused with FAILED_PRECONDITION naming the tasks; with it
  // those tasks' policies are held `invalid` until fixed.
  bool force = 4;
}

// One thing a policy would have refused, reported by a dry run.
message NamespacePolicyViolation {
  // The namespace it concerns.
  string namespace = 1;

  // The job it concerns; empty for a count (`maxJobs`, `maxNamespaces`) or
  // quota total.
  string job_id = 2;

  // Which rule: `runtimes`, `pools`, `hostVolumes`, `quota`, `maxJobs`,
  // `maxNamespaces`, or `autoscale` (an autoscaled task whose effective
  // policy would no longer resolve).
  string rule = 3;

  // The refusal message admission would have returned.
  string message = 4;
}

// Reply payload for ApplyNamespacePolicy.
message ApplyNamespacePolicyReply {
  // The stored policy; on a dry run, what would be stored.
  NamespacePolicy policy = 1;

  // True when this call created the policy (or, on a dry run, would).
  bool created = 2;

  // On a dry run, what the policy would have refused among existing jobs
  // and counts. Always empty on a write.
  repeated NamespacePolicyViolation violations = 3;

  // True when this reply was replayed from an earlier request with the same
  // `idempotency_key`.
  bool deduplicated = 4;
}

// Request payload for DeleteNamespacePolicy.
message DeleteNamespacePolicyRequest {
  // The policy name.
  string name = 1;

  // Optional idempotency key. See `RunJobRequest.idempotency_key`.
  optional string idempotency_key = 2;
}

// Reply payload for DeleteNamespacePolicy.
message DeleteNamespacePolicyReply {
  // True when the policy was deleted.
  bool deleted = 1;

  // True when this reply was replayed from an earlier request with the same
  // `idempotency_key`.
  bool deduplicated = 2;
}
