name: CI

on:
  pull_request:

# Grant the read scopes the workflow needs. `pull-requests: read` is required by
# dorny/paths-filter, which calls the PR "list files" API on pull_request events;
# without it the Scheduler Benchmark Gate fails with
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-test:
    name: Cargo Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # `cargo test --all` links ~29 test binaries, and at full debuginfo the
      # target dir reaches ~23 GiB — more than the ~14 GiB an ubuntu-latest
      # runner has free. The job then dies mid-link with
      # `ld terminated with signal 7 [Bus error]`, or the runner disappears
      # outright (step stuck `in_progress`, logs 404). Dropping debuginfo takes
      # the same tree to ~3.5 GiB and links faster; only backtrace detail is
      # lost, never test behavior. Use `line-tables-only` instead of `0` if
      # file/line in panic backtraces is worth the extra size.
      - name: Run cargo tests
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --all --locked

  cargo-clippy:
    name: Cargo Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run cargo clippy
        run: cargo clippy --all --locked -- -D warnings -A dead_code -A unused_variables

  scheduler-benchmark-gate:
    name: Scheduler Benchmark Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect scheduler-impacting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scheduler:
              - 'src/manager/scheduler.rs'
              - 'src/storage/store.rs'
              - 'src/manager/daemon.rs'
              - 'benchmarks/scheduler/**'
              - 'tests/scheduler_benchmark_slo.rs'

      - name: Install Rust toolchain
        if: steps.changes.outputs.scheduler == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        if: steps.changes.outputs.scheduler == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run scheduler benchmark SLO gate
        if: steps.changes.outputs.scheduler == 'true'
        run: cargo test --test scheduler_benchmark_slo -- --ignored --nocapture
