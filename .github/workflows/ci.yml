name: CI

on:
  pull_request:

# dorny/paths-filter calls the PR list-files API, which needs pull-requests
# read access when the default workflow token is restricted.
permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-test:
    name: Cargo Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run cargo tests
        run: cargo test --all --locked

  cargo-clippy:
    name: Cargo Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run cargo clippy
        run: cargo clippy --all --locked -- -D warnings -A dead_code -A unused_variables

  scheduler-benchmark-gate:
    name: Scheduler Benchmark Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect scheduler-impacting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scheduler:
              - 'src/manager/scheduler.rs'
              - 'src/storage/store.rs'
              - 'src/manager/daemon.rs'
              - 'benchmarks/scheduler/**'
              - 'tests/scheduler_benchmark_slo.rs'

      - name: Install Rust toolchain
        if: steps.changes.outputs.scheduler == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        if: steps.changes.outputs.scheduler == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run scheduler benchmark SLO gate
        if: steps.changes.outputs.scheduler == 'true'
        run: cargo test --test scheduler_benchmark_slo -- --ignored --nocapture
