name: CI

on:
  pull_request:
  # Pushes to main run only the Rust jobs. Their job is to save the dependency
  # cache: Actions caches written on a PR ref are visible to that PR alone,
  # while main's are visible to every PR, so without these runs each new PR
  # starts cold and rebuilds ~520 crates.
  push:
    branches: [main]

# A new push to a PR supersedes the run in progress for it. Runs on main are
# never cancelled, so each merge finishes and saves its cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Grant the read scopes the workflow needs. `pull-requests: read` is required by
# dorny/paths-filter, which calls the PR "list files" API on pull_request events;
# without it the Scheduler Benchmark Gate fails with
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-test:
    name: Cargo Test
    # Pinned rather than ubuntu-latest: rusqlite's `session` feature runs
    # bindgen against the runner's libclang, and the newer ubuntu-latest
    # image's libclang makes bindgen 0.69 emit empty SQLite structs.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        uses: ./.github/actions/setup-protoc

      # Dependencies only: Legion's own crates are always rebuilt. Saved from
      # main alone (see `push` above) so PR runs cannot evict main's entry
      # from the repo's 10 GB cache budget. The scheduler benchmark gate
      # reads the same entry through `shared-key`.
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Debuginfo size comes from `[profile.dev]` in Cargo.toml (line tables
      # for Legion's crates, none for dependencies), which keeps the target
      # dir well inside the runner's ~14 GiB of free disk. Integration tests
      # link as a few binaries rather than one per file
      # (docs/testing-and-benchmarks.md, "Test Layout").
      # --all-features so the `loadgen` feature's bin (benchmarks/loadgen,
      # the AWS rig's native job submitter) is built and its unit tests run.
      # It is feature-gated to keep it out of ordinary local builds, which
      # would otherwise leave it untested until a campaign failed on it.
      - name: Run cargo tests
        env:
          # Compare the scheduler's read model with SQLite after every
          # local_disk mutation in the integration tests too (unit tests
          # always do). See docs/state-store.md, "Read model coherence".
          LEGION_READ_MODEL_SHADOW_CHECK: 1
        run: cargo test --all --all-features --locked

  cargo-clippy:
    name: Cargo Clippy
    # Pinned rather than ubuntu-latest: rusqlite's `session` feature runs
    # bindgen against the runner's libclang, and the newer ubuntu-latest
    # image's libclang makes bindgen 0.69 emit empty SQLite structs.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        uses: ./.github/actions/setup-protoc

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo clippy
        run: cargo clippy --all --all-features --locked -- -D warnings -A dead_code -A unused_variables

  # The first-party `aws-asg` scaling plugin is a crate of its own, outside the
  # workspace (docs/autoscaling-plugins.md, "The aws-asg plugin"), so
  # `cargo test --all` does not reach it. Its tests need no AWS: SigV4 against
  # AWS's published examples, recorded responses, and a local mock of the API.
  aws-asg-plugin:
    name: aws-asg Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test and lint
        working-directory: plugins/scaling/aws-asg
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  # Mixed-version managers, workers, and CLIs exchange proto messages during a
  # rolling upgrade (docs/upgrades.md), so a wire-incompatible change to
  # proto/legion.proto must be deliberate. This compares the PR's proto with the
  # base branch's using `buf breaking` and the WIRE rules in proto/buf.yaml.
  # The kernel classifier's programs are checked in as an object
  # (bpf/legion_net.bpf.o) so `cargo build` needs only protoc. This rebuilds
  # it from bpf/legion_net.bpf.c with the pinned clang and fails when the
  # committed object is stale.
  bpf-object:
    name: BPF Object Is Current
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 linux-libc-dev

      - name: Rebuild and compare
        env:
          CLANG: clang-18
        run: bpf/build.sh --check

  # The kernel classifier's tests load the programs into the runner's
  # kernel, attach them to scratch cgroups, and dial from child processes,
  # so they need root. They are `#[ignore]`d in the ordinary run.
  kernel-tests:
    name: Kernel Classifier Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang-18

      - name: Build the tests and the io_uring probe
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo test --lib --locked --no-run
          clang-18 -O2 -o "$RUNNER_TEMP/uring_connect" bpf/tests/uring_connect.c

      - name: Run the root-only kernel tests
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          sudo -E env "PATH=$PATH" LEGION_URING_PROBE="$RUNNER_TEMP/uring_connect" \
            cargo test --lib --locked -- --ignored --test-threads=1 kernel:: capture_kernel

  # For an intentional break, bump PROTOCOL_VERSION and label the PR
  # `proto-breaking-ok` to skip the check.
  proto-breaking:
    name: Proto Breaking Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'proto-breaking-ok') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned release, verified against its published checksum.
      - name: Install buf
        env:
          BUF_VERSION: 1.50.0
          BUF_SHA256: 154ea883ce098eac4fa106ff9ee4e4964bb97f809dd8ec9c34a432b466ce1494
        run: |
          curl -sSL -o "$RUNNER_TEMP/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"

      # Extract the base branch's proto into a plain directory rather than
      # use buf's git input, which needs the base ref cloneable locally.
      - name: Check against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/base-proto"
          git show "$BASE_SHA:proto/legion.proto" > "$RUNNER_TEMP/base-proto/legion.proto"
          "$RUNNER_TEMP/buf" breaking proto --against "$RUNNER_TEMP/base-proto"

  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect UI-impacting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
              # The generated client in ui/src/gen is derived from the proto;
              # a proto change must regenerate it (see the drift check).
              - 'proto/legion.proto'

      - name: Install Node
        if: steps.changes.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install protobuf compiler
        if: steps.changes.outputs.ui == 'true'
        uses: ./.github/actions/setup-protoc

      - name: Install UI dependencies
        if: steps.changes.outputs.ui == 'true'
        working-directory: ui
        run: npm ci

      # The generated ConnectRPC client must match proto/legion.proto. This
      # regenerates it with the pinned protoc-gen-es/-connect-es and fails
      # when the committed files differ, so a field added to the proto
      # cannot be hand-written into the UI (or forgotten) again.
      - name: Check generated client is current
        if: steps.changes.outputs.ui == 'true'
        working-directory: ui
        run: |
          npm run gen
          git diff --stat --exit-code -- src/gen

      - name: Typecheck and build
        if: steps.changes.outputs.ui == 'true'
        working-directory: ui
        run: npm run build

  scheduler-benchmark-gate:
    name: Scheduler Benchmark Gate
    # Pinned rather than ubuntu-latest: rusqlite's `session` feature runs
    # bindgen against the runner's libclang, and the newer ubuntu-latest
    # image's libclang makes bindgen 0.69 emit empty SQLite structs.
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect scheduler-impacting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scheduler:
              - 'src/manager/scheduler.rs'
              - 'src/storage/store.rs'
              - 'src/manager/daemon.rs'
              - 'benchmarks/scheduler/**'
              - 'tests/integration/scheduler_benchmark_slo.rs'
              - 'tests/integration/benchmark_support/**'

      - name: Install Rust toolchain
        if: steps.changes.outputs.scheduler == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        if: steps.changes.outputs.scheduler == 'true'
        uses: ./.github/actions/setup-protoc

      # Reads the Cargo Test job's dependency cache (same profile and
      # dependency set; the `loadgen` feature adds no crates). Never saves.
      - name: Cache cargo dependencies
        if: steps.changes.outputs.scheduler == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-test
          save-if: false

      - name: Run scheduler benchmark SLO gate
        if: steps.changes.outputs.scheduler == 'true'
        run: "cargo test --test integration scheduler_benchmark_slo:: -- --ignored --nocapture"

  aws-benchmark-rig:
    name: AWS Benchmark Rig (validate only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect rig changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rig:
              - 'benchmarks/aws/**'
              # The native submitter the driver invokes. A change there can
              # break the rig without touching benchmarks/aws/.
              - 'benchmarks/loadgen/**'

      # The plan's dry-run gate: a broken driver must never burn
      # cluster-hours. Pure-math fixture tests, no cluster, no AWS.
      - name: Driver + translator fixture tests
        if: steps.changes.outputs.rig == 'true'
        run: python3 -m unittest discover benchmarks/aws/driver/tests -v

      - name: Terraform validate (no apply, no credentials)
        if: steps.changes.outputs.rig == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Run terraform fmt + validate
        if: steps.changes.outputs.rig == 'true'
        run: |
          terraform -chdir=benchmarks/aws/terraform fmt -check -recursive
          terraform -chdir=benchmarks/aws/terraform init -backend=false -input=false
          terraform -chdir=benchmarks/aws/terraform validate

      - name: Shell syntax check
        if: steps.changes.outputs.rig == 'true'
        run: bash -n benchmarks/aws/scripts/*.sh benchmarks/aws/experiments/*.sh
