name: CI

on:
  pull_request:

# Grant the read scopes the workflow needs. `pull-requests: read` is required by
# dorny/paths-filter, which calls the PR "list files" API on pull_request events;
# without it the Scheduler Benchmark Gate fails with
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-test:
    name: Cargo Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # `cargo test --all` links ~29 test binaries, and at full debuginfo the
      # target dir reaches ~23 GiB — more than the ~14 GiB an ubuntu-latest
      # runner has free. The job then dies mid-link with
      # `ld terminated with signal 7 [Bus error]`, or the runner disappears
      # outright (step stuck `in_progress`, logs 404). Dropping debuginfo takes
      # the same tree to ~3.5 GiB and links faster; only backtrace detail is
      # lost, never test behavior. Use `line-tables-only` instead of `0` if
      # file/line in panic backtraces is worth the extra size.
      # --all-features so the `loadgen` feature's bin (benchmarks/loadgen,
      # the AWS rig's native job submitter) is built and its unit tests run.
      # It is feature-gated to keep it out of ordinary local builds, which
      # would otherwise leave it untested until a campaign failed on it.
      - name: Run cargo tests
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          # Compare the scheduler's read model with SQLite after every
          # local_disk mutation in the integration tests too (unit tests
          # always do). See docs/state-store.md, "Read model coherence".
          LEGION_READ_MODEL_SHADOW_CHECK: 1
        run: cargo test --all --all-features --locked

  cargo-clippy:
    name: Cargo Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run cargo clippy
        run: cargo clippy --all --all-features --locked -- -D warnings -A dead_code -A unused_variables

  # Mixed-version managers, workers, and CLIs exchange proto messages during a
  # rolling upgrade (docs/upgrades.md), so a wire-incompatible change to
  # proto/legion.proto must be deliberate. This compares the PR's proto with the
  # base branch's using `buf breaking` and the WIRE rules in proto/buf.yaml.
  # For an intentional break, bump PROTOCOL_VERSION and label the PR
  # `proto-breaking-ok` to skip the check.
  proto-breaking:
    name: Proto Breaking Changes
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'proto-breaking-ok') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned release, verified against its published checksum.
      - name: Install buf
        env:
          BUF_VERSION: 1.50.0
          BUF_SHA256: 154ea883ce098eac4fa106ff9ee4e4964bb97f809dd8ec9c34a432b466ce1494
        run: |
          curl -sSL -o "$RUNNER_TEMP/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"

      # Extract the base branch's proto into a plain directory rather than
      # use buf's git input, which needs the base ref cloneable locally.
      - name: Check against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/base-proto"
          git show "$BASE_SHA:proto/legion.proto" > "$RUNNER_TEMP/base-proto/legion.proto"
          "$RUNNER_TEMP/buf" breaking proto --against "$RUNNER_TEMP/base-proto"

  ui-build:
    name: UI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect UI-impacting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
              # The generated client in ui/src/gen is derived from the proto;
              # a proto change must regenerate it (see the drift check).
              - 'proto/legion.proto'

      - name: Install Node
        if: steps.changes.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install protobuf compiler
        if: steps.changes.outputs.ui == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install UI dependencies
        if: steps.changes.outputs.ui == 'true'
        working-directory: ui
        run: npm ci

      # The generated ConnectRPC client must match proto/legion.proto. This
      # regenerates it with the pinned protoc-gen-es/-connect-es and fails
      # when the committed files differ, so a field added to the proto
      # cannot be hand-written into the UI (or forgotten) again.
      - name: Check generated client is current
        if: steps.changes.outputs.ui == 'true'
        working-directory: ui
        run: |
          npm run gen
          git diff --stat --exit-code -- src/gen

      # The palette CSS is generated from src/appearance/palettes.ts; fail
      # when someone edits one without the other.
      - name: Check generated appearance CSS is current
        if: steps.changes.outputs.ui == 'true'
        working-directory: ui
        run: npm run check:appearance

      - name: Typecheck and build
        if: steps.changes.outputs.ui == 'true'
        working-directory: ui
        run: npm run build

  scheduler-benchmark-gate:
    name: Scheduler Benchmark Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect scheduler-impacting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scheduler:
              - 'src/manager/scheduler.rs'
              - 'src/storage/store.rs'
              - 'src/manager/daemon.rs'
              - 'benchmarks/scheduler/**'
              - 'tests/scheduler_benchmark_slo.rs'
              - 'tests/benchmark_support/**'

      - name: Install Rust toolchain
        if: steps.changes.outputs.scheduler == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        if: steps.changes.outputs.scheduler == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run scheduler benchmark SLO gate
        if: steps.changes.outputs.scheduler == 'true'
        run: cargo test --test scheduler_benchmark_slo -- --ignored --nocapture

  aws-benchmark-rig:
    name: AWS Benchmark Rig (validate only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect rig changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rig:
              - 'benchmarks/aws/**'
              # The native submitter the driver invokes. A change there can
              # break the rig without touching benchmarks/aws/.
              - 'benchmarks/loadgen/**'

      # The plan's dry-run gate: a broken driver must never burn
      # cluster-hours. Pure-math fixture tests, no cluster, no AWS.
      - name: Driver + translator fixture tests
        if: steps.changes.outputs.rig == 'true'
        run: python3 -m unittest discover benchmarks/aws/driver/tests -v

      - name: Terraform validate (no apply, no credentials)
        if: steps.changes.outputs.rig == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Run terraform fmt + validate
        if: steps.changes.outputs.rig == 'true'
        run: |
          terraform -chdir=benchmarks/aws/terraform fmt -check -recursive
          terraform -chdir=benchmarks/aws/terraform init -backend=false -input=false
          terraform -chdir=benchmarks/aws/terraform validate

      - name: Shell syntax check
        if: steps.changes.outputs.rig == 'true'
        run: bash -n benchmarks/aws/scripts/*.sh benchmarks/aws/experiments/*.sh
