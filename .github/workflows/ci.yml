name: CI

on:
  pull_request:

# Grant the read scopes the workflow needs. `pull-requests: read` is required by
# dorny/paths-filter, which calls the PR "list files" API on pull_request events;
# without it the Scheduler Benchmark Gate fails with
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-test:
    name: Cargo Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The full test build links ~30 debug test binaries against a large
      # dependency tree and has hit the runner's disk ceiling — the linker
      # dies with SIGBUS (a write to an mmap'd output page fails once the
      # filesystem is full). Reclaim the multi-GB preinstalled toolchains
      # this job never uses before building.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run cargo tests
        run: cargo test --all --locked

  cargo-clippy:
    name: Cargo Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run cargo clippy
        run: cargo clippy --all --locked -- -D warnings -A dead_code -A unused_variables

  scheduler-benchmark-gate:
    name: Scheduler Benchmark Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect scheduler-impacting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scheduler:
              - 'src/manager/scheduler.rs'
              - 'src/storage/store.rs'
              - 'src/manager/daemon.rs'
              - 'benchmarks/scheduler/**'
              - 'tests/scheduler_benchmark_slo.rs'

      - name: Install Rust toolchain
        if: steps.changes.outputs.scheduler == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        if: steps.changes.outputs.scheduler == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run scheduler benchmark SLO gate
        if: steps.changes.outputs.scheduler == 'true'
        run: cargo test --test scheduler_benchmark_slo -- --ignored --nocapture
