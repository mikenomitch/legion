[package]
name = "legion-netplugin-conformance"
version = "0.1.0"
edition = "2021"
publish = false

# Built on its own for wasm32-wasip1 (`tests/netplugins/build.sh`), never as
# part of the Legion workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
proxy-wasm = "=0.2.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
