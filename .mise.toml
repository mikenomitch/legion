[env]
LEGION_ADDR = "http://127.0.0.1:4748"

[tasks.boot]
run = """
set -euo pipefail
trap 'kill 0' EXIT

cargo run -- start manager -c configs/manager.jsonnet &
(cd ui && npm run dev) &
wait
"""

[tasks.join]
run = "LEGION_ADDR=http://127.0.0.1:4748 cargo run -- join -a"

[tasks.job]
run = "cargo run -- job run {{arg path}}"

[tasks.job.args]
path = { required = true, completion = { type = "file", path = "configs/jobs" } }

[tasks.nuke]
run = "rm -rf .legion"
